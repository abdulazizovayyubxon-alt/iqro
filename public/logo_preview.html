    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; padding: 32px; background: #F4F3EF; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 32px; color: #0F1B2D; letter-spacing: -0.02em; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

    /* 1. Light (Kunduzgi) */
    .card { border-radius: 20px; padding: 40px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .card-label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }

    .light { background: #FDFCF9; box-shadow: 0 4px 20px rgba(14,151,224,0.08); border: 1px solid rgba(86,110,130,0.12); }
    .light svg .stroke { stroke: #0F1B2D; }
    .light svg .accent { stroke: #0E97E0; }
    .light svg .accent-fill { fill: #0E97E0; }
    .light svg .dot-outer { fill: #0F1B2D; }
    .light .card-label { color: #0F1B2D; }

    .morning { background: #F5EEDD; box-shadow: 0 4px 20px rgba(46,127,176,0.08); border: 1px solid rgba(139,108,57,0.16); }
    .morning svg .stroke { stroke: #3B2F1B; }
    .morning svg .accent { stroke: #2E7FB0; }
    .morning svg .accent-fill { fill: #2E7FB0; }
    .morning svg .dot-outer { fill: #3B2F1B; }
    .morning .card-label { color: #3B2F1B; }

    .night { background: #070B16; box-shadow: 0 4px 30px rgba(54,171,236,0.15); border: 1px solid rgba(255,255,255,0.08); }
    .night svg .stroke { stroke: #F0F6FF; }
    .night svg .accent { stroke: #36ABEC; }
    .night svg .accent-fill { fill: #36ABEC; }
    .night svg .dot-outer { fill: #F0F6FF; }
    .night .card-label { color: #94A3B8; }

    /* Splash preview */
    .splash { background: #0E97E0; border-radius: 20px; padding: 40px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 20px; }
    .splash-label { font-size: 11px; font-weight: 700; letter-spacing: 0.26em; color: rgba(255,255,255,0.7); text-transform: uppercase; }
  </style>
</head>
