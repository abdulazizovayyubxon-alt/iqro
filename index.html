<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#F4F3EF" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Zehin — Malaka toifa testlari</title>
    <meta name="description" content="O'qituvchilar va ta'lim xodimlarini malaka toifa (attestatsiya) imtihonlariga tayyorlaydigan platforma: 40 000+ savol, imtihon rejimi, xatolar tahlili." />
    <!-- og:image mutlaq URL talab qiladi — domen ko'chsa (Vercel) shu yerni yangilang -->
    <meta property="og:title" content="Zehin — Malaka toifa testlari" />
    <meta property="og:description" content="O'qituvchilarni attestatsiyaga tayyorlaydi: 40 000+ savol, imtihon rejimi, statistika." />
    <meta property="og:image" content="https://zehin-t41p.vercel.app/pwa-512x512.png" />

    <!-- Shrift lokal (public/fonts): splash birinchi bo'yoqdan PJS bilan chiqishi
         uchun shu yerda preload + @font-face; src/index.css AYNI URL'ni ishlatadi,
         shuning uchun fayl faqat bir marta yuklanadi. -->
    <link rel="preload" href="/fonts/pjs-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/pjs-variable-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* ── Zehin splash (React mount bo'lganda #root bilan birga almashtiriladi) ──
         Brend-kitob §8 (jami 900ms, bir marta): belgi scale 0.6→1.0 + fade,
         easeOutBack, 0–350ms → yozuv harflari pastdan 12px, ketma-ket
         (stagger 40ms), easeOutCubic, 250–600ms → tagline fade, linear,
         600–900ms. Fon — to'q navy #0A2440 (§5), gradient YO'Q (§12). */
      .zh-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0A2440;
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      /* Belgi — oq varaq-doira to'g'ridan-to'g'ri navy fonda (kitob §7 splash) */
      .zh-splash-mark {
        display: block;
        width: 104px;
        height: 104px;
        animation: zh-mark-in 350ms cubic-bezier(0.34, 1.56, 0.64, 1) both; /* easeOutBack */
      }
      .zh-splash-word {
        margin-top: 30px;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }
      /* Har bir harf alohida ko'tariladi (stagger 40ms, delay inline'da) */
      .zh-l {
        display: inline-block;
        animation: zh-letter-in 190ms cubic-bezier(0.33, 1, 0.68, 1) both; /* easeOutCubic */
      }
      /* "i" nuqtasi belgi bilan almashtiriladi: dotsiz "ı" + belgi (navy fonda:
         doira oq, buklama #05A3FA; 32px dan kichik — lip yo'q) */
      .zh-splash-word .zh-i { position: relative; }
      /* nuqta-belgi: ustun ustida ~0.05em bo'shliq (brauzerda o'lchab sozlangan —
         README'dagi -0.58em boshqa koordinata tizimiga nisbatan edi) */
      .zh-splash-word .zh-i svg {
        position: absolute;
        width: 0.34em;
        height: 0.34em;
        left: 50%;
        top: 0.11em;
        transform: translateX(-50%);
      }
      .zh-splash-tag {
        margin: 16px 0 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #5E7FA3;
        animation: zh-tag-in 300ms linear 600ms both;
      }
      @keyframes zh-mark-in {
        from { opacity: 0; transform: scale(0.6); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes zh-letter-in {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes zh-tag-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .zh-splash-mark, .zh-l, .zh-splash-tag { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- JS yuklanguncha oq ekran o'rniga splash (React mount bo'lganda almashtiriladi) -->
      <div class="zh-splash">
        <!-- Belgi, navy fonda: doira #fff, buklama #05A3FA + lip #6FC5FB (104px ≥ 32px) -->
        <svg class="zh-splash-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#fff"/>
          <g transform="rotate(45 24 24)">
            <path d="M45 24 A21 21 0 0 1 24 45 Q41.06 38.44 37.78 27.28 Q37.13 24 45 24 Z" fill="#05A3FA"/>
            <path d="M45 24 Q37.13 24 37.78 27.28 Q39.75 35.81 29.91 42.38 Q42.38 35.81 45 24 Z" fill="#6FC5FB"/>
          </g>
        </svg>
        <div class="zh-splash-word" aria-label="Zehin"><span class="zh-l" style="animation-delay:250ms">Z</span><span class="zh-l" style="animation-delay:290ms">e</span><span class="zh-l" style="animation-delay:330ms">h</span><span class="zh-l" style="animation-delay:370ms"><span class="zh-i">&#305;<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff"/><g transform="rotate(45 24 24)"><path d="M45 24 A21 21 0 0 1 24 45 Q41.06 38.44 37.78 27.28 Q37.13 24 45 24 Z" fill="#05A3FA"/></g></svg></span></span><span class="zh-l" style="animation-delay:410ms">n</span></div>
        <p class="zh-splash-tag">Attestatsiya platformasi</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
