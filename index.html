    <!-- BOSHLANG'ICH qiymat — splash foni (navy), tema rangi EMAS: birinchi
         bo'yoqda doim navy splash chiqadi, status-bar ham unga qo'shilib ketsin
         (aks holda tepada och tasma qolib, ilova ekranga to'liq ochilmagandek
         ko'rinadi). Splash yopilganda src/utils/statusBar.js tema rangini
         qaytaradi. Manifest theme_color ham shu sababdan navy (vite.config.js). -->
    <meta name="theme-color" content="#0A2440" />

    <!-- Shrift o'lchami (S/M/L/XL) React yuklanishidan OLDIN qo'llanadi — aks holda
         matn avval M holda chizilib, keyin tanlangan o'lchamga "sakrardi" (flash).
         Bu YAGONA boshlang'ich manba; runtime o'zgarishini SettingsPage boshqaradi.
         Faqat --fs-scale beriladi: ildizdagi font-size: calc(clamp(...) * var(--fs-scale))
         (src/index.css) uni o'zi hisoblaydi. To'g'ridan-to'g'ri style.fontSize berilsa,
         inline uslub calc()ni bosib ketib, ekranga moslashuvchi clamp() o'chib qolardi. -->
    <script>
      (function () {
        try {
          var s = parseFloat(localStorage.getItem('iqro-font-scale'));
          if (s && s >= 0.8 && s <= 1.5) {
            document.documentElement.style.setProperty('--fs-scale', String(s));
          }
        } catch (e) { /* localStorage bloklangan bo'lishi mumkin */ }
      })();
    </script>

    <!-- Shrift lokal (public/fonts): splash birinchi bo'yoqdan PJS bilan chiqishi
         uchun shu yerda preload + @font-face; src/index.css AYNI URL'ni ishlatadi,
         shuning uchun fayl faqat bir marta yuklanadi. -->
    <link rel="preload" href="/fonts/pjs-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/pjs-variable-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* ── Zehin splash (React mount bo'lganda #root bilan birga almashtiriladi) ──
         Brend-kitob §8 (jami 900ms, bir marta): belgi scale 0.6→1.0 + fade,
         easeOutBack, 0–350ms → yozuv harflari pastdan 12px, ketma-ket
         (stagger 40ms), easeOutCubic, 250–600ms → tagline fade, linear,
         600–900ms. Fon — to'q navy #0A2440 (§5), gradient YO'Q (§12). */
      /* Splash turgan paytda hujjat foni ham navy — status-bar/overscroll
         sohalari uchun. iOS standalone'da status-bar meta'ni emas, aynan
         sahifa fonini oladi. Klassni src/utils/statusBar.js qo'yadi/oladi;
         qoida shu yerda, chunki index.css birinchi bo'yoqdan keyin ulanadi. */
      html.splash-active,
      html.splash-active body {
        background: #0A2440;
      }
      .zh-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0A2440;
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      /* Belgi — oq varaq-doira to'g'ridan-to'g'ri navy fonda (kitob §7 splash) */
      .zh-splash-mark {
        display: block;
        width: 104px;
        height: 104px;
        animation: zh-mark-in 350ms cubic-bezier(0.34, 1.56, 0.64, 1) both; /* easeOutBack */
      }
      .zh-splash-word {
        margin-top: 30px;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }
      /* Har bir harf alohida ko'tariladi (stagger 40ms, delay inline'da) */
      .zh-l {
        display: inline-block;
        animation: zh-letter-in 190ms cubic-bezier(0.33, 1, 0.68, 1) both; /* easeOutCubic */
      }
      /* "i" nuqtasi belgi bilan almashtiriladi: dotsiz "ı" + belgi (navy fonda:
         doira oq, buklama #05A3FA; 32px dan kichik — lip yo'q) */
      .zh-splash-word .zh-i { position: relative; }
      /* nuqta-belgi: ustun ustida ~0.05em bo'shliq (brauzerda o'lchab sozlangan —
         README'dagi -0.58em boshqa koordinata tizimiga nisbatan edi) */
      .zh-splash-word .zh-i svg {
        position: absolute;
        width: 0.34em;
        height: 0.34em;
        left: 50%;
        top: 0.11em;
        transform: translateX(-50%);
      }
      .zh-splash-tag {
        margin: 16px 0 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #5E7FA3;
        animation: zh-tag-in 300ms linear 600ms both;
      }
      @keyframes zh-mark-in {
        from { opacity: 0; transform: scale(0.6); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes zh-letter-in {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes zh-tag-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .zh-splash-mark, .zh-l, .zh-splash-tag { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- JS yuklanguncha oq ekran o'rniga splash (React mount bo'lganda almashtiriladi) -->
      <div class="zh-splash">
        <!-- Belgi, navy fonda: doira #fff, buklama #05A3FA + lip #6FC5FB (104px ≥ 32px) -->
        <svg class="zh-splash-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#fff"/>
          <g transform="rotate(45 24 24)">
            <path d="M45 24 A21 21 0 0 1 24 45 Q41.06 38.44 37.78 27.28 Q37.13 24 45 24 Z" fill="#05A3FA"/>
            <path d="M45 24 Q37.13 24 37.78 27.28 Q39.75 35.81 29.91 42.38 Q42.38 35.81 45 24 Z" fill="#6FC5FB"/>
          </g>
        </svg>
        <div class="zh-splash-word" aria-label="Zehin"><span class="zh-l" style="animation-delay:250ms">Z</span><span class="zh-l" style="animation-delay:290ms">e</span><span class="zh-l" style="animation-delay:330ms">h</span><span class="zh-l" style="animation-delay:370ms"><span class="zh-i">&#305;<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff"/><g transform="rotate(45 24 24)"><path d="M45 24 A21 21 0 0 1 24 45 Q41.06 38.44 37.78 27.28 Q37.13 24 45 24 Z" fill="#05A3FA"/></g></svg></span></span><span class="zh-l" style="animation-delay:410ms">n</span></div>
        <p class="zh-splash-tag">Attestatsiya platformasi</p>
      </div>
    </div>
    <!-- Tema (light/sepia/dark) React yuklanishidan OLDIN body'ga qo'llanadi —
         aks holda kontent avval light holda chizilib, keyin dark/sepia'ga
         "sakrardi" (flash). body shu nuqtada mavjud (skript <body> oxirida) va
         bu main.jsx'dan oldin ishlaydi. Splash navy fonli (temadan mustaqil),
         shuning uchun ko'rinishi o'zgarmaydi. Runtime almashinuv — App.jsx
         toggleTheme'da; eski 'chqbt-theme' kaliti moslik uchun o'qiladi. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('iqro-theme') || localStorage.getItem('chqbt-theme');
          if (t === 'dark') document.body.classList.add('dark-theme');
          else if (t === 'sepia') document.body.classList.add('sepia-theme');
          // Status-bar rangi bu yerda tema foniga QAYTARILMAYDI: hozir ekranda
          // navy splash turibdi, meta ham navy (yuqorida). Splash yopilganda
          // src/utils/statusBar.js exitSplash() tema rangini tiklaydi.
          document.documentElement.classList.add('splash-active');
        } catch (e) { /* localStorage bloklangan bo'lishi mumkin */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- ── BOOT QO'RIQCHISI ──────────────────────────────────────────────────
         MUAMMO (2026-08-29, jonli): Vercel har deployda oldingi paket
         fayllarini O'CHIRADI — `/assets/index-BGUklAEX.js` qattiq 404 qaytaradi
         (tekshirilgan, HTML fallback ham emas). Agar qurilmada ESKI
         `index.html` qolib ketsa (service worker keshidan yoki HTTP keshdan),
         u endi mavjud bo'lmagan JS ga murojaat qiladi → modul UMUMAN
         bajarilmaydi → yuqoridagi `.zh-splash` abadiy ekranda qoladi.
         Foydalanuvchi uchun bu "ilova qotib qoldi": na xato, na tugma.
         Jurnalda ham iz yo'q — `services/sentry.js` bundle ICHIDA, u ham
         ishga tushmaydi.

         YECHIM: React mount bo'lganini `window.__ZEHIN_BOOTED__` bildiradi
         (main.jsx qo'yadi). Bayroq kelmasa — service worker'ni ro'yxatdan
         chiqarib, keshlarni tozalab, BIR MARTA qayta yuklaymiz.
         · "Bir marta" — sessionStorage qulfi bilan. Aks holda haqiqatan
           buzuq paket cheksiz reload aylanasiga aylanardi.
         · OFLAYN bo'lsa kesh O'CHIRILMAYDI: bu ilova oflayn ishlatiladi,
           keshni tozalash yagona nusxani yo'q qilib, ahvolni YOMONLASHTIRARDI.
         Ikkinchi urinish ham natija bermasa — ekranda haqiqiy xabar va tugma.

         Skript ATAYLAB oddiy ES5 va bundle'dan TASHQARIDA: u aynan bundle
         yuklanmagan holat uchun bor. -->
    <script>
      (function () {
        var REPAIR_KEY = 'zehin-boot-repair';
        var SLOW_MS = 20000;  // sekin tarmoq uchun saxiy (paket ~350KB gzip)
        var FAIL_MS = 2500;   // resurs 404 aniq bo'lsa uzoq kutish shart emas
        var done = false;

        function booted() { return window.__ZEHIN_BOOTED__ === true; }
        function tried() {
          try { return sessionStorage.getItem(REPAIR_KEY) === '1'; } catch (e) { return false; }
        }
        function setTried(v) {
          try {
            if (v) sessionStorage.setItem(REPAIR_KEY, '1');
            else sessionStorage.removeItem(REPAIR_KEY);
          } catch (e) { /* storage bloklangan — qulfsiz davom etamiz */ }
        }

        // Jurnal: bundle ishga tushmagani uchun sentry.js bu yerga yeta olmaydi
        function report(reason) {
          try {
            if (!navigator.sendBeacon) return;
            var body = JSON.stringify({
              message: 'BOOT FAILED: ' + reason,
              url: location.href,
              userAgent: navigator.userAgent,
              severity: 'error',
              context: { retried: tried(), online: navigator.onLine }
            });
            navigator.sendBeacon('/api/log-error', new Blob([body], { type: 'application/json' }));
          } catch (e) { /* kuzatuv HECH QACHON ilovani buzmasligi kerak */ }
        }

        function showDeadEnd(offline) {
          var root = document.getElementById('root');
          if (!root) return;
          var text = offline
            ? 'Internet aloqasi yo\u2019q va ilovaning saqlangan nusxasi ochilmadi. Tarmoqqa ulanib, qayta urinib ko\u2019ring.'
            : 'Eski versiya qurilmada qolib ketgan va tozalash yordam bermadi. Qayta urinib ko\u2019ring.';
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;gap:18px;padding:24px;background:#0A2440;color:#fff;text-align:center;' +
            'font-family:\'Plus Jakarta Sans\',system-ui,sans-serif">' +
            '<div style="font-size:17px;font-weight:700">Ilova ochilmadi</div>' +
            '<div style="font-size:14px;line-height:1.5;color:#9FB6CE;max-width:320px">' + text + '</div>' +
            '<button id="zh-boot-retry" style="border:none;border-radius:10px;padding:12px 22px;' +
            'background:#05A3FA;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">' +
            'Qayta urinish</button></div>';
          var btn = document.getElementById('zh-boot-retry');
          if (btn) btn.onclick = function () { setTried(false); done = false; repair('qayta urinish'); };
        }

        function reload() {
          try {
            var u = new URL(location.href);
            u.searchParams.set('_fresh', String(Date.now()));
            location.replace(u.toString());
          } catch (e) {
            location.reload();
          }
        }

        function repair(reason) {
          if (done) return;
          done = true;
          report(reason);

          // Oflayn: keshda ilovaning YAGONA nusxasi turibdi — unga tegmaymiz
          if (navigator.onLine === false) { showDeadEnd(true); return; }
          if (tried()) { showDeadEnd(false); return; }
          setTried(true);

          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) { /* tozalash imkonsiz — baribir qayta yuklaymiz */ }

          setTimeout(reload, 4000); // tozalash osilib qolsa ham qutulamiz
          Promise.all(jobs).then(reload, reload);
        }

        // (a) Paket fayli yuklanmadi (404/tarmoq). Resurs xatolari ko'pikka
        //     chiqmaydi — faqat capture bosqichida ushlanadi.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || t === window) return;
          var src = t.src || t.href || '';
          if (src.indexOf('/assets/') === -1 && src.indexOf('/src/main') === -1) return;
          setTimeout(function () { if (!booted()) repair('resurs yuklanmadi: ' + src); }, FAIL_MS);
        }, true);

        // (b) Xatosiz, lekin jimgina qotib qolgan holat
        function watchdog() {
          if (booted() || done) return;
          // Fondagi tab throttle qilinadi — bu sekinlik, nosozlik emas
          if (document.hidden) { setTimeout(watchdog, SLOW_MS); return; }
          repair('vaqt tugadi (' + SLOW_MS + 'ms)');
        }
        setTimeout(watchdog, SLOW_MS);
      })();
    </script>
