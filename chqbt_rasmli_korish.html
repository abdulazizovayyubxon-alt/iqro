c":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":17,"subtopic":"Son arteriyasini bosish (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Jangchining sonidan och qizil rangli qon otilib chiqmoqda. Qon ketishini vaqtincha to'xtatish uchun rasmdagi qaysi raqamli nuqta bosiladi?","options":{"A":"5-raqamli nuqta","B":"9-raqamli nuqta","C":"8-raqamli nuqta","D":"7-raqamli nuqta"},"answer":"C","explanation":"Och qizil rangda otilib chiqayotgan qon — arterial qon ketish belgisi. Sondan qon ketganda 8-raqamli nuqtada son arteriyasi suyakka bosiladi. Bosish nuqtasi har doim jarohatdan YUQORIDA (yurakka yaqin tomonda) tanlanadi — 9-nuqta (boldir) jarohatdan pastda qoladi.","mnemonic":"Arteriya jarohatdan yuqorida bosiladi.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":18,"subtopic":"Yelka arteriyasini bosish nuqtasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Yelkaning pastki uchdan biri, chig'anoq (bilak) va barmoqlar jarohatlanib qon oqayotganida yelka arteriyasi ichki tomondan yelka suyagiga qattiq bosiladi (eziladi). Bu nuqta rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"4-raqam","B":"5-raqam","C":"6-raqam","D":"7-raqam"},"answer":"B","explanation":"Yelka arteriyasi yelkaning ichki yuzasida, ikki boshli mushak qirrasi bo'ylab o'tadi va 5-raqamli nuqtada yelka suyagiga bosiladi — bu qo'lning pastki qismidagi (bilak, barmoqlar) qon ketishini to'xtatadi. 6 va 7-raqamlar bilak sohasidagi quyiroq nuqtalar, ular faqat kaft-barmoq jarohatlarida ishlatiladi.","mnemonic":"Qo'l jarohati — yelka ichidan suyakka bos (5).","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":19,"subtopic":"Boldir tomirlarini bosish nuqtasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Boldirning pastki qismi va oyoq panjasi jarohatlanib qon oqayotganda boldir sohasidagi arteriya bosiladi. Bu nuqta rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"6-raqam","B":"7-raqam","C":"8-raqam","D":"9-raqam"},"answer":"D","explanation":"Boldir sohasidagi bosish nuqtasi rasmda 9-raqamda — boldirning pastki qismi va oyoq panjasidan qon ketganda shu yerda bosiladi. 8-raqam esa son arteriyasi bo'lib, sonning o'zi jarohatlanganda qo'llanadi; bosish nuqtasi doim jarohatdan yuqorida tanlanadi.","mnemonic":"Panja-boldir — 9-nuqta, son — 8-nuqta.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":20,"subtopic":"O'mrov osti arteriyasini bosish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Yelka bo'g'imi va yelkaning yuqori qismi jarohatlanib kuchli qon oqayotganida o'mrov osti arteriyasi o'mrov suyagi orqasidagi birinchi qovurg'aga bosiladi. Bu nuqta rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"3-raqam","B":"2-raqam","C":"4-raqam","D":"5-raqam"},"answer":"A","explanation":"O'mrov osti arteriyasi bo'yin asosida, o'mrov suyagi sohasidagi 3-raqamli nuqtada bosiladi — bu butun qo'lga boradigan qonni to'xtatadi. 2 — uyqu arteriyasi (bo'yinda), 4 — qo'ltiq osti, 5 — yelka arteriyasi.","mnemonic":"O'mrov suyagi orti — 3-nuqta.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":21,"subtopic":"Qo'ltiq osti arteriyasini bosish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Yelkaning yuqori uchdan bir qismi jarohatlanib qon oqayotganida qo'ltiq osti arteriyasi qo'ltiq chuqurchasida yelka suyagining boshchasiga bosiladi. Bu nuqta rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"5-raqam","B":"3-raqam","C":"4-raqam","D":"6-raqam"},"answer":"C","explanation":"Qo'ltiq osti arteriyasi rasmda ko'tarilgan qo'lning qo'ltiq chuqurchasidagi 4-raqamli nuqtada bosiladi. Yelkaning pastki qismi jarohatlarida esa quyiroqdagi 5-nuqta (yelka arteriyasi) ishlatiladi — nuqta doim jarohatdan yuqorida tanlanadi.","mnemonic":"Qo'ltiq chuqurchasi — 4-nuqta.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":22,"subtopic":"Qo'l arteriyalarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Rasmdagi raqamlar va bosish nuqtalarining TO'G'RI mosligini tanlang.","options":{"A":"3 – qo'ltiq osti arteriyasi, 4 – o'mrov osti arteriyasi, 6 – yelka arteriyasi","B":"3 – o'mrov osti arteriyasi, 4 – qo'ltiq osti arteriyasi, 6 – bilak arteriyasi","C":"3 – uyqu arteriyasi, 4 – yelka arteriyasi, 6 – son arteriyasi","D":"3 – yelka arteriyasi, 4 – bilak arteriyasi, 6 – o'mrov osti arteriyasi"},"answer":"B","explanation":"To'g'ri moslik: 3 — o'mrov osti arteriyasi (o'mrov suyagi sohasida), 4 — qo'ltiq osti arteriyasi (qo'ltiq chuqurchasida), 6 — bilak arteriyasi (bilakning yuqori qismida). Uyqu arteriyasi — 2, yelka arteriyasi — 5, son arteriyasi — 8-raqamda.","mnemonic":"3-o'mrov, 4-qo'ltiq, 5-yelka, 6-bilak.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":23,"subtopic":"Kaft jarohatida bosish nuqtasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Kaft (panja) jarohatlanib qon oqayotganida bilak arteriyasi bilakning pastki qismida, kaft usti (bilaguzuk taqiladigan) sohada suyakka bosiladi. Bu nuqta rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"6-raqam","B":"5-raqam","C":"8-raqam","D":"7-raqam"},"answer":"D","explanation":"Kaft usti (bilaguzuk) sohasidagi nuqta rasmda 7-raqamda — kaft va barmoq jarohatlarida shu yerda bosiladi. 6-raqam bilakning yuqori qismidagi nuqta bo'lib, bilakning o'zi jarohatlanganda qo'llanadi: bosish nuqtasi doim jarohatdan yuqorida bo'ladi.","mnemonic":"Kaft jarohati — bilaguzuk joyi (7).","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"}];
let fcat="hammasi", shown=0; const PAGE=15;
const list=document.getElementById("list");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cats=["hammasi",...[...new Set(DATA.map(q=>q._cat))]];
function fdata(){return fcat==="hammasi"?DATA:DATA.filter(q=>q._cat===fcat);}
function render(reset){ if(reset){list.innerHTML="";shown=0;}
 const d=fdata(); const slice=d.slice(shown,shown+PAGE); shown+=slice.length;
 for(const q of slice){ const c=document.createElement("div"); c.className="card";
  let opts=""; for(const k of ["A","B","C","D"]) opts+='<div class="opt '+(k===q.answer?"ok":"")+'">'+k+") "+esc(q.options[k])+"</div>";
  c.innerHTML='<span class="idtag">'+esc(q._cat)+' #'+q.id+'</span>'
   +'<div class="src">📖 '+esc(q.source||"")+(q.subtopic?" · "+esc(q.subtopic):"")+"</div>"
   +'<div class="imgwrap"><img src="'+esc(q._img)+'" alt="rasm" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'"><span class="noimg" style="display:none">⚠ Rasm topilmadi: '+esc(q._img)+' (HTMLни loyiha ildizidan oching)</span></div>'
   +'<div><span class="tag '+(["matching","sequence"].includes(q.qtype)?"m":"")+'">'+esc(q.qtype)+'</span><span class="tag">'+esc(q.difficulty||"")+'</span><span class="tag">'+esc(q.cognitive||"")+"</span></div>"
   +'<div class="q">'+esc(q.question)+"</div>"+opts
   +'<div class="exp">💡 '+esc(q.explanation||"")+"</div>"
   +(q.mnemonic?'<div class="mn">🧠 '+esc(q.mnemonic)+"</div>":"");
  list.appendChild(c);}
 document.getElementById("more").style.display = shown>=d.length?"none":"block";
 document.getElementById("meta").textContent="Jami: "+DATA.length+" ta rasmli savol | Ko'rsatilmoqda: "+shown+" / "+d.length;
}
const flt=document.getElementById("flt");
cats.forEach((t,i)=>{const b=document.createElement("button");
 b.textContent=t+" ("+(t==="hammasi"?DATA.length:DATA.filter(q=>q._cat===t).length)+")";if(i===0)b.className="act";
 b.onclick=()=>{document.querySelectorAll("#flt button").forEach(x=>x.classList.remove("act"));b.classList.add("act");fcat=t;render(true);};flt.appendChild(b);});
document.getElementById("more").onclick=()=>render(false);
render(true);
</script></body></html>
