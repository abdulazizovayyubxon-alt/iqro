<script>
const DATA=[{"id":1,"subtopic":"Panohgoh rejasi: inshoot turi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Rasmda xonalari raqamlab ko'rsatilgan yerosti inshooti tasvirlangan. Bu qanday inshoot?","options":{"A":"Radiatsiyadan yashirinish joyi (RYAJ)","B":"Fuqaro muhofazasi panohgohi","C":"Ochiq tipdagi yoriq-xandaq","D":"Harbiy qo'mondonlik punkti"},"answer":"B","explanation":"Rasmda fuqaro muhofazasi panohgohining rejasi: germetik eshik, shlyuz kameralari, filtr-ventilyatsiya kamerasi, dizel elektrostansiyasi kabi qismlar to'liq himoyali panohgohga xos. RYAJ esa odatda yerto'la yoki moslashtirilgan inshoot bo'lib, bunday murakkab tizimlarga ega emas; yoriq-xandaq ochiq inshoot.","mnemonic":"Germetik eshik + FVK = panohgoh.","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":2,"subtopic":"Panohgoh: germetik eshik (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Panohgoh ichiga zaharlangan havo kirmasligini ta'minlaydigan germetik eshik rasmda qaysi raqam bilan belgilangan?","options":{"A":"1-raqam","B":"4-raqam","C":"6-raqam","D":"9-raqam"},"answer":"A","explanation":"Germetik eshik — 1-raqam, kirish qismida joylashgan. 2 — shlyuz kameralari, 4 — insonlar joylashadigan asosiy xona, 6 — filtr-ventilyatsiya kamerasi, 9 — dizel elektrostansiyasi.","mnemonic":"Kirishdagi birinchi to'siq — germetik eshik (1).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":3,"subtopic":"Panohgoh: FVK (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Panohgohga toza havo yetkazib beradigan filtr-ventilyatsiya kamerasi rasmda qaysi raqamda ko'rsatilgan?","options":{"A":"3-raqam","B":"8-raqam","C":"6-raqam","D":"2-raqam"},"answer":"C","explanation":"Filtr-ventilyatsiya kamerasi — 6-raqam. U tashqaridagi zararlangan havoni filtrlardan o'tkazib, tozalangan holda ichkariga uzatadi. 3 — sanitar bo'lim, 8 — yukxona, 2 — shlyuz kameralari.","mnemonic":"Panohgoh \"o'pkasi\" — FVK (6).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":4,"subtopic":"Panohgoh: dizel elektrostansiyasi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Shahar elektr tarmog'i ishdan chiqdi. Panohgohni tok bilan ta'minlash uchun rasmdagi qaysi raqamli xona ishga tushiriladi?","options":{"A":"7-raqamli xona","B":"3-raqamli xona","C":"5-raqamli xona","D":"9-raqamli xona"},"answer":"D","explanation":"9-raqam — dizel elektrostansiyasi: tashqi elektr ta'minoti uzilganda panohgohni avtonom tok bilan ta'minlaydi. 7 — tibbiyot xonasi, 5 — avariya holati uchun chiqish joyi, 3 — sanitar bo'lim.","mnemonic":"Tok o'chsa — dizel (9) yoqiladi.","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":5,"subtopic":"GP-7 tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_gp7_qismlar.png","question":"Rasmda qismlari raqamlangan himoya vositasi tasvirlangan. Bu qaysi vosita?","options":{"A":"R-2 respiratori","B":"IP-4 izolatsiyalovchi gazniqobi","C":"PDF-Sh bolalar gazniqobi","D":"GP-7 filtrlovchi gazniqobi"},"answer":"D","explanation":"Bu GP-7 — fuqarolar uchun filtrlovchi gazniqob. Umumiy og'irligi 0,9 kg dan oshmaydi, filtr qutisi 0,25 kg. Nafas a'zolari, yuz va ko'zni zaharli moddalardan himoya qiladi.","mnemonic":"Fuqaro gazniqobi — GP-7.","source":"10-sinf, 81-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gp7_qismlar.png"},{"id":6,"subtopic":"GP-7: filtr quti (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_gp7_qismlar.png","question":"GP-7 gazniqobida zaharlangan havoni tozalab beradigan filtr quti rasmda qaysi raqam bilan ko'rsatilgan?","options":{"A":"1-raqam","B":"2-raqam","C":"5-raqam","D":"6-raqam"},"answer":"B","explanation":"Filtr quti — 2-raqam (yon tomondagi silindrsimon quti). Havo shu qutidagi filtrdan o'tib tozalanadi. 1 — yuz qismi, 5 — so'zlashish moslamasi, 6 — nafas chiqarish klapani uzeli.","mnemonic":"Yonidagi dumaloq quti — filtr (2).","source":"10-sinf, 81-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gp7_qismlar.png"},{"id":7,"subtopic":"GP-7: so'zlashish moslamasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_gp7_qismlar.png","question":"Gazniqob kiygan holda gaplashish imkonini beruvchi qism rasmda qaysi raqamda?","options":{"A":"4-raqam","B":"6-raqam","C":"5-raqam","D":"3-raqam"},"answer":"C","explanation":"So'zlashish moslamasi — 5-raqam (markazdagi teshikchali dumaloq membrana). U ovozni o'tkazadi. 4 — nafas olish klapani uzeli, 6 — nafas chiqarish klapani uzeli, 3 — filtr qutining matoli g'ilofi.","mnemonic":"Teshikli doira = gapirish joyi (5).","source":"10-sinf, 81-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gp7_qismlar.png"},{"id":8,"subtopic":"GP-7: nafas chiqarish klapani (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_gp7_qismlar.png","question":"Chiqarilgan nafas tashqariga chiqib ketadigan klapan uzeli rasmda qaysi raqam bilan belgilangan?","options":{"A":"6-raqam","B":"2-raqam","C":"1-raqam","D":"5-raqam"},"answer":"A","explanation":"Nafas chiqarish klapani uzeli — 6-raqam (niqobning pastki qismida). Nafas olish esa 4-raqamli klapan uzeli orqali, filtr qutidan o'tgan toza havo bilan amalga oshadi.","mnemonic":"Pastdagi uzel — nafas chiqarish (6).","source":"10-sinf, 81-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gp7_qismlar.png"},{"id":9,"subtopic":"L-1 tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_l1_qismlar.png","question":"Rasmda qismlari raqamlangan rezina-matoli himoya kiyimi ko'rsatilgan. Bu qaysi vosita?","options":{"A":"Umumqo'shin himoya to'plami (UHT/OZK)","B":"L-1 yengil himoya kostyumi","C":"Kimyoviy razvedka kostyumi","D":"O't o'chiruvchi kostyumi"},"answer":"B","explanation":"Bu L-1 yengil himoya kostyumi: 1 — kamzul, 2 — paypoqlari bilan shim, 3 — shlemosti qalpoq, 4 — ikki barmoqli qo'lqoplar, 5 — kostyum solinadigan xalta. Bo'yi bo'yicha 3 o'lchamda ishlab chiqariladi.","mnemonic":"Yengil kostyum — L-1 (L = yengil).","source":"10-sinf, 87-bet, 3-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_l1_qismlar.png"},{"id":10,"subtopic":"L-1 qismlari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_l1_qismlar.png","question":"L-1 kostyumi rasmida 4-raqam bilan qaysi qism ko'rsatilgan?","options":{"A":"Shlemosti qalpoq","B":"Kostyum solinadigan xalta","C":"Paypoqli shim","D":"Ikki barmoqli qo'lqoplar"},"answer":"D","explanation":"4-raqam — ikki barmoqli qo'lqoplar. 1 — kamzul, 2 — paypoqlari bilan shim, 3 — shlemosti qalpoq, 5 — kostyum solinadigan xalta.","mnemonic":"L-1 da qo'lqop ikki barmoqli (4).","source":"10-sinf, 87-bet, 3-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_l1_qismlar.png"},{"id":11,"subtopic":"OZK tarkibi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ozk.png","question":"Rasmda terini himoyalovchi vositalar to'plami tasvirlangan. Bu qaysi to'plam?","options":{"A":"L-1 yengil himoya kostyumi to'plami","B":"Kimyoviy razvedka kostyumi to'plami","C":"Umumqo'shin himoya to'plami","D":"OP-1 issiqdan himoya to'plami"},"answer":"C","explanation":"Bu umumqo'shin himoya to'plami (UHT, ruscha OZK): himoya plashi, himoya paypoqlari va himoya qo'lqoplaridan iborat. Plash, kombinezon yoki yenglarga kiyilgan holatlarda qo'llaniladi.","mnemonic":"Plash + paypoq + qo'lqop = UHT (OZK).","source":"10-sinf, 85-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_ozk.png"},{"id":12,"subtopic":"UHT plash holatida kiyish: boshlanishi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ozk_kiyish.png","question":"Rasmda UHT (OZK)ni plash holatida kiyish tartibi 1-5 raqamli fotolarda berilgan. 1-fotoda jangchi nima qilmoqda?","options":{"A":"Plashni yelkaga tashlab kiymoqda","B":"Gazniqobni \"jangovar\" holatga keltirmoqda","C":"Himoya paypoqlarini bog'lamoqda","D":"Plash tugmalarini qadamoqda"},"answer":"A","explanation":"Kiyish plashni yelkaga tashlab kiyishdan boshlanadi (1-foto). Keyin plash kiyilib tugmalanadi (2), paypoq va etak qismlari bog'lanadi (3-4), oxirida gazniqob kiyilib to'liq himoya holatiga o'tiladi (5).","mnemonic":"Avval plash — keyin qolgani.","source":"10-sinf, 89-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_ozk_kiyish.png"},{"id":13,"subtopic":"UHT plash holatida kiyish: yakuni (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ozk_kiyish.png","question":"Rasmdagi 5-fotoda ko'rsatilgan holat nimani anglatadi?","options":{"A":"Kiyishning boshlang'ich tayyorgarlik bosqichi","B":"Plashni yechib, g'ilofga joylash jarayoni","C":"Paypoq va qo'lqop kiyilgan oraliq holat","D":"Gazniqob ham kiyilgan to'liq himoya holati"},"answer":"D","explanation":"5-fotoda jarayon yakuni: plash to'liq tugmalangan, qalpoq tortilgan va gazniqob kiyilgan — jangchi to'liq himoya holatida. Shundan keyin qo'lga qurol olinadi.","mnemonic":"Oxirgi foto — to'liq himoya.","source":"10-sinf, 89-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_ozk_kiyish.png"},{"id":14,"subtopic":"R-2 respiratori tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_r2_respirator.png","question":"Rasmda 1 va 2 raqamlar bilan qismlari ko'rsatilgan himoya vositasi nima?","options":{"A":"GP-7 gazniqobining bir qismi","B":"Changga qarshi mato niqob","C":"R-2 respiratori","D":"Kislorod niqobi"},"answer":"C","explanation":"Bu R-2 respiratori: 1 — yarim niqob, 2 — yarim niqobni boshda ushlagich. U nafas olish organlarini radioaktiv va tuproq changidan himoyalaydi.","mnemonic":"Yarim niqob = respirator.","source":"10-sinf, 83-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_r2_respirator.png"},{"id":15,"subtopic":"R-2 qo'llanish sharti (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_r2_respirator.png","question":"Rasmdagi vosita gazniqob o'rnini bosa olmaydi. Buning asosiy sababi nima?","options":{"A":"Og'irligi gazniqobnikidan ancha katta","B":"O'lchamini boshga moslab tanlab bo'lmaydi","C":"Nafas olishga qarshiligi gazniqobdan yuqori","D":"Ko'z va yuzni himoyalamaydi, himoyasi pastroq"},"answer":"D","explanation":"Respirator yarim niqob bo'lgani uchun ko'z va yuzni to'liq himoya qilmaydi va himoya qobiliyati gazniqobdan past. Afzalligi — yengil, nafas olishga kam qarshilik ko'rsatadi. U faqat changdan (radioaktiv, tuproq) himoyalaydi.","mnemonic":"Respirator — faqat changga qarshi.","source":"10-sinf, 83-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_r2_respirator.png"},{"id":16,"subtopic":"Qo'lbola niqoblar (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_changga_niqob.png","question":"Rasmda 'a' va 'b' bilan belgilangan vositalar qanday himoya vositalari sirasiga kiradi?","options":{"A":"Zavodda tayyorlanadigan maxsus vositalar","B":"Izolatsiyalovchi tipdagi gazniqoblar","C":"Qo'lbola himoya vositalari","D":"Harbiy kimyoviy razvedka vositalari"},"answer":"C","explanation":"Rasmda qo'lbola himoya vositalari: a — changga qarshi materiallardan tayyorlangan qo'lbola niqob, b — changga qarshi paxta-dokali qo'lbola niqob. Ular maxsus vosita bo'lmaganda uy sharoitida yasaladi.","mnemonic":"Mato + paxta-doka = qo'lbola himoya.","source":"10-sinf, 84-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_changga_niqob.png"},{"id":17,"subtopic":"Gazniqob kiyish ketma-ketligi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"sequence","requires_image":true,"image":"/images/chqbt_gazniqob_kiyish.png","question":"Rasmda gazniqob kiyish bosqichlari aralash tartibda raqamlangan. \"Gazlar!\" komandasidan keyingi to'g'ri bajarilish tartibini aniqlang.","options":{"A":"1 – 2 – 3","B":"2 – 3 – 1","C":"3 – 1 – 2","D":"2 – 1 – 3"},"answer":"B","explanation":"To'g'ri tartib: tayyorgarlik holati (2) → gazniqobni xaltadan chiqarib olish (3) → gazniqobni kiyib, to'liq himoya holatiga o'tish (1). Kiyishda avval nafas chiqarilib, ko'z yumiladi, kiygach keskin nafas chiqariladi.","mnemonic":"Tayyorlan → chiqar → kiy.","source":"10-sinf, 82-bet, 4-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gazniqob_kiyish.png"},{"id":18,"subtopic":"GP-7 qismlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_gp7_qismlar.png","question":"GP-7 gazniqobi rasmidagi raqamlar va qism nomlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – filtr quti, 2 – yuz qismi, 5 – nafas chiqarish klapani","B":"2 – so'zlashish moslamasi, 5 – filtr quti, 6 – yuz qismi","C":"1 – yuz qismi, 2 – filtr quti, 5 – so'zlashish moslamasi","D":"1 – obtyurator, 4 – matoli g'ilof, 6 – filtr quti"},"answer":"C","explanation":"To'g'ri moslik: 1 — yuz qismi, 2 — filtr quti, 5 — so'zlashish moslamasi. Qolganlari: 3 — filtr qutining matoli g'ilofi, 4 — nafas olish klapani uzeli, 6 — nafas chiqarish klapani uzeli.","mnemonic":"1-yuz, 2-filtr, 5-gapirish.","source":"10-sinf, 81-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_gp7_qismlar.png"},{"id":19,"subtopic":"Shlem-niqob o'lchamini olish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolarda shlem-niqob o'lchamini aniqlash uchun boshning ikki o'lchami olinmoqda. Vertikal o'lchov qaysi chiziq bo'ylab olinadi?","options":{"A":"Boshning tepasi, iyak va lunjlar orqali o'tadigan yopiq chiziq bo'ylab","B":"Boshning orqa qismi va peshona orqali, qosh ustidan o'tadigan chiziq bo'ylab","C":"Bo'yin aylanasi va yelka orqali o'tadigan chiziq bo'ylab","D":"Peshona markazidan bosh orqasigacha to'g'ri chiziq bo'ylab"},"answer":"A","explanation":"Vertikal o'lchov — boshning tepasi, iyak va lunjlar orqali o'tadigan yopiq chiziq bo'ylab olinadi. Bosh orqasi va peshona orqali qosh ustidan o'tadigan chiziq esa gorizontal o'lchovdir.","mnemonic":"Vertikal — iyakdan tepagacha aylana.","source":"10-sinf, 80-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":20,"subtopic":"Shlem-niqob o'lchamini hisoblash (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi usulda olingan vertikal va gorizontal o'lchovlar yig'indisi 97 sm chiqdi. O'quvchiga qanday o'lchamli shlem-niqob kerak?","options":{"A":"1 o'lchamli","B":"2 o'lchamli","C":"3 o'lchamli","D":"0 o'lchamli"},"answer":"B","explanation":"Ikki o'lchov yig'indisi 96–98 sm oralig'ida bo'lsa, 2 o'lchamli shlem-niqob tanlanadi. 92 sm dan kam — 0, 92–96 sm — 1, 99–102,5 sm — 3 o'lchamli.","mnemonic":"96-98 oralig'i — 2-o'lcham.","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":21,"subtopic":"Bolalar gazniqobi PDF-D (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_pdf_d.png","question":"Fotoda ko'rsatilgan PDF-D rusumli bolalar gazniqobi qaysi yoshdagi bolalar uchun mo'ljallangan?","options":{"A":"7 yoshdan 17 yoshgacha bo'lganlar uchun","B":"1,5 yoshdan 7 yoshgacha bo'lganlar uchun","C":"1 yoshga to'lmagan chaqaloqlar uchun","D":"10 yoshdan oshgan o'quvchilar uchun"},"answer":"B","explanation":"PDF-D gazniqobi 1,5 yoshdan 7 yoshgacha bo'lgan bolalar uchun mo'ljallangan. 7 yoshdan 17 yoshgacha bo'lganlar PDF-Sh rusumidan foydalanadi.","mnemonic":"D — kichkintoylar (1,5-7), Sh — o'quvchilar (7-17).","source":"10-sinf, 81-bet, 3-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_pdf_d.png"},{"id":22,"subtopic":"Yadro portlash turlari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_yadro_turlari.png","question":"Rasmda yadro zaryadini portlatish turlari raqamlangan. Yer ostida portlatish qaysi raqamli fotoda?","options":{"A":"2-raqamli fotoda","B":"4-raqamli fotoda","C":"1-raqamli fotoda","D":"3-raqamli fotoda"},"answer":"B","explanation":"Yer ostida portlatishda (4-foto) yadro qo'ziqorini hosil bo'lmaydi — portlash kuchi tuproqni yuqoriga uloqtiradi. 1 — yer yuzida, 2 — suv ostida, 3 — havoda portlatish.","mnemonic":"Qo'ziqorinsiz tuproq fontani — yer ostida.","source":"11-sinf, 153-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_yadro_turlari.png"},{"id":23,"subtopic":"Portlash turlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_yadro_turlari.png","question":"Rasmdagi raqamlar va yadro portlatish turlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – havoda, 2 – yer ostida, 3 – suv ostida","B":"1 – suv ostida, 2 – yer yuzida, 3 – havoda","C":"1 – yer yuzida, 2 – suv ostida, 3 – havoda","D":"1 – yer yuzida, 2 – havoda, 3 – suv ostida"},"answer":"C","explanation":"To'g'ri moslik: 1 — yer yuzida (qo'ziqorin oyog'i yerga tegib turadi), 2 — suv ostida (suv ustuni ko'tariladi), 3 — havoda (olov shari yerga tegmaydi). 4 esa yer ostida portlatish.","mnemonic":"1-yer, 2-suv, 3-havo, 4-er osti.","source":"11-sinf, 153-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_yadro_turlari.png"},{"id":24,"subtopic":"Zarb to'lqini tezligi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_zarb_tolqin.png","question":"Sxemaga ko'ra yadro portlashining zarb to'lqini 5 soniya ichida qancha masofani bosib o'tadi?","options":{"A":"1 km","B":"3 km","C":"5 km","D":"2 km"},"answer":"D","explanation":"Sxemada ko'rsatilganidek, zarb to'lqini 2 soniyada 1 km, 5 soniyada 2 km, 8 soniyada 3 km masofani bosib o'tadi.","mnemonic":"2s-1km, 5s-2km, 8s-3km.","source":"11-sinf, 154-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_zarb_tolqin.png"},{"id":25,"subtopic":"Zarb to'lqini tezligi tahlili (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_zarb_tolqin.png","question":"Sxemadagi ma'lumotlar asosida zarb to'lqinining tezligi haqida qanday xulosa chiqarish mumkin?","options":{"A":"Portlash markazidan uzoqlashgan sari tezligi kamayib boradi","B":"Butun yo'l davomida tezligi o'zgarmay qoladi","C":"Portlash markazidan uzoqlashgan sari tezligi ortib boradi","D":"Avval sekinlashib, keyin yana avvalgi tezligiga qaytadi"},"answer":"A","explanation":"Birinchi kilometrni 2 soniyada, ikkinchisini 3 soniyada (5-2), uchinchisini ham 3 soniyada (8-5) bosib o'tadi — demak to'lqin uzoqlashgan sari energiyasini yo'qotib, sekinlashib boradi.","mnemonic":"Har km sekinroq — to'lqin so'nadi.","source":"11-sinf, 154-bet, 2-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_zarb_tolqin.png"},{"id":26,"subtopic":"Panohgoh: shlyuz kameralari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Odamlar panohgohga kirayotganda zaharlangan tashqi havo ichkariga o'tib ketmasligi uchun germetik eshikdan keyin joylashgan oraliq (tambur) xona — shlyuz kameralari rasmda qaysi raqam bilan belgilangan?","options":{"A":"4-raqam","B":"2-raqam","C":"8-raqam","D":"6-raqam"},"answer":"B","explanation":"Shlyuz kameralari — 2-raqam: kirishdagi ikki eshikli oraliq xonalar bo'lib, odamlar kirayotganda bir eshik yopilmaguncha ikkinchisi ochilmaydi, shu bilan zararlangan havo ichkariga o'tmaydi. 4 — aholi joylashadigan asosiy xona, 6 — filtr-ventilyatsiya kamerasi.","mnemonic":"Eshikdan keyingi tambur — shlyuz (2).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":27,"subtopic":"Panohgoh: asosiy xona (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Panohgohda yashirinayotgan aholi joylashtiriladigan asosiy xona rasmda qaysi raqamda ko'rsatilgan?","options":{"A":"4-raqam","B":"8-raqam","C":"2-raqam","D":"7-raqam"},"answer":"A","explanation":"4-raqam — aholi joylashtiriladigan asosiy xona (rasmda o'rindiqlar qatori ko'rinib turibdi). Panohgoh asosiy va yordamchi xonalardan iborat: asosiy xonalarga aholi joylashtiriladigan va tibbiyot-boshqaruv xonalari kiradi.","mnemonic":"O'rindiqli katta zal — asosiy xona (4).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":28,"subtopic":"Panohgoh: avariya chiqish joyi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Portlash oqibatida panohgohning asosiy kirish yo'li qulab, eshik ochilmay qoldi. Ichkaridagilar tashqariga rasmdagi qaysi raqamli yo'l orqali chiqadi?","options":{"A":"2-raqamli yo'l orqali","B":"1-raqamli yo'l orqali","C":"5-raqamli yo'l orqali","D":"8-raqamli yo'l orqali"},"answer":"C","explanation":"5-raqam — avariya (zaxira) chiqish joyi: yer yuzasiga alohida shaxta orqali chiqadigan bu yo'l asosiy kirish qulaganda foydalaniladi. 1 va 2 — asosiy kirishning germetik eshigi va shlyuzlari (ular qulagan deb berilgan), 8 — yukxona.","mnemonic":"Kirish qulasa — 5-chiqish (avariya).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":29,"subtopic":"Panohgoh: tibbiyot xonasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Panohgohda yashirinayotganlardan biri hushidan ketdi. Unga yordam ko'rsatish uchun rasmdagi qaysi raqamli xonaga olib boriladi?","options":{"A":"9-raqamli xonaga","B":"3-raqamli xonaga","C":"6-raqamli xonaga","D":"7-raqamli xonaga"},"answer":"D","explanation":"7-raqam — tibbiyot xonasi: panohgohning asosiy xonalari qatoriga kiradi va bemorlarga yordam ko'rsatish uchun mo'ljallangan. 3 — sanitar bo'lim (yuvinish va hojatxona), 9 — dizel elektrostansiyasi, 6 — filtr-ventilyatsiya kamerasi.","mnemonic":"Bemor — tibbiyot xonasiga (7).","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":30,"subtopic":"Panohgoh xonalarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_panohgoh.png","question":"Rasmdagi raqamlar va panohgoh xonalarining TO'G'RI mosligini tanlang.","options":{"A":"3 – yukxona, 8 – sanitar bo'lim, 2 – tibbiyot xonasi","B":"3 – sanitar bo'lim, 8 – yukxona (zaxiralar xonasi), 2 – shlyuz kameralari","C":"3 – shlyuz kameralari, 8 – dizel elektrostansiyasi, 2 – yukxona","D":"3 – tibbiyot xonasi, 8 – filtr-ventilyatsiya, 2 – sanitar bo'lim"},"answer":"B","explanation":"To'g'ri moslik: 3 — sanitar bo'lim (yuvinish xonasi va hojatxona), 8 — yukxona (oziq-ovqat va boshqa zaxiralar saqlanadigan xona), 2 — shlyuz kameralari. Bularning bari panohgohning yordamchi xonalariga kiradi.","mnemonic":"3-sanitar, 8-zaxira, 2-shlyuz.","source":"10-sinf, 78-bet, 1-rasm","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_panohgoh.png"},{"id":31,"subtopic":"Shlem-niqob 0 o'lcham (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi usulda o'lchanganda o'quvchining vertikal va gorizontal o'lchovlari yig'indisi 90 sm chiqdi. Unga qanday o'lchamli shlem-niqob kerak?","options":{"A":"1 o'lchamli","B":"2 o'lchamli","C":"0 o'lchamli","D":"3 o'lchamli"},"answer":"C","explanation":"Ikki o'lchov yig'indisi 92 sm dan kam bo'lsa, 0 o'lchamli shlem-niqob tanlanadi. 90 sm < 92 sm, demak 0 o'lcham. To'liq jadval: <92 — 0; 92–96 — 1; 96–98 — 2; 99–102,5 — 3; >102,5 — 4.","mnemonic":"92 dan kam — nol o'lcham.","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":32,"subtopic":"Shlem-niqob 1 o'lcham (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi usulda olingan ikki o'lchov yig'indisi 94 sm bo'ldi. O'quvchiga qaysi o'lchamli shlem-niqob to'g'ri keladi?","options":{"A":"1 o'lchamli","B":"0 o'lchamli","C":"2 o'lchamli","D":"4 o'lchamli"},"answer":"A","explanation":"92–96 sm oralig'idagi yig'indi uchun 1 o'lchamli shlem-niqob tanlanadi: 94 sm shu oraliqqa tushadi. 92 dan kam bo'lganda 0, 96–98 da 2 o'lcham olinadi.","mnemonic":"92-96 oralig'i — 1-o'lcham.","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":33,"subtopic":"Shlem-niqob 3 o'lcham (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi usulda o'lchanganda boshning ikki o'lchami yig'indisi 101 sm chiqdi. Qanday o'lchamli shlem-niqob tanlanadi?","options":{"A":"2 o'lchamli","B":"1 o'lchamli","C":"4 o'lchamli","D":"3 o'lchamli"},"answer":"D","explanation":"99–102,5 sm oralig'idagi yig'indi uchun 3 o'lchamli shlem-niqob olinadi: 101 sm shu oraliqda. 96–98 sm bo'lganda 2, 102,5 dan katta bo'lganda 4 o'lcham kerak bo'ladi.","mnemonic":"99-102,5 — 3-o'lcham.","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":34,"subtopic":"Shlem-niqob 4 o'lcham (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi usulda o'lchanganda askarning o'lchovlar yig'indisi 104 sm bo'ldi. Omborda 2 va 3 o'lchamli shlemlar ko'p, lekin u qaysi o'lchamni talab qilishi kerak?","options":{"A":"3 o'lchamli — eng kattasi shu","B":"4 o'lchamli — 102,5 sm dan katta yig'indi uchun","C":"2 o'lchamli — o'rtacha o'lcham hammaga mos","D":"0 o'lchamli — raqami kichigi qulayroq"},"answer":"B","explanation":"Yig'indi 102,5 sm dan katta bo'lsa, 4 o'lchamli shlem-niqob olish kerak — 104 sm shu toifaga kiradi. Kichik o'lchamli shlem yuzga zich yopishmay yoki siqib, germetiklikni buzadi; o'lchamlar 0 dan 4 gacha bo'ladi.","mnemonic":"102,5 dan katta — 4-o'lcham (eng kattasi).","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":35,"subtopic":"Shlem-niqob o'lchami yozilgan joy (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_shlem_olchash.png","question":"Fotolardagi o'lchash natijasida tanlangan shlem-niqobning o'lcham raqami (0 dan 4 gacha) niqobning qaysi qismida ko'rsatilgan bo'ladi?","options":{"A":"Iyak qismida","B":"Peshona qismida","C":"Filtr qutisida","D":"Ko'zoynak oynasida"},"answer":"A","explanation":"GP-5 shlem-niqobining o'lchami niqobning iyak qismida 0 dan 4 gacha bo'lgan raqam bilan ko'rsatiladi. Olingan o'lchovlar yig'indisiga mos raqamli shlem tanlanadi.","mnemonic":"O'lcham raqami — iyakda.","source":"10-sinf, 80-bet","topic":"Darslik rasmlari asosida himoya inshootlari va vositalarini aniqlash","subject":"CHQBT","_cat":"Fuqaro muhofazasi","_img":"public/images/chqbt_shlem_olchash.png"},{"id":1,"subtopic":"To'siqlar yo'lagi: labirint (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tosiqlar.png","question":"Rasmda to'siqlar yo'lagining 4 ta elementi raqamlangan. Ustunlar orasidan burilib o'tiladigan 3-raqamli to'siq qanday nomlanadi?","options":{"A":"Vayron bo'lgan ko'prik","B":"Labirint","C":"Quduq va yurish yo'lagi","D":"To'rt pog'onali zinapoya"},"answer":"B","explanation":"Ustunlar va to'siqlar orasidan ilonizi bo'lib yugurib o'tiladigan element — labirint. Vayron ko'prik balandlikda yurish uchun, zinapoya pog'onalardan sakrash uchun, quduq esa pastga tushib chiqish uchun mo'ljallangan.","mnemonic":"Ilonizi yo'l — labirint.","source":"10-sinf, 186-bet, 5-rasm","topic":"Darslik rasmlari asosida to'siqlar yo'lagi elementlarini aniqlash","subject":"CHQBT","_cat":"Jismoniy","_img":"public/images/chqbt_tosiqlar.png"},{"id":2,"subtopic":"To'siqlar yo'lagi: 2 metrli devor (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tosiqlar.png","question":"Rasmdagi 1-raqamli, yoniga qiya taxta tirab qo'yilgan to'siq qaysi element?","options":{"A":"Qalin darchali devor","B":"Vayron bo'lgan zinapoya","C":"Kuzatuv minorasi devori","D":"Ikki metrli devor"},"answer":"D","explanation":"Bu ikki metrli devor — askar uni qiya taxta yordamida yoki tirmashib oshib o'tadi. Qalin darchali devorda teshik (darcha) bo'ladi va undan sirpanib o'tiladi; zinapoya pog'onali konstruksiya.","mnemonic":"Bo'y yetmas devor — 2 metr.","source":"10-sinf, 186-bet, 6-rasm","topic":"Darslik rasmlari asosida to'siqlar yo'lagi elementlarini aniqlash","subject":"CHQBT","_cat":"Jismoniy","_img":"public/images/chqbt_tosiqlar.png"},{"id":3,"subtopic":"To'siqlar yo'lagi: xandaq (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tosiqlar.png","question":"Askar yugurib kelib ustidan sakrab o'tishi kerak bo'lgan 4-raqamli to'siq qanday nomlanadi?","options":{"A":"Xandaq","B":"Transheya","C":"Yakkalik okop","D":"Suv to'sig'i"},"answer":"A","explanation":"4-raqamda xandaq — uzun chuqurlik bo'lib, ustidan sakrab o'tiladi. Transheya (2-raqam) esa ichiga tushib o'tiladigan chuqur element; yakkalik okop jang inshooti bo'lib, to'siqlar yo'lagiga kirmaydi.","mnemonic":"Xandaq — ustidan sakra, transheya — ichidan o't.","source":"10-sinf, 185-bet, 4-rasm","topic":"Darslik rasmlari asosida to'siqlar yo'lagi elementlarini aniqlash","subject":"CHQBT","_cat":"Jismoniy","_img":"public/images/chqbt_tosiqlar.png"},{"id":4,"subtopic":"To'siqlar yo'lagini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_tosiqlar.png","question":"Rasmdagi raqamlar va to'siq nomlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – xandaq, 2 – labirint, 3 – devor, 4 – transheya","B":"1 – devor, 2 – transheya, 3 – labirint, 4 – xandaq","C":"1 – devor, 2 – xandaq, 3 – labirint, 4 – transheya","D":"1 – labirint, 2 – transheya, 3 – devor, 4 – xandaq"},"answer":"B","explanation":"To'g'ri moslik: 1 — ikki metrli devor (qiya taxtali), 2 — transheya (to'rtburchak chuqurlik), 3 — labirint (ustunli yo'lak), 4 — xandaq (uzun chuqurlik). Xandaq ustidan sakraladi, transheyaning ichidan o'tiladi.","mnemonic":"Devor-transheya-labirint-xandaq (1-2-3-4).","source":"10-sinf, 184-187-bet","topic":"Darslik rasmlari asosida to'siqlar yo'lagi elementlarini aniqlash","subject":"CHQBT","_cat":"Jismoniy","_img":"public/images/chqbt_tosiqlar.png"},{"id":1,"subtopic":"PKM tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_pkm.png","question":"Rasmda soshka (tirgak oyoqlar)ga o'rnatilgan, yonida patronlar qutisi bo'lgan qurol tasvirlangan. Bu qaysi qurol?","options":{"A":"Kalashnikov pulemyoti (PKM)","B":"RPK-74 qo'l pulemyoti","C":"Dragunov merganlik miltig'i (SVD)","D":"AK-74 avtomati"},"answer":"A","explanation":"Rasmda PKM — Kalashnikov pulemyoti. Uni soshkaga o'rnatilishi va yonidagi yashil lenta-quti (100/200 patron) orqali tanish mumkin. RPK-74 da lenta-quti emas, o'qdon ishlatiladi.","mnemonic":"Lenta-quti + soshka = PKM.","source":"10-sinf, 95-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_pkm.png"},{"id":2,"subtopic":"PKM o't ta'minoti (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_pkm.png","question":"Rasmdagi qurolning yonida yashil quti ko'rinib turibdi. Bu quti nima vazifani bajaradi?","options":{"A":"Tozalash anjomlari to'plami solinadi","B":"Zaxira stvol va ehtiyot qismlar saqlanadi","C":"100 yoki 200 patronli o'q lentasi joylanadi","D":"30 patronli zaxira o'qdonlar taqiladi"},"answer":"C","explanation":"PKM lentali ta'minotga ega: qutiga 100 yoki 200 patronli lenta joylanadi. Shu tufayli PKM uzluksiz kuchli o't ocha oladi (otish sur'ati 650–800 o'q/daq).","mnemonic":"PKM qutisi — 100/200 patronli lenta.","source":"10-sinf, 95-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_pkm.png"},{"id":3,"subtopic":"SVD tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_svd.png","question":"Rasmda uzun stvolli, ustiga maxsus moslama o'rnatilgan qurol tasvirlangan. Bu qaysi qurol?","options":{"A":"AK-74 avtomati","B":"Dragunov merganlik miltig'i (SVD)","C":"Kalashnikov pulemyoti (PKM)","D":"IJ-38 pnevmatik quroli"},"answer":"B","explanation":"Bu SVD — Dragunov merganlik miltig'i. Uni uzun stvoli, o'yilgan (ramkali) qo'ndog'i va ustidagi optik mo'ljali orqali tanish mumkin.","mnemonic":"Optik mo'ljal + ramkali qo'ndoq = SVD.","source":"10-sinf, 96-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_svd.png"},{"id":4,"subtopic":"SVD optik mo'ljal (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_svd.png","question":"Rasmdagi qurolning ustiga o'rnatilgan silindrsimon moslama merganga qanday imkoniyat beradi?","options":{"A":"Otish tovushi va olovini yashiradi","B":"O'qning boshlang'ich tezligini oshiradi","C":"Qurol tebranishini kamaytirib turadi","D":"1300 m gacha aniq nishonga olishni ta'minlaydi"},"answer":"D","explanation":"SVD ustidagi moslama — optik mo'ljal (pritsel). U bilan SVD dan 1300 m gacha (ochiq mo'ljal bilan 1200 m) nishonga olib otish mumkin.","mnemonic":"Optik bilan — 1300 m.","source":"10-sinf, 96-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_svd.png"},{"id":5,"subtopic":"RPG-7 tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_rpg7.png","question":"Rasmda orqa qismi karnaysimon kengaygan trubasimon qurol tasvirlangan. Bu qaysi qurol?","options":{"A":"Tankka qarshi qo'l granatomyoti (RPG-7)","B":"Dragunov merganlik miltig'i (SVD)","C":"Kalashnikov pulemyoti (PKM)","D":"RPK-74 qo'l pulemyoti"},"answer":"A","explanation":"Bu RPG-7 — tankka qarshi qo'l granatomyoti. Trubasimon korpus va orqadagi karnaysimon kengayma (reaktiv gazlar chiqishi uchun) uning o'ziga xos belgilari.","mnemonic":"Truba + karnay = RPG-7.","source":"10-sinf, 96-bet, 3-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_rpg7.png"},{"id":6,"subtopic":"RPG-7 vazifasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_rpg7.png","question":"Jang maydonida rasmdagi qurol bilan qurollangan askarga qaysi nishonni yo'q qilish vazifasi yuklatiladi?","options":{"A":"Dushman tanki va bronetexnikasi","B":"1500 m dagi guruh nishonlari","C":"Uchayotgan vertolyot","D":"1200 m dagi yakka mergan"},"answer":"A","explanation":"RPG-7 birinchi navbatda tank va boshqa bronemashinalarga qarshi mo'ljallangan (jangovar otish tezligi daqiqada 4–6 granata). Uzoq guruh nishonlari — PKM, yakka uzoq nishon — SVD vazifasi.","mnemonic":"RPG — tankning dushmani.","source":"10-sinf, 96-bet, 3-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_rpg7.png"},{"id":7,"subtopic":"PM tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_pm.png","question":"Rasmda tasvirlangan to'pponcha qaysi qurol?","options":{"A":"TT to'pponchasi","B":"IJ-38 pnevmatik to'pponchasi","C":"9 millimetrli Makarov to'pponchasi","D":"Stechkin avtomatik to'pponchasi"},"answer":"C","explanation":"Rasmda 9 mm li Makarov to'pponchasi (PM). U qisqa masofada (50 m gacha samarali) dushmanni zararlash uchun mo'ljallangan shaxsiy qurol.","mnemonic":"PM — 9 mm Makarov.","source":"10-sinf, 97-bet, 4-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_pm.png"},{"id":8,"subtopic":"PM qo'llanish doirasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_pm.png","question":"Rasmdagi qurol qanday vaziyat uchun mo'ljallangan shaxsiy qurol hisoblanadi?","options":{"A":"Uzoq masofada (1000 m dan ortiq) otish uchun","B":"Yaqin masofada (50 m gacha) hujum va himoya uchun","C":"Bronetexnikani zararlash va to'xtatish uchun","D":"O'rta masofada (400 m gacha) aniq otish uchun"},"answer":"B","explanation":"PM — qisqa masofalarda hujum va himoya uchun shaxsiy qurol: samarali otish masofasi 50 m, o'qning zarar yetkazish kuchi 350 m gacha saqlanadi.","mnemonic":"To'pponcha — yaqin jang quroli (50 m).","source":"10-sinf, 97-bet, 4-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_pm.png"},{"id":9,"subtopic":"AK-74 noto'liq ajratish tartibi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"sequence","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"Rasmda AK-74 ni noto'liq ajratish amallari aralash tartibda raqamlangan. To'g'ri bajarilish ketma-ketligini aniqlang.","options":{"A":"1 – 2 – 3 – 4 – 5 – 6 – 7 – 8","B":"2 – 6 – 4 – 1 – 7 – 3 – 8 – 5","C":"2 – 4 – 6 – 1 – 3 – 7 – 5 – 8","D":"6 – 2 – 1 – 4 – 3 – 7 – 8 – 5"},"answer":"B","explanation":"To'g'ri tartib: o'qdonni ajratish (2) → qo'ndoqdan anjomlar penalini olish (6) → shompolni ajratish (4) → stvol qutisi qopqog'ini ajratish (1) → qaytarish mexanizmini ajratish (7) → zatvor ramasini zatvor bilan ajratish (3) → zatvorni zatvor ramasidan ajratish (8) → gaz trubkasini ajratish (5).","mnemonic":"O'qdon–penal–shompol–qopqoq–prujina–rama–zatvor–gaz trubka.","source":"10-sinf, 106-107-bet, 1-8-rasmlar","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":10,"subtopic":"AK-74 ajratish: birinchi qadam (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"AK-74 ni noto'liq ajratishda BIRINCHI bajariladigan amal qaysi raqamli rasmda ko'rsatilgan?","options":{"A":"1-rasmda","B":"6-rasmda","C":"2-rasmda","D":"4-rasmda"},"answer":"C","explanation":"Noto'liq ajratish o'qdonni ajratishdan boshlanadi — bu 2-rasmda ko'rsatilgan (qo'l o'qdonni ushlab, oldinga bosib ajratmoqda). Shundan so'ng patron yo'qligi tekshiriladi.","mnemonic":"Avval o'qdon — xavfsizlik birinchi.","source":"10-sinf, 106-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":11,"subtopic":"AK-74 ajratish: gaz trubkasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"5-raqamli rasmda qaysi amal bajarilmoqda?","options":{"A":"Gaz trubkasini ajratish","B":"Shompolni ajratish","C":"Qopqoqni ajratish","D":"O'qdonni ajratish"},"answer":"A","explanation":"5-rasmda gaz trubkasini ajratish ko'rsatilgan — bu noto'liq ajratishning OXIRGI qadami. Gaz trubkasi qizg'ish stvol ustqo'ymasi bilan birga ajratiladi.","mnemonic":"Gaz trubkasi — yakuniy qadam.","source":"10-sinf, 107-bet, 8-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":12,"subtopic":"AK-74 ajratish: qaytarish mexanizmi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"7-raqamli rasmda jangchi prujinali qismni ajratmoqda. Bu qaysi qism?","options":{"A":"Zatvor","B":"Zarba berish mexanizmi","C":"Gaz porsheni","D":"Qaytarish mexanizmi"},"answer":"D","explanation":"7-rasmda qaytarish mexanizmi (prujinasi bilan) ajratilmoqda. U otishdan keyin zatvor ramasini oldingi holatga qaytaradi va stvol qutisi qopqog'i ajratilgandan keyin olinadi.","mnemonic":"Prujina = qaytarish mexanizmi.","source":"10-sinf, 107-bet, 5-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":13,"subtopic":"AK-74 ajratish: amallar bog'liqligi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"3-raqamli rasmda zatvor ramasi (zatvor bilan) ajratilmoqda. Bu amalni bajarishdan OLDIN qaysi rasmdagi amal tugallangan bo'lishi shart?","options":{"A":"5-rasmdagi (gaz trubkasini ajratish)","B":"7-rasmdagi (qaytarish mexanizmini ajratish)","C":"8-rasmdagi (zatvorni ajratish)","D":"6-rasmdagi (penalni olish)"},"answer":"B","explanation":"Zatvor ramasini chiqarish uchun avval uni orqaga tortib turuvchi qaytarish mexanizmi (7-rasm) olingan bo'lishi kerak — aks holda rama stvol qutisidan chiqmaydi. Zatvorni ajratish (8) va gaz trubkasi (5) esa ramadan KEYIN bajariladi.","mnemonic":"Prujinani olmasdan ramani chiqarib bo'lmaydi.","source":"10-sinf, 107-bet, 5-6-rasmlar","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":14,"subtopic":"IJ-38 tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ij38_qismlar.png","question":"Rasmda qismlari raqamlab ko'rsatilgan qurol qanday qurol?","options":{"A":"Kichik kalibrli sport miltig'i","B":"Dragunov merganlik miltig'i","C":"IJ-38 pnevmatik quroli","D":"AK-74 avtomati"},"answer":"C","explanation":"Bu IJ-38 pnevmatik quroli — ommaviy sport pnevmatik qurollaridan, 10 m masofadan otishni o'rganish uchun ishlatiladi. Kalibr 4,5 mm, og'irligi 2,8 kg.","mnemonic":"Maktab tiri quroli — IJ-38.","source":"11-sinf, 135-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ij38_qismlar.png"},{"id":15,"subtopic":"IJ-38 tepki (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ij38_qismlar.png","question":"Rasmdagi IJ-38 qurolida o'q uzish uchun bosiladigan tepki qaysi raqam bilan belgilangan?","options":{"A":"8-raqam","B":"7-raqam","C":"1-raqam","D":"6-raqam"},"answer":"A","explanation":"Tepki (spusk) — 8-raqam. 7-raqam — tepki himoya halqasi (tepkini tasodifiy bosilishdan saqlaydi), 1 — qo'ndoq, 6 — sharnir.","mnemonic":"Tepki — 8, himoya halqasi — 7.","source":"11-sinf, 135-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ij38_qismlar.png"},{"id":16,"subtopic":"IJ-38 nishonga olish moslamasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ij38_qismlar.png","question":"Otuvchi IJ-38 dan nishonga olmoqchi. Rasmda nishonga olish moslamasi qaysi raqamda?","options":{"A":"4-raqam","B":"3-raqam","C":"5-raqam","D":"2-raqam"},"answer":"D","explanation":"Nishonga olish moslamasi — 2-raqam (stvol ustidagi ko'rish moslamasi). 3 — stvol o'qi, 4 — stvol, 5 — sharnir o'qi.","mnemonic":"Nishonga olish — 2-raqam.","source":"11-sinf, 135-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ij38_qismlar.png"},{"id":17,"subtopic":"IJ-38 sharnir (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ij38_qismlar.png","question":"IJ-38 ni damlash (o'qlash) uchun stvol pastga sindiriladi. Rasmda bu harakatni ta'minlaydigan burma birikma qaysi raqamda?","options":{"A":"2-raqam","B":"8-raqam","C":"6-raqam","D":"1-raqam"},"answer":"C","explanation":"Sharnir (6-raqam) stvolning sinishi (bukilishi)ni ta'minlaydi — shu orqali qurol damlanadi. 5-raqam esa sharnir o'qi.","mnemonic":"Sindirish nuqtasi — sharnir (6).","source":"11-sinf, 135-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ij38_qismlar.png"},{"id":18,"subtopic":"Granata uloqtirish fazalari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_granata_tik.png","question":"Rasmda granatani tik turgan holatda uloqtirish ketma-ketligi (a, b, d, e) berilgan. 'b' holatida jangchi nima bajarmoqda?","options":{"A":"Saqlovchi halqani sug'urib, nishonga yuzlanmoqda","B":"Granatani qo'yib yuborib, harakatni yakunlamoqda","C":"Granatani yelka uzra olib o'tib uloqtirmoqda","D":"Ortga qadam tashlab, tizzani bukib, otish holatini egallamoqda"},"answer":"D","explanation":"'b' holatida o'ng (chap) oyoq bilan ortga bir qadam tashlanib, tizza bukiladi va tana burilib otish holati egallanadi. 'a' — dastlabki holat, 'd' — uloqtirish, 'e' — yakunlash.","mnemonic":"a-tayyorlan, b-qadam+tizza, d-uloqtir, e-yakunla.","source":"10-sinf, 141-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_granata_tik.png"},{"id":19,"subtopic":"Granata uloqtirish yakuni (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_granata_tik.png","question":"Rasmdagi qaysi harf bilan belgilangan holatda granata qo'ldan chiqib, tana og'irligi oldingi oyoqqa o'tgan?","options":{"A":"a","B":"b","C":"d","D":"e"},"answer":"D","explanation":"'e' holati — uloqtirish yakuni: granata qo'ldan chiqqan, tana og'irligi chap (oldingi) oyoqqa o'tgan, qo'l harakatni tugatgan. Uloqtirishning o'zi 'd' holatida boshlanadi.","mnemonic":"Oxirgi harf — oxirgi faza.","source":"10-sinf, 141-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_granata_tik.png"},{"id":20,"subtopic":"UZRGM zapalini o'rnatish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_zapal_ornatish.png","question":"Rasmda granata va alohida qism bilan bajarilayotgan jarayon ko'rsatilgan. Bu qanday jarayon?","options":{"A":"Granataga UZRGM zapalini joylashtirish","B":"Granatani zararsizlantirish","C":"Granata korpusini tozalash","D":"Saqlovchi halqani sug'urish"},"answer":"A","explanation":"Rasmda granataga UZRGM (zapal)ni joylashtirish: tiqin burab chiqariladi, zapal trubkaga burab kiritiladi. Bu \"Granatalar hozirlanishi!\" komandasiga ko'ra, jangda esa mustaqil bajariladi.","mnemonic":"Zapal — otishdan oldin buraladi.","source":"10-sinf, 140-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_zapal_ornatish.png"},{"id":21,"subtopic":"Granatani tizzalab uloqtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_granata_tizzalab.png","question":"Rasmdagi a, b, d holatlarda granata qanday holatda uloqtirilmoqda?","options":{"A":"Tik turgan holatda","B":"Yotgan holatda","C":"Tizzalab turgan holatda","D":"Harakat (yurish) mobaynida"},"answer":"C","explanation":"Rasmda granatani tizzada turgan holatda uloqtirish usuli: a — tizzada dastlabki holat, b — tanani burib zamax qilish, d — granatani yelka uzra uloqtirish. Bu usul past to'siq (panoh) ortidan otishda qo'llanadi.","mnemonic":"Tizzada — past panoh ortidan.","source":"10-sinf, 142-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_granata_tizzalab.png"},{"id":22,"subtopic":"AK-74 ajratish: moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"AK-74 ni noto'liq ajratish rasmidagi raqamlar va amallarning TO'G'RI mosligini tanlang.","options":{"A":"2 – o'qdonni ajratish, 4 – shompolni ajratish, 5 – gaz trubkasini ajratish","B":"2 – shompolni ajratish, 4 – o'qdonni ajratish, 5 – zatvorni ajratish","C":"1 – o'qdonni ajratish, 3 – penalni olish, 8 – gaz trubkasini ajratish","D":"6 – zatvor ramasini ajratish, 7 – qopqoqni ajratish, 8 – shompolni ajratish"},"answer":"A","explanation":"To'g'ri moslik: 2 — o'qdonni ajratish, 4 — shompolni ajratish, 5 — gaz trubkasini ajratish. Qolganlari: 1 — qopqoq, 3 — zatvor ramasi, 6 — penal, 7 — qaytarish mexanizmi, 8 — zatvor.","mnemonic":"2-o'qdon, 4-shompol, 5-gaz trubka.","source":"10-sinf, 106-107-bet","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":23,"subtopic":"AK-74 yig'ish tartibi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_ajratish.png","question":"Noto'liq ajratishdan keyin avtomat TESKARI tartibda yig'iladi. Yig'ishda BIRINCHI bo'lib qaysi rasmdagi qism o'rnatiladi?","options":{"A":"2-rasmdagi (o'qdon)","B":"5-rasmdagi (gaz trubkasi)","C":"1-rasmdagi (stvol qutisi qopqog'i)","D":"8-rasmdagi (zatvor)"},"answer":"B","explanation":"Yig'ish ajratishga teskari: ajratishda oxirgi olingan gaz trubkasi (5-rasm) yig'ishda birinchi o'rnatiladi. O'qdon esa eng oxirida taqiladi.","mnemonic":"Oxirgi olingan — birinchi o'rnatiladi.","source":"10-sinf, 107-bet","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_ajratish.png"},{"id":24,"subtopic":"IJ-38 qismlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ij38_qismlar.png","question":"IJ-38 pnevmatik quroli rasmidagi raqamlar va qism nomlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – stvol, 4 – qo'ndoq, 8 – sharnir","B":"2 – tepki, 6 – nishonga olish moslamasi, 7 – stvol","C":"4 – sharnir o'qi, 5 – tepki, 6 – qo'ndoq","D":"1 – qo'ndoq, 4 – stvol, 8 – tepki"},"answer":"D","explanation":"To'g'ri moslik: 1 — qo'ndoq, 4 — stvol, 8 — tepki. Qolganlari: 2 — nishonga olish moslamasi, 3 — stvol o'qi, 5 — sharnir o'qi, 6 — sharnir, 7 — tepki himoya halqasi.","mnemonic":"1-qo'ndoq, 4-stvol, 8-tepki.","source":"11-sinf, 135-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ij38_qismlar.png"},{"id":25,"subtopic":"RPK-74 ni tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_rpk74.png","question":"Rasmda qismlarga ajratib ko'rsatilgan qurol qaysi?","options":{"A":"AK-74 avtomati","B":"PKM pulemyoti","C":"RPK-74 qo'l pulemyoti","D":"SVD merganlik miltig'i"},"answer":"C","explanation":"Katta sig'imli (45 patronli) egik o'qdon, uzaytirilgan stvol va tirgak — RPK-74 qo'l pulemyotining belgilari. AK-74 da tirgak bo'lmaydi, PKM lenta bilan ta'minlanadi, SVD esa yarim avtomat miltiq.","mnemonic":"Katta o'qdon + tirgak = RPK-74.","source":"10-sinf, 93-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_rpk74.png"},{"id":26,"subtopic":"RPK-74 qismlari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_rpk74.png","question":"RPK-74 rasmida 6-raqam bilan ko'rsatilgan uzun prujinali qism qanday nomlanadi?","options":{"A":"Qaytaruvchi mexanizm","B":"Shompol","C":"Gaz trubkasi","D":"Zatvor ramasi"},"answer":"A","explanation":"6-raqam — qaytaruvchi mexanizm: prujinasi zatvor ramasini oldingi holatga qaytaradi. Shompol (10) tekis sterjen, gaz trubkasi (7) stvol qoplamasi bilan birga, zatvor ramasi (4) esa gaz porsheniga ega.","mnemonic":"Prujinali sterjen — qaytaruvchi (6).","source":"10-sinf, 93-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_rpk74.png"},{"id":27,"subtopic":"RPK-74 qismlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_rpk74.png","question":"RPK-74 rasmidagi raqamlar va qismlarning TO'G'RI mosligini tanlang.","options":{"A":"2 – gaz trubkasi, 7 – kompensator, 9 – penal","B":"2 – olov so'ndiruvchi-kompensator, 7 – gaz trubkasi, 9 – o'qdon","C":"2 – shompol, 7 – o'qdon, 9 – gaz trubkasi","D":"2 – kompensator, 7 – penal, 9 – shompol"},"answer":"B","explanation":"To'g'ri moslik: 2 — olov so'ndiruvchi-kompensator (stvol uchidagi qora qism), 7 — gaz trubkasi stvol qoplamasi bilan, 9 — 45 patronli o'qdon.","mnemonic":"2-kompensator, 7-trubka, 9-o'qdon.","source":"10-sinf, 93-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_rpk74.png"},{"id":28,"subtopic":"Mo'ljalga olish moslamasi: xomut (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_moljal.png","question":"Rasmda AK-74 mo'ljalga olish moslamasi ko'rsatilgan. Otish masofasiga mos bo'linmaga suriladigan xomut qaysi raqamda?","options":{"A":"1-raqamda","B":"2-raqamda","C":"3-raqamda","D":"6-raqamda"},"answer":"B","explanation":"Xomut — 2-raqam: u mo'ljallagich plankasi bo'ylab surilib, kerakli masofa bo'linmasida qotiriladi. 1 — mo'ljallagich asosi, 3 — mo'ljallagich plankasi, 6 — mo'ljal kolodkasi.","mnemonic":"Suriladigan qism — xomut (2).","source":"10-sinf, 99-bet, 5-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_moljal.png"},{"id":29,"subtopic":"Mo'ljalga olish moslamasi: planka (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_moljal.png","question":"Mo'ljalga olish moslamasi rasmida 3-raqam bilan ko'rsatilgan qism qanday nomlanadi?","options":{"A":"Sektor","B":"Xomut ilgagi","C":"Mo'ljallagich asosi","D":"Mo'ljallagich plankasi"},"answer":"D","explanation":"3-raqam — mo'ljallagich plankasi: ustida masofa bo'linmalari belgilangan bo'lib, xomut shu planka bo'ylab suriladi. Sektor (5) plankani ko'tarib turadi, asos (1) butun moslamani stvol qutisiga biriktiradi.","mnemonic":"Bo'linmali taxtacha — planka (3).","source":"10-sinf, 99-bet, 5-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_moljal.png"},{"id":30,"subtopic":"Mo'ljalga olish moslamasini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ak74_moljal.png","question":"Mo'ljalga olish moslamasi rasmidagi raqamlar va qismlarning TO'G'RI mosligini tanlang.","options":{"A":"1 – mo'ljallagich asosi, 5 – sektor, 6 – mo'ljal kolodkasi","B":"1 – xomut, 5 – mo'ljallagich plankasi, 6 – sektor","C":"1 – sektor, 5 – mo'ljal kolodkasi, 6 – mo'ljallagich asosi","D":"1 – mo'ljal kolodkasi, 5 – xomut ilgagi, 6 – planka"},"answer":"A","explanation":"To'g'ri moslik: 1 — mo'ljallagich asosi, 5 — sektor, 6 — mo'ljal kolodkasi. Qolganlari: 2 — xomut, 3 — mo'ljallagich plankasi, 4 — xomut ilgagi.","mnemonic":"1-asos, 5-sektor, 6-kolodka.","source":"10-sinf, 99-bet, 5-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_moljal.png"},{"id":31,"subtopic":"Qaytaruvchi mexanizm vazifasi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_qaytaruvchi.png","question":"Rasmda ko'rsatilgan AK-74 mexanizmi qanday vazifani bajaradi?","options":{"A":"Gaz porsheni harakatini yo'naltiradi","B":"Patronni patrondonga yuboradi","C":"O'qlar urishi yo'nalishlarini jamlaydi","D":"Zatvor ramasini oldingi holatga qaytaradi"},"answer":"D","explanation":"Rasmda qaytaruvchi mexanizm: uning prujinasi zatvor ramasini zatvor bilan birgalikda oldingi holatga qaytaradi. Gaz porshenini gaz trubkasi yo'naltiradi, patronni zatvor yuboradi, o'qlar urishini kompensator jamlaydi.","mnemonic":"Prujina — ramani oldinga qaytaradi.","source":"10-sinf, 100-bet, 9-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_qaytaruvchi.png"},{"id":32,"subtopic":"Qaytaruvchi mexanizm qismlari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_qaytaruvchi.png","question":"Qaytaruvchi mexanizm rasmida qaytarish prujinasi qaysi raqamda ko'rsatilgan?","options":{"A":"2-raqamda","B":"4-raqamda","C":"1-raqamda","D":"3-raqamda"},"answer":"C","explanation":"Qaytarish prujinasi — 1-raqam. Qolganlari: 2 — yo'naltiruvchi ustun, 3 — yuruvchi ustun, 4 — biriktirgich.","mnemonic":"Prujina — 1-raqam.","source":"10-sinf, 100-bet, 9-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_qaytaruvchi.png"},{"id":33,"subtopic":"Ballistika grafigi: Vm (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ballistika_grafik.png","question":"O'q uzish bosqichlari grafigidagi Vm belgisi nimani bildiradi?","options":{"A":"Gazlarning eng katta bosimini","B":"O'qning eng katta tezligini","C":"O'qning stvoldan chiqish tezligini","D":"Tezlatish bosimini"},"answer":"B","explanation":"Vm — o'qning eng katta (maksimal) tezligi. Eng katta bosim Rm bilan, stvoldan chiqish tezligi Vd bilan, tezlatish bosimi Ro bilan belgilanadi.","mnemonic":"V — tezlik (velocity), m — maksimal.","source":"11-sinf, 125-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ballistika_grafik.png"},{"id":34,"subtopic":"Ballistika grafigi: Vd va Vm (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ballistika_grafik.png","question":"Grafikda Vd (stvoldan chiqish tezligi) nuqtasi Vm dan oldinroqda joylashgan. Bu nimani anglatadi?","options":{"A":"O'q stvoldan chiqqach ham gazlar ta'sirida yana biroz tezlashadi","B":"O'q eng katta tezlikka stvol kanalining o'rtasida erishadi","C":"O'q stvoldan chiqqan zahoti tezligi keskin pasayadi","D":"Stvol og'zida bosim va tezlik teng qiymatga ega bo'ladi"},"answer":"A","explanation":"Stvoldan o'q ortidan otilib chiqayotgan gazlar unga yana qo'shimcha tezlik beradi, shuning uchun eng katta tezlik (Vm) stvol og'zidan keyinroq, gazlar ta'siridan keyingi bosqichda qayd etiladi.","mnemonic":"Gazlar o'qni stvoldan keyin ham itaradi.","source":"11-sinf, 125-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ballistika_grafik.png"},{"id":35,"subtopic":"Ballistika belgilarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ballistika_grafik.png","question":"Grafikdagi belgilar va ularning ma'nolarining TO'G'RI mosligini tanlang.","options":{"A":"Ro – atmosfera bosimi, Vd – eng katta tezlik, Ratm – tezlatish bosimi","B":"Ro – eng katta bosim, Vd – porox yonishi oxiri, Ratm – stvol og'zi bosimi","C":"Ro – stvol og'zi bosimi, Vd – boshlang'ich bosim, Ratm – eng katta tezlik","D":"Ro – tezlatish bosimi, Vd – stvoldan chiqish tezligi, Ratm – atmosferaga teng bosim"},"answer":"D","explanation":"To'g'ri moslik: Ro — tezlatish bosimi, Vd — o'q stvol kanalidan uchib chiqqan paytdagi tezligi, Ratm — atmosferaga tenglashgan bosim. Eng katta bosim — Rm, porox yonishi oxiridagi qiymatlar — Rk va Vk.","mnemonic":"o-boshlanish, d-chiqish, atm-atmosfera.","source":"11-sinf, 125-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ballistika_grafik.png"},{"id":36,"subtopic":"Pnevmatik otish nishonlari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_nishonlar.png","question":"Rasmda pnevmatik otish nishonlari raqamlangan. IJ-22, IJ-38 ochiq pritselli miltiqdan 1-mashq qaysi raqamli nishonda bajariladi?","options":{"A":"1-raqamli nishonda","B":"Ikkala nishonning istalganida","C":"2-raqamli nishonda","D":"Avval 1-, so'ng 2-raqamlida"},"answer":"C","explanation":"1-mashq qora doirali \"P\" shaklidagi nishonda (2-raqam) bajariladi. 1-raqamdagi 8 raqamli nishon esa 2-mashq — qo'rg'oshinli o'qlar bilan ball hisobida otish uchun.","mnemonic":"1-mashq — \"P\" nishon.","source":"11-sinf, 137-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_nishonlar.png"},{"id":37,"subtopic":"8 raqamli nishonda baholash (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_nishonlar.png","question":"Rasmdagi 1-raqamli (8 raqamli) nishonda bajariladigan 2-mashqda \"a'lo\" baho necha ball to'plaganda qo'yiladi?","options":{"A":"30 ball","B":"45 ball","C":"35 ball","D":"40 ball"},"answer":"D","explanation":"2-mashqda baholash ball hisobida: \"a'lo\" — 40 ball, \"yaxshi\" — 35 ball, \"qoniqarli\" — 30 ball.","mnemonic":"A'lo — 40, har baho 5 balldan kamayadi.","source":"11-sinf, 138-bet, 2-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_nishonlar.png"},{"id":38,"subtopic":"O'qdon qismlari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_oqdon.png","question":"Rasmda AK-74 o'qdoni qismlarga ajratilgan holda ko'rsatilgan. 5-raqam bilan belgilangan qism nima deb ataladi?","options":{"A":"Prujina","B":"Tayanch bo'rtmasi","C":"Yuboruvchi","D":"Ilgich"},"answer":"C","explanation":"5-raqam — yuboruvchi: prujina kuchi bilan patronlarni yuqoriga, stvol qutisiga uzatib turadi. Prujina o'zi 4-raqamda, tayanch bo'rtmasi — 6, ilgich — 7-raqamda.","mnemonic":"Yuboruvchi — patronni yo'lga 'jo'natadi'.","source":"10-sinf, 101-bet, 12-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_oqdon.png"},{"id":39,"subtopic":"O'qdon qismlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ak74_oqdon.png","question":"Rasmdagi raqamlar va o'qdon qismlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – korpus, 2 – qopqoq, 4 – prujina","B":"1 – qopqoq, 2 – korpus, 4 – yuboruvchi","C":"1 – korpus, 2 – mahkamlovchi planka, 4 – yuboruvchi","D":"1 – qopqoq, 2 – prujina, 4 – mahkamlovchi planka"},"answer":"A","explanation":"To'g'ri moslik: 1 — korpus (patronlar joylashadigan asosiy qism), 2 — qopqoq, 4 — prujina. Qolgan qismlar: 3 — mahkamlovchi planka, 5 — yuboruvchi, 6 — tayanch bo'rtmasi, 7 — ilgich.","mnemonic":"Katta egri tana — korpus (1).","source":"10-sinf, 101-bet, 12-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_oqdon.png"},{"id":40,"subtopic":"Nayza-pichoq qismlari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_nayza.png","question":"Rasmda AK-74 nayza-pichog'i ko'rsatilgan. Tig'ning 2-raqam bilan belgilangan qismi nima?","options":{"A":"Kesuvchi qirra","B":"Charxlangan uchi","C":"Bo'ylama kesma","D":"Arra"},"answer":"D","explanation":"Tig'ning orqa (ustki) tomonida arra (2-raqam) joylashgan — u sim va boshqa materiallarni kesishga xizmat qiladi. Kesuvchi qirra — 1, charxlangan uchi — 3, bo'ylama kesma — 10-raqamda.","mnemonic":"Tig' usti tishli — arra.","source":"10-sinf, 101-bet, 13-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_nayza.png"},{"id":41,"subtopic":"Nayza-pichoq qismlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ak74_nayza.png","question":"Rasmdagi nayza-pichoq raqamlari va qism nomlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – arra, 6 – kamar, 11 – halqa","B":"1 – kesuvchi qirra, 6 – halqa, 11 – tortqi","C":"1 – charxlangan uchi, 6 – tortqi, 11 – kamar","D":"1 – kesuvchi qirra, 6 – teshik, 11 – qo'shuvchi vint"},"answer":"B","explanation":"To'g'ri moslik: 1 — kesuvchi qirra (tig'ning pastki o'tkir tomoni), 6 — halqa (stvolga kiydiriladi), 11 — tortqi. Arra — 2, teshik — 4, kamar — 5, qo'shuvchi vint — 9-raqamda.","mnemonic":"Pastki o'tkir tomon — kesuvchi qirra (1).","source":"10-sinf, 101-bet, 13-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_nayza.png"},{"id":42,"subtopic":"Tormoz-kompensator vazifasi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_tormoz.png","question":"Rasmda qurol stvolining uchiga o'rnatiladigan qism (tormoz-kompensator) ko'rsatilgan. U qanday vazifani bajaradi?","options":{"A":"O'qlar urishi yo'nalishlarini jamlaydi va qurolning siltanish energiyasini kamaytiradi","B":"Gaz porsheni harakatini yo'naltiradi va gaz bosimini taqsimlaydi","C":"Zatvor ramasini zatvor bilan birga oldingi holatga qaytaradi","D":"O't ochishda avtomatchining qo'llarini kuyishdan asraydi"},"answer":"A","explanation":"Tormoz-kompensator o'qlar urishi yo'nalishlarini jamlash va qurolning siltanish (tepish) energiyasini kamaytirishga xizmat qiladi. Gaz harakatini gaz trubkasi yo'naltiradi, oldingi holatga qaytarishni qaytaruvchi mexanizm bajaradi, qo'llarni stvolosti qoplamasi asraydi.","mnemonic":"Kompensator — siltanishni 'kompensatsiya' qiladi.","source":"10-sinf, 100-bet, 8-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_tormoz.png"},{"id":43,"subtopic":"Tormoz-kompensator qismlari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_tormoz.png","question":"Rasmdagi tormoz-kompensatorning 4-raqam bilan belgilangan qismi qaysi javobda to'g'ri ko'rsatilgan?","options":{"A":"Yon almashinuv tuynuklari","B":"Magazin yorma yo'li","C":"Stvol ichki rezbasi","D":"So'ndiruvchi tirqishlar"},"answer":"D","explanation":"4-raqam — so'ndiruvchi tirqishlar: porox gazlarining bir qismini yon tomonga chiqarib, siltanishni so'ndiradi. Tuynuklari — 2, yorma — 3, ichki rezba — 7-raqamda.","mnemonic":"Tirqish gazni 'so'ndiradi' — 4.","source":"10-sinf, 100-bet, 8-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_tormoz.png"},{"id":44,"subtopic":"Zatvor qismlari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ak74_zatvor.png","question":"Rasmda AK-74 zatvori ko'rsatilgan. 5-raqam bilan belgilangan, stvol kanalini qulflashda ishtirok etadigan qism nima?","options":{"A":"Yetaklovchi bo'rtma","B":"Jangovar bo'rtma","C":"Uloqtirgich o'qi","D":"Gilza uchun kesma"},"answer":"B","explanation":"5-raqam — jangovar bo'rtmalar: zatvor burilganda stvol qutisi kesmalariga kirib, stvol kanalini qulflaydi. Yetaklovchi bo'rtma — 3, gilza uchun kesma — 1, uloqtirgich o'qi — 7-raqamda.","mnemonic":"Qulflaydigan — jangovar bo'rtma.","source":"10-sinf, 99-bet, 7-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_ak74_zatvor.png"},{"id":45,"subtopic":"Tozalash anjomlari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_tozalash_anjom.png","question":"Rasmda AK-74 ni tozalash anjomlari ko'rsatilgan. 8-raqam bilan belgilangan idish nima uchun ishlatiladi?","options":{"A":"Tozalash latta-paxtasini saqlash uchun","B":"Patronlarni vaqtincha saqlash uchun","C":"Moy saqlash uchun (moydon)","D":"Anjomlarni solib qo'yish uchun (penal)"},"answer":"C","explanation":"8-raqam — moydon, ya'ni qurolni moylash uchun moy saqlanadigan idish. Anjomlar solinadigan penal — 6-raqamda. Moydon idish shaklida, penal esa g'ilof-quticha ko'rinishida bo'ladi.","mnemonic":"Moydon — moy 'doni' (idishi), 8-raqam.","source":"10-sinf, 103-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_tozalash_anjom.png"},{"id":46,"subtopic":"Tozalash anjomlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_tozalash_anjom.png","question":"Rasmdagi raqamlar va tozalash anjomlari nomlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – o'tkazgich, 6 – moydon, 9 – shompol","B":"1 – shompol, 6 – oboymalar, 9 – penal","C":"1 – artkich, 6 – penal, 9 – o'tkazgich","D":"1 – shompol, 6 – penal, 9 – oboymalar"},"answer":"D","explanation":"To'g'ri moslik: 1 — shompol (uzun tozalash tayoqchasi), 6 — penal (anjomlar g'ilofi), 9 — oboymalar (patronlarni tez joylash uchun). Artkich — 2, o'tkazgich — 10, moydon — 8-raqamda.","mnemonic":"Eng uzuni — shompol (1).","source":"10-sinf, 103-bet, 1-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_tozalash_anjom.png"},{"id":47,"subtopic":"O'qdonni to'ldirish usullari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_oqdon_toldirish.png","question":"Fotolarda o'qdonni patronlar bilan to'ldirishning ikki usuli ko'rsatilgan. 1-raqamli fotoda qanday usul qo'llanilmoqda?","options":{"A":"Oboyma va o'tkazgich yordamida to'ldirish","B":"Bosh barmoq bosimi bilan bittadan joylash","C":"Lenta orqali uzluksiz to'ldirish","D":"Maxsus to'ldirish moslamasi bilan to'ldirish"},"answer":"B","explanation":"1-fotoda patronlar bosh barmoq bosimi bilan o'qdonning yon devorlaridagi bukilgan bo'rtiqlar ostiga bittadan joylanmoqda. 2-fotoda esa oboyma va o'tkazgich yordamida to'ldirish ko'rsatilgan. Lenta avtomatda emas, pulemyotlarda qo'llanadi.","mnemonic":"Bittadan — bosh barmoq bilan.","source":"10-sinf, 104-bet, 2-3-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_oqdon_toldirish.png"},{"id":48,"subtopic":"Oboyma bilan to'ldirish tartibi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"sequence","requires_image":true,"image":"/images/chqbt_oqdon_toldirish.png","question":"2-fotodagi usulda o'qdon to'ldiriladi. Harakatlarni TO'G'RI tartibda joylashtiring: a) patronli oboyma o'tkazgichga o'rnatiladi; b) o'tkazgich o'qdon bo'g'ziga biriktiriladi; d) bo'sh oboyma ajratib olinadi; e) patronlar o'qdonga cho'ktiriladi.","options":{"A":"b → a → e → d","B":"a → b → d → e","C":"b → e → a → d","D":"a → e → b → d"},"answer":"A","explanation":"Avval o'tkazgich o'qdon bo'g'zidagi kesmalarga biriktiriladi (b), keyin unga patronli oboyma o'rnatiladi (a), patronlar barmoq bosimi bilan o'qdonga cho'ktiriladi (e) va bo'sh oboyma ajratib olinib, keyingisi qo'yiladi (d). Oboyma qo'llanilganda to'ldirish jarayoni tezlashadi.","mnemonic":"O'tkazgich → oboyma → bos → almashtir.","source":"10-sinf, 104-bet, 3-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_oqdon_toldirish.png"},{"id":49,"subtopic":"Oboymadagi patronlar yo'nalishi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_oqdon_toldirish.png","question":"2-fotodagi kabi oboyma o'tkazgichga o'rnatilayotganda oboymadagi patronlarning o'qlari qaysi tomonga yo'naltirilgan bo'lishi lozim?","options":{"A":"Pastga","B":"O'qdon tomonga","C":"Yuqoriga","D":"Otuvchi tomonga"},"answer":"C","explanation":"Oboyma o'tkazgichga o'rnatilayotganda patronlarning o'qlari (uchlari) yuqoriga yo'naltirilgan bo'lishi lozim — fotoda ham o'qlar yuqoriga qaragan. Shundan keyin patronlar barmoq bosimi bilan pastga, o'qdonga cho'ktiriladi.","mnemonic":"Oboymada o'qlar — tepaga.","source":"10-sinf, 104-bet, 3-rasm","topic":"Darslik rasmlari asosida qurollarni tanish va amallarni aniqlash","subject":"CHQBT","_cat":"Otish","_img":"public/images/chqbt_oqdon_toldirish.png"},{"id":1,"subtopic":"Sherengali saf (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_saf_sherenga.png","question":"Rasmda guruh qanday saf tartibida turibd
