i?","options":{"A":"Bir kolonnali yurish safida","B":"Ikki sherengali yonma-yon safda","C":"Bir sherengali yonma-yon safda","D":"Uch kolonnali yurish safida"},"answer":"B","explanation":"Rasmda guruh ikki sherengaga saflanib, yonma-yon safda turibdi: askarlar ikki qatorda, biri ikkinchisining orqasida (1 qadam masofada) joylashgan. Bunday safga \"Guruh, ikki sherengaga SAFLAN!\" komandasi bilan o'tiladi.","mnemonic":"Ikki qator = ikki sherenga.","source":"11-sinf, 13-bet, 2-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_saf_sherenga.png"},{"id":2,"subtopic":"Kolonnali saf (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_saf_kolonna.png","question":"Rasmda guruh yurish uchun saflangan. Guruh nechta kolonnaga saflangan?","options":{"A":"Bitta","B":"Ikkita","C":"Uchta","D":"To'rtta"},"answer":"C","explanation":"Rasmda guruh uch kolonnaga saflangan: oldindan qaraganda uch askar yonma-yon, qolganlari ularning ortida. Bunday saf \"Guruh, uch kolonnaga SAFLAN!\" komandasi bilan tuziladi.","mnemonic":"Old qatorda nechta bo'lsa — shuncha kolonna.","source":"11-sinf, 14-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_saf_kolonna.png"},{"id":3,"subtopic":"Avtomatni ko'krakka olish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_avtomat_kokrakka.png","question":"Rasmdagi a, b, d holatlarda jangchi qaysi saf amalini bajarmoqda?","options":{"A":"Avtomatni \"tasmaga\"dan \"ko'krakka\" holatiga o'tkazish","B":"Avtomatni \"ko'krakka\"dan \"tasmaga\" holatiga qaytarish","C":"Avtomatni \"yelkaga\" holatiga ko'tarib qo'yish","D":"Avtomatni tekshirish uchun otishga shaylash"},"answer":"A","explanation":"Rasmda \"Avtomat ko'krak-KA!\" komandasi bo'yicha qurolni \"tasmaga\" holatidan \"ko'krakka\" holatiga olib o'tish ko'rsatilgan: a — tasma bo'ylab qurol ko'tariladi, b — tirsak tasma orqali o'tkaziladi, d — qurol ko'krakka tushiriladi.","mnemonic":"Tasmadan ko'krakka — a, b, d.","source":"11-sinf, 23-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_avtomat_kokrakka.png"},{"id":4,"subtopic":"Saf usuli hisoblari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_avtomat_kokrakka.png","question":"Rasmda ko'rsatilgan amal (avtomatni \"ko'krakka\" holatiga o'tkazish) nechta hisobda (usulda) bajariladi?","options":{"A":"Ikkita","B":"To'rtta","C":"Beshta","D":"Uchta"},"answer":"D","explanation":"Amal uchta hisobda bajariladi — rasmdagi a, b, d holatlar shu uch hisobga mos: birinchi, ikkinchi va uchinchi usul (hisob) ketma-ket bajariladi.","mnemonic":"a-b-d = 3 hisob.","source":"11-sinf, 23-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_avtomat_kokrakka.png"},{"id":5,"subtopic":"Kuzatuv minorasi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_qorovul_inshoot.png","question":"Rasmning chap tomonidagi balandligi 9,5 m gacha bo'lgan inshoot qorovul xizmatida qanday nomlanadi?","options":{"A":"Post soyaboni","B":"Kuzatuv minorasi","C":"Qorovulxona","D":"Nazorat-o'tkazish punkti"},"answer":"B","explanation":"Chapdagi inshoot — kuzatuv minorasi: soqchi undan turib qo'riqlanadigan obyekt va atrofni kuzatadi. O'ngdagi soyabon esa soqchini yog'ingarchilikdan saqlaydigan post soyaboni.","mnemonic":"Baland zinali inshoot — kuzatuv minorasi.","source":"11-sinf, 62-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_qorovul_inshoot.png"},{"id":6,"subtopic":"Post soyaboni (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_qorovul_inshoot.png","question":"Rasmning o'ng tomonidagi qo'ziqorinsimon inshoot postda qanday vazifani bajaradi?","options":{"A":"Soqchini quyosh va yog'ingarchilikdan himoyalaydi","B":"Post jihozlari va o'q-dorilarni saqlaydi","C":"Signal va aloqa vositalarini joylashtiradi","D":"Atrofni kuzatish uchun balandlik beradi"},"answer":"A","explanation":"O'ngdagi inshoot — post soyaboni: soqchi postda turganda uni quyosh, yomg'ir va qordan himoya qiladi. Kuzatuv uchun esa chapdagi 9,5 m li kuzatuv minorasi xizmat qiladi.","mnemonic":"Qo'ziqorin = soyabon.","source":"11-sinf, 62-bet, 4-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_qorovul_inshoot.png"},{"id":7,"subtopic":"Pogon: polkovnik (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_pogonlar.png","question":"Rasmda harbiy unvonlar pogonlari raqamlangan. Ikkita bo'ylama chiziqli va uchta yulduzli 5-raqamli pogon qaysi unvonga tegishli?","options":{"A":"Podpolkovnik","B":"Kapitan","C":"Polkovnik","D":"General-polkovnik"},"answer":"C","explanation":"Ikki bo'ylama chiziq — katta ofitserlar belgisi, uchta yulduz esa polkovnik unvonini bildiradi. Podpolkovnikda ikki chiziqda ikkita yulduz, kapitanda bitta chiziqda to'rtta kichik yulduz, general-polkovnikda chiziqsiz uchta katta yulduz bo'ladi.","mnemonic":"Ikki chiziq + uch yulduz = polkovnik.","source":"10-sinf, 26-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_pogonlar.png"},{"id":8,"subtopic":"Pogon: leytenant (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_pogonlar.png","question":"Bitta bo'ylama chiziqda ikkita yulduzi bo'lgan leytenant pogoni rasmda qaysi raqamda?","options":{"A":"4-raqamda","B":"1-raqamda","C":"5-raqamda","D":"3-raqamda"},"answer":"A","explanation":"Leytenant pogoni — 4-raqam: bitta bo'ylama chiziq (kichik ofitserlar belgisi) va yonma-yon ikkita yulduz. 1-raqamda kapitan (to'rt yulduz), 5-raqamda polkovnik (ikki chiziq), 3-raqamda general-mayor (bitta katta yulduz).","mnemonic":"Bir chiziq, ikki yulduz — leytenant.","source":"10-sinf, 26-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_pogonlar.png"},{"id":9,"subtopic":"Pogon: general-mayor (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_pogonlar.png","question":"Rasmdagi 3-raqamli pogonda chiziqlar yo'q, bitta katta yulduz bor. Bu qaysi unvon?","options":{"A":"Mayor","B":"General-mayor","C":"Serjant","D":"Katta leytenant"},"answer":"B","explanation":"Naqshli maydonda chiziqsiz bitta katta yulduz — general-mayor pogoni (generallar tarkibi). Mayorda bitta yulduz bo'lsa-da, pogonida ikki bo'ylama chiziq bo'ladi; katta leytenantda uch kichik yulduz, serjantda yulduz emas, chevronlar bo'ladi.","mnemonic":"Katta yulduz, chiziqsiz — general.","source":"10-sinf, 26-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_pogonlar.png"},{"id":10,"subtopic":"Pogonlarni moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_pogonlar.png","question":"Rasmdagi pogon raqamlari va unvonlarning TO'G'RI mosligini tanlang.","options":{"A":"1 – leytenant, 2 – kichik serjant, 6 – oddiy askar","B":"1 – polkovnik, 4 – kapitan, 6 – kichik serjant","C":"2 – kichik serjant, 4 – leytenant, 6 – oddiy askar","D":"1 – kapitan, 2 – oddiy askar, 6 – kichik serjant"},"answer":"D","explanation":"To'g'ri moslik: 1 — kapitan (bir chiziq, to'rt yulduz), 2 — oddiy askar (belgisiz toza pogon), 6 — kichik serjant (ikkita chevron). Qolganlari: 3 — general-mayor, 4 — leytenant, 5 — polkovnik.","mnemonic":"Toza pogon — oddiy askar, chevron — serjant.","source":"10-sinf, 26-bet, 1-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_pogonlar.png"},{"id":11,"subtopic":"Yechilgan bosh kiyimni tutish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_bosh_kiyim.png","question":"Fotoda \"Bosh kiyim YECHILSIN!\" komandasi bajarilgan holat ko'rsatilgan. Nizomga ko'ra yechilgan bosh kiyim qanday tutiladi?","options":{"A":"Erkin tushirilgan chap qo'lga, nishoni old tomonga qaratilgan holatda","B":"O'ng qo'lga, nishoni orqa tomonga qaratilgan holatda","C":"Chap qo'ltiq ostiga qisib, nishoni ichkariga qaratib","D":"Bel kamariga qistirib, nishoni yuqoriga qaratib"},"answer":"A","explanation":"Yechilgan bosh kiyim erkin tushirilgan chap qo'lga, nishoni (kokardasi) old tomonga qaratilgan holatda olinadi — fotoda ham shu holat ko'rsatilgan. Zarur hollarda yakka turgan harbiy xizmatchi bosh kiyimini komandasiz yechib, kiyadi.","mnemonic":"Bosh kiyim — chap qo'lda, nishon oldinda.","source":"10-sinf, 40-bet, 4-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_bosh_kiyim.png"},{"id":12,"subtopic":"TUR! komandasi holati (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tur_komanda.png","question":"Fotoda harbiy xizmatchining old va orqa ko'rinishi berilgan: chap oyoq yarim qadam yonga tashlangan, qo'llar orqada qovushtirilgan. Bu qaysi komandaning bajarilishi?","options":{"A":"«ERKIN!» — bir oyoqni bo'shatib turish","B":"«ROSTLAN!» — qaddini tik tutish holati","C":"\"Oyoqlar yelka kengligida, TUR!\"","D":"«JOYIDA QADAM!» — joyida yurish"},"answer":"C","explanation":"Ekipirovkasiz xizmatchi \"Oyoqlar yelka kengligida, TUR!\" komandasida chap oyog'ini yarim qadam yonga tashlab, qo'llarini orqaga oladi va bel kamarining ustki qismida qovushtiradi. \"ERKIN!\"da esa faqat gavda va bir oyoq bo'sh qo'yiladi, oyoq yonga tashlanmaydi.","mnemonic":"Oyoqlar kerilgan + qo'llar orqada = TUR!","source":"10-sinf, 40-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_tur_komanda.png"},{"id":13,"subtopic":"TUR! komandasidan oldingi komanda (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_tur_komanda.png","question":"Fotodagi \"Oyoqlar yelka kengligida, TUR!\" holati qabul qilinishidan OLDIN qaysi komanda berilishi lozim?","options":{"A":"\"DIQQAT!\"","B":"\"ERKIN!\"","C":"\"SAFLAN!\"","D":"\"TO'G'RILANSIN!\""},"answer":"B","explanation":"\"Oyoqlar yelka kengligida, TUR!\" komandasidan oldin \"ERKIN!\" komandasi beriladi. \"DIQQAT!\" komandasi esa, aksincha, bu holatdan dastlabki (qad rostlagan) holatga qaytish uchun xizmat qiladi.","mnemonic":"Oldin ERKIN, qaytish — DIQQAT.","source":"10-sinf, 39-40-betlar","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_tur_komanda.png"},{"id":14,"subtopic":"TEKISLAN! komandasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tekislan.png","question":"Fotoda yonma-yon turgan saf a'zolari boshlarini bir tomonga burib turibdi. Saf qaysi komandani bajarmoqda?","options":{"A":"\"ROSTLAN!\"","B":"\"Guruh, TARQAL!\"","C":"\"DIQQAT!\"","D":"\"O'ngga TEKISLAN!\""},"answer":"D","explanation":"\"O'ngga (chapga) TEKISLAN!\" komandasida qanotda turgan xizmatchidan tashqari hamma boshini shu tomonga buradi va saf bir chiziqqa tekislanadi. \"ROSTLAN!\"da esa barcha to'g'riga qaraydi.","mnemonic":"Boshlar burilgan — TEKISLAN.","source":"11-sinf, 8-bet, 2-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_tekislan.png"},{"id":15,"subtopic":"TARQAL! komandasi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tarqal.png","question":"Fotoda guruh a'zolari har tomonga tarqalib ketmoqda. Bu qaysi komandaning bajarilishi va guruhni qayta yig'ish uchun qanday komanda beriladi?","options":{"A":"\"ERKIN!\" — yig'ish uchun \"ROSTLAN!\"","B":"\"Guruh, TARQAL!\" — yig'ish uchun \"Guruh, ... SAFLAN!\"","C":"\"O'ngga TEKISLAN!\" — yig'ish uchun \"DIQQAT!\"","D":"\"Guruh, TARQAL!\" — yig'ish uchun \"TO'G'RILANSIN!\""},"answer":"B","explanation":"\"Guruh, TARQAL!\" komandasida xizmatchilar har tomon tarqab ketadi. Shaxsiy tarkibni qayta yig'ish uchun \"Guruh, (chapdan, o'ngdan, ortimdan, oldimdan) SAFLAN!\" komandasi beriladi — xizmatchilar yugurib kelib, komandirning komandasi bo'yicha saflanadi.","mnemonic":"TARQAL — tarqat, SAFLAN — yig'.","source":"11-sinf, 9-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_tarqal.png"},{"id":16,"subtopic":"Qo'shin turlari emblemalari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_emblemalar.png","question":"Rasmda qo'shin turlarini farqlovchi nishonlar (emblemalar) raqamlangan. Parashyut tasvirlangan 4-raqamli emblema qaysi qo'shin turiga tegishli?","options":{"A":"Havo-desant qo'shinlari","B":"Harbiy havo kuchlari","C":"Havo hujumidan mudofaa qo'shinlari","D":"Maxsus operatsiya kuchlari"},"answer":"A","explanation":"Parashyut tasvirlangan emblema — havo-desant qo'shinlarining farqlovchi nishoni. Harbiy havo kuchlari nishonida qanotlar va parrak (3-raqam), tank qo'shinlarida tank (1-raqam) tasvirlanadi.","mnemonic":"Parashyut — desant.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar.png"},{"id":17,"subtopic":"Emblemalarni moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_emblemalar.png","question":"Rasmdagi raqamlar va qo'shin turlari (xizmatlar)ning TO'G'RI mosligini tanlang.","options":{"A":"1 – avtomobil qo'shinlari, 2 – tibbiy ta'minot xizmati, 5 – aloqa qo'shinlari","B":"1 – tank qo'shinlari, 2 – radiatsion muhofaza qo'shinlari, 5 – yuridik xizmat","C":"1 – tank qo'shinlari, 2 – tibbiy ta'minot va veterinariya xizmati, 5 – harbiy ansambl","D":"1 – muhandislik qo'shinlari, 2 – yuridik xizmat, 5 – harbiy ansambl"},"answer":"C","explanation":"To'g'ri moslik: 1 — tank qo'shinlari (tank tasviri), 2 — tibbiy ta'minot va veterinariya xizmati (kosa va ilon), 5 — harbiy ansambl (lira). Qolganlari: 3 — harbiy havo kuchlari, 4 — havo-desant, 6 — artilleriya qo'shinlari.","mnemonic":"Tank — tankchilar, kosa-ilon — tibbiyot, lira — ansambl.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar.png"},{"id":18,"subtopic":"Qo'shin turlari emblemalari — 2 (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_emblemalar2.png","question":"Rasmda qo'shin turlarini farqlovchi nishonlar raqamlangan. Qanotli g'ildirak tasvirlangan 5-raqamli emblema qaysi qo'shin turiga tegishli?","options":{"A":"Tank qo'shinlari","B":"Havo-desant qo'shinlari","C":"Avtomobil qo'shinlari","D":"Muhandislik qo'shinlari"},"answer":"C","explanation":"Qanotli g'ildirak — avtomobil qo'shinlarining farqlovchi nishoni (g'ildirak — transport, qanotlar — tezlik ramzi). Muhandislik qo'shinlari nishonida texnika-anjomlar (4-raqam), tank qo'shinlarida tank tasvirlanadi.","mnemonic":"Qanotli g'ildirak — avtomobilchilar.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar2.png"},{"id":19,"subtopic":"Emblemalarni moslashtirish — 2 (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_emblemalar2.png","question":"Rasmdagi raqamlar va qo'shin turlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – aloqa qo'shinlari, 3 – umumqo'shin, 4 – muhandislik qo'shinlari","B":"1 – harbiy havo kuchlari, 3 – artilleriya, 4 – avtomobil qo'shinlari","C":"1 – aloqa qo'shinlari, 3 – havo hujumidan mudofaa, 4 – tank qo'shinlari","D":"1 – radiatsion muhofaza, 3 – umumqo'shin, 4 – aloqa qo'shinlari"},"answer":"A","explanation":"To'g'ri moslik: 1 — aloqa qo'shinlari (qanotlar va chaqmoqlar), 3 — umumqo'shin (nurli yulduz), 4 — muhandislik qo'shinlari. Qolganlari: 2 — havo hujumidan mudofaa, 5 — avtomobil, 6 — maxsus operatsiya kuchlari.","mnemonic":"Chaqmoq — aloqa, nurli yulduz — umumqo'shin.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar2.png"},{"id":20,"subtopic":"Havo hujumidan mudofaa emblemasi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_emblemalar2.png","question":"Havo hujumidan mudofaa qo'shinlarining farqlovchi nishoni rasmda qaysi raqamda ko'rsatilgan?","options":{"A":"1-raqamda","B":"2-raqamda","C":"5-raqamda","D":"6-raqamda"},"answer":"B","explanation":"2-raqamli emblema — havo hujumidan mudofaa qo'shinlari (radiolokatsion to'r-antenna tasviri havo hududini kuzatishni anglatadi). 1 — aloqa (chaqmoqlar bilan farqlanadi), 6 — maxsus operatsiya kuchlari (yarim oy).","mnemonic":"Radar to'ri — havo mudofaasi.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar2.png"},{"id":21,"subtopic":"Artilleriya emblemasi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_emblemalar.png","question":"Rasmdagi 6-raqamli emblemada ikkita kesishgan to'p stvoli tasvirlangan. Bu qaysi qo'shin turining nishoni?","options":{"A":"Tank qo'shinlari","B":"Muhandislik qo'shinlari","C":"Umumqo'shin","D":"Artilleriya qo'shinlari"},"answer":"D","explanation":"Kesishgan to'p stvollari — artilleriya qo'shinlarining an'anaviy farqlovchi nishoni. Tank qo'shinlarida tank (1-raqam), tibbiy xizmatda kosa va ilon (2-raqam) tasvirlanadi.","mnemonic":"Kesishgan to'plar — artilleriya.","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar.png"},{"id":22,"subtopic":"Harbiy havo kuchlari emblemasi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_emblemalar.png","question":"Rasmdagi 3-raqamli emblemada qanotlar va parrak tasvirlangan. Bu qaysi qo'shin turining farqlovchi nishoni?","options":{"A":"Havo-desant qo'shinlari","B":"Harbiy havo kuchlari","C":"Havo hujumidan mudofaa qo'shinlari","D":"Maxsus operatsiya kuchlari"},"answer":"B","explanation":"Qanotlar va parrak (propeller) — harbiy havo kuchlarining farqlovchi nishoni. Havo-desant qo'shinlarida parashyut (4-raqam) tasvirlanadi — ikkalasini adashtirmaslik kerak.","mnemonic":"Qanot + parrak — uchuvchilar (HHK).","source":"10-sinf, 28-bet, 3-rasm","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_emblemalar.png"},{"id":23,"subtopic":"Batalyon yurish kolonnasi (sxema)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_batalyon_kolonna.jpg","question":"Sxemada batalyonning yurish kolonnasi ko'rsatilgan. Bo'linmalar orasidagi \"2 q\" belgisi nimani bildiradi?","options":{"A":"Bo'linmalar orasidagi 2 qadam masofani","B":"Har bo'linmada 2 ta qator borligini","C":"Bo'linmalar orasidagi 2 kilometr masofani","D":"Yurish tezligi soatiga 2 kilometr ekanini"},"answer":"A","explanation":"Saf sxemalarida \"q\" — qadam o'lchovi: kolonnada bo'linmalar (vzvodlar, bo'limlar) orasida 2 qadam masofa saqlanadi. Kilometr o'lchovi yurish kolonnasi sxemasida \"km\" bilan ko'rsatiladi.","mnemonic":"Safda masofa qadamda o'lchanadi.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_batalyon_kolonna.jpg"},{"id":24,"subtopic":"Kolonnada bo'linmalar tartibi (sxema)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_batalyon_kolonna.jpg","question":"Sxemadagi batalyon yurish kolonnasida ta'minot bo'linmalari qaysi qismda joylashgan va vzvodlar qanday tartibda boradi?","options":{"A":"Ta'minot — kolonna boshida; oldinda vzvodlar 3-2-1 teskari tartibda boshqaruvdan keyin","B":"Ta'minot — kolonna o'rtasida; vzvodlar va artilleriya aralash tartibda joylashadi","C":"Ta'minot — kolonna boshida, keyin artilleriya, eng oxirida vzvodlar boradi","D":"Ta'minot — eng oxirida; oldinda batalyon boshqaruvi, so'ng 1-, 2-, 3-vzvodlar, keyin artilleriya bo'linmalari"},"answer":"D","explanation":"Sxemaga ko'ra kolonna boshida batalyon boshqaruvi (komandir, shtab boshlig'i), so'ng 1-, 2-, 3-vzvodlar tartib bilan, ulardan keyin artilleriya bo'linmalari, eng oxirida esa ta'minot bo'linmalari boradi.","mnemonic":"Boshqaruv oldinda, ta'minot oxirida.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_batalyon_kolonna.jpg"},{"id":25,"subtopic":"Tankka chiqish uchun saf tortish (sxema)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_chiqish_tank.png","question":"Sxemada mashinaga chiqish uchun shaxsiy tarkibning saf tortishi tasvirlangan. Sxemani to'g'ri izohlovchi javobni toping.","options":{"A":"PJMning kirish lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi","B":"Desant sifatida tankka chiqish uchun shaxsiy tarkibning saf tortishi","C":"ZTRning kirish lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi","D":"Avtomobilning orqa borti orqali chiqish uchun shaxsiy tarkibning saf tortishi"},"answer":"B","explanation":"Romb shaklidagi shartli belgi — tank; ekipaj a'zolari MH, MO va TK (tank komandiri) old tomonda, desant esa tankning ikki yon tomonida bir kolonnadan saf tortgan — desant zirh ustiga yon tomondan chiqadi. PJM va avtomobilda shaxsiy tarkib mashina orqasida saflanadi.","mnemonic":"Romb — tank, desant yonlardan chiqadi.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_chiqish_tank.png"},{"id":26,"subtopic":"PJMga chiqish uchun saf tortish (sxema)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_chiqish_pjm.png","question":"Sxemada shaxsiy tarkibning mashinaga chiqish oldidan saf tortishi berilgan. Ushbu sxemani to'g'ri izohlovchi javob qaysi?","options":{"A":"PJMning kirish lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi","B":"Desant sifatida tankka chiqish uchun shaxsiy tarkibning saf tortishi","C":"Avtomobilning orqa borti orqali chiqish uchun shaxsiy tarkibning saf tortishi","D":"ZTRning kirish lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi"},"answer":"A","explanation":"Old tomoni o'tkir korpus — piyodalar jangovar mashinasi (PJM); ekipaj (MH — mexanik-haydovchi, MO — mergan-operator, K — komandir) oldinda, desant bo'limi (P, G, Gyo, KtO', O') esa mashinaning ORQASIDA ikki kolonnada saflangan — PJMga orqa kirish lyuklari orqali chiqiladi. Tankda desant yon tomonlarda turadi.","mnemonic":"PJM — desant orqadan, ikki kolonnada.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_chiqish_pjm.png"},{"id":27,"subtopic":"Avtomobilga chiqish uchun saf tortish (sxema)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_chiqish_avto.png","question":"Quyidagi sxemada shaxsiy tarkib mashinaga chiqish uchun saflangan. Sxemaga mos izohni aniqlang.","options":{"A":"Desant sifatida tankka chiqish uchun shaxsiy tarkibning saf tortishi","B":"ZTRning kirish lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi","C":"PJMning yon lyuklari orqali chiqish uchun shaxsiy tarkibning saf tortishi","D":"Avtomobilning orqa borti orqali chiqish uchun shaxsiy tarkibning saf tortishi"},"answer":"D","explanation":"To'g'ri burchakli, old qismi yumaloq korpus — avtomobil (kuzov) belgisi; ekipajda faqat haydovchi (H) va komandir (K) bor, shaxsiy tarkib esa kuzov ORQASIDA ikki kolonnada saflangan — avtomobilga orqa bort orqali chiqiladi. PJM/tankdan farqi: zirhli mashina ekipaji (MH, MO) yo'q.","mnemonic":"Kuzov + H haydovchi — avtomobil, orqa bortdan.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_chiqish_avto.png"},{"id":28,"subtopic":"ZTRga chiqish uchun saf tortish (sxema)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_chiqish_ztr.png","question":"Rasmdagi sxemada shaxsiy tarkibning mashinaga chiqish uchun saflanishi ko'rsatilgan. To'g'ri izohni belgilang.","options":{"A":"Avtomobilning orqa borti orqali chiqish uchun shaxsiy tarkibning saf tortishi","B":"Desant sifatida tankka chiqish uchun shaxsiy tarkibning saf tortishi","C":"ZTRning kirish lyuklari orqali chiqish uchun shaxsiy tarkibning saf tortishi","D":"PJMning orqa lyuki orqali chiqish uchun shaxsiy tarkibning saf tortishi"},"answer":"C","explanation":"Zirhli transportyor (ZTR)da shaxsiy tarkib mashinaning IKKI YON tomonida bir kolonnadan saflanadi (P, G, KtO' — chapda; M, P, Gyo, O' — o'ngda), chunki ZTRga yon kirish lyuklari orqali chiqiladi; masofa — 1 qadam. PJMda esa desant mashina orqasida ikki kolonnada turadi.","mnemonic":"ZTR — yon lyuk, saf yonlarda.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_chiqish_ztr.png"},{"id":29,"subtopic":"Tank ekipaji belgilari (sxema)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_chiqish_tank.png","question":"Sxemada tank oldida saf tortgan ekipaj a'zolari MH, MO va TK belgilari bilan ko'rsatilgan. Bu belgilar kimlarni bildiradi?","options":{"A":"Mexanik-haydovchi, mergan-operator va tank komandiri","B":"Motoo'qchi, minachi va texnik-kuzatuvchi","C":"Mergan, haydovchi va tibbiyot kursanti","D":"Mexanik, operator yordamchisi va tergovchi-kuzatuvchi"},"answer":"A","explanation":"Tank ekipaji uch kishidan iborat: MH — mexanik-haydovchi, MO — mergan-operator (o'q otuvchi), TK — tank komandiri. Sxemada ular tankning old tomonida, mashinadan 2 qadam masofada saf tortgan.","mnemonic":"Tank ekipaji: haydaydi — otadi — boshqaradi.","source":"Saf nizomi sxemasi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida saf tartibi va qorovul jihozlarini aniqlash","subject":"CHQBT","_cat":"Saf","_img":"public/images/chqbt_chiqish_tank.png"},{"id":1,"subtopic":"Texnika tanish: T-72 (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_texnika.png","question":"Rasmda O'zbekiston Qurolli Kuchlaridagi jangovar texnikalar raqamlangan. T-72 tanki qaysi raqamda?","options":{"A":"1-raqamda","B":"3-raqamda","C":"5-raqamda","D":"4-raqamda"},"answer":"A","explanation":"T-72 tanki — 1-raqam: zanjirli yurish qismi, aylanuvchi minora va uzun 125 mm li zambarak unga xos. 3 — BTR-80 (g'ildirakli), 5 — BMP-2, 4 — SU-27 samolyoti.","mnemonic":"Zanjir + katta zambarak = tank.","source":"10-sinf, 117-bet, 3-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_texnika.png"},{"id":2,"subtopic":"Texnika tanish: BTR-80 (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_texnika.png","question":"Rasmdagi 3-raqamli, sakkiz g'ildirakli jangovar texnika qaysi?","options":{"A":"T-72 tanki","B":"BMP-2 piyoda jangovar mashinasi","C":"BTR-80 bronetransportyori","D":"BMD desant mashinasi"},"answer":"C","explanation":"3-raqamda BTR-80 bronetransportyori: 8 g'ildirakli (zanjirsiz), motoo'qchi bo'linmalar bilan jang olib borish va shaxsiy tarkibni tashish uchun mo'ljallangan, suzish xususiyatiga ega.","mnemonic":"8 g'ildirak = BTR-80.","source":"10-sinf, 116-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_texnika.png"},{"id":3,"subtopic":"Texnika tanish: BMP-2 (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_texnika.png","question":"Rasmdagi 5-raqamli, zanjirli yurish qismiga ega yengil bronlangan mashina qaysi texnika?","options":{"A":"BTR-80 bronetransportyori","B":"BMP-2 piyoda jangovar mashinasi","C":"T-72 tanki","D":"Artilleriya tortuvchisi"},"answer":"B","explanation":"5-raqamda BMP-2 — piyoda jangovar mashinasi: zanjirli, 30 mm li avtomatik to'p bilan qurollangan, piyodalar bilan birgalikda jang olib borish uchun mo'ljallangan. BTR-80 dan zanjiri bilan farq qiladi.","mnemonic":"Zanjirli + kichik minora = BMP.","source":"10-sinf, 117-bet, 2-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_texnika.png"},{"id":4,"subtopic":"Texnika tanish: Ka-52 (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_texnika.png","question":"Ikki parrak (vint)i ustma-ust joylashgan Ka-52 \"ALLIGATOR\" vertolyoti rasmda qaysi raqamda?","options":{"A":"6-raqamda","B":"4-raqamda","C":"1-raqamda","D":"2-raqamda"},"answer":"D","explanation":"Ka-52 \"ALLIGATOR\" — 2-raqam: uning eng yorqin belgisi ustma-ust (soosial) joylashgan ikkita asosiy parrak, dum parragi yo'q. 6-raqamdagi MI-24 da esa bitta asosiy parrak va dum parragi bor.","mnemonic":"Ikki qavat parrak = Ka-52.","source":"10-sinf, 121-bet, 2-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_texnika.png"},{"id":5,"subtopic":"Texnika tahlili: aviatsiya (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_texnika.png","question":"Rasmdagi texnikalardan qaysi raqamlilar harbiy aviatsiya texnikasiga kiradi?","options":{"A":"1, 3, 5-raqamlilar","B":"2, 4, 6-raqamlilar","C":"2, 3, 4-raqamlilar","D":"4, 5, 6-raqamlilar"},"answer":"B","explanation":"Aviatsiya texnikasi: 2 — Ka-52 vertolyoti, 4 — SU-27 qiruvchi samolyoti, 6 — MI-24 vertolyoti. 1 (T-72), 3 (BTR-80), 5 (BMP-2) — quruqlikdagi qo'shinlar texnikasi.","mnemonic":"Juft raqamlar — osmonda.","source":"10-sinf, 120-121-bet","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_texnika.png"},{"id":6,"subtopic":"TM-62 tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_tm62_qirqim.png","question":"Rasmda qismlari raqamlangan qirqim ko'rsatilgan. Bu qanday qurol qirqimi?","options":{"A":"Piyodalarga qarshi PMN-2 minasi","B":"RGD-5 qo'l granatasi","C":"Tankka qarshi TM-62 minasi","D":"Artilleriya snaryadi"},"answer":"C","explanation":"Bu TM-62 seriyasidagi tankka qarshi fugasli mina qirqimi: yassi silindrsimon qobiq ichida asosiy zaryad, ustki markazida portlatkich o'rnatiladigan rezbali stakan bor.","mnemonic":"Yassi doira mina — TM-62 (Tankka qarshi Mina).","source":"10-sinf, 127-bet, 2-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_tm62_qirqim.png"},{"id":7,"subtopic":"TM-62: asosiy zaryad (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tm62_qirqim.png","question":"TM-62 minasi qirqimida portlash kuchini beruvchi asosiy zaryad qaysi raqam bilan ko'rsatilgan?","options":{"A":"2-raqam","B":"4-raqam","C":"1-raqam","D":"6-raqam"},"answer":"D","explanation":"Asosiy zaryad — 6-raqam (minaning pastki katta qismini to'ldiradi). 1 — maxsus quloqchalar, 2 — qopqoq, 3 — qo'shimcha zaryad, 4 — rezbali stakan, 5 — qobiq.","mnemonic":"Eng katta hajm — asosiy zaryad (6).","source":"10-sinf, 127-bet, 2-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_tm62_qirqim.png"},{"id":8,"subtopic":"TM-62: rezbali stakan (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_tm62_qirqim.png","question":"Minani jangovar holatga keltirishda portlatkich o'rnatiladigan rezbali stakan rasmda qaysi raqamda?","options":{"A":"4-raqamda","B":"5-raqamda","C":"6-raqamda","D":"1-raqamda"},"answer":"A","explanation":"Rezbali stakan — 4-raqam, minaning ustki markazida joylashgan: portlatkich shu yerga buraladi. 5 — qobiq (metall, plastmassa yoki boshqa materialdan bo'lishi mumkin).","mnemonic":"Markazdagi rezba — portlatkich joyi (4).","source":"10-sinf, 127-bet, 2-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_tm62_qirqim.png"},{"id":9,"subtopic":"Adrianov kompasi tanish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_kompas.png","question":"Rasmda qismlari raqamlangan topografik asbob ko'rsatilgan. Bu qanday asbob?","options":{"A":"Artilleriya burchak o'lchagichi","B":"Adrianov kompasi","C":"Durbin","D":"Balandlik o'lchagich (altimetr)"},"answer":"B","explanation":"Bu Adrianov kompasi — gorizont tomonlarini va magnit azimutini aniqlash uchun ishlatiladi. Qismlar: 1 — qobiq, 2 — limb, 3 — magnit mil, 4 — qarash moslamasi, 5 — hisob olgich, 6 — to'xtatkich.","mnemonic":"Harbiy kompas — Adrianov.","source":"10-sinf, 130-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_kompas.png"},{"id":10,"subtopic":"Kompas: limb (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_kompas.png","question":"Azimut burchagini hisoblash uchun ishlatiladigan gradusli aylana shkala (limb) rasmda qaysi raqamda?","options":{"A":"3-raqamda","B":"1-raqamda","C":"2-raqamda","D":"5-raqamda"},"answer":"C","explanation":"Limb — 2-raqam: burchak qiymatlari yozilgan aylana shkala, undan azimut hisobi olinadi. 1 — qobiq, 3 — magnit mil, 5 — hisob olgich.","mnemonic":"Gradusli halqa — limb (2).","source":"10-sinf, 130-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_kompas.png"},{"id":11,"subtopic":"Kompas: to'xtatkich (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_kompas.png","question":"Kompas ishlatilmayotganda magnit milni qotirib (to'xtatib) turuvchi qism rasmda qaysi raqamda?","options":{"A":"4-raqamda","B":"2-raqamda","C":"5-raqamda","D":"6-raqamda"},"answer":"D","explanation":"To'xtatkich — 6-raqam: u magnit milni (3) qotirib turadi, shu bilan mil ko'tarib yurganda beparvo tebranib yeyilmaydi. O'lchashda to'xtatkich bo'shatiladi.","mnemonic":"Milni qotiruvchi tormoz — 6.","source":"10-sinf, 130-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_kompas.png"},{"id":12,"subtopic":"Yakkalik okop tanish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_yakkalik_okop.png","question":"Rasmda o'lchamlari ko'rsatilgan muhandislik inshooti tasvirlangan. Bu nima?","options":{"A":"Yotib otish uchun yakkalik okop","B":"Panohgoh kirish qismi","C":"Tanklarga qarshi xandaq","D":"Aloqa yo'lagi (transheya)"},"answer":"A","explanation":"Bu dushman o't yog'dirib turganda yotib otish uchun qaziladigan yakkalik okop: uzunligi 170 sm, old tomonida brustver (tuproq do'ngligi) bor. Keyinchalik yakkalik okoplar o'zaro bog'lanib, seksiya okopi hosil qilinadi.","mnemonic":"Bir kishilik chuqurcha — yakkalik okop.","source":"11-sinf, 146-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_yakkalik_okop.png"},{"id":13,"subtopic":"Okop: brustver himoyasi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_yakkalik_okop.png","question":"Rasmdagi okop oldidagi tuproq do'ngligi (brustver) qalinligi qancha bo'lganda askar dushman o'qotar qurollaridan butunlay himoyalanadi?","options":{"A":"10–15 sm","B":"50–60 sm","C":"20–25 sm","D":"100–120 sm"},"answer":"B","explanation":"Brustver qalinligi 50–60 sm bo'lganda askar to'liq himoyalanadi: 7,62 mm kalibrli o'q tuproqqa atigi 20–25 sm kiradi, demak 50–60 sm tuproq o'qni ishonchli to'xtatadi.","mnemonic":"O'q 20–25 sm kiradi → 50–60 sm yetarli.","source":"11-sinf, 146-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_yakkalik_okop.png"},{"id":14,"subtopic":"OZM-72 to'plami tanish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_ozm72_tarkib.png","question":"Rasmda tarkibi raqamlangan (1-7) to'plam ko'rsatilgan. Bu qaysi qurolning to'plami?","options":{"A":"TM-62 tankka qarshi minasi to'plami","B":"OZM-72 piyodalarga qarshi minasi to'plami","C":"PMN-2 bosim ta'sirli minasi to'plami","D":"Signal minalari o'rnatish to'plami"},"answer":"B","explanation":"Bu OZM-72 minasining tarkibi: 1 — OZM-72 minasi, 2 — MUV-3 portlatkichi, 3 — kapsul-detonator KD-8A, 4 — sim tortqi, 5 — karabinli tros, 6 — metall qoziq, 7 — yog'och qoziq. Portlaganda yerdan 0,6–0,9 m sakrab, 2400 metall parcha sochadi.","mnemonic":"Sakrovchi mina — OZM-72.","source":"10-sinf, 129-bet, 5-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_ozm72_tarkib.png"},{"id":15,"subtopic":"OZM-72 tarkibini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_ozm72_tarkib.png","question":"OZM-72 to'plami rasmidagi raqamlar va nomlarning TO'G'RI mosligini tanlang.","options":{"A":"2 – kapsul-detonator, 5 – sim tortqi, 6 – yog'och qoziq","B":"1 – portlatkich, 4 – karabinli tros, 7 – metall qoziq","C":"2 – MUV-3 portlatkichi, 5 – karabinli tros, 7 – yog'och qoziq","D":"3 – sim tortqi, 4 – kapsul-detonator, 6 – karabinli tros"},"answer":"C","explanation":"To'g'ri moslik: 2 — MUV-3 portlatkichi, 5 — karabinli tros, 7 — yog'och qoziq. Qolganlari: 1 — minaning o'zi, 3 — kapsul-detonator KD-8A, 4 — sim tortqi, 6 — metall qoziq.","mnemonic":"2-portlatkich, 5-tros, 7-yog'och.","source":"10-sinf, 129-bet, 5-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_ozm72_tarkib.png"},{"id":16,"subtopic":"Qutb yulduzi usuli (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_qutb_yulduzi.png","question":"Rasmda askar yulduzlar yordamida yo'l topmoqda. Qutb yulduzi orqali gorizontning qaysi tomoni aniqlanadi?","options":{"A":"Shimol","B":"Janub","C":"Sharq","D":"G'arb"},"answer":"A","explanation":"Qutb yulduzi doimo shimol tomonda turadi: unga yuzlanib turilsa — oldinda shimol, orqada janub, o'ngda sharq, chapda g'arb bo'ladi. Bu usul kechasi kompassiz yo'nalish topishda ishlatiladi.","mnemonic":"Qutb yulduzi = shimol.","source":"10-sinf, 131-bet, 3-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_qutb_yulduzi.png"},{"id":17,"subtopic":"Qutb yulduzini topish (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_qutb_yulduzi.png","question":"Rasmdagi punktir chiziq Katta Ayiq turkumidan boshlanyapti. Qutb yulduzini topish uchun qanday amal bajariladi?","options":{"A":"Cho'mich chekka ikki yulduzi orasi xayolan 5 marta uzaytiriladi","B":"Osmondagi eng yorqin yulduz tomon yo'nalish olinadi","C":"Oy o'rog'i uchlari xayolan tutashtirilib davom ettiriladi","D":"Katta Ayiq dumining oxirgi yulduzi Qutb deb olinadi"},"answer":"A","explanation":"Katta Ayiq cho'michining chekka ikki yulduzi orasidagi masofa xayolan o'sha yo'nalishda taxminan 5 marta davom ettirilsa, Qutb yulduziga (Kichik Ayiq dumining oxirgi yulduzi) yetiladi — rasmdagi punktir chiziq shuni ko'rsatadi.","mnemonic":"Cho'mich chekkasi × 5 = Qutb yulduzi.","source":"10-sinf, 131-bet, 3-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_qutb_yulduzi.png"},{"id":18,"subtopic":"Chet el tanklarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_chetel_tanklar.png","question":"Rasmda rivojlangan davlatlarning tanklari raqamlangan. Tank va ishlab chiqargan davlatning TO'G'RI mosligini tanlang.","options":{"A":"1 – M1A1 (AQSH), 2 – Challenger-2 (Britaniya), 3 – Merkava (Isroil)","B":"1 – Challenger-2 (Buyuk Britaniya), 2 – Merkava Mk.1 (Isroil), 3 – M1A1 (AQSH)","C":"1 – Merkava (Isroil), 2 – M1A1 (AQSH), 3 – Challenger-2 (Britaniya)","D":"1 – T-72 (Rossiya), 2 – M1A1 (AQSH), 3 – Merkava (Isroil)"},"answer":"B","explanation":"To'g'ri moslik: 1 — Challenger-2 (Buyuk Britaniya armiyasi, 62,5 t), 2 — Merkava Mk.1 (Isroil, 56 t), 3 — M1A1 (AQSH AQSh armiyasi, 55,9 t, 120 mm to'p).","mnemonic":"Britaniya-Isroil-AQSH (1-2-3).","source":"10-sinf, 118-119-bet, 4-6-rasmlar","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_chetel_tanklar.png"},{"id":19,"subtopic":"Okop: seksiya okopi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_yakkalik_okop.png","question":"Mudofaa davom etsa, rasmdagi kabi bir kishilik okoplar bilan keyinchalik qanday ish qilinadi?","options":{"A":"Har biri alohida chuqurlashtirilib qoldiriladi","B":"Tuproq bilan ko'mib, yangi joyga ko'chiladi","C":"Old tomoniga mina maydoni o'rnatiladi","D":"O'zaro bog'lanib, seksiyaning okopi hosil qilinadi"},"answer":"D","explanation":"Barcha bir kishilik okoplar bir-biriga o'zaro bog'lanadi va seksiyaning umumiy okopi hosil bo'ladi. Qumli tuproqda okop devori yog'och, shox, g'o'la, taxta va chim bilan mustahkamlanadi.","mnemonic":"Yakkaliklar qo'shilib — seksiya okopi.","source":"11-sinf, 146-bet","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_yakkalik_okop.png"},{"id":20,"subtopic":"Kuzatish tartibi (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_kuzatish_sektor.png","question":"Rasmda kuzatish sektori va mo'ljallar (KP dan) ko'rsatilgan. Kuzatuvchi kuzatishni qaysi zonadan va qanday yo'nalishda boshlaydi?","options":{"A":"Yaqin zonadan, o'ngdan chapga qarab","B":"Uzoq zonadan, chapdan o'ngga qarab","C":"O'rta zonadan, markazdan chetga qarab","D":"Istalgan zonadan, harakat sezilgan tomondan"},"answer":"A","explanation":"Kuzatish yaqin zonadan turib, o'ngdan chapga qarab joylar va narsalarni tartib bilan ko'zdan kechirishdan boshlanadi — shunda hech bir uchastka e'tibordan chetda qolmaydi.","mnemonic":"Yaqindan, o'ngdan chapga.","source":"11-sinf, 151-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_kuzatish_sektor.png"},{"id":21,"subtopic":"Kuzatish zonalari (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_kuzatish_sektor.png","question":"Rasmdagi sektorda yo'l bo'yidagi toshlar 300 m masofada joylashgan. Bu mo'ljal qaysi kuzatish zonasiga kiradi?","options":{"A":"O'rta zonaga (400–800 m)","B":"Uzoq zonaga (800 m dan ortiq)","C":"Yaqin zonaga (400 m gacha)","D":"Oraliq zonaga (300–600 m)"},"answer":"C","explanation":"Yaqin zona 0–400 m masofani qamraydi — unda kichik obyektlar va harakatlar yaqqol ko'rinadi, shuning uchun 300 m dagi toshlar shu zonada. O'rta zona 400–800 m, uzoq zona 800 m dan ortiq; alohida \"oraliq zona\" tushunchasi yo'q.","mnemonic":"400 gacha — yaqin zona.","source":"11-sinf, 150-151-bet","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_kuzatish_sektor.png"},{"id":22,"subtopic":"Jang maydonida harakatlanish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_emaklash.png","question":"Rasmda askar dushman kuzatuvi ostidagi ochiq joyda qurol bilan harakatlanmoqda. U qaysi usulni qo'llamoqda?","options":{"A":"Shaxdam qadam bilan yurish","B":"Emaklab harakatlanish","C":"Sakrab-sakrab yugurish","D":"Cho'kkalab yurish"},"answer":"B","explanation":"Askar yerga yopishib, emaklab harakatlanmoqda — dushman kuzata oladigan va o't ochishi mumkin bo'lgan ochiq uchastkalarda eng xavfsiz usul. Sakrab yugurish qisqa masofali otishmalar oralig'ida, cho'kkalab yurish past to'siq ortida qo'llanadi.","mnemonic":"Ochiq joy — yerga yopish, emakla.","source":"11-sinf, 148-bet","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_emaklash.png"},{"id":23,"subtopic":"Binokl shkalalari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_binokl_shkala.png","question":"Rasmda binoklning ko'rish maydoni tasvirlangan. Binokl to'rida qanday shkalalar aks ettirilgan?","options":{"A":"Masofani bevosita metrda ko'rsatuvchi gorizontal lineyka shkalasi","B":"Gorizontal va vertikal burchaklarni o'lchaydigan ikkita perpendikulyar shkala","C":"Gorizont tomonlarini gradusda ko'rsatuvchi aylanma kompas shkalasi","D":"Nishonning harakat tezligini o'lchaydigan maxsus tezlik shkalasi"},"answer":"B","explanation":"Binokl to'rida gorizontal va vertikal burchaklarni o'lchashga mo'ljallangan ikkita o'zaro perpendikulyar burchak o'lchagich shkalalari aks ettirilgan. Shkala bo'limlari mingdan bir o'lchovda bo'lib, ular orqali masofa formula bilan hisoblanadi — bevosita metrda o'qilmaydi.","mnemonic":"Binokl to'ri — ikki perpendikulyar burchak shkalasi.","source":"11-sinf, 133-bet, 3-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_binokl_shkala.png"},{"id":24,"subtopic":"To'g'ri mo'ljallab otish (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_moljal_otish.png","question":"Sxemada to'g'ri mo'ljallab otish ko'rsatilgan. Bunday otishda trayektoriya nimadan balandga ko'tarilmaydi?","options":{"A":"Mo'ljalga olish chizig'idan","B":"Yer sirtidan bir metrdan","C":"Qurol og'zi tekisligidan","D":"Yashirinish joyi qirrasidan"},"answer":"A","explanation":"To'g'ri mo'ljallab otishda trayektoriya mo'ljalga olish chizig'i (nishon)dan balandga ko'tarilmaydi — sxemada trayektoriya nishon bo'yi doirasida o'tadi. Shu tufayli mo'ljallagichning bir ustanovkasida joyning katta qismida nishonga shikast yetkazish mumkin.","mnemonic":"To'g'ri otish — trayektoriya nishondan oshmaydi.","source":"11-sinf, 133-bet, 4-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_moljal_otish.png"},{"id":25,"subtopic":"Mo'ljalga olish nuqtasi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_moljal_otish.png","question":"Jangning qizg'in pallasida sxemadagi to'g'ri mo'ljallab otish uzoqligi doirasida mo'ljallagich holati o'zgartirilmay o'q uziladi. Bunda mo'ljalga olish nuqtasi balandlik bo'yicha odatda qayerdan tanlanadi?","options":{"A":"Nishonning yuqori qirrasidan","B":"Nishonning markazidan","C":"Nishonning o'ng chetidan","D":"Nishonning pastki qirrasidan"},"answer":"D","explanation":"To'g'ri mo'ljallab otishda trayektoriya nishondan yuqoriga ko'tarilmagani uchun mo'ljalga olish nuqtasi balandlik bo'yicha odatda nishonning pastki qirrasidan tanlanadi — o'q baribir nishon bo'yi doirasida uchadi.","mnemonic":"To'g'ri otishda nishonning PASTKI qirrasi.","source":"11-sinf, 133-bet, 4-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_moljal_otish.png"},{"id":26,"subtopic":"Yopiq maydon (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_yopiq_maydon.png","question":"Sxemaga ko'ra yopiq maydon qayerdan qayergacha cho'zilgan?","options":{"A":"Otish nuqtasidan yashirinish joyigacha","B":"Trayektoriya cho'qqisidan o'qning yerga tushish nuqtasigacha","C":"O'q teshmaydigan yashirinish joyi qirrasidan uchrashish nuqtasigacha","D":"Yashirinish joyidan trayektoriya cho'qqisigacha"},"answer":"C","explanation":"Yopiq maydon — o'q teshmaydigan yashirinish joyining panasidagi, uning qirrasidan o'qning uchrashish nuqtasigacha cho'zilgan maydon. Sxemada u yashirinish joyi orqasidagi shtrixlangan qism sifatida ko'rsatilgan.","mnemonic":"Yopiq maydon — pana ortidan uchrashuvgacha.","source":"11-sinf, 134-bet, 5-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_yopiq_maydon.png"},{"id":27,"subtopic":"Qo'zg'almas maydon (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_yopiq_maydon.png","question":"Sxemadagi qo'zg'almas (shikastlantirilmaydigan) maydon deganda nima tushuniladi?","options":{"A":"Yopiq maydonning mazkur trayektoriyada nishon shikastlanishi mumkin bo'lmagan qismi","B":"Trayektoriyaning pastga ketuvchi bo'g'inida nishon balandligidan oshmaydigan joy oralig'i","C":"Yashirinish joyining old tomonidagi ochiq, o'q bemalol yetib boradigan maydon","D":"O'q umuman yetib bormaydigan, otish uzoqligidan tashqaridagi hudud"},"answer":"A","explanation":"Qo'zg'almas (shikastlantirilmaydigan) maydon — yopiq maydonning mazkur trayektoriyada nishon shikastlanishi mumkin bo'lmagan qismi; uning chuqurligi yopiq va shikastlantiriluvchi maydonlar farqiga teng. Trayektoriyaning pastga ketuvchi qismida nishon balandligidan oshmaydigan joy esa shikastlantiriluvchi maydonga tegishli.","mnemonic":"Qo'zg'almas = yopiqning 'tegib bo'lmas' qismi.","source":"11-sinf, 134-bet, 5-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_yopiq_maydon.png"},{"id":28,"subtopic":"Jangovar ekipirovka (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_ekipirovka.png","question":"Fotoda askarning jangovar anjomlari (ekipirovkasi) ko'rsatilgan. Ekipirovka tarkibidagi quruq oziq-ovqat zaxirasi qancha muddatga mo'ljallangan bo'ladi?","options":{"A":"Uch kunlik","B":"Bir kunlik","C":"Bir haftalik","D":"O'n kunlik"},"answer":"B","explanation":"Askarning jangovar ekipirovkasidagi zarur elementlar ro'yxatida quruq oziq-ovqat bir kunlik miqdorda ko'rsatilgan. Qolgan zaxira ta'minot bo'linmalari orqali yetkaziladi.","mnemonic":"Quruq payok — 1 kunlik.","source":"10-sinf, 113-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_ekipirovka.png"},{"id":29,"subtopic":"Ekipirovka elementlari (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ekipirovka.png","question":"Fotodagi askar jangovar ekipirovkasining zarur elementlari ro'yxatiga quyidagilardan qaysi biri KIRMAYDI?","options":{"A":"Tog' anjomlari va skoch","B":"Umumqo'shin himoya to'plami","C":"Qo'shimcha zarur dori-darmonlar","D":"Dala radiostansiyasi"},"answer":"D","explanation":"Zarur elementlar ro'yxati: dori-darmonlar, qo'shimcha ust kiyim-bosh, qoshiq-vilka-ochqich, tog' anjomlari va skoch, bir kunlik quruq oziq-ovqat, umumqo'shin himoya to'plami, zaxira ichimlik suvi, jangovar pichoq va repshnur. Dala radiostansiyasi bu ro'yxatga kirmaydi — aloqa vositalari alohida ta'minlanadi.","mnemonic":"Ekipirovka — yashash va himoya, radio emas.","source":"10-sinf, 113-bet, 1-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_ekipirovka.png"},{"id":30,"subtopic":"Jangovar sxemani o'qish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_manyovr_chekinish.jpg","question":"Sxemada bo'linmalarning jangovar tartibi tasvirlangan. Pozitsiyalardan oldinga chiqarilgan yaxlit qizil strelkalar nimani bildiradi?","options":{"A":"O't ochish yo'nalishlari va sektorlarini","B":"Bo'linmaning chekinish yo'llarini","C":"Aloqa va xabar berish liniyalarini","D":"Minalashtirilgan uchastkalar chegarasini"},"answer":"A","explanation":"Taktik sxemalarda pozitsiyadan oldinga (dushman tomon) chiqarilgan yaxlit strelkalar har bir bo'linmaning o't ochish yo'nalishlari va sektorlarini ko'rsatadi. Sxemada qo'shni guruhlar sektorlari bir-birini qoplab, uzluksiz o't zonasi hosil qiladi.","mnemonic":"Strelka oldinga — o't yo'nalishi.","source":"Eski darslik, 99-bet, 47-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_manyovr_chekinish.jpg"},{"id":31,"subtopic":"Pozitsiya shartli belgisi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_bir_tomonga.jpg","question":"Sxemada motoo'qchilar guruhining o't sxemasi berilgan. Tishli (shtrixli) yoysimon chiziq nimani bildiradi?","options":{"A":"Daryo yoki suv to'sig'ining shartli chizig'ini","B":"Sim to'siq qatorining shartli belgisini","C":"Bo'linma egallagan pozitsiya, okop chizig'ini","D":"Yurish yo'nalishi, marshrut chizig'ini"},"answer":"C","explanation":"Tishli (shtrixlangan) yoysimon chiziq — bo'linma egallagan pozitsiya, ya'ni okop chizig'ining shartli belgisi; tishchalar o'z qo'shinlari tomonga qaratiladi. Undan oldinga chiqarilgan strelkalar o't sektorlarini ko'rsatadi.","mnemonic":"Tishli yoy — okop chizig'i.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_bir_tomonga.jpg"},{"id":32,"subtopic":"Hujum sxemasini o'qish (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_manyovr_aylanib.jpg","question":"Sxemada guruhning jangovar harakati tasvirlangan. Uzuq-uzuq (punktir) qizil strelka yaxlit strelkadan nimasi bilan farq qiladi?","options":{"A":"Punktir — artilleriya o'ti, yaxlit — miltiq-pulemyot o'ti yo'nalishi","B":"Punktir — bo'linmaning harakatlanish (ko'chib o'tish) yo'nalishi, yaxlit — o't ochish yo'nalishi","C":"Punktir — bo'linmaning chekinishi, yaxlit — hujumga o'tish yo'nalishi","D":"Ikkalasi ham bir xil harakat yo'nalishini bildiradi"},"answer":"B","explanation":"Taktik sxemalarda uzuq-uzuq (punktir) strelka bo'linmaning mo'ljallangan harakatlanish — yangi pozitsiyaga ko'chib o'tish yo'nalishini, yaxlit strelka esa o't ochish yo'nalishini bildiradi. Sxemada guruh punktir yo'nalish bo'ylab yangi rubejga chiqmoqda.","mnemonic":"Punktir — yo'l, yaxlit — o't.","source":"Eski darslik, 99-bet, 47-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_manyovr_aylanib.jpg"},{"id":33,"subtopic":"Manyovr — aylanib o'tish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_manyovr_aylanib.jpg","question":"Sxemada 2/3-motoo'qchi guruh punktir yo'nalish bo'ylab balandlikdagi dushman pozitsiyasining yon tomonidan o'tib, orqasiga chiqmoqda, qolgan guruhlar esa old tomondan o't ochib turibdi. Bo'linma jangda qanday manyovr qo'llamoqda?","options":{"A":"Qurshov","B":"Chekinish","C":"Aylanib o'tish","D":"Qarshi hujum"},"answer":"C","explanation":"Aylanib o'tish manyovrida bo'linmaning bir qismi dushman pozitsiyasini yon (orqa) tomondan aylanib o'tib zarba beradi, qolganlari old tomondan o't bilan bog'lab turadi. Qurshovda esa dushman har tomondan o'rab olinadi, chekinishda bo'linma yangi pozitsiyaga ortga ketadi.","mnemonic":"Yonidan o'tib orqaga — aylanib o'tish.","source":"Eski darslik, 99-bet, 47-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_manyovr_aylanib.jpg"},{"id":34,"subtopic":"Manyovr — chekinish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_manyovr_chekinish.jpg","question":"Sxemada dushman (ko'k) old tomondan bosib kelmoqda, motoo'qchi guruhlar esa o't ochib turgan holda punktir yo'nalishlar bo'ylab orqadagi yangi pozitsiyalarga o'tmoqda. Bo'linmalar qanday manyovr bajarmoqda?","options":{"A":"Chekinish","B":"Aylanib o'tish","C":"Qurshov","D":"Hujumga o'tish"},"answer":"A","explanation":"Chekinish manyovrida bo'linmalar dushman bosimini o't bilan to'xtatib turgan holda, belgilangan yo'nalishlar bo'ylab orqadagi yangi (tayyorlangan) pozitsiyalarga uyushgan tarzda o'tadi — sxemada punktir yo'nalishlar orqaga, yangi pozitsiyalar tomon yo'nalgan.","mnemonic":"Orqaga yangi pozitsiyaga — chekinish.","source":"Eski darslik, 99-bet, 47-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_manyovr_chekinish.jpg"},{"id":35,"subtopic":"Olovli manyovr — bir tomonga g'ujlash (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_bir_tomonga.jpg","question":"Sxemada 2-motoo'qchi safi, 1-motoo'qchi guruh va 1-motoo'qchi safi o'z olovini bitta muhim nishon (O't-1) bo'yicha yig'moqda. Bu olovli manyovrning qaysi turi?","options":{"A":"Taqsimlab o't ochish","B":"Bir tomonga g'ujlab o't ochish","C":"O't ochishni yangi obyektga o'tkazish","D":"Navbatma-navbat o't ochish"},"answer":"B","explanation":"Guruh (seksiya) olovini bitta muhim nishon bo'yicha yig'ish — bir tomonga g'ujlab o't ochish deyiladi. Olovli manyovr dushmanni samaraliroq zararlash uchun qo'llaniladi; sxemada barcha bo'linmalar strelkalari bitta nishonga yo'nalgan.","mnemonic":"Hamma o't bitta nishonga — g'ujlash.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_bir_tomonga.jpg"},{"id":36,"subtopic":"Olovli manyovr — ketma-ket g'ujlash (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_ketmaket.jpg","question":"Sxemada 2-tank guruhi olovini avval bir tomondagi nishon (O'D-2) bo'yicha g'ujlab, so'ng boshqa tomondagi nishonga (O'O-1) ko'chirmoqda. Bu olovli manyovrning qaysi turi?","options":{"A":"Bir tomonga g'ujlab, to'xtovsiz o't ochish","B":"Nishonlar bo'yicha taqsimlab o't ochish","C":"Joyida turib mudofaa o'tini olib borish","D":"Ketma-ket tomonlarga g'ujlab o't ochish"},"answer":"D","explanation":"Olov avval bitta nishonga g'ujlanib, u yo'q qilingach boshqa tomondagi nishonga o'z vaqtida ko'chirilsa — bu ketma-ket tomonlarga g'ujlab o't ochish. Sxemada yaxlit strelkalar hozirgi, punktir strelkalar keyingi g'ujlash tomonini ko'rsatadi.","mnemonic":"Avval u yoq, keyin bu yoq — ketma-ket g'ujlash.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_ketmaket.jpg"},{"id":37,"subtopic":"Olovli manyovr — taqsimlab o't ochish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_taqsimlab.jpg","question":"Sxemada 1-tank guruhining har bir otuvchi vositasi bir vaqtning o'zida o'ziga biriktirilgan alohida nishonga o't ochmoqda. Bu olovli manyovrning qaysi turi?","options":{"A":"Taqsimlab o't ochish","B":"Bir tomonga g'ujlab o't ochish","C":"Ketma-ket tomonlarga g'ujlab o't ochish","D":"O't ochishni yangi obyektga o'tkazish"},"answer":"A","explanation":"Guruh bilan bir vaqtda bir necha nishonga o't ochish — taqsimlab o't ochish deyiladi: har bir otuvchi vosita o'z nishonini oladi. G'ujlashda esa, aksincha, butun guruh olovi bitta nishonga yig'iladi.","mnemonic":"Har kimga o'z nishoni — taqsimlash.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_taqsimlab.jpg"},{"id":38,"subtopic":"Olovli manyovr — yangi obyektga o'tkazish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_yangi_obyekt.jpg","question":"Sxemada 2-motoo'qchi guruh birinchi nishonni yo'q qilgach, olovini boshqa (yangi paydo bo'lgan) nishonga ko'chirmoqda — punktir strelka avvalgi, yaxlit strelkalar yangi yo'nalishni ko'rsatadi. Bu olovli manyovrning qaysi turi?","options":{"A":"Taqsimlab o't ochish","B":"Bir tomonga g'ujlab o't ochish","C":"O't ochishni yangi obyektga o'tkazish","D":"Zahira olov yo'nalishi"},"answer":"C","explanation":"Bir nishondan boshqasiga olovni o'z vaqtida ko'chirish — o't ochishni yangi obyektga o'tkazish deyiladi. Bu muhimroq yoki yangi paydo bo'lgan nishonni kechiktirmay zararlash imkonini beradi.","mnemonic":"Nishon o'zgardi — olov ko'chdi.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_yangi_obyekt.jpg"},{"id":39,"subtopic":"Olovli manyovr maqsadi (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_olov_bir_tomonga.jpg","question":"Sxemadagi kabi olovli manyovr jangda nima maqsadda qo'llaniladi?","options":{"A":"O'q-dorilarni tejash uchun","B":"Dushmanni samaraliroq zararlash uchun","C":"O'z pozitsiyasini niqoblash uchun","D":"Aloqa kanallarini tekshirish uchun"},"answer":"B","explanation":"Olovli manyovr dushmanni samaraliroq zararlash uchun qo'llaniladi. U olovni bitta muhim nishonga yig'ish (g'ujlash), bir nishondan boshqasiga o'z vaqtida ko'chirish va bir vaqtda bir necha nishonga o't ochish (taqsimlash)da ifodalanadi.","mnemonic":"Olov manyovri — samarali zararlash.","source":"Eski darslik, 48-rasm","topic":"Darslik rasmlari asosida texnika, mina tuzilishi va muhandislik inshootlarini aniqlash","subject":"CHQBT","_cat":"Taktik","_img":"public/images/chqbt_olov_bir_tomonga.jpg"},{"id":1,"subtopic":"Sopqonsimon bog'lov (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Rasmda 6 xil bog'lam usuli raqamlangan. Pastki jag' singanda qo'yiladigan sopqonsimon bog'lov qaysi raqamda ko'rsatilgan?","options":{"A":"5-raqamda","B":"1-raqamda","C":"4-raqamda","D":"2-raqamda"},"answer":"D","explanation":"Sopqonsimon bog'lov — 2-raqam: bint jag' ostidan o'tkazilib, boshning tepa va orqa qismiga bog'lanadi. Pastki jag' singanida jag'ni harakatsizlantirish uchun qo'llanadi.","mnemonic":"Jag' — sopqonda (2).","source":"11-sinf, 100-bet, 1-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":2,"subtopic":"Ko'zga bog'lam (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Jangchining ko'zi jarohatlandi. Rasmdagi qaysi raqamli bog'lam usulini qo'llash kerak?","options":{"A":"2-raqamli","B":"6-raqamli","C":"4-raqamli","D":"3-raqamli"},"answer":"C","explanation":"Ko'zga bog'lam — 4-raqam: bint bosh aylanasidan va jarohatlangan ko'z ustidan kesishtirilib o'raladi (bir yoki ikkala ko'zga). 2 — jag' uchun sopqonsimon, 3 — son, 6 — boshbarmoq bog'lami.","mnemonic":"Ko'z — 4-raqamli bog'lam.","source":"11-sinf, 101-bet, 2-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":3,"subtopic":"Qo'lqopsimon bog'lam (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Rasmda 1-raqam bilan ko'rsatilgan, kaft va barmoqlarni bosqichma-bosqich o'rab boruvchi bog'lam qanday nomlanadi?","options":{"A":"Qo'lqopsimon bog'lam","B":"Spiral bog'lam","C":"Sopqonsimon bog'lov","D":"Sirkulyar (aylana) bog'lam"},"answer":"A","explanation":"1-raqamda qo'lqopsimon bog'lam: har bir barmoq alohida o'ralib, kaftdagi sakkizsimon yurishlar bilan mustahkamlanadi — natijada qo'lqop ko'rinishi hosil bo'ladi.","mnemonic":"Har barmoq alohida = qo'lqopsimon.","source":"11-sinf, 105-bet, 3-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":4,"subtopic":"Son bog'lami (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Sonning yuqori qismi jarohatlanganda qo'yiladigan bog'lam rasmda qaysi raqamda?","options":{"A":"1-raqamda","B":"5-raqamda","C":"6-raqamda","D":"3-raqamda"},"answer":"D","explanation":"Sonning yuqori qismini bog'lash — 3-raqam: bint son aylanasidan va bel-chanoq orqali kesishtirilib o'tkaziladi, bog'lam sirg'alib tushmasligi uchun belga mahkamlanadi.","mnemonic":"Son — 3-raqam.","source":"11-sinf, 105-bet, 4-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":5,"subtopic":"Burun-tomoq bog'lami (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Askarning burni jarohatlanib, qon ketmoqda. Rasmdagi qaysi raqamli usul burun, quloq va tomoq jarohatlariga mo'ljallangan?","options":{"A":"5-raqamli","B":"4-raqamli","C":"2-raqamli","D":"1-raqamli"},"answer":"A","explanation":"5-raqam — quloq, burun va tomoq jarohatlariga bog'lam qo'yish usullari: bint sopqon ko'rinishida kesilib, jarohat ustiga qo'yiladi va uchlari bosh atrofida bog'lanadi. 4 — ko'z bog'lami bilan adashtirmaslik kerak.","mnemonic":"Yuzdagi uch a'zo (quloq-burun-tomoq) — 5.","source":"11-sinf, 101-bet, 3-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":6,"subtopic":"Boshbarmoq bog'lami (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Rasmda 6-raqam bilan ko'rsatilgan bog'lam qaysi a'zoga qo'yilgan?","options":{"A":"Bilak bo'g'imiga","B":"Kaft ustki qismiga","C":"Qo'l boshbarmog'iga","D":"Tirsak bo'g'imiga"},"answer":"C","explanation":"6-raqamda boshbarmoqni bog'lash ko'rsatilgan: bint bilak-kaft orqali sakkizsimon yurishlar bilan boshbarmoqni o'rab boradi.","mnemonic":"Katta barmoq — 6-raqam.","source":"11-sinf, 104-bet, 2-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":7,"subtopic":"Umurtqa shikastida tashish (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_umurtqa_tashish.png","question":"Rasmda jabrlanuvchi qattiq taxta ustiga yotqizilib, butun tanasi bint bilan mahkamlangan. Bunday harakatsizlantirish qaysi shikastlanishda qo'llanadi?","options":{"A":"Son suyagi singanida","B":"Umurtqa pog'onasi shikastlanishida","C":"Yelka chiqib ketganida","D":"Ko'krak qafasi lat yeganida"},"answer":"B","explanation":"Umurtqa shikastlanishida jabrlanuvchi qattiq tekis asosga (taxta, shchit) yotqiziladi va butun tana qimirlamasligi uchun mahkamlanadi — umurtqa siljisa orqa miya zararlanadi. Son singanida esa shina qo'yiladi, yelka chiqishida qo'l osma bog'lam bilan osiladi — butun tanani taxtaga mahkamlash shart emas.","mnemonic":"Umurtqa — faqat qattiq asosda.","source":"11-sinf, 108-bet, 5-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_umurtqa_tashish.png"},{"id":8,"subtopic":"Bog'lam turlarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_boglamlar.png","question":"Rasmdagi raqamlar va bog'lam turlarining TO'G'RI mosligini tanlang.","options":{"A":"1 – sopqonsimon, 2 – qo'lqopsimon, 4 – son bog'lami","B":"2 – ko'z bog'lami, 3 – boshbarmoq, 5 – qo'lqopsimon","C":"1 – qo'lqopsimon, 2 – sopqonsimon, 4 – ko'z bog'lami","D":"3 – quloq-burun-tomoq, 5 – son bog'lami, 6 – ko'z bog'lami"},"answer":"C","explanation":"To'g'ri moslik: 1 — qo'lqopsimon (kaft-barmoqlar), 2 — sopqonsimon (pastki jag'), 4 — ko'z bog'lami. Qolganlari: 3 — son bog'lami, 5 — quloq-burun-tomoq, 6 — boshbarmoq bog'lami.","mnemonic":"1-qo'lqop, 2-sopqon, 4-ko'z.","source":"11-sinf, 100-105-bet","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_boglamlar.png"},{"id":9,"subtopic":"Ko'krak ochiq jarohati (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_kokrak_jarohat.png","question":"Rasmda ko'krak jarohati olgan bemorga yordam ko'rsatilmoqda. Ko'krakning ochiq (teshilgan) jarohatida yara nima sababdan zudlik bilan steril qoplama bilan yopiladi?","options":{"A":"Bemorning tana harorati tushib ketmasligi uchun","B":"Qon aylanishini tezlashtirish uchun","C":"Havo o'pkaga kirmasligi uchun","D":"Og'riqni butunlay yo'qotish uchun"},"answer":"C","explanation":"Teshilgan ko'krak jarohatidan havo plevra bo'shlig'i orqali o'pkaga kirsa, o'pka puchayadi va nafas izdan chiqadi. Shuning uchun yara steril qoplama yoki toza doka bilan darhol yopiladi.","mnemonic":"Teshik ko'krak — havoga yo'l yopiladi.","source":"11-sinf, 110-bet","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_kokrak_jarohat.png"},{"id":10,"subtopic":"Ko'krak jarohatida bemor holati (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/chqbt_kokrak_jarohat.png","question":"Rasmdagi kabi ko'krak jarohatida bemorga qanday holat berish maqsadga muvofiq?","options":{"A":"Chap tomonga yonboshlatib, oyoqlarini bukib yotqizish","B":"Tik yoki yarim yotgan, og'riq kam bo'ladigan holat","C":"Qorni bilan pastga qaratib yotqizish","D":"Boshini pastga tushirib, oyoqlarini ko'tarish"},"answer":"B","explanation":"Ko'krak jarohatida bemor tik yoki yarim yotgan holatda bo'lishi kerak — bu nafas olishni yengillashtiradi. Chap tomonga yonboshlatish esa qorin jarohatida qo'llanadi.","mnemonic":"Ko'krak — yarim o'tirgan holat.","source":"11-sinf, 110-bet, 1-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_kokrak_jarohat.png"},{"id":11,"subtopic":"Spiralsimon bog'lam (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_kokrak_boglam.png","question":"Rasmda ko'krak va qorin sohasiga bog'lam qo'yish usullari ko'rsatilgan. Spiralsimon bog'lamda har bir yangi qatlam qanday o'raladi?","options":{"A":"Oldingi qatlamning yarmini yopib o'raladi","B":"Oldingi qatlamdan 2-3 sm uzoqlikda o'raladi","C":"Avvalgi qatlamlar ustidan X shaklida o'tkaziladi","D":"Faqat yelka va bo'yin orqali aylantiriladi"},"answer":"A","explanation":"Spiralsimon bog'lamda bint ko'krak yoki qorin atrofidan aylantirilib, har bir yangi qatlam oldingisining yarmini yopib boradi. X shaklida o'tkazish — aylana-kesishma, yelka orqali sakkiz shaklida o'rash — sakkizsimon bog'lamga xos.","mnemonic":"Spiral — yarmini bosib yuradi.","source":"11-sinf, 111-112-bet, 2-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_kokrak_boglam.png"},{"id":12,"subtopic":"Sakkizsimon bog'lam qo'llanishi (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_kokrak_boglam.png","question":"Jangchining ko'krak qafasi suyaklari singan. Rasmdagi usullardan qaysi bog'lam qo'yiladi?","options":{"A":"Spiralsimon bog'lam","B":"Durrachali bog'lam","C":"Tortuvchi bog'lam","D":"Sakkizsimon bog'lam"},"answer":"D","explanation":"Ko'krak qafasi suyaklari singanda sakkizsimon bog'lam qo'llanadi: bint yelkalar, qo'l va bo'yinga sakkiz shaklida aylantirilib, ikki yelkani tortib turadi. Spiralsimon — yuzaki yaralar, durrachali — qorinni tez bog'lash, tortuvchi — ichki qon ketishda.","mnemonic":"Singan qafas — sakkizsimon.","source":"11-sinf, 111-bet","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_kokrak_boglam.png"},{"id":13,"subtopic":"Ilon chaqqanda taqiqlangan harakat (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_ilon_chaqish.png","question":"Fotoda zaharli ilon chaqqan jabrlanuvchiga yordam ko'rsatilmoqda. Bunda qaysi harakat QAT'IYAN man etiladi?","options":{"A":"Oyoq-qo'lni shina bilan harakatsizlantirish","B":"Turniket bilan tortib bog'lash","C":"Jabrlanuvchiga ko'p suyuqlik berish","D":"Jarohat joyini iliq suv bilan yuvish"},"answer":"B","explanation":"Ilon chaqqanda turniket bog'lash qat'iyan man etiladi — zahar to'planib to'qimalar nekroziga olib keladi. Harakatsizlantirish, ko'p suyuqlik berish va jarohatni yuvish esa tavsiya etiladigan choralar.","mnemonic":"Ilonda jgut — nekroz xavfi.","source":"11-sinf, 120-121-bet, 1-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_ilon_chaqish.png"},{"id":14,"subtopic":"Qoraqurt chaqishida yordam (rasm)","difficulty":"Y3","cognitive":"Mulohaza","qtype":"single","requires_image":true,"image":"/images/chqbt_qoraqurt.png","question":"Fotodagi qoraqurt chaqqan holatda, ilon chaqishidan farqli o'laroq, qaysi chora qo'llanadi?","options":{"A":"Chaqilgan joyga 10-15 daqiqa muzli xalta qo'yiladi","B":"Chaqilgan joy turniket bilan tortib bog'lanadi","C":"Zahar og'iz bilan so'rib olinadi","D":"Chaqilgan joy issiq suvga botirib turiladi"},"answer":"A","explanation":"Qoraqurt chaqqanda shish va og'riqni kamaytirish uchun muzli xalta 10-15 daqiqa qo'yiladi (muz teriga to'g'ridan to'g'ri tekkizilmaydi). Ilon chaqishida esa, aksincha, sovuq kompress qo'yilmaydi. Turniket va zaharni so'rish har ikkala holatda ham xavfli.","mnemonic":"Qoraqurt — muz mumkin, ilon — mumkin emas.","source":"11-sinf, 122-bet, 2-rasm","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_qoraqurt.png"},{"id":15,"subtopic":"Arteriyani bosish nuqtalari (rasm)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Rasmda arterial qon ketishida tomirlarni barmoq bilan bosib turish nuqtalari raqamlangan. Bo'yin sohasidagi 2-raqamli nuqtada qaysi arteriya bosiladi?","options":{"A":"Chakka arteriyasi","B":"Yelka arteriyasi","C":"O'mrov osti arteriyasi","D":"Uyqu arteriyasi"},"answer":"D","explanation":"Bo'yinning yon yuzasida joylashgan 2-nuqta — uyqu arteriyasi; bosh-bo'yin sohasidan kuchli qon ketganda shu yerda umurtqaga bosiladi. Chakka arteriyasi 1-raqamda (quloq oldida), yelka arteriyasi 5-raqamda (yelkaning ichki yuzasida).","mnemonic":"Bo'yin — uyqu arteriyasi.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topic":"Darslik rasmlari asosida bog'lam turini va tashish usulini aniqlash","subject":"CHQBT","_cat":"Tibbiy","_img":"public/images/chqbt_arteriya_nuqtalari.jpg"},{"id":16,"subtopic":"Bosish nuqtalarini moslashtirish (rasm)","difficulty":"Y2","cognitive":"Qo'llash","qtype":"matching","requires_image":true,"image":"/images/chqbt_arteriya_nuqtalari.jpg","question":"Rasmdagi raqamlar va arteriyalarning TO'G'RI mosligini tanlang.","options":{"A":"1 – chakka arteriyasi, 5 – yelka arteriyasi, 8 – son arteriyasi","B":"1 – uyqu arteriyasi, 5 – bilak arteriyasi, 8 – boldir arteriyasi","C":"1 – chakka arteriyasi, 5 – son arteriyasi, 8 – yelka arteriyasi","D":"1 – jag' arteriyasi, 5 – uyqu arteriyasi, 8 – taqim arteriyasi"},"answer":"A","explanation":"To'g'ri moslik: 1 — chakka arteriyasi (quloq oldida, boshda), 5 — yelka arteriyasi (yelkaning ichki yuzasida, qo'lda), 8 — son arteriyasi (sonning ichki yuzasida, oyoqda). Uyqu arteriyasi — 2, boldir tomirlari — 9-raqamda.","mnemonic":"Bosh-1, qo'l-5, oyoq-8.","source":"10-sinf, 162-165-bet mavzusi (qo'shimcha rasm)","topi
