2. 27°C\nA. Koma holatiga olib kelishi mumkin\nB. Yurak va nafas tizimlari faoliyati buziladi","options":{"A":"1-A, 2-A","B":"1-B, 2-A","C":"1-B, 2-B","D":"1-A, 2-B"},"answer":"B","explanation":"Tana harorati 32°C dan past darajada yurak va nafas tizimlari faoliyati buziladi. Harorat 27°C darajaga tushganda esa koma holatiga olib kelishi mumkin. Muzlash holatida inson har doim o'z ahvolini to'g'ri baholay olmaydi.","mnemonic":"32 — yurak buziladi, 27 — koma.","id":1193},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: anomal sovuq ta'rifi — me'yordan 7-12°C pasayish","requires_image":false,"question":"Anomal sovuq deganda havo haroratining me'yordan qancha pasayib ketishi tushuniladi?","options":{"A":"20-25°C gacha","B":"30°C gacha","C":"1-3°C gacha","D":"7-12°C gacha"},"answer":"D","explanation":"Anomal sovuq — havo haroratining me'yordan 7-12°C gacha pasayib ketish holati. Bunday paytda qo'l va oyoq barmoqlari, yuz, burun va quloq muzlash xavfiga uchraydi, shuning uchun doimiy harakatlanish va issiq kiyim kiyish kerak.","mnemonic":"Me'yordan yetti-o'n ikki gradus past — anomal sovuq.","id":1194},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 26-§: muzlash belgilarining rivojlanish bosqichlari","requires_image":false,"question":"Muzlash belgilarining rivojlanish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Teri qizarishi va qisqa muddatli isinish\n2. Sovuqni sezish\n3. Sezuvchanlikning yo'qolishi va uvishish","options":{"A":"2, 1, 3","B":"1, 2, 3","C":"3, 2, 1","D":"2, 3, 1"},"answer":"A","explanation":"Muzlash avval sovuqni sezish bilan boshlanadi. So'ng qisqa muddatli isinish va teri qizarishi kuzatiladi. Keyin sezuvchanlik yo'qolib, tana qismi uvishadi. Bu bosqichda inson o'z holatini to'g'ri baholay olmasligi xavfli.","mnemonic":"Sezish — qizarish — uvishish: muzlash zinapoyasi.","id":1195},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal issiq","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: inson tanasi tarkibidagi suyuqlik ulushi va qontomir normal harorati","requires_image":false,"question":"Inson tanasining necha foizdan ko'p qismi suyuqlikdan iborat?","options":{"A":"50% dan ko'prog'i","B":"70% dan ko'prog'i","C":"90% dan ko'prog'i","D":"30% dan ko'prog'i"},"answer":"B","explanation":"Inson tanasining 70 foizdan ko'proq qismi suyuqlikdan iborat. Qontomir tizimi 36,6°C haroratda normal ishlab, hujayralarni oziqlantiradi va kislorod bilan ta'minlaydi. Shu sababli anomal issiqda ko'p suyuqlik ichish muhim.","mnemonic":"Tananing yetmish foizi — suyuqlik.","id":1196},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal issiq","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 26-§: issiq havoda profilaktika choralari va xavf guruhlari","requires_image":false,"question":"Anomal issiqqa oid tushunchalarni mos izoh bilan moslashtiring:\n1. Quyosh urishi belgilari\n2. Issiq havo ko'proq xavfli guruh\n3. Profilaktika chorasi\nA. Qariyalar, chaqaloqlar, surunkali kasalligi borlar\nB. Ko'p suyuqlik ichish, suvga boy meva yeyish, kunning issiq soatlarida ko'chaga chiqmaslik\nC. Bosh og'rig'i, tana haroratining ko'tarilishi, ko'ngil aynishi, holsizlik","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"Quyosh urishi belgilari — bosh og'rig'i, tana haroratining ko'tarilishi, ko'ngil aynishi va holsizlik. Issiq havo ayniqsa qariyalar, chaqaloqlar va surunkali kasalligi borlar uchun xavfli. Profilaktika sifatida ko'p suyuqlik ichish, suvga boy meva yeyish va kunning issiq soatlarida ko'chaga chiqmaslik tavsiya etiladi.","mnemonic":"Belgi — bosh og'riq, xavf — qariya-bola, chora — suv ich.","id":1197},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Transport avariyalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 27-§: transport avariyalari turlari — aviahalokat, avtomobil, temiryo'l, metropoliten","requires_image":false,"question":"Transport avariyalari turlarini ular sodir bo'ladigan soha bilan moslashtiring:\n1. Aviahalokat\n2. Avtomobil halokati\n3. Temiryo'l halokati\n4. Metropoliten halokati\nA. Yo'l-transport hodisalari, portlash va yong'inlar bilan kechadi\nB. Bekatlar va tunnellardagi avariyalar\nC. Havo kemalarining parchalanishi, qidiruv-avariya ishlari talab qiladi\nD. Harakatlanuvchi tarkibning ag'darilishi, vokzal binolaridagi odamlarga xavf","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-B, 2-A, 3-D, 4-C","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Aviahalokat havo kemalarining parchalanishi bilan kechib, qidiruv va avariya-qidiruv ishlarini talab qiladi. Avtomobil halokati yo'l-transport hodisalari, portlash va yong'inlar bilan bog'liq. Temiryo'l halokati harakatlanuvchi tarkibning ag'darilishi va vokzaldagi odamlarga xavf tug'diradi. Metropoliten halokatlari bekatlar va tunnellarda sodir bo'ladi.","mnemonic":"Havo — qidiruv, yo'l — portlash, rels — ag'darilish, metro — tunnel.","id":1198},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Zilzila","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 24-§: O'zbekiston va Markaziy Osiyo zilzilalari qobiq turiga kirishi va chuqurligi","requires_image":false,"question":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan qaysi turga kiradi va qancha chuqurlikda bo'ladi?","options":{"A":"Chuqur fokusli, chuqurligi 300 km dan ortiq","B":"Qobiq zilzilalari, chuqurligi odatda 10-40 km","C":"Vulqon zilzilalari, chuqurligi 5 km","D":"Qobiq osti, chuqurligi 100-200 km"},"answer":"B","explanation":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan qobiq zilzilalariga kiradi. Ularning chuqurligi odatda 10-40 km, ba'zida 70 km gacha boradi. Qobiq zilzilalari 70 km gacha chuqurlikda yuzaga keladigan tur hisoblanadi.","mnemonic":"Markaziy Osiyo — qobiq zilzila, o'n-qirq kilometr.","id":1199},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Kuchli shamol","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 26-§: kuchli shamol kuchayib borishi — o'rtacha, kuchli, dovul, bo'ron","requires_image":false,"question":"Shamol turlarini tezligi ortib borishi tartibida joylashtiring:\n1. Dovul (shtorm)\n2. O'rtacha shamol\n3. Bo'ron\n4. Kuchli shamol","options":{"A":"3, 1, 4, 2","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Tezlik ortib borishi tartibida: o'rtacha shamol (5-8 m/s), kuchli shamol (14 m/s), dovul yoki shtorm (20-25 m/s) va eng kuchlisi bo'ron (30 m/s). Tezlik qancha katta bo'lsa, shamol shuncha xavfli hisoblanadi.","mnemonic":"O'rtacha, kuchli, dovul, bo'ron — sekindan shiddatga.","id":1200}];
let ftype="hammasi", shown=0; const PAGE=20;
const list=document.getElementById("list");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fdata(){return ftype==="hammasi"?DATA:DATA.filter(q=>q.qtype===ftype);}
function render(reset){ if(reset){list.innerHTML="";shown=0;}
 const d=fdata(); const slice=d.slice(shown,shown+PAGE); shown+=slice.length;
 for(const q of slice){ const c=document.createElement("div"); c.className="card";
  let opts=""; for(const k of ["A","B","C","D"]) opts+='<div class="opt '+(k===q.answer?"ok":"")+'">'+k+") "+esc(q.options[k])+"</div>";
  c.innerHTML='<span class="idtag">id '+q.id+'</span>'
   +'<div class="src">📖 '+esc(q.source_construct||"")+"</div>"
   +'<div><span class="tag '+(["matching","sequence"].includes(q.qtype)?"m":"")+'">'+esc(q.qtype)+'</span><span class="tag">'+esc(q.difficulty||"")+'</span><span class="tag">'+esc(q.bloom_level||"")+'</span><span class="tag">'+esc((q.topic||"")+" · "+(q.subtopic||""))+"</span></div>"
   +'<div class="q">'+esc(q.question)+"</div>"+opts
   +'<div class="exp">💡 '+esc(q.explanation||"")+"</div>"
   +(q.mnemonic?'<div class="mn">🧠 '+esc(q.mnemonic)+"</div>":"");
  list.appendChild(c);}
 document.getElementById("more").style.display = shown>=d.length?"none":"block";
 document.getElementById("meta").textContent="Jami: "+DATA.length+" ta (id "+1045+"–"+1200+") | Ko'rsatilmoqda: "+shown+" / "+d.length;
}
const types=["hammasi","single","matching","sequence"];
const flt=document.getElementById("flt");
types.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t+" ("+(t==="hammasi"?DATA.length:DATA.filter(q=>q.qtype===t).length)+")";if(i===0)b.className="act";
 b.onclick=()=>{document.querySelectorAll("#flt button").forEach(x=>x.classList.remove("act"));b.classList.add("act");ftype=t;render(true);};flt.appendChild(b);});
document.getElementById("more").onclick=()=>render(false);
render(true);
</script></body></html>
