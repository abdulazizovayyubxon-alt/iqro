ce_construct":"10-sinf, 15-§: \"Oldimga yuguring!\" komandasi bo'yicha boshliq oldiga kelish tartibi","requires_image":false,"question":"\"Oddiy askar To'rayev, OLDIMGA!\" komandasi berilganda harbiy xizmatchi harakatlarining to'g'ri ketma-ketligini aniqlang:\n1. \"Xo'p bo'ladi\" deb javob berish\n2. O'z familiyasini eshitgach \"Men\" deb javob berish\n3. Yetib kelgani haqida bildiruv berish\n4. Boshliqqa ikki-uch qadam qolganda to'xtab, o'ng qo'lni bosh kiyimga keltirish","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"2, 1, 3, 4","D":"1, 2, 4, 3"},"answer":"B","explanation":"Harbiy xizmatchi familiyasini eshitgach \"Men\" deb, safdan chiqish komandasini eshitgach \"Xo'p bo'ladi\" deb javob beradi. So'ng boshliq oldiga qisqa yo'l bilan shaxdam yurib yoki yugurib boradi, ikki-uch qadam qolganda to'xtab, oyoqlarni taqash bilan bir vaqtda qo'lni bosh kiyimga keltiradi va yetib kelgani haqida bildiruv beradi.","mnemonic":"Men — Xo'p — to'xta — bildir.","id":1108},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Safdan chiqish va safga qaytish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 15-§: \"Safga turing!\" komandasi bo'yicha safga qaytish tartibi","requires_image":false,"question":"\"Oddiy askar To'rayev, safga turing!\" komandasi berilganda harakatlarning to'g'ri ketma-ketligini aniqlang:\n1. Yurish yo'nalishi tomon burilib, birinchi qadamda qo'lni bosh kiyimdan tushirish\n2. Familiyasini eshitgach boshliq tomon burilib \"Men\" deb javob berish\n3. Qisqa yo'l bilan uchta shaxdam qadam tashlab, safdagi joyini egallash\n4. O'ng qo'lni bosh kiyimga keltirib \"Xo'p bo'ladi\" deb javob berish","options":{"A":"2, 1, 4, 3","B":"4, 2, 1, 3","C":"2, 4, 1, 3","D":"2, 4, 3, 1"},"answer":"C","explanation":"Harbiy xizmatchi familiyasini eshitgach boshliq tomon burilib \"Men\" deydi, ijro komandasi bo'yicha qo'lni bosh kiyimga keltirib \"Xo'p bo'ladi\" deb javob beradi. So'ng yurish yo'nalishi tomon burilib, birinchi qadam tashlash barobarida qo'lni tushiradi va uchta shaxdam qadam bilan safdagi joyini egallaydi.","mnemonic":"Men — Xo'p — buril — uch qadam.","id":1109},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Yurish davomida burilish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 13-§: yurish davomida o'ngga burilishni uch hisob bo'yicha bajarish","requires_image":false,"question":"Yurish davomida o'ngga burilishni qismlarga bo'lib bajarish hisoblarini to'g'ri tartiblang:\n1. Chap oyoq uchida o'ngga burilib, o'ng oyoqda bir qadam tashlash\n2. Chap oyoqda bir qadam qo'yib, qo'llarni tushirib turish\n3. Chap oyoqni o'ng oyoqqa juft qilib qo'yish","options":{"A":"2, 3, 1","B":"1, 2, 3","C":"2, 1, 3","D":"3, 1, 2"},"answer":"C","explanation":"\"Bajar — BIR!\" hisobida chap oyoqda bir qadam qo'yilib, qo'llar tushiriladi. \"Bajar — IKKI!\" hisobida chap oyoq uchida o'ngga burilib, o'ng oyoqda bir qadam tashlanadi. \"Bajar — UCH!\" hisobida chap oyoq o'ng oyoqqa juft qilinadi, so'ng mashq takrorlanib, komanda to'liq bajarishga o'tiladi.","mnemonic":"Qadam — buril — juftla.","id":1110},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Safdan chiqish va safga qaytish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 15-§: ikkinchi va birinchi sherengadan hamda kolonnadan safdan chiqish tartibi","requires_image":false,"question":"Safdan chiqish holatlarini tegishli harakatlar bilan moslashtiring:\n1. Ikkinchi sherengada turgan harbiy xizmatchi chiqishdan oldin\n2. Birinchi sherengadagi harbiy xizmatchi safdan chiqqanda\n3. Ko'p kolonnali safda turgan harbiy xizmatchi chiqishda\nA. Ikkinchi sherengadagi harbiy xizmatchi uning bo'shagan o'rnini egallaydi\nB. Safning yaqin qanoti tomon o'ngga yoki chapga buriladi\nC. Chap qo'lini oldinda turgan harbiy xizmatchining yelkasiga qo'yadi","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Ikkinchi sherengadagi harbiy xizmatchi chiqishdan oldin chap qo'lini oldindagining yelkasiga qo'yadi — u esa bir qadam oldinga va o'ngga o'tib yo'l beradi. Birinchi sherengadagi chiqsa, uning o'rnini ikkinchi sherengadagi egallaydi. Ko'p kolonnali safda esa harbiy xizmatchi yaqin qanot tomon buriladi va yonidagi unga yo'l ochadi.","mnemonic":"Yelkaga qo'l — yo'l so'rash belgisi.","id":1111},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Harbiycha salomlashish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 14-15-§: salom berish 3-4 qadamda, shaxdam qadam 5-6 qadamda, to'xtash 2-3 qadamda","requires_image":false,"question":"Boshliq bilan munosabatdagi harakatlarni ular bajariladigan masofa bilan moslashtiring:\n1. Joyda turib harbiycha salom berish uchun boshliq tomon yuzlanish\n2. Boshliq oldiga yaqinlashganda shaxdam qadam tashlay boshlash\n3. Boshliq oldida to'xtab bildiruv berish\nA. Besh-olti qadam qolganida\nB. Ikki-uch qadam qolganida\nC. Uch-to'rt qadamga yaqin kelganida","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"Joyda turib salom berish uchun 3-4 qadamga yaqin kelgan boshliq tomon yuzlanib qad rostlanadi. Boshliq oldiga yaqinlashayotgan harbiy xizmatchi 5-6 qadam qolganida shaxdam qadam tashlay boshlaydi va 2-3 qadam qolganida to'xtab, qo'lni bosh kiyimga keltirib bildiruv beradi.","mnemonic":"6 da shaxdam, 4 da salom, 3 da to'xta.","id":1112},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Safdagi javoblar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 15-§: \"Men\", \"Xo'p bo'ladi\" va rag'batlantirilgandagi javob iboralari","requires_image":false,"question":"Vaziyatlarni harbiy xizmatchi beradigan javob bilan moslashtiring:\n1. Safda o'z familiyasini eshitganda\n2. Safdan chiqish komandasini eshitganda\n3. Komandir tomonidan rag'batlantirilganda\nA. \"Xo'p bo'ladi\"\nB. \"O'zbekiston Respublikasiga sadoqat bilan xizmat qilaman!\"\nC. \"Men\"","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"O'z familiyasini eshitgan harbiy xizmatchi \"Men\" deb, komandani eshitgach \"Xo'p bo'ladi\" deb javob beradi. Komandir saf oldida tabriklasa yoki rag'batlantirsa, harbiy xizmatchi \"O'zbekiston Respublikasiga sadoqat bilan xizmat qilaman!\" deb javob beradi va safga turadi.","mnemonic":"Men — Xo'p bo'ladi — Sadoqat bilan xizmat qilaman.","id":1113},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Qad rostlab turish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 10-§: \"ERKIN!\", \"Oyoqlar yelka kengligida TUR!\", madhiya ijrosidagi holatlar","requires_image":false,"question":"Holatlarni tegishli harakat bilan moslashtiring:\n1. \"ERKIN!\" komandasi berilganda\n2. \"Oyoqlar yelka kengligida, TUR!\" komandasida (ekipirovkasiz)\n3. Davlat madhiyasi ijrosida bosh kiyimsiz safdan tashqarida turganda\nA. Chap oyoqni yarim qadam yonga tashlab, qo'llarni orqada qovushtirish\nB. O'ng qo'lni kafti ko'krakka qaratilgan holda ko'krakning chap tomoniga qo'yish\nC. Gavda va bir oyoqni bo'sh qo'yib, gaplashmay va chalg'imay turish","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-A, 2-C, 3-B"},"answer":"C","explanation":"\"ERKIN!\" komandasida harbiy xizmatchi gavdasini hamda chap yoki o'ng oyog'ini bo'sh qo'yib, gaplashmay va chalg'imay turadi. \"Oyoqlar yelka kengligida, TUR!\" komandasida ekipirovkasiz xizmatchi chap oyog'ini yarim qadam yonga tashlab, qo'llarini bel kamari ustida orqada qovushtiradi. Madhiya ijrosida bosh kiyimsiz turgan xizmatchi o'ng qo'lini ko'krakning chap tomoniga qo'yadi.","mnemonic":"Erkin — bo'shash, keng tur — qo'l orqada, madhiya — qo'l ko'krakda.","id":1114},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Huquqiy asoslar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 4-§: \"Umumiy harbiy majburiyat va harbiy xizmat to'g'risida\"gi Qonun — 2002-yil 12-dekabr, Oliy Majlis, 9 bo'lim 51 modda","requires_image":false,"question":"\"Umumiy harbiy majburiyat va harbiy xizmat to'g'risida\"gi Qonunga oid ma'lumotlarni moslashtiring:\n1. Qabul qilingan sana\n2. Qabul qilgan organ\n3. Qonunning tarkibi\nA. Oliy Majlis\nB. 9 bo'lim, 51 modda\nC. 2002-yil 12-dekabr","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"\"Umumiy harbiy majburiyat va harbiy xizmat to'g'risida\"gi Qonun 2002-yil 12-dekabrda Oliy Majlis tomonidan qabul qilingan bo'lib, 9 bo'lim va 51 moddadan iborat. Maqsadi — umumiy harbiy majburiyatni bajarish va harbiy xizmatni o'tash bilan bog'liq munosabatlarni tartibga solish.","mnemonic":"2002-yil 12-dekabr: 9 bo'lim, 51 modda.","id":1115},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Asosiy tushunchalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 4-§: chaqiriluvchilar, harbiy xizmatchi, harbiy xizmatga majburlar ta'riflari","requires_image":false,"question":"Tushunchalarni ularning ta'rifi bilan moslashtiring:\n1. Chaqiriluvchilar\n2. Harbiy xizmatchi\n3. Harbiy xizmatga majburlar\nA. Haqiqiy harbiy xizmatdagi shaxs\nB. Qurolli Kuchlarning rezervi yoki zaxirasidagi shaxslar\nC. Harbiy xizmatga chaqiriladigan va chaqiruv uchastkalarida qayd etilgan shaxslar","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Chaqiriluvchilar — harbiy xizmatga chaqiriladigan va tuman (shahar) chaqiruv uchastkalarida qayd etilgan shaxslar. Harbiy xizmatchi — haqiqiy harbiy xizmatdagi shaxs. Harbiy xizmatga majburlar esa Qurolli Kuchlarning rezervi yoki zaxirasidagi shaxslardir; harbiy ro'yxatga olinmaganlar harbiy xizmatga majbur bo'lmagan shaxslar deyiladi.","mnemonic":"Chaqirilmoqchi — xizmatda — rezervda: uch bosqich, uch nom.","id":1116},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Harbiy xizmat turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 5-§: muddatli, safarbarlik rezervidagi, kontrakt bo'yicha va rezervchilar xizmati ta'riflari","requires_image":false,"question":"Harbiy xizmat turlarini ularning mazmuni bilan moslashtiring:\n1. Muddatli harbiy xizmat\n2. Safarbarlik chaqiruvi rezervidagi xizmat\n3. Kontrakt bo'yicha harbiy xizmat\n4. Rezervchilar xizmati\nA. Ixtiyoriylik asosida davlat bilan tuziladigan shartnomaga binoan o'taladigan xizmat\nB. Urush davri shtatlarigacha to'ldirish maqsadida xizmatni o'taganlar uchun joriy etiladigan xizmat\nC. Chaqirilish yoshidagi fuqarolarning belgilangan muddatdagi majburiy xizmati\nD. Hududiy prinsip asosida oylik yig'inlar tarzida tashkil etiladigan xizmat","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-D, 3-C, 4-B","D":"1-D, 2-C, 3-A, 4-B"},"answer":"A","explanation":"Muddatli xizmat — chaqirilish yoshidagi fuqarolarning Qurolli Kuchlar safidagi majburiy xizmati. Safarbarlik chaqiruvi rezervidagi xizmat hududiy prinsip asosida oylik yig'inlar tarzida o'tkaziladi va pul badallari kiritiladi. Kontrakt bo'yicha xizmatga ixtiyoriy ravishda davlat bilan shartnoma asosida kiriladi. Rezervchilar xizmati esa urush davrida qo'shinlar safini shtatlar darajasigacha to'ldirish maqsadida joriy etilgan.","mnemonic":"Majburiy — yig'in — shartnoma — zaxira.","id":1117},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Xizmat muddatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 5-§: muddatli xizmat 12 oy, dastlabki kontrakt 5 yil, safarbarlik rezerviga 27 yoshgacha","requires_image":false,"question":"Harbiy xizmatga oid muddatlarni qiymatlari bilan moslashtiring:\n1. Oddiy askar va serjantlar lavozimidagi muddatli harbiy xizmat\n2. Haqiqiy harbiy xizmatga kirayotganlar bilan dastlabki kontrakt\n3. Safarbarlik chaqiruvi rezervi safiga olinish yosh chegarasi\nA. Besh yil\nB. 27 yosh\nC. 12 oy","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"Muddatli harbiy xizmat oddiy askar va serjantlar tarkibi lavozimlarida 12 oy davom etadi. Haqiqiy harbiy xizmatga kirayotgan shaxslar bilan dastlabki kontrakt besh yilga tuziladi. Safarbarlik chaqiruvi rezervi safiga shaxslar 27 yoshga to'lgunga qadar olinadi.","mnemonic":"12 oy xizmat, 5 yil kontrakt, 27 yosh chegara.","id":1118},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Harbiy unvonlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 6-§, jadval: qo'shin unvonlariga mos kema unvonlari — kapitan-leytenant, III/II/I rang kapitanlari","requires_image":false,"question":"Qo'shin tarkibidagi harbiy unvonlarni ularga mos kema tarkibidagi unvonlar bilan moslashtiring:\n1. Kapitan\n2. Mayor\n3. Podpolkovnik\n4. Polkovnik\nA. III rang kapitani\nB. I rang kapitani\nC. Kapitan-leytenant\nD. II rang kapitani","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Kichik ofitserlar tarkibida qo'shin unvoni kapitanga kema tarkibida kapitan-leytenant to'g'ri keladi. Katta ofitserlarda mayor — III rang kapitani, podpolkovnik — II rang kapitani, polkovnik — I rang kapitani bilan tenglashtiriladi. Oddiy askarga esa matros unvoni mos keladi.","mnemonic":"Mayor — III, podpolkovnik — II, polkovnik — I rang: yuqorilagan sari rang kichrayadi.","id":1119},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Harbiy unvonlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 6-§: unvonga \"adliya\", \"tibbiy xizmat\" so'zlari qo'shilishi; serjantlarga qo'shin turi qo'shilmasligi","requires_image":false,"question":"Harbiy unvonlarning yozilish qoidalarini holatlar bilan moslashtiring:\n1. Tibbiy yo'nalishdagi harbiy-hisob ixtisosligi bo'lgan ofitser unvoniga\n2. Yuridik yo'nalishdagi ixtisoslikka ega ofitser unvoniga\n3. Serjant va starshinalarning harbiy unvonlariga\nA. \"Adliya\" so'zi qo'shiladi\nB. Qo'shin turi yoki xizmat nomi qo'shilmaydi\nC. \"Tibbiy xizmat\" so'zlari qo'shiladi","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Tibbiy ixtisoslikdagi ofitserlar unvoniga \"tibbiy xizmat\" (masalan, tibbiy xizmat leytenanti), yuridik ixtisoslikdagilarga \"adliya\" (adliya general-mayori) so'zlari qo'shiladi. Serjant va starshinalarning unvonlariga esa qo'shin turi yoki xizmat nomi qo'shilmaydi. Rezerv, zaxira yoki iste'fodagilarga mos ravishda \"rezervdagi\", \"zaxiradagi\", \"iste'fodagi\" so'zlari qo'shiladi.","mnemonic":"Shifokor — tibbiy xizmat, huquqshunos — adliya, serjant — qo'shimchasiz.","id":1120},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Harbiy ta'lim","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 6-§: kursant va tinglovchi farqi; kiyim-kechak va nishonlarni Prezident tasdiqlaydi","requires_image":false,"question":"Tushunchalarni ularning mazmuni bilan moslashtiring:\n1. Kursantlar\n2. Tinglovchilar\n3. Harbiy kiyim-kechak va farqlovchi nishonlarni tasdiqlovchi\nA. Harbiy ta'lim muassasasida tahsil olayotgan, ofitser harbiy unvoniga ega bo'lganlar\nB. O'zbekiston Respublikasi Prezidenti\nC. Harbiy ta'lim muassasasida tahsil olayotgan, ofitser harbiy unvoniga ega bo'lmaganlar","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Harbiy ta'lim muassasalarida tahsil olayotganlardan ofitser unvonlariga ega bo'lmaganlari kursantlar, unvonga ega bo'lganlari tinglovchilar deb nomlanadi. Harbiy xizmatchilarning kiyim-kechagi va farqlovchi nishonlarini O'zbekiston Respublikasi Prezidenti tasdiqlaydi.","mnemonic":"Unvonsiz — kursant, unvonli — tinglovchi, nishonni — Prezident.","id":1121},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Chaqiriluvchilarni tayyorlash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 7-§: tayyorlash rahbarligi — Vazirlar Mahkamasi; moliyalashtirish — hokimliklar; uslubiy ta'minlash — Mudofaa vazirligi","requires_image":false,"question":"Chaqiriluvchilarni harbiy xizmatga tayyorlashdagi vazifalarni mas'ul organlar bilan moslashtiring:\n1. Tayyorlash ishlariga umumiy rahbarlik qilish\n2. Tayyorlash ishlarini moliyalashtirish va moddiy-texnika jihatidan ta'minlash\n3. Boshlang'ich tayyorgarlikni uslubiy jihatdan ta'minlash va nazorat qilish\nA. Viloyatlar, tuman (shahar) hokimliklari\nB. Mudofaa vazirligi\nC. Vazirlar Mahkamasi","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Chaqiriluvchilarni harbiy xizmatga tayyorlash Vazirlar Mahkamasining umumiy rahbarligi ostida o'tkaziladi. Qoraqalpog'iston Vazirlar Kengashi, viloyatlar va tuman (shahar) hokimliklari bu ishlarni moliyalashtiradi va moddiy-texnika jihatidan ta'minlaydi. Tashkil etilishini nazorat qilish va uslubiy ta'minlash esa Mudofaa vazirligi hamda ta'lim muassasalari bo'lgan vazirliklar zimmasida.","mnemonic":"Mahkama boshqaradi, hokimlik pul beradi, vazirlik o'rgatadi.","id":1122},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Chaqiruv tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 8-§: chaqiruv mart-aprelda, e'lon kamida 1 oy oldin, talabalar yig'ini iyul-avgustda","requires_image":false,"question":"Chaqiruv jarayoniga oid muddatlarni moslashtiring:\n1. Muddatli harbiy xizmatga chaqiruv o'tkaziladigan oylar\n2. Chaqiruv to'g'risidagi qaror e'lon qilinishi\n3. Talabalarning bir oylik harbiy yig'inlarga jalb etilishi\nA. Chaqiruv boshlanishiga kamida bir oy qolganda\nB. Iyul-avgust oylarida\nC. Har yili mart-aprel oylarida","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Muddatli harbiy xizmatga va safarbarlik chaqiruvi rezervidagi xizmatga chaqirish Prezident qaroriga asosan har yili mart-aprel oylarida o'tkaziladi. Qaror chaqiruv boshlanishiga kamida bir oy qolganda ommaviy axborot vositalarida e'lon qilinadi. Safarbarlik rezerviga olingan talabalar esa bir oylik harbiy yig'inlarga iyul-avgust oylarida jalb etiladi.","mnemonic":"Bahorda chaqiruv, yozda talabalar yig'ini.","id":1123},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Kechiktirish va ozod etish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 8-§: kechiktirish (aka-ukasi xizmatda), ozod etish (aka-ukasi xizmatda halok bo'lgan), chaqirilmaslik (sud ishi)","requires_image":false,"question":"Chaqiriluvchining holatini unga nisbatan qo'llanadigan qaror bilan moslashtiring:\n1. Chaqiruv kunida tug'ishgan aka-ukalaridan biri muddatli harbiy xizmatni o'tayotgan bo'lsa\n2. Yaqin qarindoshlaridan biri harbiy xizmatni o'tash vaqtida halok bo'lgan bo'lsa\n3. Ishi yuzasidan dastlabki tergov olib borilayotgan yoki jinoyat ishi sudda ko'rilayotgan bo'lsa\nA. Chaqirilishdan ozod etiladi\nB. Tinchlik davrida muddatli harbiy xizmatga chaqirilmaydi\nC. Chaqirilish muddati kechiktiriladi","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Aka-ukalaridan biri muddatli xizmatni o'tayotgan chaqiriluvchining chaqirilish muddati oilaviy sharoitga ko'ra kechiktiriladi. Yaqin qarindoshi xizmat vaqtida halok bo'lganlar chaqirilishdan ozod etiladi, ammo o'z roziligi bilan xizmatga kirishi mumkin. Surishtiruv, tergov yoki sud ishi ostidagilar esa tinchlik davrida xizmatga chaqirilmaydi.","mnemonic":"Akasi xizmatda — kut, akasi halok — ozod, sud ishi — chaqirilmaydi.","id":1124},{"subject":"CHQBT","topic":"Harbiy xizmat asoslari","subtopic":"Chaqiruv uchastkasida qayd etish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 7-§: chaqiruv uchastkalarida qayd etish jarayoni — ro'yxat, komissiya, guvohnoma, harbiy ro'yxat","requires_image":false,"question":"Fuqarolarni chaqiruv uchastkalarida qayd etish jarayonining to'g'ri ketma-ketligini aniqlang:\n1. Chaqiriluvchiga qayd etilgani to'g'risidagi guvohnomaning berilishi\n2. Tashkilotlarning mudofaa ishlari organlariga fuqarolar ro'yxatini taqdim etishi\n3. Qayd etish komissiyasi shifokorlarining tibbiy ko'rikdan o'tkazishi\n4. Fuqaroning harbiy ro'yxatga kiritilishi","options":{"A":"2, 3, 1, 4","B":"1, 2, 3, 4","C":"2, 1, 3, 4","D":"3, 2, 1, 4"},"answer":"A","explanation":"Avval tashkilotlar va o'zini o'zi boshqarish organlari belgilangan muddatlarda mudofaa ishlari organlariga qayd etilishi lozim bo'lgan fuqarolar ro'yxatini beradi. So'ng qayd etish komissiyasi tarkibidagi shifokorlar (jarroh, terapevt, nevropatolog va boshqalar) tibbiy ko'rik o'tkazadi. Chaqiriluvchiga qayd etilgani to'g'risida guvohnoma berilib, huquq-majburiyatlari tushuntiriladi va qayd etilgan vaqtdan boshlab u harbiy ro'yxatga kiritiladi.","mnemonic":"Ro'yxat — ko'rik — guvohnoma — hisobga olish.","id":1125},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Umumqo'shin jangi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 34-§: jang, mudofaa va hujumning maqsadlari","requires_image":false,"question":"Tushunchalarni ularning maqsadi bilan moslashtiring:\n1. Jangning maqsadi\n2. Mudofaaning maqsadi\n3. Hujumning maqsadi\nA. Ustun dushman hujumini qaytarish, unga maksimal talafot yetkazib, muhim obyektlarni saqlab qolish\nB. Dushmanni tor-mor qilish yoki qurshovga olish, muhim hududlarni egallash\nC. Dushman jonli kuchlarini yakson qilish yoki asirga olish, qarshilik ko'rsata olishiga yo'l qo'ymaslik","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Jangning umumiy maqsadi — dushman jonli kuchlarini yakson qilish yoki asirga olish va uning keyingi qarshiligiga yo'l qo'ymaslik. Mudofaada kuch jihatidan ustun dushman hujumi qaytarilib, muhim obyektlar saqlab qolinadi. Hujum esa dushmanni tor-mor qilish yoki qurshovga olish va muhim hududlarni egallash maqsadida o'tkaziladi. Jangning asosiy turlari — mudofaa va hujum.","mnemonic":"Jang — yakson, mudofaa — qaytar, hujum — egalla.","id":1126},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Jangovar guruh","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 35-§, jadval: jangovar guruh a'zolarining qurollanishi — SVD, RPK-74, RPG-7, AK-74","requires_image":false,"question":"Jangovar guruh a'zolarini ularning quroli bilan moslashtiring:\n1. Mergan\n2. RPK pulemyotchisi\n3. PG granatomyotchisi\n4. Guruh komandiri\nA. 5,45 mm RPK-74\nB. 5,45 mm AK-74\nC. SVD\nD. RPG-7","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-C, 2-D, 3-A, 4-B","D":"1-D, 2-A, 3-C, 4-B"},"answer":"B","explanation":"Jangovar guruhda mergan SVD miltig'i bilan, ikki pulemyotchi 5,45 mm RPK-74 bilan, granatomyotchi RPG-7 bilan qurollanadi. Guruh komandiri, uning o'rinbosari, operatorlar, haydovchilar va o'qchilar esa 5,45 mm AK-74 avtomatlari bilan qurollangan.","mnemonic":"Mergan — SVD, pulemyotchi — RPK, granatomyotchi — RPG, qolganlar — AK.","id":1127},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Jangovar imkoniyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 35-§: guruh 200 m front, ikki guruh 400 m, kamida 2 tank, dushman 50% tank yo'qotsa qaytadi","requires_image":false,"question":"Jangovar guruhning mudofaadagi ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Guruh front bo'ylab mudofaa qiladigan tayanch punkti\n2. Guruh eng kamida yakson qilishi kerak bo'lgan tanklar soni\n3. Dushman hujumni davom ettirishdan qaytadigan tank yo'qotishi\nA. 2 ta tank\nB. 50 foiz\nC. 200 m gacha","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Guruh front bo'ylab 200 m gacha bo'lgan tayanch punktini mudofaa qiladi, ikki guruh oralig'i bilan bu 400 m ni tashkil etadi. Bu masofada dushmanning 3-5 tanki hujumga o'tishi mumkin, dushman odatda tanklarining 50 foizidan ayrilsa hujumdan qaytadi — shuning uchun guruh kamida 2 ta tankni yakson qilishi kerak.","mnemonic":"200 metr — 2 tank — 50 foiz.","id":1128},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Jangovar texnika","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 36-§: BTR-80 14,5 mm pulemyot, BMP-2 30 mm to'p, T-72 125 mm to'p","requires_image":false,"question":"Qurolli Kuchlardagi jangovar texnikalarni ularning asosiy quroli bilan moslashtiring:\n1. BTR-80\n2. BMP-2\n3. T-72\nA. 30 mm li avtomatik to'p va PTUR uchirish qurilmasi\nB. 125 mm li silliq devorli to'p\nC. 14,5 mm li katta kalibrli pulemyot","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"BTR-80 bronetransportyori 14,5 mm katta kalibrli pulemyot va u bilan juftlashtirilgan 7,62 mm PKT bilan qurollangan. BMP-2 da 30 mm avtomatik to'p, PKT pulemyoti va tankka qarshi boshqariluvchi raketa qurilmasi bor. T-72 tanki esa 125 mm silliq devorli to'p, PKT va 12,7 mm zenit pulemyoti bilan qurollangan.","mnemonic":"BTR — pulemyot, BMP — to'pcha, tank — katta to'p.","id":1129},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Jangovar texnika","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 36-§: BTR-80 desant 8, BMP-2 desant 7, T-72 og'irligi 44000 kg","requires_image":false,"question":"Jangovar texnikalarning ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. BTR-80 desanti\n2. BMP-2 desanti\n3. T-72 tankining og'irligi\nA. 7 kishi\nB. 44000 kg\nC. 8 kishi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"BTR-80 ekipaji 3 kishidan iborat bo'lib, 8 kishilik desantni tashiydi. BMP-2 da ham ekipaj 3 kishi (komandir, operator, mexanik-haydovchi), desanti esa 7 kishi. T-72 tankining og'irligi 44000 kg, ekipaji 3 kishidan iborat va desant tashimaydi.","mnemonic":"BTR — 8, BMP — 7, tank — desantsiz 44 tonna.","id":1130},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Chet el jangovar texnikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 36-§: M1A1 — AQSh, Chellenjer-2 — Buyuk Britaniya, Merkava Mk.1 — Isroil","requires_image":false,"question":"Rivojlangan davlatlar tanklarini ular tegishli bo'lgan armiya bilan moslashtiring:\n1. \"M1A1\" tanki\n2. \"Chellenjer-2\" tanki\n3. \"Merkava Mk.1\" tanki\nA. Buyuk Britaniya armiyasi\nB. Isroil armiyasi\nC. AQSh armiyasi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"\"M1A1\" tanki AQSh armiyasining jangovar texnikasi bo'lib, og'irligi 55,9 tonna, to'p kalibri 120 mm. \"Chellenjer-2\" Buyuk Britaniya armiyasiga tegishli, og'irligi 62,5 tonna. \"Merkava Mk.1\" esa Isroil armiyasining quroli bo'lib, 56 tonna og'irlikka ega. Uchchala tankning ekipaji 4 kishidan iborat.","mnemonic":"Abrams — Amerika, Chellenjer — Britaniya, Merkava — Isroil.","id":1131},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Harbiy aviatsiya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 37-§: MI-24B transport, Ka-52 hujum vertolyoti, SU-27 havoda hukmdorlik","requires_image":false,"question":"Aviatsiya texnikalarini ularning vazifasi bilan moslashtiring:\n1. MI-24 B vertolyoti\n2. Ka-52 \"ALLIGATOR\" vertolyoti\n3. SU-27 samolyoti\nA. Jang maydonida dushman texnikasi, o't ochish nuqtalari va ishchi kuchini yo'q qilish\nB. Havoda hukmdorlikni egallash, dushmanni uzoq raketali va yaqin manyovrli jangda yakson qilish\nC. Sakkiz kishilik o'ringa ega, kichik hajmli qo'shin tashish","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-B, 3-A","C":"1-A, 2-C, 3-B","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"MI-24 B — katta o'tochar, sakkiz kishilik o'ringa ega qo'shin tashuvchi transport vositasi, ekipaji 3 kishi. Ka-52 \"ALLIGATOR\" hujum vertolyoti bo'lib, dushman texnikasi va ishchi kuchini yo'q qilishga mo'ljallangan, ekipaji 2 kishi. SU-27 esa havoda hukmdorlikni egallash va dushmanni raketali jangda yakson qilish uchun yaratilgan, ekipaji 1 kishi.","mnemonic":"MI — tashiydi, Ka — hujum qiladi, SU — osmonni egallaydi.","id":1132},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Uchuvchisiz uchish apparatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 37-§: UUA og'irlik tasnifi — mikro 10 kg, mini 50 kg, o'rtacha 1000 kg gacha","requires_image":false,"question":"Uchuvchisiz uchish apparatlari (UUA) toifalarini ularning imkoniyatlari bilan moslashtiring:\n1. Mikro (og'irligi 10 kg gacha)\n2. Mini (og'irligi 50 kg gacha)\n3. O'rtacha (og'irligi 1000 kg gacha)\nA. 3-5 km balandlikda bir necha soat uchadi\nB. 9-10 km balandlikda 10-12 soat uchadi\nC. 1 km balandlikda 1 soat uchadi","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Mikro UUA (10 kg gacha) 1 km balandlikda 1 soat ucha oladi. Mini toifa (50 kg gacha) 3-5 km balandlikda bir necha soat uchadi. O'rtacha og'irlikdagi (1000 kg gacha) apparatlar 9-10 km balandlikda 10-12 soat uchadi, 1000 kg dan og'irlari esa 20 km balandlikda sutkadan ortiq ucha oladi.","mnemonic":"Og'irlashgan sari balandroq va uzoqroq uchadi.","id":1133},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Uchuvchisiz uchish apparatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 37-§: UUA vazifasiga ko'ra turlari — razvedka, zarba beruvchi, to'g'rilovchi-razvedka","requires_image":false,"question":"Uchuvchisiz uchish apparatlarining turlarini vazifalari bilan moslashtiring:\n1. Razvedka qiluvchi UUA\n2. Zarba beruvchi UUA\n3. To'g'rilovchi-razvedka qiluvchi UUA\nA. Razvedka qilish va zarur bo'lganda nishonni yakson qilish\nB. Razvedka bilan bir vaqtda o'z artilleriyasi o'tini to'g'rilash\nC. Taktik razvedka olib borish va ma'lumotlarni qo'mondonlikka uzatish","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"Razvedka qiluvchi UUA jang maydonida taktik razvedka olib borib, ma'lumotlarni qo'mondonlikka uzatadi. Zarba beruvchi UUA razvedkadan tashqari nishonni yakson qila oladi. To'g'rilovchi-razvedka qiluvchi UUA esa razvedka bilan bir vaqtda o'z artilleriyasining o't ochishini to'g'rilaydi va dushman nishoniga raketa uchirishni amalga oshira oladi.","mnemonic":"Ko'radi — uradi — to'g'rilaydi.","id":1134},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Uchuvchisiz uchish apparatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 37-§: LOCHIN HA341 — 180 min, 30-35 km; LOCHIN HA241 — 54 min","requires_image":false,"question":"O'zbekistonda ishlab chiqilgan LOCHIN uchuvchisiz uchish apparatlarining ko'rsatkichlarini moslashtiring:\n1. LOCHIN HA341 ning uchish davomiyligi\n2. LOCHIN HA241 ning uchish davomiyligi\n3. LOCHIN HA341 ning harakatlanish masofasi\nA. 54 daqiqa\nB. 30-35 km\nC. 180 daqiqa","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"LOCHIN HA341 apparati 30-35 km masofada harakatlanib, 180 daqiqa ucha oladi va 3 kg foydali yuk ko'taradi. LOCHIN HA241 esa 5-20 km masofada 54 daqiqa uchadi, foydali yuklamasi 1,2 kg. Ikkalasi ham elektr toki bilan ishlaydi va -20°C dan +55°C gacha haroratda qo'llanadi.","mnemonic":"341 — uch soat, 241 — bir soatga yetmaydi.","id":1135},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Muhandislik to'siqlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 38-§: minali-portlovchi, portlamaydigan va mujassamlashgan to'siqlar tarkibi","requires_image":false,"question":"Muhandislik to'siqlari turlarini ularning tarkibi bilan moslashtiring:\n1. Minali-portlovchi to'siqlar\n2. Portlamaydigan to'siqlar\n3. Mujassamlashgan to'siqlar\nA. Tankka qarshi chuqurlar, eskarplar, uyumlar, tikanli simlar, elektr va suvli to'siqlar\nB. Minali-portlovchi va portlamaydigan to'siqlarning birga qo'shilgan ko'rinishi\nC. Mina maydoni va turli quvvatdagi fugas minalar guruhi","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"Minali-portlovchi to'siqlar mina maydonlari va fugas minalar guruhini o'z ichiga olib, muhandislik to'siqlarining asosiy turi hisoblanadi. Portlamaydigan to'siqlarga tankka qarshi chuqurlar, eskarplar, kontreskarplar, uyumlar, tikanli simlar, elektr o'tkazilgan va suvli to'siqlar kiradi. Ikkala turni birga qo'shib tayyorlanganlari mujassamlashgan to'siqlar deyiladi.","mnemonic":"Portlaydi — portlamaydi — aralash.","id":1136},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Minalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 39-§, jadval: TM-62 seriyasi qobiq materiallari — M metall, P plastmassa, D yog'och, B qobiqsiz","requires_image":false,"question":"TM-62 seriyasidagi tankka qarshi minalarni qobiq materiali bilan moslashtiring:\n1. TM-62M\n2. TM-62P\n3. TM-62D\n4. TM-62B\nA. Plastmassa\nB. Qobiqsiz\nC. Metall\nD. Yog'och","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-B, 2-A, 3-D, 4-C"},"answer":"B","explanation":"TM-62 seriyasida qobiq materiali minaning belgisida aks etadi: TM-62M — metall, TM-62P — plastmassa, TM-62P2 — polietilen, TM-62T — kapron-mato, TM-62D — yog'och, TM-62B esa qobiqsiz ishlab chiqariladi. Barchasi zanjirga qarshi fugasli minalar bo'lib, -50°C dan +50°C gacha haroratda qo'llanadi.","mnemonic":"M — metall, P — plastmassa, D — daraxt, B — bo'sh (qobiqsiz).","id":1137},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Minalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 39-§: OZM-72 — og'irligi 5 kg, sakrash 0,6-0,9 m, qirish radiusi 25 m, 2400 parcha","requires_image":false,"question":"OZM-72 minasining jangovar ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Minaning og'irligi\n2. Yerdan sakrash balandligi\n3. Yoppasiga qirish radiusi\n4. Metall parchalar soni\nA. 0,6-0,9 m\nB. 2400 dona\nC. 5 kg\nD. 25 m","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-D, 2-A, 3-C, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"A","explanation":"OZM-72 parchalanuvchi, aylanasiga ta'sir qiluvchi mina bo'lib, og'irligi 5 kg, portlashda yerdan 0,6-0,9 m balandlikka sakraydi. Yoppasiga qirish radiusi 25 m, parchalarning o'ldirish masofasi 50 m gacha boradi va 2400 dona metall parchaga ega. Mina faqat qo'lda o'rnatiladi.","mnemonic":"5 kilo sakrab, 25 metrni qiradi.","id":1138},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mo'ljal olish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 40-§: Adrianov kompasi qismlari — limb, magnit mili, qarash moslamasi, to'xtatkich","requires_image":false,"question":"Adrianov kompasining qismlarini ularning vazifasi bilan moslashtiring:\n1. Limb\n2. Magnit mili\n3. Qarash moslamasi\n4. To'xtatkich\nA. Magnit azimutini aniqlash\nB. Magnit milini korpusga qotirish\nC. Burchaklardan hisob olish\nD. Nishonning yo'nalishini aniqlash","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-C, 2-D, 3-A, 4-B","D":"1-B, 2-A, 3-D, 4-C"},"answer":"A","explanation":"Kompasning limbi burchaklardan hisob olishga, magnit mili magnit azimutini aniqlashga xizmat qiladi. Qarash moslamasi nishonning yo'nalishini aniqlaydi, to'xtatkich esa magnit milini korpusga qotirib turadi. Qobiqqa barcha qismlar o'rnatilgan, hisob olgich limbdan hisob olishga mo'ljallangan.","mnemonic":"Limb sanaydi, mil ko'rsatadi, to'xtatkich qotiradi.","id":1139},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mo'ljal olish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 40-§: kompas yordamida gorizont tomonlarini aniqlash tartibi","requires_image":false,"question":"Kompas yordamida gorizont tomonlarini aniqlash harakatlarini to'g'ri tartiblang:\n1. To'xtatkichni bo'shatish\n2. Qarash moslamasini limbning nol raqamiga to'g'rilash\n3. Magnit milining shimoliy tomoni nolga to'g'ri kelguncha kompasni ohista burish\n4. Kompasni gorizontal holatga keltirish","options":{"A":"1, 2, 4, 3","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Avval kompasning qarash moslamasi limbning nol raqamiga to'g'rilanadi va kompas gorizontal holatga keltiriladi. So'ng to'xtatkich bo'shatiladi va magnit milining shimolni ko'rsatuvchi tomoni nol raqamiga to'g'ri kelguncha kompas ohista buriladi — shu tomon shimol bo'ladi, qolgan tomonlar shunga muvofiq aniqlanadi.","mnemonic":"Nolga to'g'rila — tekisla — bo'shat — bur.","id":1140},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mo'ljal olish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 40-§: limb raqamlari 15° oraliqda, bir bo'linish 3°, Quyosh 13:00 da janubda","requires_image":false,"question":"Mo'ljal olishga oid ko'rsatkichlarni qiymatlari bilan moslashtiring:\n1. Kompas limbi raqamlari yozilgan oraliq\n2. Limb shkalasining bir bo'linishi\n3. Quyosh janub tomonda turadigan vaqt\nA. 3 daraja\nB. Soat 13:00\nC. Har 15 daraja","options":{"A":"1-C, 2-B, 3-A","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Adrianov kompasi limbining raqamlari har 15 daraja oraliqda yozilgan, shkalaning bir bo'linishi esa 3 darajaga teng va hisob soat mili yo'nalishida ortib boradi. Quyosh va soat usuli Quyoshning soat 13:00 da janub tomonda turishiga asoslanadi.","mnemonic":"15 — raqam, 3 — bo'linish, 13:00 — janub.","id":1141},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mo'ljal olish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 40-§: Qutb yulduzi yordamida shimolni topish tartibi","requires_image":false,"question":"Qutb yulduzi yordamida shimolni topish harakatlarini to'g'ri tartiblang:\n1. Ikki yulduz orasidagi masofaning besh barobarida Qutb yulduzini topish\n2. Katta Ayiq turkumi \"cho'mich\"i chekkasidagi ikki yulduzni topish\n3. Yuzlangan tomon shimol ekanini belgilab, qolgan tomonlarni aniqlash\n4. Shu ikki yulduzdan tepaga qarata to'g'ri chiziq o'tkazish","options":{"A":"2, 4, 3, 1","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Avval Katta Ayiq turkumidagi \"cho'mich\" chekkasida joylashgan ikki yulduz topiladi. Ulardan tepaga qarata to'g'ri chiziq o'tkaziladi — chiziq ikki yulduz orasidagi masofaning taxminan besh barobariga yetganda Qutb yulduzi ko'rinadi. Qutb yulduzi hamisha shimolda joylashgani uchun kuzatuv tomoni shimol, chap tomon g'arb, o'ng tomon sharq bo'ladi.","mnemonic":"Cho'mich — chiziq — besh barobar — shimol.","id":1142},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otish hodisasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 43-§: o'q uzishning to'rt bosqichi ta'riflari","requires_image":false,"question":"O'q uzish bosqichlarini ularning mazmuni bilan moslashtiring:\n1. Dastlabki bosqich\n2. Birinchi (asosiy) bosqich\n3. Ikkinchi bosqich\n4. Uchinchi bosqich\nA. O'q harakati boshlanganidan porox zaryadi to'liq yonib bitgunga qadar\nB. O'q stvoldan uchib chiqqanidan porox gazlari ta'siri tugagunga qadar\nC. Porox yonishi boshlanganidan o'q qobig'i stvol kesiklariga to'liq urilgunga qadar\nD. Porox to'liq yonib bo'lganidan o'q stvol kanalidan uchib chiqquniga qadar","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"Dastlabki bosqich porox yonishidan o'q qobig'i kesiklarga to'liq urilguncha davom etadi. Birinchi (asosiy) bosqichda o'q harakatlanib, porox to'liq yonib bitadi va bosim maksimal qiymatga yetadi. Ikkinchi bosqich porox yonib bo'lganidan o'q stvoldan chiqquncha, uchinchi bosqich esa o'q chiqqanidan gazlar ta'siri havo qarshiligi bilan tenglashguncha davom etadi.","mnemonic":"Siljish — yonish — chiqish — gaz quvishi.","id":1143},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otish hodisasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 43-44-§: o'q uzish 0,001-0,06 s, stvol og'zi bosimi 300-900 kg/cm², gazlar 1200-2000 m/s, eng katta uzoqlik burchagi 35°","requires_image":false,"question":"Otish hodisasiga oid ko'rsatkichlarni qiymatlari bilan moslashtiring:\n1. O'q uzish hodisasi sodir bo'ladigan vaqt\n2. Stvol og'zi bosimi\n3. Porox gazlarining stvoldan oqib chiqish tezligi\n4. Eng katta uzoqlik burchagi\nA. 300-900 kg/cm²\nB. Taxminan 35°\nC. 0,001-0,06 soniya\nD. 1200-2000 m/s","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-C, 2-D, 3-A, 4-B","D":"1-D, 2-A, 3-C, 4-B"},"answer":"A","explanation":"O'q uzish hodisasi juda qisqa — 0,001-0,06 soniya oralig'ida sodir bo'ladi. Ikkinchi bosqichda stvol og'zi bosimi 300-900 kg/cm² ni tashkil etadi. Uchinchi bosqichda porox gazlari stvoldan 1200-2000 m/s tezlikda oqib chiqib, o'qqa qo'shimcha tezlik beradi. O'q to'liq gorizontal uzoqlikning cho'qqisiga yetadigan eng katta uzoqlik burchagi taxminan 35° ga teng.","mnemonic":"Soniyaning mingdan biri, 900 bosim, 2000 gaz, 35 daraja.","id":1144},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Trayektoriya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 44-§: og'irlik kuchi, havo qarshiligi va ballistik to'lqinning o'q uchishiga ta'siri","requires_image":false,"question":"O'qning havodagi uchishiga ta'sir etuvchi omillarni ularning ta'siri bilan moslashtiring:\n1. Og'irlik kuchi\n2. Havoning qarshilik kuchi\n3. Ballistik to'lqin\nA. Harakatni uzluksiz sekinlashtiradi va o'qni ag'darishga intiladi\nB. Ovoz to'lqinlarining urilishidan hosil bo'lib, o'q energiyasining bir qismini oladi\nC. O'qni asta-sekin pasayishga majbur qiladi","options":{"A":"1-C, 2-B, 3-A","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-A, 2-C, 3-B"},"answer":"C","explanation":"Og'irlik kuchi o'qni asta-sekin pasayishga majbur qiladi, havoning qarshilik kuchi esa harakatni uzluksiz sekinlashtirib, o'qni ag'darishga intiladi — natijada trayektoriya notekis bukilgan egri chiziq bo'ladi. O'q ovozdan tez uchganda ovoz to'lqinlarining bir-biriga urilishidan ballistik to'lqin hosil bo'ladi va o'q energiyasining bir qismi shu to'lqinga sarflanadi.","mnemonic":"Og'irlik pastga tortadi, havo to'sadi, to'lqin energiya yeydi.","id":1145},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Trayektoriya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 44-§: trayektoriya elementlari — uchish nuqtasi, qurol ufqi, trayektoriya cho'qqisi, tushish burchagi","requires_image":false,"question":"Trayektoriya elementlarini ularning ta'rifi bilan moslashtiring:\n1. Uchish nuqtasi\n2. Qurol ufqi\n3. Trayektoriya cho'qqisi\n4. Tushish burchagi\nA. Uchish nuqtasi orqali o'tuvchi gorizontal tekislik\nB. Tushish nuqtasidagi trayektoriya urinmasi bilan qurol ufqi orasidagi burchak\nC. Qurol stvoli og'zi (kesimi) markazi\nD. Trayektoriyaning eng yuqori nuqtasi","options":{"A":"1-D, 2-A, 3-C, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Uchish nuqtasi — stvol og'zi markazi bo'lib, o'q harakati shu yerdan boshlanadi. Qurol ufqi uchish nuqtasi orqali o'tuvchi gorizontal tekislikdir. Trayektoriya cho'qqisi — egri chiziqning eng yuqori nuqtasi, tushish burchagi esa tushish nuqtasidagi trayektoriya urinmasi bilan qurol ufqi orasidagi burchakdir.","mnemonic":"Boshlanish — tekislik — cho'qqi — qaytish burchagi.","id":1146},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Trayektoriya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 44-§: yer bag'irlab ketgan, osma va tutash trayektoriyalar ta'riflari","requires_image":false,"question":"Trayektoriya turlarini ularning ta'rifi bilan moslashtiring:\n1. Yer bag'irlab ketgan trayektoriya\n2. Osma trayektoriya\n3. Tutash trayektoriyalar\nA. Eng katta uzoqlik burchagidan katta balandlik burchaklarida hosil bo'ladi\nB. Har xil balandlik burchaklarida bir xil otish uzoqligini ta'minlovchi juftlik\nC. Eng katta uzoqlik burchagidan kichik balandlik burchaklarida hosil bo'ladi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Eng katta uzoqlik burchagidan (taxminan 35°) kichik burchaklarda yer bag'irlab ketgan, katta burchaklarda esa osma trayektoriyalar hosil bo'ladi. Bir xil gorizontal uzoqlikni ta'minlovchi yer bag'irlab ketgan va osma trayektoriyalar tutash trayektoriyalar deyiladi. O'qotar qurollardan otishda odatda faqat yer bag'irlab ketgan trayektoriyadan foydalaniladi.","mnemonic":"Pastdan — yer bag'irlab, balanddan — osma, juftligi — tutash.","id":1147},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Masofani aniqlash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 45-§: minglik formulasi D = B(K) x 1000 / BU elementlari","requires_image":false,"question":"Nishongacha bo'lgan masofani aniqlash formulasi D = B(K) x 1000 / BU dagi belgilarni ma'nosi bilan moslashtiring:\n1. D\n2. B(K)\n3. BU\nA. Nishonning balandligi yoki kengligi (metrda)\nB. Ostida nishon ko'rinib turgan burchak (mingdan bir o'lchovda)\nC. Nishongacha bo'lgan masofa (metrda)","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Formulada D — nishongacha bo'lgan masofa (metrda), B(K) — nishonning balandligi yoki kengligi (metrda), BU — ostida nishon ko'rinib turgan burchak (mingdan bir o'lchovda), 1000 esa o'zgarmas kattalik. Ikkita kattalikni bilgan holda uchinchisini topish mumkin.","mnemonic":"Masofa = bo'y ko'paytiruv ming, bo'luv burchak.","id":1148},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otish maydonlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 45-§: yopiq, qo'zg'almas va shikastlantiriluvchi maydonlar ta'riflari","requires_image":false,"question":"Otishga oid maydon tushunchalarini ta'riflari bilan moslashtiring:\n1. Yopiq maydon\n2. Qo'zg'almas maydon\n3. Shikastlantiriluvchi maydon\nA. Yopiq maydonning mazkur trayektoriyada nishon shikastlanishi mumkin bo'lmagan qismi\nB. Trayektoriyaning pastga ketuvchi bo'g'inida nishon balandligidan oshmaydigan joy oralig'i\nC. O'q teshmaydigan pana qirrasidan uchrashish nuqtasigacha cho'zilgan maydon","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Yopiq maydon — o'q teshmaydigan yashirinish joyi panasidagi, uning qirrasidan uchrashish nuqtasigacha cho'zilgan maydon. Uning nishon shikastlanmaydigan qismi qo'zg'almas maydon deyiladi. Shikastlantiriluvchi maydon esa trayektoriyaning pastga qarab ketuvchi bo'g'inida nishon balandligidan oshmaydigan joy oralig'idir.","mnemonic":"Pana orti — yopiq, tegmaydigan — qo'zg'almas, tegadigan — shikastlovchi.","id":1149},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Pnevmatik qurollar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 46-§: IJ-38 TTX — kalibr 4,5 mm, o'q tezligi 110-130 m/s, og'irligi 2,8 kg, uzunligi 1050 mm","requires_image":false,"question":"IJ-38 pnevmatik qurolining ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Kalibri\n2. O'q tezligi\n3. Og'irligi\n4. Umumiy uzunligi\nA. 110-130 m/s\nB. 1050 mm\nC. 4,5 mm\nD. 2,8 kg","options":{"A":"1-D, 2-A, 3-B, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"IJ-38 sport pnevmatik qurolining kalibri 4,5 mm, o'q tezligi 110-130 m/s. Stvol uzunligi 450 mm, umumiy uzunligi 1050 mm, og'irligi esa 2,8 kg. Qurol 10 m masofadan otishda dastlabki o'rganuvchilar uchun mo'ljallangan.","mnemonic":"IJ-38: 4,5 kalibr, 130 tezlik, 2,8 kilo.","id":1150},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Pnevmatik quroldan otish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 47-§: 1-mashq baholari — a'lo 4 ta, qoniqarli 2 ta; 2-mashq a'lo — 40 ball","requires_image":false,"question":"Pnevmatik quroldan otish mashqlarining baholash mezonlarini moslashtiring:\n1. 1-mashqda \"a'lo\" baho\n2. 1-mashqda \"qoniqarli\" baho\n3. 2-mashqda \"a'lo\" baho\nA. Qora doiraga 2 ta tekkizilganda\nB. 40 ball to'planganda\nC. Qora doiraga 4 ta tekkizilganda","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"Birinchi mashqda \"P\" nishonining qora doirasiga 4 ta tekkizilsa a'lo, 3 ta tekkizilsa yaxshi, 2 ta tekkizilsa qoniqarli baho qo'yiladi. Ikkinchi mashqda (8 raqamli nishon) baholash ballarda: a'lo — 40 ball, yaxshi — 35 ball, qoniqarli — 30 ball. Ikkala mashqda otish masofasi 5 m, sinov uchun 5 ta o'q beriladi.","mnemonic":"1-mashq: 4-3-2 ta; 2-mashq: 40-35-30 ball.","id":1151},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Pnevmatik quroldan otish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 47-§: pnevmatik quroldan otish mashqini bajarish tartibi","requires_image":false,"question":"Pnevmatik quroldan otish mashqini bajarish harakatlarini to'g'ri tartiblang:\n1. Nishonni mo'ljalga olish\n2. Mashg'ulot rahbarining buyrug'i bilan otish chizig'iga kelish\n3. Nafasni to'xtatib, tepkini sekin bosish\n4. Tik turish holatini egallab, qurolni qo'l va yelka bilan barqaror ushlash","options":{"A":"2, 4, 3, 1","B":"2, 4, 1, 3","C":"4, 2, 1, 3","D":"2, 1, 4, 3"},"answer":"B","explanation":"Otuvchi mashg'ulot rahbarining buyrug'i bilan otish chizig'iga keladi, ikki oyog'ini yelka kengligida qo'yib tik turish holatini egallaydi va qurolni qo'l hamda yelka bilan barqaror ushlaydi. So'ng nishonni mo'ljalga oladi va nafasni to'xtatib, tepkini sekin bosadi.","mnemonic":"Kel — tur — mo'ljalla — bos.","id":1152},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otish mashqlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 49-§: boshlang'ich otish mashqi — nishon 100 m, 3 patron, yotgan holat","requires_image":false,"question":"Avtomatdan boshlang'ich otish mashqining shartlarini qiymatlari bilan moslashtiring:\n1. Ko'krak shaklli nishon paydo bo'ladigan masofa\n2. Avtomat uchun ajratiladigan patronlar soni\n3. Otish holati\nA. 3 ta\nB. Yotgan holda\nC. 100 m","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Boshlang'ich otish mashqida yotib olgan otuvchining ko'krak hajmiga o'xshash nishon 100 m masofada paydo bo'ladi va unga bittalab 3 ta o'q uziladi. Harbiy okrug har bir o'quvchiga 3 dona o'q-dori ajratadi, otish yotgan holatda bajariladi, vaqt cheklanmagan.","mnemonic":"100 metr, 3 o'q, yotib.","id":1153},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Mo'ljalga olish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 45-§: binokl shkalalari — katta bo'lim 0-10, kichik bo'lim 0-0,5 minglik","requires_image":false,"question":"Burchak o'lchash vositalarining ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Binokl shkalasidagi katta bo'limning qiymati\n2. Binokl shkalasidagi kichik bo'limning qiymati\n3. To'g'ri mo'ljallab otishda mo'ljalga olish nuqtasi tanlanadigan joy\nA. 0-0,5 mingdan bir burchak\nB. Nishonning pastki qirrasi\nC. 0-10 mingdan bir burchak","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Binokl to'rida ikkita o'zaro perpendikulyar burchak o'lchagich shkalasi bor: katta bo'limning qiymati 0-10, kichik bo'limniki 0-0,5 mingdan bir burchakka teng. To'g'ri mo'ljallab otishda esa mo'ljalga olish nuqtasi balandlik bo'yicha odatda nishonning pastki qirrasidan tanlanadi.","mnemonic":"Katta — 10, kichik — yarim, mo'ljal — pastki qirra.","id":1154},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Kuzatuv","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 52-§, jadval: kuzatish zonalari — yaqin 0-400 m, o'rta 400-800 m, uzoq 800 m dan ortiq","requires_image":false,"question":"Kuzatish zonalarini ularning masofasi bilan moslashtiring:\n1. Yaqin zona\n2. O'rta zona\n3. Uzoq zona\nA. 400-800 metrgacha\nB. 800 metrdan ortiq\nC. 0-400 metrgacha","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"Yaqin zona 0-400 metrgacha bo'lib, unda kichik obyektlar va harakatlar yaqqol ko'rinadi. O'rta zona 400-800 metrni qamrab oladi — bu yerda obyektlarni ko'z bilan aniq farqlash mumkin. 800 metrdan ortiq uzoq zonadagi obyektlar esa faqat optik moslama yordamida ko'rinadi. Kuzatish yaqin zonadan, o'ngdan chapga qarab boshlanadi.","mnemonic":"400 gacha — yaqin, 800 gacha — o'rta, keyini — durbin ishi.","id":1155},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mudofaadagi harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 50-§: o'qotar qurollar samarali masofasi 400-600 m, o'q tuproqqa 20-25 cm, brustver 50-60 cm","requires_image":false,"question":"Mudofaa jangiga oid ko'rsatkichlarni qiymatlari bilan moslashtiring:\n1. O'qotar qurollarning samarali ta'sir ko'rsatish masofasi\n2. 7,62 mm kalibrli o'qning tuproqqa kirish chuqurligi\n3. Askarni to'liq himoyalaydigan brustver (do'nglik) qalinligi\nA. 20-25 cm\nB. 50-60 cm\nC. 400-600 m","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"O'qotar qurollarning samarali ta'sir masofasi 400-600 m bo'lib, aynan shu masofalarda yalpi o't ochish zonalari tashkil qilinadi. 7,62 mm kalibrli o'q tuproqqa 20-25 cm kiradi, shuning uchun okop oldidagi do'nglik qalinligi 50-60 cm bo'lganda askar dushman o'qotar qurollaridan butunlay himoyalanadi.","mnemonic":"600 gacha otadi, 25 gacha kiradi, 60 cm to'sadi.","id":1156},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mudofaadagi harakatlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 50-§: dushman o't ochib turganda bir kishilik okop qazish bosqichlari","requires_image":false,"question":"Dushman o't ochib turganda bir kishilik okop qazish bosqichlarini to'g'ri tartiblang:\n1. Yonboshlab kurakni g'ilofdan chiqarib, chim yoki yerning ustki qismini o'yish\n2. Yotib olgan holda avtomatni o'ng tomonga, stvolini dushman tomonga qaratib qo'yish\n3. Chim va tuproqni ko'chirib oldinga qo'yib, chuqurni kavlash","options":{"A":"2, 3, 1","B":"2, 1, 3","C":"3, 1, 2","D":"1, 2, 3"},"answer":"B","explanation":"Askar avval tanlangan joyga yotib, avtomatini qo'l uzatsa yetadigan masofada o'ng tomonga, stvolini dushman tomonga qaratib qo'yadi. So'ng chap tomonga yonboshlab kurakni g'ilofdan chiqaradi va chim yoki yerning ustki qismini o'yib, chuqur chegaralarini belgilaydi. Shundan keyin chim-tuproqni ko'chirib oldinga qo'yadi va chuqurni kavlashga tushadi — oldindagi tuproq brustver vazifasini bajaradi.","mnemonic":"Qurol yoningda — kurak qo'lingda — tuproq oldinda.","id":1157},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Hujumdagi harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 51-§: emaklash, yerga yopishib emaklash va yonboshlab emaklash qo'llanadigan holatlar","requires_image":false,"question":"Emaklash usullarini ular qo'llanadigan vaziyat bilan moslashtiring:\n1. Tizza va tirsaklarda emaklash\n2. Yerga yopishib emaklash\n3. Yonboshlab emaklash\nA. Panaliklari yo'q uchastkalarda, bosh yuqoriga ko'tarilmaydi\nB. Qorda, qumli joylarda, pulemyot sudrashda va yaradorlarni olib chiqishda\nC. Pana joyi oz uchastkalarda, sayoz ariqlar va chuqur bo'lmagan daralarda","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Oddiy emaklash (tizza va tirsaklarda) pana joyi oz, kam niqoblangan uchastkalar, sayoz ariqlar va daralarda qo'llanadi. Yerga yopishib emaklash panaliklari yo'q ochiq joylarda ishlatiladi — bunda to'liq yotib olinadi va bosh yuqoriga ko'tarilmaydi. Yonboshlab emaklash esa qorda, qumli joylarda, pulemyotni sudrab ketishda, o'q-dori va yaradorlarni olib chiqishda qo'l keladi.","mnemonic":"Tizzada — pana ozda, yopishib — ochiqda, yonboshlab — yuk bilan.","id":1158},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Hujumdagi harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 51-§: to'siq turlaridan o'tish usullari — sakrash, ko'prik, tirmashish, changak","requires_image":false,"question":"Jangdagi to'siqlarni ulardan o'tish usuli bilan moslashtiring:\n1. Transheyalar va kichik chuqurliklar\n2. Keng chuqurliklar\n3. Tik va baland g'ishtli devorlar\n4. Ayrili to'siqlar va uyumlar\nA. G'o'la, yog'och kabi mahalliy materiallardan ko'prik qilib o'tish\nB. Changaklar bilan tortib olish yoki ustiga to'shama, shinel tashlab o'tish\nC. Sakrab o'tish\nD. Bir-birini tortib, tirmashib chiqish orqali o'tish","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-B, 2-A, 3-C, 4-D","C":"1-C, 2-D, 3-A, 4-B","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Transheyalar va kichik chuqurliklardan sakrab o'tiladi, keng chuqurliklardan g'o'la yoki yog'ochdan ko'prik qilib o'tiladi. Tik va baland devorlardan tirmashib chiqiladi — askarlar bir-birini tortib yordam beradi. Ayrili to'siqlar va uyumlar avval changaklar bilan tortib olinadi, iloji bo'lmasa ustiga to'shama yoki shinel tashlab o'tiladi.","mnemonic":"Sakra — ko'prik qur — tirmash — changakla.","id":1159},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Kuzatuv","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 52-§: kuzatuvchi anjomlari — kompas, durbin, kuzatish jurnali, xarita vazifalari","requires_image":false,"question":"Kuzatuvchining anjomlarini ularning vazifasi bilan moslashtiring:\n1. Kompas\n2. Durbin\n3. Kuzatish jurnali\n4. Yirik masshtabli xarita\nA. Joy va dushmanni uzoqdan kuzatish\nB. Kuzatuv posti, dushman yo'nalishlari va mudofaa chizig'ini belgilash\nC. Ufq tomonlarini to'g'ri aniqlash\nD. Kuzatuv natijalari haqidagi ma'lumotlarni yozib borish","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-B, 2-A, 3-D, 4-C","C":"1-C, 2-D, 3-A, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"A","explanation":"Kompas ufq tomonlarini aniqlashga, durbin joy va dushmanni uzoqdan kuzatishga xizmat qiladi. Kuzatish jurnaliga kuzatuv natijalari yozib boriladi. Yirik masshtabli (1:25000, 1:50000) xaritaga esa kuzatuv posti, dushman yo'nalishlari, mudofaa chizig'i va o't ochish vositalari joylashuvi belgilanadi. Bundan tashqari soat, telefon, ofitser chizg'ichi va planshet ham zarur.","mnemonic":"Kompas yo'nalish, durbin ko'z, jurnal xotira, xarita reja.","id":1160},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Yadroviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 53-§: yadro portlash energiyasi taqsimoti — zarba to'lqini 50%, yorug'lik 35%, radioaktiv zararlanish 10%, radiatsiya 5%","requires_image":false,"question":"Yadroviy portlash energiyasining shikastlovchi omillar bo'yicha taqsimotini moslashtiring:\n1. Zarba to'lqini\n2. Yorug'lik nurlanishi\n3. Joylarning radiofaol moddalar bilan zararlanishi\n4. O'tuvchan radiatsiya\nA. Taxminan 35%\nB. Taxminan 5%\nC. Taxminan 50%\nD. Taxminan 10%","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-D, 2-A, 3-C, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Yadroviy portlash energiyasining eng katta qismi — taxminan 50% zarba to'lqiniga sarflanadi. Yorug'lik nurlanishiga 35%, joylarning radiofaol moddalar bilan zararlanishiga 10%, o'tuvchan radiatsiyaga esa 5% to'g'ri keladi. Beshinchi omil — elektromagnit impuls antennalarda va elektr tarmoqlarida yuqori kuchlanish hosil qiladi.","mnemonic":"50 — to'lqin, 35 — nur, 10 — zahar, 5 — radiatsiya.","id":1161},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Yadroviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 53-§: zarba to'lqini tezligi — 1 km 2 soniyada, 2 km 5 soniyada, 3 km 8 soniyada","requires_image":false,"question":"Yadroviy portlash zarba to'lqini bosib o'tadigan masofalarni vaqti bilan moslashtiring:\n1. 1 km masofa\n2. 2 km masofa\n3. 3 km masofa\nA. 5 soniya ichida\nB. 8 soniya ichida\nC. 2 soniya ichida","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Yadroviy portlashning zarba to'lqini 1 km masofani 2 soniyada, 2 km ni 5 soniyada, 3 km ni esa 8 soniyada bosib o'tadi. Bu vaqtni bilish askarga signaldan keyin pana joyga ulgurish imkonini beradi — to'lqin oddiy portlashdagidan ko'ra uzoqroq cho'ziladi va kuchliroq vayron qiladi.","mnemonic":"2-5-8 soniya: har kilometrga uchtadan qo'shiladi.","id":1162},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Yadroviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 53-§: alfa — geliy yadrosi, beta — elektron/pozitron, gamma — fotonlar oqimi","requires_image":false,"question":"Radioaktiv nurlanish turlarini ularning tavsifi bilan moslashtiring:\n1. Alfa-zarrachalar\n2. Beta-zarrachalar\n3. Gamma-nurlar\nA. Elektron yoki pozitron bo'lib, bir elementar elektr zaryadiga ega\nB. Fotonlar oqimidan iborat, yorug'lik tezligida (300 000 km/soniya) tarqaladi\nC. Geliy atomi yadrosidan iborat — ikki proton va ikki neytrondan tashkil topgan","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Alfa-zarrachalar geliy atomi yadrosidan iborat bo'lib, ikki proton va ikki neytrondan tashkil topgan, ikkilangan musbat zaryadga ega. Beta-zarrachalar elektron yoki pozitrondir. Gamma-nurlar fotonlar oqimidan iborat bo'lib, to'g'ri chiziq bo'ylab yorug'lik tezligida tarqaladi. O'tuvchan radiatsiyani faqat gamma-nurlar va neytronlar oqimi tashkil etadi — alfa va beta zarrachalarning havodagi yo'li qisqa.","mnemonic":"Alfa — og'ir geliy, beta — yengil elektron, gamma — nur.","id":1163},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Kimyoviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 54-§: zaharlovchi moddalar guruhlari — zarin/zoman, iprit/lyuizit, sianid kislota, fosgen","requires_image":false,"question":"Zaharlovchi moddalarni ularning ta'sir guruhi bilan moslashtiring:\n1. Zarin, zoman, V-gazlari\n2. Iprit, lyuizit\n3. Sianid kislota, xlorsian\n4. Fosgen, difosgen\nA. Terida yara paydo qilish ta'siriga ega\nB. Bo'g'uvchi ta'sirga ega\nC. Asablarni falajlash ta'siriga ega\nD. Umumiy zaharlash ta'siriga ega","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-B, 2-A, 3-D, 4-C","C":"1-C, 2-A, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"C","explanation":"Zarin, zoman va V-gazlari asablarni falajlovchi zaharlovchi moddalardir. Iprit, azotli ipritlar va lyuizit terida yara paydo qiladi. Sianid kislota va xlorsian umumiy zaharlash ta'siriga, fosgen va difosgen esa bo'g'uvchi ta'sirga ega. Bularning barchasi o'ldiruvchi zaharlovchi moddalar guruhiga kiradi.","mnemonic":"Zarin — asab, iprit — teri, sianid — qon, fosgen — nafas.","id":1164},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Kimyoviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 54-§: psixokimyoviy — DLK, BZ; lakrimatorlar — xloratsetofenon, CS; sternitlar — adamsit","requires_image":false,"question":"Vaqtincha safdan chiqaruvchi zaharlovchi moddalarni guruhlari bilan moslashtiring:\n1. Lizergin kislota dietilamidi (DLK), BZ\n2. Brombenzilsianid, xloratsetofenon, CS, CR\n3. Adamsit, difenilxlorarsin\nA. Ko'z shilliq pardasiga ta'sir etuvchi, yosh oqizuvchi moddalar (lakrimatorlar)\nB. Yuqori nafas yo'llari va burun shilliq pardasiga ta'sir etuvchi moddalar (sternitlar)\nC. Psixokimyoviy ta'sirga ega moddalar","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"DLK va BZ psixokimyoviy ta'sirga ega bo'lib, qo'shinlarning ish faoliyatini pasaytiradi. Brombenzilsianid, xloratsetofenon, CS va CR ko'z shilliq pardasiga ta'sir etib yosh oqizadi — ular lakrimatorlar deyiladi. Adamsit va difenilxlorarsin esa yuqori nafas yo'llari hamda burun shilliq pardasiga ta'sir etuvchi sternitlardir. Bu guruhlar vaqtincha safdan chiqaruvchi moddalar hisoblanadi.","mnemonic":"Psixika — ko'z yoshi — aksa: uchalasi o'ldirmaydi, lekin safdan chiqaradi.","id":1165},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Yadroviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 53-§: portlash turlari — havoda, yerusti/yerosti, suv usti/osti oqibatlari","requires_image":false,"question":"Yadro portlash turlarini ularning zararlash xususiyati bilan moslashtiring:\n1. Havoda portlash\n2. Yerusti va yerosti portlashlari\n3. Suv yuzasi va suv ostida portlash\nA. Radioaktiv bulut yo'nalishi bo'ylab keng maydonlarning zararlanishi\nB. Yaqin atrofdagi kemalar, portlar va qirg'oq qurilmalarining kuchli zararlanishi\nC. Asosan portlash sodir bo'lgan hududning o'zida uncha katta bo'lmagan zararlanish","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Havoda portlashda radioaktiv zararlanish xavfi asosan portlash hududining o'zida bo'lib, markazga yaqinlashgan sari ortadi. Yerusti va yerosti portlashlari radioaktiv bulut yo'nalishi bo'ylab keng maydonlarni zararlaydi. Suv yuzasi va suv ostidagi portlash esa yaqin kemalar, portlar, harbiy dengiz bazalari va qirg'oq qurilmalarini kuchli zararlaydi.","mnemonic":"Havoda — tor, yerda — keng, suvda — qirg'oqqa zarba.","id":1166},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Kuyishda birinchi yordam","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 34-§: kuyishning 4 darajasi va terining holatiga ko'ra belgilari","requires_image":false,"question":"Kuyish darajalarini ularning belgilari bilan moslashtiring:\n1. 1-darajali kuyish\n2. 2-darajali kuyish\n3. 3-darajali kuyish\n4. 4-darajali kuyish\nA. Suyuqlik bo'lgan pufakchalar hosil bo'ladi, 2-3 haftada tuzaladi\nB. Mushak, suyak va ichki to'qimalar zararlanadi, jabrlanuvchi jiddiy ahvolda\nC. Teri qizaradi, yengil shish va achishish, pufaksiz, 3-5 kunda tuzaladi\nD. Teri chuqur shikastlanib kulrang yoki qora to'qima paydo bo'ladi, og'riq kam","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-B, 2-A, 3-D, 4-C","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"A","explanation":"Birinchi darajali kuyishda teri qizaradi, pufakcha bo'lmaydi va 3-5 kunda tuzaladi. Ikkinchi darajada suyuqlikli pufakchalar hosil bo'lib 2-3 haftada bitadi. Uchinchi darajada teri chuqur shikastlanadi, nerv uchlari zararlangani uchun og'riq kam bo'ladi. To'rtinchi darajada mushak va suyaklargacha zarar yetadi.","mnemonic":"Qizarish — pufak — qora to'qima — suyak: chuqurlik ortib boradi.","id":1167},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Elektr tokidan zararlanish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 34-§: elektr tokidan zararlanganda birinchi yordam tartibi","requires_image":false,"question":"Elektr tokidan zararlanganda birinchi yordam bosqichlarini to'g'ri tartibda joylashtiring:\n1. Jarohatlarni ko'rikdan o'tkazib kuygan joyga steril bog'lam qo'yish\n2. O'z xavfsizligini ta'minlab, jabrlanuvchini tok manbayidan ajratish\n3. Nafas va yurak urishini tekshirib, kerak bo'lsa reanimatsiya boshlash\n4. Tez tibbiy yordamni (103 yoki 112) chaqirish","options":{"A":"1, 2, 3, 4","B":"2, 3, 1, 4","C":"4, 2, 3, 1","D":"2, 1, 3, 4"},"answer":"B","explanation":"Avval o'z xavfsizligini ta'minlab jabrlanuvchini quruq tayoq yoki mato bilan tok manbayidan ajratish kerak. So'ng nafas va yurak urishi tekshiriladi, to'xtagan bo'lsa darhol yurak massaji va sun'iy nafas boshlanadi. Keyin kuygan joylarga steril bog'lam qo'yiladi va Tez tibbiy yordam chaqiriladi, chunki yengil urish ham yurakka zarar yetkazishi mumkin.","mnemonic":"Avval ajrat, keyin tekshir, so'ng bog'la, oxirida chaqir.","id":1168},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Kuyishda birinchi yordam","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 34-§: kuygan joyni salqin suv bilan yuvish muddati","requires_image":false,"question":"Kuygan joyni qancha vaqt davomida salqin, lekin muzdek bo'lmagan suv bilan yuvish tavsiya etiladi?","options":{"A":"30-40 daqiqa","B":"10-15 daqiqa","C":"1 soat","D":"1-2 daqiqa"},"answer":"B","explanation":"Kuygan joyni 10-15 daqiqa davomida salqin, lekin muzdek bo'lmagan suv bilan yuvish kerak. Bu issiqlik ta'sirini to'xtatadi va to'qima shikastini cheklaydi. So'ng steril doka yoki toza mato bilan yopiladi, pufakchalarni teshib yuborish mumkin emas.","mnemonic":"Salqin suv — chorak soat: issiqlikni so'ndiradi.","id":1169},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Bosh miya shikastlanishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 36-§: bosh miya yopiq shikastlari — chayqalish, qon quyilishi, ezilish, suyak sinishi","requires_image":false,"question":"Bosh miya shikastlanishi turlarini ularning belgisi bilan moslashtiring:\n1. Miya chayqalishi\n2. Miyaga qon quyilishi\n3. Bosh miya ezilishi\n4. Bosh suyagi sinishi\nA. Quloq yoki burundan suyuqlik oqishi, ko'z atrofida \"ko'zoynak simptomi\"\nB. Qisqa muddatli hushdan ketish, bosh aylanishi, quloqlarda shovqin\nC. Uzoq davom etuvchi hushdan ketish, nutq buzilishi, harorat ko'tarilishi\nD. Qon tomirlari yorilishi, og'ir bosh og'rig'i, og'ir falajlanish","options":{"A":"1-B, 2-A, 3-C, 4-D","B":"1-B, 2-D, 3-C, 4-A","C":"1-C, 2-D, 3-A, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"B","explanation":"Miya chayqalishi eng yengil shakl bo'lib, qisqa hushdan ketish va quloqlarda shovqin bilan kechadi. Qon quyilishida tomirlar yorilib og'ir falajlanish kuzatiladi. Ezilishda hushdan ketish soatlab davom etadi va harorat ko'tariladi. Bosh suyagi sinishida quloq yoki burundan suyuqlik oqib, ko'z atrofida \"ko'zoynak simptomi\" paydo bo'ladi.","mnemonic":"Chayqalish yengil, quyilish og'ir, ezilish uzoq, sinish — ko'zoynak.","id":1170},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Bosh miya shikastlanishi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 36-§: bosh suyagi sinishida ko'z atrofida ko'karish belgisi","requires_image":false,"question":"Bosh suyagi asosi sinishida ko'z atrofida ko'karish hosil bo'lishi qanday nom bilan ataladi?","options":{"A":"\"Halqa simptomi\"","B":"\"Ko'zoynak simptomi\"","C":"\"Niqob simptomi\"","D":"\"Quyosh simptomi\""},"answer":"B","explanation":"Bosh suyagi sinishida ko'z atrofida ko'karish hosil bo'ladi va bu \"ko'zoynak simptomi\" deb ataladi. Bunda quloq yoki burundan qon yoxud tiniq suyuqlik oqishi va ong buzilishi ham kuzatiladi. Bunday jabrlanuvchini qimirlatmasdan, ochiq yarani toza bog'lov bilan yopib, Tez tibbiy yordam chaqirish kerak.","mnemonic":"Ikki ko'z atrofi ko'karsa — ko'zoynak taqilgandek.","id":1171},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Tayanch-harakat apparati shikastlanishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 36-§: tayanch-harakat apparati shikastida birinchi yordam qoidalari va man etilgan harakatlar","requires_image":false,"question":"Tayanch-harakat apparati shikastlanganda qilinadigan va man etilgan harakatlarni moslashtiring:\n1. Harakatsizlantirish\n2. Sovuq narsa qo'yish\n3. Chiqib turgan suyakni joyiga solish\n4. Qiyshiq a'zoni to'g'rilash\nA. Man etiladi, asoratga olib keladi\nB. To'g'ri yordam, shish va og'riqni kamaytiradi\nC. Man etiladi, qo'shimcha shikast yetkazadi\nD. To'g'ri yordam, jarohatning yuqori va pastidagi bo'g'inni qotirish","options":{"A":"1-A, 2-B, 3-C, 4-D","B":"1-C, 2-D, 3-A, 4-B","C":"1-D, 2-B, 3-C, 4-A","D":"1-B, 2-A, 3-D, 4-C"},"answer":"C","explanation":"To'g'ri yordam — shikastlangan joyni harakatsizlantirish va jarohatning ikki tomonidagi bo'g'inni qotirish hamda sovuq narsa qo'yib shishni kamaytirish. Chiqib turgan suyakni joyiga solishga yoki qiyshiq a'zoni to'g'rilashga urinish man etiladi, chunki bu qo'shimcha shikast va asoratga olib keladi.","mnemonic":"Harakatsizlantir va sovit — solma, to'g'rilama.","id":1172},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Bo'g'imlar chiqishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 37-§: chiqish belgilari — deformatsiya, harakat kamayishi, uzunlik o'zgarishi","requires_image":false,"question":"Bo'g'im chiqishidagi belgilarni ularning izohi bilan moslashtiring:\n1. Deformatsiya\n2. Bo'g'imda harakatning kamayishi\n3. Qo'l-oyoq uzunligi o'zgarishi\n4. Kuchli og'riq\nA. Ko'pincha kalta tortadi, ba'zan uzayadi\nB. Chiqqan bo'g'im oxiri yumshoq to'qimani bo'rtirib turadi, sohasi cho'kkan\nC. Chiqish sodir bo'lishi bilan keskin paydo bo'ladi\nD. Bo'g'im odatdagidek harakatlana olmaydi","options":{"A":"1-A, 2-D, 3-B, 4-C","B":"1-B, 2-A, 3-D, 4-C","C":"1-B, 2-D, 3-A, 4-C","D":"1-C, 2-D, 3-A, 4-B"},"answer":"C","explanation":"Chiqishda bo'g'im deformatsiyalanadi — chiqqan oxir yumshoq to'qimani bo'rtirib turadi va bo'g'im sohasi cho'kkan ko'rinadi. Bo'g'imda harakat kamayadi, qo'l yoki oyoq uzunligi o'zgarib ko'pincha kaltalashadi. Bularning barchasi kuchli og'riq bilan kechadi.","mnemonic":"Shakl buziladi, harakat kamayadi, uzunlik o'zgaradi — og'riq doim.","id":1173},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Pay cho'zilishi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 37-§: pay cho'zilishida muzli xalta qo'yish muddati","requires_image":false,"question":"Pay cho'zilishida jarohatlangan joyga muzli xaltani qancha vaqt qo'yish tavsiya etiladi?","options":{"A":"2-3 daqiqa","B":"40-45 daqiqa","C":"1-2 soat","D":"15-20 daqiqa"},"answer":"D","explanation":"Pay cho'zilishida jarohatlangan joyga 15-20 daqiqa davomida muzli xalta qo'yiladi va buni 3-4 soat davomida takrorlash mumkin. Bu shish va og'riqni kamaytiradi. Jarohatlangan qo'l yoki oyoqni yuqoriga ko'tarish ham qon aylanishini yaxshilaydi.","mnemonic":"Muz — chorak soatdan ko'proq, lekin yarim soatdan kam.","id":1174},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Qo'l-oyoqqa bog'lam qo'yish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 37-§: qo'lqopsimon, boshoqsimon, sakkizsimon bog'lam usullari","requires_image":false,"question":"Bog'lam usullarini ular qo'llaniladigan soha bilan moslashtiring:\n1. Boshoqsimon bog'lam\n2. Qo'lqopsimon bog'lam\n3. Sakkizsimon bog'lam\n4. Qaytuvchi bog'lam\nA. Panjaning hamma barmoqlarini birin-ketin qo'lqop shaklida bintlash\nB. Bosh barmoq va son yuqori qismini bog'lashda\nC. Oyoq panjasining bittasini bog'lashda\nD. Kaftga qo'yiladigan bog'lam","options":{"A":"1-B, 2-D, 3-A, 4-C","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-B, 3-D, 4-C","D":"1-B, 2-A, 3-D, 4-C"},"answer":"D","explanation":"Boshbarmoq boshoqsimon tipda bog'lanadi va son yuqori qismi ham boshoqsimon bog'lamdan foydalanadi. Qo'lqopsimon bog'lamda panjaning hamma barmoqlari birin-ketin qo'lqop shaklida bintlanadi. Kaftga sakkizsimon bog'lam qo'yiladi, oyoq panjasining bittasini bog'lashda esa qaytuvchi bog'lam ishlatiladi.","mnemonic":"Bosh barmoq — boshoq, panja — qo'lqop, kaft — sakkiz, panja uchi — qaytuvchi.","id":1175},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Qo'l-oyoqqa bog'lam qo'yish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 37-§: qo'lqopsimon bog'lamda chap va o'ng qo'lni qaysi barmoqdan boshlash","requires_image":false,"question":"Qo'lqopsimon bog'lamda chap qo'lni bintlash qaysi barmoqdan boshlanadi?","options":{"A":"Jimjiloqdan","B":"Bosh barmoqdan","C":"Ko'rsatkich barmoqdan","D":"O'rta barmoqdan"},"answer":"A","explanation":"Qo'lqopsimon bog'lamda bintlashni qulaylashtirish maqsadida chap qo'lni jimjiloqdan, o'ng qo'lni esa bosh barmoqdan boshlash kerak. Har bir barmoq alohida bintlanib, qo'lqop shaklida butun panja o'raladi.","mnemonic":"Chap — jimjiloqdan, o'ng — bosh barmoqdan.","id":1176},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Umurtqa shikastlanishi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 38-§: bo'yin umurtqasi shikastlanishida birinchi yordam tartibi","requires_image":false,"question":"Bo'yin umurtqasi shikastlanishida birinchi yordam bosqichlarini to'g'ri tartibda joylashtiring:\n1. Bemorni tekis va qattiq yuzaga yotqizish\n2. Bo'yinga ortopedik shina yoki yostiq qo'yib harakatni cheklash\n3. Tez tibbiy yordamni chaqirib shifoxonaga yetkazish","options":{"A":"1, 2, 3","B":"3, 2, 1","C":"2, 3, 1","D":"2, 1, 3"},"answer":"D","explanation":"Avval bo'yinni harakatsizlantirish uchun ortopedik shina yoki yostiq qo'yiladi. So'ng bemor tekis va qattiq yuzaga yotqiziladi, bo'yinni ko'tarish yoki egishdan saqlaniladi. Keyin Tez tibbiy yordam chaqirilib bemor shifoxonaga yetkaziladi.","mnemonic":"Avval qot, keyin yotqiz, oxirida chaqir.","id":1177},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Ko'krak jarohatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 39-§: ko'krakning yopiq jarohatlari — gemotoraks va pnevmotoraks","requires_image":false,"question":"Ko'krak jarohati tushunchalarini ularning izohi bilan moslashtiring:\n1. Gemotoraks\n2. Pnevmotoraks\n3. Yopiq jarohat\n4. Ochiq jarohat\nA. O'pkaga havo yig'ilishi\nB. Pichoq yoki o'q kirishi natijasidagi teshilgan jarohat\nC. O'pkaga qon yig'ilishi\nD. Qovurg'a sinishi, teri butunligi buzilmaydi","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"Gemotoraks — o'pkaga qon yig'ilishi, pnevmotoraks esa o'pkaga havo yig'ilishi. Yopiq jarohatda qovurg'a sinadi yoki o'pka jarohatlanadi, ammo teri butunligi buzilmaydi. Ochiq jarohatda pichoq, o'q yoki metall ko'krak qafasini teshib o'tadi.","mnemonic":"Gemo — qon, pnevmo — havo; yopiq — teri but, ochiq — teshik.","id":1178},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Ko'krak jarohatlari","difficulty":"Y1","bloom_level":"Qo'llash","qtype":"single","source_construct":"11-sinf, 39-§: ko'krakning ochiq teshilgan jarohatida birinchi yordam","requires_image":false,"question":"Ko'krakning ochiq (teshilgan) jarohatida birinchi yordamda asosiy chora nima?","options":{"A":"Iliq kompress qo'yib qon aylanishini tezlashtirish","B":"Jabrlanuvchini chalqancha yotqizib qo'l-oyog'ini ko'tarish","C":"Yarani ochiq qoldi
