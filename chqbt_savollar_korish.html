a qo‘llik tuzilma qo‘lladi","requires_image":false,"question":"Temur jangda an'anaviy qanot tuzilmasidan voz kechib, qanday yangi usulni joriy etdi?","options":{"A":"Maqsadga qarshi yengil armiya yo‘llash","B":"Qo‘shini 7 ta qo‘llikga bo‘lish","C":"Markaziy qatlamni kuchaytirish","D":"Yashirin harakatlarni qo‘llash"},"answer":"B","explanation":"Temur an'anaviy qanotlardan voz kechib, qo‘shini 7 ta qo‘llikga bo‘lishi ta'kidlangan; boshqa usullar tasvirlanmagan.","mnemonic":"Temur – yeddi qo‘llik","id":12},{"subject":"Harbiy ta'lik","topic":"Amir Temur taktikasi","subtopic":"Qo‘lliklarning maqsadi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Temur 7 ta qo‘llikga bo‘lish orqali har bir qismga maxsus vazifa belgilagan","requires_image":false,"question":"Quyidagi qo‘llik turlarini ularning asosiy vazifasi bilan moslashtiring:\n1. Avangard\n2. Markaziy\n3. Arxa\n4. Qorovul\nA. Dushmanni birinchi bosqichda zarba bilan siljitish\nB. Orta bosqichda asosiy hujumni amalga oshirish\nC. Qo‘shinning xavfsizligini ta'minlash\nD. Yengil kuchlarni orqaga tortish","options":{"A":"1-D, 2-C, 3-B, 4-A","B":"1-A, 2-B, 3-D, 4-C","C":"1-C, 2-D, 3-A, 4-B","D":"1-B, 2-A, 3-C, 4-D"},"answer":"B","explanation":"Avangard birinchi zarba (A), Markaziy asosiy hujum (B), Arxa yengil kuchlarni orqaga tortish (D), Qorovul xavfsizlik (C) bilan mos keladi. Boshqa variantlar tartibda xato.","mnemonic":"Avangard – zarba, Markaz – hujum, Arxa – orqa, Qorovul – xavfsizlik","id":13},{"subject":"Harbiy ta'lik","topic":"Jaloliddin Manguberdi taktikasi","subtopic":"Taktik elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Manguberdi taktikasi bir necha asosiy tamoyillardan iborat: shiddat, yirik kuchlar, to‘qatdan zarba, tez natija","requires_image":false,"question":"Manguberdi taktikasi elementlarini ularning tavsifi bilan moslashtiring:\n1. Shiddatli harakat\n2. Yirik kuchlarni jamlash\n3. To‘qatdan zarba\n4. Tez natija\nA. Dushmanga to‘liq kuch bilan urish\nB. Barcha mavjud kuchlarni maksimal tezlikda harakatga keltirish\nC. G'alabani darhol mustahkamlash\nD. Katta birliklarni bosh zarba yo'nalishida birlashtirish","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-D, 2-C, 3-B, 4-A","C":"1-A, 2-B, 3-C, 4-D","D":"1-B, 2-D, 3-A, 4-C"},"answer":"D","explanation":"1‑B shiddatli harakatni, 2‑D yirik kuchlarni jamlashni, 3‑A to‘qatdan zarbani, 4‑C tez natijani ifodalaydi. Boshqa tartibda mos kelmaydi.","mnemonic":"Shiddat – B, Yirik – D, To‘qat – A, Tez – C","id":14},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy uslubi","subtopic":"Jangdan keyingi bosqichlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"1391-yildagi jangdan keyin To‘xtamishxon ham 7 ta qo‘llik usulini qo‘lladi; 1395-yildagi Terek daryosi jangida esa kamondan o‘q uzish usuli qo‘llanildi","requires_image":false,"question":"Quyidagi voqealarni to‘g‘ri vaqt tartibida joylashtiring:\n1. To‘xtamishxon 7 qo‘llik usulini qo‘lladi\n2. Amir Temur 1391-yilda To‘xtamishxon qo‘shiniga qarshi jang o'tkazdi\n3. 1395-yilda Terek daryosi jangida kamondan o‘q uzish usuli ishlatildi\n4. Amir Temur qo‘shini 7 qo‘llikga bo‘lishi amalga oshirildi","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"4, 2, 3, 1","D":"1, 2, 3, 4"},"answer":"A","explanation":"Birinchi voqea 1391-yildagi jang (2), undan keyin qo‘shini 7 qo‘llikga bo‘lish (4), keyin To‘xtamishxon ham usulni qabul qilgan (1), so‘ng 1395-yildagi Terek daryosi jangida kamondan o‘q uzish (3).","mnemonic":"Jang – bo‘lish – usul – kamon","id":15},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi taktikasi","subtopic":"Strategik qarorlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Manguberdi harbiy muvaffaqiyatlarni tez va unumli foydalanish tamoyili bilan darhol mustahkamlashni nazarda tutadi","requires_image":false,"question":"Manguberdi strategiyasida erishilgan g‘alabani qanday qilib mustahkamlaydi?","options":{ a \"to'fangdoz (chaqmoqtosh yordamida pilta miltiq otuvchi)larni jangga tashlaydi\" degan ibora mavjud.","requires_image":false,"question":"Bobur jangida qo'llanilgan qurol turlarini ularning funksiyalari bilan moslashtiring:\n1. To'fangdoz\n2. Farangi (miltiq)\n3. Arava\n4. Qalqon\nA. Yengil piyoda hujumini qo'llab-quvvatlash\nB. Jang maydonida og'ir artilleriyaviy zarba\nC. Harbiy birliklarni birlashtirish, transport\nD. Harbiy pozitsiyani mustahkamlash","options":{"A":"1-C, 2-D, 3-B, 4-A","B":"1-B, 2-A, 3-C, 4-D","C":"1-A, 2-B, 3-D, 4-C","D":"1-D, 2-C, 3-A, 4-B"},"answer":"B","explanation":"To'fangdoz – og'ir artilleriyaviy zarba (B); Farangi miltiq – yengil piyoda hujumini qo'llab-quvvatlaydi (A); Arava – transport va birliklarni birlashtiradi (C); Qalqon – pozitsiyani mustahkamlaydi (D).","mnemonic":"To'fang – B, Farangi – A, Arava – C, Qalqon – D","id":19},{"subject":"Harbiy ta'lim","topic":"Jang tarkibi","subtopic":"Qurilma turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"To'fangdoz\", \"Farangi (miltiq)\", \"Arava\", \"Qalqon\" nomlari keltirilgan.","requires_image":false,"question":"Quyidagi harbiy uskunalardan qaysi biri og'ir artilleriyaviy qurol hisoblanadi?","options":{"A":"Arava","B":"Farangi (miltiq)","C":"Qalqon","D":"To'fangdoz"},"answer":"D","explanation":"To'fangdoz – chaqmoqtosh yordamida ishlovchi og'ir artilleriyaviy qurilma. Farangi miltiq – yengil, arava transport, qalqon himoya vositasi.","mnemonic":"To'fang – og'ir artilleriya","id":20},{"subject":"Harbiy ta'lim","topic":"Bobur strategiyasi","subtopic":"Strategik tavsif","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Strategiyasi\" bo'limi alohida ko'rsatilgan, ammo tarkibi yo'q, shuning uchun umumiy strategik tamoyillarni qo'llash.","requires_image":false,"question":"Bobur strategiyasida \"burongkor\" usulining maqsadi nima?","options":{"A":"Havo qo'shinlarini qo'llash","B":"Uzoq muddatli qo'shinlarni erkin harakatlantirish","C":"Markaziy qismni to'g'ridan-to'g'ri zarba bilan mag'lub qilish","D":"Dushmanning asosiy kuchini qo'shni tomondan bosib o'tish"},"answer":"D","explanation":"Burongkor usul dushmanning asosiy, ya'ni markaziy kuchini qo'shni tomondan bosib o'tishni ko'zda tutadi. B markaziy to'g'ridan-to'g'ri hujum, C harakatlanishga, D havo qo'shinlariga oid.","mnemonic":"Burongkor – yon tomondan bosadi","id":21},{"subject":"Harbiy ta'lim","topic":"Bobur harbiy taktikasi","subtopic":"Taktik bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda jang bosqichlari: (1) aravalar va qalqonlar bilan tayyorlash, (2) to'fangdoz va farangi bilan zarba, (3) dushman sarosimaga tushishi, (4) hududni egallash.","requires_image":false,"question":"Bobur jangining bosqichlarini to'g'ri ketma-ketlikda joylashtiring:\n1. Aravalar, qalqonlar bilan harbiy birliklarni tayyorlash\n2. To'fangdoz va farangi bilan og'ir zarba berish\n3. Dushman sarosimaga tushib, tartibsizlanadi\n4. Dehli va Agrani hududini egallash","options":{"A":"1, 3, 2, 4","B":"1, 2, 3, 4","C":"2, 1, 3, 4","D":"3, 1, 2, 4"},"answer":"B","explanation":"Bobur avvalo tayyorlanadi (1), keyin og'ir qurol bilan zarba beradi (2), dushman sarosimaga tushadi (3), oxirida hududni egallaydi (4). B, C, D tartiblari noto'g'ri.","mnemonic":"Tayyor → Zarba → Sarosima → Egallash","id":22},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Harbiy qarorlar qabul qilish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Jang‑u‑jadal bo‘limida jang maydoni, dushmanni baholash, qo‘shinning joylashuvi bosqichlari keltirilgan","requires_image":false,"question":"Temur tuzuklari bo‘yicha jang maydonini baholash jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Jang maydonining suvga yaqinligini o‘rganish\n2. Dushman lashkari sonini aniqlash\n3. Qo‘shinning joylashtirilish tartibini belgilash\n4. Dushmanni baholash mezoniga qarab harakat rejasini tuzish","options":{"A":"1, 2, 3, 4","B":"3, 2, 1, 4","C":"2, 1, 3, 4","D":"2, 3, 1, 4"},"answer":"A","explanation":"Avval suvga yaqinlik o‘rganiladi (1), keyin dushman soni aniqlanadi (2), keyin qo‘shinning joylashuvi (3), oxirida dushmonga qarshi harakat rejasi (4) tuziladi. Shuning uchun 1‑2‑3‑4 tartibi to‘g‘ri.","mnemonic":"Suv‑son‑joy‑reja","id":23},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Harbiy qo‘shinning joylashuvi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Jang-u jadal bo‘limida dushmanni baholash mezonlari va qo‘shinning hududda joylashuvi talablari ro‘yxatlangan","requires_image":false,"question":"Qo‘shinning hududda joylashuvi talablari bilan moslashtiring:\n1. Suvga yaqinlikni hisobga olish\n2. Asosiy harbiy choralarni belgilash\n3. Dushman sonini aniqlash\nA. Jang maydonining strategik aniqligi\nB. Harbiy rejimning operativ nazorati\nC. Dushman kuchining baholanishi","options":{"A":"1-A, 2-B, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-A, 3-B","D":"1-B, 2-C, 3-A"},"answer":"A","explanation":"1‑suvi yaqinligi (A), 2‑asosiy harbiy choralar (B), 3‑dushman soni (C) bilan mos keladi. Shuning uchun 1‑A, 2‑B, 3‑C to‘g‘ri.","mnemonic":"Suv‑Chora‑Son","id":24},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Harbiy tashkilotning vazifalari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Ikkinchi qismda 'davlatni idora etishda kimlarga tayanish' va 'armiyaning tuzilishi' bo‘yicha bosqichlar keltirilgan","requires_image":false,"question":"Davlatni idora etishda asosiy bosqichlarni to‘g‘ri tartibda joylashtiring:\n1. Vazirni tanlash\n2. Qo‘shinni tashkil etish\n3. Mansabdorlar vazifalarini belgilash\n4. Sipoh maoshlarini aniqlash","options":{"A":"1, 2, 4, 3","B":"1, 2, 3, 4","C":"1, 3, 2, 4","D":"2, 1, 3, 4"},"answer":"B","explanation":"Avvalo vazir tanlanadi (1), keyin qo‘shin tashkil etiladi (2), mansabdorlar vazifalari belgilangan (3), va nihoyat sipoh maoshlarini aniqlash (4) amalga oshiriladi. Shuning uchun 1‑2‑3‑4 tartibi to‘g‘ri.","mnemonic":"Vazir‑Qo‘shin‑Vazifa‑Maosh","id":25},{"subject":"Harbiy ta'lim","topic":"Jang maydoni talablar","subtopic":"Kenglik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Urush maydoni keng va oldi ochiq bo'lishi lozim","requires_image":false,"question":"Jang maydonining keng va ochiq bo'lishi asosan qanday vazifani bajaradi?","options":{"A":"Suvni to'plash","B":"Qurilish materiallarini omborlash","C":"Kuzatish va o'q otishning erkinligini ta'minlash","D":"Yashirin qo'shinlarni yashirish"},"answer":"C","explanation":"Keng va ochiq maydon kuzatish hamda o'q otish imkoniyatini kengaytiradi, bu matnda keltirilgan talabga mos keladi.","mnemonic":"Keng maydon – erkin kuzatish","id":26},{"subject":"Harbiy ta'lim","topic":"Jang maydoni talablar","subtopic":"Yashirin joylashuv","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Bo'linmalarning tarqoq va yashirincha joylashuvi","requires_image":false,"question":"Tarqoq va yashirincha joylashuvning asosiy maqsadi nima?","options":{"A":"Suvga yaqinlikni oshirish","B":"Tez yig'ilish va manevrni amalga oshirish","C":"Tashqi ko'rinishni yaxshilash","D":"Ko'proq oziq-ovqat saqlash"},"answer":"B","explanation":"Tarqoq va yashirin joylashuv tez yig'ilish hamda zarur yo'nalishda harakatni ta'minlash uchun kerakligi aytilgan.","mnemonic":"Yashirin – tez yig'ilish","id":27},{"subject":"Harbiy ta'lim","topic":"Jang maydoni talablar","subtopic":"Quyoshga qarshi holat","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Quyoshga qarshi bo'lmasligi shart","requires_image":false,"question":"Sahnadagi joylashuvning quyoshga qarshi bo'lmasligi nimani oldini oladi?","options":{"A":"Ko'zlarning qamashtirilishini","B":"Yerdagi haroratni pasaytirishni","C":"Suvning tez bug'lanishini","D":"Radio signallarining yomonlashishini"},"answer":"A","explanation":"Quyoshning ko'zlarni qamashtirishi oldini olish uchun joylashuv quyoshga qarshi bo'lmasligi kerakligi ko'rsatilgan.","mnemonic":"Quyosh – ko'zga zarar","id":28},{"subject":"Harbiy ta'lim","topic":"Jang maydoni talablar","subtopic":"Iqlim sharoiti","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Iqlim sharoitlarini inobatga olish","requires_image":false,"question":"Jang maydonini baholashda iqlim sharoiti qaysi bosqichda hisobga olinadi?","options":{"A":"Mediya xabarlashuvda","B":"Xavfsizlik amallarida","C":"Qurol tekshirishda","D":"Joy tanlashda"},"answer":"D","explanation":"Iqlim sharoitlari joy tanlash va baholash jarayonida inobatga olinishi kerakligi aytilgan.","mnemonic":"Iqlim – joy tanlash","id":29},{"subject":"Harbiy ta'lim","topic":"Dushman baholash","subtopic":"Sipohning kam-u ko'stlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Sardor o'z sipohlarining kam-u ko'stlarini to'g'ri bilishi","requires_image":false,"question":"Sipohning kam-u ko'stlarini aniqlash kimning vazifasidir?","options":{"A":"Logistik xodimning","B":"Sardorning","C":"Shifokorning","D":"Texnik mutaxassisning"},"answer":"B","explanation":"Sardor o'z sipohlarining kam-u ko'stlarini to'g'ri bilishi kerakligi aytilgan.","mnemonic":"Sardor – sipohni tahlil qiladi","id":30},{"subject":"Harbiy ta'lim","topic":"Dushman baholash","subtopic":"Qurollash darajasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Komandirlar dushman qo'shinining qurol-aslahalarini bilishi kerak","requires_image":false,"question":"Qurollash darajasini baholashda komandirlar qanday ma'lumotga ega bo'lishi lozim?","options":{"A":"Transport yo'llari","B":"Qurol va texnikalar turlari","C":"Xavfsizlik protokollari","D":"Sog'liq holati"},"answer":"B","explanation":"Komandirlar dushman qo'shinining qurol-aslahalari haqida ma'lumotga ega bo'lishi zarurligi ko'rsatilgan.","mnemonic":"Qurol – komandirning ma'lumotlari","id":31},{"subject":"Harbiy ta'lim","topic":"Dushman baholash","subtopic":"Tajriba","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Komandirlar raqibning jangovar harakatlar tajribasini o'rganishi","requires_image":false,"question":"Dushman tajribasini o'rganish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Tajribani tahlil qilish\n2. Ma'lumotlarni yig'ish\n3. Qaror qabul qilish\n4. Natijalarni baholash","options":{"A":"1, 3, 2, 4","B":"1, 2, 3, 4","C":"2, 1, 3, 4","D":"2, 3, 1, 4"},"answer":"C","explanation":"Avvalo ma'lumotlar yig'iladi (2), keyin tahlil qilinadi (1), qaror qabul qilinadi (3), oxirida natija baholanadi (4).","mnemonic":"Yig'la, tahlil, qaror, baholash","id":32},{"subject":"Harbiy ta'lim","topic":"Dushman baholash","subtopic":"Taktik ma'lumotlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"matching","source_construct":"Komandirlar dushman harakatlari, qurollari, kuchli va zaif jihatlari haqida ma'lumotlarni o'rganishi","requires_image":false,"question":"Quyidagi elementlarni dushman baholash ma'lumotlari bilan moslashtiring:\n1. Harakatlar taktikasi\n2. Qurol turlari\n3. Kuchli jihatlar\n4. Zaif jihatlar\nA. Xavfsizlik nuqtalari\nB. O'q otish samaradorligi\nC. Yashirin holat\nD. Tezkor manevrlar","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-D, 2-B, 3-A, 4-C","C":"1-B, 2-A, 3-D, 4-C","D":"1-C, 2-D, 3-B, 4-A"},"answer":"B","explanation":"Harakatlar taktikasi tezkor manevrlarni (1‑D), qurol turlari o'q otish samaradorligini (2‑B), kuchli jihatlar xavfsizlik nuqtalarini (3‑A), zaif jihatlar yashirin holatni (4‑C) ifodalaydi.","mnemonic":"Tak‑qu‑ku‑zu","id":33},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy yo‘nalishlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Pirmuhammad – G‘azna, Balx va Kobul viloyatlari, Shimoliy Hindiston","requires_image":false,"question":"Pirmuhammad amirligiga kirgan hududlardan biri qaysi?","options":{"A":"Balx","B":"Toshkent","C":"Buxoro","D":"Xuroson"},"answer":"A","explanation":"Pirmuhammad amirligi G‘azna, Balx, Kobul viloyatlari va Shimoliy Hindistonni o‘z ichiga oladi. Balx to‘g‘ri, boshqa variantlar matnda yo‘q.","mnemonic":"Balx – Pirmuhammadning bir qismi.","id":34},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy qadamlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Jangga tayyorlanish bosqichlari: muhoraba hududi o‘rganish, kuch va vositalarni tashkil etish, jang hududini egallash","requires_image":false,"question":"Amir Temur harbiy yurishini tashkil etish bosqichlarini to‘g‘ri tartibda joylashtiring:\n1. Jang hududini egallash\n2. Kuch va vositalarni tashkil etish\n3. Muhoraba hududini o‘rganish","options":{"A":"2, 3, 1","B":"3, 1, 2","C":"1, 2, 3","D":"3, 2, 1"},"answer":"D","explanation":"Avvalo muhoraba hududini o‘rganish, keyin kuch va vositalarni tashkil etish, oxirida jang hududini egallash tavsiya qilingan. Shuning uchun 3‑2‑1 to‘g‘ri.","mnemonic":"O‘rgan, tashkil, egalla.","id":35},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy qo‘shin turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Mironshoh – G‘arbiy Eron, Ozarbayjon, Iroq, Armaniston (markazi Tabriz)","requires_image":false,"question":"Mironshoh amirligi qaysi hududni o‘z ichiga oladi?","options":{"A":"G‘arbiy Eron","B":"Xuroson","C":"Samarqand","D":"Jizzax"},"answer":"A","explanation":"Mironshoh amirligi G‘arbiy Eron, Ozarbayjon, Iroq, Armanistonni o‘z ichiga oladi, markazi Tabriz. G‘arbiy Eron to‘g‘ri, boshqa variantlar matnda yo‘q.","mnemonic":"Miron – G‘arbiy Eronni boshqaradi.","id":36},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy yo‘nalishlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Shohrux – Xuroson, Jurjon, Mozandaron, Seyiston (markazi Hirot)","requires_image":false,"question":"Shohrux amirligiga kirgan hududlardan biri qaysi?","options":{"A":"G‘azna","B":"Xuroson","C":"Balx","D":"Shimoliy Hindiston"},"answer":"B","explanation":"Shohrux amirligi Xuroson, Jurjon, Mozandaron, Seyistonni o‘z ichiga oladi. Xuroson to‘g‘ri, boshqa variantlar matnda yo‘q.","mnemonic":"Shohrux – Xurosonni o‘z ichiga oladi.","id":37},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy yurishlarda muhoraba, kuch tashkil etish, jang hududi egallash bosqichlari","requires_image":false,"question":"Harbiy yurish bosqichlarini ularning vazifalari bilan moslashtiring:\n1. Muhoraba hududini o‘rganish\n2. Kuch va vositalarni tashkil etish\n3. Jang hududini egallash\nA. Dushmanga qarshi tayyorlik\nB. Resurslarni yig‘ish\nC. Amaliy harakatni boshlash","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-A, 2-B, 3-C"},"answer":"D","explanation":"1‑muhoaraba hududi o‘rganish dushmanga qarshi tayyorlik (A), 2‑kuch va vositalarni tashkil etish resurslarni yig‘ish (B), 3‑jang hududini egallash amaliy harakatni boshlash (C). Shuning uchun 1‑A, 2‑B, 3‑C to‘g‘ri.","mnemonic":"O‘rgan, yig‘, boshlash.","id":38},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy amaliyoti","subtopic":"Harbiy harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Amir Temur harbiy yurishlarida muhoraba hududi, qo‘shin soni, qo‘llaniladigan usullar","requires_image":false,"question":"Quyidagi harbiy elementlarni ularning asosiy xususiyati bilan moslashtiring:\n1. Muhoaraba hududi\n2. Qo‘shin soni\n3. Xandaqlar va to‘siqlar\nA. Geografik tayyorgarlik\nB. Son jihatdan ustunlik\nC. Mudofaa imkoniyati","options":{"A":"1-A, 2-B, 3-C","B":"1-B, 2-C, 3-A","C":"1-C, 2-A, 3-B","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"Muhoaraba hududi geografik tayyorgarlik (A), qo‘shin soni son jihatdan ustunlik (B), xandaqlar va to‘siqlar mudofaa imkoniyati (C). Demak 1‑A, 2‑B, 3‑C to‘g‘ri.","mnemonic":"Hudud‑geografiya, qo‘shin‑son, xandaq‑mudofaa.","id":39},{"subject":"Harbiy ta'lim","topic":"Amir Temur qo‘shin harakati","subtopic":"Harakat usullari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Har bir muhorabaning joylashuvidan kelib chiqib, qo‘shin harakatining shakl va usullarini ishlab chiqqan.","requires_image":false,"question":"Qo‘shin harakat usullarini ularning maqsadi bilan moslashtiring:\n1. Tezkor yurish\n2. Saqlash pozitsiyasi\n3. Qasrga hujum\nA. Dushmanni qo‘rqitish\nB. Qarshi hujumga tayyorlanish\nC. Qochish va qayta tashkil etish","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"C","explanation":"Tezkor yurish – qochish va qayta tashkil etish (C), saqlash pozitsiyasi – qarshi hujumga tayyorlanish (B), qasrga hujum – dushmanni qo‘rqitish (A). Shuning uchun 1-C, 2-B, 3-A to‘g‘ri.","mnemonic":"Yurish → Qochish, Saqlash → Qarshi, Hujum → Qo‘rqitish","id":40},{"subject":"Harbiy ta'lim","topic":"Amir Temur logistika","subtopic":"Zaxira bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"sequence","source_construct":"Zaxiralarni yaratgan va ulardan oqilona foydalangan.","requires_image":false,"question":"Zaxira yaratish jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Resurslarni aniqlash\n2. Saqlash joyini tashkil etish\n3. Ta’minotni taqsimlash\n4. Qayta tekshirish","options":{"A":"2, 1, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"1, 2, 3, 4"},"answer":"D","explanation":"Zaxira yaratish birinchi resurslarni aniqlash, keyin saqlash joyini tashkil etish, so‘ng ta’minotni taqsimlash va oxirida qayta tekshirish amalga oshiriladi. Demak, 1‑2‑3‑4 tartibi to‘g‘ri.","mnemonic":"Aniq → Joy → Ta’min → Tekshirish","id":41},{"subject":"Harbiy ta'lim","topic":"Bo'lim 8","subtopic":"Jangovar medallar taqsimoti","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":" ga kirish (2), va oxirida xizmatni o'tash (4).","mnemonic":"Qayd → Tayyor → Ro'yxat → O'tash","id":60},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatdan bo'shatish","subtopic":"Bo'shatish shartlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda \"Safarbarlik bo'yicha chaqirilish to'g'risida va harbiy xizmatdan bo'shatish\" bandlari mavjud","requires_image":false,"question":"Harbiy xizmatdan bo'shatish jarayonini to'g'ri tartibda joylang:\n1. Bo'shatish sababini aniqlash\n2. Rasmiy murojaatni tayyorlash\n3. Qabul qilish komissiyasining qarorini olish\n4. Bo'shatish hujjatini tasdiqlash","options":{"A":"1, 3, 2, 4","B":"1, 2, 3, 4","C":"3, 1, 2, 4","D":"2, 1, 4, 3"},"answer":"B","explanation":"Birinchi bosqichda sabab aniqlanadi (1), keyin murojaat tayyorlanadi (2), komissiya qarori (3), va oxirida hujjat tasdiqlanadi (4).","mnemonic":"Sabab → Murojaat → Qaror → Tasdiq","id":61},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Chaqiriluvchilar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Chaqiriluvchilar – harbiy xizmatga chaqiriladigan va tuman (shahar) chaqiruv uchastkalarida qayd etilgan shaxslar.","requires_image":false,"question":"Harbiy xizmatga chaqirilgan shaxslar qanday nomlanadi?","options":{"A":"Harbiy xizmatchilar","B":"Chaqiriluvchilar","C":"Rezervistlar","D":"Kontraktistlar"},"answer":"B","explanation":"Chaqiriluvchilar atamasi keltirilgan; boshqa variantlar boshqa guruhlarni ifodalaydi.","mnemonic":"Chaqiruvchilar – chaqiruvda.","id":62},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Harbiy xizmatchi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Harbiy xizmatchi – haqiqiy harbiy xizmatdagi shaxs.","requires_image":false,"question":"Qurolli Kuchlar safida faol harbiy vazifani bajarayotgan shaxs qanday ataladi?","options":{"A":"Harbiy xizmatchi","B":"Kompensatsiyalanuvchi","C":"Chaqiriluvchi","D":"Harbiy reservist"},"answer":"A","explanation":"Harbiy xizmatchi aniq ta'riflangan; boshqa atamalar boshqa holatlar uchun ishlatiladi.","mnemonic":"Xizmatda – xizmatchi.","id":63},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Harbiy majburiyat","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Umumiy harbiy majburiyat O'zbekiston Respublikasi hududida doimiy yoki vaqtincha yashayotgan chet el fuqarolari va fuqaroligi bo'lmagan shaxslarga tatbiq etilmaydi.","requires_image":false,"question":"Umumiy harbiy majburiyat kimlarga tatbiq etilmaydi?","options":{"A":"Harbiy reservistlar","B":"Harbiy xizmatchilar","C":"Chet el fuqarolari","D":"O'zbekiston fuqarolari"},"answer":"C","explanation":"Bu band aniq ko'rsatilgan; boshqa guruhlar majburiyatga kiradi.","mnemonic":"Chet – chetga.","id":64},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Vatan qasamyodi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy xizmatga birinchi marta chaqirilgan yoki ixtiyoriy ravishda (kontrakt bo'yicha) kirgan fuqarolar Vatanga qasamyod qabul qiladilar.","requires_image":false,"question":"Quyidagi holatdan qaysi biri Vatanga qasamyod qabul qilishni talab qiladi?","options":{"A":"Harbiy xizmatga majburlar","B":"Kechiktirilgan chaqiruvchilar","C":"Harbiy rezervistlar","D":"Birinci marta chaqirilgan fuqarolar"},"answer":"D","explanation":"Qasamyod faqat birinchi marta chaqirilgan yoki kontrakt orqali kirgan fuqarolar uchun belgilanadi; boshqa guruhlar buni bajarmaydi.","mnemonic":"Birinchi – qasamyod.","id":65},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Qasamyod majburiyatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qasamyodda \"O'zbekiston Respublikasiga, xalqimga va Prezidentimga bir umr sodiq bo'lishga\" bandi keltirilgan.","requires_image":false,"question":"Qasamyod bo'yicha harbiy xizmatchi qanday muddatda sodiqlikni ta'minlaydi?","options":{"A":"Bir umr davomida","B":"Xizmat muddati davomida","C":"Kurs oxirida","D":"Yiliga bir marta"},"answer":"A","explanation":"'bir umr sodiq' iborasi mavjud, bu doimiy majburiyatni anglatadi.","mnemonic":"Umr – abadiy.","id":66},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Qasamyodda tilga olingan tamoyillar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qasamyodda \"davlatim timsoli bo'lgan muqaddas bayroqni o'pib\" iborasi mavjud.","requires_image":false,"question":"Qasamyod matnida qaysi ramz hurmat qilinadi?","options":{"A":"Prezident rasmi","B":"Respublika gerbi","C":"Muqaddas bayroq","D":"Harbiy insigniya"},"answer":"C","explanation":"Bayroqga alohida e'tibor qaratilgan; boshqa ramzlar matnda yo'q.","mnemonic":"Bayroq – hurmat.","id":67},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Harbiy xizmatga chaqirilish tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy xizmatga chaqiriluvchilar tuman (shahar) chaqiruv uchastkalarida qayd etilgan shaxslar.","requires_image":false,"question":"Quyidagi elementlarni ularning tavsifi bilan moslang:\n1. Chaqiriluvchilar\n2. Harbiy xizmatchi\n3. Harbiy xizmatga majburlar\nA. Haqiqiy harbiy vazifadagi shaxs\nB. Reserv va zaxira shaxslar\nC. Tuman chaqiruv uchastkasida ro'yxatga olingan shaxslar","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-B, 3-C","C":"1-C, 2-A, 3-B","D":"1-B, 2-C, 3-A"},"answer":"C","explanation":"Har bir atama aniq tavsiflangan; 1‑C, 2‑A, 3‑B mos keladi.","mnemonic":"Chaqiruv – C, Xizmatchi – A, Majburlar – B.","id":68},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Qasamyod matni","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Qasamyod matni: \"O'zbekiston Respublikasi Qurolli Kuchlari safiga kirar ekanman, ... Vatanga qasamyod qabul qiladilar...\"","requires_image":false,"question":"Vatan qasamyodini qabul qilish jarayonini to'g'ri tartibda joylashtiring:\n1. Vatan va bayroqga sodiqlikni tan olish\n2. Qasamyod matnini o'qish\n3. O'z ismi, familiyasi, otasining ismi bilan imzolash\n4. Qasamyodni ma'naviy tasdiqlash","options":{"A":"1, 2, 3, 4","B":"2, 4, 1, 3","C":"3, 2, 1, 4","D":"2, 1, 4, 3"},"answer":"D","explanation":"Avvalo matn o'qiladi (2), keyin sodiqlik tan olinadi (1), ma'naviy tasdiq (4) beriladi, oxirida imzo (3) qo'yiladi.","mnemonic":"Matn → Sodiqlik → Tasdiq → Imzo.","id":69},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Harbiy xizmatga majburlar ro'yxati","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiy xizmatga majburlar – Qurolli Kuchlarning rezervi yoki zaxirasidagi shaxslar.","requires_image":false,"question":"Qurolli Kuchlarning rezervi va zaxirasida joylashgan shaxslarni tan olish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Zaxira ro'yxatidan tekshirish\n2. Rezervistlarni yillik tekshiruvdan o'tkazish\n3. Majburiyatni belgilash\n4. Xizmatga chaqirish","options":{"A":"1, 2, 3, 4","B":"2, 3, 1, 4","C":"3, 2, 1, 4","D":"2, 1, 3, 4"},"answer":"D","explanation":"Rezervistlar yillik tekshiriladi (2), keyin zaxira ro'yxati tekshiriladi (1), majburiyat belgilanadi (3), oxirida chaqirish amalga oshiriladi (4).","mnemonic":"Rezerv → Zaxira → Majbur → Chaqir.","id":70},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Xizmat turlari taqqoslash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda muddatli, safarbarlik chaqiruvi, kontrakt va rezervchilar xizmati ro‘yxati keltirilgan.","requires_image":false,"question":"Harbiy xizmat turlarini ularning asosiy xususiyatlari bilan moslashtiring:\n1. Muddatli xizmat\n2. Safarbarlik chaqiruvi rezervidagi xizmat\n3. Kontrakt bo‘yicha xizmat\n4. Rezervchilar xizmati\nA. Belgilangan muddatda majburiy xizmat\nB. Yaroqli, lekin chaqirilmagan shaxslar uchun\nC. Shartnoma asosida, muddatli xizmat\nD. Qurolli kuchlarga vaqtincha qo‘shilish","options":{"A":"1-B, 2-D, 3-A, 4-C","B":"1-A, 2-B, 3-C, 4-D","C":"1-D, 2-C, 3-B, 4-A","D":"1-C, 2-A, 3-B, 4-D"},"answer":"B","explanation":"1‑A: Muddatli xizmat belgilangan muddatda majburiy. 2‑B: Safarbarlik chaqiruvi rezervida yaroqli, lekin chaqirilmagan. 3‑C: Kontrakt shartnoma asosida. 4‑D: Rezervchilar vaqtincha qo‘shilish.","mnemonic":"1‑A,2‑B,3‑C,4‑D – har biriga mos.","id":71},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Xizmat ko‘rsatish muddatlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda harbiy xizmat turlari ketma‑ketini ko‘rsatish so‘ralgan.","requires_image":false,"question":"Quyidagi xizmat turlarini ularning boshlanishi bo‘yicha to‘g‘ri tartibda joylashtiring:\n1. Kontrakt bo‘yicha xizmat\n2. Muddatli xizmat\n3. Safarbarlik chaqiruvi rezervidagi xizmat\n4. Rezervchilar xizmati","options":{"A":"1, 2, 3, 4","B":"2, 3, 4, 1","C":"2, 1, 3, 4","D":"3, 2, 1, 4"},"answer":"B","explanation":"Birinchi bo‘lib muddatli xizmat (oddiy yoshdagi fuqarolar uchun), keyin safarbarlik chaqiruvi rezervidagi, undan keyin rezervchilar xizmati, oxirida kontrakt bo‘yicha xizmat (shartnoma asosida).","mnemonic":"Muddatli → Safar → Rezerv → Kontrakt.","id":72},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Xizmatga chaqirish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda chaqirilish tartibi va huquqiy cheklovlar bayon qilinadi.","requires_image":false,"question":"Harbiy xizmatga chaqirilish jarayonini to‘g‘ri ketma‑ketlikda joylang:\n1. Chaqirish qarorini e’lon qilish\n2. Fuqaroni ro‘yxatdan o‘tkazish\n3. Xizmatga tayyorlash kursini o'tkazish\n4. Xizmatni boshlash","options":{"A":"2, 1, 3, 4","B":"1, 2, 3, 4","C":"1, 3, 2, 4","D":"3, 1, 2, 4"},"answer":"B","explanation":"Avvalo qaror e’lon qilinadi, keyin fuqaroni ro‘yxatga olish, undan keyin tayyorlov kursi, oxirida xizmat boshlanadi. Shuning uchun 1‑2‑3‑4 to‘g‘ri.","mnemonic":"E’lon → Ro‘yxat → Kurs → Xizmat.","id":73},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Kontrakt bo'yicha xizmat","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Kontrakt bo'yicha harbiy xizmat – ixtiyoriylik asosida tuzilgan kontrakt","requires_image":false,"question":"Kontrakt bo'yicha harbiy xizmatni kimlar bajaradi?","options":{"A":"Maqsadli harbiy o'quvchilar","B":"Davlat bilan kontrakt imzolagan fuqarolar","C":"Saqlash vazifasini bajargan harbiy xizmatchilar","D":"Yangi qo'shinlar a'zolari"},"answer":"B","explanation":"Kontrakt bo'yicha xizmatni davlat bilan kontrakt imzolagan fuqarolar bajaradi, bu ixtiyoriy asosda amalga oshiriladi.","mnemonic":"Kontrakt – fuqarolar bilan ixtiyoriy","id":74},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Safarbarlik chaqiruvi rezervi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Safarbarlik chaqiruvi rezervidagi xizmat safiga 27 yoshga to'lgunga qadar olinadi","requires_image":false,"question":"Safarbarlik chaqiruvi rezervida xizmat qiluvchi shaxslar qaysi yoshgacha bo'lishi kerak?","options":{"A":"30 yosh","B":"27 yosh","C":"35 yosh","D":"24 yosh"},"answer":"B","explanation":"Berilgan ma'lumotga ko'ra, 27 yoshga to'lgunga qadar rezervda xizmat qilish mumkin.","mnemonic":"Safarbarlik – yosh 27","id":75},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat muddatlari","subtopic":"Ofitserlar xizmat muddati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Ofitserlar tarkibi lavozimlarida xizmat muddati 12 oy","requires_image":false,"question":"Ofitserlar lavozimida muddatli xizmat muddati qancha?","options":{"A":"18 oy","B":"6 oy","C":"24 oy","D":"12 oy"},"answer":"D","explanation":"Ofitserlar uchun ham 12 oylik xizmat muddati belgilangan.","mnemonic":"Ofitserlar ham yarim yil","id":76},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat shartlari","subtopic":"Kontrakt muddati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Kontrakt bo'yicha harbiy xizmatchilar bilan yangi kontrakt besh yilga tuziladi","requires_image":false,"question":"Agar shaxs 5 yildan kam qolgan bo'lsa, yangi kontrakt muddati qanday belgilanadi?","options":{"A":"Muddatsiz","B":"Kamroq muddatga","C":"Besh yilga","D":"O'n yilga"},"answer":"B","explanation":"Kontrakt muddatini qisqartirish holati aniq ko'rsatilgan: xizmatda qolishi 5 yildan kam bo'lsa, muddat qisqaroq bo'ladi.","mnemonic":"Qolgan vaqt kam – kontrakt ham kam","id":77},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Tayyorlov kurslari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Oliy harbiy ta'lim muassasalarining kursantlari bilan o'qish davri uchun kelgusida u","requires_image":false,"question":"Oliy harbiy ta'lim muassasalarida kursantlar qanday davrda tayyorlanadi?","options":{"A":"Favqulodda vaziyatda","B":"O'qish davri uchun","C":"Xizmatdan keyingi dam olishda","D":"Yig'in oldidan"},"answer":"B","explanation":"Kursantlar o'qish davri uchun tayyorlanadi deyilgan.","mnemonic":"Kursant – o'qish davri","id":78},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Savol - moslashtirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy xizmat turlari va ularning muddatlari matnda ko'rsatilgan","requires_image":false,"question":"Harbiy xizmat turlarini ularning muddatlari bilan moslashtiring:\n1. Oddiy askarlar va serjantlar\n2. Ofitserlar\n3. Kontrakt bo'yicha xizmatchilar\nA. 12 oy\nB. 5 yil\nC. 12 oy\nD. 1 yil","options":{"A":"1-A, 2-B, 3-C","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-B, 2-C, 3-A"},"answer":"C","explanation":"Oddiy askarlar va serjantlar 12 oy (A), ofitserlar ham 12 oy (C), kontrakt xizmatchilar birinchi kontrakt besh yil (B).","mnemonic":"Oddiy, Ofitser – yarim yil; Kontrakt – besh yil","id":79},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Safarbarlik chaqiruvi rezervi - yig'inlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safarbarlik chaqiruvi rezervidagi xizmat safiga oylik yig'inlar tarzida tashkil etiladi","requires_image":false,"question":"Safarbarlik chaqiruvi rezervidagi xizmat qanday shaklda o'tkaziladi?","options":{"A":"Kunlik parollar","B":"Yillik mashg'ulotlar","C":"Kengash yig'inlari","D":"Oylik yig'inlar"},"answer":"D","explanation":"Xizmat oylik yig'inlar tarzida tashkil etilishi aytilgan.","mnemonic":"Rezerv – oylik yig'in","id":80},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat - tartib","subtopic":"Xizmatga chaqirish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safarbarlik chaqiruvi rezervidagi xizmatni tashkil etish va o'tash tartibi Nizom bilan belgilanadi","requires_image":false,"question":"Safarbarlik chaqiruvi rezervidagi xizmatni tashkil etish bosqichlarini to'g'ri ketma-ketlikda joylashtiring:\n1. Nizomni tasdiqlash\n2. Xizmatga chaqirish\n3. Oylik yig'inlar o'tkazish\n4. Xizmat muddatini belgilash","options":{"A":"1, 3, 2, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"1, 2, 4, 3"},"answer":"D","explanation":"Birinchi bosqich Nizomni tasdiqlash, keyin chaqirish, keyin muddati belgilash, oxirida yig'inlar o'tkaziladi.","mnemonic":"Tasdiq → Chaqir → Muddat → Yig'in","id":81},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat - kontrakt","subtopic":"Birinchi kontrakt muddati","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Kontrakt bo'yicha harbiy xizmatchilar bilan dastlabki kontrakt besh yilga tuziladi","requires_image":false,"question":"Kontrakt bo'yicha harbiy xizmatni boshlagan shaxslar uchun birinchi kontrakt muddati qanday belgilanadi?","options":{"A":"Bir yil","B":"Besh yil","C":"O'n yil","D":"Uch yil"},"answer":"B","explanation":"Birinchi kontrakt besh yilga tuziladi deyilgan.","mnemonic":"Kontrakt birinchi – besh yil","id":82},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat kontrakti","subtopic":"Yangi kontrakt","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda kontrakt muddati tugagandan keyin yangi kontrakt tuzish orqali uzaytirilishi mumkinligi aytilgan","requires_image":false,"question":"Kontraktni uzaytirish jarayonini to'g'ri ketma-ketlikda joylashtiring:\n1. Eski kontrakt muddati tugaydi\n2. Tomonlar kelishib yangi kontrakt imzolaydilar\n3. Yangi kontraktning muddatini belgilash\n4. Xizmat davom ettiriladi","options":{"A":"1, 2, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"2, 1, 3, 4"},"answer":"A","explanation":"Birinchi qadamda eski kontrakt muddati tugashi, ikkinchi qadamda tomonlar kelishib yangi kontrakt imzolash, uchinchi qadamda yangi muddat belgilash, oxirida xizmat davom ettiriladi. Shunday qilib 1‑2‑3‑4 to'g'ri ketma-ketlik bo'ladi.","mnemonic":"Tugat, kelish, belgilash, davom","id":83},{"subject":"Harbiy ta'lim","topic":"Rezervchilar yig'inlari","subtopic":"Qoidalar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda rezervchilar yig'inlari \"Umumiy harbiy majburiyat va harbiy xizmat to'g'risidagi Qonunning 32-moddasida belgilangan\" deb ko'rsatilgan","requires_image":false,"question":"Rezervchilar yig'inlarini tashkil etish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Qonunning 32-moddasiga muvofiq muddatni aniqlash\n2. Yig'in dasturini tuzish\n3. Qism va bo'linmalarni chaqirish\n4. Yig'in natijalarini hujjatlashtirish","options":{"A":"1, 3, 2, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"3, 1, 2, 4"},"answer":"C","explanation":"Dastlab qonunning 32-moddasiga muvofiq muddat aniqlanadi, keyin dastur tuziladi, so'ng qism va bo'linmalar chaqiriladi, oxirida natijalar hujjatlashtiriladi. Shuning uchun 1‑2‑3‑4 to'g'ri.","mnemonic":"Muddat, dastur, chaqiriq, hujjat","id":84},{"subject":"Harbiy ta'lim","topic":"Kontrakt turlari","subtopic":"Kursantlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda oliy harbiy ta'lim muassasalarining kursantlari bilan kontrakt shartlari keltirilgan","requires_image":false,"question":"Quyidagi kontrakt turlarini ularning xususiyatlari bilan moslashtiring:\n1. Kursantlar kontrakti\n2. Rezervchilar kontrakti\n3. Xizmat muddatini uzaytirish kontrakti\nA. Ofitserlik lavozimida kamida besh yil xizmat\nB. Harbiy xizmatni uzaytirish uchun tomonlarning kelishuvi\nC. Harbiy xizmatni majburiy bajarish uchun asosiy shart","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-B, 3-C","C":"1-A, 2-C, 3-B","D":"1-B, 2-C, 3-A"},"answer":"C","explanation":"Kursantlar kontrakti – ofitserlik lavozimida kamida 5 yil xizmat (A). Rezervchilar kontrakti – harbiy xizmatni majburiy bajarish (C). Uzaytirish kontrakti – tomonlarning kelishuvi (B). Shuning uchun 1‑A, 2‑C, 3‑B mos.","mnemonic":"Kurs‑ofitser, Rez‑majburiy, Uz‑kelish","id":85},{"subject":"Harbiy ta'lik","topic":"Xizmat turlari","subtopic":"Tashkilot","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda rezervchilar xizmatining tinchlik va urush davrida qo'llanilishi tavsiflangan","requires_image":false,"question":"Quyidagi xizmat turlarini ularning amaliy qo'llanilish davri bilan moslashtiring:\n1. Rezervchilar xizmati\n2. Safarbarlik chaqiruvi\n3. Muddatli xizmat\nA. Urush davri, tahdid paydo bo'lganda\nB. Tinchlik davrida tayyorgarlik maqsadida\nC. Har yili belgilangan muddatda","options":{"A":"1-B, 2-A, 3-C","B":"1-B, 2-C, 3-A","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Rezervchilar xizmati tinchlik davrida (B) tayyorgarlik maqsadida. Safarbarlik chaqiruvi urush davri, tahdid paydo bo'lganda (A). Muddatli xizmat belgilangan muddatda (C). Shuning uchun 1‑B, 2‑A, 3‑C to'g'ri.","mnemonic":"Rez‑tin, Saf‑tahdid, Mud‑muddati","id":86},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Muddatli harbiy xizmat","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Muddatli harbiy xizmat\" iborasi keltirilgan","requires_image":false,"question":"Muddatli harbiy xizmat nima?","options":{"A":"Kontrakt asosida xizmat","B":"Rezervda tayyorlanish","C":"Ma'lum muddatga majburiy harbiy xizmat","D":"Davriy safarbarlik chaqiruviga javob"},"answer":"C","explanation":"Muddatli harbiy xizmat qonunchilikda aniq belgilangan, ma'lum muddatga majburiy xizmatni anglatadi. B safarbarlik, C kontrakt, D rezervga tegishli emas.","mnemonic":"Muddatli = muddatli muddat","id":87},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Oddiy askarlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Oddiy askarlar tarkibi\" ro'yxati mavjud","requires_image":false,"question":"Quyidagi unvonlardan qaysi biri oddiy askar darajasiga kiradi?","options":{"A":"III darajali serjant","B":"Matros","C":"General","D":"Master serjant"},"answer":"B","explanation":"Matros – harbiy kema tarkibidagi oddiy askar unvoni. III darajali serjant va Master serjant ofitserlar, General generallar guruhiga kiradi.","mnemonic":"Matros = oddiy dengizchi","id":88},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Serjantlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Kichik serjant, birinchi serjant, serjant mayor\" kabi unvonlar ro'yxatlangan","requires_image":false,"question":"Quyidagi unvonlardan qaysi biri serjantlar tarkibiga kiradi?","options":{"A":"Kapitan","B":"Katta serjant","C":"Polkovnik","D":"Leytenant"},"answer":"B","explanation":"Katta serjant serjantlar sinfidagi yuqori darajali unvondir. Polkovnik, Kapitan, Leytenant ofitserlar yoki generallar guruhiga tegishli.","mnemonic":"Katta serjant – serjantlar boshida","id":89},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Kichik ofitserlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Kichik ofitserlar tarkibi\" bo'limi mavjud","requires_image":false,"question":"Kichik ofitserlar qatoriga qaysi unvon kiradi?","options":{"A":"Polkovnik","B":"Serjant mayor","C":"Starshina","D":"General-Armiyamayor"},"answer":"C","explanation":"Starshina – kichik ofitserlar tarkibidagi unvon. Serjant mayor ofitserlarga, General-Armiyamayor generallarga, Polkovnik katta ofitserlarga mansub.","mnemonic":"Starshina – kichik ofitser","id":90},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Katta ofitserlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Katta ofitserlar tarkibi\" bo'limi keltirilgan","requires_image":false,"question":"Katta ofitserlar darajasiga kiruvchi unvonni tanlang.","options":{"A":"Kapitan-leytenant","B":"Matros","C":"Shtab-serjant","D":"III darajali serjant"},"answer":"A","explanation":"Kapitan-leytenant – katta ofitserlar sinfidagi unvon. Matros oddiy askar, III darajali serjant serjant guruhiga, Shtab-serjant ham serjantlar tarkibiga kiradi.","mnemonic":"Kapitan-leytenant – katta ofitser","id":91},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Generallar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Generallar tarkibi\" ro'yxati mavjud","requires_image":false,"question":"Quyidagi unvonlardan qaysi generallar sinfiga kiradi?","options":{"A":"Starshina","B":"Matros","C":"General-Armiyamayor","D":"Kichik serjant"},"answer":"C","explanation":"General-Armiyamayor – generallar darajasidagi eng yuqori unvon. Starshina kichik ofitser, kichik serjant oddiy serjant, Matros oddiy askar.","mnemonic":"General – eng yuqori","id":92},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Xizmat turlari tavsifi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda xizmat turlari ro'yxati (Muddatli, Safarbarlik, Kontrakt, Rezerv) keltirilgan","requires_image":false,"question":"Xizmat turlarini ularning asosiy xususiyatlari bilan moslashtiring:\n1. Muddatli\n2. Safarbarlik chaqiruvi\n3. Kontrakt\n4. Rezervda xizmat\nA. O'z ixtiyori bilan kelgan fuqarolar\nB. Qonunchilikka muvofiq belgilangan muddat\nC. Davriy chaqiruvga javob berish\nD. Birinchi navbatda chaqirilmaydigan, ehtiyoj bo'lganda chaqiriladigan","options":{"A":"1-B, 2-C, 3-A, 4-D","B":"1-A, 2-B, 3-C, 4-D","C":"1-C, 2-D, 3-B, 4-A","D":"1-D, 2-A, 3-B, 4-C"},"answer":"A","explanation":"Muddatli xizmat belgilangan muddatga (B), safarbarlik chaqiruvga davriy chaqiruv (C), kontrakt ixtiyoriy shart (A), rezerv ehtiyoj bo'lganda chaqiriladi (D).","mnemonic":"M-S-K-R: Muddat, Safar, Kontrakt, Rezerv","id":93},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Unvonlar tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda unvonlar ierarxiyasi (Oddiy askar → Serjant → Ofitser → General) tasvirlangan","requires_image":false,"question":"Quyidagi harbiy unvonlarni eng pastdan eng yuqoriga qarab joylashtiring:\n1. Kapitan-leytenant\n2. Matros\n3. General-Armiyamayor\n4. Starshina\n5. Serjant mayor","options":{"A":"2,4,5,1,3","B":"2,4,5,3,1","C":"2,5,4,1,3","D":"2,5,1,4,3"},"answer":"A","explanation":"Oddiy askar (Matros) → kichik ofitser (Starshina) → serjantlar (Serjant mayor) → katta ofitser (Kapitan-leytenant) → generallar (General-Armiyamayor). Shuning uchun 2,4,5,1,3 to'g'ri.","mnemonic":"Matras serjant kapitan general","id":94},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Ofitserlar unvonlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Leytenant, katta leytenant, kapitan\" kabi unvonlar ro'yxatlangan","requires_image":false,"question":"Quyidagi unvonlardan qaysi biri katta ofitserlar sinfiga kiradi?","options":{"A":"Matros","B":"III darajali serjant","C":"Starshina","D":"Kapitan"},"answer":"D","explanation":"Kapitan – katta ofitser darajasidagi unvon. Matros oddiy askar, III darajali serjant serjant, Starshina kichik ofitser.","mnemonic":"Kapitan – katta ofitser","id":95},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Unvonlar tasnifi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"matching","source_construct":"Matnda harbiy unvonlar tasnifi (oddiy askar, serjant, ofitser, general) ro'yxati berilgan","requires_image":false,"question":"Harbiy unvonlarni ularning sinfiga moslashtiring:\n1. Matros\n2. Serjant mayor\n3. Kapitan\n4. General-Armiyamayor\nA. Oddiy askarlar\nB. Serjantlar\nC. Ofitserlar\nD. Generallar","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-A, 2-B, 3-C, 4-D","C":"1-C, 2-D, 3-A, 4-B","D":"1-D, 2-C, 3-B, 4-A"},"answer":"B","explanation":"Matros oddiy askar (A), Serjant mayor serjant (B), Kapitan ofitser (C), General-Armiyamayor generallar (D). Shuning uchun 1-A,2-B,3-C,4-D to'g'ri.","mnemonic":"M,S,K,G – har bir sinfda bitta","id":96},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Rezerv va iste‘kfodagi unvonlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Rezerv, zaxira yoki iste‘kfodagi shaxslarning harbiy unvoniga mos ravishda “rezervdagi”, “zaxiradagi” yoki “iste‘kfodagi” so‘zlari qo‘shiladi.","requires_image":false,"question":"Rezervda xizmat qilayotgan leytenant qanday to‘liq unvon bilan ifodalanadi?","options":{"A":"iste‘kfodagi leytenant","B":"kapitan‑leytenant","C":"zaxiradagi leytenant","D":"rezervdagi leytenant"},"answer":"D","explanation":"Matnga ko‘ra, rezervdagi shaxslar unvoniga “rezervdagi” prefiks qo‘shiladi; boshqa prefikslar boshqa holatlarda qo‘llanadi.","mnemonic":"Rezervda – rezervdagi.","id":97},{"subject":"Harbiy ta'lim","topic":"Harbiy kiyim-kechak","subtopic":"Nishonlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy kiyimlar va nishonlarni O‘zbekiston Respublikasi Prezidenti tasdiqlaydi.","requires_image":false,"question":"Harbiy kiyimda nishonlarni kim tasdiqlaydi?","options":{"A":"Harbiy xizmat boshqaruvi","B":"Mudofaa vazirligi","C":"Harbiy kollej rektori","D":"Prezident"},"answer":"D","explanation":"Qonunda belgilanganidek, harbiy kiyim va nishonlar faqat Prezidentning tasdiqlashi bilan rasmiylashtiriladi.","mnemonic":"Prezident tasdiqlaydi, nishonlar rasmiy.","id":98},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar tasnifi","subtopic":"Unvonning bosqichliligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy unvon boshlang‘ich yoki navbatdagi bo‘lishi mumkin.","requires_image":false,"question":"Unvon bosqichlarini ularning xususiyatiga moslashtiring:\n1. Boshlang‘ich\n2. Navbatdagi\nA. Birinchi xizmatga kirish\nB. Keyingi lavozimga ko‘tarilish\nC. O‘qituvchilik tayyorlash\nD. Qayta tayyorlash","options":{"A":"1-B, 2-A","B":"1-D, 2-C","C":"1-C, 2-D","D":"1-A, 2-B"},"answer":"D","explanation":"Boshlang‘ich unvon birinchi xizmatga kirish (A) bilan, navbatdagi unvon esa keyingi lavozimga ko‘tarilish (B) bilan bog‘lanadi.","mnemonic":"Boshlash – birinchi, Navbat – keyingi.","id":99},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar tasnifi","subtopic":"Unvon bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy unvon boshlang‘ich yoki navbatdagi bo‘lishi mumkin.","requires_image":false,"question":"Quyidagi unvonlarni ularning darajaviy tartibiga joylashtiring:\n1. Leytenant\n2. Polkovnik\n3. Mayor\nA. 1-3-2\nB. 3-1-2\nC. 1-2-3\nD. 2-1-3","options":{"A":"3-1-2","B":"1-2-3","C":"2-1-3","D":"1-3-2"},"answer":"D","explanation":"Darajaviy tartib: leytenant (past), mayor (o‘rta), polkovnik (yuqori). Shuning uchun 1-3-2 to‘g‘ri.","mnemonic":"Leytenant → Mayor → Polkovnik.","id":100},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Kiyinish qoidalari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiy kiyimda yurish qoidalari vazirlik va idoralarning rahbarlari tomonidan belgilanadi.","requires_image":false,"question":"Harbiy kiyimda yurish qoidalarini to‘g‘ri ketma‑ketlikda joylang:\n1. Qoidalarni rahbarlar belgilaydi\n2. Harbiy xodimlar amalda qo‘llaydi\n3. Nizolar yuzaga kelganda tekshiriladi\n4. Xatoliklar tuzatiladi","options":{"A":"1, 3, 2, 4","B":"1, 2, 3, 4","C":"2, 4, 1, 3","D":"2, 1, 4, 3"},"answer":"B","explanation":"Avvalo rahbarlar qoidalarni belgilaydi, keyin harbiy xodimlar amalda qo‘llaydi, nizolar tekshiriladi va oxirida xatoliklar tuzatiladi.","mnemonic":"Belgilash → Qo‘llash → Tekshirish → Tuzatish.","id":101},{"subject":"Harbiy ta'lim","topic":"Harbiy unvonlar","subtopic":"Kiyinish cheklovlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiy kiyimda yurish huquqiga ega bo‘lmagan fuqarolarning harbiy kiyimda bo‘lishi taqiqlanadi.","requires_image":false,"question":"Fuqarolarning harbiy kiyimda bo‘lishi taqiqlanishi uchun qadamlarni to‘g‘ri tartibda joylang:\n1. Fuqarolarni aniqlash\n2. Ruxsatnoma tekshirish\n3. Noto‘g‘ri kiyimni olib tashlash\n4. Ma'lumot berish","options":{"A":"2, 1, 4, 3","B":"4, 1, 2, 3","C":"1, 2, 3, 4","D":"1, 3, 2, 4"},"answer":"C","explanation":"Birinchi bosqichda fuqarolar aniqlanadi, ikkinchi bosqichda ruxsatnoma tekshiriladi, uchinchi bosqichda noto‘g‘ri kiyim olib tashlanadi, oxirida ma'lumot beriladi.","mnemonic":"Aniqlash → Tekshirish → Olib tashlash → Ma'lumot.","id":102},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Qo‘shinlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Harbiy qo‘shinlarning ro‘yxati","requires_image":false,"question":"Quyidagilardan qaysi biri harbiy qo‘shin emas?","options":{"A":"Aloqa qo‘shinlari","B":"Tank qo‘shinlari","C":"Radiatsion va kimyoviy-biologik muhofaza qo‘shinlari","D":"Yuridik xizmat"},"answer":"D","explanation":"Yuridik xizmat harbiy qo‘shin emas, lekin xizmat turiga kiradi.","mnemonic":"Yuridik – xizmat, qo‘shin emas","id":103},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Boshlang‘ich tayyorgarlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiruvga qadar boshlang‘ich tayyorgarlik","requires_image":false,"question":"Chaqiruvga qadar boshlang‘ich tayyorgarlikda qaysi element alohida ta'kidlanadi?","options":{"A":"Jismoniy tayyorgarlik va sog‘lomlashtirish","B":"Xalqaro qonunlar bilan tanishish","C":"Yuqori darajadagi texnikaviy mahorat","D":"Boshqa harbiy kuchlarga ko‘chirish"},"answer":"A","explanation":"Jismoniy tayyorgarlik hamda davolash‑sog‘lomlashtirish boshlang‘ich tayyorgarlikning asosiy qismlari sifatida ko‘rsatilgan.","mnemonic":"Jismoniy – sog‘lom, tayyorlik birga","id":104},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Umumta‘lim tayyorgarlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Umumta‘lim tayyorgarlik","requires_image":false,"question":"Umumta‘lim tayyorgarlikning asosiy maqsadi nima?","options":{"A":"Xalqaro missiyalarni rejalashtirish","B":"Siyosiy partiyalarni tashkil etish","C":"Texnikaviy uskunalarni o‘rganish","D":"Vatanparvarlik ruhida tarbiyalash"},"answer":"D","explanation":"Umumta‘lim tayyorgarlik vatanparvarlik ruhida tarbiyalashni o‘z ichiga oladi.","mnemonic":"Umumta‘lim – vatanparvar","id":105},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Qiyinchiliklarni bartaraf etish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiruvga qadar boshlang‘ich tayyorgarlikni nazorat qilish","requires_image":false,"question":"Chaqiruvga qadar tayyorgarlikni nazorat qilishning asosiy vazifasi nima?","options":{"A":"Xalqaro hamkorlikni kengaytirish","B":"Tayyorgarlikning samaradorligini baholash","C":"Siyosiy qarorlar qabul qilish","D":"Yangi texnologiyalarni joriy etish"},"answer":"B","explanation":"Nazorat qilish tayyorgarlikning samaradorligini tekshirishga qaratilganligi ko‘rsatilgan.","mnemonic":"Nazorat – samaradorlikni tekshirish","id":106},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Qurilma va uskunalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy ansambl","requires_image":false,"question":"Quyidagi birliklardan qaysi biri harbiy ansambl sifatida tasniflanadi?","options":{"A":"Tank qo‘shinlari","B":"Aloqa qo‘shinlari","C":"Harbiy ansambl","D":"Radiatsion va kimyoviy-biologik muhofaza qo‘shinlari"},"answer":"C","explanation":"“Harbiy ansambl” alohida guruh sifatida sanalgan, qolganlari qo‘shin turlari.","mnemonic":"Ansambl – alohida birlik","id":107},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Chaqiruv jarayoni bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Chaqiruvga qadar bosqichlar","requires_image":false,"question":"Chaqiruv jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Chaqiruv qog‘ozini to‘ldirish\n2. Fuqaroni ro‘yxatga olish\n3. Moliyaviy ta‘minotni tashkil etish\n4. Fizik tayyorgarlikni nazorat qilish","options":{"A":"1, 2, 3, 4","B":"1, 2, 4, 3","C":"1, 3, 2, 4","D":"2, 1, 3, 4"},"answer":"B","explanation":"Chaqiruv bosqichlari: avval hujjat to‘ldiriladi (1), keyin ro‘yxatga olinadi (2), jismoniy tayyorgarlik nazorati (4) amalga oshiriladi, oxirida moliyaviy ta‘minot (3) ta’minlanadi.","mnemonic":"Hujjat → ro‘yxat → nazorat → mablag‘","id":108},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Chaqiruvga tayyorlik nazorati","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Chaqiruvga qadar boshlang‘ich tayyorgarlikni nazorat qilish","requires_image":false,"question":"Chaqiruvga qadar tayyorgarlikni nazorat qilishda qaysi bosqichda xatolik aniqlansa, keyingi qadam nima bo‘ladi?","options":{"A":"Xatolikni e‘lon qilib, yakuniy hisobotga kiritish","B":"Jarayonni to‘xtatib, qayta rejalashtirish","C":"Murojaatni yuqori boshqaruvga uzatish","D":"Xatolikni tuzatish va yana nazorat qilish"},"answer":"D","explanation":"Nazorat davomida aniqlangan xatoliklar tuzatiladi va nazorat takrorlanadi, bu jarayonning davomiyligini ta’minlaydi.","mnemonic":"Xato → tuzat → qayta nazorat","id":109},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Ro'yxatga olish tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqarolar o'z turar joylaridagi tuman (shahar) mudofaa ishlari organlari huzurida tashkil etiladigan chaqiruv uchastkalarida ro'yxatdan o'tkaziladi.","requires_image":false,"question":"Chaqiruv uchastkasida ro'yxatdan o'tish jarayonida fuqarolar birinchi navbatda qaysi hujjatni to'ldiradi?","options":{"A":"Mahalliy tavsiyanoma","B":"Pasport nusxasi","C":"Tibbiy ko'rik hisobotini","D":"Chaqiruv qog'ozi"},"answer":"D","explanation":"Chaqiruv qog'ozi chaqiruv uchastkasida ro'yxatdan o'tish uchun asosiy hujjat hisoblanadi. Pasport yoki tibbiy hisobotlar qo'shimcha ma'lumot sifatida talab qilinadi, lekin birinchi bosqichda to'ldiriladi.","mnemonic":"Chaqiruv qog'ozi birinchi","id":110},{"subject":"Harbiy ta'lim","topic":"Jismoniy tayyorgarlik","subtopic":"Sport jamiyatlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jismoniy tayyorgarlik ta'lim muassasalarining o'quv dasturlari doirasida, shuningdek, sport jamiyatlari va klublari, davolash muassasalari, mudofaa-sport sog'lomlashtirish lagerlarida olib boriladi.","requires_image":false,"question":"Jismoniy tayyorgarlikni qaysi tashkilotlar amalga oshiradi?","options":{"A":"Yuqori texnologik kompaniyalar","B":"Mahalliy savdo uyushmalari","C":"Sport jamiyatlari va klublari","D":"Faqat harbiy akademiyalar"},"answer":"C","explanation":"Sport jamiyatlari, klublar, davolash muassasalari va mudofaa-sport lagerlari jismoniy tayyorgarlikni amalga oshirishi ko'rsatilgan.","mnemonic":"Sport jamiyatlari tayyorlaydi","id":111},{"subject":"Harbiy ta'lim","topic":"Tibbiy ko'rik","subtopic":"Yoshga bog'liq tibbiy tekshiruv","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"O'n besh va o'n olti yoshdagi o'smirlar (chaqiriluvchilar)ni mudofaa ishlari organlari jalb etadigan mutaxassis shifokor har yili tibbiy ko'rikdan o'tkazadi.","requires_image":false,"question":"Qaysi yoshdagi chaqiriluvchilar har yili mutaxassis shifokor tomonidan tibbiy ko'rikdan o'tadi?","options":{"A":"18‑19 yosh","B":"20‑21 yosh","C":"15‑16 yosh","D":"12‑13 yosh"},"answer":"C","explanation":"Aynan 15 va 16 yoshdagi o'smirlar tibbiy ko'rikdan o'tkazilishini belgilab o'tilgan.","mnemonic":"O'n besh, o'n olti – tekshiradi","id":112},{"subject":"Harbiy ta'lim","topic":"Chaqiruv jarayoni","subtopic":"Umumta'lim tayyorgarlik darajasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Maktabgacha va maktab ta'limi tashkilotlari chaqiriluvchilarning umumta'lim tayyorgarlik darajasini oshirish yuzasidan zarur chora-tadbirlar ko'rishlari shart.","requires_image":false,"question":"Maktabgacha va maktab ta'limi tashkilotlari chaqiriluvchilarga qanday asosiy vazifani bajaradi?","options":{"A":"Yuqori texnologik ta'limni joriy etish","B":"Tashqi iqtisodiy nazoratni kuchaytirish","C":"Xalqaro sport musobaqalarini tashkil etish","D":"Umumta'lim tayyorgarlik darajasini oshirish"},"answer":"D","explanation":"Maktabgacha va maktab ta'limi tashkilotlari chaqiriluvchilarning umumta'lim tayyorgarlik darajasini oshirishni majburiy chora sifatida belgilaydi.","mnemonic":"Maktab – umumiy tayyorlaydi","id":113},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Ro'yxatga olish maqsadi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqarolarni chaqiruv uchastkalarida qayd etish ularni harbiy ro'yxatga olish, ularning sonini, harbiy xizmatga qay darajada yaroqli ekanini, umumta'lim va jismoniy tayyorgarlik darajasini aniqlash maqsadida o'tkaziladi.","requires_image":false,"question":"Chaqiruv uchastkasida ro'yxatdan o'tishdan asosiy maqsad nima?","options":{"A":"Harbiy yaroqlilik va tayyorgarlik darajasini aniqlash","B":"Mahalliy saylovlarga qatnashish huquqini berish","C":"Yangi qurilish loyihalarini tasdiqlash","D":"Fuqarolarni soliq to'lovlariga ro'yhatdan o'tkazish"},"answer":"A","explanation":"Ro'yxatga olish jarayoni harbiy yaroqlilik, umumta'lim va jismoniy tayyorgarlik darajasini aniqlashga qaratilgan.","mnemonic":"Yaroqlilik – ro'yxatdan o'tadi","id":114},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Ro'yxatga olish bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Fuqarolar o'z turar joylaridagi tuman (shahar) mudofaa ishlari organlari huzurida tashkil etiladigan chaqiruv uchastkalarida ro'yxatdan o'tkaziladi. Chaqiruv uchastkasida qayd etilish uchun fuqarolar chaqiruv qog'ozida ko'rsatilgan muddatni ...","requires_image":false,"question":"Chaqiruv uchastkasida ro'yxatga olish bosqichlarini moslashtiring:\n1. Chaqiruv qog'ozini to'ldirish\n2. Fuqaroni ro'yxatdan o'tkazish\n3. Tibbiy ko'rikdan o'tkazish\n4. Yaroqlilik darajasini belgilash\nA. Boshlash\nB. Tekshirish\nC. Tasdiqlash\nD. Yakunlash","options":{"A":"1-A, 2-B, 3-C, 4-D","B":"1-B, 2-A, 3-D, 4-C","C":"1-D, 2-C, 3-B, 4-A","D":"1-C, 2-D, 3-A, 4-B"},"answer":"A","explanation":"Ro'yxatga olish birinchi qadamda chaqiruv qog'ozi to'ldiriladi, ikkinchi qadam fuqaroni ro'yxatdan o'tkazish, uchinchi qadam tibbiy ko'rik, to'rtinchi qadam yaroqlilik darajasini belgilash.","mnemonic":"To'ldir, ro'yxat, tekshir, tasdiq","id":115},{"subject":"Harbiy ta'lim","topic":"Jismoniy tayyorgarlik","subtopic":"Ta'lim muassasalarining roli","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Chaqiriluvchilarning jismoniy tayyorgarligi ta'lim muassasalarining o'quv dasturlari doirasida amalga oshiriladi.","requires_image":false,"question":"Jismoniy tayyorgarlik qaysi muassasalar doirasida o'tkaziladi?","options":{"A":"Sog'liqni saqlash klinikalari","B":"Xalqaro tashkilotlar","C":"Ta'lim muassasalari","D":"Xususiy sport zallari"},"answer":"C","explanation":"Jismoniy tayyorgarlik ta'lim muassasalarining o'quv dasturlari ichida o'tkazilishi ko'rsatilgan.","mnemonic":"Ta'lim – jismoniy","id":116},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Ro'yxatga olish qadamlarining ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Chaqiruv uchastkasida qayd etilish uchun fuqarolar chaqiruv qog'ozida ko'rsatilgan muddatni ...","requires_image":false,"question":"Ro'yxatga olish jarayonining to'g'ri ketma-ketligini tanlang:\n1. Chaqiruv qog'ozini to'ldirish\n2. Tibbiy ko'rikdan o'tish\n3. Ro'yxatdan o'tkazish\n4. Yaroqlilik darajasini tasdiqlash","options":{"A":"3, 1, 2, 4","B":"1, 3, 2, 4","C":"1, 2, 3, 4","D":"2, 1, 3, 4"},"answer":"C","explanation":"Birinchi qadamda chaqiruv qog'ozi to'ldiriladi, keyin tibbiy ko'rik, ro'yxatdan o'tkazish va oxirida yaroqlilik darajasi tasdiqlanadi.","mnemonic":"To'ldir, tekshir, ro'yxat, tasdiq","id":117},{"subject":"Harbiy ta'lim","topic":"Chaqiruv jarayoni","subtopic":"Maqsadli yosh guruhlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O'n besh va o'n olti yoshdagi o'smirlar (chaqiriluvchilar)ni mudofaa ishlari organlari jalb etadigan mutaxassis shifokor har yili tibbiy ko'rikdan o'tkazadi.","requires_image":false,"question":"Qaysi yoshdagi o'smirlar har yili mutaxassis shifokor tomonidan tibbiy ko'rikdan o'tkaziladi?","options":{"A":"12‑13 yosh","B":"20‑21 yosh","C":"18‑19 yosh","D":"15‑16 yosh"},"answer":"D","explanation":"Aniq 15 va 16 yoshdagi o'smirlar tibbiy ko'rikdan o'tishi ko'rsatilgan.","mnemonic":"Besh va olti – tekshiradi","id":118},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Ro'yxatga olish maqsadi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Fuqarolarni chaqiruv uchastkalarida qayd etish ularni harbiy ro'yxatga olish, ularning sonini, harbiy xizmatga qay darajada yaroqli ekanini, umumta'lim va jismoniy tayyorgarlik darajasini aniqlash maqsadida o'tkaziladi.","requires_image":false,"question":"Quyidagi maqsadlarni moslashtiring:\n1. Harbiy yaroqlilikni aniqlash\n2. Jismoniy tayyorgarlik darajasini baholash\n3. Fuqarolar sonini ro'yxatga olish\nA. Yaroqlilik\nB. Tayyorlik\nC. Ro'yxat\nD. Barchasi","options":{"A":"1-D, 2-D, 3-D","B":"1-B, 2-C, 3-A","C":"1-A, 2-B, 3-C","D":"1-C, 2-A, 3-B"},"answer":"C","explanation":"Har bir maqsad alohida ko'rsatilgan: yaroqlilik, tayyorgarlik va ro'yxatga olish. Shuning uchun 1‑A, 2‑B, 3‑C to'g'ri.","mnemonic":"Yaroq, tayyor, ro'yxat","id":119},{"subject":"Harbiy ta'lim","topic":"Chaqiruv jarayoni","subtopic":"Davlat organlarining roli","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Yoshlarni vatanparvarlik ruhida tarbiyalash vazirliklar, idoralar, mahalliy davlat hokimiyati va fuqarolarning o'zini o'zi boshqarish organlari hamda ta'lim muassasalari zimmasida. ...","requires_image":false,"question":"Vatanparvarlik tarbiyasini ta'minlash bo'yicha bosqichlarni to'g'ri tartibda joylashtiring:\n1. Mahalliy hokimiyat bilan hamkorlik\n2. Vazirliklar tomonidan siyosat ishlab chiqish\n3. Ta'lim muassasalarida dastur joriy etish\n4. Fuqarolarning o'zini o'zi boshqarish organlarini jalb qilish","options":{"A":"3, 2, 1, 4","B":"2, 3, 1, 4","C":"1, 2, 3, 4","D":"2, 1, 4, 3"},"answer":"D","explanation":"Strategik siyosat vazirliklar tomonidan ishlab chiqiladi (2), keyin mahalliy hokimiyat bilan hamkorlik (1), fuqarolar o'zini boshqarish organlari jalb qilinadi (4), oxirida ta'lim muassasalarida dastur amalga oshiriladi (3).","mnemonic":"Vazir, hokim, fuqarolar, ta'lim","id":120},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Tibbiy ko'rik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiruv uchastkasida fuqarolarni turli yo'nalishdagi shifokorlar, shu jumladan jarroh, terapevt, nevropatolog, psixiatr, lor, stomatolog, oftalmolog tibbiy ko'rikdan o'tkazadi.","requires_image":false,"question":"Quyidagi shifokorlardan qaysi biri chaqiruv uchastkasida tibbiy ko'rikda qatnashmaydi?","options":{"A":"Ortoped","B":"Jarroh","C":"Psixiatr","D":"Stomatolog"},"answer":"A","explanation":"Ortoped ko'rsatilmagan; boshqa uchlar (stomatolog, jarroh, psixiatr) ro'yxatda mavjud. Shuning uchun ortoped to'g'ri javob.","mnemonic":"Ortoped yo'q, qolganlar bor.","id":121},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga chaqirish","subtopic":"Guvohnoma","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiriluvchilarga chaqiriluvchining qayd etilgani to'g'risidagi guvohnoma beriladi.","requires_image":false,"question":"Chaqiriluvchiga beriladigan hujjat qaysi?","options":{"A":"Muvaffaqiyat sertifikati","B":"Tibbiy kartochka","C":"Qayd etilgani to'g'risidagi guvohnoma","D":"Mahalliy pasport nusxasi"},"answer":"C","explanation":"Aniq guvohnoma berilishi aytilgan; boshqa hujjatlar berilmasligi ko'rsatilmagan.","mnemonic":"Guvohnoma — ro'yxat dalili.","id":122},{"subject":"Harbiy ta'lim","topic":"Safarbarlik rezervi","subtopic":"Xizmatga chaqirilish ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safarbarlik chaqiruvi rezervida xizmatga chaqirilish bosqichlari: 1) ro'yxatga olish, 2) huquq va majburiyatlarni tushuntirish, 3) tibbiy ko'rik, 4) ro'yxatga kiritish.","requires_image":false,"question":"Safarbarlik rezervidagi xizmatga chaqirilish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Ro'yxatga olish\n2. Huquq va majburiyatlarni tushuntirish\n3. Tibbiy ko'rik\n4. Ro'yxatga kiritish","options":{"A":"1, 2, 3, 4","B":"2, 1, 3, 4","C":"1, 2, 4, 3","D":"1, 3, 2, 4"},"answer":"A","explanation":"Ketma-ketlik 1‑ro'yxatga olish, 2‑huquq va majburiyatlar, 3‑tibbiy ko'rik, 4‑ro'yxatga kiritish deb berilgan. Shuning uchun A variant to'g'ri.","mnemonic":"Ro'yxat → huquq → tibbiy → kiritish.","id":123},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Tibbiy ko'rik maxsusligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"matching","source_construct":"Chaqiruv uchastkasida fuqarolarni turli yo'nalishdagi shifokorlar, shu jumladan jarroh, terapevt, nevropatolog, psixiatr, lor, stomatolog, oftalmolog tibbiy ko'rikdan o'tkazadi.","requires_image":false,"question":"Shifokor turlari bilan ularning asosiy mutaxassislik sohasini moslashtiring:\n1. Jarroh\n2. Psixiatr\n3. Oftalmolog\n4. Stomatolog","options":{"A":"1-jarrohlik, 2-psixiatriya, 3-ko'z, 4-tish","B":"1-psixiatriya, 2-jarrohlik, 3-tish, 4-ko'z","C":"1-tish, 2-ko'z, 3-psixiatriya, 4-jarrohlik","D":"1-ko'z, 2-tish, 3-jarrohlik, 4-psixiatriya"},"answer":"A","explanation":"Har bir shifokorning mutaxassisligi aniq ko'rsatilgan: jarroh — jarrohlik, psixiatr — psixiatriya, oftalmolog — ko'z, stomatolog — tish. Shuning uchun A variant to'g'ri.","mnemonic":"Jarroh, Psixiatr, Oftalmolog, Stomatolog — mutaxassisliklar.","id":124},{"subject":"Harbiy ta'lim","topic":"Muddatli harbiy xizmat","subtopic":"Chaqiruv tartibi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Prezident qarori e'lon qilinadi - chaqiruv boshlanishiga bir oy qolganda","requires_image":false,"question":"Prezident qarori qachon e'lon qilinadi?","options":{"A":"Chaqiruvdan bir oy keyin","B":"Chaqiruv boshlanishiga bir oy qolganda","C":"E'lon qilish muddati belgilanmagan","D":"Chaqiruvdan bir hafta oldin"},"answer":"B","explanation":"Aytilganidek, chaqiruv boshlanishiga kamida bir oy qolganda e'lon qilinadi.","mnemonic":"Bir oy oldin - e'lon","id":125},{"subject":"Harbiy ta'lim","topic":"Muddatli harbiy xizmat","subtopic":"Chaqiruv davri","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Har yili mart‑aprel oylarida o'tkaziladi","requires_image":false,"question":"Muddatli harbiy xizmatga chaqiruv qachon o'tkaziladi?","options":{"A":"May‑iyun oylarida","B":"Noyabr‑dekabr oylarida","C":"Mart‑aprel oylarida","D":"Sentyabr‑ok
