,{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdi hayoti","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi (1198–1231) Xorazmshohlar so'nggi hukmdori","requires_image":false,"question":"Jaloliddin Manguberdining tug‘ilgan yili qaysi?","options":{"A":"1198","B":"1212","C":"1205","D":"1220"},"answer":"A","explanation":"Jaloliddin Manguberdi 1198‑1231 yillarda yashaganligi ko‘rsatilgan.","mnemonic":"1198 – birinchi boshlash.","id":739},{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdi xulq‑atvori","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Jaloliddin Manguberdi jasurligi va vatanparvarligi","requires_image":false,"question":"Jaloliddin Manguberdi harbiy yurishlarida qaysi xususiyat ko‘proq ta’kidlangan?","options":{"A":"Jasurlik va vatanparvarlik","B":"Texnikaviy yangilik","C":"Diplomatik aloqalar","D":"Taktikaviy intizom"},"answer":"A","explanation":"Uning sarkardalik qobiliyati, jasurligi va vatanparvarligi dushmani bosib o'tganligi aytilgan.","mnemonic":"Jasur—vatanparvar.","id":740},{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdi umumiy xususiyatlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi sarkardalik qobiliyati tavsifi","requires_image":false,"question":"Jaloliddin Manguberdi sarkardalik qobiliyatining asosiy elementi qaysi?","options":{"A":"Texnologik bilim","B":"Tadbirkorlik","C":"Jasurlik","D":"Ingliz tili"},"answer":"C","explanation":"Uning sarkardalik qobiliyati, jasurligi va vatanparvarligi alohida ta’kidlangan.","mnemonic":"Jasur – sarkarda.","id":741},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi tamoyillari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi tamoyillari: urushning birinchi tamoyili – g'alabaga erishish uchun hamma kuchlarni shiddat bilan harakatlantirish.","requires_image":false,"question":"Manguberdi tamoyillaridan qaysi biri \"g'alaba uchun hamma kuchlarni shiddat bilan harakatlantirish\"ni bildiradi?","options":{"A":"Muvaffaqiyatdan unumli foydalanish","B":"To'xtatsiz zarba berish","C":"Birlamchi kuchlarni maksimal darajada qo'llash","D":"Ikkinchi darajali hududlarni zaiflashtirish"},"answer":"C","explanation":"Birlamchi tamoyil g'alabaga erishish uchun barcha kuchlarni shiddat bilan harakatlantirishni talab qiladi. Ikkinchi darajali hududlarni zaiflashtirish boshqa tamoyilga tegishli. To'xtatsiz zarba berish va muvaffaqiyatdan unumli foydalanish ham boshqa tamoyillar.","mnemonic":"Birlamchi – Barcha, Birlamchi.","id":742},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi ikkinchi tamoyili","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Manguberdi ikkinchi tamoyili: ikkinchi darajali hududlarni kuchsizlantirsa ham, imkoni boricha yirik kuchlarni bosh zarba berish yo'nalishlarida jamlash.","requires_image":false,"question":"Manguberdi ikkinchi tamoyilida qaysi hududlarga e'tibor qaratiladi?","options":{"A":"Markaziy front","B":"Dushmanning logistika bazalari","C":"Ikkinchi darajali hududlar","D":"Yirik kuchlar joylashuvi"},"answer":"C","explanation":"Ikkinchi darajali hududlar kuchsizlanadi, shunda yirik kuchlar bosh zarbaga yo'naltiriladi. Markaziy front va logistika bazalari boshqa konseptlar.","mnemonic":"Ikkinchi – Ikkilik hudud.","id":743},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi to'xtasiz zarba","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Manguberdi tamoyili: to'xtasiz zarba berish – hujumkor urushning o'ziga xos xususiyati.","requires_image":false,"question":"Manguberdi tamoyillaridan to'xtasiz zarba berish nima bilan bog'liq?","options":{"A":"Uzluksiz hujum tempi","B":"Qurilish muddatini qisqartirish","C":"Resurslarni qayta taqsimlash","D":"Dushman pozitsiyasini himoya qilish"},"answer":"A","explanation":"To'xtasiz zarba berish harakatni uzluksiz davom ettirishni nazarda tutadi. Qolgan variantlar boshqa jarayonlarga tegishli.","mnemonic":"To'xtasiz – Tizimni to'xtatmas.","id":744},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi muvaffaqiyatdan foydalanish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Manguberdi tamoyili: erishilgan muvaffaqiyatdan tez va unumli foydalanish.","requires_image":false,"question":"Manguberdi tamoyillaridan \"erishilgan muvaffaqiyatdan tez va unumli foydalanish\" qaysi maqsadni ko'rsatadi?","options":{"A":"Natijalarni darhol qo'llash","B":"Yangi qurol ishlab chiqarish","C":"Taktikaviy rejalashtirishni kechiktirish","D":"Dushmanga qarshi mudofaa tayyorlash"},"answer":"A","explanation":"Muvaffaqiyatni darhol qo'llash – temir yo'lda natijani samarali ishlatish demakdir. Boshqa variantlar natijani kechiktiradi yoki aloqasiz.","mnemonic":"Muvaffaqiyat – Mehnat.","id":745},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Amir Temur qo'shin tuzilishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Amir Temur 7 ta qo'lda qo'shinni joylashtirish tartibini joriy etgan.","requires_image":false,"question":"Amir Temur jangida qo'shinni 7 ta qo'lda bo'linishi qanday taktik afzallik beradi?","options":{"A":"Markaziy kuchlarni mustahkamlaydi","B":"Ko'p yo'nalishda hujum imkonini beradi","C":"Dushman qarshiligini bir tomonlama kuchaytiradi","D":"Logistik xarajatlarni kamaytiradi"},"answer":"B","explanation":"Qo'lda bo'linish ko'p yo'nalishli harakatga imkon yaratadi, shu orqali dushmanni bir nechta tomondan bosadi. Markaziy kuchlarni mustahkamlash, logistika va dushman qarshiligini kamaytirish boshqa sabablarga bog'liq emas.","mnemonic":"Yetti qo'l – Yiqilmas.","id":746},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Amir Temurning 1395 yildagi taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"1395-yil Terek daryosi jangida Amir Temur kamondan o'q uzish usulini qo'llagan.","requires_image":false,"question":"Terek daryosi jangida Amir Temurning kamondan o'q uzish taktikasi qaysi xususiyatga asoslangan?","options":{"A":"Kuchli zaxiralardan foydalanish","B":"Artileriya bilan qo'shinni qo'llab-quvvatlash","C":"Otliqlarni to'g'ridan-to'g'ri otish","D":"Dushman otliqlarni kutilmagan o'q bilan zararlash"},"answer":"D","explanation":"Kamon o'q uzish otliqlarga kutilmagan zarba berish imkonini yaratadi, bu esa dushman harakatini tormozlaydi. To'g'ridan-to'g'ri otish yoki artileriya boshqa metodlar.","mnemonic":"Kamon – Kutilmagan o'q.","id":747},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi to'xtasiz zarba","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi tamoyilida to'xtasiz zarba berish urushning o'ziga xos xususiyati.","requires_image":false,"question":"Manguberdi tamoyillariga ko'ra, to'xtasiz zarba berishning amaliyotdagi asosiy vazifasi nima?","options":{"A":"Dushmanni keskin bosib, qarshilikni yo'qotish","B":"Qurilma xizmat muddatini uzaytirish","C":"Harbiy logistika tizimini mustahkamlash","D":"Mudofaa chizig'ini qayta tiklash"},"answer":"A","explanation":"To'xtasiz zarba dushmanni tez bosib, uning qarshiligini yo'qotadi. Logistika, mudofaa yoki texnik xizmat bu tamoyilga tegishli emas.","mnemonic":"To'xtasiz – Toshga urish.","id":748},{"subject":"Harbiy ta'lim","topic":"Jang taktikalari","subtopic":"Amir Temur qo'shin tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Amir Temur qo'shinni 7 ta qo'lda bo'linishini joriy etgan, bu usul keyingi yurishlarda ham qo'llanilgan.","requires_image":false,"question":"7 ta qo'lda bo'linish usulini amalda qo'llashda qanday xatolikdan saqlanish kerak?","options":{"A":"Har bir qo'lda bir xil vazifani berish","B":"Kuchlarni birga jamlamaslik","C":"Markaziy qo'lda ortiqcha quvvat qo'shish","D":"Qo'lda harbiy ranglarni bir xil tanlash"},"answer":"B","explanation":"Usulning maqsadi kuchlarni tarqatish, shuning uchun birga jamlanish xatolikdir. Boshqa variantlar usulga bevosita ta'sir qilmaydi.","mnemonic":"Kuchlar – Ko'p, birga emas.","id":749},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi va Temur taktikalarining taqqoslanishi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Manguberdi to'xtasiz zarba va tez natijalarni olishga urg'u bergan, Temur esa qo'shinni 7 ta qo'lda taqsimlab, an'anaviy tarkibni rad etgan.","requires_image":false,"question":"Quyidagi tavsiflardan qaysi biri ikkala sardarning taktikalarini birlashtiradi?","options":{"A":"Yuqori harakat tezligi bilan qo'shinni bo'linish orqali kuchli hujum","B":"Yirik kuchlarni bir joyga jamlab, uzoq muddatli mudofaa","C":"An'anaviy uch qanotli tuzilma bilan to'xtasiz zarba berish","D":"Kamondan o'q uzish bilan markaziy qo'lda kuchni kuchaytirish"},"answer":"A","explanation":"Birlashtirilgan taktik harakat tezligini (Manguberdi) va qo'shinni bo'linish (Temur) orqali kuchli hujumni ta'minlaydi. Boshqa variantlar biror birining elementini noto'g'ri birlashtiradi.","mnemonic":"Harakat + Bo'linish = Kuchli.","id":750},{"subject":"Harbiy ta'lim","topic":"Bobur jang taktikasi","subtopic":"Qurilma turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Bobur jangida to‘fang, arava, fillar, piyodalar qo‘shinlari ishtirok etgan","requires_image":false,"question":"Bobur jangida qaysi birlik harbiy texnika bilan eng ko'p bog‘liq edi?","options":{"A":"To‘fang","B":"Fillar","C":"Piyodalar","D":"Arava"},"answer":"B","explanation":"Fillar jangovar bo‘lib, katta massali harbiy texnika sifatida ta’riflangan. Piyodalar yengil, to‘fang tez harakat, arava transport vazifasini bajaradi.","mnemonic":"Fillar – katta texnika","id":751},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Temurning hududiy kengashi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda Amir Temur 27 mamlakatni o'z tasarrufiga kiritgani","requires_image":false,"question":"Amir Temur qaysi davrda 27 mamlakatni o'z hududiga qo'shgan?","options":{"A":"XV asr oxiri","B":"XVI asr o'rtasi","C":"XIII asr boshida","D":"XIV asr oxiri"},"answer":"D","explanation":"Amir Temur 27 mamlakatni, jumladan Eron, Afg'oniston va Hindiston, o'z tasarrufiga kiritgani, bu XIV asr oxirida sodir bo'lgan.","mnemonic":"XIVda Temur kengaydi","id":752},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Jangovar shartlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda dushman lashkari 12 ming otliqdan kam bo'lsa, Amir boshqaradi","requires_image":false,"question":"Agar dushman lashkari 10 000 otliqdan iborat bo'lsa, jangda kim amirlik qiladi?","options":{"A":"Vazir","B":"Jang bo'yicha kapitani","C":"Sohibqiron","D":"Amir Temur"},"answer":"D","explanation":"Dushman 12 ming otliqdan kam bo'lsa, Amir Temur ul-umaro sardorlik qilishi belgilangan.","mnemonic":"Kam otliqda Amir boshqaradi","id":753},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Jang maydoni shartlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda jang maydonining suvga yaqinligi talab qilinadi","requires_image":false,"question":"Jang maydonini tanlashda birinchi tekshirilishi kerak bo'lgan omil nima?","options":{"A":"Suvga yaqinligi","B":"Qorong'i o'rmon","C":"Yuqori tog'li hudud","D":"Ochiq dalalar"},"answer":"A","explanation":"Birinchi shart sifatida jang maydonining suv bilan ta'minlanish shartlari o'rganilishi ko'rsatilgan.","mnemonic":"Suv birinchi","id":754},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Sipoh maoshi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda sipohlarning maoshi haqida ma'lumot berilga ":"Umumta'limiy tayyorgarlik","requires_image":false,"question":"Chaqiriluvchilarni harbiy xizmatga tayyorlashda umumta'limiy tayyorgarlik qaysi maqsadda amalga oshiriladi?","options":{"A":"Tibbiy xizmat ko‘rsatish","B":"Harbiy fanlarni o‘rganish","C":"Texnik servis","D":"Qishloq xo‘jaligi"},"answer":"B","explanation":"Umumta'limiy tayyorgarlik harbiy bilimlarni o‘rganishga yo‘naltirilgan.","mnemonic":"Umumta'lim – harbiy bilimga","id":791},{"subject":"Harbiy ta'lim","topic":"Harbiy birliklar","subtopic":"Nishonlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Harbiy ansambl, qo‘shin turlarini farqlovchi nishonlar","requires_image":false,"question":"Qo‘shin turlarini farqlovchi nishonlar qayerda tasvirlanadi?","options":{"A":"O‘quv katalogida","B":"Davlat bayrog‘ida","C":"Harbiy ansamblda","D":"Xalqaro shartnomada"},"answer":"C","explanation":"Qo‘shin turlarini farqlovchi nishonlar harbiy ansamblda ko‘rsatilgan.","mnemonic":"Ansambl nishon, turni ko‘rsat","id":792},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmatga tayyorlash","subtopic":"Vatanparvarlik ruhida tarbiyalash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Vatanparvarlik ruhida tarbiyalanganlik","requires_image":false,"question":"Harbiy xizmatga tayyorlashda vatanparvarlik ruhida tarbiyalanganlik qanday maqsadni anglatadi?","options":{"A":"Ishlab chiqarishni oshirish","B":"Qonun buzishni oldini olish","C":"Xalqaro aloqalarni rivojlantirish","D":"Davlatga sadoqatni mustahkamlash"},"answer":"D","explanation":"Vatanparvarlik ruhida tarbiyalash harbiy xizmatchilarning davlatga sadoqatini oshirishga qaratilgan.","mnemonic":"Vatanparvarlik – sadoqatga asos","id":793},{"subject":"Harbiy ta'lim","topic":"Harbiy birliklar","subtopic":"Xizmat turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Harbiy ansambl","requires_image":false,"question":"Quyidagi biriktirilgan xizmatlardan qaysi biri harbiy ansamblga kiradi omasi","subtopic":"Huquq va majburiyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiriluvchilarga chaqiriluvchining qayd etilgani to'g'risidagi guvohnoma beriladi, huquq va majburiyatlari, harbiy ro'yxatga olish va harbiy xizmatga tayyorgarlik tartibi tushuntiriladi","requires_image":false,"question":"Chaqiruv guvohnomasida fuqarolarga nimalar tushuntiriladi?","options":{"A":"Ish haqi va pensiya miqdori","B":"Huquq, majburiyatlar, ro'yxatga olish tartibi","C":"Sog'liqni saqlash xizmati ko'rsatmalari","D":"Saylovda ishtirok etish shartlari"},"answer":"B","explanation":"Guvohnoma fuqarolarning huquq va majburiyatlari, ro'yxatga olish hamda tayyorgarlik jarayoni haqida ma'lumot beradi. Boshqa variantlar matnda yo'q.","mnemonic":"Guvohnoma – huquq, majburiyat, tayyorgarlik","id":797},{"subject":"Harbiy ta'lim","topic":"Chaqiruv reservi","subtopic":"Xizmatga chaqirish muddatini kechiktirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Muddatli harbiy xizmatga hamda safarbarlik chaqiruvi rezervidagi xizmatga chaqirilish muddatini kechiktirish","requires_image":false,"question":"Chaqiruv reservida xizmatga chaqirilish muddatini kechiktirish uchun kimga murojaat qilinadi?","options":{"A":"Sog'liqni saqlash vazirligi","B":"Ish beruvchi","C":"Mahalliy sud","D":"Mudofaa ishlari organlari"},"answer":"D","explanation":"Muddatni kechiktirish haqida mudofaa ishlari organlari bilan bog'lanish nazarda tutilgan. Boshqa organlar bu masalaga tegishli emas.","mnemonic":"Kechiktirish – mudofaa organi","id":798},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Raqamli ma'lumot","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"30 tayyorgarlik ishlari chaqiriluvchilarni vatanparvarlik ruhida tarbiyalash","requires_image":false,"question":"Matnda qancha tayyorgarlik ishlari sanalgan?","options":{"A":"30","B":"20","C":"8","D":"15"},"answer":"A","explanation":"Aniq faol bo‘lganda","C":"Sudlanganligi tugallanmaganida","D":"Sport musobaqasida qatnashganda"},"answer":"C","explanation":"Jinoiy javobgarlikka tortilgan, sudlanganligi tugallanmagan fuqarolar chaqirilmaydi deyilgan.","mnemonic":"Sud tugamas – chaqirilmas","id":807},{"subject":"Harbiy ta'lim","topic":"Saf Nizomi","subtopic":"Umumiy qoidalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Saf Nizomi 7 bo'lim, 194 moddadan iborat: 1. Umumiy qoidalar.","requires_image":false,"question":"Saf Nizomi bo'limlarida birinchi bo'lim qaysi mavzuni qamrab oladi?","options":{"A":"Harbiycha salom berish","B":"Safdan chiqish va qaytish","C":"Umumiy qoidalar","D":"Qurolsiz saf usullari"},"answer":"C","explanation":"Saf Nizomi birinchi bo'limi \"Umumiy qoidalar\" deb belgilangan, qolgan variantlar keyingi bo'limlarga tegishli.","mnemonic":"1‑Umumiy, 2‑Qurolsiz, 3‑Salom, 4‑Chiqarish","id":808},{"subject":"Harbiy ta'lim","topic":"Saf Nizomi","subtopic":"Saf boshqarilishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf Nizomi bo'yicha safning boshqarilishi va saf elementlarini bilish tavsiflangan.","requires_image":false,"question":"Saf boshqaruvining asosiy vositasi qaysi?","options":{"A":"Radio aloqa","B":"Komanda signallari","C":"Yozma ko'rsatmalar","D":"Elektron sensorlar"},"answer":"B","explanation":"Safni boshqarish an'anaviy komanda signallari (qo'l belgilari, ovozli komandalar) orqali amalga oshiriladi; boshqa vositalar zamonaviy bo'lsa ham, asosiy boshqaruv signaldir.","mnemonic":"Safni boshqarish – komanda signali","id":809},{"subject":"Harbiy ta'lim","topic":"Saf Nizomi","subtopic":"Safga turish yoshi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Saf Nizomi 7 bo'lim, 194 moddadan iborat: harbiy xizmatchilarning safga turishdan oldingi talablari.","requires_image":false,"question":"Safga turish uchun minimal yosh chegarasi qaysi?","options":{"A":"23 yosh","B":"20 yosh","C":"21 yosh","D":"18 yosh"},"answer":"D","explanation":"Safga turish uchun minimal yosh 18 ga teng, bu yosh harbiy xizmatga kirish yoshiga mos keladi; boshqa yoshlar yuqoriroq talablarga mos keladi.","mnemonic":"Safga 18 yoshda kirish","id":810},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Saf Nizomida \"ikiki sherengali saf\" tushunchasi va uning tavsifi keltirilgan.","requires_image":false,"question":"\"Ikki sherengali saf\" qanday tavsiflanadi?","options":{"A":"Bitta sherenga ega bo'lib, barcha xizmatchilar bitta qatorda","B":"Sherengalar orasida bir qadamga teng distansiya saqlangan saf","C":"Har bir xizmatchi alohida sherengada turadi","D":"Sherenga nomi har doim o'zgaradi"},"answer":"B","explanation":"Ikki sherengali saf – ikkinchi sherengadagi xizmatchilar birinchi sherengadagi xizmatchilar ortida bir qadamga teng masofada turadi.","mnemonic":"Ikki sherengada bir qadam","id":811},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf o'lchamlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf uzunligi – birinchi sherenga (oldinda turgan) bilan oxirgi sherenga (ortda turgan) orasidagi masofa.","requires_image":false,"question":"Agar safda birinchi sherenga va oxirgi sherenga orasidagi masofa 12 metr bo'lsa, saf uzunligi qanday hisoblanadi?","options":{"A":"12 metr","B":"6 metr","C":"24 metr","D":"1,2 metr"},"answer":"A","explanation":"Saf uzunligi birinchi va oxirgi sherenga orasidagi masofa bo'lgani uchun 12 metr to'g'ri javob.","mnemonic":"Uzunlik = birinchi‑oxirgi masofa","id":812},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf eni – qanotlar orasidagi masofa.","requires_image":false,"question":"Safda qanotlar orasidagi masofa 2,5 metr bo'lsa, saf eni qanday ifodalanadi?","options":{"A":"25 metr","B":"5 metr","C":"2,5 metr","D":"0,5 metr"},"answer":"C","explanation":"Saf eni – qanotlar orasidagi masofa, shuning uchun 2,5 metr to'g'ri javob.","mnemonic":"Eni = qanotlar orasidagi masofa","id":813},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safdagi interval","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Interval – front bo'ylab harbiy xizmatchilar orasidagi masofa.","requires_image":false,"question":"Front bo'ylab harbiy xizmatchilar orasidagi masofa 1,2 metr bo'lsa, bu interval qaysi qiymatga teng?","options":{"A":"12 metr","B":"0,12 metr","C":"1,2 metr","D":"12,0 metr"},"answer":"C","explanation":"Interval front bo'ylab xizmatchilar orasidagi masofa bo'lgani uchun 1,2 metr to'g'ri.","mnemonic":"Interval = front masofasi","id":814},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safda harakatlanish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safdagi harakat mashinalarda bajarilganda birinchi mashina chizig'i va oxirgi mashina chizig'i orasidagi masofa saf uzunligini belgilaydi.","requires_image":false,"question":"Mashina safida birinchi mashina chizig'i va oxirgi mashina chizig'i orasidagi masofa 15 metr bo'lsa, saf uzunligi qanday?","options":{"A":"15 metr","B":"1,5 metr","C":"30 metr","D":"150 metr"},"answer":"A","explanation":"Mashina safida saf uzunligi birinchi va oxirgi mashina chizig'i orasidagi masofa, ya'ni 15 metr.","mnemonic":"Mashina uzunligi = chiziq masofa","id":815},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safda xabar berish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safda turish haqida berilgan buyruq necha qismdan iborat bo'lishi ko'rsatilgan.","requires_image":false,"question":"Safda turish buyrug'i odatda qancha qismdan iborat?","options":{"A":"Uch qism","B":"Bir qism","C":"Besh qism","D":"Ikki qism"},"answer":"A","explanation":"Safda turish buyruqlari odatda “tayyor bo‘ling, safga qo‘ying, turgan holda bo‘ling” kabi uch qismdan iborat.","mnemonic":"Uch – tayyor, saf, turgan","id":816},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Qator tushunchasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qator: ikki nafar harbiy xizmatchining ikki sherengali safda ketma-ket turgan holati.","requires_image":false,"question":"Qator tushunchasiga ko'ra, ikki sherengali safda ketma-ket turgan harbiy xizmatchilar qaysi holatda bo'ladi?","options":{"A":"Har bir xizmatchi bir-biriga yonma-yon turadi","B":"Xizmatchilar orqa tomonga buriladi","C":"Xizmatchilar birinchi safga qarab yuzlanadi","D":"Xizmatchilar oralarida bo'sh joy qoladi"},"answer":"A","explanation":"Qator – ikki nafar harbiy xizmatchining ikki sherengali safda ketma-ket turgan holati, ya'ni ular yonma-yon joylashadi. B bandi bo'sh joyni bildiradi, C bandi yo'nalishni, D bandi orqa burilishni tasvirlaydi.","mnemonic":"Qator = Qator, yonma-yon","id":817},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Yetakchi vazifasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Yetakchi: tayinlangan yo‘nalishda bosh bo‘lib borayotgan harbiy xizmatchi (bo‘linma, mashina).","requires_image":false,"question":"Yetakchi kimga nisbatan aniqlanadi?","options":{"A":"Komandirga qarshi turuvchi harbiy xizmatchi","B":"Yo‘nalishda birinchi harakat qilayotgan xizmatchi yoki bo‘linma","C":"Saf oxirida turgan mashina","D":"Saf boshida orqa tomonga qarab turuvchi xizmatchi"},"answer":"B","explanation":"Yetakchi – yo‘nalishda birinchi harakat qilayotgan, bosh bo‘lib boruvchi xizmatchi yoki bo‘linma. B bandi oxirgi, C va D bandlari tasvirga mos kelmaydi.","mnemonic":"Yetakchi – birinchi, boshga yetadi","id":818},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safni boshqarish usullari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safni boshqarish: komandir tomonidan ovoz, signallar, shaxsan ko‘rsatish, texnik vositalar orqali beriladigan buyruqlar.","requires_image":false,"question":"Quyidagi usullardan qaysi biri safni boshqarishda **emas**?","options":{"A":"Ovozli signallar","B":"Shaxsiy ko‘rsatmalar","C":"Komandirning yozma buyrug‘i","D":"Texnik vositalar yordamida signal berish"},"answer":"C","explanation":"Safni boshqarishda ovoz, signal, shaxsiy ko‘rsatma va texnik vositalar ishlatiladi; yozma buyruq bu ro‘yxatda ko‘rsatilmagan.","mnemonic":"Saf boshqarish – ovoz, signal, ko‘rsatma, texnika","id":819},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf turli turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf bir, ikki, uch, to‘rt va undan ortiq kolonnali bo‘lishi mumkin.","requires_image":false,"question":"Quyidagilardan qaysi biri safning kolonna soni bo‘lishi **imkonsiz**?","options":{"A":"To‘rt kolonna","B":"Beshta kolonna","C":"Ikki kolonna","D":"Uch kolonna"},"answer":"B","explanation":"Saf 1‑4 yoki undan ortiq kolonnali bo‘lishi mumkin; beshta ham ortiq deb hisoblanadi, ammo aniq ko‘rsatilgan son 1‑4, shuning uchun 5‑soni imkonsiz.","mnemonic":"Saf kolonnalari – bir‑to‘rt, besh yo‘q","id":820},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safni boshqarish vositalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safni boshqarish: komandir tomonidan ovoz, signallar, shaxsan ko‘rsatish, texnik vositalar.","requires_image":false,"question":"Quyidagi komandir buyrug‘idan qaysi biri **texnik vosita** yordamida beriladi?","options":{"A":"Flagerning signal panohisi","B":"Yozma buyruq","C":"Qo‘lda ko‘rsatma berish","D":"Og‘zaki qo‘ng‘iroq"},"answer":"A","explanation":"Flagerning signal panohisi – texnik qurilma, boshqa variantlar og‘zaki, qo‘lda yoki yozma usullar.","mnemonic":"Texnik – signal, flager","id":821},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safdagi xizmatchi harakati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf Nizomiga binoan, safda turish haqida berilgan buyruq necha qismdan iborat bo‘ladi.","requires_image":false,"question":"Safda turish bo‘yicha buyruq necha qismdan iborat?","options":{"A":"Besh qism","B":"To‘rt qism","C":"Uch qism","D":"Ikki qism"},"answer":"C","explanation":"Safda turish bo‘yicha buyruq uch qismdan iboratligi ko‘rsatilgan. Boshqa raqamlar matnda keltirilmagan.","mnemonic":"Saf turish – uch qism","id":822},{"subject":"Harbiy ta'lim","topic":"Komanda xatoliklari","subtopic":"Qadam tanlash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safda turgan harbiy xizmatchilar har qanday dastlabki komandaga binoan qad rostlaydi; yurish davomida esa shaxdam qadam tashlay boshlashadi.","requires_image":false,"question":"Safda qadam tashlashda xodim qaysi xatoni qilmasligi kerak?","options":{"A":"Qadamni qisqa tutish","B":"Qadamni ortiqcha keng qilish","C":"Bir xil uzunlikda qadam tashlash","D":"Qadamni to'g'ri yo'nalishda qadam tashlash"},"answer":"B","explanation":"Qadamni ortiqcha keng qilish saf ritmini buzadi; boshqa variantlar qadamning to'g'ri tartibini ta'minlaydi.","mnemonic":"Keng qadam – kutilmagan","id":823},{"subject":"Harbiy ta'lim","topic":"Harbiy holat va komandalar","subtopic":"Madhiya ijro etilganda holat","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Madhiya ijro etilganda, harbiy xodimning qo‘li ko‘krak chap tomoniga qo‘yilishi tavsifi","requires_image":false,"question":"Davlat madhiyasi ijro etilganda, bosh kiyimsiz xodim qaysi tomoniga qo‘lini qo‘yadi?","options":{"A":"Ko‘krak o‘ng tomoniga","B":"Ko‘krak chap tomoniga","C":"Bel orqasiga","D":"Boshga"},"answer":"B","explanation":"Bosh kiyimsiz harbiy xodim ko‘krak chap tomoniga qo‘lini qo‘yadi, boshqa tomonga qo‘yish tavsiya etilmagan.","mnemonic":"Chap qo‘l – chap ko‘krak","id":824},{"subject":"Harbiy ta'lim","topic":"Harbiy holat va komandalar","subtopic":"TUR! komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"TUR! komandasi berilganda oyog‘lar yelka kengligida bo‘lishi kerakligi","requires_image":false,"question":"TUR! komandasi berilganda oyog‘lar qanday kenglikda bo‘lishi lozim?","options":{"A":"Bosh kengligida","B":"Yelka kengligida","C":"Bel kengligida","D":"Kengaytirilgan holatda"},"answer":"B","explanation":"TUR! komandasi uchun oyog‘lar yelka kengligida turishi ko‘rsatilgan.","mnemonic":"TUR – yelka kengligi","id":825},{"subject":"Harbiy ta'lim","topic":"Harbiy holat va komandalar","subtopic":"TO‘G‘RILANGLAN! komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"TO‘G‘RILANGLAN! komandasi haqida tavsif","requires_image":false,"question":"TO‘G‘RILANGLAN! komandasi berilganda xodim nima qiladi?","options":{"A":"Boshini egib, qurolni o‘ngga ko‘chiradi","B":"O‘z qurolini, kiyimini, anjomlarini to‘g‘rilaydi","C":"Ko‘rsatkich barmog‘ini yelkaga qo‘yadi","D":"Joyidan turib, qo‘llarni pastga tushiradi"},"answer":"B","explanation":"TO‘G‘RILANGLAN! komandasi xodimni qurol, kiyim, anjomlarni to‘g‘rilashga chaqiradi.","mnemonic":"TO‘G‘RILAN – qurolni to‘g‘ri","id":826},{"subject":"Harbiy ta'lim","topic":"Harbiy holat va komandalar","subtopic":"Holat tasvirlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qad rostlangan holat tasviri (1-rasm)","requires_image":false,"question":"Qad rostlangan holatda xodimning tanasi qanday holatda bo‘ladi?","options":{"A":"Tana orqa tomonga egilgan, belga qaratilgan","B":"Bosh tik, qo‘llar yuqorida","C":"Tana old tomonga egilgan, belga qaratilgan","D":"Yelkalar sathda, qo‘llar yon tomonlarga"},"answer":"C","explanation":"Qad rostlangan holatda xodim tanasi old tomonga egilib, belga qaratiladi.","mnemonic":"Qad – oldga egilgan","id":827},{"subject":"Harbiy ta'lim","topic":"Harbiy holat va komandalar","subtopic":"Harbiy pozitsiyalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Kadrlar ko‘rinishida qo‘ lik","requires_image":false,"question":"Mudofaa siyosatining qaysi prinsipi boshqa davlatga qarshi harbiy kuch ishlatmaslikni belgilaydi?","options":{"A":"Harbiy qurilishning zamonaviy urushlarga moslashuvi","B":"Yadroviy va yalpi qirg‘in qurollarini rad etish","C":"Qurolli kuchlarning doimiy shaylikda bo‘lishi","D":"Boshqa davlatga qarshi harbiy kuch ishlatmaslik"},"answer":"D","explanation":"Keltirilganidek, bu prinsip aniq shu ibora bilan ifodalangan. Qolgan variantlar boshqa prinsiplarga oid.","mnemonic":"Boshqa davlatga – kuch ishlatmaslik","id":873},{"subject":"Harbiy ta'lim","topic":"Mudofaa printsiplari","subtopic":"Yadroviy qurollarni rad etish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Mudofaa sohasidagi davlat siyosatining asosiy prinsiplari: yadroviy va boshqa turdagi yalpi qirg‘in qurollarini ishlab chiqarish, qayta ishlash, olish, saqlash, tarqatish va joylashtirishni rad etish","requires_image":false,"question":"Quyidagi prinsiplardan qaysi biri yadroviy va yalpi qirg‘in qurollarini rad etishni nazarda tutadi?","options":{"A":"Yadroviy va boshqa turdagi yalpi qirg‘in qurollarini rad etish","B":"Qurolli kuchlarning doimiy shaylikda bo‘lishi","C":"Boshqa davlatga qarshi harbiy kuch ishlatmaslik","D":"Harbiy-siyosiy bloklarda qatnashmaslik"},"answer":"A","explanation":"Aynan shu ibora keltirilgan: yadroviy va boshqa turdagi yalpi qirg‘in qurollarini ishlab chiqmaslik, rad etish. Boshqa variantlar boshqa prinsiplarga tegishli.","mnemonic":"Yadro – rad, qirg‘in – rad","id":874},{"subject":"Harbiy ta'lim","topic":"Mudofaa printsiplari","subtopic":"Qurolli kuchlarning doimiy shaylikda bo‘lishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Mudofaa sohasidagi davlat siyosatining asosiy prinsiplari: Qurolli Kuchlar, iqtisodiyot, aholi va hududning tavzga shaylikda bo‘lishi","requires_image":false,"question":"Qurolli kuchlarning doimiy shaylikda bo‘lishi qaysi mudofaa prinsipiga kiradi?","opt lar tizim ichida boshqa rollarga ega, lekin rahbarlik vazifasini bajarishmaydi.","mnemonic":"Prezident – qurolli kuchlar boshlig‘i","id":877},{"subject":"Harbiy ta'lim","topic":"Mudofaa printsiplari","subtopic":"Qurolli kuchlarning kundalik faoliyatiga rahbarlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qurolli Kuchlarning kundalik faoliyatiga rahbarlikni o‘z bo‘ysunuvida Qurolli Kuchlarning tarkibiga kiradigan harbiy tuzilmalari bo‘lgan vazirliklar va idoralarning rahbarlari amalga oshiradilar","requires_image":false,"question":"Qurolli kuchlarning kundalik faoliyatiga kim rahbarlik qiladi?","options":{"A":"Vazirliklar va idoralar rahbarlari","B":"Qurolli Kuchlar Bosh qo‘mondoni","C":"Prezident","D":"Mudofaa vaziri"},"answer":"A","explanation":"Aytilganidek, kundalik faoliyatga vazirliklar va idoralar rahbarlari rahbarlik qiladi. Prezident umumiy rahbarlikni amalga oshiradi, lekin kundalik faoliyatga emas.","mnemonic":"Kundalik – vazirlik rahbarlari","id":878},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Umumiy ma'lumotlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Mudofaa Doktrinasi Oʻzbekiston Respublikasining 2018‑yil 9‑yanvardagi 458‑sonli Qonuni bilan tasdiqlangan","requires_image":false,"question":"Mudofaa doktrinasi qaysi sanada va qaysi qonun raqami bilan tasdiqlangan?","options":{"A":"30-sentabr 2020‑yil, 600‑sonli Qonun","B":"1-iyun 2017‑yil, 322‑sonli Qonun","C":"9-yanvar 2018‑yil, 458‑sonli Qonun","D":"15-mart 2019‑yil, 511‑sonli Qonun"},"answer":"C","explanation":"Qonun matnida mudofaa doktrinasi 2018‑yil 9‑yanvar kuni 458‑sonli Qonun bilan tasdiqlanganligi aniq keltirilgan. Boshqa variantlarda sana va raqam mos kelmaydi.","mnemonic":"9‑yanvar, 458‑son, mudofaa tasdiq.","id":879},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Struktura","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Mudofaa Doktrinasi 4 bo‘lim va 40 moddadan iborat","requires_image":false,"question":"Mudofaa doktrinasi nechta bo‘limdan iborat?","options":{"A":"To‘rt bo‘lim","B":"Uch bo‘lim","C":"O‘n bo‘lim","D":"Beshta bo‘lim"},"answer":"A","explanation":"Doktrina 4 bo‘limdan tashkil topganligi ko‘rsatilgan. Boshqa raqamlar matnda yo‘q.","mnemonic":"Doktrina to‘rt bo‘lim.","id":880},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Strategik jihat","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrinada harbiy‑strategik jihatlarning ahamiyati","requires_image":false,"question":"Quyidagi harbiy‑strategik jihatlardan qaysi biri mudofaa doktrinasida alohida bo‘lim sifatida keltirilgan?","options":{"A":"Harbiy‑siyosiy jihatlar","B":"Harbiy‑strategik jihatlar","C":"Harbiy‑iqtisodiy jihatlar","D":"Harbiy‑taktik jihatlar"},"answer":"B","explanation":"3‑chi bo‘lim harbiy‑strategik jihatlarni o‘z ichiga oladi. Iqtisodiy, siyosiy va taktika boshqa bo‘limlarda yoritilgan.","mnemonic":"Strategik – alohida bo‘lim.","id":881},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Maqsadlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Mudofaa sohasidagi siyosatining asosiy maqsadlari","requires_image":false,"question":"Quyidagilardan qaysi biri mudofaa siyosatining asosiy maqsadi sifatida ko‘rsatilgan?","options":{"A":"Xalqaro savdo hajmini oshirish","B":"Mustaqillik, suverenitet, hududiy yaxlitlikni himoya qilish","C":"Yangi sanoat korxonalarini barpo etish","D":"Turizm infratuzilmasini rivojlantirish"},"answer":"B","explanation":"Mudofaa siyosatining asosiy maqsadi mustaqillik, suverenitet, hududiy yaxlitlik va konstitutsiyaviy tuzumni himoya qilish deb belgilangan. Boshqa variantlar mudofaa doirasiga kirmaydi.","mnemonic":"Mustaqillik, suverenitet, hudud – mudofaa asoslari.","id":882},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Xalqaro kontekst","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrinada xalqaro huquq, BMT Ustavining prinsiplari ko‘rsatilgan","requires_image":false,"question":"Mudofaa doktrinasi qaysi xalqaro hujjatlarga asoslanadi?","options":{"A":"Xalqaro huquq va BMT Ustavining prinsiplari","B":"OSCE protokollari","C":"Yevropa Ittifoqi mahkamasining qarorlari","D":"NATO shartnomalari"},"answer":"A","explanation":"Doktrinada xalqaro huquq va BMT Ustavining prinsiplari asos sifatida keltirilgan. NATO, Yevropa Ittifoqi yoki OSCE alohida ko‘rsatilmagan.","mnemonic":"Xalqaro huquq, BMT – asos.","id":883},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Xavfsizlik konsepsiyasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrina milliy xavfsizlik konsepsiyasiga asoslanadi","requires_image":false,"question":"Mudofaa doktrinasi qaysi asosiy konsepsiyaga tayanadi?","options":{"A":"Siyosiy liberalizm konsepsiyasi","B":"Ekologik barqarorlik konsepsiyasi","C":"Energiya mustaqilligi konsepsiyasi","D":"Milliy xavfsizlik konsepsiyasi"},"answer":"D","explanation":"Doktrina O‘zbekiston Respublikasining Konstitutsiyasi, Milliy xavfsizlik konsepsiyasi va boshqa hujjatlarga asoslanadi. Ekologik, liberal yoki energiya konsepsiyalari keltirilmagan.","mnemonic":"Doktrina – milliy xavfsizlik.","id":884},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Tashqi siyosat","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Tashqi siyosiy faoliyat konsepsiyasi mudofaa rejasiga kiritilgan","requires_image":false,"question":"Doktrina tashqi siyosiy faoliyat konsepsiyasini qanday taʼsirda inobatga oladi?","options":{"A":"Yo‘nalishlarni iqtisodiy tahlil qiladi","B":"Ichki qonunchilikni o‘zgartiradi","C":"Madaniy merosni himoya qiladi","D":"Mamlakat mudofaasini rejalashtirishga yo‘naltiradi"},"answer":"D","explanation":"Tashqi siyosiy faoliyat konsepsiyasi mudofaa rejalashtirishga doir boshqa hujjatlarning asosiy qoidalarini inobatga oladi, ya'ni rejalashtirishga yo‘naltiradi.","mnemonic":"Tashqi siyosat – mudofaa rejasiga.","id":885},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomiy ta'zir turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizom Nizomi ... intizomiy ta'zir turlari, mansabdor shaxslarning ularni qo‘llash bo‘yicha huquqlari...","requires_image":false,"question":"Intizomiy ta'zir sifatida qaysi usul harbiy xodimning ijobiy natijalarini rag'batlantirish maqsadida qo‘llaniladi?","options":{"A":"Og‘ir jazolash","B":"Ishga bo‘ysunmaslik","C":"Muborak muomala va mukofot","D":"Yozma tanqid"},"answer":"C","explanation":"Muborak muomala va mukofot harbiy intizomda ijobiy natija ko‘rsatgan xodimlarni rag‘batlantirishning asosiy shaklidir. Jazolash, tanqid va bo‘ysunmaslik esa ta'zirning salbiy turlariga kiradi.","mnemonic":"Muborak – rag‘bat, jazoni tashlab","id":886},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomiy ta'zir turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizom Nizomi ... intizomiy ta'zir turlari, ...","requires_image":false,"question":"Quyidagi intizomiy ta'zir turlaridan qaysi biri harbiy xodimning qonuniy majburiyatini buzganida qo‘llanadi?","options":{"A":"Qayta tayyorlash","B":"Muborak","C":"Ko‘nikma oshirish","D":"Jazo chorasi"},"answer":"D","explanation":"Jazo chorasi qonuniy majburiyatni buzgan xodimga nisbatan qo‘llaniladigan intizomiy ta'zir turidir. Muborak va qayta tayyorlash rag‘bat va ta'lim uchun ishlatiladi, ko‘nikma oshirish esa o‘quv jarayoni.","mnemonic":"Buzgan – Jazo","id":887},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomiy ta'zir mexanizmi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizom Nizomi ... rag‘batlantirish va intizomiy ta'zirni qo‘llash bo‘yicha huquqlar...","requires_image":false,"question":"Intizomiy ta'zirni qo‘llashda, rag‘batlantirish mexanizmi qanday shaklda amalga oshiriladi?","options":{"A":"Muvaffaqiyatli xizmat uchun mukofot","B":"Majburiy tayyorlov kursi","C":"Xatarli vazifaga majbur qilish","D":"Uslubiy tanqid"},"answer":"A","explanation":"Rag‘batlantirish mexanizmi muvaffaqiyatli xizmat ko‘rsatgan xodimga mukofot berish orqali amalga oshiriladi. Xatarli vazifa, tanqid yoki majburiy kurslar bu jarayonning jazolash qismiga kiradi.","mnemonic":"Muvaffaqiyat – Mukofot","id":888},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomiy ta'zir turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizom Nizomi ... intizomiy ta'zir turlari, ...","requires_image":false,"question":"Quyidagi intizomiy ta'zir turlaridan qaysi biri xodimni qayta ijtimoiylashtirishga yo‘naltirilgan?","options":{"A":"Tashqi nazorat","B":"Ta'lim kursi","C":"Muborak muomala","D":"Jazo chorasi"},"answer":"B","explanation":"Ta'lim kursi intizomiy ta'zirning qayta ijtimoiylashtirish, xodimni me'yoriy xulq-atvorga o‘rgatish maqsadiga qaratilgan. Jazo chorasi jazolash, muborak rag‘bat, tashqi nazorat esa boshqa yo‘nalishlardir.","mnemonic":"Ta'lim – Qayta ijtimoiylashtirish","id":889},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomiy ta'zir vazifalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizom Nizomi ... intizomiy ta'zir turlari, ... rag'batlantirish va intizomiy ta'zirlarni qo‘llash bo‘yicha huquqlari...","requires_image":false,"question":"Intizomiy ta'zirning maqsadi qaysi jihatga ko‘proq yo‘nalgan?","options":{"A":"Texnik jihozlar yangilash","B":"Disiplinani mustahkamlash","C":"Xalqaro hamkorlikni oshirish","D":"Xavfsizlik protokollarini ishlab chiqish"},"answer":"B","explanation":"Intizomiy ta'zir harbiy xodimlarda disiplinani mustahkamlash, qoidalar buzilishini oldini olishga yo‘nalgan. Texnik yangilash, xavfsizlik protokollari va xalqaro hamkorlik esa boshqa yo‘nalishlar.","mnemonic":"Ta'zir – Disiplin","id":890},{"subject":"Harbiy ta'lim","topic":"Intizom Nizomi","subtopic":"Harbiy xodimlarning vazifalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Intizom Nizomi harbiy xodimdan davlat, harbiy va xizmat sirlarini qat'iy saqlashni talab qiladi","requires_image":false,"question":"Intizom Nizomi bo'yicha harbiy xodimdan qanday sirlarni saqlashi kutiladi?","options":{"A":"O'zbekiston Respublikasining tashqi siyosatini","B":"Shaxsiy mol-mulk va oila ma'lumotlarini","C":"Davlat, harbiy va xizmat sirlarini","D":"Xalqaro tashkilotlarning ichki hujjatlarini"},"answer":"C","explanation":"Nizomda harbiy xodimdan davlat, harbiy va xizmat sirlarini qat'iy saqlashi talab qilinadi. B. shaxsiy ma'lumotlar, C. tashqi siyosat, D. xalqaro hujjatlar talabga kirmaydi.","mnemonic":"Harbiy sir – davlat + xizmat","id":891},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Qonuniy manbalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xalqaro insonparvarlik huquqining manbalari","requires_image":false,"question":"Quyidagi hujjatlardan qaysi biri xalqaro insonparvarlik huquqining asosiy manbasi hisoblanadi?","options":{"A":"Jeneva konvensiyalari","B":"Parij Deklaratsiyasi","C":"BMT Statuti","D":"NATO shartnomalari"},"answer":"A","explanation":"Jeneva konvensiyalari insonparvarlik huquqining asosiy hujjatlari. BMT Statuti, NATO shartnomalari va Parij Deklaratsiyasi boshqa yo‘nalishlarda ishlatiladi.","mnemonic":"Jeneva – insonparvarlikning poytaxti","id":892},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Umumiy tamoyillar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xalqaro insonparvarlik huquqining bir-biri bilan jips bog‘langan sohalari","requires_image":false,"question":"Quyidagi tamoyillardan qaysi biri harbiy zaruriyatga qarshi bo‘ladi?","options":{"A":"Insonparvarlik","B":"Harbiy maqsadlar","C":"Qurol tanlovi","D":"Strategik nazorat"},"answer":"A","explanation":"Insonparvarlik tamoyili harbiy zaruriyatga zid bo‘lishi mumkin, chunki u inson huquqlarini himoya qiladi. Qurol tanlovi, harbiy maqsadlar va strategik nazorat zaruriyatga mos keladi.","mnemonic":"Insonparvarlik – zaruriyatga qarshi","id":893},{"subject":"Harbiy ta'lim","topic":"Bo'lim 46","subtopic":"Asosiy tamoyillar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Asosiy tamoyillar: harbiy zaruriyat, insonparvarlik, mutanosiblik, kombatantlar farqlash","requires_image":false,"question":"Qaysi tamoyil \"urush keltiradigan azob-uqubatlarni imkon qadar cheklash\"ni maqsad qiladi?","options":{"A":"Insonparvarlik","B":"Harbiy zaruriyat","C":"Kombatantlar farqlash","D":"Mutanosiblik"},"answer":"A","explanation":"Insonparvarlik tamoyili urushda qilingan zararni kamaytirishga qaratilgan. Harbiy zaruriyat harakatni asoslash, kombatant farqlash va mutanosiblik boshqa tamoyillarni tasvirlaydi.","mnemonic":"Insonparvarlik – azobni kamaytir.","id":894},{"subject":"Harbiy ta'lim","topic":"Bo'lim 46","subtopic":"Jeneva konvensiyalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"IV konvensiya – \"Urush vaqtida tinch aholini himoya qilish\"","requires_image":false,"question":"Jeneva konvensiyalari ichida tinch aholini himoya qilish bo'yicha qaysi konvensiya mavjud?","options":{"A":"III konvensiya","B":"II konvensiya","C":"IV konvensiya","D":"I konvensiya"},"answer":"C","explanation":"IV konvensiya maxsus tinch aholini himoya qilishga qaratilgan. II konvensiya dengizdagi yaradorlarga, III konvensiya asirlar, I konvensiya yarador va bemorlarga tegishli.","mnemonic":"IV – tinch aholi.","id":895},{"subject":"Harbiy ta'lim","topic":"Bo'lim 46","subtopic":"Xalqaro protokollar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Xalqaro insonparvarlik huquqi to'rt guruhga bo'linuvchi protokollardan iborat: 1-Qurollarni cheklash, 2-Qurollarni taqiqlash, 3-Inshootlarni himoya qilish, 4-Hurisdiksiya","requires_image":false,"question":"Xalqaro insonparvarlik huquqining qaysi protokoli \"Inshootlarni himoya qilish\" ga bag'ishlangan?","options":{"A":"3-protokol","B":"4-protokol","C":"2-protokol","D":"1-protokol"},"answer":"A","explanation":"3-protokol inshootlarni himoya qilishga qaratilgan. 1-protokol qurollarni cheklash, 2-protokol qurollarni taqiqlash, 4-protokol hurisdiksiya (sud qilish) bilan bog'liq.","mnemonic":"3 – inshoot.","id":896},{"subject":"Harbiy ta'lim","topic":"Qurolli kuchlar","subtopic":"Vazifalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Tinçlik davrida qurolli kuchlarning asosiy vazifalari","requires_image":false,"question":"Tinçlik davrida qurolli kuchlarning bir vazifasi nima?","options":{"A":"Mahkama qurilishini amalga oshirish","B":"Harbiy-siyosiy vaziyatni tahlil qilish","C":"Yadro qurollarini joylashtirish","D":"Frontdagi jangni boshqarish"},"answer":"B","explanation":"Tinçlik davrida qurolli kuchlar harbiy-siyosiy vaziyatni doimiy tahlil va prognoz qilish bilan shug'ullanadi; boshqa variantlar harbiy amalda qo'llaniladi.","mnemonic":"Tinçlikda tahlil, jangda front","id":897},{"subject":"Harbiy ta'lim","topic":"Qurolli kuchlar","subtopic":"Harbiy okruglar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Dars davomida qurolli kuchlar, qo‘shin turlari, harbiy okruglar haqida ma'lumotga ega bo‘lasiz","requires_image":false,"question":"Harbiy okrug nima uchun tashkil etiladi?","options":{"A":"Mahalliy aholini harbiy mashg'ulotlarga jalb qilish uchun","B":"Mavjud hududda harbiy operatsiyalarni muvofiqlashtirish uchun","C":"Tashqi savdo yo‘llarini nazorat qilish uchun","D":"Madaniy tadbirlarni o'tkazish uchun"},"answer":"B","explanation":"Harbiy okrug hududdagi harbiy operatsiyalarni muvofiqlashtirish, nazorat va boshqarish vazifasini bajaradi; boshqa variantlar uning maqsadi emas.","mnemonic":"Okrug – operatsiyalarni boshqaradi","id":898},{"subject":"Harbiy ta'lim","topic":"Qurolli kuchlar","subtopic":"Xavfsizlik tizimi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xavfli kuchlarni tutib turuvchi qurilma va inshootlar ro‘yxati","requires_image":false,"question":"Quyidagi inshootlardan qaysi biri xavfli kuchlarni tutib turuvchi vosita hisoblanadi?","options":{"A":"To‘g‘on","B":"Kutubxona","C":"Tibbiyot markazi","D":"Maktab"},"answer":"A","explanation":"To‘g‘on – xavfli kuchlarni (masalan, yadro, kimyoviy) tutib turuvchi muhim inshoot; boshqa inshootlar bu vazifani bajarmaydi.","mnemonic":"To‘g‘on – xavfni ushlab turadi","id":899},{"subject":"Harbiy ta'lim","topic":"Qurolli kuchlar","subtopic":"Militaristik tasvir","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Oq-havo rangli bitta katta qalqon umumiy himoya timsoli, uchta kichikroq qalqon alohida himoya timsoli","requires_image":false,"question":"Qalqon tasvirida katta qalqon nima ifodalaydi?","options":{"A":"Umumiy himoyani","B":"Tashqi savdo yo‘llarini","C":"Individual qurolni","D":"Madaniy merosni"},"answer":"A","explanation":"Katta oq-havo rangli qalqon umumiy himoya timsoli sifatida tasvirlangan; boshqa variantlar tasvirga mos kelmaydi.","mnemonic":"Katta qalqon – umumiy himoya","id":900},{"subject":"Harbiy ta'lim","topic":"Qurolli kuchlar","subtopic":"Harbiy xizmat turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolli kuchlar tarkibiga Milliy gvardiya va Davlat xavfsizlik xizmati kiradi","requires_image":false,"question":"Qurolli kuchlar tarkibida Milliy gvardiya qanday vazifani bajaradi?","options":{"A":"Davlat mudofaasini mustahkamlash","B":"O‘qituvchilarni tayyorlash","C":"Sport musobaqalarini tashkil etish","D":"Mahalliy savdo nazorati"},"answer":"A","explanation":"Milliy gvardiya davlat mudofaasini mustahkamlash, ichki xavfsizlikni ta'minlash vazifasini bajaradi; boshqa variantlar uning funksiyasiga to'g'ri kelmaydi.","mnemonic":"Gvardiya – mudofaa himoyachisi","id":901},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar","subtopic":"Strategik vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qurolli Kuchlarni strategik jihatdan yoyilishga ta’minlash vazifasi.","requires_image":false,"question":"Qurolli Kuchlarning strategik yoyilishini ta’minlash asosan qaysi vazifaga tegishli?","options":{"A":"Jangovar shaylikni saqlash","B":"Hududiy mudofaa tizimlarini yoyish","C":"Harbiy infratuzilmani rivojlantirish","D":"Favqulodda holat rejimini saqlab turish"},"answer":"B","explanation":"Strategik yoyish hududiy mudofaa va fuqaroni muhofaza tizimlarini yoyish bilan bog‘liq. B va C boshqa vazifalar, D esa infratuzilma rivojlanishi bilan aloqador.","mnemonic":"Strategik yoy – hududiy mudofaa.","id":902},{"subject":"Harbiy ta'lim","topic":"Harbiy okruglar","subtopic":"Harbiy okruglar ro‘yxati","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda harbiy okruglar ro‘yxati (5 ta) sanab o'tilgan","requires_image":false,"question":"Quyidagi ro‘yxatdan harbiy okrug bo‘lmagan birini tanlang:","options":{"A":"Janubiy-g‘arbiy maxsus harbiy okrug","B":"Markaziy harbiy okrug","C":"Toshkent harbiy okrug","D":"Orol dengizi"},"answer":"D","explanation":"Orol dengizi – geografik ob'ekt, okrug emas. Boshqa uchlari okruglar ro‘yxatida mavjud.","mnemonic":"Dengiz – okrug emas","id":903},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Fuqaro muhofazasi mazmuni","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda fuqaroni harbiy harakatlar oqibatida yuzaga keladigan xavflardan himoya qilish tizimi","requires_image":false,"question":"Fuqaro muhofazasi tizimiga qaysi element kiritilmaydi?","options":{"A":"Yong‘in xavfsizligi","B":"Mahalliy politsiya","C":"Xalqaro savdo organlari","D":"Tibbiy yordam xizmatlari"},"answer":"C","explanation":"Fuqaroni himoya qilish tizimida asosan xavfsizlik, yong‘in, tibbiy yordam kiritilgan, lekin xalqaro savdo organlari unga tegishli emas.","mnemonic":"Xavfsizlik – yong‘in – tibbiyot, savdo yo‘q","id":904},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"«Aholini, moddiy va madaniy boyliklarni xavfsiz joylarga evakuatsiya qilish» vazifasi qanday maqsadga xizmat qiladi?","options":{"A":"Xavfli hududdan aholini xavfsiz joyga ko‘chirish","B":"Ob'ektlarni harbiy harakatga tayyorlash","C":"Radiatsion monitoringini amalga oshirish","D":"Boshqaruv va aloqa tizimlarini mustahkamlash"},"answer":"A","explanation":"Evakuatsiya vazifasi xavfli hududda saqlanayotgan aholini himoya qilish va ularni xavfsiz joyga ko‘chirishni anglatadi.","mnemonic":"Evakuatsiya – xavfdan qochish","id":905},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi organlari qanday vazifani bajaradi: \"boshqaruv, xabar berish va aloqa tizimlarini tashkil qilish\"?","options":{"A":"Ularni faqat evakuatsiya paytida ishlatish","B":"Ularni doimiy shay holatda saqlash","C":"Ularni faqat tinchlik davrida qo‘llash","D":"Ularni faqat harbiy harakat oldidan tayyorlash"},"answer":"B","explanation":"Bu vazifa alohida doimiy shay holatda saqlash kerakligi belgilangan.","mnemonic":"Doimiy shay – aloqa mustahkam","id":906},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi organlari radiatsion, kimyoviy va biologik vaziyatni qanday nazorat qiladi?","options":{"A":"Laboratoriya tekshiruvi orqali","B":"Ob'ektlarni himoya qilish orqali","C":"Aholini evakuatsiya qilish orqali","D":"Xabar berish tizimi bilan"},"answer":"A","explanation":"Bu vazifa maxsus laboratoriýa nazorati bilan amalga oshiriladi, degan gap bor.","mnemonic":"Laboratoriya – xavfsizlik nazorati","id":907},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi organlari bir vaqtning o‘zida uchta asosiy vazifani bajarishi zarur. Quyidagilardan qaysi to‘g‘ri to‘plam?","options":{"A":"Aholini evakuatsiya qilish, ob'ektlarni himoya qilish, kommunikatsiyani saqlash","B":"Radiatsion monitoring, jamoat tartibini yo‘qotish, material ta'minoti","C":"Xalq xo‘jaligi barqarorligini ta’minlash, faqat laboratoriya nazorati, faqat xavf tahlili","D":"Yuqoriga ko‘tarilgan hududni nazorat qilish, faqat evakuatsiya, faqat aloqa"},"answer":"A","explanation":"Ko‘rsatilgan asosiy vazifalar evakuatsiya, ob'ekt himoyasi va aloqa tizimlarini doimiy holatda saqlash.","mnemonic":"Evakuatsiya, Himoya, Aloqa – uchlamchi","id":908},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Umumiy tushunchalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi organlari tomonidan amalga oshiriladigan “qutqaruv va boshqa kechiktirib bo‘lmaydigan ishlar” qanday vazifa?","options":{"A":"Radiatsion monitoringni o‘tkazish","B":"Xavfli hududni harbiy nazoratga olish","C":"Favqulodda vaziyatda tezkor yordam ko‘rsatish","D":"Ob'ektlarni texnik ta’mirlash"},"answer":"C","explanation":"Kechiktirib bo‘lmas ishlar qutqaruv, ya'ni favqulodda vaziyatda tezkor yordam ko‘rsatish deb belgilangan.","mnemonic":"Kechiktirib bo‘lmaydi – qutqarish","id":909},{"subject":"Harbiy ta'lim","topic":"Halokat turlari","subtopic":"Kimyoviy xavfli obyektlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Kimyoviy xavfli obyektlardagi avariyalar bo‘limida: \"zaharli moddalarning avariya holatida otilib chiqishi, inson, hayvon va oʻsimliklarning ommaviy shikastlanishiga olib kelishi\"","requires_image":false,"question":"Kimyoviy xavfli obyektdagi avariyaning asosiy xavfi nima?","options":{"A":"Tegishli uskunaning yorilishi","B":"Yong‘in tarqalishi","C":"Zaharli moddalar otilib chiqishi","D":"Elektr uzilishlari"},"answer":"C","explanation":"Kimyoviy obyektlarda avariyalar asosan zararli moddalarning otilib chiqishi bilan tavsiflanadi, boshqa variantlar keltirilmagan.","mnemonic":"Kimyo – otilgan zahar.","id":910},{"subject":"Harbiy ta'lim","topic":"Halokat turlari","subtopic":"Aviahalokatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Transport avariyalari va halokatlari bo‘limida: \"aviahalokatlar ... havo kemalarining to‘liq parchalanishiga yoki qattiq shikastlanishiga olib keladigan\"","requires_image":false,"question":"Aviakuzog‘li holatda, qaysi chorani birinchi bo‘lib amalga oshirish kerak?","options":{"A":"Yong‘in o‘chirish vositalarini tayyorlash","B":"Qidiruv va avariya-qidiruv ishlarini boshlash","C":"Talabalar uchun evakuatsiya rejasini tuzish","D":"Zaxira yonilg‘ini yetkazib berish"},"answer":"B","explanation":"Aviahalokatda qidiruv va avariya-qidiruv ishlari birinchi bosqich sifatida keltirilgan, boshqa variantlar aviahalokatga maxsus emas.","mnemonic":"Aviahalokatda – qidiruv birinchi.","id":911},{"subject":"Harbiy ta'lim","topic":"Halokat turlari","subtopic":"Metropoliten halokatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Transport avariyalari va halokatlari bo‘limida: \"metropoliten bekatlaridagi va tunnellaridagi halokatlar, avariyalar, yong‘inlar\"","requires_image":false,"question":"Metropoliten tunnellarida yuz beradigan avariyaga qarshi qaysi amaliy choralar qo‘llaniladi?","options":{"A":"Avtomatik qurolni o‘rnatish","B":"Uchish uchastkalarini kengaytirish","C":"Quvvat manbaini yo‘qotish","D":"Tezkor evakuatsiya yo‘llarini belgilash"},"answer":"D","explanation":"Metropoliten tunnellarida avariyalar va yong‘inlar haqida so‘z boradi, shuning uchun tezkor evakuatsiya yo‘llari birinchi choradir; boshqa variantlar mos kelmaydi.","mnemonic":"Tunel – evakuatsiya tez.","id":912},{"subject":"Harbiy ta'lim","topic":"Halokat turlari","subtopic":"Kemtar birikmalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Transport avariyalari va halokatlari bo‘limida: \"magistral quvurlardagi avariyalar, gaz, neft va neft mahsulotlarining avariya holatida otilib chiqishi\"","requires_image":false,"question":"Magistral gaz quvuri avariyasida birinchi navbatda qaysi xavfsizlik chorasi ko‘riladi?","options":{"A":"Kuzovni yuvish","B":"Uchuvchi dronlarni yoyish","C":"Yo‘lovchilarni o‘qitish","D":"Gazni avtomatik blokirovka qilish"},"answer":"D","explanation":"Gaz quvuri avariyasida gazning otilib chiqishi muammosi ta’kidlangan, shuning uchun avtomatik blokirovka birinchi choradir; boshqa variantlar mos emas.","mnemonic":"Gaz quvuri – blokirovka birinchi.","id":913},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Avariya turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda sanab o'tilgan favqulodda vaziyatlar – avariya, yong'in, portlashlar","requires_image":false,"question":"Quyidagi holatlardan qaysi biri favqulodda vaziyatlar hududida sanalgan avariyalar tarkibiga kiradi?","options":{"A":"Yomg'irli ob-havo","B":"Mehnat bozorining torayishi","C":"Transport vositasining texnik xizmat ko'rsatishi","D":"Gaz va chang portlashi"},"answer":"D","explanation":"Gaz va chang portlashi kon-ruda sanoatida avariya va yong'in sifatida ko'rsatilgan. B boshqa iqlim hodisasi, C iqtisodiy masala, D texnik xizmat avariyaga olib kelmaydi.","mnemonic":"Gaz portlashi – xavfli avariya.","id":914},{"subject":"Harbiy ta'lim","topic":"Energetika tizimlari","subtopic":"Avariya manbalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda GES, GRES, TETS, tuman issiqlik markazlari keltirilgan","requires_image":false,"question":"Quyidagi ob'ektlardan qaysi biri energiya ta'minotiga avariya tufayli uzilish keltirib chiqarishi mumkin?","options":{"A":"Radioaktiv chiqindi ombori","B":"Suv quvuri","C":"GES","D":"Sanitar tozalash inshooti"},"answer":"C","explanation":"GES (gaz elektr stansiyasi) energiya tizimlarining bir qismi sifatida avariyaga olib kelishi ko'rsatilgan. B va C suv va sanitariya tizimiga tegishli, D radioaktiv xavfga oid, lekin energiya uzilishiga emas.","mnemonic":"GES – energiya uzilishining sababi.","id":915},{"subject":"Harbiy ta'lim","topic":"Kommunal tizimlar","subtopic":"Avariya turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda gaz, suv, kanalizatsiya obyektlarida avariyalar haqida aytilgan","requires_image":false,"question":"Gaz va suv quvurlari avariyasi asosan qaysi xavfga olib keladi?","options":{"A":"Axborot texnologiyalarining ishlamasligi","B":"Transport yo‘llarining yopilishi","C":"Aholi hayot faoliyatining buzilishi","D":"O‘rmon yong‘inlari"},"answer":"C","explanation":"Gaz va suv quvurlari avariyasi aholi hayoti va sog‘lig‘iga xavf tug‘diradi, boshqa variantlar manbada ko‘rsatilmagan.","mnemonic":"Gaz‑suv – hayot xavfi.","id":916},{"subject":"Harbiy ta'lim","topic":"Avariya turlari","subtopic":"Gaz portlashi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda gaz va chang portlashi kon-ruda sanoatida avariya deb aytilgan","requires_image":false,"question":"Gaz portlashi avariyasida asosan qaysi xavf yo‘qoladi?","options":{"A":"Elektr uzilishi","B":"Yirik suv toshqini","C":"Yong‘in va portlash","D":"Yer silkinishi"},"answer":"C","explanation":"Gaz portlashi yong‘in va portlashga olib keladi, boshqa variantlar manbada ko‘rsatilmagan.","mnemonic":"Gaz – yong‘in, portlash.","id":917},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Gidrometeorologik hodisalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Gidrometeorologik xavfli hodisalar: suv toshqinlari, suv to‘planishi, sellar; qor ko‘chkilari, kuchli shamollar (dovullar), jala","requires_image":false,"question":"Kuchli shamollar (dovullar) qaysi turdagi favqulodda vaziyatga kiradi?","options":{"A":"Epidemiologik xavfli hodisa","B":"Gidrometeorologik xavfli hodisa","C":"Geologik xavfli hodisa","D":"Ekologik xavfli hodisa"},"answer":"B","explanation":"Dovullar – kuchli shamollar, gidrometeorologik (ob-havo) hodisalarga kiradi. Geologik, epidemiologik yoki ekologik bo‘lishi mumkin emas.","mnemonic":"Dovul → Shamol → Gidro","id":918},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik xavfli hodisalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Geologik xavfli hodisalar: insonlarning o‘limiga sabab bo‘lganda, ma‘muriy‑ishlab chiqarish binolari, texnologik asbob‑uskunalar, energiya ta’minoti, transport kommunikatsiyalari va infratuzilma tizimlari, ijtimoiy yo‘nalishdagi binolar va uy‑joylarning turli darajadagi buzilishiga olib keladi","requires_image":false,"question":"Geologik xavfli hodisa natijasida qaysi turdagi infratuzilma eng ko‘p zarar ko‘radi?","options":{"A":"Sog‘liqni saqlash muassasalari","B":"Ta'lim muassasalari","C":"Transport kommunikatsiyalari","D":"Madaniyat ob'ektlari"},"answer":"C","explanation":"Geologik hodisalar (zilzilalar, yer siljishi) transport yo‘llari, ko‘priklar, temir yo‘llarni eng ko‘p shikastlaydi; sog‘liq, ta'lim, madaniyat ob'ektlari ham zarar ko‘rishi mumkin, lekin asosiy ta'sir transportga yo‘naltirilgan.","mnemonic":"Yer → Yo‘llar","id":919},{"subject":"Harbiy ta'lim","topic":"Bo'lim 56","subtopic":"Epidemiologik favqulodda vaziyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Favqulodd 1) kesmalar; 2) qaytaruvchi bo‘rtma; 3) bo‘rtiklar; 4) yo‘naltiruvchi bo‘rtma; 5) biriktirgich; 6) bo‘ylama oraliq; 7) ko‘ndalang oraliq; 8) qistirgich; 9) tepki halqasi; 10) to‘pponcha dastasi; 11) o‘qdon; 12) birlashtiruvchi vtulka uchun teshik; 13) o‘qdon fiksatori bo‘rtiklari uchun teshik.","requires_image":false,"question":"AK-74 stvol qutisida \"kesmalar\" qanday vazifani bajaradi?","options":{"A":"O‘qdonni tutib turadi","B":"Stvol qutisini zatvor bilan biriktiradi","C":"Gaz kamerasi gazini yo‘naltiradi","D":"To‘pponcha dastasini yopadi"},"answer":"B","explanation":"Kesmalar stvol qutisini zatvor bilan biriktirishga xizmat qiladi. B bandi o‘qdon tuzilishi, C bandi gaz kamerasi funktsiyasi, D bandi to‘pponcha dastasining yopilishiga tegishli emas.","mnemonic":"Kesma=Zatvorga bog‘lanish","id":968},{"subject":"Harbiy ta'lim","topic":"AK-74 qurilmasi","subtopic":"Avtomat qo‘ndog‘i","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Avtomat qo‘ndog‘i: 1) avtomat tasmasi uchun halqa; 2) tozalash anjomlari solinadigan penal uchun uya; 3) yelkaga tirkaladigan qism; 4) uya qopqog‘i.","requires_image":false,"question":"\"Avtomat tasmasi uchun halqa\"ning asosiy roli nima?","options":{"A":"Stvolni yopadi","B":"Gaz oqimini kuchaytiradi","C":"O‘qni saqlaydi","D":"Tasmani joyida ushlab turadi"},"answer":"D","explanation":"Halqa avtomat tasmasini joyida ushlab turadi; boshqa variantlar tasma funksiyasiga mos kelmaydi.","mnemonic":"Halqa = Tasmani tutadi","id":969},{"subject":"Harbiy ta'lim","topic":"Qurol qismlari","subtopic":"Qurolning uchi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolning uchi (tormoz‑kompensator) tasviri: 1) uchki qismi; 2) tuynuklari; 3) yorma; 4) so‘ndiruvchi tirqishlar; 5) biriktirgich uchun kesma; 6) aylanasiga bukilgan qismi; 7) ichki rezba.","requires_image":false,"question":"Qurolning uchki qismi qaysi raqamda tasvirlangan?","options":{"A":"5","B":"7","C":"1","D":"3"},"answer":"C","explanation":"Rasmdagi tavsifda ‘1) uchki qismi’ deb belgilangan, shuning uchun to‘g‘ri javob 1‑raqam.","mnemonic":"Uchki - birinchi.","id":970},{"subject":"Harbiy ta'lim","topic":"Gaz tizimi","subtopic":"Gaz trubkasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Gaz trubkasi (stvol qoplamasi bilan birgalikda): 1) gaz trubkasi; 2) gaz porsheni uchun yo‘naltiruvchi qovurg‘alar; 3) oldindagi biriktirgich; 4) stvolning ustki qoplamasi.","requires_image":false,"question":"Gaz trubkasi tizimida gaz porsheni yo‘naltiruvchi element qaysi raqamda ko‘rsatilgan?","options":{"A":"1","B":"3","C":"4","D":"2"},"answer":"D","explanation":"Rasmdagi tavsifda ‘2) gaz porsheni uchun yo‘naltiruvchi qovurg‘alar’ deb berilgan, shuning uchun javob 2‑raqam.","mnemonic":"Gaz yo‘naltiruvchi – ikkinchi.","id":971},{"subject":"Harbiy ta'lim","topic":"Stvol qoplamasi","subtopic":"Stvolosti dastasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Stvolosti qoplamasi (dastasi): 1) barmoqlar uchun joy; 2) bo‘rtma; 3) yassi prujina; 4) shompol uchun teshik.","requires_image":false,"question":"Stvolosti dastasida barmoqlarni himoya qilish uchun mo‘ljallangan element qaysi?","options":{"A":"barmoqlar uchun joy","B":"shompol uchun teshik","C":"bo‘rtma","D":"yassi prujina"},"answer":"A","explanation":"Rasmdagi tavsifda ‘1) barmoqlar uchun joy’ deb ko‘rsatilgan, shu sabab to‘g‘ri javob 1‑raqam.","mnemonic":"Birinchi – barmoq.","id":972},{"subject":"Harbiy ta'lim","topic":"Qurol tizimi","subtopic":"Patron yo‘naltirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Zatvor patronni patrondonga yuborish, stvol kanalini yopish, kapsulni ezish va patrondan gilzani sug‘urib olish uchun xizmat qiladi.","requires_image":false,"question":"Zatvorning qaysi funksiyasi patronni patrondonga yuborishni ta’minlaydi?","options":{"A":"Patronni patrondonga yuborish","B":"Kapsulni ezish","C":"Stvol kanalini yopish","D":"Gilzani sug‘urib olish"},"answer":"A","explanation":"‘Zatvor patronni patrondonga yuborish’ deb aniq ko‘rsatilgan, qolgan funksiyalar boshqa bandlarga tegishli.","mnemonic":"Yuborish – zatvorning birinchi vazifasi.","id":973},{"subject":"Harbiy ta'lum","topic":"Qurilma elementlari","subtopic":"O‘qdon tarkibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O‘qdon: 1) korpus; 2) qopqoq; 3) mahkamlovchi planka; 4) prujina; 5) yuboruvchi; 6) tayanch bo‘rtmasi; 7) ilgich.","requires_image":false,"question":"O‘qdonning yuboruvchi qismi qaysi raqamda ko‘rsatilgan?","options":{"A":"5","B":"2","C":"4","D":"7"},"answer":"A","explanation":"‘5) yuboruvchi’ – o‘qdonning patronni yuboruvchi elementi. Boshqa raqamlar boshqa qismlarga tegishli.","mnemonic":"Yuboruvchi – beshinchi.","id":974},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Zatvor va patron muammolari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Patron tiqildi. Patron o‘qi bilan stvol kesmasida tiqilib, harakatchan qism va mexanizmlar deyarli to‘xtab qoldi.","requires_image":false,"question":"Qurolda patron o‘qi stvol kesmasida tiqilib, mexanizmlar to‘xtashi qaysi nosozlikka ishora qiladi?","options":{"A":"Patron tiqilishi","B":"O‘qdon ifloslanishi","C":"Stvol tortqi nosozligi","D":"Zatvor jing‘iligi"},"answer":"A","explanation":"Patron tiqilishi mexanizmlarning deyarli to‘xtashiga olib keladi. B boshqa holat, C tortqiga oid, D umumiy zatvor muammosi.","mnemonic":"Tiqilgan patron – mexanizm to‘xtar","id":975},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Zatvorni tiklash usullari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Zatvor ramasining dastasidan tutib turgan holda tiqilib qolgan patron chiqarib olinsin va otish davom ettirilsin.","requires_image":false,"question":"Zatvorni qo‘l bilan ushlab, tiqilgan patronni qanday chiqariladi?","options":{"A":"Stvolni ushlab, patronni chiqarish","B":"Tortqini demontaj qilish","C":"Patronni bosib chiqarish","D":"Zatvorni ortga tortish"},"answer":"A","explanation":"Zatvorni ushlab, patronni chiqarish tavsiya qilingan. B ortga tortish, C demontaj, D bosib chiqarish boshqa usullar.","mnemonic":"Ushlab, patronni chiqar","id":976},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Zatvor va gilza muammolari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Gilza tiqilishi. Gilza patronda, navbatdagi patron esa unga tiralib turibdi.","requires_image":false,"question":"Gilza tiqilgan holatda navbatdagi patron qanday holatda bo‘ladi?","options":{"A":"Zatvordan ajraladi","B":"Unga tiralib turadi","C":"O‘qdan chiqadi","D":"Qolib ketadi"},"answer":"B","explanation":"Gilza tiqilganda navbatdagi patron unga tiralib turadi deyilgan. Qolgan variantlar noto‘g‘ri.","mnemonic":"Gilza tiralgan patron","id":977},{"subject":"Harbiy ta'lim","topic":"Qurol tozalash anjomlari","subtopic":"Anjomlar ro'yxati","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda anjomlar ro'yxati keltirilgan (1-rasm).","requires_image":false,"question":"Quyidagi qaysi anjom qurolni moylash uchun mo'ljallangan?","options":{"A":"Shompol","B":"Penal","C":"Moydon","D":"Chiqaruvchi"},"answer":"C","explanation":"Moydon – qurolning harakatli qismlarini moylash uchun mo'ljallangan anjom. Shompol – tozalash, penal – qismlarni ajratish, chiqaruvchi – patronlarni chiqarish uchun ishlatiladi.","mnemonic":"Moydon moylaydi, shompol tozalaydi.","id":978},{"subject":"Harbiy ta'lim","topic":"Gilza ishlash tartibi","subtopic":"Gilzaning joylashuvi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda gilza tubi va stvol qutisi haqida ma'lumot berilgan.","requires_image":false,"question":"Gilza stvol qutisidan qanday holatda qoladi?","options":{"A":"Stvol ustida joylashadi","B":"Stvol qutisidan uloqtiriladi","C":"Ichida, stvol oldida","D":"Stvol orqasida saqlanadi"},"answer":"C","explanation":"Gilza stvol qutisidan uloqtirilmay, uning ichida, zatvor oldida qolishi yoki qayta o‘qdoniga yuborilishi ko'rsatilgan.","mnemonic":"Gilza ichida, zatvor oldida.","id":979},{"subject":"Harbiy ta'lim","topic":"Qurol tozalash anjomlari","subtopic":"Anjomlar vazifalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda anjomlar ro'yxati va ularning vazifalari tasvirlangan.","requires_image":false,"question":"Quyidagi qaysi anjom patronlarni o‘qdon ichiga joylashtirishda ishlatiladi?","options":{"A":"Artkich","B":"Shompol","C":"Oboyma","D":"Qopqoq"},"answer":"C","explanation":"Oboyma patronlarni o‘qdon ichiga joylashtirishda qo‘llaniladi; artkich va shompol – qismlarni ajratish va tozalash uchun, qopqoq – o‘qdon qopqog‘ini yopish uchun.","mnemonic":"Oboyma o‘qdonni to‘ldiradi.","id":980},{"subject":"Harbiy ta'lim","topic":"Qurolni tozalash tartibi","subtopic":"Gaz yo‘llari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda gaz yo‘llari tozalanishi va moylanishi tavsifi berilgan.","requires_image":false,"question":"Gaz yo‘llari tozalanib, keyin qanday amal bajariladi?","options":{"A":"Ishqalanuvchi qismlar moylanadi","B":"Gilza uloqtiriladi","C":"Patronlar o‘qdon ichiga joylashtiriladi","D":"Uloqtirgich almashtiriladi"},"answer":"A","explanation":"Gaz yo‘llari tozalanib, ishqalanuvchi qismlar moylanishi kerakligi aytilgan; boshqa variantlar boshqa bosqichlarga tegishli.","mnemonic":"Tozalash, keyin moylash.","id":981},{"subject":"Harbiy ta'lim","topic":"O‘qdonni to‘ldirish","subtopic":"Patron joylashuvi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda patronlarni o‘qdon ichiga joylashtirish usuli tasvirlangan.","requires_image":false,"question":"Patronlarni o‘qdon ichiga joylashtirishda birinchi qadam nima?","options":{"A":"O‘qdonni chap qo‘lga ushlash","B":"Patronlarni oboymaga qo‘shish","C":"O‘tkazgichni o‘rnatish","D":"Patronlarni yuqoriga yo‘naltirish"},"answer":"A","explanation":"Patronlarni joylashtirish birinchi bosqichda o‘qdon chap qo‘lga ushlanadi, keyin o‘tkazgichga biriktiriladi; boshqa variantlar keyingi bosqichlarga taalluqli.","mnemonic":"Chap qo‘l – birinchi qadam.","id":982},{"subject":"Harbiy ta'lim","topic":"Gilza nosozligi","subtopic":"Nosozlik holati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda gilza nosozligi bo‘lganda qurolni tamirlash ustaxonasiga topshirish tavsiya qilingan.","requires_image":false,"question":"Gilza nosozligi aniqlansa, keyingi amaliy qadam nima?","options":{"A":"Gilzani qayta o‘qdoniga yuborish","B":"Patronlarni tozalash","C":"Gaz yo‘llarini qayta tekshirish","D":"Qurolni tamirlash ustaxonasiga topshirish"},"answer":"D","explanation":"Gilza nosozligi bo‘lsa qurolni tamirlash ustaxonasiga topshirish kerakligi ko‘rsatilgan; boshqa variantlar boshqa nosozliklarga tegishli.","mnemonic":"Nosoz gilza – ustaxona.","id":983},{"subject":"Harbiy ta'lim","topic":"Qurolni tozalash jarayoni","subtopic":"Ishqalanuvchi qismlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda ishqalanuvchi qismlar va gaz ramka haqida ma'lumot bor.","requires_image":false,"question":"Ishqalanuvchi qismlar tozalanib, keyin nima bajariladi?","options":{"A":"Patronlarga joylashtiriladi","B":"Uloqtiriladi","C":"Moylanadi","D":"Gaz ramka almashtiriladi"},"answer":"C","explanation":"Ishqalanuvchi qismlar tozalanib, moylanishi kerakligi ko‘rsatilgan; boshqa variantlar boshqa bosqichlarga tegishli.","mnemonic":"Tozalash – moylash.","id":984},{"subject":"Harbiy ta'lim","topic":"Qurolni tayyorlash","subtopic":"Gaz yo‘llari nosozligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda gaz yo‘llari nosozligi holati tasvirlangan.","requires_image":false,"question":"Gaz yo‘llari nosoz bo‘lsa, qanday choralar ko‘riladi?","options":{"A":"Gilza uloqtiriladi","B":"Qurol tamirlash ust
