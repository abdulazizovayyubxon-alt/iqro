manga o‘q tutish\n3. Jang davomida otlarni boshqarish\n4. Natijani baholash","options":{"A":"2, 1, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"1, 2, 3, 4"},"answer":"D","explanation":"Qayd etilgan tartib: avvalo otlarni bellarga bog‘lash (1), keyin yayov holda dushmanga o‘q tutish (2), otlarni jang davomida boshqarish (3), oxirida natijani baholash (4).","mnemonic":"Bell‑o‘q‑boshqar‑baholash","id":1019},{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdining harbiy yurishlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Jaloliddin Manguberdi – vatanparvarlik va jasurlik","requires_image":false,"question":"Jaloliddin Manguberdi qaysi xususiyati bilan mashhur?","options":{"A":"Iqtisodiy islohotlari","B":"Matematik ilm-fani","C":"Din arbobligi","D":"Jasurligi va vatanparvarligi"},"answer":"D","explanation":"Uning jasurligi va vatanparvarligi dushmanga qarshi kurashda asosiy omil bo‘lganligi aytilgan.","mnemonic":"Jasur – vatanparvar","id":1020},{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdining harbiy yurishlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Jaloliddin Manguberdi 33 yillik umrining 11 yilini janglarda o‘tkazgan","requires_image":false,"question":"Jaloliddin Manguberdi harbiy faoliyatini qachonga qadar davom ettirgan?","options":{"A":"1220 yilga qadar","B":"1231 yilga qadar","C":"1215 yilga qadar","D":"1240 yilga qadar"},"answer":"B","explanation":"Uning hayoti 1198–1231 yillarga to‘g‘ri keladi, shuning uchun harbiy faoliyati 1231 yilga qadar davom etgan.","mnemonic":"Hayot – 1198‑1231","id":1021},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi tamoyillari: birinchi tamoyil – g'alabaga erishish uchun hamma kuchlarni shiddat bilan harakatlantirish","requires_image":false,"question":"Jaloliddin Manguberdi tamoyillaridan qaysi biri g'alabaga erishish uchun barcha kuchlarni shiddat bilan harakatlantirishni talab qiladi?","options":{"A":"Birinchi tamoyil","B":"To'rtinchi tamoyil","C":"Ikkinchi tamoyil","D":"Uchinchi tamoyil"},"answer":"A","explanation":"Birinchi tamoyil g'alabaga erishish uchun barcha kuchlarni shiddat bilan harakatlantirishni nazarda tutadi. Ikkinchi – hududlarni kuchsizlantirish, uchinchi – to'satdan zarba, to'rtinchi – tez natija olish.","mnemonic":"Birinchi – barcha kuch, g'alaba.","id":1022},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi ikkinchi darajali hududlarni kuchsizlantirsa ham, yirik kuchlarni bosh zarba berish yo'nalishlariga jamlashni ta'kidlagan","requires_image":false,"question":"Manguberdi qanday holatda ham yirik kuchlarni bosh zarba berish yo'nalishlariga jamlashni tavsiya qiladi?","options":{"A":"Ikkinchi darajali hududlar kuchsizlanayotganida","B":"Uchinchi bosqichda dushman zaiflashganda","C":"Yakuniy bosqichda qo'shinlar charchaganda","D":"Birinchi darajali hududlar to'liq egallanganida"},"answer":"A","explanation":"Ikkinchi darajali hududlarni kuchsizlantirsa ham, yirik kuchlarni bosh zarba berish yo'nalishlariga jamlash zarurati aytilgan. Boshqa variantlar matnda mavjud emas.","mnemonic":"Kuchsiz hudud – yirik zarba.","id":1023},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi to'satdan zarba berish tamoyili: \"to'satdan zarba berish\"","requires_image":false,"question":"Manguberdi taktikalarida \"to'satdan zarba berish\" tamoyili qaysi holatda qo‘llanadi?","options":{"A":"Dushman kuchli mudofaqa qurganida","B":"Dushmanga kutilmagan paytda hujum qilishda","C":"Birlamchi harakatdan keyin orqaga tortishda","D":"Tashqi yordamchi kuchlar kelguncha kutishda"},"answer":"B","explanation":"To'satdan zarba berish dushmanga kutilmagan paytda hujum qilishni bildiradi. Boshqa variantlar kutilgan yoki pasif holatlarni tasvirlaydi.","mnemonic":"Kutilmagan zarba – to'satdan.","id":1024},{"subject":"Harbiy ta'lim","topic":"Amir Temur","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Temur jangida markaz, o'ng va chap qanotdan iborat an'anaviy tarkibdan voz kechib, qo‘shini 7 ta qo‘lga taqsimlagan","requires_image":false,"question":"Amir Temurning 1391-yildagi jangida qo‘shini qanday yangi usul bilan tashkil etgan?","options":{"A":"3 ta bo‘linmaga ajratish","B":"10 ta alohida divizionga bo‘lish","C":"7 ta qo‘lga bo‘lish","D":"5 ta birja guruhiga biriktirish"},"answer":"C","explanation":"Amir Temur an'anaviy markaz, o'ng va chap qanotdan voz kechib, qo‘shini 7 ta qo‘lga taqsimlaganligi ko‘rsatilgan. Boshqa variantlar tasvirlanmagan.","mnemonic":"Temur – 7 qo‘l.","id":1025},{"subject":"Harbiy ta'lim","topic":"Amir Temur","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Temur jangida o‘qdan tushib, kamondan o‘q uzish usulini qo‘llagan","requires_image":false,"question":"Terek daryosi jangida Amir Temur qo‘shini qanday yangi usul bilan harakatga qo‘shgan?","options":{"A":"Suv osti yurishini qo‘llash","B":"Kengaytirilgan topga otish","C":"O‘qdan tushish va kamondan o‘q uzish","D":"Artileriya qoplamasini oshirish"},"answer":"C","explanation":"Amir Temur o‘qdan tushib, kamondan o‘q uzish usulini birinchi marta qo‘llaganligi qayd etilgan. Boshqa usullar matnda yo‘q.","mnemonic":"O‘q‑kamon – yangi harakat.","id":1026},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Manguberdi taktikalarida: 1) shiddat bilan harakat, 2) yirik kuchlarni jamlash, 3) to'satdan zarba, 4) tez natija olish","requires_image":false,"question":"Jaloliddin Manguberdi taktikalarini to‘g‘ri ketma‑ketlikda joylang:\n1. Shiddat bilan harakat\n2. Yirik kuchlarni jamlash\n3. To'satdan zarba berish\n4. Tez natija olish","options":{"A":"1, 2, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"2, 1, 3, 4"},"answer":"A","explanation":"Manguberdi tamoyillari birinchi bosqichda shiddat bilan harakat, keyin yirik kuchlarni jamlash, to'satdan zarba, oxirida tez natija olishni belgilaydi. Shuning uchun 1‑2‑3‑4 to‘g‘ri.","mnemonic":"Shiddat → Yirik → To'satdan → Tez.","id":1027},{"subject":"Harbiy ta'lim","topic":"Amir Temur","subtopic":"Jang taktikasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Amir Temur jang tizimida: 1) an'anaviy tarkibdan voz kechish, 2) 7 ta qo‘lga taqsimlash, 3) har bir qo‘lga maxsus vazifa berish, 4) natijani tahlil qilish","requires_image":false,"question":"Amir Temurning 1391‑yildagi jang rejasini to‘g‘ri tartibda joylang:\n1. An'anaviy tarkibdan voz kechish\n2. 7 ta qo‘lga taqsimlash\n3. Har bir qo‘lga vazifa berish\n4. Natijani tahlil qilish","options":{"A":"1, 2, 3, 4","B":"2, 1, 3, 4","C":"1, 3, 2, 4","D":"3, 2, 1, 4"},"answer":"A","explanation":"Avvalo an'anaviy tarkibdan voz kechish, keyin qo‘shini 7 ta qo‘lga bo‘lish, har biriga maxsus vazifa, oxirida natijani tahlil qilish tasvirlangan. Shuning uchun 1‑2‑3‑4 to‘g‘ri tartib.","mnemonic":"An'anaviy → 7 qo‘l → Vazifa → Tahlil.","id":1028},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Manguberdi tamoyillari: 1) shiddat bilan harakat, 2) yirik kuchlarni jamlash, 3) to'satdan zarba, 4) tez natija olish","requires_image":false,"question":"Manguberdi tamoyillarini ularning maqsadi bilan moslashtiring:\n1. Shiddat bilan harakat\n2. Yirik kuchlarni jamlash\n3. To'satdan zarba\n4. Tez natija olish\nA. Dushmanni kutilmagan paytda mag‘lub etish\nB. Jang maydonida kuchlarni konsentratsiya qilish\nC. Harakatni yuqori intensivda boshlash\nD. Natijani qisqa muddat ichida olish","options":{"A":"1-A, 2-C, 3-B, 4-D","B":"1-B, 2-A, 3-D, 4-C","C":"1-D, 2-C, 3-B, 4-A","D":"1-C, 2-B, 3-A, 4-D"},"answer":"D","explanation":"Shiddat bilan harakat – yuqori intensivlik (C); yirik kuchlarni jamlash – konsentratsiya (B); to'satdan zarba – dushmanni kutilmagan paytda mag‘lub etish (A); tez natija – qisqa muddat ichida (D).","mnemonic":"Shiddat‑C, Yirik‑B, To'satdan‑A, Tez‑D.","id":1029},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Manguberdi taktikasi: \"tez va to'xtalishsiz pirovard natijaga erishish\"","requires_image":false,"question":"Manguberdi qaysi tamoyilida natijaga tez va to'xtalishsiz erishishni ta'kidlamoqda?","options":{"A":"Birinchi tamoyil","B":"To'rtinchi tamoyil","C":"Ikkinchi tamoyil","D":"Uchinchi tamoyil"},"answer":"B","explanation":"To'rtinchi tamoyil tez va to'xtalishsiz pirovard natijaga erishish kerakligini bildiradi. Boshqa tamoyillar boshqa jihatlarni qamrab oladi.","mnemonic":"To'rtinchi – tez natija.","id":1030},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Fuqarolar ro‘yxatga olish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Fuqarolar o‘z turar joylaridagi tuman (shahar) mudofaa ishlari organlari huzurida tashkil etiladigan chaqiruv uchastkalarida ro‘yxatdan o‘tkaziladi","requires_image":false,"question":"Fuqarolar chaqiruv uchastkasida ro‘yxatdan o‘tkazilishi uchun qaysi joyda bo‘lishi kerak?","options":{"A":"Mahalliy politsiya bo‘linmasi","B":"Viloyat hokimiyatining boshqarmasi","C":"O‘z turar joyidagi tuman mudofaa organi","D":"Maktab direktorati"},"answer":"C","explanation":"Fuqarolar tuman (shahar) mudofaa organlari huzurida chaqiruv uchastkalarida ro‘yxatdan o‘tkazilishi belgilangan.","mnemonic":"Tuman - mudofaa, ro‘yxatning birinchi bosqichi","id":1031},{"subject":"Harbiy ta'lim","topic":"Jismoniy tayyorgarlik","subtopic":"Sport va sog‘lomlashtirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqiriluvchilarning jismoniy tayyorgarligi ... sport jamiyatlari va klublari, davolash muassasalari, mudofaa-sport sog‘lomlashtirish lagerlarida olib boriladi","requires_image":false,"question":"Chaqiriluvchilar jismoniy tayyorgarligini qaysi muassasalar orqali amalga oshiradi?","options":{"A":"Mahalliy sanoat korxonalari","B":"Ijtimoiy xizmat ko‘rsatish markazlari","C":"Maktab kutubxonalari va laboratoriyalar","D":"Sport jamiyatlari, klublar, sog‘lomlashtirish lagerlari"},"answer":"D","explanation":"Jismoniy tayyorgarlik sport jamiyatlari, klublar, davolash muassasalari va sog‘lomlashtirish lagerlarida amalga oshiriladi.","mnemonic":"Sport – sog‘lom, tayyorlikning asosi","id":1032},{"subject":"Harbiy ta'lim","topic":"Maktabgacha va maktab ta'limi","subtopic":"Umumta'lim tayyorgarlik darajasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Maktabgacha va maktab ta'limi tashkilotlari chaqiriluvchilarning umumta'lim tayyorgarlik darajasini oshirish yuzasidan zarur chora‑tadbirlar ko‘rishlari shart","requires_image":false,"question":"Maktabgacha va maktab ta'limi tashkilotlari qanday vazifani bajarishi shart?","options":{"A":"Sport musobaqalarini tashkillashtirish","B":"Umumta'lim tayyorgarlik darajasini oshirish","C":"Maktab budjetini oshirish","D":"Faqat harbiy tarixni o‘rgatish"},"answer":"B","explanation":"Maktabgacha va maktab ta'limi tashkilotlari chaqiriluvchilarning umumta'lim tayyorgarlik darajasini oshirish chora‑tadbirlarini ko‘rishi kerakligi aytilgan.","mnemonic":"Umumta'lim – tayyorlikning asosi","id":1033},{"subject":"Harbiy ta'lim","topic":"Buyuk sarkardalar","subtopic":"Jaloliddin Manguberdining hayoti","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdining to'liq ismi va tug'ilg  yirik kuchlarni bosh zarba berish yo'nalishida jamlaydi","requires_image":false,"question":"Manguberdi jangda ikkinchi darajali hududlar qanday ishlatiladi?","options":{"A":"Kuchsizlantiriladi, lekin yirik kuchlar jamlanadi","B":"Ular asosiy front bo'lib xizmat qiladi","C":"Har doim xavfsiz hudud sifatida saqlanadi","D":"Faqat qo'shinni qayta yig'ish uchun ishlatiladi"},"answer":"A","explanation":"Ikkinchi darajali hududlar kuchsizlantiriladi, lekin yirik kuchlar bosh zarba yo'nalishida jamlanadi deb aytilgan.","mnemonic":"Kuchsiz, lekin katta jamlanadi","id":1040},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi taktikasi","subtopic":"To'xtalmaslik tamoyili","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi harakatning tez va to'xtalmaslik tamoyiliga ishonadi","requires_image":false,"question":"Manguberdi har qanday urushda qaysi tamoyilga ko'proq e'tibor beradi?","options":{"A":"Muddatli mudofaa","B":"Tez va to'xtalmaslik","C":"Kuchli obro'","D":"Qattiq himoya"},"answer":"B","explanation":"Harakatning tez va to'xtalmaslik tamoyili alohida ta'kidlangan.","mnemonic":"Tez harakat – g'alaba","id":1041},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi taktikasi","subtopic":"Muvaffaqiyatdan foydalanish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi erishilgan muvaffaqiyatdan tez va unumli foydalanishga e'tibor beradi","requires_image":false,"question":"Manguberdi muvaffaqiyatni qanday yo'nalishda ishlatadi?","options":{"A":"Faqat xavfsiz hududda saqlash","B":"Uzoq muddatli rejalashtirish","C":"Tez va unumli foydalanish","D":"Ko'p bosqichli tekshirish"},"answer":"C","explanation":"Erishilgan muvaffaqiyatni tez va unumli foydalanish tamoyili keltirilgan.","mnemonic":"Muvaffaqiyat – tez foydalanish","id":1042},{"subject":"Harbiy ta'lim","topic":"Amir Temur taktikasi","subtopic":"Jangda qo'shin bo'linish usuli","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Temur 1395-yilda Terek daryosi qirg'og'ida yangi o'q uzish usulini qo'lladi","requires_image":false,"question":"Terek daryosi jangida Temur qanday yangi usulni joriy qilgan?","options":{"A":"Ko'p qatlamli mudofaa","B":"Balistik raketa yondashuvi","C":"Tosh bilan qamalash","D":"Kamondan o'q uzish"},"answer":"D","explanation":"Temur Kamondan o'q uzish usulini birinchi marta qo'llaganligi aniq ko'rsatilgan.","mnemonic":"Temur – kamondan o'q","id":1043},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi taktikasi","subtopic":"To'xtashsiz natija","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi har qanday harakatda to'xtalmas natijaga erishish kerakligini ta'kidlaydi","requires_image":false,"question":"Manguberdi g'alabaga erishish uchun har qanday harakatda qanday natijaga erishish kerak?","options":{"A":"To'xtalmas natija","B":"Uzoq muddatli qayta qurish","C":"Keng tarqatilgan himoya","D":"Yuqori darajadagi qayta aloqa"},"answer":"A","explanation":"To'xtalmas natijaga erishish tamoyili qat'iy ta'kidlangan.","mnemonic":"To'xtalmas – g'alaba","id":1044},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Huquqiy asoslar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 20-21-§: FM qonuni 2000-yil 26-may; VM 369-son qarori 2017-yil 9-iyun; FV qonuni 2022-yil 17-avgust","requires_image":false,"question":"Fuqaro muhofazasi sohasidagi hujjatlarni qabul qilingan sanasi bilan moslashtiring:\n1. \"Fuqaro muhofazasi to'g'risida\"gi Qonun\n2. Fuqaro muhofazasi tuzilmalari to'g'risidagi 369-son hukumat qarori\n3. \"Aholini va hududlarni tabiiy hamda texnogen xususiyatli favqulodda vaziyatlardan muhofaza qilish to'g'risida\"gi Qonun\nA. 2017-yil 9-iyun\nB. 2000-yil 26-may\nC. 2022-yil 17-avgust","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-B, 3-C","C":"1-C, 2-A, 3-B","D":"1-B, 2-C, 3-A"},"answer":"A","explanation":"\"Fuqaro muhofazasi to'g'risida\"gi Qonun 2000-yil 26-mayda qabul qilingan. Tuzilmalarni belgilash va tabellashtirish tartibi to'g'risidagi 369-son qaror Vazirlar Mahkamasi tomonidan 2017-yil 9-iyunda chiqarilgan. Aholini va hududlarni favqulodda vaziyatlardan muhofaza qilish to'g'risidagi qonun esa 2022-yil 17-avgustda tasdiqlangan.","mnemonic":"FM 2000-da tug'ildi, tuzilma 2017-da, FV qonuni 2022-da.","id":1045},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Favqulodda vaziyatlar tasnifi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 21-§: texnogen — magistral quvur avariyasi; tabiiy — qor ko'chkisi; ekologik — sizot suvlar ko'tarilishi","requires_image":false,"question":"Favqulodda vaziyat misollarini ularning xususiyatiga ko'ra turi bilan moslashtiring:\n1. Magistral quvurlardagi avariya natijasida gaz favvorasining yonib ketishi\n2. Sanatoriy hududiga qor ko'chkisi tushishi\n3. Sizot suvlar darajasining ko'tarilib, binolarni yemirishi\nA. Tabiiy xususiyatli\nB. Ekologik xususiyatli\nC. Texnogen xususiyatli","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-C, 3-A","C":"1-C, 2-B, 3-A","D":"1-A, 2-B, 3-C"},"answer":"A","explanation":"Magistral quvurlardagi avariya inson ishlab chiqarish faoliyati bilan bog'liq — texnogen vaziyat. Qor ko'chkisi gidrometeorologik xavfli hodisa — tabiiy vaziyat. Sizot suvlar darajasining oshishi gidrosfera holatining o'zgarishi — ekologik vaziyat.","mnemonic":"Quvur — texnika, ko'chki — tabiat, sizot — ekologiya.","id":1046},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Favqulodda vaziyatlar tasnifi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 21-§: epidemiya — odamlar, epizootiya — hayvonlar, epifitotiya — o'simliklar","requires_image":false,"question":"Ommaviy kasallanish atamalarini ular qamrab oluvchi obyekt bilan moslashtiring:\n1. Epidemiya\n2. Epizootiya\n3. Epifitotiya\nA. Hayvonlarning ommaviy kasallanishi yoki nobud bo'lishi\nB. O'simliklarning ommaviy nobud bo'lishi\nC. Odamlarning guruh bo'lib yuqumli kasallanishi","options":{"A":"1-C, 2-B, 3-A","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Epidemiya — bir aholi punktida 50 kishi va undan ortiq odamning guruh bo'lib yuqumli kasallanishi. Epizootiya hayvonlarning, epifitotiya esa o'simliklarning ommaviy kasallanishi yoki nobud bo'lishini bildiradi.","mnemonic":"Demos — xalq, zoo — hayvon, fito — o'simlik.","id":1047},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Evakuatsiya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 22-§: evakuatsiya hududiy, ishlab chiqarish va ishlab chiqarish-hududiy tamoyillari","requires_image":false,"question":"Evakuatsiya tamoyillarini ularning mazmuni bilan moslashtiring:\n1. Hududiy tamoyil\n2. Ishlab chiqarish tamoyili\n3. Ishlab chiqarish-hududiy tamoyil\nA. Xodimlar oila a'zolari bilan birgalikda ko'chiriladi\nB. Barcha aholi yashash joylaridan olib chiqib ketiladi\nC. Korxona xodimlari ko'chiriladi, oila a'zolari birga ko'chirilmaydi","options":{"A":"1-A, 2-B, 3-C","B":"1-B, 2-C, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"Hududiy tamoyilda barcha aholi yashash joylaridan ko'chiriladi — halokatli suv toshqini, dovul, zilzila va kimyoviy avariyalardan so'ng shu tartib qo'llanadi. Ishlab chiqarish tamoyilida faqat korxona xodimlari, oilasiz ko'chiriladi. Xodimlar oila a'zolari bilan birga ko'chirilsa, bu ishlab chiqarish-hududiy tamoyil bo'ladi.","mnemonic":"Hudud — hamma, ishlab chiqarish — xodim, qo'shma — oila bilan.","id":1048},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Xabar berish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 22-§: \"Diqqat hammaga!\" signalidan keyingi harakat algoritmi","requires_image":false,"question":"\"Diqqat hammaga!\" signali qabul qilingach, aholi harakatlarining to'g'ri ketma-ketligini aniqlang:\n1. Mutaxassislar ko'rsatmalariga muvofiq tinchlikni saqlagan holda harakat qilish\n2. Televideniye, radiokanallar va internet tarmoqlarini kuzatish\n3. Ommaviy axborot vositalari orqali harakatlar tartibi to'g'risida ma'lumot olish","options":{"A":"1, 2, 3","B":"2, 1, 3","C":"2, 3, 1","D":"3, 2, 1"},"answer":"C","explanation":"Ogohlantirish signalidan so'ng avval televideniye, radio va internet tarmoqlari kuzatiladi, keyin rasmiy manbalardan vaziyat xususiyatiga qarab harakatlar tartibi haqida ma'lumot olinadi va nihoyat mutaxassislar tavsiyalariga muvofiq xavotirga tushmasdan harakat qilinadi.","mnemonic":"Eshit — bil — bajar.","id":1049},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Panohgohlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 23-§: panohgohlar sig'imi — kichik 150-600, o'rta 600-2000, katta 2000+ odam","requires_image":false,"question":"Panohgohlarni odam sig'dirish hajmiga ko'ra turi bilan moslashtiring:\n1. Kichik hajmli\n2. O'rta hajmli\n3. Katta hajmli\nA. 600 dan 2000 gacha odam\nB. 2000 dan ortiq odam\nC. 150 dan 600 gacha odam","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Panohgohlar sig'imiga ko'ra uch xil bo'ladi: kichik hajmlisi 150-600 odamni, o'rta hajmlisi 600-2000 odamni sig'diradi, katta hajmlisi esa 2000 dan ortiq odamga mo'ljallanadi.","mnemonic":"150-600-2000 — kichikdan kattaga zinapoya.","id":1050},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Panohgohlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 23-§: har yashirinuvchiga 2 sutkalik oziq-ovqat, 0,5 m² joy, 1,5 m³ havo","requires_image":false,"question":"Himoya inshootida har bir yashirinuvchi uchun belgilangan ta'minot me'yorlarini moslashtiring:\n1. Oziq-ovqat zaxirasi\n2. Joy maydoni\n3. Havo hajmi\nA. 0,5 m²\nB. 1,5 m³\nC. 2 sutkaga yetarli miqdor","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-A, 2-B, 3-C"},"answer":"B","explanation":"Himoya inshootida har bir yashirinuvchi uchun 2 sutkaga yetarli oziq-ovqat zaxirasi, 0,5 kvadrat metr joy va 1,5 kub metr havo bo'lishi lozim.","mnemonic":"2 kun ovqat, yarim metr joy, bir yarim kub havo.","id":1051},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Filtrlovchi gazniqoblar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 24-§: GP-5 shlem-niqob o'lchamlari — 92 cm dan kam 0; 96-98 cm 2; 102,5 cm dan katta 4","requires_image":false,"question":"GP-5 gazniqobida bosh o'lchamlari yig'indisini shlem-niqob o'lchami bilan moslashtiring:\n1. 92 cm dan kam\n2. 96-98 cm\n3. 102,5 cm dan katta\nA. 2-o'lcham\nB. 4-o'lcham\nC. 0-o'lcham","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"GP-5 shlem-niqobi vertikal va gorizontal o'lchamlar yig'indisiga qarab tanlanadi: 92 cm dan kam bo'lsa 0-o'lcham, 92-96 cm da 1-o'lcham, 96-98 cm da 2-o'lcham, 99-102,5 cm da 3-o'lcham, 102,5 cm dan katta bo'lsa 4-o'lcham olinadi.","mnemonic":"92 dan boshlab har pog'ona — bir o'lcham yuqori.","id":1052},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Filtrlovchi gazniqoblar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 24-§: gazniqobni to'g'ri kiyish tartibi","requires_image":false,"question":"Gazniqobni to'g'ri kiyish harakatlarining ketma-ketligini aniqlang:\n1. Keskin va chuqur nafas chiqarib, ko'zlarni ochish va nafasni tiklash\n2. Nafas olmasdan, ko'zlarni yumib bosh kiyimni yechish\n3. Gazniqobni xaltadan chiqarib olish\n4. Gazniqobning pastki qismini iyakka qo'yib, boshga kiyish","options":{"A":"2, 3, 4, 1","B":"2, 4, 3, 1","C":"3, 4, 2, 1","D":"3, 2, 4, 1"},"answer":"A","explanation":"Avval nafas olmasdan va ko'zlarni yumgan holda bosh kiyim yechiladi, so'ng gazniqob xaltadan olinadi, tasmalaridan ushlab pastki qismi iyakka qo'yiladi va boshga kiyiladi. Kiyib bo'lingach keskin nafas chiqariladi — bu niqob ichiga kirib qolgan zaharli havoni chiqarib yuboradi, shundan keyingina ko'z ochiladi.","mnemonic":"Yech — ol — kiy — pufla.","id":1053},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Filtrlovchi gazniqoblar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 24-§: gazniqobni yechish tartibi","requires_image":false,"question":"Gazniqobni yechish harakatlarining to'g'ri ketma-ketligini belgilang:\n1. Gazniqobni ohista pastga tortish\n2. O'ng qo'l bilan bosh kiyimni yechib olish\n3. Yuqoriga harakatlantirgan holda yechib olish\n4. Chap qo'lda gazniqob yuz qismidagi klapanli qutini ushlash","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"1, 2, 4, 3"},"answer":"A","explanation":"Yechishda avval o'ng qo'l bilan bosh kiyim olinadi, chap qo'lda yuz qismidagi klapanli quti ushlanadi, gazniqob avval ohista pastga tortiladi, so'ng yuqoriga harakatlantirilgan holda yechib olinadi.","mnemonic":"Bosh kiyim — quti — pastga — tepaga.","id":1054},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Respiratorlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 25-§: respiratorlar aerozolga, gazga va gaz-aerozolga qarshi turlarga bo'linadi","requires_image":false,"question":"Respirator turlarini ular himoya qiladigan moddalar bilan moslashtiring:\n1. Aerozolga qarshi respirator\n2. Gazga qarshi respirator\n3. Gaz-aerozolga qarshi respirator\nA. Zararli gaz va bug' ko'rinishidagi moddalardan\nB. Gaz, bug' ko'rinishidagi zararli moddalar va turli aerozollardan\nC. Havodagi turli xil aerozollardan","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-C, 3-A","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"Aerozolga qarshi respirator turli aerozollardan, gazga qarshisi zararli gaz va bug'lardan himoya qiladi, gaz-aerozolga qarshi turi esa ikkala xavfdan birdek saqlaydi. Barcha turlari havodagi kislorod miqdori 18% dan kam bo'lmagan sharoitda qo'llanadi.","mnemonic":"Nomi nimaga qarshi bo'lsa — o'shandan himoya.","id":1055},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Filtrlovchi gazniqoblar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 24-§: PDF-D 1,5-7 yosh; PDF-Sh 7-17 yosh; PDF-2Sh maktab o'quvchilari uchun","requires_image":false,"question":"Bolalar gazniqoblarini ular mo'ljallangan yosh toifasi bilan moslashtiring:\n1. PDF-D\n2. PDF-Sh\n3. PDF-2Sh\nA. 7 yoshdan 17 yoshgacha bo'lgan bolalar\nB. Maktab o'quvchilari uchun eng ilg'or model\nC. 1,5 yoshdan 7 yoshgacha bo'lgan bolalar","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-C, 3-B","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"PDF-D gazniqobi 1,5 yoshdan 7 yoshgacha, PDF-Sh esa 7 yoshdan 17 yoshgacha bo'lgan bolalarga mo'ljallangan. Bugungi kundagi eng ilg'or modellar — maktabgacha yoshdagilar uchun PDF-2D va maktab o'quvchilari uchun PDF-2Sh.","mnemonic":"D — degan kichkina, Sh — sho'x maktabchi.","id":1056},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Himoya vositalarini kiyish me'yorlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 25-§: gazniqob va respirator kiyish me'yori o'quvchi uchun — a'lo 7 s, yaxshi 8 s, qoniqarli 10 s","requires_image":false,"question":"O'quvchi uchun gazniqobni kiyish vaqtini tegishli baho bilan moslashtiring:\n1. A'lo\n2. Yaxshi\n3. Qoniqarli\nA. 8 soniya\nB. 10 soniya\nC. 7 soniya","options":{"A":"1-C, 2-B, 3-A","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"O'quvchi gazniqobni 7 soniyada kiysa a'lo, 8 soniyada kiysa yaxshi, 10 soniyada kiysa qoniqarli baho oladi. Vaqt komanda berilgandan to nafas olish qayta tiklanguniga qadar hisoblanadi.","mnemonic":"7-8-10: a'lo, yaxshi, qoniqarli.","id":1057},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Terini himoyalovchi vositalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 26-§: himoya plashi o'lchamlari — 166 cm gacha 1; 172-178 cm 3; 178 cm dan yuqori 4","requires_image":false,"question":"Umumqo'shin himoya to'plamidagi himoya plashining o'lchamini kishi bo'yi bilan moslashtiring:\n1. Bo'yi 166 cm gacha\n2. 172 cm dan 178 cm gacha\n3. 178 cm dan yuqori\nA. Uchinchi o'lcham\nB. To'rtinchi o'lcham\nC. Birinchi o'lcham","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"Himoya plashi bo'yi 166 cm gacha bo'lganlarga birinchi, 166-172 cm da ikkinchi, 172-178 cm da uchinchi, 178 cm va undan yuqori bo'lganlarga to'rtinchi o'lchamda beriladi.","mnemonic":"Har 6 cm bo'y — bir o'lcham plash.","id":1058},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Terini himoyalovchi vositalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 26-§: himoya paypoqlari — 40 o'lchamga 1; 41-42 ga 2; 43+ ga 3-o'lcham","requires_image":false,"question":"Himoya paypoqlarining o'lchamini poyabzal o'lchami bilan moslashtiring:\n1. 40 o'lchamli poyabzal\n2. 41-42 o'lchamli poyabzal\n3. 43 va undan katta o'lchamli poyabzal\nA. Ikkinchi o'lcham\nB. Uchinchi o'lcham\nC. Birinchi o'lcham","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Himoya paypoqlari uch o'lchamda chiqariladi: 40 o'lchamli poyabzalga birinchi, 41-42 o'lchamliga ikkinchi, 43 va undan kattasiga uchinchi o'lcham to'g'ri keladi. Paypoqlar oddiy oyoq kiyim ustidan kiyiladi.","mnemonic":"40-42-43: paypoqning uch zinasi.","id":1059},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Terini himoyalovchi vositalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 26-§: L-1 o'lchamlari — 165 cm gacha 1; 165-172 cm 2; 172 cm dan yuqori 3","requires_image":false,"question":"L-1 yengil himoya kostyumining o'lchamini harbiy xizmatchi bo'yi bilan moslashtiring:\n1. Bo'yi 165 cm gacha\n2. 165 cm dan 172 cm gacha\n3. 172 cm dan yuqori\nA. Ikkinchi o'lcham\nB. Uchinchi o'lcham\nC. Birinchi o'lcham","options":{"A":"1-C, 2-B, 3-A","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"L-1 yengil himoya kostyumi bo'yi 165 cm gacha bo'lganlarga birinchi, 165-172 cm bo'lganlarga ikkinchi, 172 cm dan yuqorilarga uchinchi o'lchamda beriladi. Kostyum qalpoqli kamzul, paypoqli shim, shlemosti qalpoq va ikki barmoqli qo'lqoplardan iborat.","mnemonic":"L-1: 165 va 172 — ikki chegara, uch o'lcham.","id":1060},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Himoya vositalarini kiyish me'yorlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 27-§: a'lo baho — UHT plash holatida 3 daq, kombinezon holatida 4 daq 35 s, L-1 bilan 4 daq","requires_image":false,"question":"Terini himoyalovchi vositalarni kiyishda a'lo bahoga belgilangan vaqtlarni moslashtiring:\n1. UHTni plash holatida kiyish\n2. UHTni kombinezon holatida kiyish\n3. L-1 maxsus himoya kiyimi va gazniqobni kiyish\nA. 4 daqiqa 35 soniya\nB. 4 daqiqa\nC. 3 daqiqa","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"A'lo baho uchun umumqo'shin himoya to'plamini plash holatida 3 daqiqada, kombinezon holatida 4 daqiqa 35 soniyada kiyish talab etiladi. L-1 maxsus himoya kiyimi va gazniqobni kiyishga a'lo baho 4 daqiqada beriladi.","mnemonic":"Plash yengil — 3, kombinezon og'ir — 4:35, L-1 — 4.","id":1061},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Muhofaza inshootlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 23-§: pana joy, RYAJ va oddiy yashirinish joylarining himoya xususiyatlari","requires_image":false,"question":"Muhofaza inshooti turini uning asosiy himoya xususiyati bilan moslashtiring:\n1. Pana joy\n2. Radiatsiyadan yashirinish joyi (RYAJ)\n3. Oddiy yashirinish joyi (xandaq)\nA. Ionlovchi nurlanish, zarba to'lqini va zaharli aerozollardan himoya\nB. Zarba to'lqini va yorug'lik nurlanishidan himoya\nC. Zarba berish vositalari, kimyoviy va radioaktiv moddalardan muayyan vaqt yashash sharoiti bilan himoya","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"Pana joy eng to'liq himoyani beradi — zarba berish vositalari, xavfli kimyoviy va radioaktiv moddalardan saqlab, yashash sharoitini ham ta'minlaydi. RYAJ asosan radioaktiv zaharlanish, zarba to'lqini va aerozollardan, oddiy yashirinish joylari esa zarba to'lqini va yorug'lik nurlanishidan himoya qiladi.","mnemonic":"Pana — to'liq, RYAJ — nurdan, xandaq — to'lqindan.","id":1062},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Terini himoyalovchi vositalar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 27-§: himoya to'plamini kombinezon holatida kiyish tartibi","requires_image":false,"question":"Terini himoyalovchi to'plamni kiyishning boshlang'ich harakatlarini to'g'ri ketma-ketlikda joylashtiring:\n1. Himoya paypoqlarini poyabzal ustidan kiyib, qo'lqop kiyish\n2. Qurol va gazniqobni yerga qo'yish\n3. Plashdagi markaziy tugmani joyiga qadash\n4. Ikkita belbog'ni oyoqlar orasidan o'tkazib, halqalardan o'tkazib bog'lash","options":{"A":"2, 1, 4, 3","B":"1, 4, 2, 3","C":"2, 4, 1, 3","D":"1, 2, 4, 3"},"answer":"A","explanation":"Kiyish qurol va gazniqobni yerga qo'yishdan boshlanadi, so'ng plash g'ilofdan olinib himoya paypoqlari va qo'lqoplar kiyiladi. Keyin ikkita belbog' oyoqlar orasidan va plash halqalaridan o'tkazilib bog'lanadi, shundan so'ng markaziy tugma qadaladi.","mnemonic":"Qurol yerga — paypoq oyoqqa — belbog' — tugma.","id":1063},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Muhofaza inshootlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 23-§: yerto'lani muhofaza inshootiga moslashtirish ishlari tartibi","requires_image":false,"question":"Yerto'lani muhofaza inshootiga moslashtirishda bajariladigan ishlarning to'g'ri tartibini aniqlang:\n1. Ishlatilmaydigan eshik va derazalarni berkitish\n2. Xona orasidagi ichki devorlar va tom qismini mustahkamlash\n3. Odamlarni joylashtirish va hayot uchun zarur vositalar bilan jihozlash\n4. Kirish va chiqish eshiklari hamda yo'llarni moslashtirish","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"1, 2, 4, 3"},"answer":"A","explanation":"Moslashtirish ichki devorlar va tomni mustahkamlashdan boshlanadi, keyin kirish-chiqish eshiklari va yo'llar moslashtiriladi, ishlatilmaydigan eshik-derazalar berkitiladi va oxirida inshoot odamlar hayoti uchun zarur vositalar bilan jihozlanadi.","mnemonic":"Mustahkamla — yo'l och — berkit — jihozla.","id":1064},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Qo'lbola himoya vositalari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 25-§: paxta-dokali bog'lag'ichni tayyorlash tartibi","requires_image":false,"question":"Paxta-dokali bog'lag'ichni tayyorlash bosqichlarini to'g'ri ketma-ketlikda joylashtiring:\n1. Dokaning ikki tomondagi qirg'oqlarini qayirib, ichiga paxtani o'rash\n2. 100x50 cm o'lchamdagi doka materialini olish\n3. Dokaga 1-2 cm qalinlikda paxta qo'yish","options":{"A":"2, 3, 1","B":"1, 3, 2","C":"2, 1, 3","D":"3, 2, 1"},"answer":"A","explanation":"Avval 100x50 cm o'lchamdagi doka olinadi, unga paxta qo'yiladi, so'ng dokaning ikki tomonidagi qirg'oqlari qayrilib paxta ichiga o'raladi. Tayyor bog'lag'ich jag', og'iz va burunni berkitishi, ko'zga esa changga qarshi ko'zoynak taqilishi kerak.","mnemonic":"Doka — paxta — o'ra.","id":1065},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Respiratorlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 25-§: respiratorni kiyish tartibi","requires_image":false,"question":"Respiratorni kiyish harakatlarining to'g'ri ketma-ketligini belgilang:\n1. Bosh kiyimni kiyish va gazniqob xaltasi klapanini yopish\n2. Bosh kiyimni yechish yoki bog'ichlarida orqaga osiltirish\n3. Respiratorni xalta va o'ramdan olib kiyish, o'ramni xaltaga qo'yish","options":{"A":"1, 2, 3","B":"2, 3, 1","C":"2, 1, 3","D":"3, 2, 1"},"answer":"B","explanation":"Avval bosh kiyim yechiladi yoki bog'ichlarida orqaga osiltiriladi, so'ng respirator xalta va o'ramdan olinib kiyiladi, o'ram xaltaga qo'yiladi. Oxirida bosh kiyim qayta kiyilib, xalta klapani yopiladi.","mnemonic":"Yech — kiy — yop.","id":1066},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Filtrlovchi gazniqoblar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 24-§: GP-7 ko'rsatkichlari — umumiy og'irligi 0,9 kg gacha, filtr qutisi 0,25 kg, diametri 112 mm","requires_image":false,"question":"GP-7 filtrlovchi gazniqobning texnik ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Umumiy (yig'ma) og'irligi\n2. Yuklangan filtr qutisining og'irligi\n3. Filtr qutisining diametri\nA. 0,25 kg\nB. 112 mm\nC. 0,9 kg dan oshmaydi","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-C, 3-B","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"GP-7 gazniqobining umumiy og'irligi 0,9 kg dan oshmaydi, yuklangan filtr qutisi 0,25 kg keladi, qutining diametri 112 mm, qopqoq bilan balandligi 80 mm. Xaltaga joylangan holdagi o'lchamlari 120x120x270 mm.","mnemonic":"GP-7: kilodan yengil, quti — chorak kilo.","id":1067},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Kalashnikov avtomatlari TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 28-§, 1-jadval: o'q boshlang'ich tezligi — AK-74 900 m/s, AK-47 715 m/s, RPK-74 960 m/s","requires_image":false,"question":"Qurollarni ulardagi o'qning boshlang'ich tezligi bilan moslashtiring:\n1. AK-74\n2. AK-47\n3. RPK-74\nA. 715 m/s\nB. 960 m/s\nC. 900 m/s","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"AK-74 avtomatida o'qning boshlang'ich tezligi 900 m/s, eski 7,62 mm kalibrli AK-47 da 715 m/s. RPK-74 qo'l pulemyotining stvoli uzunroq bo'lgani uchun unda eng yuqori — 960 m/s.","mnemonic":"47 — sekinroq, 74 — 900, pulemyot — 960.","id":1068},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Kalashnikov avtomatlari TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 28-§, 1-jadval: to'ldirilgan o'qdon bilan og'irlik — AK-74 3,6 kg, AK-47 4,3 kg, RPK-74 5,46 kg","requires_image":false,"question":"Qurollarni ularning patronlar bilan to'ldirilgan o'qdon bilan birgalikdagi og'irligi bo'yicha moslashtiring:\n1. AK-74\n2. AK-47\n3. RPK-74\nA. 4,3 kg\nB. 5,46 kg\nC. 3,6 kg","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"To'ldirilgan plastmassali o'qdon bilan AK-74 atigi 3,6 kg, AK-47 esa 4,3 kg keladi. RPK-74 qo'l pulemyoti 45 patronli o'qdoni va uzun stvoli hisobiga eng og'iri — 5,46 kg.","mnemonic":"74 yengil, 47 o'rta, pulemyot og'ir.","id":1069},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Kalashnikov avtomatlari TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 28-§, 1-jadval: uzunligi — AK-74 940 mm, AK-47 870 mm, RPK-74 1060 mm","requires_image":false,"question":"Qurollarni nayza-pichoqsiz holatdagi uzunligi bilan moslashtiring:\n1. AK-74\n2. AK-47\n3. RPK-74\nA. 870 mm\nB. 1060 mm\nC. 940 mm","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"Nayza-pichoqsiz, qo'ndoq bilan birgalikdagi uzunlik AK-74 da 940 mm, AK-47 da 870 mm. RPK-74 pulemyoti uzun stvolli bo'lgani uchun 1060 mm ni tashkil etadi.","mnemonic":"870-940-1060: 47, 74, RPK tartibida o'sadi.","id":1070},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"O'qotar qurollar vazifasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 29-§: PKM, SVD, RPG-7, PM qurollarining vazifalari","requires_image":false,"question":"O'qotar qurollarni ularning vazifasi bilan moslashtiring:\n1. PKM pulemyoti\n2. SVD miltig'i\n3. RPG-7 granatomyoti\n4. PM to'pponchasi\nA. Birdan paydo bo'luvchi, ochiq va yashiringan yakka nishonlarni yo'q qilish\nB. Dushmanni qisqa masofalarda yo'q qilish uchun shaxsiy qurol\nC. Dushman qo'shini va o't ochish vositalarini yakson qilish\nD. Tanklar va boshqa bronevositalarga qarshi kurashish","options":{"A":"1-D, 2-A, 3-C, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-C, 2-D, 3-A, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"B","explanation":"Kalashnikov pulemyoti (PKM) dushman qo'shini va o't ochish vositalarini yakson qilishga, Dragunov merganlik miltig'i (SVD) yakka nishonlarni yo'q qilishga mo'ljallangan. RPG-7 tanklar va o'ziyurar artilleriya qurilmalariga qarshi kurashadi, Makarov to'pponchasi (PM) esa qisqa masofada qo'llanadigan shaxsiy qurol.","mnemonic":"Pulemyot — qo'shinga, mergan — yakkaga, RPG — tankka, PM — yaqinga.","id":1071},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"PKM pulemyoti TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 29-§: PKM — nishonga olib otish 1500 m, otish sur'ati 650-800, o'q tezligi 825 m/s","requires_image":false,"question":"PKM pulemyotining ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Nishonga olib otish masofasi\n2. Otish sur'ati (bir daqiqada)\n3. O'qning boshlang'ich tezligi\nA. 650-800 dona\nB. 825 m/s\nC. 1500 m","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"PKM pulemyoti nishonga 1500 m masofadan olib otadi, bir daqiqada 650-800 dona o'q uzadi, o'qning boshlang'ich tezligi 825 m/s. O'qning maksimal uchish masofasi esa 3800 m ga yetadi.","mnemonic":"PKM: bir yarim ming metr, sakkiz yuzga yaqin o'q.","id":1072},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"SVD miltig'i TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 29-§: SVD — optik bilan 1300 m, ochiq moslama bilan 1200 m, o'qdon 10 dona","requires_image":false,"question":"Dragunov merganlik miltig'i (SVD) ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Optik mo'ljalga olish moslamasi bilan otish masofasi\n2. Ochiq nishonga olish moslamasi bilan otish masofasi\n3. O'qdon sig'imi\nA. 1200 m\nB. 10 dona\nC. 1300 m","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"B","explanation":"SVD optik mo'ljalga olish moslamasi bilan 1300 m, ochiq moslama bilan 1200 m masofadan nishonga olib otadi. O'qdoni 10 dona patron sig'diradi, jangovar o't ochish tezligi daqiqasiga 30 o'q.","mnemonic":"Optika yuz metr qo'shadi: 1200 dan 1300 ga.","id":1073},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"RPG-7 granatomyoti TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 29-§: RPG-7 — PG-7V bilan 330 m, PG-7VM bilan 310 m, mo'ljalga olish 500 m","requires_image":false,"question":"RPG-7 granatomyotining otish masofalarini moslashtiring:\n1. PG-7V granatasi bilan eng ta'sirli o't ochish masofasi\n2. PG-7VM granatasi bilan eng ta'sirli o't ochish masofasi\n3. Mo'ljalga olish uzoqligi\nA. 310 m\nB. 500 m\nC. 330 m","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"RPG-7 dan PG-7V granatasi bilan eng ta'sirli o't ochish masofasi 330 m, PG-7VM granatasi bilan 310 m. Mo'ljalga olish uzoqligi 500 m, jangovar otish tezligi daqiqasiga 4-6 granata.","mnemonic":"V — 330, VM — 310, mo'ljal — 500.","id":1074},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"PM to'pponchasi TTX","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 29-§: PM — samarali otish 50 m, zarar kuchi 350 m gacha, o'qdon 8 patron","requires_image":false,"question":"Makarov to'pponchasi (PM) ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. Samarali o't ochish masofasi\n2. O'qning zarar yetkazish kuchi saqlanadigan masofa\n3. O'qdon sig'imi\nA. 350 m\nB. 8 dona patron\nC. 50 m","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"PM to'pponchasidan 50 metrgacha o't ochish samarali hisoblanadi, ammo o'qning zarar yetkazish kuchi 350 metrgacha saqlanadi. O'qdon sig'imi 8 patron, to'ldirilgan o'qdon bilan og'irligi 810 gramm.","mnemonic":"PM: 50 da aniq, 350 gacha xavfli, 8 ta o'q.","id":1075},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"AK-74 qism va mexanizmlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 30-§: zatvor, qaytaruvchi mexanizm, tormoz-kompensator, gaz trubkasi vazifalari","requires_image":false,"question":"AK-74 qism va mexanizmlarini ularning vazifasi bilan moslashtiring:\n1. Zatvor\n2. Qaytaruvchi mexanizm\n3. Tormoz-kompensator\n4. Gaz trubkasi\nA. Zatvor ramasini zatvor bilan birgalikda oldingi holatga qaytarish\nB. Gaz porsheni harakatini yo'naltirish\nC. Patronni patrondonga yuborish, kapsulni ezish va gilzani sug'urib olish\nD. O'qlar urishi yo'nalishlarini jamlash va siltanish energiyasini kamaytirish","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-D, 2-B, 3-C, 4-A","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Zatvor patronni patrondonga yuboradi, stvol kanalini yopadi, kapsulni ezadi va gilzani sug'urib oladi. Qaytaruvchi mexanizm zatvor ramasini oldingi holatga qaytaradi, tormoz-kompensator qurol siltanishini kamaytiradi, gaz trubkasi esa gaz porsheni harakatini yo'naltiradi.","mnemonic":"Zatvor ishlaydi, prujina qaytaradi, kompensator tinchlantiradi.","id":1076},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"AK-74 qism va mexanizmlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 30-§: stvol qutisi qopqog'i, o'qdon, stvolosti qoplamasi, mo'ljalga olish moslamasi vazifalari","requires_image":false,"question":"AK-74 qismlarini ularning vazifasi bilan moslashtiring:\n1. Stvol qutisining qopqog'i\n2. O'qdon\n3. Stvolosti qoplamasi\n4. Mo'ljalga olish moslamasi\nA. Patronlarni joylash va ularni stvol qutisiga yuborish\nB. Avtomatni turli masofalardagi nishonlarga to'g'rilash\nC. Stvol qutisidagi qism va mexanizmlarni ifloslanishdan asrash\nD. Otishda avtomatchining qo'llarini kuyishdan asrash","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-B, 2-A, 3-C, 4-D","C":"1-C, 2-A, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"C","explanation":"Stvol qutisining qopqog'i ichidagi mexanizmlarni ifloslanishdan asraydi, o'qdon patronlarni joylab stvol qutisiga yuboradi. Stvolosti qoplamasi otish vaqtida qo'llarni kuyishdan saqlaydi, mo'ljalga olish moslamasi esa qurolni nishonga to'g'rilashga xizmat qiladi.","mnemonic":"Qopqoq asraydi, o'qdon uzatadi, qoplama saqlaydi, mo'ljal to'g'rilaydi.","id":1077},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Avtomatni ajratish va yig'ish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 32-§: noto'liq ajratishning 5-8-bosqichlari — qaytarish mexanizmi, zatvor ramasi, zatvor, gaz quvuri","requires_image":false,"question":"AK-74 ni noto'liq qismlarga ajratishda stvol qutisi qopqog'i olingandan keyingi harakatlar ketma-ketligini aniqlang:\n1. Zatvor ramasidan zatvorni ajratish\n2. Qaytarish mexanizmini ajratish\n3. Gaz quvurini stvol qoplamasi bilan ajratish\n4. Zatvor ramasini zatvor bilan birga ajratish","options":{"A":"4, 2, 1, 3","B":"4, 1, 2, 3","C":"2, 4, 1, 3","D":"2, 1, 4, 3"},"answer":"C","explanation":"Stvol qutisi qopqog'idan keyin avval qaytarish mexanizmi ajratiladi, so'ng zatvor ramasi zatvor bilan birga chiqariladi, undan keyin zatvor ramasidan zatvor ajratiladi va oxirida gaz quvuri stvol qoplamasi bilan olinadi.","mnemonic":"Prujina — rama — zatvor — quvur.","id":1078},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Avtomatni ajratish va yig'ish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 32-§: qayta yig'ishning 1-4-bosqichlari — gaz quvuri, zatvor, zatvor ramasi, qaytarish mexanizmi","requires_image":false,"question":"AK-74 ni noto'liq ajratilgandan keyin qayta yig'ishning dastlabki harakatlarini to'g'ri tartiblang:\n1. Zatvor ramasini zatvor bilan stvol qutisiga biriktirish\n2. Gaz quvurini stvol qoplamasi bilan biriktirish\n3. Qaytarish mexanizmini biriktirish\n4. Zatvorni zatvor ramasiga biriktirish","options":{"A":"1, 4, 2, 3","B":"2, 1, 4, 3","C":"2, 4, 1, 3","D":"4, 2, 1, 3"},"answer":"C","explanation":"Yig'ish ajratishga teskari tartibda boradi: avval gaz quvuri stvol qoplamasi bilan o'rnatiladi, keyin zatvor zatvor ramasiga biriktiriladi, ular birgalikda stvol qutisiga joylanadi va shundan so'ng qaytarish mexanizmi qo'yiladi.","mnemonic":"Quvur — zatvor — rama — prujina: ajratishning teskarisi.","id":1079},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Qo'l granatalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 33-§: RGD-5 parcha radiusi 25 m, og'irligi 310 g; F-1 radiusi 200 m, og'irligi 600 g","requires_image":false,"question":"Qo'l granatalarining jangovar ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. RGD-5 parchalarining uchish radiusi\n2. F-1 parchalarining uchish radiusi\n3. RGD-5 ning to'liq og'irligi\n4. F-1 ning to'liq og'irligi\nA. 200 m\nB. 600 g\nC. 25 m\nD. 310 g","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-C, 2-A, 3-B, 4-D","C":"1-D, 2-B, 3-C, 4-A","D":"1-A, 2-C, 3-D, 4-B"},"answer":"A","explanation":"Hujum granatasi RGD-5 da o'ldiruvchi parchalar 25 m radiusgacha uchadi va og'irligi 310 g. Mudofaa granatasi F-1 og'irroq — 600 g, parchalari esa 200 m radiusgacha xavfli, shu sababli u faqat pana joydan uloqtiriladi.","mnemonic":"RGD yengil-yaqin, F-1 og'ir-uzoq.","id":1080},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Qo'l granatalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 33-§: RGD-5 uloqtirish 40-50 m, F-1 uloqtirish 35-45 m, zapal yonish vaqti 3,2-4,2 s","requires_image":false,"question":"Qo'l granatalari bo'yicha ko'rsatkichlarni qiymatlari bilan moslashtiring:\n1. RGD-5 uloqtirilishining o'rtacha uzoqligi\n2. F-1 uloqtirilishining o'rtacha uzoqligi\n3. Zapal sekinlatkichining yonish vaqti\nA. 35-45 m\nB. 3,2-4,2 soniya\nC. 40-50 m","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Yengilroq RGD-5 o'rtacha 40-50 m ga, og'irroq F-1 esa 35-45 m ga uloqtiriladi. Ikkala granatada ham UZRGM zapali sekinlatkichining yonish vaqti bir xil — 3,2-4,2 soniya.","mnemonic":"Yengili uzoqroq uchadi, zapal hammaga bir xil.","id":1081},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otishdagi tutilishlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 31-§: tutilish ro'y berganda harakat tartibi — qayta o'qlash, otishni davom ettirish, sabab aniqlash","requires_image":false,"question":"Otish davomida tutilish ro'y berganda avtomatchining harakatlar ketma-ketligini aniqlang:\n1. Otishni davom ettirish\n2. Zatvor ramasining dastasidan tutib, ortga oxirigacha tortish (qayta o'qlash)\n3. Tutilish bartaraf etilmasa, sababini aniqlash va bartaraf etish","options":{"A":"3, 2, 1","B":"2, 1, 3","C":"2, 3, 1","D":"1, 2, 3"},"answer":"B","explanation":"Tutilishni avval avtomatni qayta o'qlash bilan bartaraf etishga urinib ko'riladi — zatvor ramasi dastasidan tutib ortga oxirigacha tortiladi va otish davom ettiriladi. Faqat tutilish shundan keyin ham bartaraf etilmasa, uning sababi aniqlanadi.","mnemonic":"Qayta o'qla — ot — bo'lmasa sababini qidir.","id":1082},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otishdagi tutilishlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 31-§, jadval: tutilishlar va sabablari — patron uzatilmadi, o'q uzilmadi, zatvor ramasi qaytmasligi","requires_image":false,"question":"Otishdagi tutilishlarni ularning sabablari bilan moslashtiring:\n1. Patron uzatilmadi\n2. O'q uzilmadi (kapsulda urilish izi kuchsiz)\n3. Zatvor ramasining oldingi holatga qaytmasligi\nA. Zarbdor yoki zarbdor-tepki mexanizmning nosozligi\nB. Qaytaruvchi prujinaning buzilganligi\nC. O'qdonning ifloslangani yoki nosozligi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-A, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Patron uzatilmasligiga o'qdonning ifloslangani yoki nosozligi sabab bo'ladi. Kapsulda urilish izi yo'q yoki kuchsiz bo'lsa, zarbdor yoki zarbdor-tepki mexanizm nosozligidan o'q uzilmaydi. Zatvor ramasi oldingi holatga qaytmasa, qaytaruvchi prujina buzilgan bo'ladi.","mnemonic":"O'qdon uzatadi, zarbdor uradi, prujina qaytaradi — qaysi ishlamasa, o'sha aybdor.","id":1083},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otishdagi tutilishlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 31-§, jadval: tutilishlarni bartaraf etish usullari — patron tiqildi, zatvor ramasi qaytmasligi, gilza chiqmasligi","requires_image":false,"question":"Tutilishlarni ularni bartaraf etish usullari bilan moslashtiring:\n1. Patron stvol kesmasida tiqilib qoldi\n2. Zatvor ramasi oldingi holatga qaytmayapti\n3. Gilza stvol qutisidan uloqtirilmayapti\nA. Prujinani almashtirish (jangovar vaziyatda uchlarining joyini almashtirish)\nB. Zatvor ramasi dastasini ortga tortib gilzani uloqtirish, takrorlansa gaz yo'llarini tozalash\nC. Zatvor ramasi dastasidan tutib turgan holda tiqilgan patronni chiqarib olish","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Tiqilgan patron zatvor ramasi dastasidan tutib turgan holda chiqarib olinadi. Zatvor ramasi qaytmasa, buzilgan qaytaruvchi prujina almashtiriladi — jangovar vaziyatda uning uchlari joyi almashtirib o'rnatiladi. Gilza uloqtirilmasa, dastani ortga tortib gilza chiqariladi, takrorlansa gaz yo'llari va ishqalanuvchi qismlar tozalanadi.","mnemonic":"Tiqilsa — chiqar, qaytmasa — prujina, gilza qolsa — tozala.","id":1084},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"O'qdonni to'ldirish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 31-§: o'qdonni oboyma yordamida to'ldirish tartibi","requires_image":false,"question":"O'qdonni patronlar bilan oboyma yordamida to'ldirish bosqichlarini to'g'ri tartiblang:\n1. Patronli oboymani o'tkazgichga o'rnatish\n2. O'tkazgichni o'qdon bo'g'zidagi kesmalarga biriktirish\n3. Oboymani ajratib olib, keyingi patronli oboymani o'rnatish\n4. Ko'rsatkich barmoq bilan patronlarni bosib o'qdonga cho'ktirish","options":{"A":"1, 4, 2, 3","B":"2, 4, 1, 3","C":"2, 1, 4, 3","D":"1, 2, 4, 3"},"answer":"C","explanation":"Avval o'tkazgich o'qdon bo'g'zidagi kesmalarga biriktiriladi, keyin unga patronlar joylangan oboyma o'rnatiladi. Ko'rsatkich barmoq bilan yuqoridagi patron gilzasi tubidan bosib patronlar o'qdonga cho'ktiriladi, so'ng bo'sh oboyma ajratilib keyingisi o'rnatiladi va o'qdon oxirigacha to'ldiriladi.","mnemonic":"O'tkazgich — oboyma — bos — almashtir.","id":1085},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Shikastlanish turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 49-§: mexanik shikastlanishlar — lat yeyish, jarohat, sinish, chiqish ta'riflari","requires_image":false,"question":"Mexanik shikastlanish turlarini ularning ta'rifi bilan moslashtiring:\n1. Lat yeyish\n2. Jarohat\n3. Sinish\n4. Chiqish\nA. Teri yoki shilliq qavat butunligining buzilishi bilan kechadigan shikastlanish\nB. Suyakning bo'g'imdan chiqishi yoki bo'g'imlarning noto'g'ri joylashishi\nC. To'qimalarning siqilishi yoki urilishi, teri butunligi buzilmaydi\nD. Suyak to'qimasi yaxlitligining buzilishi","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-B, 2-A, 3-C, 4-D","D":"1-A, 2-C, 3-D, 4-B"},"answer":"B","explanation":"Lat yeyishda to'qimalar siqiladi yoki uriladi, ammo teri butunligi saqlanadi. Jarohatda teri yoki shilliq qavat butunligi buziladi. Sinish — suyak to'qimasi yaxlitligining buzilishi, chiqish esa suyakning bo'g'imdan chiqib ketishidir.","mnemonic":"Lat — ichkarida, jarohat — terida, sinish — suyakda, chiqish — bo'g'imda.","id":1086},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Shikastlanish turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 49-§: shikastlanishlar mexanik, termik, kimyoviy va biologik omillarga bo'linadi","requires_image":false,"question":"Shikastlanish misollarini ular kelib chiqadigan omil turi bilan moslashtiring:\n1. Suyak sinishi va lat yeyish\n2. Qizigan buyumdan kuyish\n3. Ishqorning teriga ta'siri\n4. Hasharot chaqishi\nA. Termik omil\nB. Biologik omil\nC. Mexanik omil\nD. Kimyoviy omil","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-C, 2-D, 3-A, 4-B","D":"1-D, 2-A, 3-B, 4-C"},"answer":"B","explanation":"Sinish va lat yeyish mexanik ta'sir natijasi. Olov, issiq suyuqlik yoki qizigan buyumdan kuyish termik shikastlanish hisoblanadi. Kislota va ishqorlar kimyoviy kuyishni keltirib chiqaradi, hasharotlar chaqishi va mikroorganizmlar ta'siri esa biologik shikastlanishdir.","mnemonic":"Zarba — mexanik, issiq — termik, kislota — kimyo, chaqish — biologiya.","id":1087},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Shok va uning turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 49-§: travmatik, gipovolemik, anafilaktik, kardiogen shok sabablari","requires_image":false,"question":"Shok turlarini ularni keltirib chiqaruvchi sabab bilan moslashtiring:\n1. Travmatik shok\n2. Gipovolemik shok\n3. Anafilaktik shok\n4. Kardiogen shok\nA. Organizmdagi suyuqlik yoki qon yo'qotish\nB. Yurak faoliyatining keskin buzilishi\nC. Og'ir jarohatlar, suyak sinishlari yoki kuyish\nD. Allergik reaksiya, masalan asalari chaqishi","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-D, 3-A, 4-B","C":"1-B, 2-A, 3-C, 4-D","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Travmatik shok og'ir jarohatlar, sinishlar, kuyish yoki operatsiyadan keyin rivojlanadi. Gipovolemik shok suyuqlik yoki qon yo'qotishdan, anafilaktik shok allergik reaksiyadan, kardiogen shok esa yurak faoliyatining keskin buzilishidan kelib chiqadi. Infeksiya rivojlanishi septik shokka olib boradi.","mnemonic":"Travma, hajm, allergiya, yurak — to'rt shokning to'rt sababi.","id":1088},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Qon ketishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 50-§: qon ketish tasnifi — anatomiyasiga, klinikasiga, aniqlanish vaqtiga ko'ra","requires_image":false,"question":"Qon ketish tasnifi belgilarini ularga mos turlar bilan moslashtiring:\n1. Anatomiyasiga ko'ra\n2. Klinikasiga ko'ra\n3. Aniqlanish vaqtiga ko'ra\nA. Tashqi, ichki, yashirin\nB. Birlamchi, erta ikkilamchi, kechki ikkilamchi\nC. Arterial, venoz, kapillyar, parenximatoz","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Anatomiyasiga ko'ra qon ketish arterial, venoz, kapillyar va parenximatoz turlarga bo'linadi. Klinikasiga ko'ra tashqi, ichki va yashirin bo'ladi. Aniqlanish vaqtiga ko'ra esa birlamchi, erta ikkilamchi va kechki ikkilamchi turlari farqlanadi. Kelib chiqish sababiga ko'ra mexanik va neyrotrofik bo'lishi mumkin.","mnemonic":"Tomir — qayerda — qachon: uch tasnif uch savolga javob.","id":1089},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Qon ketishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 50-§: arterial, venoz, kapillyar, parenximatoz qon ketish belgilari","requires_image":false,"question":"Qon ketish turlarini ularning belgilari bilan moslashtiring:\n1. Arterial qon ketish\n2. Venoz qon ketish\n3. Kapillyar qon ketish\n4. Parenximatoz qon ketish\nA. To'q qizil rangli qonning pulsatsiyasiz, sekin oqishi\nB. Jigar, taloq, buyrak shikastlanishidan kelib chiqishi\nC. Och qizil rangdagi qonning otilib chiqishi\nD. Yuzaki shikastlanishlarda uchraydigan, nisbatan xavfsiz tur","options":{"A":"1-B, 2-D, 3-C, 4-A","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Arterial qon ketishda och qizil qon otilib chiqadi va o'tkir kamqonlikka olib keladi. Venoz qon to'q qizil rangda, sekin va pulsatsiyasiz oqadi. Kapillyar qon ketish yuzaki shikastlanishlarda uchraydi va nisbatan xavfsiz. Parenximatoz tur jigar, taloq, buyrak kabi ichki a'zolar shikastlanishidan kelib chiqadi.","mnemonic":"Och qizil otiladi, to'q qizil oqadi, kapillyar sizadi, parenxima yashirin.","id":1090},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Birinchi tibbiy yordam","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 49-§: jarohat, yonish, kimyoviy kuyish va sovuq urishida birinchi yordam choralari","requires_image":false,"question":"Shikastlanish turlarini ularga ko'rsatiladigan birinchi yordam bilan moslashtiring:\n1. Jarohatlarda\n2. Yonishlarda\n3. Kimyoviy kuyishlarda\n4. Sovuq urishida\nA. Kuygan joyni sovuq suv bilan yuvib, steril bog'lam qo'yish\nB. Issiq ichimlik berish va quruq kiyim kiydirish\nC. Qon ketishini to'xtatib, antiseptik bog'lam qo'yish\nD. Ta'sir qilgan moddani suv bilan yuvib tashlash va shifokorga murojaat qilish","options":{"A":"1-D, 2-B, 3-A, 4-C","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Jarohatda avval qon ketishi to'xtatilib, antiseptik bog'lam qo'yiladi. Yonishda kuygan joy sovuq suv bilan yuvilib, steril bog'lam qo'yiladi. Kimyoviy kuyishda ta'sir qilgan modda suv bilan yuvib tashlanadi va shifokorga murojaat qilinadi. Sovuq urganda bemor isitiladi — issiq ichimlik berilib, quruq kiyim kiydiriladi.","mnemonic":"Jarohat — bog'la, kuyish — sovut, kimyo — yuv, sovuq — isit.","id":1091},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Yurak-o'pka reanimatsiyasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 52-§: cho'kkanda birinchi yordam — suvdan chiqarish, tekshirish, sun'iy nafas, yurak massaji","requires_image":false,"question":"Cho'kkan kishiga birinchi yordam ko'rsatish harakatlarining to'g'ri ketma-ketligini aniqlang:\n1. 30 marta ko'krak qafasiga bosim berish\n2. Yaradorni o'zini xavfga qo'ymagan holda suvdan chiqarish\n3. Nafas olishi va yurak urishini tekshirish\n4. Boshini orqaga egib, 2 marta chuqur puflash","options":{"A":"2, 3, 4, 1","B":"2, 3, 1, 4","C":"2, 4, 3, 1","D":"3, 2, 4, 1"},"answer":"A","explanation":"Avval yarador o'zini xavfga qo'ymagan holda suvdan chiqariladi, so'ng nafas olishi va yurak urishi tekshiriladi. Hushsiz bo'lsa, boshi orqaga egilib og'iz bo'shlig'i tekshiriladi va 2 marta chuqur puflanadi, nafas bo'lmasa 30 marta ko'krak qafasiga bosim beriladi — har 30 bosimdan keyin 2 marta sun'iy nafas takrorlanadi.","mnemonic":"Chiqar — tekshir — pufla — bos.","id":1092},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Yurak-o'pka reanimatsiyasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 50-§: og'izdan og'izga sun'iy nafas oldirish tartibi","requires_image":false,"question":"\"Og'izdan og'izga\" usulida sun'iy nafas oldirish harakatlarini to'g'ri tartiblang:\n1. Ko'rsatkich barmoq bilan burunning ikki katagini qisish\n2. Bemorning boshini orqaga engashtirib, iyagini maksimal ko'tarish\n3. Havoni 2 marta sekinlik bilan o'pkaga puflab kiritish\n4. Chuqur nafas olib, og'izni bemor og'ziga qo'yish","options":{"A":"2, 1, 4, 3","B":"4, 1, 2, 3","C":"2, 4, 1, 3","D":"1, 2, 4, 3"},"answer":"A","explanation":"Reanimator bemorning bosh tomonida turib avval boshini orqaga engashtiradi va iyagini ko'taradi, bir qo'li bilan boshni ushlagan holda ko'rsatkich barmoq bilan burun kataklarini qisadi. So'ng chuqur nafas olib og'zini bemor og'ziga qo'yadi va havoni 2 marta, har biri 1-2 soniya davomida, sekin puflab kiritadi.","mnemonic":"Engashtir — qis — nafas ol — pufla.","id":1093},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Suyak sinishi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 51-§: suyak yopiq singanda yordam — og'riq qoldirish, immobilizatsiya, shifoxonaga yetkazish","requires_image":false,"question":"Suyak yopiq singanda birinchi tibbiy yordam harakatlarining to'g'ri ketma-ketligini aniqlang:\n1. Shikastlangan bemorni shifoxonaga olib borish\n2. Og'riqni qoldiruvchi vosita berish\n3. Shikastlangan sohani immobilizatsiya qilish","options":{"A":"1, 2, 3","B":"2, 3, 1","C":"3, 2, 1","D":"2, 1, 3"},"answer":"B","explanation":"Yopiq sinishda avval og'riq qoldiruvchi vosita beriladi — bu shok rivojlanishining oldini oladi. So'ng shikastlangan soha shina yordamida immobilizatsiya qilinadi va shundan keyingina bemor shifoxonaga olib boriladi.","mnemonic":"Og'riqni bos — qotir — yetkaz.","id":1094},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Suyak sinishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 51-§: sinish belgilari — og'riq, deformatsiya, funksiya buzilishi, g'ichirlash","requires_image":false,"question":"Suyak sinishi belgilarini ularning namoyon bo'lishi bilan moslashtiring:\n1. Og'riq\n2. Deformatsiya\n3. Funksiyaning buzilishi\n4. Suyaklarning g'ichirlashi\nA. Singan joyning shaklini sog' joyga solishtirganda farq ko'rinishi\nB. Suyak parchalarining bir-biriga nisbatan siljishida eshitilishi\nC. Singan joyni paypaslab ko'rilganda kuchayishi\nD. Harakat qilishga uringanda shu sohada harakatning yo'qolishi","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-B, 2-A, 3-D, 4-C","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Singan joy paypaslab ko'rilganda kuchli og'riq paydo bo'ladi. Suyak parchalari siljiganda joy deformatsiyalanadi — buni sog' tomon bilan solishtirib aniqlash mumkin. Funksiya buzilishi barcha sinishda kuzatiladi: harakatga uringanda og'riq kuchayib, harakat yo'qoladi. Parchalar bir-biriga nisbatan siljiganda esa g'ichirlash eshitiladi.","mnemonic":"Og'riydi, qiyshayadi, ishlamaydi, g'ichirlaydi.","id":1095},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Immobilizatsiya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 51-§: yelka, boldir va bilak singanda narvonsimon shina qo'yish joylari","requires_image":false,"question":"Singan suyakni narvonsimon shina qo'yish tartibi bilan moslashtiring:\n1. Yelka suyagi singanda\n2. Boldir suyagi singanda\n3. Bilak suyagi singanda\nA. Sonning uchdan bir qismidan orqa tomon barmoq uchlarigacha, tizza va to'piqni harakatsizlantirib\nB. Yelkaning uchdan bir qismidan barmoq uchlarigacha tashqi tomondan\nC. Yelka ustidan boshlab, orqa tomondan bukilgan tirsak va bilak bo'ylab barmoqlarga","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Yelka singanda katta narvonsimon shina yelka ustidan boshlab orqa tomondan bukilgan tirsak va bilak bo'ylab barmoqlarga o'tkaziladi. Boldir singanda shina sonning uchdan biridan barmoq uchlarigacha qo'yilib, tizza va to'piqni harakatsizlantirishi shart. Bilak singanda esa yelkaning uchdan biridan barmoq uchlarigacha tashqi tomondan qo'yiladi.","mnemonic":"Shina ikki qo'shni bo'g'imni ham qotirsin.","id":1096},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Oftob va sovuq urishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 52-§: oftob urishida harorat 40-41°C, sovuq urishida 35°C dan past, isitish 37-40°C suvda","requires_image":false,"question":"Holatlarni ularga tegishli harorat ko'rsatkichlari bilan moslashtiring:\n1. Oftob urganda tana harorati\n2. Sovuq urishi boshlanadigan tana harorati\n3. Muzlagan a'zolarni isitish uchun suv harorati\nA. 35°C dan past\nB. 37-40°C\nC. 40-41°C gacha ko'tarilishi","options":{"A":"1-A, 2-C, 3-B","B":"1-B, 2-A, 3-C","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Oftob urganda tana harorati 40-41°C gacha ko'tarilib, teri qizaradi va kuchli terlash kuzatiladi. Sovuq urishi tana harorati 35°C dan pastga tushganda boshlanadi. Muzlagan a'zolar 37-40°C li suvda asta-sekin isitiladi, qattiq ishqalash esa mumkin emas.","mnemonic":"41 — qaynoq, 35 — xavf chegarasi, 37-40 — davo suvi.","id":1097},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Oftob va sovuq urishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 52-§: sovuq urishining yengil, o'rta va og'ir bosqich belgilari","requires_image":false,"question":"Sovuq urishi bosqichlarini ularning belgilari bilan moslashtiring:\n1. Yengil bosqich\n2. O'rta bosqich\n3. Og'ir bosqich\nA. Kuchli qaltirash, gapirishda qiyinchilik, harakatlarning sustlashishi\nB. Ongning buzilishi, terining ko'karishi, hushdan ketish\nC. Qaltirash, terining oqarishi va sovuq bo'lishi","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Yengil bosqichda qaltirash va terining oqarib sovushi kuzatiladi. O'rta bosqichda qaltirash kuchayib, gapirish qiyinlashadi va harakatlar sustlashadi. Og'ir bosqichda ong buziladi, teri ko'karadi, nafas va yurak urishi sekinlashib, hushdan ketish ro'y beradi.","mnemonic":"Oqardi — sustlashdi — ko'kardi: uch bosqich uch rang.","id":1098},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Cho'kish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 52-§: suvga cho'kishning boshlang'ich, o'rta va og'ir bosqich belgilari","requires_image":false,"question":"Suvga cho'kish bosqichlarini ularning belgilari bilan moslashtiring:\n1. Boshlang'ich bosqich\n2. O'rta bosqich\n3. Og'ir bosqich\nA. Suvostiga cho'kib qayta suzib chiqishga harakat, lab va terida ko'karish\nB. Hushdan ketish, yurak urishi va nafasning to'xtashi, tananing harakatsiz qolishi\nC. Suv yuzasida qaltirash, oyoq-qo'llardagi sanchiq, qo'rqish va vahima","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-B, 3-A","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Boshlang'ich bosqichda cho'kayotgan odam suv yuzasida qaltiraydi, oyoq-qo'llarida sanchiq turadi, qo'rquv va vahima holatida bo'ladi. O'rta bosqichda suvostiga cho'kib qayta chiqishga urinadi, nafas ololmay labi va terisi ko'karadi. Og'ir bosqichda hushdan ketadi, yurak urishi va nafas to'xtab, tana suvda harakatsiz qoladi.","mnemonic":"Vahima — kurash — sukunat.","id":1099},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Oftob va sovuq urishi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 52-§: oftob urganda birinchi yordam choralari tartibi","requires_image":false,"question":"Oftob urgan kishiga birinchi yordam ko'rsatish harakatlarini to'g'ri tartiblang:\n1. Muzli kompresslarni peshona, bo'yin va qo'ltiq ostiga qo'yish\n2. Yaradorni salqin, soyali joyga olib chiqish\n3. Iliq suv yoki elektrolitli ichimliklar ichirish\n4. Tor kiyimlarni yechish yoki bo'shatish","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"2, 4, 3, 1","D":"4, 2, 1, 3"},"answer":"A","explanation":"Avval yarador issiq joydan salqin, soyali yoki shamol aylanayotgan joyga olib chiqiladi. Keyin badani erkin bo'lishi uchun tor kiyimlari bo'shatiladi, sovitish choralari ko'riladi — badanga nam sochiq, peshona, bo'yin va qo'ltiq ostiga muzli kompress qo'yiladi. Shundan so'ng iliq suv yoki elektrolitli ichimliklar ichiriladi; alkogol va kofein berish mumkin emas.","mnemonic":"Soyaga — yechintir — sovut — ichir.","id":1100},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf Nizomi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: Saf Nizomi Mudofaa vazirligi tomonidan 2025-yil 20-mayda tasdiqlangan, 7 bo'lim 194 modda","requires_image":false,"question":"O'zbekiston Respublikasi Qurolli Kuchlari Saf Nizomiga oid ma'lumotlarni moslashtiring:\n1. Nizomni tasdiqlagan organ\n2. Tasdiqlangan sana\n3. Nizomning tarkibi\nA. 2025-yil 20-may\nB. 7 bo'lim, 194 modda\nC. Mudofaa vazirligi","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Qurolli Kuchlarning Saf Nizomi Mudofaa vazirligi tomonidan 2025-yil 20-mayda tasdiqlangan bo'lib, 7 bo'lim va 194 moddadan iborat. Nizom talablari harbiy xizmat nazarda tutilgan barcha vazirlik va idoralarga tatbiq etiladi.","mnemonic":"2025-yil 20-may: 7 bo'lim, 194 modda.","id":1101},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: sherenga, kolonna, qator, front tushunchalari","requires_image":false,"question":"Saf tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Sherenga\n2. Kolonna\n3. Qator\n4. Front\nA. Harbiy xizmatchilarning belgilangan distansiyada bir-birining ortida joylashuvi\nB. Safning harbiy xizmatchilar yuzlanib turgan tomoni\nC. Harbiy xizmatchilarning bir chiziqda, intervalni saqlab yonma-yon turgan safi\nD. Ikki nafar harbiy xizmatchining ikki sherengali safda ketma-ket turgan holati","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-B, 2-A, 3-C, 4-D","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"Sherenga — bir chiziqda yonma-yon turgan saf, kolonna esa bir-birining ortida joylashuv. Qator deb ikki sherengali safda ketma-ket turgan ikki harbiy xizmatchiga aytiladi. Front — safning harbiy xizmatchilar yuzlanib turgan tomoni, unga qarama-qarshi tomon saf orti deyiladi.","mnemonic":"Sherenga — yonma-yon, kolonna — ketma-ket, qator — juftlik, front — yuz.","id":1102},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: interval, distansiya, saf eni, saf uzunligi ta'riflari","requires_image":false,"question":"Safdagi masofa tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Interval\n2. Distansiya\n3. Saf eni\n4. Saf uzunligi\nA. Saf uzunligi bo'ylab harbiy xizmatchilar o'rtasidagi masofa\nB. Birinchi sherenga bilan oxirgi sherenga o'rtasidagi masofa\nC. Front bo'ylab harbiy xizmatchilar o'rtasidagi masofa\nD. Qanotlar o'rtasidagi masofa","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-D, 2-B, 3-C, 4-A","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Interval front bo'ylab, distansiya esa saf uzunligi bo'ylab o'lchanadigan masofa. Saf eni qanotlar o'rtasidagi, saf uzunligi esa birinchi sherenga bilan oxirgi sherenga (oldinda va ortda turgan harbiy xizmatchilar) o'rtasidagi masofani bildiradi.","mnemonic":"Interval — eniga, distansiya — bo'yiga.","id":1103},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: qanot, saf orti, yetakchi, oxirida boruvchi tushunchalari","requires_image":false,"question":"Saf tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Qanot\n2. Saf orti\n3. Yetakchi\n4. Oxirida boruvchi\nA. Safning frontga qarama-qarshi tomoni\nB. Kolonnaning oxirida borayotgan harbiy xizmatchi\nC. Safning o'ng va chap tomoni\nD. Tayinlangan yo'nalishda bosh bo'lib borayotgan harbiy xizmatchi","options":{"A":"1-C, 2-A, 3-D, 4-B","B":"1-B, 2-D, 3-A, 4-C","C":"1-C, 2-D, 3-A, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"A","explanation":"Qanot — safning o'ng va chap tomoni bo'lib, saf burilganda qanotlar nomi o'zgarmaydi. Saf orti frontga qarama-qarshi tomon. Yetakchi tayinlangan yo'nalishda bosh bo'lib boradi va qolganlar harakatini unga moslashtiradi, kolonna oxirida borayotgan esa oxirida boruvchi deyiladi.","mnemonic":"Qanot yonda, ort orqada, yetakchi oldinda.","id":1104},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Komandalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 10-§: dastlabki va ijro komandalari, \"QOLDIRILSIN!\" komandasi","requires_image":false,"question":"Komanda turlarini ularning berilish va bajarilish xususiyati bilan moslashtiring:\n1. Dastlabki komanda\n2. Ijro komandasi\n3. \"QOLDIRILSIN!\" komandasi\nA. Tanaffusdan so'ng baland, qisqa va aniq berilib, zudlik bilan bajariladi\nB. Saf amalini bekor qiladi — ijroga qadar bo'lgan holat qabul qilinadi\nC. Aniq, baland va cho'ziq tarzda beriladi","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-C, 3-B","C":"1-C, 2-A, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Dastlabki komanda safda turganlar qanday harakat talab qilinayotganini anglashlari uchun cho'ziq beriladi va unga binoan qad rostlanadi. Ijro komandasi tanaffusdan keyin baland, qisqa va aniq berilib, zudlik bilan bajariladi. \"QOLDIRILSIN!\" komandasi amalni bekor qiladi — ijroga qadar bo'lgan holatga qaytiladi.","mnemonic":"Cho'ziq — tayyorlan, qisqa — bajar, qoldirilsin — orqaga.","id":1105},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Harakatlanish me'yorlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 12-§: qadamlab yurish 110-120 qadam/daq, 70-80 cm; yugurish 165-180 qadam/daq, 85-90 cm","requires_image":false,"question":"Harakat turlarini ularning belgilangan me'yorlari bilan moslashtiring:\n1. Qadamlab yurish tezligi (daqiqada)\n2. Yugurish tezligi (daqiqada)\n3. Qadamlab yurishda qadam uzunligi\n4. Yugurishda qadam uzunligi\nA. 165-180 qadam\nB. 85-90 cm\nC. 110-120 qadam\nD. 70-80 cm","options":{"A":"1-C, 2-A, 3-B, 4-D","B":"1-D, 2-B, 3-C, 4-A","C":"1-A, 2-C, 3-D, 4-B","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Qadamlab yurish daqiqada 110-120 qadam tezlikda, har qadam 70-80 cm uzunlikda bajariladi. Yugurish esa daqiqada 165-180 qadam tezlikda, qadam uzunligi 85-90 cm bo'ladi. Shaxdam qadamda oyoq uchi 15-20 cm ko'tarilib, yerga butun kaft bilan bosiladi.","mnemonic":"Yurish: 110-120 va 70-80; yugurish: 165-180 va 85-90.","id":1106},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Joyda turib burilish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 11-§: ortga/chapga burilish chap poshna va o'ng oyoq uchida, o'ngga — o'ng poshna va chap oyoq uchida","requires_image":false,"question":"Joyda turib burilish amallarini ularning bajarilish usuli bilan moslashtiring:\n1. Ortga va chapga burilish\n2. O'ngga burilish\n3. Burilishning ikkinchi amali\nA. O'ng poshna va chap oyoq uchida turgan holda bajariladi\nB. Ortda qolgan oyoq to'g'ri tortilib, oldingi oyoqqa taqaladi\nC. Chap poshna va o'ng oyoq uchida turgan holda bajariladi","options":{"A":"1-C, 2-B, 3-A","B":"1-C, 2-A, 3-B","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"B","explanation":"Ortga va chapga burilish chap poshna va o'ng oyoq uchida, chap qo'l tomonga burilib bajariladi. O'ngga burilish esa o'ng poshna va chap oyoq uchida bajariladi. Har ikki holda birinchi amalda tana vazni oldindagi oyoqqa o'tkaziladi, ikkinchi amalda ortda qolgan oyoq oldingisiga taqaladi.","mnemonic":"Qaysi tomonga burilsang — o'sha tomon poshnasida.","id":1107},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Safdan chiqish va safga qaytish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","sour
