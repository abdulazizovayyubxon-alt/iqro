ya"},"answer":"B","explanation":"Doktrinada milliy xavfsizlik konsepsiyasi asosiy prinsip sifatida ta’kidlangan; boshqa variantlar matnda keltirilmagan.","mnemonic":"Xavfsizlik – doktrinasi asosi.","id":288},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Xalqaro huquq","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrina BMT Ustavining prinsiplari va normalariga tayanadi","requires_image":false,"question":"Mudofaa Doktrinasi qaysi xalqaro huquq normativiga asoslanadi?","options":{"A":"NATO shartnomasi","B":"OSCE protokoli","C":"BMT Ustavi","D":"SCO bitimlari"},"answer":"C","explanation":"Doktrina BMT Ustavining prinsiplari va normalariga tayanishi ko‘rsatilgan; boshqa xalqaro hujjatlar keltirilmagan.","mnemonic":"BMT – doktrina poydevori.","id":289},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Harbiy‑strategik jihatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrinaning harbiy‑strategik jihatlari","requires_image":false,"question":"Doktrinada harbiy‑strategik jihatning asosiy yo‘nalishi qaysi?","options":{"A":"Sanoat mahsulotlarini eksport qilish","B":"Turizmni rivojlantirish","C":"Agrar siyosatni mustahkamlash","D":"Milliy xavfsizlik tahdidlarini tahlil qilish"},"answer":"D","explanation":"Harbiy‑strategik jihat milliy xavfsizlik tahdidlarini tahlil qilishga yo‘naltirilgan; boshqa variantlar strategik jihatga oid emas.","mnemonic":"Strategiya – xavfsizlik tahlili.","id":290},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Harbiy‑iqtisodiy jihatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrinaning harbiy‑iqtisodiy jihatlari","requires_image":false,"question":"Doktrinaning harbiy‑iqtisodiy jihatlari qaysi yo‘nalishga qaratilgan?","options":{"A":"Madaniy merosni saqlash","B":"Mikrofinansni rivojlantirish","C":"Kengash siyosatini belgilash","D":"Qurolli kuchlarni tayyorlash va qurish"},"answer":"D","explanation":"Harbiy‑iqtisodiy jihatlar qurolli kuchlarni tayyorlash, qurish va qo‘llashga aloqador; boshqa variantlar iqtisodiy yo‘nalishga mos kelmaydi.","mnemonic":"Iqtisod – qurolli tayyorlash.","id":291},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Xalqaro hamkorlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Markaziy Osiyoda xalqaro va mintaqaviy hamkorlik, xavfsizlik, barqarorlik","requires_image":false,"question":"Doktrinada Markaziy Osiyo mintaqasida qaysi yo‘nalish asosiy ahamiyatga ega?","options":{"A":"Xalqaro hamkorlik va xavfsizlik","B":"Kengaytirilgan turizm","C":"Sport musobaqalari tashkil etish","D":"Mahalliy savdo bozorini rivojlantirish"},"answer":"A","explanation":"Mintaqaviy hamkorlik, xavfsizlik, barqarorlikni mustahkamlash mudofaa doktrinasi maqsadi sifatida ko‘rsatilgan; boshqa variantlar matnda yo‘q.","mnemonic":"Mintaqa – hamkorlik, xavfsizlik.","id":292},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Harbiy‑siyosiy jihatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Doktrina milliy manfaatlar, jahon va mintaqaviy harbiy‑siyosiy vaziyatni inobatga oladi","requires_image":false,"question":"Doktrinada harbiy‑siyosiy jihatlarning asosiy manbai nima?","options":{"A":"Ijtimoiy madaniyat","B":"Tashqi savdo balansi","C":"Mahalliy sanoat savdosi","D":"Mamlakatning milliy manfaatlari"},"answer":"D","explanation":"Harbiy‑siyosiy jihatlar mamlakatning milliy manfaatlari, xalqaro vaziyatga asoslanadi; boshqa variantlar keltirilmagan.","mnemonic":"Siyosat – milliy manfaat.","id":293},{"subject":"Harbiy ta'lim","topic":"Mudofaa doktrinasi","subtopic":"Harbiy‑strategik prinsiplari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Doktrinada harbiy‑strategik, siyosiy, iqtisodiy jihatlar alohida bo‘limlarda tasvirlangan","requires_image":false,"question":"Doktrinada ko‘rsatilgan bo‘limlarni ularning mazmuni bilan moslashtiring:\n1. Harbiy‑siyosiy jihatlar\n2. Harbiy‑strategik jihatlar\n3. Harbiy‑iqtisodiy jihatlar\nA. Milliy manfaatlar va global tahdidlar\nB. Qurolli kuchlarni tayyorlash va qurish\nC. Mudofaa siyosatining asosiy qoidalari","options":{"A":"1-A, 2-B, 3-C","B":"1-C, 2-A, 3-B","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"Harbiy‑siyosiy jihatlar (1) milliy manfaatlar va global tahdidlarni o‘z ichiga oladi – A. Harbiy‑strategik jihatlar (2) mudofaa siyosatining asosiy qoidalari – C. Harbiy‑iqtisodiy jihatlar (3) qurolli kuchlarni tayyorlash – B.","mnemonic":"Siyosiy‑A, Strategik‑C, Iqtisod‑B.","id":294},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizom Nizomi asoslari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Intizom Nizomi harbiy intizomning mohiyati, rag'batlantirish va intizomiy ta'zirlarga oid ma'lumot","requires_image":false,"question":"Intizom Nizomi harbiy intizomning qaysi jihatlarini belgilaydi?","options":{"A":"Mohiyati, rag'batlantirish, intizomiy ta'zirlari","B":"Faqat intizomiy ta'zirlari, boshqa jihatlarni o'z ichiga olmaydi","C":"Faqat rag'batlantirish, intizomiy ta'zirlari, amaliy mashg'ulotlar","D":"Yuridik vakolatlari, moliyaviy imtiyozlari, harbiy texnikasi"},"answer":"A","explanation":"Intizom Nizomi intizomning mohiyati, rag'batlantirish va intizomiy ta'zirlarga oid qoidalarni belgilaydi. B bandida keltirilgan boshqa elementlar Nizomda ko'rsatilmagan. C va D esa ma'lumotni cheklaydi yoki noto'g'ri qo'shimchalar kiritadi.","mnemonic":"Mohi‑Rag‑Ta'z — intizomning uchta ustuni","id":295},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizom Nizomi tarkibi","difficulty":"Y1","bloom_level":"Bilish","qtype":"matching","source_construct":"Intizom Nizomi tarkibi: intizomning mohiyati, rag'batlantirish, intizomiy ta'zir, majburiyatlar, huquqlar","requires_image":false,"question":"Intizom Nizomi tarkibidagi elementlarni ularning tavsifi bilan moslashtiring:\n1. Mohiyati\n2. Rag'batlantirish\n3. Intizomiy ta'zir\n4. Majburiyatlar\nA. Harbiy xizmatchining qonunlarga rioya qilishi\nB. Nizomning umumiy maqsadi va mohiyati\nC. Xizmatni yaxshilash uchun mukofotlar\nD. Jazaviy choralar va tartib","options":{"A":"1-B, 2-C, 3-D, 4-A","B":"1-C, 2-B, 3-A, 4-D","C":"1-A, 2-D, 3-C, 4-B","D":"1-D, 2-A, 3-B, 4-C"},"answer":"A","explanation":"Mohiyati Nizomning umumiy maqsadi – B. Rag'batlantirish xizmatni mukofotlash – C. Intizomiy ta'zir jazaviy choralar – D. Majburiyatlar qonunlarga rioya qilish – A. Shuning uchun 1‑B, 2‑C, 3‑D, 4‑A to'g'ri.","mnemonic":"Mohi‑Rag‑Ta'z‑Maj – B‑C‑D‑A","id":296},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomga rioya qilish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Intizomga rioya qilish jarayoni: qonunlarga rioya, qasamyodga sodiqlik, intizomiy jazolarni qabul qilish, rag'batlantirishga erishish","requires_image":false,"question":"Intizomga rioya qilish jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Intizomiy jazolarni qabul qilish\n2. Qonunlarga rioya qilish\n3. Qasamyodga sodiqlik\n4. Rag'batlantirishga erishish","options":{"A":"3, 2, 1, 4","B":"2, 1, 3, 4","C":"2, 3, 1, 4","D":"1, 2, 3, 4"},"answer":"C","explanation":"Birinchi qadam qonunlarga rioya qilish, ikkinchi qadam qasamyodga sodiqlik, uchinchi qadam intizomiy jazolarni tan olish, oxirgi qadam rag'batlantirishga erishish. Shunday qilib 2‑3‑1‑4 to'g'ri.","mnemonic":"Qonun‑Qasamyod‑Jazo‑Rag'bat","id":297},{"subject":"Harbiy ta'lim","topic":"Intizom","subtopic":"Intizomga rioya qilish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Intizomni saqlash jarayoni: maqsadni belgilash, nazorat, rag'batlantirish, jazoni qo‘llash","requires_image":false,"question":"Intizomni saqlash bosqichlarini to‘g‘ri tartibda qo‘ying:\n1. Rag'batlantirish\n2. Nazorat\n3. Maqsadni belgilash\n4. Jazoni qo‘llash","options":{"A":"3, 2, 1, 4","B":"2, 3, 1, 4","C":"1, 3, 2, 4","D":"3, 1, 2, 4"},"answer":"A","explanation":"Avvalo maqsad belgilanadi, keyin nazorat olib boriladi, rag'batlantirish amalga oshiriladi va oxirida zarur bo‘lsa jazolar qo‘llanadi. Shuning uchun 3‑2‑1‑4 to‘g‘ri.","mnemonic":"Maqsad‑Nazorat‑Rag'bat‑Jazo","id":298},{"subject":"Harbiy ta'lim","topic":"Rag'batlantirish","subtopic":"Tanlov mezonlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Rag'batlantirish turi tanlanganda xizmatning tavsifi yoki shaxsiy hissasi inobatga olinadi","requires_image":false,"question":"Rag'batlantirish turini tanlashda eng asosiy mezon nima?","options":{"A":"Yuqori maosh darajasi","B":": Xodimning oilaviy holati","C":"Xizmat tavsifi yoki shaxsiy hissasi","D":"Ko'rinishdagi uniforma ranglari"},"answer":"C","explanation":"Rag'batlantirish turi tanlanayotganda xizmat tavsifi yoki shaxsiy hissasi inobatga olinadi, boshqa variantlar keltirilmagan.","mnemonic":"Tavsif‑hissa – rag'bat tanlovining asosi","id":299},{"subject":"Harbiy ta'lim","topic":"Intizom Nizomi","subtopic":"Qoidalar ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Intizom Nizomi talablari: (1) Qonunlarga rioya, (2) Vatan qasamyodiga sodiqlik, (3) Harbiy burchni bajarish, (4) Sirlarni saqlash","requires_image":false,"question":"Intizom Nizomi bo'yicha harbiy xodimdan talab qilinadigan asosiy bosqichlarni to'g'ri tartibda joylashtiring:\n1. Harbiy burchni mohirlik bilan bajarish\n2. Vatan qasamyodiga sodiqlik\n3. Qonunlarga qat'iy rioya qilish\n4. Harbiy sirlarni qat'iy saqlash","options":{"A":"3, 1, 2, 4","B":"3, 2, 1, 4","C":"2, 3, 1, 4","D":"2, 4, 3, 1"},"answer":"B","explanation":"Birinchi navbatda qonunlarga rioya qilish (3), keyin qasamyodga sodiqlik (2), undan so'ng burchni bajarish (1), oxirida sirlarni saqlash (4). Shu tartib A variantida ko'rsatilgan.","mnemonic":"Qonun‑qasam‑burch‑sir – to'g'ri yo'l","id":300},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Qo‘llash shartlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizomiy ta'zir qo‘llash taqiqlari bo‘limi","requires_image":false,"question":"Quyidagi holatlarning qaysi biri intizomiy ta'zir qo‘llashga ruxsat etilmaydi?","options":{"A":"Intizomiy ta'zirni birinchi marta qo‘llash","B":"Hayfsan jazosi","C":"Aybdor bo‘lmagan shaxsga nisbatan ta'zir qo‘llash","D":"Yuqori harbiy ta'lim muassasasidan chetlashtirish"},"answer":"C","explanation":"Aybdor bo‘lmagan shaxsga intizomiy ta'zir qo‘llash taqiqlanganligi aytilgan; boshqa holatlar ruxsat etilgan.","mnemonic":"Aybdor bo‘lsa, jazoni qo‘llash.","id":301},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Maksimal qo‘llaniladigan ta'zir","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Har bir xodimga faqat bitta intizomiy ta'zir qo‘llaniladi","requires_image":false,"question":"Harbiy xodimga bir vaqtning o‘zida bir nechta intizomiy ta'zir qo‘llash mumkinmi?","options":{"A":"Ha, har qanday son","B":"Ha, bir nechta, ammo bir xil turdagi","C":"Yo‘q, faqat bitta","D":"Ha, uchta"},"answer":"C","explanation":"Har bir xodimga faqat bitta intizomiy ta'zir qo‘llaniladi deyilgan.","mnemonic":"Bir xodim, bir ta'zir.","id":302},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Ta'zir qo‘llashga taqiqlangan vaziyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizomiy ta'zir choralarini qo‘llash taqiqlanadi: ... harbiy xizmatchiga nisbatan ma’muriy javobgarlik chorasi qo‘llangandan so‘ng","requires_image":false,"question":"Harbiy xodimga ma’muriy javobgarlik chorasi qo‘llangandan keyin, intizomiy ta'zir qo‘llash mumkinmi?","options":{"A":"Yo‘q, bu holatda ta'zir qo‘llash taqiqlanadi","B":"Har qanday intizomiy ta'zir qo‘llanadi","C":"Faqat hayfsan beriladi","D":"Ha, qo‘shma jazolar qo‘llash mumkin"},"answer":"A","explanation":"Ma’muriy javobgarlik chorasi qo‘llangandan so‘ng aynan shu ma’muriy huquqbuzarlik uchun intizomiy ta'zir qo‘llash taqiqlanganligi ko‘rsatilgan.","mnemonic":"Ma’muriy javob, intizom yo‘q.","id":303},{"subject":"Harbiy ta'lim","topic":"Rag‘batlantirish","subtopic":"Taqdirlash usullari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O‘qituvchilarni taqdirlashda foto bilan birga bayroq ko‘rsatish","requires_image":false,"question":"Muddatli harbiy xodimni 'Hurmat kitobi'ga kiritish qanday rag‘bat turiga misol bo‘ladi?","options":{"A":"Moliya mukofoti","B":"Ish o‘rni o‘zgartirish","C":"Shaxsiy qog‘ozli taqdirlash","D":"Jamoaviy sovg‘a"},"answer":"C","explanation":"'Hurmat kitobi'ga kiritish shaxsiy qog‘ozli taqdirlash sifatida ko‘rsatilgan; boshqa variantlar bu maqsadga mos kelmaydi.","mnemonic":"Kitob – shaxsiy taqdir.","id":304},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Ta'zir qo‘llash muddatlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"10 sutkagacha bo‘lgan qisqa muddatli ta'lim berish","requires_image":false,"question":"Qisqa muddatli ta'lim berish muddatining maksimal uzunligi nechaga teng?","options":{"A":"15 kun","B":"10 kun","C":"30 kun","D":"5 kun"},"answer":"B","explanation":"10 sutkagacha bo‘lgan qisqa muddatli ta'lim berish ko‘rsatilgan; shu sabab 10 kun maksimal muddat.","mnemonic":"Qisqa ta'lim – 10 kun.","id":305},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Ta'zirga qo‘llanilmasligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizomiy ta'zir choralarini qo‘llash taqiqlanadi: ... lavozimga tayinlangan kundan boshlab 3 oy davomidagi lavozimga kirishish davrida","requires_image":false,"question":"Qaysi xodimga intizomiy ta'zir qo‘llash taqiqlangan?","options":{"A":"Lavozimga kirishish 3‑oy ichida kamchilik qilgan xodim","B":"Tashkilot boshlig‘i","C":"Harbiy xizmatni tamomlagan sobiq xodim","D":"Bir yildan ortiq xizmat qilgan veteran"},"answer":"A","explanation":"Lavozimga tayinlangan kundan boshlab 3 oy ichida kamchilik qilgan xodimga intizomiy ta'zir qo‘llash taqiqlanganligi ko‘rsatilgan.","mnemonic":"Yangi lavozim – intizom yo‘q.","id":306},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Intizomiy ta'zir turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"matching","source_construct":"Intizomiy ta'zir turlari ro‘yxati","requires_image":false,"question":"Intizomiy ta'zir turlarini ularning tavsifi bilan moslashtiring:\n1. Hayfsan\n2. Javobdan mahrum qilish\n3. Oliy harbiy ta'lim muassasasidan chetlashtirish\nA. Xodimga harbiy qismga kirish huquqi berilmaydi\nB. Xodimni maqsadli kursdan chiqaradi\nC. Xodimga ma'lum muddatga harbiy xizmatdan bo‘shatish","options":{"A":"1-C, 2-A, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"Hayfsan – vaqtinchalik bo‘shatish (C); javobdan mahrum qilish – qismga kirish huquqini blokirovka (A); chetlashtirish – kursdan chiqarish (B).","mnemonic":"Hayf – bo‘sh, javob – blok, chet – kurs.","id":307},{"subject":"Harbiy ta'lim","topic":"Rag‘batlantirish","subtopic":"Rag‘bat berish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Rag‘batlantirish turlari bo‘limidagi ketma‑ketlik tavsifi","requires_image":false,"question":"Rag‘batlantirish jarayonini to‘g‘ri tartibda joylashtiring:\n1. Xodimning yutuqlarini yozma ravishda qayd etish\n2. Bayroq bilan taqdirlash\n3. Xodimga sertifikat berish\n4. O‘qituvchini 'Hurmat kitobi'ga kiritish","options":{"A":"1, 3, 2, 4","B":"4, 1, 2, 3","C":"2, 1, 4, 3","D":"1, 2, 3, 4"},"answer":"D","explanation":"Birinchi bosqichda yutuqlarni qayd etish, keyin bayroq bilan taqdirlash, undan so‘ng sertifikat, oxirida 'Hurmat kitobi'ga kiritish to‘g‘ri ketma‑ketlik.","mnemonic":"Yoz, bayroq, sertifikat, kitob.","id":308},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Intizomiy ta'zirning amaliy qo‘llanilishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Intizomiy ta'zir harbiy xodimga yozma yoki og‘zaki ravishda qo‘llaniladi","requires_image":false,"question":"Intizomiy ta'zirning qanday usulda berilishi ruxsat etilgan?","options":{"A":"Yozma yoki og‘zaki","B":"Faqat og‘zaki, yozma emas","C":"Elektron pochta orqali","D":"Faqat video"},"answer":"A","explanation":"Intizomiy ta'zir yozma yoki og‘zaki ravishda berilishi mumkinligi ko‘rsatilgan; boshqa usullar aniq aytilmagan.","mnemonic":"Yozma yoki og‘zaki – intizom.","id":309},{"subject":"Harbiy ta'lim","topic":"Rag‘batlantirish","subtopic":"Rag‘bat turkumlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Rag‘batlantirish turlari bo‘limida esdalik nishonlari keltirilgan","requires_image":false,"question":"Quyidagi variantlardan qaysi biri esdalik nishoni hisoblanadi?","options":{"A":"Kursantga o‘quv qo‘shilgani","B":"Idoraviy mukofot","C":"Xodimga qarsak berish","D":"Milodiy yillik medallar"},"answer":"D","explanation":"Esdalik nishonlari – medallar, shriqlar kabi shaklda ko‘rsatilgan; C idoraviy mukofot ham rag‘bat, lekin esdalik nishoni deb aniq medallar ko‘rsatilgan.","mnemonic":"Esdalik – medallar.","id":310},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Tarixi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"1864-yil 22-avgustdagi Jeneva konvensiyasi","requires_image":false,"question":"Jeneva konvensiyasini tasdiqlashga qaysi yilda taklifnoma yuborilgan?","options":{"A":"1885","B":"1864","C":"1863","D":"1870"},"answer":"B","explanation":"1864-yilda Shveysariya Federal kengashi taklifnoma jo'natgan; bu yil konvensiya imzolangan.","mnemonic":"Yiliga 64, konvensiya 64.","id":311},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Asosiy tamoyillar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Asosiy tamoyillar: harbiy zaruriyat, insonparvarlik, qurollar nstruct":"Tamoyillar: insonparvarlik, harbiy zaruriyat, qurollar tanlash erki","requires_image":false,"question":"Tamoyillarni ularning tavsifi bilan moslashtiring:\n1. Insonparvarlik\n2. Harbiy zaruriyat\n3. Qurollar tanlash erki\nA. Minimal zararli qurol ishlatish\nB. Jangchi va fuqarolarga azob berishni taqiqlash\nC. Harbiy maqsadga xizmat qiladigan qurol tanlash","options":{"A":"1-B, 2-A, 3-C","B":"1-B, 2-C, 3-A","C":"1-C, 2-B, 3-A","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"Insonparvarlik – azob berishni taqiqlash (B); harbiy zaruriyat – minimal zararli qurol (A); qurollar tanlash erki – maqsadga xizmat qiladigan qurol (C).","mnemonic":"Inson‑B, Zarur‑A, Qurol‑C.","id":318},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Qoidalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Jangchi va fuqarolarga nisbatan mislsiz azob-uqubat va shikast yetkazadigan qiynoq usullarini qo‘llash taqiqlanadi","requires_image":false,"question":"Quyidagi harakatlarni ularning taqiqlanish darajasi bilan moslashtiring:\n1. Kimyoviy qurol\n2. Yadro qurol\n3. Kengashga o‘quv mashg‘uloti\nA. To‘liq taqiq\nB. Cheklangan foydalanish\nC. Ruxsat etilgan","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-A, 3-C","C":"1-A, 2-B, 3-C","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Kimyoviy va yadro qurollari to‘liq taqiq (A); o‘quv mashg‘ulotlari ruxsat etilgan (C).","mnemonic":"Kimyo‑A, Yadro‑A, O‘qish‑C.","id":319},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Jarayon bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Asosiy tamoyillar: insonparvarlik, harbiy zaruriyat, qurollar tanlash erki","requires_image":false,"question":"Xalqaro insonparvarlik qonuniyatini amalga oshirish bosqichlarini to‘g‘ri tartibda joylashtiring:\n1. Tamoyillarni belgilash\n2. Qurol tanlashni nazorat qilish\n3. Yaradorlarga yordam ko‘rsatish\n4. Qoidalarni nazorat qilish","options":{"A":"1, 2, 3, 4","B":"1, 2, 4, 3","C":"2, 1, 4, 3","D":"1, 4, 2, 3"},"answer":"D","explanation":"Avvalo tamoyillar belgilanadi (1), keyin qoidalar nazorat qilinadi (4), qurol tanlash nazorati (2), oxirida yaradorlarga yordam (3).","mnemonic":"Tamoyil‑Qoid‑Qurol‑Yordam.","id":320},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Jarayon bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Jeneva konvensiyasi va keyingi qabul qilinishlari","requires_image":false,"question":"Jeneva konvensiyasining qabul qilinish bosqichlarini to‘g‘ri ketma-ketlikda joylashtiring:\n1. 1864-yil konvensiyaning imzolanishi\n2. 1907-yilgacha konvensiyani 57 davlat tan oladi\n3. 1863-yil konferensiyada yaradorlarga yordam ko‘rsatish taklifi\n4. 1864-yil taklifnoma jo‘natilishi","options":{"A":"3, 4, 1, 2","B":"3, 1, 4, 2","C":"4, 1, 3, 2","D":"4, 3, 1, 2"},"answer":"D","explanation":"Birinchi taklifnoma jo‘natilishi (4), keyin konferensiyadagi taklif (3), konvensiyaning imzolanishi (1), oxirida 57 davlat tan olishi (2).","mnemonic":"Taklif‑Taklif‑Imzo‑Tan ol.","id":321},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Jang usullari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Jangchi va fuqarolarga nisbatan mislsiz azob-uqubat va shikast yetkazadigan qiynoq usullarini qo‘llash taqiqlanadi","requires_image":false,"question":"Quyidagi usullarni ularning taqiq darajasi bilan moslashtiring:\n1. Elektrik shokli qurilma\n2. Hujumga qarshi himoya vositasi\n3. Kimyoviy spirt\nA. To‘liq taqiq\nB. Cheklangan foydalanish\nC. Ruxsat etilgan","options":{"A":"1-A, 2-C, 3-A","B":"1-C, 2-B, 3-A","C":"1-B, 2-C, 3-A","D":"1-A, 2-B, 3-C"},"answer":"A","explanation":"Elektrik shokli qurilma va kimyoviy spirt to‘liq taqiq (A); himoya vositasi ruxsat etilgan (C).","mnemonic":"Elektr‑A, Himoya‑C, Kimyo‑A.","id":322},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Jarayon bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Xalqaro insonparvarlik huquqining asosiy tamoyillari","requires_image":false,"question":"Tamoyillarni amalda qo‘llash tartibini to‘g‘ri joylashtiring:\n1. Harbiy zaruriyatni baholash\n2. Insonparvarlikka mos choralarni belgilash\n3. Qurol tanlash erkinligini cheklash\n4. Boshqaruv organlari nazoratini o‘rnatish","options":{"A":"1, 2, 3, 4","B":"2, 1, 3, 4","C":"1, 3, 2, 4","D":"2, 3, 1, 4"},"answer":"B","explanation":"Birinchi insonparvarlik choralarini belgilash (2), keyin harbiy zaruriyatni baholash (1), qurol tanlash cheklanishi (3), oxirida nazorat (4).","mnemonic":"Inson‑Zarur‑Qurol‑Nazorat.","id":323},{"subject":"Harbiy ta'lim","topic":"Harbiy huquq","subtopic":"Asosiy tamoyillar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Asosiy tamoyillar: harbiy zaruriyat, insonparvarlik, mutanosiblik","requires_image":false,"question":"Harbiy zaruriyat tamoyili qanday maqsadda qo'llanadi?","options":{"A":"Sivillarga hujum qilish","B":"Qurollarni cheklash","C":"Urushda insonparvarlikni oshirish","D":"Dushman ustidan ustunlikni ta'minlash"},"answer":"D","explanation":"Harbiy zaruriyat – urush huquqida taqiqlanmagan, dushman ustidan ustunlikni ta'minlash uchun zarur bo'lgan harakatlarni oqlovchi tamoyil.","mnemonic":"Zaruriyat – ustunlikni ta'minlaydi","id":324},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Jeneva konvensiyalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"IV konvensiya – \"Urush vaqtida tinch aholini himoya qilish\"","requires_image":false,"question":"Jeneva konvensiyalaridan qaysi biri tinch aholini himoya qilishni tartibga soladi?","options":{"A":"IV konvensiya","B":"I konvensiya","C":"III konvensiya","D":"II konvensiya"},"answer":"A","explanation":"IV konvensiya \"Urush vaqtida tinch aholini himoya qilish\" to'g'risida bo'lib, tinch aholi huquqlarini himoya qilishni belgilaydi.","mnemonic":"IV – tinchlikni himoya qiladi","id":325},{"subject":"Harbiy ta'lim","topic":"Harbiy obyektlar","subtopic":"Obyekt turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy obyektlar: qurolli kuchlarni tashkil etuvchi kishilar va asbob-anjomlar","requires_image":false,"question":"Qurolli kuchlarni tashkil etuvchi tibbiyot xodimlari harbiy obyektga kiradimi?","options":{"A":"Ha, har doim obyektga kiradi","B":"Faqat jang maydonida","C":"Faqat harbiy operatsiyalarda","D":"Yo'q, ular istisno qilinadi"},"answer":"D","explanation":"Tibbiyot xodimlari va ularning jihozlari harbiy obyektga kiruvchi kishilar va asbob-anjomlardan mustasno deb aytilgan.","mnemonic":"Tibbiyot – obyektga istisno","id":326},{"subject":"Harbiy ta'lim","topic":"Harbiy huquq","subtopic":"Urush maqsadi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Urush huquqining maqsadi – azob-uqubatlarni cheklash","requires_image":false,"question":"Urush huquqining asosiy maqsadi nima?","options":{"A":"Qurollarni ko'paytirish","B":"Dushmanga maksimal zarar yetkazish","C":"Azob-uqubatlarni imkon qadar cheklash","D":"Xalqaro siyosiy ta'sirni oshirish"},"answer":"C","explanation":"Urush huquqining maqsadi – urush keltiradigan azob-uqubatlarni imkon qadar cheklash va yengillashtirish deb belgilangan.","mnemonic":"Ma'qsad – azobni kamaytirish","id":327},{"subject":"Harbiy ta'lim","topic":"Harbiy obyektlar","subtopic":"Obyekt tahlili","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy obyektlar: muhim rol o'ynovchi joylar, bino va hududlar","requires_image":false,"question":"Quyidagi obyektlardan qaysi biri harbiy operatsiyada \"muayyan rol\"ga ega?","options":{"A":"Uy-joy majmuasi","B":"Kazarma","C":"Mehmonxona","D":"Savdo markazi"},"answer":"B","explanation":"Kazarma – qurolli kuchlar yoki ularning jihozlari joylashgan muassasa bo'lib, harbiy operatsiyalarda muhim rol o'ynaydi.","mnemonic":"Kazarma – harbiy rol","id":328},{"subject":"Harbiy ta'lim","topic":"Harbiy zaruriyat","subtopic":"Cheklashlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiy zaruriyat tamoyili urush huquqini buzishga imkon beruvchi vosita sifatida kengaytirilishi mumkin emas","requires_image":false,"question":"Harbiy zaruriyat tamoyilini qo'llashda to'g'ri tartibni tanlang:\n1. Tamoyilni kengaytirish\n2. Dushmanga ustunlikni ta'minlash\n3. Urush huquqini buzmaslik\n4. Zarur harakatni aniqlash","options":{"A":"4, 2, 1, 3","B":"2, 4, 3, 1","C":"2, 4, 1, 3","D":"4, 2, 3, 1"},"answer":"D","explanation":"Birinchi zaruriyatni aniqlash (4), keyin dushmanga ustunlikni ta'minlash (2), urush huquqini buzmaslik (3), kengaytirish (1) – oxirgi bosqichda ruxsat etilmaydi.","mnemonic":"Aniqla → Ustun → Buzma → Kengaytirma","id":329},{"subject":"Harbiy ta'lim","topic":"Harbiy obyektlar","subtopic":"Obyekt turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy obyektlar: qurolli kuchlar yoki ularning jihozlari joylashgan muassasalar, bino va joylar","requires_image":false,"question":"Quyidagilardan qaysi biri harbiy obyektga kiradi?","options":{"A":"Madaniyat markazi","B":"Ombor","C":"Markaziy bank","D":"Siyosiy partiya binosi"},"answer":"B","explanation":"Harbiy obyektlarga qurolli kuchlar yoki ularning jihozlari joylashgan muassasalar, bino va joylar kiradi; ombor bunday muassasaga misol.","mnemonic":"Ombor – harbiy obyekt","id":330},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Protokollar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"1‑to‘g‘risidagi protokol – Urush qurbonlarini himoya qilish","requires_image":false,"question":"1‑raqamli protokol nima haqida?","options":{"A":"Urush qurbonlarini himoya qilish","B":"Inshootlarni himoya qilish","C":"Qurollarni cheklash","D":"Harbiy jinoyatlar uchun sud"},"answer":"A","explanation":"1‑raqamli protokol urush qurbonlarini himoya qilishga bag‘ishlangan deb belgilangan.","mnemonic":"1 – qurbon himoyasi","id":331},{"subject":"Harbiy ta'lim","topic":"Harbiy zaruriyat","subtopic":"Tamoyilning chegaralari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Harbiy zaruriyat tamoyilini kengaytirish mumkin emas","requires_image":false,"question":"Harbiy zaruriyat tamoyilining kengaytirilishi qanday baholanadi?","options":{"A":"Cheklanadi","B":"Qabul qilinadi","C":"Majburiy bo'ladi","D":"Ruxsat etilmaydi"},"answer":"D","explanation":"Bu tamoyil urush huquqini buzishga imkon beruvchi vosita sifatida kengaytirilishi mumkin emas, ya'ni ruxsat etilmaydi.","mnemonic":"Kengaytira olmaysiz","id":332},{"subject":"Harbiy ta'lim","topic":"Jeneva konvensiyalari","subtopic":"I konvensiya","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"I konvensiya – \"Harakatdagi armiyalarda yarador va bemorlarning qismatini yaxshilash\"","requires_image":false,"question":"I konvensiya qaysi mavzuni qamrab oladi?","options":{"A":"Tinch aholi himoyasi","B":"Yarador va bemorlarning qismati","C":"Dengizdagi yaradorlar","D":"Harbiy asirlar bilan muomala"},"answer":"B","explanation":"I konvensiya \"Harakatdagi armiyalarda yarador va bemorlarning qismatini yaxshilash\" haqida yozilgan.","mnemonic":"I – yaradorlar","id":333},{"subject":"Harbiy ta'lim","topic":"Harbiy obyektlar","subtopic":"Obyekt va kombatanlar farqi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy obyektlar va kombatantlar farqlash zarurati","requires_image":false,"question":"Quyidagi elementlardan qaysi biri kombatant bo'lgani sababli harbiy obyektga kirmaydi?","options":{"A":"Kazarma","B":"Qurolli qo'shin","C":"Harbiy ombor","D":"Diniy xodim"},"answer":"D","explanation":"Tibbiyot xodimlari, diniy xodimlar va ularning jihozlari harbiy obyektga kirmasligi ko'rsatilgan.","mnemonic":"Diniy – obyektga istisno","id":334},{"subject":"Harbiy ta'lim","topic":"Kombatant xatti-harakatlari","subtopic":"Kombatantga nisbatan insonparvar munosabat","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"3. Ularga nisbatan insonparvar munosabat va himoya bo‘lishini ta’minla.","requires_image":false,"question":"Kombatantga insonparvar munosabat ko‘rsatish tartibini to‘g‘ri joylashtiring:\n1. Tibbiy yordam ko‘rsatish\n2. Qochish yo‘llarini ta’minlash\n3. Asirga aylantirish\n4. Hujumni yakunlash","options":{"A":"3, 1, 2, 4","B":"2, 1, 4, 3","C":"4, 3, 2, 1","D":"1, 2, 3, 4"},"answer":"D","explanation":"Insonparvar munosabatda avvalo tibbiy yordam (1), keyin qochish yo‘llari (2), asirga aylantirish (3) va oxirgi bosqich – hujumni yakunlash (4).","mnemonic":"Tibbiy → qochish → asir → yakun.","id":335},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tarkibi","subtopic":"Tashkilot tuzilishi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolli Kuchlar tarkibiga O'zbekiston Respublikasi Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo'shinlari, harbiy tuzilma va muassasalari kiradi.","requires_image":false,"question":"Qurolli Kuchlar tarkibiga qaysi organ kiradi?","options":{"A":"Xalqaro tashkilot","B":"Yoshlar ittifoqi","C":"Davlat xavfsizlik xizmati","D":"Mahalliy boshqarma"},"answer":"C","explanation":"Davlat xavfsizlik xizmati O'zbekiston Respublikasi Qurolli Kuchlarining tarkibiga kiradi. Mahalliy boshqarma fuqarolik, xalqaro tashkilot esa harbiy bo'lmagan organlar.","mnemonic":"Xavfsizlik – Qurolli Kuchlar tarkibi.","id":336},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tarkibi","subtopic":"Organlar ro‘yxati","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolli Kuchlar tarkibiga O'zbekiston Respublikasi Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo‘shinlari, harbiy tuzilma va muassasalari kiradi.","requires_image":false,"question":"Qurolli Kuchlar tarkibida Milliy gvardiya qanday ro‘yxatda ko‘rsatiladi?","options":{"A":"Tashkilot organlari ro‘yxatida","B":"Xavfsizlik xizmatlari orasida","C":"Sivil jamiyat tashkilotlari","D":"Xalqaro aloqalar bo‘limida"},"answer":"A","explanation":"Milliy gvardiya Qurolli Kuchlar tarkibiga kiruvchi tashkilot organlari ro‘yxatida keltirilgan.","mnemonic":"Gvardiya – tashkilot ichida.","id":337},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Tinçlik davri","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Tinçlik davrida: harbiy‑siyosiy vaziyatning rivojlanishini doimiy ravishda tizimli tahlil, ogohlantirish, rejalashtirish, baholash.","requires_image":false,"question":"Tinçlik davrida Qurolli Kuchlarning vazifalarini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Harbiy‑siyosiy vaziyatni tahlil qilish\n2. Vaziyatga mos rejalashtirish\n3. Jangovar shaylikni baholash\n4. Xabardor qilish (ogohlantirish)","options":{"A":"1,2,3,4","B":"1,4,3,2","C":"1,4,2,3","D":"1,2,4,3"},"answer":"C","explanation":"Vazifalar ketma‑ketligi: tahlil → ogohlantirish → rejalashtirish → baholash. Shuning uchun 1,4,2,3 to‘g‘ri.","mnemonic":"Tahlil, ogohlantir, reja, bahola.","id":338},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tarkibi","subtopic":"Qurolli kuchlar turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolli Kuchlar tarkibiga O'zbekiston Respublikasi Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo‘shinlari, harbiy tuzilma va muassasalari kiradi.","requires_image":false,"question":"Qurolli Kuchlar tarkibida \"Ichki ishlar\" vazirligi qanday ro‘ldagi organ sifatida ko‘rsatiladi?","options":{"A":"Sivil jamiyat","B":"Vazirlik","C":"Xalqaro tashkilot","D":"Mahalliy boshqarma"},"answer":"B","explanation":"Ichki ishlar vazirligi Qurolli Kuchlar tarkibidagi vazirlik sifatida tasvirlangan.","mnemonic":"Ichki – vazirlik, qurolli.","id":339},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Tinçlik davri","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Tinçlik davrida: harbiy‑siyosiy vaziyatga va davlatning iqtisodiy imkoniyatlariga muvofiq, Qurolli Kuchlardan foydalanishni batafsil va holatga monand rejalashtirish.","requires_image":false,"question":"Qurolli Kuchlar qanday holatga muvofiq foydalanishni rejalashtiradi?","options":{"A":"Xodimlarning ixtiyori bilan","B":"Xalqaro bosimga","C":"Davlatning iqtisodiy imkoniyatlariga","D":"Yangi texnologiyalariga"},"answer":"C","explanation":"Rejalashtirish davlatning iqtisodiy imkoniyatlariga muvofiq amalga oshiriladi.","mnemonic":"Iqtisodiy – reja.","id":340},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tarkibi","subtopic":"Tashkilotlar ro‘yxati","difficulty":"Y1","bloom_level":"Bilish","qtype":"matching","source_construct":"Qurolli Kuchlar tarkibiga O'zbekiston Respublikasi Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo‘shinlari, harbiy tuzilma va muassasalari kiradi.","requires_image":false,"question":"Qurolli Kuchlar tarkibidagi organlarni ularning boshqaruv darajasi bilan moslashtiring:\n1. Milliy gvardiya\n2. Davlat xavfsizlik xizmati\n3. Ichki ishlar vazirligi\nA. Vazirlik\nB. Xizmat\nC. Maxsus boshqaruv organi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Milliy gvardiya maxsus boshqaruv organi (C), Davlat xavfsizlik xizmati xizmat (B), Ichki ishlar vazirligi vazirlik (A). Shuning uchun 1-C,2-B,3-A to‘g‘ri.","mnemonic":"Gvardiya – maxsus, Xavfsizlik – xizmat, Ichki – vazirlik.","id":341},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Tinçlik davri","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Tinçlik davrida: harbiy‑siyosiy vaziyatning rivojlanishini doimiy ravishda tizimli tahlil va prognoz qilish.","requires_image":false,"question":"Qurolli Kuchlar tinçlik davrida qanday ma'lumotni doimiy ravishda tahlil qiladi?","options":{"A":"Iqlim o‘zgarishi","B":"Harbiy‑siyosiy vaziyat","C":"Savdo statistikasi","D":"Madaniy tadbirlar"},"answer":"B","explanation":"Tinçlik davrida harbiy‑siyosiy vaziyatni doimiy tahlil qilish ko‘rsatilgan.","mnemonic":"Tinçlik – harbiy‑siyosiy tahlil.","id":342},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Tinçlik davri","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Tinçlik davrida: boshqaruv organlari va qo‘shinlarning jangovar shayligini hamda jangovar qobiliyatini qurolli mojarolarni oldini olish maqsadida baholash.","requires_image":false,"question":"Qurolli mojarolarni oldini olish uchun baholash qaysi ikki jihatni o‘z ichiga oladi?","options":{"A":"Xodimlarning ma'naviyati","B":"Kompyuter tizimi tezligi","C":"Jangovar shaylik va qobiliyat","D":"Transport vositalari soni"},"answer":"C","explanation":"Baholash jangovar shaylik va qobiliyatga qaratilganligi aniq ko‘rsatilgan.","mnemonic":"Shaylik + qobiliyat = oldini olish.","id":343},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tarkibi","subtopic":"Tashkilotlar ro‘yxati","difficulty":"Y1","bloom_level":"Bilish","qtype":"matching","source_construct":"Qurolli Kuchlar tarkibiga O'zbekiston Respublikasi Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo‘shinlari, harbiy tuzilma va muassasalari kiradi.","requires_image":false,"question":"Qurolli Kuchlar tarkibidagi muassasalarni ularning vazifalari bilan moslang:\n1. Harbiy tuzilma\n2. Favqulodda vaziyatlar vazirligi\n3. Milliy gvardiya\nA. Mudofaa tayyorlash\nB. Xavfsizlikni ta'minlash\nC. Xavfli vaziyatlarda tezkor javob","options":{"A":"1-A, 2-B, 3-C","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"C","explanation":"Harbiy tuzilma mudofaa tayyorlash (A), Favqulodda vaziyatlar vazirligi xavfli vaziyatlarda javob (C), Milliy gvardiya xavfsizlikni ta'minlash (B). Shuning uchun 1-A,2-C,3-B to‘g‘ri.","mnemonic":"Tuzilma – mudofaa, Vazirlik – javob, Gvardiya – xavfsizlik.","id":344},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar funksiyalari","subtopic":"Strategik yoyilishga tayyorlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qurolli Kuchlarning strategik jihatdan yoyilishga shayligini ta'minlash","requires_image":false,"question":"Qurolli Kuchlarning strategik yoyilishga tayyorligini ta’minlash uchun qaysi chora ko‘proq ahamiyatli?","options":{"A":"Logistik zaxiralarni ko‘paytirish","B":"Harbiy marosimlarni ko‘paytirish","C":"Yashirin joylarni yaratish","D":"Yangi texnologiyalarni joriy etish"},"answer":"A","explanation":"Strategik yoyilishga shaylikni ta’minlash logistik tayyorgarlikni mustahkamlash bilan bog‘liq. B va C ham foydali, lekin A logistik zaxiralar bevosita yoyilishga ta’sir qiladi. D esa bevosita aloqasi yo‘q.","mnemonic":"Strategik yoyilish = logistik zaxira","id":345},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Majburiy mudofaa","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Qurolli Kuchlarning vazifalari: muhim davlat obyektlari, kommunikatsiyalarni himoya qilish","requires_image":false,"question":"Qurolli Kuchlarning quyidagi vazifalarini ularning maqsadi bilan moslashtiring:\n1. Obyektlarni himoya qilish\n2. Kommunikatsiyalarni ta’minlash\n3. Favqulodda holatni boshqarish\nA. Tezkor harakat va qaror qabul qilish\nB. Hujumga qarshi barqaror mudofaa\nC. Tizimli nazorat va monitoring","options":{"A":"1-B, 2-C, 3-A","B":"1-A, 2-B, 3-C","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"A","explanation":"Obyektlarni himoya qilish barqaror mudofaa (B), kommunikatsiyalarni ta’minlash tizimli nazorat (C), favqulodda holatni boshqarish esa tezkor harakat (A) bilan bog‘liq. Shuning uchun 1-B, 2-C, 3-A to‘g‘ri.","mnemonic":"Obyekt – barqaror, Kom – nazorat, Fav – tezkor","id":346},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tayyorgarlik","subtopic":"Jangovar shaylik","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Qurolli Kuchlarni yuqori darajadagi jangovar shaylikka keltirish bo‘yicha kompleks tadbirlar","requires_image":false,"question":"Qurolli Kuchlarni yuqori darajadagi jangovar shaylikka keltirish jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Jangovar tayyorgarlik rejasini ishlab chiqish\n2. Malaka oshirish kurslarini o'tkazish\n3. Texnik vositalarni modernizatsiya qilish\n4. Jangovar mashg‘ulotlarni amalga oshirish","options":{"A":"2, 1, 3, 4","B":"1, 3, 2, 4","C":"1, 2, 3, 4","D":"3, 1, 2, 4"},"answer":"C","explanation":"Kompleks tadbirlar avvalo reja (1), keyin malaka oshirish (2), texnik modernizatsiya (3) va oxirida amaliy mashg‘ulotlar (4) bilan amalga oshiriladi. Shuning uchun 1‑2‑3‑4 to‘g‘ri.","mnemonic":"Reja → Kurs → Modern → Mashg‘ulot","id":347},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Mudofaa","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qurolli Kuchlarning vazifalari: muhim davlat (harbiy) obyektlari va kommunikatsiyalarini qo‘riqlash hamda mudofaa qilish","requires_image":false,"question":"Qurolli Kuchlar muhim davlat obyektlarini himoya qilishda qaysi tamoyilga amal qiladi?","options":{"A":"Barqaror mudofaa","B":"Ommaviy axborot","C":"Tezkor hujum","D":"Xalqaro hamkorlik"},"answer":"A","explanation":"Obyektlarni himoya qilish barqaror mudofaa sifatida tavsiflangan. Tezkor hujum, ommaviy axborot va xalqaro hamkorlik bu vazifa uchun asosiy tamoyil emas.","mnemonic":"Obyekt → barqaror mudofaa","id":348},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tayyorgarlik","subtopic":"Strategik yoyilishga tayyorlik","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qurolli Kuchlarni strategik jihatdan yoyish","requires_image":false,"question":"Strategik yoyilishga tayyorlikni oshirish uchun qaysi amaliyot muhim hisoblanadi?","options":{"A":"Kengash yig‘ilishlari","B":"Kadrlar rezervini yaratish","C":"Taktika mashg‘ulotlari","D":"Qurol-yonilma inventarini yangilash"},"answer":"B","explanation":"Strategik yoyilishga shaylikni ta’minlash kadrlar rezervini yaratish bilan bog‘liq. Taktika mashg‘ulotlari, inventar yangilash ham muhim, lekin rezerv asosiy omil.","mnemonic":"Strategik yoyilish = kadr rezervi","id":349},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Hududiy mudofaa","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Hududiy mudofaa va fuqarо muhofazasi tizimlarini yoyish bo‘yicha belgilangan muddatlar","requires_image":false,"question":"Hududiy mudofaa tizimini belgilangan muddat ichida yoyish bosqichlarini to‘g‘ri tartibda joylashtiring:\n1. Resurslarni taqsimlash\n2. O‘rganish va rejalashtirish\n3. Amaliyotga tatbiq etish\n4. Natijalarni nazorat qilish","options":{"A":"2, 3, 1, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"3, 2, 1, 4"},"answer":"B","explanation":"Tizimni yoyish avval rejalashtirish (2), keyin resurslarni taqsimlash (1), amaliyotga tatbiq (3) va nihoyat nazorat (4) amalga oshiriladi. Shuning uchun 2‑1‑3‑4 to‘g‘ri.","mnemonic":"Reja → Resurs → Amal → Nazorat","id":350},{"subject":"Harbiy ta'lim","topic":"Harbiy okruglar","subtopic":"Hududiy ro‘yxat","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Harbiy okruglar ro‘yxati va ularning hududlari.","requires_image":false,"question":"Harbiy okruglarni ularning hududiy tarkibi bilan moslashtiring:\n1. Markaziy\n2. Toshkent\n3. Janubiy‑g‘arbiy\n4. Shimoliy‑g‘arbiy\nA. Qoraqalpog‘iston, Xorazm\nB. Jizzax, Samarqand, Navoiy\nC. Buxoro, Surxondaryo, Qashqadaryo\nD. Toshkent, Sirdaryo","options":{"A":"1-B, 2-D, 3-C, 4-A","B":"1-C, 2-A, 3-B, 4-D","C":"1-D, 2-C, 3-A, 4-B","D":"1-A, 2-B, 3-D, 4-C"},"answer":"A","explanation":"Har bir okrugning hududi aniq ko‘rsatilgan: 1‑Markaziy – B, 2‑Toshkent – D, 3‑Janubiy‑g‘arbiy – C, 4‑Shimoliy‑g‘arbiy – A. Shuning uchun A varianti to‘g‘ri.","mnemonic":"1‑B,2‑D,3‑C,4‑A – tartib.","id":351},{"subject":"Harbiy ta'lim","topic":"Harbiy okruglar","subtopic":"Okrug tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiy okruglarning tashkil etilish bosqichlari: 1) hududiy tahlil, 2) birliklarni joylashtirish, 3) operativ nazoratni o‘rnatish, 4) xavfsizlikni mustahkamlash.","requires_image":false,"question":"Harbiy okrugni tashkil etish bosqichlarini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Operativ nazoratni o‘rnatish\n2. Hududiy tahlil\n3. Xavfsizlikni mustahkamlash\n4. Birliklarni joylashtirish","options":{"A":"4, 2, 1, 3","B":"2, 4, 1, 3","C":"2, 1, 4, 3","D":"1, 2, 4, 3"},"answer":"B","explanation":"Berilgan bosqichlar tartibi: avval hududiy tahlil (2), keyin birliklarni joylashtirish (4), operativ nazorat (1) va oxirida xavfsizlikni mustahkamlash (3). Shuning uchun 2‑4‑1‑3 to‘g‘ri.","mnemonic":"Tahlil, Joy, Nazorat, Mustahkam.","id":352},{"subject":"Harbiy ta'lim","topic":"Harbiy okruglar","subtopic":"Hududiy xususiyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy okruglar o‘z hududlari bo‘yicha maxsus vazifalarni bajaradi.","requires_image":false,"question":"Agar bir hududda suv manbai cheklangan bo‘lsa, qaysi okrugning qo‘llanilishi eng maqbul?","options":{"A":"Sharqiy okrug","B":"Janubiy‑g‘arbiy okrug","C":"Markaziy okrug","D":"Shimoliy‑g‘arbiy okrug"},"answer":"D","explanation":"Shimoliy‑g‘arbiy okrug Qoraqalpog‘iston va Xorazm hududlarini qamrab oladi, bu hududlar suv resurslari kamligi bilan tanilgan, shuning uchun bu okrugning qo‘llanilishi maqsadga muvofiq.","mnemonic":"Qorazmda suv kam, shimol‑g‘arb.","id":353},{"subject":"Harbiy ta'lim","topic":"Harbiy okruglar","subtopic":"Hududiy birliklar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Harbiy okruglarning hududlari viloyatlar bo‘yicha aniqlanadi.","requires_image":false,"question":"Qaysi okrug bir nechta viloyatni birlashtiradi, lekin Toshkent shahri ham shu hududga kiradi?","options":{"A":"Sharqiy okrug","B":"Shimoliy‑g‘arbiy okrug","C":"Janubiy‑g‘arbiy okrug","D":"Toshkent harbiy okrugi"},"answer":"D","explanation":"Toshkent okrugi Toshkent shahri, Toshkent viloyati va Sirdaryo viloyatlarini qamrab oladi, demak bu okrug bir nechta viloyatni birlashtiradi va Toshkent shahrini ham o‘z ichiga oladi.","mnemonic":"Toshkent okrug – shahar va viloyatlar.","id":354},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Tashkiliy tuzilma","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi bo‘yicha \"boshqaruv, xabar berish va aloqa tizimlarini tashkil qilish\" vazifasini bajarish uchun qaysi uskunalar kerak bo‘ladi?","options":{"A":"Radioto‘plam va mobil aloqalar","B":"Qaychi va paypoq","C":"Ko‘rgazma materiallari","D":"Kameralar va proyektorlar"},"answer":"A","explanation":"Boshqaruv, xabar berish va aloqa tizimlari radioto‘plam, mobil telefon, radio aloqa vositalarini talab qiladi. Qaychi, paypoq, ko‘rgazma materiallari yoki kameralar bu vazifani bajarish uchun mo‘ljallanmagan.","mnemonic":"Aloqa → Radio → Xabar","id":355},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi vazifalaridan \"ob'ektlarni harbiy harakatlar vaqtida himoya qilish\" amaliyotida qaysi choralar ko‘riladi?","options":{"A":"Qattiq barajlar va yopiq qoplamalar","B":"Ta’lim darslari","C":"Qo‘shma sport tadbirlari","D":"Musiqa repertuarini tayyorlash"},"answer":"A","explanation":"Ob'ektlarni himoya qilishda qattiq barajlar, yopiq qoplamalar, maskalar va boshqa himoya vositalari qo‘llaniladi. Sport, ta’lim yoki musiqa bilan aloqasi yo‘q.","mnemonic":"Himoya → Baraj → Qoplama","id":356},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi vazifalaridan \"qutqaruv va boshqa kechiktirib bo‘lmaydigan ishlarni o‘tkazish\" qaysi holatda amalga oshiriladi?","options":{"A":"Dam olish kuni","B":"Maktab yakunida","C":"Favqulodda vaziyatda","D":"O‘qituvchilar yig‘ilishida"},"answer":"C","explanation":"Kechiktirib bo‘lmaydigan ishlar – bu favqulodda vaziyatda, masalan, yong‘in, portlash yoki tabiat ofatida amalga oshiriladi. Boshqa variantlar bu vazifani anglatmaydi.","mnemonic":"Kechiktirib bo‘lmaydigan → Favqulodda","id":357},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi vazifalaridan \"aholini umumiy va yakka muhofazalanish vositalari bilan ta’minlash\" amaliyotida qaysi vosita kiritilmaydi?","options":{"A":"Zaxira energiya manbalari","B":"Mikrofonlar","C":"Shaxsiy himoya jihozlari","D":"Xavfsizlik maskalari"},"answer":"B","explanation":"Umumiy va yakka muhofaza vositalari – shaxsiy himoya jihozlari, xavfsizlik maskalari, zaxira energiya manbalari kabi qurilmalar. Mikrofonlar bu vazifaga kirmaydi.","mnemonic":"Mikrofon → Aloqa → Muvofiq emas","id":358},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi vazifalaridan \"aholini, moddiy va madaniy boyliklarni xavfsiz joylarga evakuatsiya qilish\" qanday tayyorgarlikni talab qiladi?","options":{"A":"Sport musobaqalarini o‘tkazish","B":"Kitoblar to‘plash","C":"Transport vositalarini rejalashtirish","D":"Musiqa festivallarini tashkil qilish"},"answer":"C","explanation":"Evakuatsiya uchun transport vositalari (avtomobillar, avtobuslar, poezdlar) va marshrutlarni rejalashtirish zarur. Boshqa variantlar evakuatsiya bilan aloqasi yo‘q.","mnemonic":"Evakuatsiya → Transport → Tayyorlik","id":359},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Jarayon bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi tadbirini amalga oshirishda quyidagi bosqichlarni to‘g‘ri tartibda joylashtiring:\n1. Xavf tahlili va rejalashtirish\n2. Resurslarni jamlash\n3. Operativ bajarish\n4. Natijani baholash va hisobot","options":{"A":"2, 1, 3, 4","B":"1, 3, 2, 4","C":"1, 2, 3, 4","D":"3, 2, 1, 4"},"answer":"C","explanation":"Fuqaro muhofazasi jarayonida avvalo xavf tahlili va rejalashtirish (1), keyin resurslarni jamlash (2), operativ bajarish (3) va oxirida natijani baholash hamda hisobot tuzish (4) amalga oshiriladi. Shuning uchun 1‑2‑3‑4 to‘g‘ri tartib.","mnemonic":"Tahlil → Resurs → Bajarish → Baholash","id":360},{"subject":"Harbiy ta'lim","topic":"Fuqaro muhofazasi","subtopic":"Jarayon bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Fuqaro muhofazasi vazifalari ro‘yxati","requires_image":false,"question":"Fuqaro muhofazasi bo‘yicha quyidagi vazifalarni amalga oshirishda to‘g‘ri ketma‑ketlikni tanlang:\n1. Aholini evakuatsiya qilish\n2. Evakuatsiya punktlarini tayyorlash\n3. Evakuatsiya rejasi bo‘yicha og‘irliklarni belgilash\n4. Evakuatsiya amalga oshirilgandan so‘ng nazorat va tekshiruv","options":{"A":"3, 2, 1, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"2, 3, 1, 4"},"answer":"D","explanation":"Birinchi navbatda evakuatsiya punktlari tayyorlanadi (2), keyin rejadagi vazifalar va og‘irliklar belgilanadi (3), so‘ng aholi evakuatsiya qilinadi (1), va oxirida nazorat hamda tekshiruv amalga oshiriladi (4). Shunday qilib 2‑3‑1‑4 to‘g‘ri tartib.","mnemonic":"Punkt → Reja → Evakuatsiya → Tekshiruv","id":361},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Texnogen xususiyatli holatlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Texnogen favqulodda vaziyatni boshqarish bosqichlari.","requires_image":false,"question":"Texnogen favqulodda vaziyatda amalga oshirilishi lo‘tilgan qadamlarni to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Vaziyatni aniqlash\n2. Xavfsizlik choralarini joriy etish\n3. Zararlarni baholash\n4. Qayta tiklash ishlarini boshlash","options":{"A":"3, 1, 2, 4","B":"1, 2, 3, 4","C":"2, 1, 4, 3","D":"1, 3, 2, 4"},"answer":"B","explanation":"Texnogen favqulodda vaziyatda avvalo vaziyat aniqlanadi (1), keyin xavfsizlik choralarini ko‘riladi (2), zararlar baholanadi (3), oxirida qayta tiklash ishlari boshlanadi (4).","mnemonic":"Aniq → Xavfsiz → Baholash → Qayta tiklash","id":362},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Ekologik favqulodda vaziyatlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Ekologik xususiyatli favqulodda vaziyatlarning tavsifi.","requires_image":false,"question":"Ekologik favqulodda vaziyatga qaysi holat kiradi?","options":{"A":"O‘qituvchilar yig‘ilishi","B":"Kimyoviy zaharlanish","C":"Yer silqimi","D":"Transport halokati"},"answer":"B","explanation":"Ekologik xususiyatli favqulodda vaziyatlar haqida gapirilgan; kimyoviy zaharlanish bu turga kiradi. Yer silqimi tabiiy, transport halokati texnogen, o‘qituvchilar yig‘ilishi esa favqulodda vaziyat emas.","mnemonic":"Ekologik – Kimyoviy tahdid","id":363},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Favqulodda vaziyatlarni turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Favqulodda vaziyatlarning turli xususiyatlari.","requires_image":false,"question":"Quyidagi vaziyatlardan qaysi biri texnogen xususiyatli deb ataladi?","options":{"A":"Sel vodiyda suv ko‘tarilishi","B":"Yer silqimi","C":"O‘rmon yong‘ini","D":"Transport avariyasi"},"answer":"D","explanation":"Transport avariyasi inson faoliyati (ishlab chiqarish, transport) bilan bog‘liq bo‘lgani uchun texnogen hisoblanadi. B – tabiiy, C – ekologik, D – ekologik‑tabiiy aralash.","mnemonic":"Transport – odamlar texnogen","id":364},{"subject":"Harbiy ta'lim","topic":"Transport avariyalari","subtopic":"Aviahalokatlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Transport avariyalari va halokatlari: aviahalokatlar","requires_image":false,"question":"Aviahalokatlar natijasida quyidagilardan qaysi biri keltirilgan?","options":{"A":"Ekipaj a'zolari va yo'lovchilarning o'limi","B":"Faqat material zarari","C":"Yong'inning faqat texnikaviy sabablari","D":"Transport vositasining yengil shikastlanishi"},"answer":"A","explanation":"Aviahalokatlar ekipaj a'zolari va yo'lovchilarning o'limiga olib kelishi ko'rsatilgan. B bandi yo'q, C va D esa faqat qisman tasvirlangan.","mnemonic":"Uchqun - O'lim, yo'lovchi, ekipaj","id":365},{"subject":"Harbiy ta'lim","topic":"Transport avariyalari","subtopic":"Yong'in xavfi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"matching","source_construct":"Yong'in, portlash xavfi mavjud bo'lgan obyektlarda avariyalar","requires_image":false,"question":"Yong'in xavfi mavjud obyektlarda sodir bo'ladigan avariyalarni ularning asosan ta'siriga moslashtiring:\n1. Portlash\n2. Yong'in\n3. Material shikastlanishi\nA. Texnologik jarayonda portlaydigan moddalar\nB. Oson yonib ketadigan moddalar\nC. Ishlab chiqarish fondlarining nobud bo'lishi","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-B, 3-C","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"1‑portlash texnologik jarayonda portlaydigan moddalar, 2‑yong'in oson yonib ketadigan moddalar, 3‑material shikastlanishi ishlab chiqarish fondlarining nobud bo'lishi bilan bog'liq. Shuning uchun 1‑A, 2‑B, 3‑C to'g'ri.","mnemonic":"Portlash‑Texno, Yong'in‑Yoq, Shikast‑Fond","id":366},{"subject":"Harbiy ta'lim","topic":"Transport avariyalari","subtopic":"Aviahalokatlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Aviahalokatlar: qattiq shikastlanish, qidiruv ishlari","requires_image":false,"question":"Aviahalokatdan keyin avariy-qidiruv jarayonining to'g'ri bosqichlarini ketma-ket joylashtiring:\n1. Qidiruv guruhini tashkil etish\n2. Qattiq shikastlanishlarni aniqlash\n3. Qidiruv uskunalarini joylashtirish\n4. Qidiruv natijalarini hujjatlashtirish","options":{"A":"2, 1, 3, 4","B":"1, 3, 2, 4","C":"3, 1, 2, 4","D":"1, 2, 3, 4"},"answer":"C","explanation":"Aviarhalokatdan keyin avariy-qidiruv ishlarini boshlashda avval uskunalar joylashtiriladi, so'ng guruh tashkil etiladi, keyin qattiq shikastlanish aniqlanadi, oxirida natijalar hujjatga kiritiladi. Shunday qilib 3‑1‑2‑4 to'g'ri.","mnemonic":"Uskuna → Guruh → Shikast → Hujjat","id":367},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Gaz quvurlari avariyalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Gaz va suv quvurlari, kanalizatsiya obyektlarida avariyalar","requires_image":false,"question":"Gaz quvuri yorilishi natijasida avariya qanday xavfni keltirib chiqaradi?","options":{"A":"Suvo'tkazish muammosi","B":"Elektr uzilishi","C":"Yong'in va portlash","D":"Radiatsiya tarqalishi"},"answer":"C","explanation":"Gaz quvuri yorilishi gazning erkin chiqishi, yong'in va portlash xavfini oshiradi. Suvo'tkazish, elektr yoki radiatsiya bilan bog'liq emas.","mnemonic":"Gaz yorilganda yong'in yo'qolmaydi.","id":368},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Kanalizatsiya tizimlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Kanalizatsiya va boshqa kommunal obyektlarda avariyalar","requires_image":false,"question":"Kanalizatsiya tizimida avariyadan keyin sanitariya-himoya choralarini qanday amalga oshirish kerak?","options":{"A":"Zaharli chiqindilarni izolyatsiya qilish","B":"Quvurlarni qayta bosish","C":"Gazni yonib ketishini kutish","D":"Elektr energiyasini uzatish"},"answer":"A","explanation":"Kanalizatsiya avariyasida zararli moddalar atrofga tarqalmasligi uchun izolyatsiya zarur. Qayta bosish, elektr yoki gaz bilan bog'liq emas.","mnemonic":"Kanalizatsiya – zaharni yoping.","id":369},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Gidrotexnik hodisalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gidrotexnik hal","requires_image":false,"question":"Gidrotexnik halda suv bosimi tushishi avariyasining birinchi ko'rsatkichini qanday aniqlash mumkin?","options":{"A":"Radiatsiya darajasini tekshirish","B":"Yuqori haroratni kuzatish","C":"Elektr toki o'zgarishini o'lchash","D":"Suv oqimini kamaytirish"},"answer":"D","explanation":"Suv bosimi pasayganda oqim kamayadi; bu asosiy ko'rsatkich. Harorat, tok yoki radiatsiya bilan aloqasi yo'q.","mnemonic":"Bosim pasayganda suyuq oqim kamayadi.","id":370},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Kimyoviy portlashlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gaz va chang portlashi bilan bog'liq avariya va yong'inlar","requires_image":false,"question":"Gaz va chang aralashmasi portlashini boshqarish uchun qaysi usul qo'llaniladi?","options":{"A":"Issiqlikni oshirish","B":"Elektr energiyasini uzatish","C":"Ventilyatsiya va alanga olib kelish","D":"Radiatsiya filtrini o'rnatish"},"answer":"C","explanation":"Ventilyatsiya havoni almashtiradi, alanga olib kelish esa portlashni yo'q qiladi. Issiqlik, elektr yoki radiatsiya bu holatda yordamsiz.","mnemonic":"Ventilyatsiya – portlashga qarshi.","id":371},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Energetika avariyalarida evakuatsiya","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Energetika va kommunal tizimlardagi avariyalar","requires_image":false,"question":"Elektr stansiyasi avariyasida evakuatsiya rejasining birinchi bosqichi nima?","options":{"A":"Yangi qurilma o'rnatish","B":"Tashqi aloqalarni tiklash","C":"Xavfli zonasini aniqlash","D":"Materiallarni yig'ish"},"answer":"C","explanation":"Xavfli zona aniqlanadi, keyin evakuatsiya amalga oshiriladi. Materiallarni yig'ish, aloqalar tiklash yoki yangi qurilma o'rnatish keyingi bosqichlar.","mnemonic":"Avvalo zona, keyin evakuatsiya.","id":372},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Avariya turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Avariya turlari ro'yxati: favqulodda, yong'in, gaz, radiaktiv","requires_image":false,"question":"Avariya turlarini ularning asosiy sababiga moslashtiring:\n1. Gaz portlashi\n2. Radioaktiv chiqindi\n3. Elektr stansiyasidagi avariya\nA. Nurlanish xavfi\nB. Yoqilg'i eksploziyasi\nC. Elektr energiyasi uzilishi","options":{"A":"1-B, 2-A, 3-C","B":"1-B, 2-C, 3-A","C":"1-A, 2-B, 3-C","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Gaz portlashi yoqilg'i eksploziyasiga, radioaktiv chiqindi nurlanish xavfiga, elektr avariya esa energiya uzilishiga olib keladi. Shuning uchun 1-B, 2-A, 3-C to'g'ri.","mnemonic":"Gaz - eksploz, Radio - nurlash, Elektr - uzish.","id":373},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Xavfsizlik choralarining bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Avariya xavfsizligi bosqichlari: aniqlash, izolyatsiya, evakuatsiya, tiklash","requires_image":false,"question":"Avariya boshqaruvining to'g'ri bosqichlarini moslashtiring:\n1. Xavfli hududni belgilash\n2. Zaharli modda izolyatsiyasi\n3. Xodimlarni evakuatsiya qilish\n4. Tizim tiklash\nA. 1-2-3-4\nB. 2-1-3-4\nC. 1-3-2-4\nD. 3-1-2-4","options":{"A":"1-3-2-4","B":"2-1-3-4","C":"3-1-2-4","D":"1-2-3-4"},"answer":"D","explanation":"Avariya boshqaruvida avvalo xavfli hudud belgilanadi, keyin zararli moddalar izolyatsiya qilinadi, evakuatsiya amalga oshiriladi, oxirida tizim tiklanadi. Shuning uchun 1-2-3-4 to'g'ri.","mnemonic":"Belgilash → Izolyatsiya → Evakuatsiya → Tiklash.","id":374},{"subject":"Harbiy ta'lim","topic":"Avariya xavfsizligi","subtopic":"Avariya boshqaruvining ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Avariya boshqaruvi jarayoni: aniqlash, izolyatsiya, evakuatsiya, tiklash","requires_image":false,"question":"Avariya boshqaruvi jarayonini to'g'ri ketma-ketlikda joylashtiring:\n1. Evakuatsiya\n2. Xavfli hududni aniqlash\n3. Zaharli moddani izolyatsiya qilish\n4. Tizimni tiklash","options":{"A":"3, 2, 1, 4","B":"1, 2, 3, 4","C":"2, 3, 1, 4","D":"2, 1, 3, 4"},"answer":"C","explanation":"Dastlab hudud aniqlanadi (2), keyin zararli moddalar izolyatsiya qilinadi (3), evakuatsiya amalga oshiriladi (1), oxirida tizim tiklanadi (4). Shunday qilib 2,3,1,4 to'g'ri.","mnemonic":"Aniqlash → Izolyatsiya → Evakuatsiya → Tiklash.","id":375},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Gidrometeorologik xavfli hodisalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Gidrometeorologik xavfli hodisalar: suv toshqinlari, sellar, qorinlar","requires_image":false,"question":"Qaysi hodisa suv toshqinlari, sellar va qorinlarni o'z ichiga oladi?","options":{"A":"Texnikaviy avariyalar","B":"Gidrometeorologik xavfli hodisalar","C":"Geologik xavfli hodisalar","D":"Biologik xavfli hodisalar"},"answer":"B","explanation":"Gidrometeorologik xavfli hodisalar suv toshqinlari, sellar va qorinlar deb tasvirlangan.","mnemonic":"Gidro – suv, sel, qorin","id":376},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik xavfli hodisalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Geologik xavfli hodisalar: zilzilalar, tog‘ o‘pirilishlari","requires_image":false,"question":"Zilzilalar qaysi xavfli hodisa guruhiga kiradi?","options":{"A":"Geologik xavfli hodisalar","B":"Gidrometeorologik xavfli hodisalar","C":"Texnikaviy avariyalar","D":"Epidemiologik xavfli hodisalar"},"answer":"A","explanation":"Zilzilalar geologik xavfli hodisalar sifatida ko‘rsatilgan.","mnemonic":"Zilzilalar – yerning titrashidir","id":377},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik xavfli hodisalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Geologik hodisalar: tog‘ o‘pirilishi, yer ko‘chishi","requires_image":false,"question":"Tog‘ o‘pirilishi natijasida qanday harakatni amalga oshirish lozim?","options":{"A":"Epidemiologik monitoring","B":"Suvni to‘xtatish","C":"Xavfsiz zona yaratish","D":"Havo nazoratini kuchaytirish"},"answer":"C","explanation":"Tog‘ o‘pirilishi xavfli hududni xavfsiz zona bilan almashtirish kerakligi aytilgan.","mnemonic":"Tog‘ – xavfsizlik","id":378},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Epidemiologik vaziyatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Epizootiya – hayvonlarning ommaviy kasallanishi","requires_image":false,"question":"Hayvonlarda ommaviy kasallik tarqalishi qanday nomlanadi?","options":{"A":"Epifitotiya","B":"Zararlanish","C":"Epidemiya","D":"Epizootiya"},"answer":"D","explanation":"Epizootiya hayvonlarning ommaviy kasallanishi deb ta'riflangan.","mnemonic":"Epi – hayvon, zo‘r","id":379},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Gidrometeorologik hodisalar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Gidrometeorologik hodisalar: suv toshqinlari, sellar, jala","requires_image":false,"question":"Suv toshqinlari, sellar va jala kabi hodisalar yuzaga kelganda to‘g‘ri harakat tartibini tanlang:\n1. Xavfsiz hududga ko‘chirish\n2. Evakuatsiya rejimini yo‘lga qo‘yish\n3. Mahalliy transportni bekor qilish\n4. Favqulodda xizmatlarni chaqirish","options":{"A":"1, 2, 4, 3","B":"2, 1, 3, 4","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Birinchi qadam evakuatsiya, ikkinchi favqulodda xizmatlarni chaqirish, uchinchi xavfsiz hududga ko‘chirish, oxirgi transportni bekor qilish to‘g‘ri tartib.","mnemonic":"Evakuatsiya → Xizmat → Ko‘chirish → Transport","id":380},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik hodisalar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Geologik xavfli hodisalar: yer ko‘chishi, tog‘ o‘pirilishi","requires_image":false,"question":"Yer ko‘chishi sodir bo‘lganda to‘g‘ri qarorlar ketma-ketligini aniqlang:\n1. Zudlik bilan yashash joyini evakuatsiya qilish\n2. Qayta qurilish rejasini tuzish\n3. Xavfsizlik perimetrini belgilash\n4. Zararlangan obyektlarni tekshirish","options":{"A":"1, 3, 4, 2","B":"3, 1, 4, 2","C":"1, 4, 3, 2","D":"4, 1, 3, 2"},"answer":"A","explanation":"Avvalo evakuatsiya, keyin perimetr, tekshirish, oxirida qayta qurilish rejalashtirish tavsiya qilingan.","mnemonic":"Evakuatsiya → Perimetr → Tekshirish → Qurilish","id":381},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik xavfli hodisalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Geologik xavfli hodisalar: zilzilalar, tog‘ o‘pirilishlari","requires_image":false,"question":"Tog‘ o‘pirilishi natijasida qaysi muhit o‘zgaradi?","options":{"A":"Suv oqimi","B":"Atmosfera bosimi","C":"Yer yuzasi","D":"Elektr toki"},"answer":"C","explanation":"Tog‘ o‘pirilishi yer yuzasining o‘zgarishi bilan bog‘liq.","mnemonic":"Tog‘ – yerga ta'sir","id":382},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Geologik xavfli hodisalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Geologik xavfli hodisalar: yer ko‘chishi","requires_image":false,"question":"Yer ko‘chishi holatida qanday xavfsizlik chorasi asosiy hisoblanadi?","options":{"A":"Xavfsiz zona belgilash","B":"Epidemiologik monitoring","C":"Havo nazoratini kuchaytirish","D":"Suv toshqinini to‘xtatish"},"answer":"A","explanation":"Yer ko‘chishi natijasida xavfsiz zona yaratish tavsiya qilingan.","mnemonic":"Yer – zona","id":383},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Epidemiologik xavfli hodisalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Epizootiya – hayvonlarning ommaviy kasallanishi","requires_image":false,"question":"Hayvon kasalliklari keng tarqalishi qachon epizootiya deb ataladi?","options":{"A":"Yakka hayvonlarda","B":"Faqat bir turda","C":"Faqat bir hududda","D":"Ommaviy kasallanishda"},"answer":"D","explanation":"Epizootiya hayvonlarning ommaviy kasallanishi deb belgilangan.","mnemonic":"Epizootiya – hayvonning ommaviyligi","id":384},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Tashkiliy bosqichlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda favqulodda vaziyatga javob berish bosqichlari ketma‑ketligi keltirilgan","requires_image":false,"question":"Favqulodda vaziyatga javob berish bosqichlarini to‘g‘ri tartibda joylashtiring:\n1. Tayyorlanish va materiallarni yig‘ish\n2. Xabardorlik va vaziyatni aniqlash\n3. Amaliy harakat va yordam ko‘rsatish\n4. Vaziyatni baholash va tiklash","options":{"A":"3, 2, 1, 4","B":"2, 3, 1, 4","C":"2, 1, 3, 4","D":"1, 2, 3, 4"},"answer":"C","explanation":"Birinchi qadam – vaziyatni aniqlash (xabardorlik). Keyin tayyorlanish, keyin amaliy harakat, oxirida baholash va tiklash. Shuning uchun 2‑1‑3‑4 tartib to‘g‘ri.","mnemonic":"Xabar, tayyor, harakat, tiklash","id":385},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Ekologik xavflar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda ekologik xavflar ro‘yxati berilgan","requires_image":false,"question":"Ekologik favqulodda vaziyatlarni ularning asosiy oqibatlari bilan moslang:\n1. Atmosfera ifloslanishi\n2. Yer osti suvlarining zaharlanishi\n3. Tuproqning toksikantlar bilan ifloslanishi\nA. Odamlar sog‘lig‘iga ta’sir\nB. Suv manbalarining foydalanilmasligi\nC. O‘simlik o‘sishining susayishi\nD. Havo sifati pasayishi","options":{"A":"1-A, 2-C, 3-D","B":"1-D, 2-B, 3-C","C":"1-C, 2-D, 3-A","D":"1-B, 2-A, 3-D"},"answer":"B","explanation":"Atmosfera ifloslanishi asosan havo sifati pasayishiga (D) olib keladi. Yer osti suvlarining zaharlanishi suv manbalarining foydalanilmasligi (B). Tuproqning toksikantlar bilan ifloslanishi o‘simlik o‘sishining susayishiga (C) sabab bo‘ladi. Shuning uchun 1‑D, 2‑B, 3‑C to‘g‘ri.","mnemonic":"Havo‑D, Suv‑B, Tuproq‑C","id":386},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish vositalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Aholiga xabar berish vositalari bo'limi","requires_image":false,"question":"Favqulodda vaziyatda \"Diqqat hammaga!\" signalini yetkazish uchun qaysi vosita ishlatiladi?","options":{"A":"Internet sahifasi","B":"Mobil telefon","C":"Poster plakat","D":"Rupor va elektrosirena"},"answer":"D","explanation":"Diqqat hammaga! signali ruporlar, elektrosirenalar, ovoz chiqaruvchi karnaylar orqali beriladi. Mobil telefon va internet alohida kanallar, poster esa ogohlantirish vositasi emas.","mnemonic":"Rupor‑elektro‑karnay, signal birga.","id":387},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Evakuatsiya turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Evakuatsiya turlari bo'limi","requires_image":false,"question":"Aholi evakuatsiyasining asosiy turi qaysi?","options":{"A":"Qochish yo'li","B":"Transport bilan ko'chirish","C":"Majburiy evakuatsiya","D":"Ixtiyoriy ko'chish"},"answer":"C","explanation":"Favqulodda vaziyatda rasmiy ravishda amalga oshiriladigan evakuatsiya majburiy (obligatory) turidir. Ixtiyoriy ko'chish, transport va qochish yo'li alohida holatlar.","mnemonic":"Majburiy – boshqaruv, evakuatsiya.","id":388},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish algoritmi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xabar berish algoritmi bo'limi","requires_image":false,"question":"Algoritmga ko'ra, mutaxassislar beradigan ko'rsatma qaysi bosqichda amal qilinadi?","options":{"A":"Signal oldidan","B":"Xabarni tarqatgandan oldin","C":"Signal qabul qilgandan keyin","D":"Evakuatsiya tugagandan keyin"},"answer":"C","explanation":"Mutaxassislar ko'rsatmasi signal qabul qilgandan so'ng, xavotirga tushmasdan, tinchlikni saqlash maqsadida beriladi. Oldingi yoki keyingi bosqichlarda emas.","mnemonic":"Signal → Mutaxassis → Harakat.","id":389},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish vositalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Xabar berish vositalari bo'limi","requires_image":false,"question":"Xabar berish uchun ishlatilmaydigan vosita qaysi?","options":{"A":"Rupor","B":"Poster plakat","C":"Ovoz chiqaruvchi karnay","D":"Elektrosirena"},"answer":"B","explanation":"Poster plakat doimiy ma'lumot beradi, lekin favqulodda vaziyatda tezkor signal berish vositasi emas. Rupor, elektrosirena va karnaylar esa tezkor signal beradi.","mnemonic":"Poster – statik, rupor – dinamik.","id":390},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish vositalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xabar berish vositalari bo'limi","requires_image":false,"question":"Signalni qabul qilgan aholi, ma'lumot olish uchun qaysi kanallarni kuzatadi?","options":{"A":"Televideniye, radio, internet","B":"Sahna, konsert, teatr","C":"Siyosiy nutq, kitob, jurnal","D":"Fax, pochta, telegram"},"answer":"A","explanation":"Algoritmda ko'rsatilganidek, signal qabul qilingandan so'ng televideniye, radio, internet tarmoqlari kuzatiladi. Fax, pochta, teatr kabi kanallar favqulodda ma'lumotga mos kelmaydi.","mnemonic":"TV‑radio‑net, favqulodda axborot.","id":391},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish algoritmi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Xabar berish algoritmi bo'limi","requires_image":false,"question":"Favqulodda vaziyatda aholi harakatlanish tartibini to'g'ri ketma-ketlikda joylang:\n1. Mutaxassis ko'rsatmasiga muvofiq harakat qilish\n2. Signalni qabul qilish\n3. OAV va internet orqali ma'lumot olish\n4. Xavotirga tushmaslik","options":{"A":"3, 2, 4, 1","B":"2, 3, 4, 1","C":"1, 2, 3, 4","D":"2, 4, 3, 1"},"answer":"B","explanation":"Algoritmga ko'ra, avvalo signal (2) qabul qilinadi, keyin OAV va internet orqali ma'lumot (3) olinadi, xavotirga tushmaslik (4) tavsiya qilinadi, oxirida mutaxassis ko'rsatmasi (1) bajariladi. Shuning uchun 2‑3‑4‑1 tartibi to'g'ri.","mnemonic":"Signal → Ma'lumot → Xavotir yo'q → Ko'rsatma.","id":392},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Evakuatsiya turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Evakuatsiya turlari bo'limi","requires_image":false,"question":"Evakuatsiya paytida, harbiy birliklar qanday tartibda harakat qilishlari lozim?","options":{"A":"Boshliqni kutib, keyin harakat","B":"Kichik guruhga bo'linib birma-bir chiqish","C":"Barcha bir vaqtning o'zida chiqish","D":"Kuzatuvchi bosqichni o'tkazmasdan darhol yurish"},"answer":"A","explanation":"Favqulodda vaziyatda harbiy birliklar boshliqning ko'rsatmasini kutib, keyin birgalikda harakat qilishadi. Darhol yurish yoki bir vaqtning o'zida chiqish tartibsizlikka olib keladi.","mnemonic":"Boshliqni kut, keyin yur.","id":393},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish vositalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Xabar berish vositalari bo'limi","requires_image":false,"question":"Favqulodda vaziyatda \"Diqqat hammaga!\" signalining maqsadi nima?","options":{"A":"Tashqi kuzatuvchilarni xabardor qilish","B":"Xavfsizlikni tekshirish","C":"Barcha aholini ogohlantirish","D":"Faqat qo'shnilarni chaqirish"},"answer":"C","explanation":"Signalning vazifasi barcha aholiga darhol ogohlantirishni ta'minlashdir. Boshqa variantlar esa signalning asosiy maqsadini qamrab olmaydi.","mnemonic":"Diqqat – hamma uchun.","id":394},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Xabar berish vositalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Xabar berish vositalari bo'limi","requires_image":false,"question":"Xabar berish jarayonida, aholi birinchi navbatda qaysi manbani tekshiradi?","options":{"A":"Mobil ilovalar","B":"Mahalliy gazetalar","C":"Televideniye va radio","D":"Jamoat e'lonlari"},"answer":"C","explanation":"Algoritmga ko'ra, signal qabul qilingandan so'ng birinchi tekshiriladigan manbalar televideniye, radio va internet tarmoqlari. Mobil ilovalar yoki gazetalar birinchi darajali manbalar emas.","mnemonic":"Signal → TV‑radio, birinchi nazar.","id":395},{"subject":"Harbiy ta'lim","topic":"Favqulodda vaziyatlar","subtopic":"Evakuatsiya turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Evakuatsiya turlari bo'limi","requires_image":false,"question":"Evakuatsiya jarayonida aholi uchun asosiy xavfsizlik choralari qaysi?","options":{"A":"Maxsus kiyim kiyish","B":"Xavotirga tushmaslik","C":"Ko'p ovozli shovqin","D":"Tezkor yugurish"},"answer":"B","explanation":"Algoritmda xavotirga tushmaslik (4) muhim xavfsizlik chora sifatida ko'rsatilgan. Tezkor yugurish yoki ko'p ovozli shovqin xavfsizlikni kamaytiradi, maxsus kiyim ham asosiy shart emas.","mnemonic":"Xavotir yo'q, xavfsiz.","id":396},{"subject":"Harbiy ta'lim","topic":"Evakuatsiya","subtopic":"Evakuatsiya turlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda evakuatsiya turlari: hududiy, ishlab chiqarish, ishlab chiqarish‑hududiy","requires_image":false,"question":"Evakuatsiya tamoyiliga ko'ra \"hududiy\" usulda qanday aholi guruhlari ko'chiriladi?","options":{"A":"Faqat ishlab chiqarish xodimlari","B":"Mahalliy muassasalar xodimlari","C":"Barcha aholi yashash joylaridan","D":"Ishchi‑xizmatchilar va oilalari"},"answer":"C","explanation":"Hududiy tamoyil bo'yicha barcha aholi yashash joylaridan evakuatsiya qilinadi.","mnemonic":"Hudud – hamma, xonadon, qishloq.","id":397},{"subject":"Harbiy ta'lim","topic":"Evakuatsiya","subtopic":"Evakuatsiya usullari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda evakuatsiya transportda, piyoda yoki aralash usullarda amalga oshirilishi","requires_image":false,"question":"Quyidagi evakuatsiya usullari qaysi biri piyoda qatnashmaydi?","options":{"A":"Yo'l bo'ylab yurish","B":"Avtomobil transporti","C":"Piyoda yurish","D":"Qo'shma piyoda‑transport"},"answer":"B","explanation":"Avtomobil transporti usulida transport vositasi asosiy vosita bo'lib, piyoda qatnashmaydi.","mnemonic":"Avto – yo'lovchi yo'q.","id":398},{"subject":"Harbiy ta'lim","topic":"Evakuatsiya","subtopic":"Favqulodda vaziyatlar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda favqulodda vaziyatlar: suv toshqinlari, dovul, zilzila, kimyoviy avariyalar","requires_image":false,"question":"Quyidagi f
