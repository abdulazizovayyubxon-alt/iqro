rib havo aylanishini ta'minlash","D":"Havo o'pkaga kirmasligi uchun yarani steril qoplama bilan yopish"},"answer":"D","explanation":"Ko'krakning teshilgan jarohatida havo o'pkaga kirmasligi uchun yarani steril qoplama yoki toza doka bilan yopish kerak. Bemor tik yoki yarim o'tirgan holatda bo'lishi maqsadga muvofiq, chunki bunda nafas olish yengillashadi. Nafas yoki yurak urishi to'xtasa, yurak-o'pka reanimatsiyasi boshlanadi.","mnemonic":"Ochiq ko'krakni darhol yop — havo o'pkaga kirmasin.","id":1179},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 40-§: yuqumli kasalliklarning yuqish yo'llari va kasallik misollari","requires_image":false,"question":"Yuqumli kasalliklarning yuqish yo'llarini misollari bilan moslashtiring:\n1. Havo-tomchi yo'li\n2. Fekal-oral yo'l\n3. Qon orqali\n4. Vektorlar (hasharotlar) orqali\nA. Vabo, gepatit A\nB. OITS, gepatit B va C\nC. Gripp, sil, qizamiq\nD. Bezgak, leyshmanioz, borellioz","options":{"A":"1-A, 2-C, 3-B, 4-D","B":"1-D, 2-A, 3-B, 4-C","C":"1-C, 2-B, 3-A, 4-D","D":"1-C, 2-A, 3-B, 4-D"},"answer":"D","explanation":"Havo-tomchi yo'li bilan gripp, sil va qizamiq tarqaladi. Fekal-oral yo'l ifloslangan suv va oziq-ovqat orqali vabo va gepatit A ni yuqtiradi. Qon orqali OITS, gepatit B va C o'tadi. Vektorlar, ya'ni hasharotlar bezgak, leyshmanioz va borelliozni tarqatadi.","mnemonic":"Tomchi — havoda, fekal — suvda, qon — qonda, vektor — hasharotda.","id":1180},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 40-§: yuqumli kasalliklarning to'rt asosiy toifasi","requires_image":false,"question":"Yuqumli kasalliklar sababchi mikroorganizmga ko'ra qaysi toifalarga bo'linadi?","options":{"A":"Birlamchi, ikkilamchi, uchlamchi, asoratli","B":"Yengil, o'rta, og'ir, surunkali","C":"Tashqi, ichki, yashirin, aralash","D":"Virusli, bakterial, parazit, zamburug'li"},"answer":"D","explanation":"Yuqumli kasalliklar sababchi mikroorganizmga ko'ra virusli, bakterial, parazit va zamburug'li infeksiyalarga bo'linadi. Ular odamdan odamga yoki atrof-muhit orqali yuqib, jamoat salomatligiga katta xavf tug'diradi.","mnemonic":"Virus, bakteriya, parazit, zamburug' — to'rt sababchi.","id":1181},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Zaharlanish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 41-§: is gazidan zaharlanish alomatlarining og'irlik darajalari","requires_image":false,"question":"Is gazidan zaharlanish alomatlarini og'irlik darajasi bilan moslashtiring:\n1. Yengil holat\n2. O'rtacha holat\n3. Og'ir holat\nA. Nutq buzilishi, mushaklar falajligi, koma, o'lim\nB. Bosh aylanishi, bosh og'rig'i, uyquchanlik, holsizlik\nC. Yurak urishining tezlashishi, quloqda shovqin, ko'z oldi qorong'ilashishi","options":{"A":"1-B, 2-A, 3-C","B":"1-C, 2-B, 3-A","C":"1-A, 2-C, 3-B","D":"1-B, 2-C, 3-A"},"answer":"D","explanation":"Yengil holatda bosh aylanishi, bosh og'rig'i, uyquchanlik va holsizlik kuzatiladi. O'rtacha holatda yurak urishi tezlashadi, quloqda shovqin va ko'z oldi qorong'ilashishi qo'shiladi. Og'ir holatda nutq buziladi, mushaklar falajlanadi, koma va uzoq ta'sirda o'lim yuz beradi.","mnemonic":"Yengil — bosh og'riydi, o'rta — quloq shovqin, og'ir — koma.","id":1182},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Zaharlanish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 41-§: is gazidan zaharlanishda birinchi yordam tartibi","requires_image":false,"question":"Is gazidan zaharlanishda birinchi yordam bosqichlarini to'g'ri tartibda joylashtiring:\n1. Nafas olishini tekshirib, nafas olayotgan bo'lsa qulay yotqizish\n2. Jabrlanuvchini xavfli hududdan toza havoga olib chiqish\n3. Tez tibbiy yordamni chaqirish\n4. Nafas olmasa, sun'iy nafas va yurak massajini boshlash","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"1, 2, 4, 3","D":"3, 2, 1, 4"},"answer":"B","explanation":"Avval jabrlanuvchini xavfli hududdan toza havoga olib chiqib, gaz manbayini o'chirish kerak. So'ng nafas olishi tekshiriladi va nafas olayotgan bo'lsa qulay yotqiziladi. Nafas olmasa darhol sun'iy nafas va yurak massaji boshlanadi. Bemor o'zini yaxshi his qilsa ham Tez tibbiy yordam chaqiriladi, chunki ta'sir kechikishi mumkin.","mnemonic":"Chiqar, tekshir, jonlantir, chaqir.","id":1183},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Ilon va hasharot chaqishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 42-§: zaharli ilon chaqqanda qilinadigan va man etiladigan harakatlar","requires_image":false,"question":"Zaharli ilon chaqqanda to'g'ri va man etilgan harakatlarni moslashtiring:\n1. Jabrlanuvchini yotqizib harakatini kamaytirish\n2. Turniket (qattiq bog'lam) bog'lash\n3. Zaharni so'rib olish\n4. Ko'proq suyuqlik berish\nA. Man etiladi, og'iz orqali zahar tanaga o'tishi mumkin\nB. To'g'ri yordam, zahar tarqalishini sekinlashtiradi\nC. To'g'ri yordam, hushida bo'lsa suv yoki choy berish mumkin\nD. Man etiladi, to'qimalar nekroziga olib keladi","options":{"A":"1-B, 2-D, 3-A, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-A, 2-D, 3-B, 4-C","D":"1-B, 2-A, 3-D, 4-C"},"answer":"A","explanation":"Ilon chaqqanda jabrlanuvchini yotqizib harakatini kamaytirish kerak, chunki harakat zahar tarqalishini tezlashtiradi. Hushida bo'lsa ko'proq suyuqlik berish mumkin. Turniket bog'lash man etiladi, chunki to'qimalar nekroziga olib keladi, zaharni so'rib olish ham xavfli, og'iz orqali zahar o'tishi mumkin.","mnemonic":"Yotqiz va suv ber — turniket bog'lama, zaharni so'rma.","id":1184},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Ilon va hasharot chaqishi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 42-§: qoraqurt chaqqanda muzli xaltani qo'yish muddati","requires_image":false,"question":"Qoraqurt chaqqanda shish va og'riqni kamaytirish uchun muzli xaltani qancha vaqt qo'yish kerak?","options":{"A":"1 soat","B":"10-15 daqiqa","C":"1-2 daqiqa","D":"30-40 daqiqa"},"answer":"B","explanation":"Qoraqurt chaqqan joyga shish va og'riqni kamaytirish uchun muzli xaltani 10-15 daqiqa davomida qo'yish kerak. Bunda teriga to'g'ridan-to'g'ri muz tekkizmasdan, ustidan mato qo'yiladi. So'ng antigistamin dori berib, zudlik bilan shifoxonaga murojaat qilinadi.","mnemonic":"Muz — chorak soat, ustidan mato bilan.","id":1185},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Zilzila","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 24-§: zilzilalarning seysmik kamarlar bo'yicha taqsimoti foizlarda","requires_image":false,"question":"Seysmik kamarlarni ularda sodir bo'ladigan zilzilalar ulushi bilan moslashtiring:\n1. Tinch okean seysmik kamari\n2. O'rta yer dengizi (Osiyo) seysmik kamari\n3. O'rta Atlantika suvosti seysmik kamari\nA. Taxminan 15 foiz\nB. Taxminan 5 foiz\nC. Taxminan 80 foiz","options":{"A":"1-C, 2-A, 3-B","B":"1-B, 2-A, 3-C","C":"1-A, 2-C, 3-B","D":"1-C, 2-B, 3-A"},"answer":"A","explanation":"Zilzilalarning aksariyati Tinch okean seysmik kamarida sodir bo'ladi — taxminan 80 foiz. O'rta yer dengizi, ya'ni Osiyo kamarida 15 foiz, O'rta Atlantika suvosti kamarida esa atigi 5 foiz zilzila yuz beradi.","mnemonic":"Tinch okean — 80, Osiyo — 15, Atlantika — 5.","id":1186},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Zilzila","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 24-§: zilzila turlari — tektonik, vulqon, o'pirilish","requires_image":false,"question":"Zilzila turlarini ularning izohi bilan moslashtiring:\n1. Tektonik\n2. Vulqon\n3. O'pirilish\nA. Faqat vulqon faolligi bor hududlarda yuz beradi, Markaziy Osiyoda bo'lmaydi\nB. Eng keng tarqalgan turi (95-99%), Yer qobig'i harakatlari bilan bog'liq\nC. Yer ostidagi bo'shliqlarning qulashidan yuzaga keladi, kuchsiz bo'ladi","options":{"A":"1-B, 2-C, 3-A","B":"1-A, 2-B, 3-C","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"D","explanation":"Tektonik zilzilalar eng keng tarqalgan tur bo'lib, barcha zilzilalarning 95-99 foizini tashkil etadi va Yer qobig'i harakatlari bilan bog'liq. Vulqon zilzilalari faqat vulqon faol hududlarda yuz beradi, Markaziy Osiyoda bo'lmaydi. O'pirilish zilzilalari yer ostidagi bo'shliqlar qulashidan kelib chiqadi va kuchsiz bo'ladi.","mnemonic":"Tektonik — qobiq, vulqon — otilish, o'pirilish — bo'shliq.","id":1187},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Zilzila","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 24-§: birinchi qavat yoki past devorli uyda zilzilada tashqariga chiqish vaqti","requires_image":false,"question":"Ko'p qavatli uyning birinchi qavatida yoki past devorli shaxsiy uyda yer qimirlay boshlaganda necha soniya ichida tashqariga chiqib ketish tavsiya etiladi?","options":{"A":"5 daqiqa ichida","B":"1-2 daqiqa ichida","C":"45-50 soniya ichida","D":"15-20 soniya ichida"},"answer":"D","explanation":"Birinchi qavatda yoki xom g'isht, paxsa devorli shaxsiy uyda yashasangiz, yer qimirlashi boshlanishi bilan 15-20 soniya ichida darhol tashqariga chiqib ketish kerak. Bunda elektr simlari, gaz quvurlari va baland imoratlardan uzoqroqqa, ochiq joyga o'tish lozim.","mnemonic":"Past qavat — yigirma soniya, darhol tashqariga.","id":1188},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Sel va suv toshqini","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 25-§: harakatdagi sel oqimidan saqlanish masofasi","requires_image":false,"question":"Harakatdagi sel oqimidan kamida qancha masofa uzoqlikda turish kerak?","options":{"A":"50-70 metr","B":"5-10 metr","C":"200 metr","D":"100-150 metr"},"answer":"A","explanation":"Harakatdagi sel oqimi tomon yaqinlashmasdan, undan kamida 50-70 metr uzoqroq masofada turish kerak. Tinimsiz yomg'ir davom etsa, sel va suv toshqini xavfi yuqori hududlardan tezda xavfsiz joyga o'tish lozim.","mnemonic":"Seldan ellik-yetmish qadam nari.","id":1189},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Sel va suv toshqini","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 25-§: ko'chki, sel ta'riflari","requires_image":false,"question":"Tabiiy ofat tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Ko'chki\n2. Sel\nA. Tog' daryolari o'zanlarida to'satdan yuzaga keluvchi qum, tosh va tog' jinslari aralashmasidan iborat loyqa oqim\nB. Insonlar o'limiga olib kelishi mumkin bo'lgan, ularni xavfsiz joyga ko'chirishni talab qiluvchi yer ko'chishi va tog' o'pirilishi","options":{"A":"1-A, 2-A","B":"1-B, 2-A","C":"1-B, 2-B","D":"1-A, 2-B"},"answer":"B","explanation":"Ko'chki — insonlar o'limiga olib kelishi mumkin bo'lgan, ularni xavfli hududdan xavfsiz joylarga ko'chirishni talab qiluvchi yer ko'chkilari va tog' o'pirilishlari. Sel esa tog' daryolari o'zanlarida to'satdan yuzaga keluvchi qum, tosh va tog' jinslari aralashmasidan iborat loyqa yoki loy-toshli oqim.","mnemonic":"Ko'chki — yer surilishi, sel — loy-toshli oqim.","id":1190},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Kuchli shamol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 26-§: shamol tezligiga ko'ra tasnif — o'rtacha, kuchli, dovul, bo'ron","requires_image":false,"question":"Shamol turlarini ularning tezligi bilan moslashtiring:\n1. O'rtacha shamol\n2. Kuchli shamol\n3. Dovul (shtorm)\n4. Bo'ron\nA. 14 m/s\nB. 30 m/s\nC. 5-8 m/s\nD. 20-25 m/s","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-B, 2-A, 3-D, 4-C","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"5-8 m/s tezlikdagi shamol o'rtacha, 14 m/s tezlikdagi shamol kuchli hisoblanadi. 20-25 m/s tezlikdagi shamol dovul yoki shtorm, 30 m/s tezlikdagi shamol esa bo'ron deyiladi.","mnemonic":"8 — o'rtacha, 14 — kuchli, 25 — dovul, 30 — bo'ron.","id":1191},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Kuchli jala","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: kuchli jalaning yog'ish jadalligi","requires_image":false,"question":"Kuchli jalaning yog'ish jadalligi har soatda qancha miqdorga yetishi mumkin?","options":{"A":"500 mm gacha","B":"300 mm gacha","C":"10 mm gacha","D":"100 mm gacha"},"answer":"D","explanation":"Kuchli jala — shiddat bilan yog'adigan qisqa muddatli atmosfera yog'ini bo'lib, uning yog'ish jadalligi har soatda 100 mm gacha yetadi. Ba'zan ho'l qor va qor uchqunlari aralash yog'adi.","mnemonic":"Jala — soatiga yuz millimetr.","id":1192},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 26-§: muzlashda tana harorati bilan bog'liq xavfli chegaralar 32°C va 27°C","requires_image":false,"question":"Muzlashda tana harorati chegaralarini ularning oqibati bilan moslashtiring:\n1. 32°C dan past\n2. 27°C\nA. Koma holatiga olib kelishi mumkin\nB. Yurak va nafas tizimlari faoliyati buziladi","options":{"A":"1-A, 2-A","B":"1-B, 2-A","C":"1-B, 2-B","D":"1-A, 2-B"},"answer":"B","explanation":"Tana harorati 32°C dan past darajada yurak va nafas tizimlari faoliyati buziladi. Harorat 27°C darajaga tushganda esa koma holatiga olib kelishi mumkin. Muzlash holatida inson har doim o'z ahvolini to'g'ri baholay olmaydi.","mnemonic":"32 — yurak buziladi, 27 — koma.","id":1193},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: anomal sovuq ta'rifi — me'yordan 7-12°C pasayish","requires_image":false,"question":"Anomal sovuq deganda havo haroratining me'yordan qancha pasayib ketishi tushuniladi?","options":{"A":"20-25°C gacha","B":"30°C gacha","C":"1-3°C gacha","D":"7-12°C gacha"},"answer":"D","explanation":"Anomal sovuq — havo haroratining me'yordan 7-12°C gacha pasayib ketish holati. Bunday paytda qo'l va oyoq barmoqlari, yuz, burun va quloq muzlash xavfiga uchraydi, shuning uchun doimiy harakatlanish va issiq kiyim kiyish kerak.","mnemonic":"Me'yordan yetti-o'n ikki gradus past — anomal sovuq.","id":1194},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 26-§: muzlash belgilarining rivojlanish bosqichlari","requires_image":false,"question":"Muzlash belgilarining rivojlanish bosqichlarini to'g'ri tartibda joylashtiring:\n1. Teri qizarishi va qisqa muddatli isinish\n2. Sovuqni sezish\n3. Sezuvchanlikning yo'qolishi va uvishish","options":{"A":"2, 1, 3","B":"1, 2, 3","C":"3, 2, 1","D":"2, 3, 1"},"answer":"A","explanation":"Muzlash avval sovuqni sezish bilan boshlanadi. So'ng qisqa muddatli isinish va teri qizarishi kuzatiladi. Keyin sezuvchanlik yo'qolib, tana qismi uvishadi. Bu bosqichda inson o'z holatini to'g'ri baholay olmasligi xavfli.","mnemonic":"Sezish — qizarish — uvishish: muzlash zinapoyasi.","id":1195},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal issiq","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: inson tanasi tarkibidagi suyuqlik ulushi va qontomir normal harorati","requires_image":false,"question":"Inson tanasining necha foizdan ko'p qismi suyuqlikdan iborat?","options":{"A":"50% dan ko'prog'i","B":"70% dan ko'prog'i","C":"90% dan ko'prog'i","D":"30% dan ko'prog'i"},"answer":"B","explanation":"Inson tanasining 70 foizdan ko'proq qismi suyuqlikdan iborat. Qontomir tizimi 36,6°C haroratda normal ishlab, hujayralarni oziqlantiradi va kislorod bilan ta'minlaydi. Shu sababli anomal issiqda ko'p suyuqlik ichish muhim.","mnemonic":"Tananing yetmish foizi — suyuqlik.","id":1196},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal issiq","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 26-§: issiq havoda profilaktika choralari va xavf guruhlari","requires_image":false,"question":"Anomal issiqqa oid tushunchalarni mos izoh bilan moslashtiring:\n1. Quyosh urishi belgilari\n2. Issiq havo ko'proq xavfli guruh\n3. Profilaktika chorasi\nA. Qariyalar, chaqaloqlar, surunkali kasalligi borlar\nB. Ko'p suyuqlik ichish, suvga boy meva yeyish, kunning issiq soatlarida ko'chaga chiqmaslik\nC. Bosh og'rig'i, tana haroratining ko'tarilishi, ko'ngil aynishi, holsizlik","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-C, 2-A, 3-B","D":"1-B, 2-A, 3-C"},"answer":"C","explanation":"Quyosh urishi belgilari — bosh og'rig'i, tana haroratining ko'tarilishi, ko'ngil aynishi va holsizlik. Issiq havo ayniqsa qariyalar, chaqaloqlar va surunkali kasalligi borlar uchun xavfli. Profilaktika sifatida ko'p suyuqlik ichish, suvga boy meva yeyish va kunning issiq soatlarida ko'chaga chiqmaslik tavsiya etiladi.","mnemonic":"Belgi — bosh og'riq, xavf — qariya-bola, chora — suv ich.","id":1197},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Transport avariyalari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 27-§: transport avariyalari turlari — aviahalokat, avtomobil, temiryo'l, metropoliten","requires_image":false,"question":"Transport avariyalari turlarini ular sodir bo'ladigan soha bilan moslashtiring:\n1. Aviahalokat\n2. Avtomobil halokati\n3. Temiryo'l halokati\n4. Metropoliten halokati\nA. Yo'l-transport hodisalari, portlash va yong'inlar bilan kechadi\nB. Bekatlar va tunnellardagi avariyalar\nC. Havo kemalarining parchalanishi, qidiruv-avariya ishlari talab qiladi\nD. Harakatlanuvchi tarkibning ag'darilishi, vokzal binolaridagi odamlarga xavf","options":{"A":"1-A, 2-C, 3-D, 4-B","B":"1-C, 2-A, 3-D, 4-B","C":"1-B, 2-A, 3-D, 4-C","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Aviahalokat havo kemalarining parchalanishi bilan kechib, qidiruv va avariya-qidiruv ishlarini talab qiladi. Avtomobil halokati yo'l-transport hodisalari, portlash va yong'inlar bilan bog'liq. Temiryo'l halokati harakatlanuvchi tarkibning ag'darilishi va vokzaldagi odamlarga xavf tug'diradi. Metropoliten halokatlari bekatlar va tunnellarda sodir bo'ladi.","mnemonic":"Havo — qidiruv, yo'l — portlash, rels — ag'darilish, metro — tunnel.","id":1198},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Zilzila","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 24-§: O'zbekiston va Markaziy Osiyo zilzilalari qobiq turiga kirishi va chuqurligi","requires_image":false,"question":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan qaysi turga kiradi va qancha chuqurlikda bo'ladi?","options":{"A":"Chuqur fokusli, chuqurligi 300 km dan ortiq","B":"Qobiq zilzilalari, chuqurligi odatda 10-40 km","C":"Vulqon zilzilalari, chuqurligi 5 km","D":"Qobiq osti, chuqurligi 100-200 km"},"answer":"B","explanation":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan qobiq zilzilalariga kiradi. Ularning chuqurligi odatda 10-40 km, ba'zida 70 km gacha boradi. Qobiq zilzilalari 70 km gacha chuqurlikda yuzaga keladigan tur hisoblanadi.","mnemonic":"Markaziy Osiyo — qobiq zilzila, o'n-qirq kilometr.","id":1199},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Kuchli shamol","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 26-§: kuchli shamol kuchayib borishi — o'rtacha, kuchli, dovul, bo'ron","requires_image":false,"question":"Shamol turlarini tezligi ortib borishi tartibida joylashtiring:\n1. Dovul (shtorm)\n2. O'rtacha shamol\n3. Bo'ron\n4. Kuchli shamol","options":{"A":"3, 1, 4, 2","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Tezlik ortib borishi tartibida: o'rtacha shamol (5-8 m/s), kuchli shamol (14 m/s), dovul yoki shtorm (20-25 m/s) va eng kuchlisi bo'ron (30 m/s). Tezlik qancha katta bo'lsa, shamol shuncha xavfli hisoblanadi.","mnemonic":"O'rtacha, kuchli, dovul, bo'ron — sekindan shiddatga.","id":1200}];
let ftype="hammasi", shown=0; const PAGE=20;
const list=document.getElementById("list");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fdata(){return ftype==="hammasi"?DATA:DATA.filter(q=>q.qtype===ftype);}
function render(reset){ if(reset){list.innerHTML="";shown=0;}
 const d=fdata(); const slice=d.slice(shown,shown+PAGE); shown+=slice.length;
 for(const q of slice){ const c=document.createElement("div"); c.className="card";
  let opts=""; for(const k of ["A","B","C","D"]) opts+='<div class="opt '+(k===q.answer?"ok":"")+'">'+k+") "+esc(q.options[k])+"</div>";
  c.innerHTML='<div><span class="tag">'+esc(q.qtype)+'</span><span class="tag">'+esc(q.difficulty||"")+'</span><span class="tag">'+esc(q.bloom_level||"")+'</span><span class="tag">'+esc((q.topic||"").slice(0,40))+"</span></div>"
   +'<div class="q">'+esc(q.question)+"</div>"+opts
   +'<div class="exp">💡 '+esc(q.explanation||"")+"</div>"
   +(q.mnemonic?'<div class="mn">🧠 '+esc(q.mnemonic)+"</div>":"");
  list.appendChild(c);}
 document.getElementById("more").style.display = shown>=d.length?"none":"block";
 document.getElementById("meta").textContent="Jami: "+DATA.length+" ta | Ko'rsatilmoqda: "+shown+" / "+d.length;
}
for(const t of ["hammasi","single","matching","sequence"]){
 const b=document.createElement("button"); b.textContent=t; if(t===ftype)b.className="act";
 b.onclick=()=>{ftype=t;document.querySelectorAll(".filters button").forEach(x=>x.className="");b.className="act";render(true);};
 document.getElementById("flt").appendChild(b);}
document.getElementById("more").onclick=()=>render(false);
render(true);
</script></body></html>
