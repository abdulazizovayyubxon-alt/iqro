ash kerak?","options":{"A":"Har bir xodimning balandligi","B":"Front bo‘yicha masofa","C":"Qanotlar orasidagi masofa","D":"Saf uzunligi"},"answer":"C","explanation":"Saf eni – safning chap va o‘ng qanotlari orasidagi masofadir.","mnemonic":"En – e'lon qilinadi","id":172},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Mashinalar chizig‘i","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Mashinalar chizig‘i – mashinalar bir chiziqda yonma‑yon joylashgan saf.","requires_image":false,"question":"Mashinalar chizig‘i nima ifodalaydi?","options":{"A":"Mashinalarning har biriga alohida yo‘riqnoma","B":"Mashinalarning otish tartibi","C":"Mashinalarning maksimal tezligi","D":"Mashinalar bir chiziqda yonma‑yon joylashgan saf"},"answer":"D","explanation":"Mashinalar chizig‘i – mashinalar bir chiziqda yonma‑yon joylashgan safni anglatadi.","mnemonic":"Chiziq – chiroyli chizgi","id":173},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safni boshqarish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Saf Nizomida safning boshqarilishi, saf bo‘linmalari va ularning harakati tavsifi keltirilgan.","requires_image":false,"question":"Safni boshqarishda eng muhim element qaysi?","options":{"A":"Safning tartibli joylashuvi","B":"Maqsadga mos qurol tanlovi","C":"Foydalaniladigan transport vositasi","D":"Har bir xodimning shaxsiy tezligi"},"answer":"A","explanation":"Safning boshqarilishi safning belgilangan tartibda joylashuvi va harakati bilan bog‘liq.","mnemonic":"Boshqarish – bir tartib","id":174},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Saf tizimida birinchi, ikkinchi, uchinchi sherengali saflar, shuningdek, mashina va piyoda saf turlari keltirilgan.","requires_image":false,"question":"Saf turlarini ularning tavsifi bilan moslashtiring:\n1. Birinchi sherengali saf\n2. Ikki sherengali saf\n3. Mashinalar chizig‘i\nA. Xodimlar bir chiziqda, interval saqlanib turadi\nB. Ikkinchi sherengadagi xodimlar birinchi sherengadagi xodimlar ortida bir qadamga teng masofada\nC. Mashinalar yonma‑yon joylashgan saf","options":{"A":"1-C, 2-A, 3-B","B":"1-A, 2-B, 3-C","C":"1-A, 2-C, 3-B","D":"1-B, 2-A, 3-C"},"answer":"B","explanation":"Birinchi sherengali saf – xodimlar bir chiziqda interval saqlanadi (A). Ikki sherengali saf – ikkinchi sherengadagi xodimlar birinchi sherengadagi xodimlar ortida bir qadamga teng masofada (B). Mashinalar chizig‘i – mashinalar yonma‑yon joylashgan saf (C).","mnemonic":"Bir, ikki, mashina – birinchidan, ikkinchidan, mashinadan","id":175},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Safning bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Safning harakat bosqichlari: tayyorlanish, harakat, to‘xtash va qaytish.","requires_image":false,"question":"Saf harakati bosqichlarini to‘g‘ri tartibda joylashtiring:\n1. To‘xtash\n2. Harakat\n3. Tayyorlanish\n4. Qaytish\nA. 3, 2, 1, 4\nB. 1, 2, 3, 4\nC. 2, 3, 4, 1\nD. 3, 1, 2, 4","options":{"A":"2, 3, 4, 1","B":"3, 2, 1, 4","C":"1, 2, 3, 4","D":"3, 1, 2, 4"},"answer":"B","explanation":"Saf harakati quyidagi bosqichlarda amalga oshiriladi: tayyorlanish → harakat → to‘xtash → qaytish.","mnemonic":"Tayyor → Harakat → To‘xtash → Qaytish","id":176},{"subject":"Harbiy ta'lim","topic":"Saf nizomi","subtopic":"Saf bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Saf harakati bosqichlari: tayyorlanish, harakat, to‘xtash, qaytish.","requires_image":false,"question":"Quyidagi saf harakati bosqichlarini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Tayyorlanish\n2. Harakat\n3. To‘xtash\n4. Qaytish","options":{"A":"1, 3, 2, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"3, 2, 1, 4"},"answer":"C","explanation":"Saf harakati avvalo tayyorlanadi, keyin harakat qilinadi, to‘xtash amalga oshiriladi va oxirida qaytish bosqichi keladi.","mnemonic":"Tayyor → Harakat → To‘xtash → Qaytish","id":177},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Kolonna","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Kolonna: harbiy xizmatchilar va bo'linmalarning Saf Nizomida belgilangan distansiyani saqlagan holda bir-birining ortida joylashuvi","requires_image":false,"question":"Saf Nizomida bir-birining ortida joylashgan bo'linma strukturasiga nima deyiladi?","options":{"A":"Kolonna","B":"Yurish safi","C":"Safni boshqarish","D":"Qator"},"answer":"A","explanation":"Kolonna tushunchasi aynan shu tavsifga mos keladi.","mnemonic":"Kolonna – ortada joy.","id":178},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Yurish safi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Yurish safi: kolonnaga tizilgan bo'linmalarning ketma-ket joylashgan safi","requires_image":false,"question":"Bo'linma va mashinalar ketma-ket joylashgan, harakatlanishi uchun belgilangan saf qanday nomlanadi?","options":{"A":"Tashkiliy qism","B":"Saf Nizomi","C":"Komanda","D":"Yurish safi"},"answer":"D","explanation":"Bu tavsifga 'Yurish safi' deb ataladi.","mnemonic":"Yurish – ketma-ket harakat.","id":179},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Yetakchi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Yetakchi: tayinlangan yo'nalishda bosh bo'lib borayotgan harbiy xizmatchi","requires_image":false,"question":"Safda harbiy xizmatchilar harakatini kimga qarab moslashtiradi?","options":{"A":"Komandirga","B":"Oxirgi xizmatchiga","C":"Kolonna boshlig'iga","D":"Yetakchiga"},"answer":"D","explanation":"Yetakchi harakatni boshqaruvchi bo'lib, qolganlar unga moslashadi.","mnemonic":"Yetakchi – bosh yo'nalish.","id":180},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Oxirida boruvchi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Oxirida boruvchi: kolonnaning oxirida borayotgan harbiy xizmatchi","requires_image":false,"question":"Safda oxirgi pozitsiyada joylashgan harbiy xizmatchi qanday ataladi?","options":{"A":"Saf boshqaruvchisi","B":"Yetakchi","C":"Oxirida boruvchi","D":"Qator boshchisi"},"answer":"C","explanation":"Bu ro'lga 'Oxirida boruvchi' nomi berilgan.","mnemonic":"Oxirda – oxirida boruvchi.","id":181},{"subject":"Harbiy ta'lim","topic":"Saf boshqaruvi","subtopic":"Komandalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safni boshqarish: komandir tomonidan ovoz, signallar, shaxsan ko'rsatish bilan amalga oshiriladi","requires_image":false,"question":"Safni boshqarish jarayonida asosiy vosita nima?","options":{"A":"Radio aloqasi","B":"Harbiy xabar","C":"Komandir buyrug'i","D":"Elektron tizim"},"answer":"C","explanation":"Safni boshqarishning asosiy vositasi komandirning ovoz, signallar yoki shaxsiy ko'rsatishlaridir.","mnemonic":"Komandir – boshqarish kaliti.","id":182},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Saf turlari farqlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Qator, Kolonna, Yurish safi, Yetakchi, Oxirida boruvchi","requires_image":false,"question":"Quyidagi elementlarni tavsifiga moslashtiring:\n1. Biror harbiy xizmatchi boshida bo'lib, boshqalar unga qarab harakat qiladi.\n2. Bo'linmalar bir-birining ortida joylashadi.\n3. Saf oxiridagi xizmatchi.\n4. Har bir xizmatchi bir qator ichida ketma-ket turadi.\nA. Yetakchi\nB. Kolonna\nC. Oxirida boruvchi\nD. Qator","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-D, 2-C, 3-B, 4-A","D":"1-A, 2-B, 3-C, 4-D"},"answer":"D","explanation":"Yetakchi – bosh harbiy xizmatchi, kolonna – ortada joylashgan, oxirida boruvchi – oxirgi xizmatchi, qator – ketma-ket turgan holat.","mnemonic":"Yetakchi – bosh, Kolonna – ortada, Oxir – oxir, Qator – birga.","id":183},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Saf turlari tavsifi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safni boshqarish: komandir tomonidan ovoz, signallar, shaxsan ko'rsatish bilan, texnik vositalar orqali ham","requires_image":false,"question":"Safni boshqarishda texnik vositalar qaysi vazifani bajaradi?","options":{"A":"Maqsadni aniqlash","B":"Komandalarni takrorlash","C":"Jismoniy harakatni cheklash","D":"Xavfsizlikni tekshirish"},"answer":"B","explanation":"Texnik vositalar komandir buyrug'ini takrorlash va yetkazishda ishlatiladi.","mnemonic":"Texnik – buyrug'ni uzatadi.","id":184},{"subject":"Harbiy ta'lim","topic":"Saf strukturalari","subtopic":"Safni boshqarish usullari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safni boshqarish: komandir, signallar, shaxsan ko'rsatish, texnik vositalar","requires_image":false,"question":"Safni boshqarish jarayonini to'g'ri ketma-ketlikda joylashtiring:\n1. Komandir ovoz bilan buyrug'ini beradi.\n2. Texnik vosita buyrug'ni takrorlaydi.\n3. Xodimlar signallarni qabul qiladi.\n4. Shaxsiy ko'rsatish bilan harakat boshlanadi.","options":{"A":"1, 4, 3, 2","B":"1, 2, 3, 4","C":"2, 1, 4, 3","D":"1, 3, 2, 4"},"answer":"D","explanation":"Birinchi komandir ovoz buyrug'i, keyin xodimlar signallarni qabul qiladi, texnik vosita takrorlaydi, oxirida shaxsiy ko'rsatish bilan harakat amalga oshiriladi.","mnemonic":"Ovoz → signal → texnik → ko'rsatish.","id":185},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Saf turi misollari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Ikki sherengali saf ortga burilganda, to'liq bo'lmagan qatordagi harbiy xizmatchi oldingi sherengaga o'tadi.","requires_image":false,"question":"Ikki sherengali safda, to'liq bo'lmagan qator holatida xodimlarning harakati qanday bo'ladi?\n1. Saf ortga buriladi.\n2. Qator to'liq bo'ladi.\n3. Oldingi sherengaga xodim o'tadi.\n4. Yangi qator tashkil etiladi.","options":{"A":"1, 3, 2, 4","B":"1, 3, 4, 2","C":"2, 1, 3, 4","D":"1, 2, 3, 4"},"answer":"D","explanation":"Aytilgandek, saf ortga buriladi, qator to'liq bo'ladi, keyin xodim oldingi sherengaga o'tadi, oxirida yangi qator paydo bo'ladi.","mnemonic":"Burilish → to'liq → o'tish → yangi.","id":186},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Safda harakat intervali","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Kolonnalar bo'linma va harbiy qismlarning yurish safida harakatlanishi yoki yonma-yon tizilishi mumkin.","requires_image":false,"question":"Kolonnada harbiy qismlar bir-biriga nisbatan qanday harakatlanadi?","options":{"A":"Faqat yonma-yon","B":"Yurish yoki yonma-yon","C":"Faqat yurish","D":"Stasionar"},"answer":"B","explanation":"Kolonnalar harakatini 'yurish' yoki 'yonma-yon' sifatida tasvirlaydi.","mnemonic":"Kolonna – yurish yoki yonma-yon.","id":187},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Safda interval","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safda harbiy xizmatchilar front bo'yicha bir qadamga yoki komandir belgilagan masofaga teng interval qoldirgan holda joylashadi.","requires_image":false,"question":"Safda harbiy xizmatchilar orasidagi masofa qanday belgilangan?","options":{"A":"Har doim 1 metr","B":"Komandir belgilagan interval","C":"Tasodifiy","D":"Mahalliy sharoitga qarab"},"answer":"B","explanation":"Interval komandir tomonidan belgilanadi, bu masofa bir qadam yoki o'ziga xos bo'lishi mumkin.","mnemonic":"Komandir – intervalni belgilaydi.","id":188},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Safning asosiy elementlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Saf Nizomi: safni tashkil etuvchi qoidalar va tartiblar","requires_image":false,"question":"Safni tashkil etuvchi asosiy hujjatga nima deyiladi?","options":{"A":"Komanda ro'yxati","B":"Saf Nizomi","C":"Taktika qo'llanmasi","D":"Xodimlar rejasi"},"answer":"B","explanation":"Safni boshqarish va tartibga solish hujjati 'Saf Nizomi' deb ataladi.","mnemonic":"Saf Nizomi – asosiy hujjat.","id":189},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Saf turi misoli","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Bo'linma: bir va ikki sherengali safda (mashinalar chizig'ida) front bo'ylab bir yonma-yon chiziqqa tizilgan","requires_image":false,"question":"Bir yoki ikki sherengali safda mashinalar qanday tarzda joylashadi?","options":{"A":"Uzluksiz doirada","B":"Tasodifiy","C":"Yonma-yon chiziqqa","D":"Rasmiy tartibda"},"answer":"C","explanation":"Mashinalar bir yoki ikki sherengali safda front bo'yicha yonma-yon chiziqqa tizilganligi aytilgan.","mnemonic":"Mashina – yonma-yon chiziq.","id":190},{"subject":"Harbiy ta'lim","topic":"Saf boshqaruvi","subtopic":"Komandirning roli","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Safni boshqarish: komandir tomonidan ovoz, signallar, shaxsan ko'rsatish","requires_image":false,"question":"Quyidagi kommunikatsiya usullarini ularning tavsifi bilan moslashtiring:\n1. Ovozli buyrug'lar.\n2. Vizual signallar.\n3. Shaxsiy ko'rsatmalar.\nA. Komandirning to'g'ridan-to'g'ri ko'rsatuvi.\nB. Komandirning ovoz orqali berilgan buyrug'i.\nC. Komandirning qo'l harakati yoki bayroq.\n","options":{"A":"1-A, 2-B, 3-C","B":"1-B, 2-A, 3-C","C":"1-B, 2-C, 3-A","D":"1-C, 2-A, 3-B"},"answer":"C","explanation":"Ovozli buyrug'lar (1) – B ga, vizual signallar (2) – C ga, shaxsiy ko'rsatmalar (3) – A ga mos keladi.","mnemonic":"Ovoz → B, Signallar → C, Ko'rsatma → A.","id":191},{"subject":"Harbiy ta'lim","topic":"Safda komandalar","subtopic":"Dastlabki va ijro komandalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"10 DASTLABKI VA IJRO KOMANDALARI, QAD ROSTLAB TURISH","requires_image":false,"question":"Safda \"Bosh kiyim KIYILSIN!\" bu qanday turdagi komandadir?","options":{"A":"Xato komanda","B":"Dastlabki komanda","C":"Qayta rostlab turish komanda","D":"Ijro komanda"},"answer":"B","explanation":"\"Bosh kiyim KIYILSIN!\" dastlabki komanda sifatida ko‘rsatilgan, ya'ni harbiy xizmatchiga tayyorgarlik bosqichida beriladi. Ijro komanda amalda bajariladigan buyruq bo‘lib, bu yerda qo‘llanilmagan.","mnemonic":"Dastlabki – tayyorgarlik","id":192},{"subject":"Harbiy ta'lim","topic":"Komanda bosqichlari","subtopic":"Safda harakatlar ketma-ketligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Safda turgan harbiy xizmatchilar har qanday dastlabki komandaga binoan qad rostlaydi; yurish davomida esa shaxdam qadam tashlay boshlashadi; safdan tashqarida bo'lsa, boshliq tomon o'girilib, qad rostlab turishadi.","requires_image":false,"question":"Quyidagi harakatlarni ularning tavsifi bilan moslashtiring:\n1. Dastlabki komanda\n2. Qad rostlab turish\n3. Safdan tashqarida bo'lish\nA. Oyoqni frontga parallel qilib qo'yish\nB. Harakatni aniq ko'rsatish\nC. Boshliq tomon o'girilib turish","options":{"A":"1-B, 2-C, 3-A","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-A, 2-C, 3-B"},"answer":"C","explanation":"Dastlabki komanda – harakatni aniq ko'rsatadi (B). Qad rostlab turish – oyoqni frontga parallel qilib qo'yadi (A). Safdan tashqarida bo'lganda boshliq tomon o'girilib turadi (C). Shuning uchun 1-B, 2-A, 3-C to'g'ri.","mnemonic":"Dastlabki – harakat, Qad – oyoq, Saf tashqarida – boshliq","id":193},{"subject":"Harbiy ta'lim","topic":"Saf harakati","subtopic":"Qad rostlab turish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Qad “SAFLAN!” yoki “ROSTLAN!” komandasiga binoan rostlanadi; harbiy xizmatchi zo'riqmasdan to'g'ri turib, poshnalarini birga, oyoq uchlarini front bo'yylab bir chiziqqa oyoq kafti kengligida qo'yadi; tizzasiga zo'riq bermay, to'g'ri tutadi, ko'krak qafasini biroz ko'tarib, tanasini old tomon salog'diradi, qorin sohasini ichkariga tortadi, yelkasini to'g'ri tutib, kafti tanaga q.","requires_image":false,"question":"Qad rostlab turish holatini to'g'ri ketma-ketlikda joylashtiring:\n1. Oyoq uchlarini front bo'yiga parallel qo'yish\n2. Ko'krak qafasini ko'tarish\n3. Tizzalarni zo'riqmasdan to'g'ri tutish\n4. Qorin sohasini ichkariga tortish","options":{"A":"2, 1, 3, 4","B":"3, 1, 2, 4","C":"1, 2, 3, 4","D":"1, 3, 2, 4"},"answer":"D","explanation":"Avvalo oyoq uchlari frontga parallel qo'yiladi (1), keyin tizzalar zo'riqmasdan to'g'ri tutiladi (3), so'ng ko'krak qafasini ko'tarish (2), oxirida qorin ichkariga tortish (4). Shuning uchun 1‑3‑2‑4 tartibi to'g'ri.","mnemonic":"Oyoq → Tizza → Ko'krak → Qorin","id":194},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Erkin komandasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"‘ERKIN!’ komandasi berilganda harbiy xizmatchi harakatlanmay, diqqatini chalg‘itmay turadi.","requires_image":false,"question":"‘ERKIN!’ komandasi berilganda harbiy xizmatchi qanday holatda bo‘ladi?","options":{"A":"O‘yin holatiga o‘tadi","B":"Tezkor harakatlanib, qurolini yoqadi","C":"Harakatlanmay, gaplashmay, diqqatini chalg‘itmay turadi","D":"O‘ng qo‘lini ko‘krak sohasiga qo‘yaydi"},"answer":"C","explanation":"‘ERKIN!’ komandasi berilganda xizmatchi harakatlanmay, gaplashmay, diqqatni chalg‘itmay turishi kerakligi ko‘rsatilgan.","mnemonic":"Erkin – harakat yo‘q, diqqat yo‘q.","id":195},{"subject":"Harbiy ta'lum","topic":"Harbiy komandalar","subtopic":"Komanda berilish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"‘ERKIN!’ – ‘TUR!’ – ‘DIQQAT!’ komandalarining berilish tartibi matnda ko‘rsatilgan.","requires_image":false,"question":"Quyidagi komandalarni to‘g‘ri ketma‑ketlikda joylashtiring:\n1. DIQQAT!\n2. ERKIN!\n3. TUR!","options":{"A":"1, 2, 3","B":"2, 1, 3","C":"2, 3, 1","D":"3, 2, 1"},"answer":"C","explanation":"Avval ‘ERKIN!’, keyin ‘TUR!’, oxirida ‘DIQQAT!’ komandalari keladi; shu sabab 2‑3‑1 to‘g‘ri.","mnemonic":"Erkin, Tur, Diqqat – ketma‑ket.","id":196},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda berish shartlari","difficulty":"Y2","bloom_level":"Qo‘llash","qtype":"single","source_construct":"‘TUR!’ komandasi berilganda xizmatchi to‘liq ekipirovkada bo‘lishi shart.","requires_image":false,"question":"‘TUR!’ komandasi berilganda xizmatchi qanday holatda bo‘lishi lozim?","options":{"A":"Bosh kiyimsiz, qo‘llarini yon tomonlarga yoyadi","B":"Yaltiroq kiyimda, qo‘llari yelkada","C":"O‘qni qurolning orqa tomoniga qo‘ya oladi","D":"To‘liq ekipirovkada, chap oyog‘ini yarim qadam yonga tashlab"},"answer":"D","explanation":"‘TUR!’ komandasi to‘liq ekipirovkada, chap oyog‘ini yarim qadam yonga tashlab turish tavsiya qilingan.","mnemonic":"Tur – to‘liq ekipirovka.","id":197},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda berish xatolari","difficulty":"Y2","bloom_level":"Qo‘llash","qtype":"single","source_construct":"‘ERKIN!’ komandasi berilganda xizmatchi harakatlanmasligi kerak; agar harakatlansa, bu noto‘g‘ri hisoblanadi.","requires_image":false,"question":"Quyidagi xatti-harakatlardan qaysi biri ‘ERKIN!’ komandasi berilganda xato hisoblanadi?","options":{"A":"Sukutda turish","B":"Harakatlanish","C":"Qo‘llarni qavslash","D":"Diqqatni jamlash"},"answer":"B","explanation":"‘ERKIN!’ komandasi harakatni to‘xtatish uchun beriladi; harakatlanish xato hisoblanadi.","mnemonic":"Erkin – harakat yo‘q.","id":198},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda mazmuni","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"‘DIQQAT!’ komandasi xizmatchiga tayyorlov holatini bildiradi.","requires_image":false,"question":"‘DIQQAT!’ komanda berilganda xizmatchi qanday holatda bo‘ladi?","options":{"A":"Bosh kiyimsiz, qo‘llar yuqoriga ko‘tarilgan","B":"Uyda dam olayotgan","C":"To‘liq ekipirovkada, o‘ng oyoqni orqaga qo‘shgan","D":"Ekipirovkasiz, chap oyog‘ini yarim qadam yonga tashlagan"},"answer":"D","explanation":"‘DIQQAT!’ komandasi ekipirovkasiz, chap oyog‘ini yarim qadam yonga tashlagan holatda tasvirlangan.","mnemonic":"Diqqat – ekipirovkasiz tayyor.","id":199},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda navlari","difficulty":"Y2","bloom_level":"Qo‘llash","qtype":"matching","source_construct":"‘ERKIN!’, ‘TUR!’, ‘DIQQAT!’ komandalarining vazifalari matnda ko‘rsatilgan.","requires_image":false,"question":"Komandalarni ularning asosiy maqsadi bilan moslashtiring:\n1. ERKIN!\n2. TUR!\n3. DIQQAT!\nA. Harakatni to‘xtatish, diqqatni jamlash\nB. To‘liq ekipirovkada, oyoq pozitsiyasini aniqlash\nC. Ekipirovkasiz, tayyorlov holatini belgilash","options":{"A":"1-A, 2-B, 3-C","B":"1-C, 2-A, 3-B","C":"1-B, 2-C, 3-A","D":"1-A, 2-C, 3-B"},"answer":"A","explanation":"‘ERKIN!’ – harakatni to‘xtatish (A); ‘TUR!’ – to‘liq ekipirovkada, oyoq pozitsiyasi (B); ‘DIQQAT!’ – ekipirovkasiz tayyorlov (C).","mnemonic":"Erkin‑A, Tur‑B, Diqqat‑C.","id":200},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda bosqichlari","difficulty":"Y2","bloom_level":"Qo‘llash","qtype":"matching","source_construct":"Komandalar berilish tartibi: ERKIN! → TUR! → DIQQAT!.","requires_image":false,"question":"Komandalar ketma‑ketligini moslashtiring:\n1. ERKIN!\n2. TUR!\n3. DIQQAT!\nA. 1‑2‑3\nB. 2‑1‑3\nC. 3‑2‑1\nD. 2‑3‑1","options":{"A":"2‑1‑3","B":"1‑2‑3","C":"2‑3‑1","D":"3‑2‑1"},"answer":"B","explanation":"Ketma‑ketlik ERKIN! → TUR! → DIQQAT! deb berilgan, shuning uchun 1‑2‑3 to‘g‘ri.","mnemonic":"Erkin, Tur, Diqqat – tartib.","id":201},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Bosh kiyim komandasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Bosh kiyim YECHILSIN!\" va \"...KIYILSIN!\" komandalarining mazmuni keltirilgan.","requires_image":false,"question":"Harbiy xodim bosh kiyimini yechish paytida qaysi komanda beriladi?","options":{"A":"Erkin!","B":"Bosh kiyim KIYILSIN!","C":"Bosh kiyim YECHILSIN!","D":"Rostlan!"},"answer":"C","explanation":"Bosh kiyimni yechish uchun \"Bosh kiyim YECHILSIN!\" komanda berilishi ko'rsatilgan.","mnemonic":"Yechish = YECHILSIN","id":202},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Bosh kiyim komandasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Bosh kiyim KIYILSIN!\" komanda tasvirlangan.","requires_image":false,"question":"Bosh kiyimni kiyish uchun qaysi komanda ishlatiladi?","options":{"A":"Bosh kiyim KIYILSIN!","B":"Rostlan!","C":"Bosh kiyim YECHILSIN!","D":"Erkin!"},"answer":"A","explanation":"Kiyish uchun \"Bosh kiyim KIYILSIN!\" komanda beriladi, matnda aynan shu ibora keltirilgan.","mnemonic":"Kiyish = KIYILSIN","id":203},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Rostlan komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Rostlan!\" komandasi ko'zguga qarab bajarilishi tavsiya qilingan.","requires_image":false,"question":"Harbiy xodim ko'zguga qarab \"Rostlan!\" komandasini bajarganda nima nazarda tutiladi?","options":{"A":"Ortiqcha balandlik","B":"O'ngga burilish","C":"Tez harakat","D":"To'g'ri turish holati"},"answer":"D","explanation":"\"Rostlan!\" komandasi tananing tik holatini saqlash, ya'ni to'g'ri turishni talab qiladi.","mnemonic":"Rostlan = to'g'ri turish","id":204},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Burilish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Chap-GA!\" va \"O'ng-GA!\" komandalarining bajarilishi tavsifi berilgan.","requires_image":false,"question":"Chapga burilish amalini bajarishda tananing qanday holati saqlanadi?","options":{"A":"Tikan holati saqlanadi, tizza bukilmaydi","B":"Ortiqcha og'irlik ko'tariladi","C":"Boshni burib, qo'l ko'tariladi","D":"Tizza egilib, oyoq ko'tariladi"},"answer":"A","explanation":"Chapga burilishda tananing tik holati saqlanadi, tizza bukilmay, vazn old oyoqqa o'tkaziladi deyilgan.","mnemonic":"Chap burilish = tik holat","id":205},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Erkin komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"ERKIN!\" komanda berilgandan keyin \"TO'G'RILANSIN!\" komandasi keladi.","requires_image":false,"question":"\"ERKIN!\" komandasi berilgandan so'ng qaysi komanda keladi?","options":{"A":"Rostlan!","B":"TO'G'RILANSIN!","C":"Bosh kiyim YECHILSIN!","D":"Bosh kiyim KIYILSIN!"},"answer":"B","explanation":"\"ERKIN!\" komandasi berilgandan keyin \"TO'G'RILANSIN!\" komandasi kelishi ko'rsatilgan.","mnemonic":"Erkin → To'g'ri","id":206},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Bosh kiyim holati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda yechilgan bosh kiyim erkin tushirilgan chap qo'lga, nishoni old tomonga qaragan holda olinadi.","requires_image":false,"question":"Yechilgan bosh kiyimni qanday usulda ushlab turish tavsiya etiladi?","options":{"A":"Ikkala qo'l bilan, yuqoriga ko'tarilgan","B":"O'ng qo'lga, orqa tomon qaratilgan","C":"Chap qo'lga, nishoni old tomon qaratilgan holda","D":"Boshga qo'yilgan holda"},"answer":"C","explanation":"Bosh kiyim erkin tushirilgan chap qo'lga, nishoni old tomon qaratilgan holda olinishi aytilgan.","mnemonic":"Chap qo'l, old nishon","id":207},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Burilish amallari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Matnda burilish amallari ikki qadamga bo'linadi: vazn o'tkazish va ortda qolgan oyoqni tortish.","requires_image":false,"question":"Chapga burilishda ikkinchi qadamda qanday harakat amalga oshiriladi?","options":{"A":"Qo'l chapga burilib, bosh yuqoriga ko'tariladi","B":"Oyoqlar bir-biriga chalg'itiladi","C":"Tizza egilib, orqa oyoq ko'tariladi","D":"Ortga qolgan oyoq to'g'ri tortilib, old oyoqqa taqaladi"},"answer":"D","explanation":"Ikkinchi qadamda ortda qolgan oyoq to'g'ri tortilib, old oyoqqa taqaladi – matnda shu tarzda tasvirlangan.","mnemonic":"Ikkinchi qadam = oyoq tortish","id":208},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda ketma-ketligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda komandalar: \"ERKIN!\", \"TO'G'RILANSIN!\", \"Rostlan!\", \"Bosh kiyim YECHILSIN!\" ketma-ketligi keltirilgan.","requires_image":false,"question":"Quyidagi komandalarni to'g'ri bajarish tartibi bilan moslashtiring:\n1. ERKIN!\n2. TO'G'RILANSIN!\n3. Rostlan!\n4. Bosh kiyim YECHILSIN!","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-B, 3-C, 4-D","D":"1-B, 2-C, 3-A, 4-D"},"answer":"D","explanation":"\"ERKIN!\" komandasi birinchi, keyin \"TO'G'RILANSIN!\", \"Rostlan!\" va oxirida \"Bosh kiyim YECHILSIN!\" keladi. Shuning uchun 1-B, 2-C, 3-A, 4-D moslik to'g'ri.","mnemonic":"Erkin → To'g'ri → Rostlan → Bosh kiyim","id":209},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Burilish qadamlar ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda burilish amallari: birinchi – vazn old oyoqqa o'tkazish, ikkinchi – ortda qolgan oyoqni tortish.","requires_image":false,"question":"Chapga burilishning qadamlarini to'g'ri ketma-ketlikda joylashtiring:\n1. Ortga qolgan oyoqni tortish\n2. Vazn old oyoqqa o'tkazish","options":{"A":"2, 1","B":"1, 1","C":"2, 2","D":"1, 2"},"answer":"A","explanation":"Birinchi qadam vaznni old oyoqqa o'tkazish, ikkinchi qadam ortga qolgan oyoqni tortish; shuning uchun 2,1 tartibi to'g'ri.","mnemonic":"Birinchi vazn, ikkinchi oyoq","id":210},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Burilish qadamlar ketma-ketligi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda o'ngga burilish amallari ham birinchi – vazn o'tkazish, ikkinchi – oyoq tortish deb tasvirlangan.","requires_image":false,"question":"O'ngga burilishning to'g'ri tartibini tanlang:\n1. Vazn o'ng oyoqqa o'tkazish\n2. Ortga qolgan oyoqni tortish","options":{"A":"2, 2","B":"1, 2","C":"1, 1","D":"2, 1"},"answer":"B","explanation":"O'ngga burilishda birinchi vazn o'ng oyoqqa o'tadi, keyin ortga qolgan oyoq tortiladi; 1,2 tartibi to'g'ri.","mnemonic":"O'ngda vazn, keyin oyoq","id":211},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Bosh kiyim komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Bosh kiyim YECHILSIN!\" komandasi safdan chiqishdan oldin berilishi aytilgan.","requires_image":false,"question":"Harbiy xodim safdan chiqish uchun bosh kiyimini yechishi kerak bo'lganda qaysi komanda beriladi?","options":{"A":"Bosh kiyim YECHILSIN!","B":"Bosh kiyim KIYILSIN!","C":"Rostlan!","D":"Erkin!"},"answer":"A","explanation":"Safdan chiqish oldidan bosh kiyimini yechish uchun \"Bosh kiyim YECHILSIN!\" komandasi beriladi.","mnemonic":"Safdan chiqish → YECHILSIN","id":212},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Ortga burilish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Ortga burilish ikki bosqichda bajariladi\"","requires_image":false,"question":"Ortga burilish qanday bosqichlarda bajariladi?","options":{"A":"Uch bosqichda","B":"Bir bosqichda","C":"To'rt bosqichda","D":"Ikki bosqichda"},"answer":"D","explanation":"Ortga burilish ikki bosqichda bajarilishi aniq aytilgan.","mnemonic":"Ikki bosqich, ortga yo'nalish","id":213},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Ortga-GA! komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"\"Ortga, qismlarga bo‘lib, bajar – BIR!\" komandasi bo‘yicha","requires_image":false,"question":"Ortga-GA! buyrug‘ida birinchi bosqichda qanday harakat qilinadi?","options":{"A":"Har ikki oyoqni bir vaqtning o‘zida harakatlantirish","B":"Boshni pastga egish","C":"Chap oyoqni o‘ng oyoq yoniga qo‘shish","D":"O'ng oyoqning uchini, chap oyoqning tovoniga qo‘shish"},"answer":"D","explanation":"BIR bosqichida o'ng oyoq uchini chap oyoq tovoniga qo‘shish talab etiladi.","mnemonic":"BIR – O‘ng uch, chap tovon","id":214},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Chap-GA! komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"\"Chap-GA!\" komandasi 90° burilishni talab qiladi","requires_image":false,"question":"Chap-GA! buyrug‘ida burilish burchagi qanday bo‘ladi?","options":{"A":"270°","B":"90°","C":"45°","D":"180°"},"answer":"B","explanation":"Chap-GA! komandasi 180° emas, 90° burilishni talab qiladi.","mnemonic":"Chapga 90, to‘g‘ri qadam","id":215},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"O'ng-GA! komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"\"O‘ng-GA!\" komandasi \"BajarBIR!\" hisobida ... o‘ng oyoqqa og‘irlikni o‘tkazish","requires_image":false,"question":"O‘ng-GA! buyrug‘ida BIR bosqichda og‘irlik qayerga ko‘chiriladi?","options":{"A":"Chap oyoqqa","B":"O‘ng oyoqqa","C":"Gavda markaziga","D":"Qo‘llarga"},"answer":"B","explanation":"BIR bosqichda og‘irlik o‘ng oyoqqa ko‘chiriladi, tizzalar bukilmaydi.","mnemonic":"BIR – og‘irlik o‘ngda","id":216},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Bajar-IKKI!","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"\"Bajar-IKKI!\" hisobida chap oyoqni yoniga qo‘kish","requires_image":false,"question":"Bajar-IKKI! bosqichida chap oyoq qayerga qo‘shiladi?","options":{"A":"O‘ng oyoq yoniga","B":"Chap oyoq tovoniga","C":"O‘ng oyoq tovoniga","D":"Gavda o‘rtasiga"},"answer":"A","explanation":"Bajar-IKKI! da chap oyoqni o‘ng oyoq yoniga qo‘shish kerak.","mnemonic":"IKKI – yoniga qo‘shish","id":217},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Xatoliklar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Matnda \"burilishlarda qo‘llarning harakatlanib ketishi\" xatosi","requires_image":false,"question":"Burilishda qo‘llarning harakatlanib ketishi xatosi qaysi sababga bog‘liq?","options":{"A":"Bosh yuqoriga ko‘tarilmagan","B":"Oyoq tovon kengligi noto‘g‘ri","C":"Gavda barqaror emas","D":"Tizzalar bukilgan"},"answer":"C","explanation":"Qo‘llar harakatlanishi gavda barqaror bo‘lmaganda sodir bo‘ladi.","mnemonic":"Qo‘llar – gavda barqaror","id":218},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Umumiy xatolar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Matnda \"burilishlarda boshning past ushlanishi\" xatosi","requires_image":false,"question":"Burilish paytida boshning past ushlanishi qanday natija beradi?","options":{"A":"Qo‘llarning harakati","B":"Gavdaning balandlashuvi","C":"Balansning yo‘qolishi","D":"Oyoqning ortga siljishi"},"answer":"C","explanation":"Bosh past ushlansa, balans buzilib, harakat barqaror bo‘lmaydi.","mnemonic":"Bosh past – balans yo‘q","id":219},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Ketma‑ketlik","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda \"ortga burilishni qismlarga bo‘lib to‘g‘ri bajarishiga erishilgandan keyin to‘liq bajariladi\"","requires_image":false,"question":"Burilishni to‘liq bajarishdan oldin bajariladigan qadamlarni to‘g‘ri tartibda joylashtiring:\n1. Qismlarga bo‘lish\n2. To‘liq burilish\n3. Xatoliklarni tekshirish\n4. Oyoq pozitsiyasini tekshirish","options":{"A":"4, 1, 3, 2","B":"1, 3, 4, 2","C":"1, 4, 3, 2","D":"1, 2, 3, 4"},"answer":"C","explanation":"Avvalo qismlarga bo‘lish, keyin oyoq pozitsiyasini tekshirish, xatoliklarni aniqlash, oxirida to‘liq burilish amalga oshiriladi.","mnemonic":"Qismlarga → Oyoq → Xato → To‘liq","id":220},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Qo‘llar holati","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"burilish vaqtida qo‘llar gavda atrofida harakatlantirilmaydi\"","requires_image":false,"question":"Burilish paytida qo‘llar qanday holatda bo‘lishi kerak?","options":{"A":"Pastga tushishi","B":"Yuqoriga ko‘tarilishi","C":"Gavda atrofida harakatlanmasligi","D":"Yon tomonlarga yoyilishi"},"answer":"C","explanation":"Qo‘llar harakatlanmasligi talab qilinadi, bu barqarorlikni ta’minlaydi.","mnemonic":"Qo‘llar – gavda atrofida tinch","id":221},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Oyoq tovon kengligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"oyoq uchlarining oralig‘i tovon kengligida bo‘lishi kerak\"","requires_image":false,"question":"Burilishda oyoq uchlari qanday joylashishi lozim?","options":{"A":"To‘von kengligida","B":"Bir-biriga yaqin","C":"Boshqa oyoq ustida","D":"Uzoq masofada"},"answer":"A","explanation":"Oyoq uchlari tovon kengligida bo‘lishi zarurligi aytilgan.","mnemonic":"Uch – to‘von kengligi","id":222},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Xatoliklarni oldini olish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Matnda \"burilishlarda qorin qismini tortmaslik\" tavsiyasi","requires_image":false,"question":"Burilish paytida qorin qismini qanday tutish kerak?","options":{"A":"Chapga egish","B":"Yuqoriga ko‘tarish","C":"Tortmaslik","D":"O‘ngga aylantirish"},"answer":"C","explanation":"Qorin qismini tortmaslik, barqarorlikni saqlash zarurligi aytilgan.","mnemonic":"Qorin – tortilmasin","id":223},{"subject":"Harbiy ta'lim","topic":"Burilish komandasi","subtopic":"Burilish burchagi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"ortga burilishda 180° to‘liq burilmaslik\"","requires_image":false,"question":"Ortga burilishda qaysi burchakdan ortiq bo‘lishi mumkin emas?","options":{"A":"90°","B":"180°","C":"45°","D":"270°"},"answer":"B","explanation":"Ortga burilishda 180° to‘liq burilmaslik kerakligi ko‘rsatilgan.","mnemonic":"Ortga – 180° yo‘q","id":224},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"Ort-GA, Chap-GA, O'K'ng-GA buyrug'lari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Chap-GA!\" buyrug'i keltirilgan","requires_image":false,"question":"\"Chap-GA!\" buyrug'i qaysi harakatni ifodalaydi?","options":{"A":"Orqa tomonga burilish","B":"Chap tomonga burilish","C":"Oldinga yurish","D":"O'ng tomonga burilish"},"answer":"B","explanation":"Chap‑GA komandasi chap tomonga burilishni anglatadi. Bu komandaga qarshi variantlar boshqa yo'nalishlarni tasvirlaydi.","mnemonic":"Chap‑GA – chapga","id":225},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"Ort-GA, Chap-GA, O'K'ng-GA buyrug'lari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"O'K'ng-GA!\" buyrug'i keltirilgan","requires_image":false,"question":"\"O'K'ng-GA!\" buyrug'i qaysi yo'nalishda burilishni bildiradi?","options":{"A":"O'ng tomonga","B":"Orqa tomonga","C":"Oldinga","D":"Chap tomonga"},"answer":"A","explanation":"O'K'ng‑GA komandasi ham o'ng tomonga burilishni ko'rsatadi; bu “Ort‑GA” ga o'xshash, lekin alohida buyrug'i sifatida matnda berilgan.","mnemonic":"O'K'ng‑GA ham o'ngga","id":226},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Qadam uzunligi va tezligi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda shaxdam qadam uzunligi 70‑80 sm, tezlik 110‑120 qadam/min ko'rsatilgan","requires_image":false,"question":"Shaxdam qadam uzunligi qancha bo'lishi kerak?","options":{"A":"70‑80 sm","B":"80‑90 sm","C":"90‑100 sm","D":"60‑70 sm"},"answer":"A","explanation":"Shaxdam qadam uzunligi 70‑80 sm deb belgilangan. Boshqa variantlar matnda keltirilmagan.","mnemonic":"Shaxdam – yetti‑sakson","id":227},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Qadam tezligi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda shaxdam qadam tezligi 110‑120 qadam/min ko'rsatilgan","requires_image":false,"question":"Shaxdam qadamda daqiqada qancha qadam bosiladi?","options":{"A":"130‑140","B":"100‑110","C":"120‑130","D":"110‑120"},"answer":"D","explanation":"Shaxdam qadam tezligi 110‑120 qadam/min deb berilgan. Boshqa sonlar matnda yo'q.","mnemonic":"Bir yuz o'n, ikki yuz o'n – 110‑120","id":228},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Yugurish qadam uzunligi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda yugurish qadam uzunligi 85‑90 cm ko'rsatilgan","requires_image":false,"question":"Yugurish harakatida qadam uzunligi qanday bo'lishi kerak?","options":{"A":"90‑95 cm","B":"70‑80 cm","C":"85‑90 cm","D":"80‑85 cm"},"answer":"C","explanation":"Yugurish qadam uzunligi 85‑90 cm deb berilgan. Bu shaxdam qadamga nisbatan uzoqroq.","mnemonic":"Yugurish – sakson besh","id":229},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Yurish va yugurish farqi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda shaxdam qadam va oddiy qadam farqlari tavsiflangan","requires_image":false,"question":"Shaxdam qadam tashlash harakati qachon bajariladi?","options":{"A":"Tantanali yurishda, salom berishda","B":"Jangovar mashg'ulotda yurganda","C":"Oddiy harakatda tezlikni oshirishda","D":"Poligonda yugurishda"},"answer":"A","explanation":"Shaxdam qadam tashlash tantanali yurishda, boshliq oldiga yaqinlashish yoki ketish paytida bajariladi. Boshqa holatlar oddiy qadam yoki yugurish bilan bog'liq.","mnemonic":"Tantanali – salom, shaxdam","id":230},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Qadam tezligi talablari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda shaxdam qadam tezligi 110‑120 qadam/min, yugurish 165‑180 qadam/min ko'rsatilgan","requires_image":false,"question":"Jum'iy chora sifatida shaxdam qadamni qanday tezlikda bajarish lozim?","options":{"A":"100‑110 qadam/min","B":"110‑120 qadam/min","C":"120‑130 qadam/min","D":"165‑180 qadam/min"},"answer":"B","explanation":"Shaxdam qadam tezligi 110‑120 qadam/min deb belgilangan. Yugurish tezligi boshqa diapazonda keltirilgan.","mnemonic":"Shaxdam – bir yuz o'n, ikki yuz o'n","id":231},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"Komandalar bajarilishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Matnda \"Ort-GA!\", \"Chap-GA!\", \"O'K'ng-GA!\" buyrug'lari ketma-ketlikda bajarilishi tavsiya etilgan","requires_image":false,"question":"Quyidagi komandalar to'g'ri yo'nalish va amallar bilan moslang:\n1. Ort-GA!\n2. Chap-GA!\n3. O'K'ng-GA!","options":{"A":"1-O'ng, 2-Chap, 3-O'ng","B":"1-O'ng, 2-O'ng, 3-Chap","C":"1-Chap, 2-O'ng, 3-Ort","D":"1-Ort, 2-Chap, 3-O'ng"},"answer":"A","explanation":"Ort‑GA va O'K'ng‑GA ham o'ng tomonga, Chap‑GA chap tomonga burilishni bildiradi. Shuning uchun 1‑O'ng, 2‑Chap, 3‑O'ng moslashadi.","mnemonic":"Ort va O'K'ng – o'ng, Chap – chap","id":232},{"subject":"Harbiy ta'lim","topic":"Shaxdam qadam","subtopic":"Oddiy qadam bilan farqlash","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda shaxdam qadam tashlash oddiy qadam tashlab bajarilishini aytgan","requires_image":false,"question":"Poligon ichida boshliq oldiga yaqinlashishda qaysi turdagi qadam ishlatiladi?","options":{"A":"Yugurish qadam","B":"Shaxdam qadam","C":"Oddiy qadam","D":"Sakrash qadam"},"answer":"C","explanation":"Poligon, jangovar mashina parkida boshliq oldiga yaqinlashish yoki ketishda oddiy qadam tashlab bajariladi, shaxdam qadam esa tantanali yurishda qo'llanadi.","mnemonic":"Poligon – oddiy qadam","id":233},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"Ketma-ketlik","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda \"Ort-GA!\", \"Chap-GA!\", \"O'K'ng-GA!\" buyrug'lari to'g'ri tartibda bajarilishi tavsiya etilgan","requires_image":false,"question":"Quyidagi komandalarni to'g'ri bajarish tartibini tanlang:\n1. Ort-GA!\n2. Chap-GA!\n3. O'K'ng-GA!","options":{"A":"1, 3, 2","B":"3, 2, 1","C":"2, 1, 3","D":"1, 2, 3"},"answer":"A","explanation":"Komandalar alohida-alohida bajariladi; birinchi o'ngga, keyin o'ngga (takror), oxirida chapga – 1‑3‑2 tartibi tavsiya qilinadi. Boshqa tartiblar matnda ko'rsatilmagan.","mnemonic":"Ort, O'K'ng, Chap – birin-birin","id":234},{"subject":"Harbiy ta'lim","topic":"Harakat turlari","subtopic":"Qo‘l harakati tavsifi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"matching","source_construct":"Matnda qo‘l harakati bosqichlari ro‘yxati","requires_image":false,"question":"Qo‘l harakatining bosqichlarini to‘g‘ri tartibda moslashtiring:\n1. Panja kamardan yuqori ko‘tariladi\n2. Barmoqlar yarim bukiladi\n3. Orqaga oxirigacha tortiladi\n4. Qo‘l tana yaqinida erkin harakatlanadi","options":{"A":"1-2-3-4","B":"3-1-2-4","C":"1-3-2-4","D":"2-1-4-3"},"answer":"C","explanation":"Avval panja kamar to'qasidan bir kaft enida yuqori ko‘tariladi (1), keyin orqaga oxirigacha tortiladi (3), barmoqlar yarim bukiladi (2), oxirida qo‘l erkin harakatlanadi (4).","mnemonic":"Yuqoriga, ortga, bukiladi, erkin","id":235},{"subject":"Harbiy ta'lim","topic":"Harakat turlari","subtopic":"Harakat o‘tkazish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda yugurish harakatidan qadamlab yurishga oʻtish jarayoni","requires_image":false,"question":"Yugurish → qadamlab yurishga oʻtish ketma‑ketligini to‘g‘ri tartibda joylang:\n1. Tirsak ortga tortilgan qo‘l biroz bukiladi\n2. O'ng oyoq yerga bosiladi\n3. Chap oyoqdan yugurish boshlanadi\n4. Yangi harakatni ijro komandasi beriladi","options":{"A":"1,4,2,3","B":"4,1,2,3","C":"2,1,4,3","D":"1,2,4,3"},"answer":"D","explanation":"Avval tirsak ortga tortilgan qo‘l biroz bukiladi (1), keyin o'ng oyoq yerga bosiladi (2), shu bilan ijro komandasi beriladi (4), oxirida chap oyoqdan yugurish boshlanadi (3).","mnemonic":"Bukiladi, bosiladi, komandasi, yuguradi","id":236},{"subject":"Harbiy ta'lim","topic":"Harakat turlari","subtopic":"Qo‘l harakati detali","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"barmoqlar yarim bukilgan\" ifodasi","requires_image":false,"question":"Qo‘l harakati davomida barmoqlar qanday holatda bo'ladi?","options":{"A":"Tishlab, pastga qarab qattiq ushlab","B":"To'liq to'g'ri, barmoqlar keng yoyilgan","C":"Barmoqlar orqaga tortilgan va keng yoyilgan","D":"Yarim bukilgan, bosh to'g'ri tutilgan"},"answer":"D","explanation":"Barmoqlar yarim bukilgan, bosh to'g'ri tutilgan deyilgan. Boshqa variantlar tavsifga zid.","mnemonic":"Barmoqlar yarim, bosh to'g'ri","id":237},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"«Oddiy askar Ibrohimov, TO‘XTA!» komanda harakatni to‘xtatadi","requires_image":false,"question":"Harakatni to‘xtatish uchun qaysi komanda beriladi?","options":{"A":"Oddiy askar Ibrohimov, BOS!","B":"Oddiy askar Ibrohimov, QISQA!","C":"Oddiy askar Ibrohimov, TEZ!","D":"Oddiy askar Ibrohimov, TO‘XTA!"},"answer":"D","explanation":"Harakatni to‘xtatish uchun «Oddiy askar Ibrohimov, TO‘XTA!» komanda beriladi. Boshqa komandalar harakatni davom ettiradi yoki tezlashtiradi.","mnemonic":"TO‘XTA – to‘xtat.","id":238},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«To‘liq qadam BOS!», «Qisqa qadam BOS!», «Teztez qadam BOS!», «Sekin qadam BOS!» komandalar harakat tezligini o‘zgartiradi","requires_image":false,"question":"Harakat tezligini kamaytirish uchun qaysi komandani tanlash kerak?","options":{"A":"Teztez qadam BOS!","B":"To‘liq qadam BOS!","C":"Sekin qadam BOS!","D":"Qisqa qadam BOS!"},"answer":"C","explanation":"«Sekin qadam BOS!» komandasi harakat tezligini pasaytiradi. «Teztez» tezligini oshiradi, «To‘liq» normal holat, «Qisqa» qadam uzunligini o‘zgartiradi, lekin tezlikni kamaytirmaydi.","mnemonic":"Sekin – sekinlash.","id":239},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«Oldinga (orqaga) ikki qadam — BOS!» komandasi ikki qadam oldinga yoki orqaga tashlashni ta'minlaydi","requires_image":false,"question":"«Oldinga (orqaga) ikki qadam — BOS!» komandasini bajarish natijasida harbiy xizmatchi qanday harakat qiladi?","options":{"A":"Uchta qadam navbat bilan oldinga, chapga, o‘ngga ketadi","B":"Ikki qadam oldinga yoki orqaga tashlaydi","C":"Bir qadam chapga, bir qadam o‘ngga ketadi","D":"Harakatni to‘xtatadi"},"answer":"B","explanation":"Aytilganidek, bu komanda ikki qadam oldinga yoki orqaga tashlashni amalga oshiradi. Boshqa variantlar tasvirda yo‘q.","mnemonic":"Ikki qadam – oldinga yoki orqaga.","id":240},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«O‘ngga (chapga) ikki qadam — BOS!» komandasi har bir qadamda oyoq bir-biriga taqallash tarzida harakatlanadi","requires_image":false,"question":"«O‘ngga (chapga) ikki qadam — BOS!» komandasini bajarishda oyoqlar qanday harakatlanadi?","options":{"A":"Faqat bir oyoq harakatsiz qoladi","B":"Har bir qadamda bir oyoq ikkinchisiga taqallaydi","C":"Oyoqlar bir vaqtning o‘zida birga harakatlanadi","D":"Harakat paytida qo‘l harakati ham bajariladi"},"answer":"B","explanation":"Aytilganidek, har bir qadamda oyoq bir-biriga taqallash tarzida harakatlanadi, qo‘l harakati bo‘lmaydi. Boshqa variantlar matnda keltirilmagan.","mnemonic":"Ta‘qallash – oyoq‑oyoq.","id":241},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«Joyda qadam BOS!», oyoq yerdan 15‑20 cm ko‘tariladi, oyoq kafti yerga uchidan bosiladi","requires_image":false,"question":"Joyda qadam BOS! komandasini bajarishda oyoq kafti qanday bosiladi?","options":{"A":"Yelg‘a uchidan bosiladi","B":"Chap tomondan bosiladi","C":"Yerga uchidan bosiladi","D":"O‘ng tomondan bosiladi"},"answer":"C","explanation":"Oyoq kafti yerga uchidan bosiladi deyilgan. Boshqa variantlarda muhim jihat ko‘rsatilmagan.","mnemonic":"Uchi – yerga.","id":242},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Qadam bosish komandasi, harakat tezligini o‘zgartirish, to‘xtatish va yo‘naltirish","requires_image":false,"question":"Quyidagi komandalarni ularning vazifasi bilan moslashtiring:\n1. TO‘XTA!\n2. TEZTEZ qadam BOS!\n3. QISQA qadam BOS!\n4. JOYINGDA!\nA. Harakatni to‘xtatish\nB. Harakat tezligini oshirish\nC. Qadam uzunligini qisqartirish\nD. Joyda turgan holatda qadam bosish","options":{"A":"1-B, 2-C, 3-D, 4-A","B":"1-C, 2-D, 3-A, 4-B","C":"1-A, 2-B, 3-C, 4-D","D":"1-D, 2-A, 3-C, 4-B"},"answer":"C","explanation":"TO‘XTA! harakatni to‘xtatadi, TEZTEZ qadam BOS! tezlikni oshiradi, QISQA qadam BOS! qadam uzunligini qisqartiradi, JOYINGDA! joyda turgan holda qadam bosadi. Shuning uchun 1‑A, 2‑B, 3‑C, 4‑D to‘g‘ri.","mnemonic":"TO‘XTA – to‘xtat, TEZTEZ – tez, QISQA – qisqa, JOYINGDA – joyda.","id":243},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Har bir qadam bosishda amalga oshiriladigan ketma‑ketlik: oyoq yerga bosilish, oyoq yerdan ko‘tarilish, qo‘l harakati yo‘q","requires_image":false,"question":"Joyda qadam bosish jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Oyoq yerdan 15‑20 cm ko‘tariladi\n2. Oyoq kafti yerga uchidan bosiladi\n3. Qo‘l harakati bajarilmaydi\n4. Oyoq yana bir marta bosiladi","options":{"A":"2, 3, 1, 4","B":"2, 1, 3, 4","C":"1, 2, 3, 4","D":"3, 2, 1, 4"},"answer":"B","explanation":"Qadam bosish birinchi oyoq kafti yerga uchidan bosiladi (2), keyin oyoq yerdan ko‘tariladi (1), qo‘l harakati yo‘q (3), va oxirida oyoq yana bosiladi (4). Shuning uchun 2‑1‑3‑4 to‘g‘ri.","mnemonic":"Uchi, ko‘tar, qo‘l yo‘q, yana bos.","id":244},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«QADAMLAB YURISH» harakati bir daqiqada necha tezlikda bo‘ladi?","requires_image":false,"question":"QADAMLAB YURISH harakati daqiqasiga taxminan qancha qadamni o‘z ichiga oladi?","options":{"A":"80‑90 qadam","B":"150‑160 qadam","C":"60‑70 qadam","D":"120‑130 qadam"},"answer":"D","explanation":"Harbiy harakatlarda standart qadamlash tezligi 120‑130 qadam/min bo‘lishi ko‘rsatilgan. Boshqa variantlar standartga mos kelmaydi.","mnemonic":"Daqiqada bir yuz yigirma.","id":245},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Har bir qadam uzunligi 15‑20 cm bo‘lishi talab etiladi","requires_image":false,"question":"Harbiy xizmatchi bir qadamda oyoqning yerga bosilishi uzunligi qanday bo‘lishi kerak?","options":{"A":"10‑12 sm","B":"15‑20 sm","C":"25‑30 sm","D":"5‑8 sm"},"answer":"B","explanation":"Har bir qadam uzunligi 15‑20 cm bo‘lishi kerak deyilgan. Boshqa variantlar noto‘g‘ri.","mnemonic":"Har bir qadam – o‘n besh‑yigirma.","id":246},{"subject":"Harbiy ta'lum","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Har bir qadamda oyoq kafti yerga uchidan bosilishi, keyin oyog‘ning yerdan ko‘tarilishi, oxirida oyoq bir-biriga taqallashi","requires_image":false,"question":"Quyidagi harakatlarni to‘g‘ri ketma‑ketlikda joylang:\n1. Oyoq kafti yerga uchidan bosiladi\n2. Oyoq yerdan ko‘tariladi\n3. Oyoq bir-biriga taqallaydi\n4. Harakat to‘xtatiladi","options":{"A":"1, 3, 2, 4","B":"3, 1, 2, 4","C":"2, 1, 3, 4","D":"1, 2, 3, 4"},"answer":"D","explanation":"Tavsifga muvofiq, avvalo kafti uchidan bosiladi (1), keyin yerdan ko‘tariladi (2), so‘ngra oyoqlar bir-biriga taqallaydi (3), va oxirida harakat to‘xtatiladi (4). Shuning uchun 1‑2‑3‑4 to‘g‘ri.","mnemonic":"Uchi, ko‘tar, taqalla, to‘xta.","id":247},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Qadam bosish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«QADAMLAB YURISH» harakati bir daqiqada 120‑130 qadamni tashkil etadi, har bir qadam uzunligi 15‑20 cm","requires_image":false,"question":"QADAMLAB YURISH harakati davomida 1 daqiqada 130 qadam bosilgan bo‘lsa, taxminiy yurish masofasi qancha bo‘ladi?","options":{"A":"30‑35 m","B":"5‑7 m","C":"19,5‑26 m","D":"10‑12 m"},"answer":"C","explanation":"130 qadam × 15‑20 cm = 1950‑2600 cm = 19,5‑26 m. Boshqa variantlar hisobga olinmagan.","mnemonic":"130 × 0,15‑0,20 = 19,5‑26.","id":248},{"subject":"Harbiy ta'lim","topic":"Yurish va burilishlar","subtopic":"Burilish komandalarini tartibga solish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Chapga, o'ngga, ortga burilish komandalarining nomlari","requires_image":false,"question":"Burilish komandalarini ularning yo'nalishiga moslashtiring:\n1. \"Ort‑GA!\"\n2. \"Chap‑GA!\"\n3. \"O'ng‑GA!\"","options":{"A":"1-chapga, 2-ortga, 3-o'ngga","B":"1-o'ngga, 2-chapga, 3-ortga","C":"1-ortga, 2-chapga, 3-o'ngga","D":"1-ortga, 2-o'ngga, 3-chapga"},"answer":"C","explanation":"\"Ort‑GA!\" ortga, \"Chap‑GA!\" chapga, \"O'ng‑GA!\" o'ngga degan ma'lumotlar berilgan. Shuning uchun 1‑ortga, 2‑chapga, 3‑o'ngga to'g'ri.","mnemonic":"Ort‑GA, Chap‑GA, O'ng‑GA","id":249},{"subject":"Harbiy ta'lim","topic":"Harbiy salomlashish","subtopic":"Salom berish qoidalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Saf Nizomi bo'yicha harbiycha salom berish 3-4 qadam","requires_image":false,"question":"Harbiycha salom berishda bosh kiyim bilan turishda qaysi qadam birinchi bajariladi?","options":{"A":"Boshliq tomon yuzlanib, qad rostlanadi","B":"Boshni burish","C":"O'ng qo'lni ko'tarish","D":"Qo'lni yelka chizig'iga tekkizish"},"answer":"A","explanation":"Boshliq tomon yuzlanib, qad rostlanadi – bu harbiycha salomning boshlang'ich bosqichi. Boshqa variantlar keyingi yoki boshqa harakatlar.","mnemonic":"Boshliqga qarash – birinchi qad","id":250},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Komanda ketma-ketligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"\"O'ng-GA!\", \"Chap-GA!\", \"Ort-GA!\" komandalarini bajarish tartibi","requires_image":false,"question":"Quyidagi komandalarni bajarish tartibini moslashtiring:\n1. O'ng-GA!\n2. Chap-GA!\n3. Ort-GA!\nA. O'ng qo'lni chapga burish\nB. O'ng qo'lni o'ngga burish\nC. Ikkala qo'lni birga yo'naltirish\nD. Ortiqcha harakatni to'xtatish","options":{"A":"1-D, 2-C, 3-B","B":"1-A, 2-B, 3-C","C":"1-B, 2-A, 3-D","D":"1-C, 2-D, 3-A"},"answer":"C","explanation":"O'ng-GA! qo'lda o'ngga burish (B), Chap-GA! chapga burish (A), Ort-GA! ortga harakatni to'xtatish (D). Shunday qilib 1‑B, 2‑A, 3‑D to'g'ri.","mnemonic":"O'ngga B, Chapga A, Ortga D","id":251},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Yo'l harakati qoidalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Yurish davomida ortga burilish amallari","requires_image":false,"question":"Ortga burilishda qo'l harakati qanday vaznida bajariladi?","options":{"A":"Qadam vaznida","B":"Qo'lning o'zida","C":"Yo'l belgisida","D":"Tana vaznida"},"answer":"A","explanation":"Aytilishicha, ortga burilish amallari davomida qo'l harakati qadam vaznida bajariladi. Boshqa variantlar matnda ko'rsatilmagan.","mnemonic":"Burilish – qadamda qo'l","id":252},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Yurish qoidalari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Yurish davomida ortga burilish","requires_image":false,"question":"Ortga burilish amali qanday harakatni o'z ichiga oladi?","options":{"A":"Tana burushini to'xtatish","B":"Boshni orqaga burish","C":"O'ng oyoqni oldinga bosish","D":"Qo'lni chapga burish"},"answer":"B","explanation":"Ortga burilishda boshni orqaga burish tavsiflangan, bu harakatni o'z ichiga oladi. Boshqa variantlar matnda ko'rsatilmagan.","mnemonic":"Ortga – bosh bur","id":253},{"subject":"Harbiy ta'lim","topic":"Harbiy salomlashish","subtopic":"Salomni tugatish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Boshliq harbiycha salom berayotgan xizmatchining yonidan o'tib ketgach, to'g'riga qarab o'ng qo'l tushiriladi","requires_image":false,"question":"Salom berish oxirida qanday harakat bajariladi?","options":{"A":"Boshliqga qarab burish davom etadi","B":"O'ng qo'l tushiriladi","C":"O'ng qo'l ko'tariladi","D":"Chap qo'l erkin qo'yiladi"},"answer":"B","explanation":"Boshliq yonidan o'tgandan so'ng o'ng qo'l tushiriladi – bu salomni yakunlaydi. Boshqa variantlar noto'g'ri.","mnemonic":"Boshliq o'tdi – qo'l tush","id":254},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Yo'nalish komandasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"\"O'ng-GA!\", \"Chap-GA!\", \"Ort-GA!\" komandalarini bajarish tartibi","requires_image":false,"question":"Berilgan komandalarni to'g'ri ketma-ketlikda bajarish uchun qadamlarni belgilang:\n1. O'ng-GA!\n2. Ort-GA!\n3. Chap-GA!","options":{"A":"1, 2, 3","B":"2, 1, 3","C":"3, 2, 1","D":"1, 3, 2"},"answer":"D","explanation":"Tartibda avvalo O'ng‑GA! (1), keyin Chap‑GA! (3), oxirida Ort‑GA! (2) bajariladi, shu sabab 1‑3‑2 to'g'ri.","mnemonic":"O'ng, Chap, Ort – tartib","id":255},{"subject":"Harbiy ta'lim","topic":"Harbiy salomlashish","subtopic":"Salom berish joyi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Safdan tashqarida bosh kiyim bilan (bosh kiyimsiz) joyda turib harbiycha salom berish","requires_image":false,"question":"Harbiycha salom berish qoidalariga ko'ra, safdan tashqarida qanday holatda turish mumkin?","options":{"A":"Faqat bosh kiyim bilan","B":"Faqat bosh kiyimsiz","C":"Bosh kiyim bilan yoki bosh kiyimsiz","D":"Hech qanday kiyim bo'lmasligi shart"},"answer":"C","explanation":"Ikki holat – bosh kiyim bilan yoki bosh kiyimsiz – har ikkalasi ham ruxsat etilgan. Boshqa variantlar cheklov qo'yadi.","mnemonic":"Kiyim bo'lsin yoki bo'lmasin – salom beriladi","id":256},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Burilish amallari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Burilish amallari davomida qo'l harakati qadam vaznida bajariladi","requires_image":false,"question":"Burilish amallarida qo'l harakati qaysi sharoitda amalga oshiriladi?","options":{"A":"Har doim erkin","B":"Harakat to'xtashida","C":"Boshqalar bilan sinxron","D":"Harakat qilinayotgan qadamda"},"answer":"D","explanation":"Aniq: qo'l harakati qadam vaznida, ya'ni harakat qilinayotgan qadamda bajariladi. Boshqa variantlar noto'g'ri.","mnemonic":"Qadam – qo'l harakati","id":257},{"subject":"Harbiy ta'lim","topic":"Harbiy salomlashish","subtopic":"Salom berish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Harbiycha salom berish 3-4 qadamga yaqin kelgan boshliq tomon yuzlanib, qad rostlanadi","requires_image":false,"question":"Harbiycha salom berish bosqichlarini to'g'ri tartibda joylashtiring:\n1. O'ng qo'l kafti yoyilib yelka chizig'ida ko'tariladi\n2. Boshliq tomon yuzlanib, qad rostlanadi\n3. Boshni boshliq tomon burish\n4. Boshliq o'tgandan so'ng o'ng qo'l tushiriladi","options":{"A":"3, 2, 1, 4","B":"2, 3, 1, 4","C":"2, 1, 3, 4","D":"1, 2, 3, 4"},"answer":"B","explanation":"Salom berish ketma-ketligi: avval boshliq tomon yuzlanish (2), boshni burish (3), qo'l ko'tarish (1), oxirida qo'l tushirish (4). Shuning uchun 2‑3‑1‑4 to'g'ri.","mnemonic":"Yuzlan, bur, ko'tar, tush","id":258},{"subject":"Harbiy ta'lim","topic":"Harbiy chaqiriqlar","subtopic":"Salom berish bosqichlari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Salom berish jarayonidagi qadamlar","requires_image":false,"question":"Bosh kiyim bilan harakat davomida salom berish qadamlarini to'g'ri ketma-ketlikda joylang:\n1. O'ng qo'lni chakkaga keltirish\n2. Qadam bosish\n3. Qo'lni tushirish\n4. Boshni boshliq tomon burish","options":{"A":"1, 2, 3, 4","B":"2, 1, 3, 4","C":"2, 1, 4, 3","D":"1, 2, 4, 3"},"answer":"D","explanation":"Bosh kiyimda birinchi o'ng qo'lni chakkaga keltirish (1), keyin qadam bosish (2), boshni boshliq tomon burish (4), oxirida qo'lni tushirish (3). A varianti bu tartibni beradi.","mnemonic":"Chakka, qadam, bur, tushir","id":259},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safdagi qadamlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safda chiqish jarayonida xizmatchi bir qadam tashlab, o‘ng oyog‘ini chap oyog‘iga taqamay, bir qadam orqaga otadi, safdan chiqayotgan xizmatchini o‘tkazib yuboradi.","requires_image":false,"question":"Safdan chiqish jarayonida xizmatchi qiladigan harakatlarni to‘g‘ri tartibda joylashtiring:\n1. O‘ng oyog‘ini chap oyog‘iga taqmaydi\n2. Bir qadam orqaga otadi\n3. Safdan chiqayotgan xizmatchini o‘tkazib yuboradi\n4. Bir qadam oldinga tashlaydi","options":{"A":"1, 2, 4, 3","B":"4, 1, 2, 3","C":"1, 4, 2, 3","D":"4, 2, 1, 3"},"answer":"B","explanation":"Birinchi qadam – bir qadam oldinga tashlaydi (4), keyin o‘ng oyog‘ini chap oyog‘iga taqmaydi (1), so‘ng orqaga bir qadam otadi (2) va oxirida safdan chiqayotgan xizmatchini o‘tkazib yuboradi (3).","mnemonic":"Oldinga, taqsiz, orqaga, o‘tkaz","id":260},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safda o‘ng va chap oyog‘lar harakati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safda chiqish xizmatchi chap oyoq bilan bir qadam yonga tashlab, chap (o‘ng) oyog‘ini o‘ng (chap) oyog‘iga taqmaydi, bir qadam orqaga otadi.","requires_image":false,"question":"Safda chiqish xizmatchi chap oyoq bilan qanday harakatni amalga oshiradi?","options":{"A":"Safda bir necha marta to‘xtab turadi","B":"Yonga bir qadam tashlaydi, keyin orqaga bir qadam otadi","C":"Chap oyoq bilan safdan oldinga ikki qadam yuradi","D":"O‘ng oyoqni chap oyoqga taqadi"},"answer":"B","explanation":"Chap oyoq bilan bir qadam yonga tashlanadi, chap (o‘ng) oyog‘ini o‘ng (chap) oyog‘iga taqmaydi, va keyin bir qadam orqaga otadi, deyilgan.","mnemonic":"Yonga, orqaga – chap oyoq harakati","id":261},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safda ikki, uch (to‘rt) kolonnali saf","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safdan chiqish buyrug‘ini olgan xizmatchi ikki, uch (to‘rt) kolonnali safda turgan bo‘lsa, safning yaqin qanoti tomon o‘ngga (chapga) buriladi, yonidagi xizmatchi bir qadam yonga tashlaydi, chap (o‘ng) oyog‘ini o‘ng (chap) oyog‘iga taqmaydi, bir qadam orqaga o'tadi.","requires_image":false,"question":"Ikki, uch (to‘rt) kolonnali safda chiqish jarayonini to‘g‘ri ketma‑ketlikda joylashtiring:\n1. Safning yaqin qanoti tomon o‘ngga (chapga) buriladi\n2. Yonidagi xizmatchi bir qadam yonga tashlaydi\n3. Chap (o‘ng) oyog‘ini o‘ng (chap) oyog‘iga taqmaydi\n4. Bir qadam orqaga o'tadi","options":{"A":"1, 2, 3, 4","B":"4, 1, 2, 3","C":"2, 1, 3, 4","D":"1, 3, 2, 4"},"answer":"A","explanation":"Tasvirlangan tartibda birinchi safning yaqin qanoti tomon buriladi, keyin yonidagi xizmatchi yonga tashlaydi, oyog‘ini taqmaydi, va oxirida orqaga bir qadam o'tadi.","mnemonic":"Burilish, yonga, taqsiz, orqaga","id":262},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safga murojaat qilish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safga yuzlanib turgan harbiy xizmatchi “Xop bo‘ladi” deb javob beradi.","requires_image":false,"question":"Safga yuzlanib turgan xizmatchi “Safga turing!” komandasi berilganda qanday javob beradi?","options":{"A":"“Xop bo‘ladi” deb javob beradi","B":"“Boshliqga qarab yuraman” deb javob beradi","C":"“Qabul qilinadi” degan so‘z bilan javob beradi","D":"“Men tayyorman” deb aytadi"},"answer":"A","explanation":"“Safga turing!” komandasi berilganda xizmatchi “Xop bo‘ladi” deb javob beradi, degan ma’lumot keltirilgan.","mnemonic":"Safga – Xop bo‘ladi","id":263},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safdan chiqish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Safdan chiqish buyrug‘ini olgan xizmatchi birinchi sherengada turgan bo‘lsa, ikkinchi sherengada turgan xizmatchi uning bo‘shagan o‘rnini egallaydi.","requires_image":false,"question":"Quyidagi vaziyatlarni moslashtiring:\n1. Xizmatchi birinchi sherengada turgan\n2. Xizmatchi ikkinchi sherengada turgan\nA. Bo‘shagan o‘rinni egallaydi\nB. Chap qo‘lini yelkasiga qo‘yadi","options":{"A":"1-A, 2-A","B":"1-A, 2-B","C":"1-B, 2-B","D":"1-B, 2-A"},"answer":"D","explanation":"Birinci sherengada turgan xizmatchi chap qo‘lini yelkasiga qo‘yadi (B), ikkinchi sherengada turgan xizmatchi bo‘shagan o‘rinni egallaydi (A).","mnemonic":"Birinchi – chap yelka, ikkinchi – egallash","id":264},{"subject":"Harbiy ta'lim","topic":"Safda harakat","subtopic":"Safda qadam tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Safga chiqish jarayonida xizmatchi bir qadam tashlaydi, o‘ng qo‘lni bosh kiyimga (chakkaga) keltiradi, bir qadam orqaga otadi, va safga qaytadi.","requires_image":false,"question":"Safga chiqish jarayonini to‘g‘ri tartibda joylashtiring:\n1. O‘ng qo‘lni bosh kiyimga (chakkaga) keltiradi\n2. Bir qadam tashlaydi\n3. Bir qadam orqaga otadi\n4. Safga qaytadi","options":{"A":"3, 2, 1, 4","B":"2, 3, 1, 4","C":"1, 2, 3, 4","D":"2, 1, 3, 4"},"answer":"D","explanation":"Avval xizmatchi bir qadam tashlaydi (2), keyin o‘ng qo‘lni bosh kiyimga (chakkaga) keltiradi (1), so‘ng bir qadam orqaga otadi (3), va oxirida safga qaytadi (4).","mnemonic":"Tashlaydi, chakka, orqaga, qaytadi","id":265},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Safga qaytish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda safga qaytish jarayonida qadam soni","requires_image":false,"question":"Xizmatchi safga qaytish komandasini olganda o'ng qo'lini bosh kiyimiga keltirishi nechta qadamdan keyin amalga oshiriladi?","options":{"A":"Bir qadam oldin","B":"Ikki‑uch qadam oldin","C":"To'g'ridan-to'g'ri","D":"Besh‑olti qadam oldin"},"answer":"D","explanation":"Xizmatchi boshliq oldiga yaqinlashganda besh‑olti qadam qolganida qo'lini bosh kiyimiga keltiradi.","mnemonic":"Beshlikda bosh kiyim.","id":266},{"subject":"Harbiy ta'lik","topic":"Harbiy komandalar","subtopic":"Safga qaytish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda \"Xop bo'ladi\" javobi","requires_image":false,"question":"\"Safga TURING!\" buyrug'iga xizmatchi qanday javob beradi?","options":{"A":"\"Tushunmadim\" deb so'raydi","B":"Hech narsa demaydi","C":"\"Majburman\" deyiladi","D":"\"Xop bo'ladi\" deya javob beradi"},"answer":"D","explanation":"\"Safga TURING!\" buyrug'iga xizmatchi \"Xop bo'ladi\" deya javob beradi.","mnemonic":"Turing—Xop javob.","id":267},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Ketma‑ketlik","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Matnda safga qaytish jarayonidagi qadamlar","requires_image":false,"question":"Safga qaytish jarayonini to'g'ri tartibda joyl nation":"To‘g‘ri ketma‑ketlik: qo‘lni ko‘tarish, javob berish, safga qarash, qo‘lni tushirish.","mnemonic":"Ko‘tar, Javob, Qarash, Tushir","id":283},{"subject":"Harbiy ta'lim","topic":"Mudofaa tamoyillari","subtopic":"Mudofaa yetarliligi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Mudofaa sohasidagi davlat siyosatining asosiy prinsiplari","requires_image":false,"question":"Quyidagi tamoyillardan qaysi biri mudofaaning yetarli darajada bo‘lishini ta'minlaydi?","options":{"A":"Harbiy-siyosiy bloklarda qatnashmaslik","B":"Harbiy xizmat sharafli ekanligini ta'minlash","C":"Yadroviy qurollarni rad etish","D":"Mudofaaning yetarli darajada bo‘lishi"},"answer":"D","explanation":"Aynan \"mudofaaning yetarli darajada bo‘lishi\" tamoyili keltirilgan. B‑D boshqa prinsiplar.","mnemonic":"Yeterli mudofa, barqaror.","id":284},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar faoliyati","subtopic":"Maqsadli vazifalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Qurolli Kuchlarning faoliyati asoslari","requires_image":false,"question":"Qurolli Kuchlarning asosiy tamoyillarini ularning mazmuni bilan moslashtiring:\n1. Qonun ustunligi\n2. Markazlashgan rahbarlik\n3. Yakkaboshchilik\n4. Jangovar va safarbarlikda shaylik","options":{"A":"1-A, 2-D, 3-B, 4-C","B":"1-C, 2-A, 3-D, 4-B","C":"1-A, 2-B, 3-C, 4-D","D":"1-B, 2-C, 3-A, 4-D"},"answer":"C","explanation":"\"qonun ustunligi, markazlashgan rahbarlik, yakkaboshchilik, jangovar va safarbarlik borasida doimiy shaylik\" ketma-ketligi mavjud, shuning uchun 1-A, 2-B, 3-C, 4-D mos keladi.","mnemonic":"Qonun‑Markaz‑Yakka‑Shay","id":285},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar tamoyillari","subtopic":"Yadroviy qurollarni rad etish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Mudofaa sohasidagi davlat siyosatining asosiy prinsiplari","requires_image":false,"question":"Yadroviy qurollarni rad etish jarayonini to'g'ri bos
