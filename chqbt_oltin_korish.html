"id":609,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Suyak sinishining asosiy belgilari qaysilar?","options":{"A":"Shikastlangan joyda harorat ko'tarilishi, qizarish va suyuqlik to'planishi","B":"Og'riq, deformatsiya, suyak g'ichirlashi va funksiya buzilishi","C":"Teri yuzasida ko'karish, shish va bo'g'imda harakat cheklanishi","D":"Bo'g'imda kuchli og'riq, harakat qiyinlashuvi va suyak qisqarishi belgilari"},"answer":"B","explanation":"Suyak sinishining belgilari: og'riq (paypaslaganda kuchayadi), suyak singan joyning deformatsiyalanishi, suyaklarning g'ichirlashi (siljiganda), funksiyaning buzilishi (harakat yo'qolishi).","mnemonic":"Sinish belgilari: OG'RIQ + DEFORMATSIYA + G'ICHIRLASH + FUNKSIYA yo'qolishi","source":"10-sinf §51, 169-170-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":610,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — immobilizatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Suyak singanda birinchi tibbiy yordamda eng muhim amal nima?","options":{"A":"Jarohatlangan joyga antiseptik surtib, infeksiyaning oldini olish","B":"Zararlangan bo'g'imni o'z vaqtida va to'g'ri immobilizatsiya qilish","C":"Singan suyakni ehtiyotkorlik bilan asl holatiga qaytarish","D":"Og'riq qoldiruvchi berish va sovuq kompres qo'yish"},"answer":"B","explanation":"Suyak singanda birinchi tibbiy yordamda eng muhimi — zararlangan bo'g'imni o'z vaqtida va to'g'ri immobilizatsiya qilish (shikastlangan bo'g'imni harakatsizlantirish). Immobilizatsiya shinalar yordamida qilinadi.","mnemonic":"Sinish = birinchi IMMOBILIZATSIYA (shinalar bilan harakatsizlantirish)","source":"10-sinf §51, 170-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":611,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — ochiq singanda yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Ochiq suyak sinishida birinchi tibbiy yordam qanday tartibda amalga oshiriladi?","options":{"A":"Immobilizatsiya -> og'riq qoldiruvchi -> shifoxona","B":"Qon to'xtatish, steril bog'lam, og'riq qoldiruvchi, immobilizatsiya, shifoxona","C":"Birinci singan suyakni qaytarish -> og'riq qoldiruvchi -> bog'lam","D":"Faqat shifoxonaga olib borish"},"answer":"B","explanation":"Ochiq sinishda: avval qon ketishi to'xtatiladi va jarohat atrofiga antiseptik vositalar bilan ishlov beriladi + steril bog'lam; so'ng og'riq qoldiruvchi; keyin immobilizatsiya; nihoyat shifoxonaga.","mnemonic":"Ochiq sinish: QON TO'XTAT+BOG'LAM -> OG'RIQ QOLDIRUVCHI -> IMMOBILIZATSIYA -> SHIFOXONA","source":"10-sinf §51, 169-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":612,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — bosh suyagi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Bosh suyagi singanda qaysi harakat TO'G'RI EMAS?","options":{"A":"103 yoki 112 raqamiga qo'ng'iroq qilish","B":"Nafas olishiga e'tibor berish","C":"Singan joyni o'zingiz to'g'rilashga harakat qilish","D":"Ochiq yara va qon ketishni toza bint bilan yopib qo'yish"},"answer":"C","explanation":"Bosh suyagi singanda to'g'ri EMAS: singan joyni o'zingiz to'g'rilashga harakat qilmaslik. Shuningdek, boshni/bo'ynini qimirlatmaslik, qon ketayotgan joyga qattiq bosim bermaslik ham taqiqlangan.","mnemonic":"Bosh suyagi: singan joyni O'ZINGIZ TO'G'RILAMANG (miyaga zarar!)","source":"10-sinf §51, 171-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":613,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — yelka","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Yelka suyagi singanda qaysi shina ishlatiladi?","options":{"A":"Yumshoq shina","B":"Katta narvonsimon shina","C":"Plastinka shina","D":"Shina kerak emas"},"answer":"B","explanation":"Yelka suyagi singanda katta narvonsimon shinadan foydalaniladi. Shina yelka ustidan boshlab, sog'lom tomon bilan shikastlangan yelka bo'ylab orqa tomondan, so'ngra bukilgan tirsak va bilak bo'ylab barmoqlarga o'tkaziladi.","mnemonic":"Yelka sinishi: KATTA NARVONSIMON SHINA (yelkadan barmoqlargacha)","source":"10-sinf §51, 171-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":614,"soha":"6. Tibbiy bilim asoslari","subtopic":"Oftob urishi — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Oftob urishi belgilari qanday?","options":{"A":"Teri oqarishi, harorat pasayishi, qaltirashuv","B":"Teri qizarishi, tana harorati 40-41°C, bosh og'rig'i, aylanish","C":"Faqat ko'ngil aynishi","D":"Nafas sifatida o'zgarish yo'q, faqat zaiflik"},"answer":"B","explanation":"Oftob urishi belgilari: teri va yuz qizarishi, tana harorati 40-41°C ga oshishi, kuchli terlash, burundan qon ketishi. MAS: lohaslik, bosh og'rishi, bosh aylanishi, quloq shang'illashi.","mnemonic":"Oftob urishi = TERI QIZARISH + harorat 40-41°C + BOSH OG'RISHI","source":"10-sinf §52, 173-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":615,"soha":"6. Tibbiy bilim asoslari","subtopic":"Oftob urishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Askar quyoshda uzoq vaqt turdi va hushidan ketdi. Birinchi navbatda nima qilish kerak?","options":{"A":"Yaradorga issiq choy ichirish va issiq o'rash","B":"Yaradorni salqin joyga olib chiqib, kiyimlarini bo'shaytirish va sovitish choralarini ko'rish","C":"Yarorlarga yotgan joyida qolishi uchun harakatlantirsiz saqlab turish","D":"Nafas yo'lini tozalab, yurak-o'pka reanimatsiyasini boshlash"},"answer":"B","explanation":"Oftob urganda: yaradorni salqin joyga olib chiqish; issiq joydan soyali/shamol aylanadigan joyga yotqizish; kiyimlarini bo'shaytirish; badanini sovuq suv bilan yuvib, nam sochiq qo'yish; muzli kompresslarni peshona, bo'yin, qo'ltiq ostiga qo'yish.","mnemonic":"Oftob urish yordam: SALQIN JOY + KIYIM BO'SHAYTI + SOVUQ KOMPRES","source":"10-sinf §52, 173-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":616,"soha":"6. Tibbiy bilim asoslari","subtopic":"Oftob urishi — profilaktika","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Oftob urishi profilaktikasi uchun kunning qaysi vaqtlarida quyosh taftida uzoq turmaslik tavsiya etiladi?","options":{"A":"8:00-10:00","B":"11:00-16:00","C":"14:00-18:00","D":"9:00-13:00"},"answer":"B","explanation":"Profilaktika: kunning eng issiq vaqtlarida (11:00-16:00) quyosh taftida uzoq vaqt qolishdan saqlanish tavsiya etiladi.","mnemonic":"Quyosh profilaktika: 11:00-16:00 TAFTIDA TURMA","source":"10-sinf §52, 174-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":617,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sovuq urishi — ta'rifi va harorat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Sovuq urishi qanday holat va qaysi haroratda yuzaga keladi?","options":{"A":"Tana harorati 37°C dan pastga tushganda","B":"Tana harorati 35°C dan pastga tushishi xavfli holat","C":"Tana harorati 30°C dan pastga tushganda","D":"Faqat -10°C sovuqda yuzaga keladi"},"answer":"B","explanation":"Sovuq urishi — tana haroratining 35°C dan pastga tushishi natijasida yuzaga keladigan xavfli holat. Uzoq muddat sovuq yoki nam muhitda bo'lish, shamol yoki nam kiyim tufayli rivojlanishi mumkin.","mnemonic":"Sovuq urishi: tana harorat 35°C DAN PAST","source":"10-sinf §52, 174-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":618,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sovuq urishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sovuq urganda yaradorga qaysi ichimlikni BERISH TAQIQLANADI?","options":{"A":"Iliq choy","B":"Mineral suv","C":"Spirtli ichimlik","D":"Iliq shorva"},"answer":"C","explanation":"Sovuq urganda: iliq suyuqlik (choy, suv, shorva) berish kerak. Lekin har qanday spirtli va kofeinli ichimliklardan qochish shart.","mnemonic":"Sovuq urish: SPIRT va KOFEIN BERMA; iliq choy/suv BER","source":"10-sinf §52, 174-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":619,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sovuq urishi — muzlagan a'zo isitish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sovuq urganda muzlagan a'zolarni qanday isitish tavsiya etiladi?","options":{"A":"Muzlagan a'zoni qattiq ishqalab qizdirish","B":"37-40°C suvda asta-sekin isitish","C":"Muzlagan joyga issiq suv (60-70°C)da isitish","D":"Qizdirilgan tosh yoki issiq buyum bilan isitish"},"answer":"B","explanation":"Muzlagan a'zolarni asta-sekin isitish — 37-40°C suvda isitish, lekin qattiq ishqalash mumkin emas.","mnemonic":"Muzlagan a'zo: 37-40°C suvda SEKIN ISIT, ISHQALAMA","source":"10-sinf §52, 175-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":620,"soha":"6. Tibbiy bilim asoslari","subtopic":"Cho'kish — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Suvga cho'kish nima?","options":{"A":"Suvda uzoq vaqt turib qolishdan kelib chiqadigan charchoq holati","B":"Nafas yo'llariga suv kirishi natijasida kislorod yetishmovchiligi yuzaga keladigan xavfli holat","C":"Sovuq suvda muzlash va gipotermiya holati","D":"Suvga tushib qo'rqish natijasida yuzaga keladigan psixologik holat"},"answer":"B","explanation":"Suvga cho'kish — nafas yo'llariga suv kirishi natijasida kislorod yetishmovchiligi (bo'g'ilish) yuzaga keladigan xavfli holat. Cho'milish vaqtida, to'satdan suvga tushib ketish yoki jismoniy toliqish sababli sodir bo'lishi mumkin.","mnemonic":"Cho'kish = SUVIN nafas yo'liga KIRISHI -> KISLOROD yetishmovchiligi","source":"10-sinf §52, 175-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":621,"soha":"6. Tibbiy bilim asoslari","subtopic":"Cho'kish — birinchi yordam tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Cho'kkanga birinchi tibbiy yordam qanday tartibda ko'rsatiladi?","options":{"A":"Avval sun'iy nafas, keyin suvdan chiqarish","B":"Suvdan chiqarish, nafas va yurak tekshirish, YUO'R","C":"Faqat iliq joyga olib borish va kutish","D":"Darhol antibiotik berish"},"answer":"B","explanation":"Cho'kish yordami tartibi: 1) Yaradorni suvdan chiqarish (o'zingizni xavfga qo'ymagan holda); 2) Nafas olish va yurak urishini tekshirish; 3) Hushsiz bo'lsa — darhol sun'iy nafas va yurakni bilvosita massaj (30:2); 4) Tana isinishiga yordam berish.","mnemonic":"Cho'kish: SUVDAN CHIQAR -> NAFAS/YURAK TEKSHIR -> YUO'R 30:2 -> ISINISH","source":"10-sinf §52, 176-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":622,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sun'iy nafas — yurak massaji soni","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Reanimatsiya paytida har 30 ta ko'krak bosimidan keyin nechta sun'iy nafas beriladi?","options":{"A":"1 ta","B":"2 ta","C":"3 ta","D":"5 ta"},"answer":"B","explanation":"YUO'R tartibi: har 30 marta ko'krak qafasiga bosimdan keyin 2 marta sun'iy nafas berish. Cho'kish holatida ham xuddi shu tartib qo'llaniladi.","mnemonic":"YUO'R: 30 BOSIM -> 2 NAFAS -> 30 BOSIM -> 2 NAFAS...","source":"10-sinf §50, 52, 166-176-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":623,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish — sovuq urishi va yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sovuq urganda yaradorning oyog'i muzlab qolgan. To'g'ri yordam qaysi?","options":{"A":"Muzlagan oyoqni qattiq ishqalab isitish","B":"Muzlagan oyoqni 60°C issiq suvga solib isitish","C":"Muzlagan oyoqni 37-40°C suvda asta-sekin isitish","D":"Muzlagan oyoqni ochiq olov yoniga tutib isitish"},"answer":"C","explanation":"Sovuq olgan oyoqni asta-sekin, tana haroratiga yaqin iliq suvda isitish kerak; qattiq ishqalash, juda issiq suv yoki ochiq olov muzlagan to'qimalarni yanada shikastlaydi.","mnemonic":"Muzlagan oyoq: 37-40°C suvda SEKIN + ISHQALAMA + ISSIQ SUV EMAS","source":"10-sinf §52, 175-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":624,"soha":"6. Tibbiy bilim asoslari","subtopic":"Birinchi tibbiy yordam — immobilizatsiya maqsadi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Suyak singanda immobilizatsiya qilish nima uchun zarur — to'liq javobni tanlang?","options":{"A":"Og'riqni kamaytirish va yaradorni harakatsiz tinch saqlash uchun","B":"Suyak parchalari qimirlashini, shok va infeksiyani oldini olish, transportni yengillashtirish","C":"Tashish qulay bo'lishi va yaradorni yo'lda silkitmay olib borish","D":"Qon ketishini to'xtatish va tomir zararlanishining oldini olish"},"answer":"B","explanation":"Birinchi tibbiy yordamning to'rtta maqsadi: 1) singan sohada suyaklar qimirlashining oldini olish (suyak parchalari tomir/asab/paylarni shikastlamasligi); 2) shok (talvasa)ning oldini olish; 3) infeksiyaning oldini olish; 4) jabrlanganni zudlik bilan tibbiyot muassasasiga yetkazish.","mnemonic":"Immobilizatsiya 4 maqsad: QIMIRLAMASIN + SHOK OLDINI + INFEKSIYA OLDINI + SHIFOXONA","source":"10-sinf §51, 170-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":625,"soha":"6. Tibbiy bilim asoslari","subtopic":"Bosh miya chayqalishi — belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Askar boshini qattiq urib, qisqa muddatga hushidan ketdi, keyin bosh aylandi va ko'ngli aynidi. Bu qanday shikastlanish?","options":{"A":"Bosh miyaga qon quyilishi","B":"Miya chayqalishi","C":"Miya ezilishi","D":"Bosh suyagi asosi sinishi"},"answer":"B","explanation":"Miya chayqalishi (silkinishi) — eng yengil shakl, bunda miya to'qimalarida jiddiy zarar bo'lmaydi, lekin vaqtinchalik funksional buzilishlar yuzaga keladi. Belgilari: qisqa muddatli hushdan ketish (bir necha soniyadan bir necha daqiqagacha), bosh aylanishi va og'riq, ko'ngil aynishi va qusish.","mnemonic":"Miya CHAYQALISHI = eng YENGIL + qisqa hushsizlik + bosh aylanish","source":"11-sinf §36, 98-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":626,"soha":"6. Tibbiy bilim asoslari","subtopic":"Miya chayqalishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Miya chayqalishida birinchi tibbiy yordam qanday?","options":{"A":"Yaradorni tez yurgizish va harakatga majburlash","B":"Tinch joyga yotqizib, sovuq qo'yish, harakatni cheklash, 103 chaqirish","C":"Darhol og'riq qoldiruvchi mushakka yuborish","D":"Boshga issiq kompres qo'yish, harakatni cheklash"},"answer":"B","explanation":"Miya chayqalishida birinchi yordam: yaradorni tinch joyga yotqizish (boshi biroz ko'tarilgan holda); sovuqlik qo'yish (muz yoki ho'l sochiq); qattiq harakat qildirmaslik; hushidan ketgan bo'lsa yonboshlatib yotqizish; tez tibbiy yordamni chaqirish.","mnemonic":"Miya chayqalishi: TINCH YOT + bosh KO'TARIQ + SOVUQLIK + HARAKAT YO'Q","source":"11-sinf §36, 98-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":627,"soha":"6. Tibbiy bilim asoslari","subtopic":"Bosh suyagi asosi sinishi — belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yaradorda quloq va burundan qon yoki tiniq suyuqlik oqmoqda, ko'z atrofida ko'karish ('ko'zoynak simptomi') bor. Bu qanday shikastlanish belgilari?","options":{"A":"Miya chayqalishi","B":"Miyaga qon quyilishi","C":"Bosh suyagi asosi sinishi","D":"Ko'krak qafasi jarohati"},"answer":"C","explanation":"Bosh suyagi asosi sinishi belgilari: quloq yoki burundan qon yoki tiniq suyuqlik oqishi, ko'z atrofida ko'karish ('ko'zoynak simptomi'), ong buzilishi, quloq pardasi yorilishi natijasida eshitish pasayishi.","mnemonic":"Bosh suyagi ASOSI sinishi: QULOQ/BURUN oqish + KO'ZOYNAK simptomi","source":"11-sinf §36, 99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":628,"soha":"6. Tibbiy bilim asoslari","subtopic":"Bosh miya shikastlanishi — umumiy qoida","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Bosh suyagi shikastlanganda qaysi harakat mutlaqo TO'G'RI EMAS?","options":{"A":"103 yoki 112 raqamiga qo'ng'iroq qilish","B":"Yaradorni harakatsiz holda ushlab turish","C":"Yaradorning boshini yoki bo'ynini qattiq qimirlatish","D":"Nafas olishiga e'tibor berish"},"answer":"C","explanation":"Bosh suyagi shikastlanishida TO'G'RI EMAS: yaradorning boshini yoki bo'ynini qattiq qimirlatish — bu miyaga yanada zarar yetkazishi mumkin. Shuningdek, qon ketayotgan joyga qattiq bosim berish va singan joyni o'zingiz to'g'rilashga harakat qilish ham taqiqlanadi.","mnemonic":"Bosh shikastlanish: BOSH/BO'YN QIMIRLATMA (miya zarar!)","source":"11-sinf §36, 98-99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":629,"soha":"6. Tibbiy bilim asoslari","subtopic":"Tayanch-harakat apparati — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Tayanch-harakat apparati shikastlanishining belgilari qaysilar?","options":{"A":"Isitma, terlash, qaltirashuv va bosh og'riq","B":"Og'riq, shish, deformatsiya, harakat buzilishi","C":"Qon bosimining o'zgarishi va bosh og'riq","D":"Ko'ngil aynishi, qusish, holsizlik va bosh og'riq"},"answer":"B","explanation":"Tayanch-harakat apparati shikastlanishining belgi va alomatlari: og'riq va shish; odatdagi harakatlarni bajara olmaslik; teri rangining o'zgarishi; shakl buzilishi (deformatsiya); tashqi qon ketishi; shikastlangan paytda qisirlagan tovush eshitilishi.","mnemonic":"THA belgilari: OG'RIQ+SHISH+HARAKAT yo'q+TERI o'zgarish+DEFORMATSIYA+G'ICHIRLASH","source":"11-sinf §36, 99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":630,"soha":"6. Tibbiy bilim asoslari","subtopic":"Tayanch-harakat apparati — yordam qoidalari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Qaysi harakat tayanch-harakat apparati shikastlanishida TO'G'RI EMAS?","options":{"A":"Harakatsizlantirish amali","B":"Jarohat joyini ko'tarish","C":"Suyakni joyiga solishga","D":"Sovuq narsa qo'yish amali"},"answer":"C","explanation":"Tayanch-harakat apparati shikastlanishida: chiqib turgan suyakni joyiga solishga harakat QILMASLIK kerak; qiyshiq a'zoni to'g'rilashga harakat QILMASLIK kerak. To'g'ri harakatlar: harakatsizlantirish, sovuq narsa qo'yish, shikastlangan joyni biroz ko'tarib qo'yish.","mnemonic":"THA shikastlanish TAQIQ: CHIQGAN SUYAKNI JOYIGA SOLMA + QIYSHIQNI TO'G'RILAMA","source":"11-sinf §36, 99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":631,"soha":"6. Tibbiy bilim asoslari","subtopic":"Pay cho'zilishi — ta'rif va belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Pay cho'zilishi nima sababdan yuzaga keladi?","options":{"A":"Suyakning bevosita sinishi","B":"Mushakning haddan tashqari cho'zilishi","C":"Bo'g'im suyaklarining siljishi","D":"Tomirning jarohati va qon ketishi"},"answer":"B","explanation":"Pay cho'zilishi — mushak yoki payning shikastlanishi. Sababi: mushakning haddan tashqari cho'zilishi yoki to'satdan kuchli qisqarishi.","mnemonic":"Pay cho'zilishi = HADDAN TASHQARI cho'zilish yoki TO'SATDAN KUCHLI qisqarish","source":"11-sinf §37, 102-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":632,"soha":"6. Tibbiy bilim asoslari","subtopic":"Bo'g'im chiqishi — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Bo'g'im chiqishi (dislokatsiya) nima?","options":{"A":"Suyak sinishi","B":"Bo'g'im siljishi","C":"Pay yirtilishi","D":"Mushak jarohati"},"answer":"B","explanation":"Chiqish (dislokatsiya) — suyaklarni birlashtiruvchi bo'g'imning joyidan siljishi; u bo'g'im faoliyatining buzilishiga olib keladi.","mnemonic":"BO'G'IM CHIQISHI = bo'g'im JOYIDAN SILJISHI -> faoliyat buzilishi","source":"11-sinf §37, 102-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":633,"soha":"6. Tibbiy bilim asoslari","subtopic":"Bo'g'im chiqishi — belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Futbolchi to'g'ri tushmasdan bilagi bo'g'imidan siljidi, qo'li odatdagidek turmay qoldi. Bu qanday shikastlanish va belgilari?","options":{"A":"Suyak sinishi — g'ichirlash, deformatsiya, og'riq va harakat cheklanishi","B":"Bo'g'im chiqishi — kuchli og'riq, harakat kamayadi, a'zo turmaydi","C":"Pay cho'zilishi — shish, og'riq va harakatda noqulaylik","D":"Miya chayqalishi — bosh aylanishi va ko'ngil aynishi"},"answer":"B","explanation":"Bo'g'im chiqishi belgilari: kuchli og'riq bo'ladi; bo'g'imda harakat kamayadi; qo'l yoki oyoq chiqqanda u odatdagidek turmaydi; qo'l-oyoq uzunligi o'zgaradi (ko'pincha kaltalashadi); bo'g'im sohasining deformatsiyasi kuzatiladi.","mnemonic":"Bo'g'im chiqishi: OG'RIQ + HARAKAT kamayadi + ODATDAGIDEK TURMAYDI + DEFORMATSIYA","source":"11-sinf §37, 102-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":634,"soha":"6. Tibbiy bilim asoslari","subtopic":"Pay cho'zilishi va bo'g'im chiqishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Pay cho'zilishi va bo'g'im chiqishida birinchi tibbiy yordam qanday?","options":{"A":"Darhol bo'g'imni joyiga qaytarish","B":"Harakatga keltirmaslik, 15‑20 daq. muzli","C":"Issiq suv bilan jarohatni isitish","D":"Dori surtib qattiq ishqalash"},"answer":"B","explanation":"Pay cho'zilishi va bo'g'im chiqishida birinchi tibbiy yordam: bemorni tinchlantirish, jarohatlangan joyni qo'zg'atmaslik va dam olishga imkon berish; jarohatlangan joyga 15-20 daqiqa davomida muzli xalta qo'yish (3-4 soat davomida takrorlash mumkin); agar mumkin bo'lsa, jarohatlangan qo'l yoki oyoqni yuqoriga ko'tarish; kerak bo'lsa, elastik bandaj yordamida bog'lash.","mnemonic":"Pay/chiqish birinchi yordam: TINCHLAN + QIMIRLATMA + 15-20 min MUZ + YUQORIGA KO'TAR","source":"11-sinf §37, 103-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":635,"soha":"6. Tibbiy bilim asoslari","subtopic":"Umurtqa pog'onasi — harakatsizlantirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Umurtqa pog'onasi shikastlanishida birinchi tibbiy yordamda eng muhim narsa nima?","options":{"A":"Bemorni tezda ko'tarib harakatga majburlash","B":"Bemorni harakatlardan himoya qilish va harakatsizlantirish","C":"Dori berib, shifokor kelguncha kutish","D":"Bemorni yonbosh holatga o'tkazish"},"answer":"B","explanation":"Umurtqa pog'onasining har qanday shikastlanishida eng asosiy narsa — bemorni harakatlardan himoya qilish (harakatsizlantirish). Bu umurtqa pog'onasi yanada qattiqroq shikastlanishining oldini oladi va neyrologik zararlarni kamaytiradi.","mnemonic":"Umurtqa: birinchi — HARAKATSIZLANTIRISH (yanada shikastlanmasligi uchun)","source":"11-sinf §38, 108-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":636,"soha":"6. Tibbiy bilim asoslari","subtopic":"Umurtqa — transportirovka","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Umurtqa pog'onasi shikastlangan bemorni qanday transportirovka qilish kerak?","options":{"A":"Bemorni yostiq bilan qo'llab, avtomobilga joylashtirish","B":"Shinalar yoki taxta yordamida, qattiq tekis yuzaga yotqizib, harakatsiz","C":"Bemorni qo'lda ko'tarib, yonbosh holatda tashish","D":"Bemorni tez yugurib, imkon qadar tez olib borish"},"answer":"B","explanation":"Umurtqa shikastlanishida transportirovka: maxsus shinalar, taxta yoki bosh va bo'ynini qo'llab-quvvatlovchi vositalar yordamida transportirovka qilinadi. Bemorni qattiq, tekis yuzaga yotqizib, og'riqni kamaytirish va harakatni cheklash kerak.","mnemonic":"Umurtqa transportirovka: SHINALAR/TAXTA + QATTIQ TEKIS YUZA + HARAKATSIZ","source":"11-sinf §38, 108-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":637,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ko'krak jarohatlari — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Ko'krak qafasi ochiq jarohatlariga qaysilar kiradi?","options":{"A":"Qovurg'alar sinishi, pnevmotoraks","B":"Pichoq, o'q yoki metall zarba jarohatlari","C":"Gemotoraks, o'pkaga qon yig'ilishi","D":"Faqat ko'karish, shish va og'riq"},"answer":"B","explanation":"Ko'krak jarohatlari: ochiq jarohatlar — pichoq yarasi, o'q yarasi, shisha yoki metall zarbasidan kelib chiqqan jarohatlar. Yopiq jarohatlar — qovurg'alarning sinishi, o'pkaning jarohatlanishi, pnevmotoraks, gemotoraks.","mnemonic":"Ko'krak OCHIQ: PICHOQ+O'Q+SHISHA/METALL; YOPIQ: qovurg'a sinishi+pnevmotoraks","source":"11-sinf §39, 109-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":638,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ko'krak jarohatlari — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Ko'krakning ochiq (teshilgan) jarohatida birinchi tibbiy yordam qanday?","options":{"A":"Jarohatni kengaytirish va ichini ko'rish","B":"Steril doka bilan yarani yopish","C":"Jarohatga issiq suv sepish","D":"Bemorni tik turgizish"},"answer":"B","explanation":"Ko'krakning ochiq (teshilgan) jarohatida: teshilgan jarohat bo'lsa, havo o'pkaga kirmasligi uchun steril qoplama yoki toza doka yordamida yarani yopish.","mnemonic":"Ko'krak OCHIQ jarohat: STERIL QOPLAMA bilan yarani YOP (havo kirmasin!)","source":"11-sinf §39, 110-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":639,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qorin jarohati — ichki a'zolar","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Qorin sohasi jarohatlangan bemor rangi oqarib, yurak urishi tezlashdi, boshi aylanadi, qon bosimi pasaymoqda. Bu qanday holat?","options":{"A":"Miya chayqalishi natijasida hushdan ketish","B":"Qorin ichki a'zolari shikastlanishi va ichki qon ketishi","C":"Ko'krak qafasi jarohati va pnevmotoraks","D":"Pay cho'zilishi va bo'g'im chiqishi"},"answer":"B","explanation":"Ichki a'zolar (parenximatoz)ning shikastlanishi jigar, taloq, buyraklardan qon ketishi bilan xavflidir. Belgilari: kuchli og'riq, ichki qon ketishi oqibatida o'tkir kamqonlik, hushdan ketish, yuz oqarishi, yurak urishi tezlashib kuchsizlanishi, bosh aylanishi, qusish, arterial bosimi pasayishi.","mnemonic":"Qorin ichki qon ketish: RAN OQAR + YURAK TEZLASH + QON BOSIM PASAY + bosh aylan","source":"11-sinf §39, 110-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":640,"soha":"6. Tibbiy bilim asoslari","subtopic":"Avtohalokat — birinchi yordam tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Avtohalokatga duch kelganda birinchi navbatda nima qilish kerak?","options":{"A":"Darhol jarohatlanganlarga tibbiy yordam ko'rsatish","B":"Avvalo xavfsizlikni ta'minlash, avariya signalini yoqish va 103 chaqirish","C":"Barcha atrofdagi avtomobillarni to'xtatib, yordam so'rash","D":"Jarohatlanganni darhol mashinadan chiqarib, o'tga yotqizish"},"answer":"B","explanation":"Avtohalokat yuz bergan joyga yetib borganda: avvalo xavfsizlikni ta'minlash (portlash yoki olov xavfi bo'lsa xavfsiz joy tanlash); avariya signalini yoqish; boshqa haydovchilarga ogohlantirish; keyin tez tibbiy yordamni chaqirish (103).","mnemonic":"Avtohalokat: XAVFSIZLIK + SIGNAL + 103 CHAQIR -> keyin tibbiy yordam","source":"11-sinf §35, 97-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":641,"soha":"6. Tibbiy bilim asoslari","subtopic":"Avtodori qutisi — tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Avtotransportdagi dori qutisida qon ketishini to'xtatish uchun qaysi vosita bo'lishi shart?","options":{"A":"Spirt va antiseptik eritma","B":"Turniket rezina jgut","C":"Termometr","D":"Bir martalik shpris"},"answer":"B","explanation":"Avtotransportdagi dori qutisida qon ketishini to'xtatish uchun turniket rezina jgut (ko'p qon ketish holatida) bo'lishi kerak.","mnemonic":"Avtodori qutisi: qon ketishda -> TURNIKET REZINA JGT","source":"11-sinf §35, 96-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":642,"soha":"6. Tibbiy bilim asoslari","subtopic":"Avtohalokat — umurtqa ehtiyoti","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Avtohalokatda jarohatlanganlarni tekshirishda qaysi ehtiyot chorasi eng muhim?","options":{"A":"Jarohatlanganni imkon qadar tezda mashinadan chiqarish","B":"Umurtqani shikastlanmasligi uchun bo'g'imlarni harakatlantirmaslik","C":"Bemor bilan muloqot qilmaslik va faqat 103 chaqirish","D":"Dori berish va tez tibbiy yordam kelguncha kutish"},"answer":"B","explanation":"Avtohalokatda: agar jarohatlar o'tkir va katta bo'lsa, bemor va uning bo'g'imlarini harakatlantirmaslik kerak. Umurtqa pog'onasi zarar ko'rmasligi uchun jarohatlangan bemorni shifoxonaga to'g'ri yetkazish zarur.","mnemonic":"Avtohalokat: UMURTQA ehtiyoti -> BO'G'IM HARAKATLANTIRMA","source":"11-sinf §35, 97-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":643,"soha":"6. Tibbiy bilim asoslari","subtopic":"Miyaga qon quyilishi — belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yaradorda og'ir bosh og'rig'i, ko'ngil aynishi, qon bosimi o'zgarishi, xotira yo'qolishi, hushdan ketish, og'ir falajlanish kuzatilmoqda. Bu qanday shikastlanish?","options":{"A":"Miya chayqalishi","B":"Pay cho'zilishi","C":"Miyaga qon quyilishi","D":"Bosh suyagi asosi sinishi"},"answer":"C","explanation":"Miyaga qon quyilishi belgilari: og'ir bosh og'rig'i, ko'ngil aynishi va qusish, qon bosimining o'zgarishi, xotira yo'qolishi, hushdan ketish, og'ir falajlanish. Bu og'ir shikast bo'lib, qon tomirlarining yorilishi va miya ichiga qon quyilishi oqibatida sodir bo'ladi.","mnemonic":"Miyaga QON QUYILISHI: OG'IR bosh og'riq + FALAJLANISH + XOTIRA yo'q (og'ir!)","source":"11-sinf §36, 98-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":644,"soha":"6. Tibbiy bilim asoslari","subtopic":"Pnevmotoraks — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Pnevmotoraks nima?","options":{"A":"Qorin bo'shlig'iga qon yig'ilishi","B":"Ko'krak bo'shlig'iga havo yig'ilishi","C":"Ko'krak bo'shlig'iga qon yig'ilishi","D":"Qovurg'alar sinishi"},"answer":"B","explanation":"Pnevmotoraks — o'pkaga havo yig'ilishi. Gemotoraks esa o'pkaga qon yig'ilishi. Ikkalasi ham ko'krak qafasining yopiq jarohatlariga kiradi.","mnemonic":"PNEVMO-toraks = HAVO yig'ilishi (pnevmo=havo); GEMOTORAKS = QON yig'ilishi","source":"11-sinf §39, 109-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":645,"soha":"6. Tibbiy bilim asoslari","subtopic":"Tez tibbiy yordam — raqami","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekistonda tez tibbiy yordam xizmatining telefon raqami qaysi?","options":{"A":"101","B":"102","C":"103","D":"112"},"answer":"C","explanation":"O'zbekistonda tez tibbiy yordam xizmati 103 raqami orqali chaqiriladi. 112 esa umumiy favqulodda yordam (birlashtirilgan dispetcher) raqami.","mnemonic":"Tez tibbiy yordam = 103 (va umumiy 112)","source":"11-sinf §36, 99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":646,"soha":"6. Tibbiy bilim asoslari","subtopic":"Miya ezilishi — belgilari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Yaradorda uzoq davom etuvchi hushdan ketish (soatlab), nutq buzilishi, tana haroratining ko'tarilishi, nafas va yurak urishining buzilishi, mushaklarning falajlanishi kuzatilmoqda. Bu qanday shikastlanish?","options":{"A":"Miya chayqalishi","B":"Miyaga qon quyilishi","C":"Miya ezilishi","D":"Bosh suyagi asosi sinishi"},"answer":"C","explanation":"Bosh miyaning ezilishi (lat yeyishi) — miyaga kuchli zarba tushishi oqibatida miyaning bir qismi ezilishi bilan bog'liq og'ir shikast. Belgilari: uzoq davom etuvchi hushdan ketish (soatlab yoki kunlab), nutq buzilishi, tana haroratining ko'tarilishi, nafas va yurak urishining buzilishi, mushaklarning falajlanishi.","mnemonic":"Miya EZILISHI: UZUN hushsizlik (soatlar/kunlar) + FALAJLANISH + NUTQ buzilishi","source":"11-sinf §36, 99-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":647,"soha":"6. Tibbiy bilim asoslari","subtopic":"Pay cho'zilishi — birinchi yordam muz","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Pay cho'zilishida muzli xalta qancha vaqt qo'yiladi va qanchadan takrorlanishi mumkin?","options":{"A":"5 daqiqa, 1 soatdan takrorlash","B":"15-20 daqiqa, 3-4 soat takrorlash","C":"1 soat davomida uzluksiz qo'yish","D":"Faqat bir marta 30 daqiqa"},"answer":"B","explanation":"Pay cho'zilishida: jarohatlangan joyga 15-20 daqiqa davomida muzli xalta qo'yish (3-4 soat davomida takrorlash mumkin — bu shish hamda og'riqni kamaytiradi).","mnemonic":"Pay cho'zilishi muz: 15-20 DAQIQA -> 3-4 SOAT takror (shish+og'riq kamaytiradi)","source":"11-sinf §37, 103-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":648,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ko'krak nafas qisishi — holat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Ko'krak jarohatlanganda nafas olish qiyinlashsa, bemor qanday holatga keltirilishi kerak?","options":{"A":"Yotgan holda, boshi pastga tushirilgan","B":"Boshi biroz ko'tarilgan yoki yarim o'tirgan","C":"Qorni bilan yotqizilgan holat","D":"Yonboshlab yotqizilgan holat"},"answer":"B","explanation":"Ko'krak jarohatlanganda nafas olish qiyinlashganda: bemorning boshini biroz ko'taring (yoki yarim o'tirgan holatga keltiring) — bu nafas olishni osonlashtiradi.","mnemonic":"Ko'krak + nafas qisishi: BOSH KO'TAR yoki YARIM O'TIRGAN holat","source":"11-sinf §39, 110-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":649,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ruhiy yordam — avtohalokat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Avtohalokatda jarohatlanganlar stress holatida bo'lishi mumkin. Birinchi tibbiy yordamda ruhiy yordam qanday ko'rsatiladi?","options":{"A":"Jarohatlanganlar bilan hech qanday muloqot qilmaslik","B":"Jarohatlanganlarni tinchlantirish, diqqat bilan yondashish","C":"Faqat jismoniy yordam ko'rsatish, gapirmaslik","D":"Baqirib, buyruq berib, yordam ko'rsatish"},"answer":"B","explanation":"Avtohalokatda jarohatlanganlar stress holatida bo'lishi mumkin. Stressdan saqlash uchun yo'lovchilar va haydovchini tinchlantirish hamda ular bilan muloyim muloqot qilish kerak.","mnemonic":"Avtohalokat ruhiy yordam: TINCHLANTIRIB + MULOYIM MULOQOT","source":"11-sinf §35, 97-bet","source_file":"050_tibbiy_11sinf.json","_unrep":false},{"id":650,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — ta'rif va sabablari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Zilzilalar yer sharining qaysi seysmik kamarida eng ko'p (taxminan 80%) sodir bo'ladi?","options":{"A":"O'rta yer dengizi (Osiyo) seysmik kamarida","B":"Tinch okean seysmik kamarida","C":"O'rta Atlantika suvosti tog' tizmasida","D":"Hind okean seysmik kamarida"},"answer":"B","explanation":"Tinch okean seysmik kamarida zilzilalarning taxminan 80 foizi sodir bo'ladi. O'rta yer dengizi kamarida ~15%, O'rta Atlantika kamarida ~5%.","source":"11-sinf §24, 66-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":651,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Zilzilalar kelib chiqish sababiga ko'ra eng keng tarqalgan turi qaysi?","options":{"A":"Vulqon zilzilasi","B":"O'pirilish zilzilasi","C":"Texnogen zilzila","D":"Tektonik zilzila"},"answer":"D","explanation":"Tektonik zilzilalar eng keng tarqalgan tur (95–99%), Yer qobig'i harakatlari bilan bog'liq. Vulqon zilzilalari faqat vulqon faolligi bor hududlarda yuz beradi.","source":"11-sinf §24, 67-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":652,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — O'zbekistondagi xususiyati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan qanday tur va necha km chuqurlikda bo'ladi?","options":{"A":"Vulqon turi, 100–200 km chuqurlikda","B":"O'pirilish turi, 5–10 km chuqurlikda","C":"Tektonik tur, chuqurlik 10–40 km, ba'zida","D":"Chuqur fokusli tur, 200–300 km chuqurlikda"},"answer":"C","explanation":"O'zbekiston va Markaziy Osiyodagi zilzilalar asosan tektonik qobiq zilzilalariga kiradi, chuqurligi 10–40 km, ba'zan 70 km gacha bo'ladi.","source":"11-sinf §24, 67-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":653,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — xavfli joylar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yer qimirlaganda uyning qaysi joylari ENG XAVFLI hisoblanadi?","options":{"A":"Markaziy koridorlar va kichik xonalar","B":"Birinchi qavat va yerosti gajak tuynuklar","C":"Deraza ostlari, oynali devorlar, lift va zinapoya maydonchalari","D":"Oshxona va hammomlar, chunki ularda quvurlar mustahkam"},"answer":"C","explanation":"Yer qimirlaganda eng xavfli joylar: ichki va tashqi deraza osti, devorlarning oyna bilan qoplangan qismlari, lift va zinapoya maydonchalari, ayniqsa, burchakdagi va oxirgi qavatdagi xonalar.","source":"11-sinf §24, 67-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":654,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — birinchi qavatda harakat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'p qavatli uyning birinchi qavatida zilzila boshlansa, dastlab qanday harakat qilish kerak?","options":{"A":"Lift yoki zinapoyadan pastga tushib, binoni tark etish","B":"Deraza tomoniga o'tib, oynani ochib tashqariga chiqish","C":"15-20 soniyada tashqariga chiqib, baland imoratlardan uzoqqa o'tish","D":"Stol yoki karavot tagiga berkinib, zilzila o'tishini kutish"},"answer":"C","explanation":"Birinchi qavatda yoki xom g'ishtli uyda yashasangiz, zilzila boshlanishi bilan 15–20 soniya ichida darhol tashqariga chiqib keting; elektr simlari, gaz quvurlari va baland imoratlardan uzoqda ochiq joyga o'ting.","source":"11-sinf §24, 68-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":655,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — yuqori qavatda harakat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ikkinchi qavatdan yuqorida zilzila vaqtida qanday qilish NOTO'G'RI?","options":{"A":"Eshikni ochib, ostonaga turib olish","B":"Asosiy devor yonida, oynavand devorlardan uzoqda turish","C":"Lift yoki zinapoyalarga qarab yugurish","D":"Stol tagiga kirib, boshni qo'llar bilan himoya qilish"},"answer":"C","explanation":"Ikkinchi qavatdan yuqorida hech qachon lift yoki zinapoyalarga qarab yugurmang, chunki ko'p hollarda yer qimirlashi bilan birinchi navbatda ular qulaydi.","source":"11-sinf §24, 68-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":656,"soha":"5. Fuqaro muhofazasi","subtopic":"Zilzila — gavjum joyda harakat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Maktab, do'kon yoki kinoteatrda zilzila bo'lsa qanday harakat qilish to'g'ri?","options":{"A":"Hammadan oldin tashqariga chopib chiqishga harakat qilish","B":"Sarosimasiz, asosiy devorlarga yaqin, osilgan buyumlardan uzoqda turish","C":"Tezda lift yoki zinapoya orqali pastga tushishga urinish","D":"Derazaga yaqin turib, shisha sinsa qo'l bilan boshni to'sish"},"answer":"B","explanation":"Gavjum joyda sarosimaga tushmasdan, binoning asosiy devorlariga va ustunlarga yaqin, qandil, shamollatkich, reklama taxtaları kabi osilgan buyumlardan uzoqroq turish zarur.","source":"11-sinf §24, 68-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":657,"soha":"5. Fuqaro muhofazasi","subtopic":"Ko'chki — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Ko'chki deganda qanday hodisa tushuniladi?","options":{"A":"Daryolarda suv sathining ko'tarilishi va vodiyni suv bosishi hodisasi","B":"Tog'larda qor massasining tez harakatlanishi va erishib ketishi","C":"Yer ko'chkilari, tog' o'pirilishlari va boshqa geologik xavfli hodisalar","D":"Suv oqimida loy va toshlar aralashmasining tez harakatlanishi"},"answer":"C","explanation":"Ko'chki — insonlar o'limiga olib keladigan (yoki olib kelishi mumkin bo'lgan), ularni xavfli hududdan xavfsiz joylarga ko'chirishni talab qiluvchi yer ko'chkilari, tog' o'pirilishlari va boshqa geologik xavfli hodisalar.","source":"11-sinf §25, 69-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":658,"soha":"5. Fuqaro muhofazasi","subtopic":"Ko'chki — harakatlanish qoidalari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'chki boshlanib, xavfsiz hududga o'tishga ulgurib bo'lmasa, qanday harakat qilish kerak?","options":{"A":"Pastga qarab yugurib, sel yo'lidan o'tib olish","B":"Uyning tomiga chiqish yoki mustahkam devor panasiga o'tib olish","C":"Daraxt ostida turish va xavf o'tishini kutish","D":"Yer ostiga kirib, ko'chki o'tib ketishini kutish"},"answer":"B","explanation":"Yer ko'chishi boshlanib, xavfsiz hududga o'tishga ulgurib bo'lmasa, uyning tomiga chiqing yoki mustahkam devor panasiga o'tib oling.","source":"11-sinf §25, 69-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":659,"soha":"5. Fuqaro muhofazasi","subtopic":"Sel — xavfsiz masofa","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harakatdagi sel oqimiga necha metrdan ko'proq uzoqroqda turish kerak?","options":{"A":"10–20 metr uzoqroqda","B":"100–150 metr uzoqroqda","C":"50–70 metr uzoqroqda","D":"200 metr uzoqroqda"},"answer":"C","explanation":"Harakatdagi sel oqimi tomon yaqinlashmasdan, undan kamida 50–70 metr uzoqroqda turish kerak.","source":"11-sinf §25, 70-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":660,"soha":"5. Fuqaro muhofazasi","subtopic":"Suv toshqini — signal berish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Atrofni suv bosgan taqdirda, kechasi qutqaruvchilarga signal berishning to'g'ri usuli qaysi?","options":{"A":"Derazadan yorqin rangdagi matoni hilpiratish orqali signal berish","B":"Fonusni o'chirib yoqish orqali signal berish","C":"Ovoz chiqarib qichqirish va shovqin ko'tarish","D":"Telefon orqali 103 raqamiga qo'ng'iroq qilish"},"answer":"B","explanation":"Atrofni suv bosgan taqdirda: kunduzi — derazadan yorqin rangdagi matoni hilpiratish, kechasi — fonusni o'chirib yoqish orqali qutqaruvchilarga signal berish kerak.","source":"11-sinf §25, 70-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":661,"soha":"5. Fuqaro muhofazasi","subtopic":"Suv toshqini — evakuatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Sel va suv toshqini xavfi yuzaga kelganda evakuatsiya xabari olgach, birinchi navbatda qanday harakat qilish kerak?","options":{"A":"Uyda qolib, suv sathini diqqat bilan kuzatib, keyin qaror qilish","B":"Zaruriy narsalar bilan belgilangan tartibda xavfli hududdan xavfsiz joyga chiqish","C":"Qo'shnilarni xabardor qilib, ular bilan birga qaror qilishni kutish","D":"Avtomobilga o'tirib, quruq yo'l bo'ylab qochish"},"answer":"B","explanation":"Evakuatsiya xabarini olgach, belgilangan tartibda yashash uchun zaruriy narsalarni olib, xavfli hududdan xavfsiz hududga yoki tepaliklarga chiqish kerak.","source":"11-sinf §25, 70-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":662,"soha":"5. Fuqaro muhofazasi","subtopic":"Shamol — tezlik o'lchovi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Shamol tezligi necha m/s bo'lganda dovul (shtorm) deyiladi?","options":{"A":"5–8 m/s","B":"14 m/s","C":"30 m/s","D":"20–25 m/s"},"answer":"D","explanation":"5–8 m/s — o'rtacha shamol; 14 m/s — kuchli shamol; 20–25 m/s — dovul (shtorm); 30 m/s — bo'ron deyiladi.","source":"11-sinf §26, 71-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":663,"soha":"5. Fuqaro muhofazasi","subtopic":"Shamol — harakatlanish qoidalari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Kuchli shamol vaqtida ko'chada bo'lganda qanday harakat qilish to'g'ri?","options":{"A":"Daraxtlar va reklama shitlari tagida pana topish","B":"Elektr uzatish liniyalari yaqinida turib, shamol o'tishini kutish","C":"Biron mustahkam buyumdan mahkam ushlab, yerto'la yoki tunnel kabi pana joy topish","D":"Ko'chaning o'rtasiga o'tib, baland binolardan uzoqda turish"},"answer":"C","explanation":"Kuchli shamol vaqtida: ko'chaga chiqmang; biror mustahkam buyumdan mahkam ushlab oling; chuqurlik, yerto'la, tunnel, yerosti o'tish joylari yoki mustahkam bino pana bo'ladi.","source":"11-sinf §26, 71-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":664,"soha":"5. Fuqaro muhofazasi","subtopic":"Jala — harakatlanish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Kuchli jala tufayli suv to'satdan ko'tarilganda birinchi navbatda kimlarni tepa joylarga olib chiqish kerak?","options":{"A":"Birinchi galda yosh bolalarni evakuatsiya qilish","B":"Birinchi galda chol-kampirlarni evakuatsiya qilish","C":"Yosh bolalar, kasallikli qariyalar, bolali ayollar","D":"Iqtisodiy jihatdan qimmat buyumlar va hujjatlarni evakuatsiya qilish"},"answer":"C","explanation":"Kuchli jala natijasida suv ko'tarilganda darhol yosh bolalar, surunkali kasalligi bor qariyalar va bolali ayollarni tepa joylarga olib chiqing.","source":"11-sinf §26, 72-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":665,"soha":"5. Fuqaro muhofazasi","subtopic":"Anomal sovuq — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Anomal sovuq qanday holat hisoblanadi?","options":{"A":"Havo haroratining noldan pastga tushishi","B":"Havo haroratining me'yordan 7–12°C gacha pasayib ketish holati","C":"Havo haroratining 0°C dan past va qor yog'ishi holati","D":"Havo haroratining me'yordan 15–20°C gacha pasayib ketish holati"},"answer":"B","explanation":"Anomal sovuq — havo haroratining me'yordan 7–12°C gacha pasayib ketish holati.","source":"11-sinf §26, 72-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":666,"soha":"5. Fuqaro muhofazasi","subtopic":"Sovuq — muzlash belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Muzlashning dastlabki belgilari qaysilar?","options":{"A":"Qaltirash, tana harorati ko'tarilishi va shish paydo bo'lishi","B":"Sovuqni sezish, isinish, teri qizarishi, sezuvchanlik yo'qolishi, uvishish","C":"Bosh og'rig'i, ko'ngil aynishi va umumiy holsizlik","D":"Qon bosimi oshishi, nafas va yurak urishi tezlashishi"},"answer":"B","explanation":"Muzlash belgilari: sovuqni sezish → qisqa muddatli isinish → teri qizarishi → sezuvchanlikning yo'qolishi → uvishish. Ogohlantirish: muzlash holatida inson har doim o'z holatini to'g'ri baholay olmaydi!","source":"11-sinf §26, 72-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":667,"soha":"5. Fuqaro muhofazasi","subtopic":"Sovuq — xavfli chegara","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Tana harorati 27°C dan pastga tushganda qanday xavfli holat yuzaga kelishi mumkin?","options":{"A":"Ko'rish qobiliyatining pasayishi va bosh aylanishi","B":"Yurak urishi tezlashib, qon bosimi keskin ko'tarilishi","C":"Koma holatiga olib kelishi mumkin","D":"Nafas olish sekinlashib, hushdan ketish holati"},"answer":"C","explanation":"Tana harorati: 32°C dan pastda yurak va nafas tizimlari faoliyati buziladi; 27°C darajada koma holatiga olib kelishi mumkin.","source":"11-sinf §26, 72-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":668,"soha":"5. Fuqaro muhofazasi","subtopic":"Issiq — quyosh urishi belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyosh (issiqlik) urishi qanday belgilar bilan namoyon bo'ladi?","options":{"A":"Teri muzlashi, qon bosimining pasayishi va qaltirashuv","B":"Ko'karish, og'ir nafas olish va ko'z ostida shish","C":"Tana suvsizlanishi, bosh og'rig'i, harorat ko'tarilishi, hushdan ketish","D":"Qo'l-oyoqlarning uvishishi, mushaklarda tortishish va qaltirashuv"},"answer":"C","explanation":"Quyosh urishi belgilari: tana suvsizlanishi, bosh og'rig'i, tana haroratining ko'tarilishi, ko'ngil aynishi, holsizlik, burundan qon ketishi, hushdan ketish holatlari.","source":"11-sinf §26, 73-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":669,"soha":"5. Fuqaro muhofazasi","subtopic":"Issiq — nima qilish kerak","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Anomal issiq havoda quyidagilardan QAYSI biri noto'g'ri chora hisoblanadi?","options":{"A":"Ko'p suyuqlik ichish va tabiiy sharbatlar iste'mol qilish","B":"Qovun, tarvuz, bodring kabi suvga boy sabzavot va mevalar yeyish","C":"Kunning issiq soatlarida ko'chada ko'p vaqt o'tkazish","D":"Dim havoda issiq suvdan foydalanishni kamaytirish"},"answer":"C","explanation":"Anomal issiq havoda kunning issiq soatlarida ko'chaga chiqmaslik kerak. Ko'p suyuqlik ichish, meva-sabzavot yeyish to'g'ri choralar hisoblanadi.","source":"11-sinf §26, 73-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":670,"soha":"5. Fuqaro muhofazasi","subtopic":"Transport avariyalari — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Xavfsizlik nuqtai nazaridan poyezddagi eng xavfsiz joylar qaysilar?","options":{"A":"Birinchi va so'nggi vagonlardagi yuqori polkalar","B":"Markaziy vagonlar, favqulodda chiqish oynasi bor kupe yoki pastki polkalar","C":"Tamburlardagi oyoq qo'yichlarda turish","D":"Derazaga yaqin o'rindiqlar, chunki xavf bo'lganda tez chiqish mumkin"},"answer":"B","explanation":"Poyezdda xavfsizlik jihatidan eng yaxshi joylar: markaziy vagonlar, favqulodda chiqish oynasi mavjud kupe yoki vagondan chiqish joyiga yaqinroq pastki polkalar.","source":"11-sinf §27, 76-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":671,"soha":"5. Fuqaro muhofazasi","subtopic":"Transport avariyalari — avtomobil suvga","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Avtomobil suvga ag'darilsa, qanday harakat qilish kerak?","options":{"A":"Eshikni darhol ochib chiqishga harakat qilish, chunki eshik tezda ochiladi","B":"Mashinada o'tirib, qutqaruvchilar kelishini kutish","C":"Ochiq oyna orqali chiqish; eshik ochilganda mashina suvga to'lib cho'ka boshlaydi","D":"Mashina tepasiga chiqib, qutqaruvchilar yetib kelguncha o'tirish"},"answer":"C","explanation":"Suvga ag'darilgan mashina birmuncha vaqt suvning ustida turadi. Ochiq oyna orqali chiqish kerak, chunki eshik ochilganda mashina suvga to'lib cho'ka boshlaydi. Zarurat tug'ilganda qattiq jism bilan oynani sindirib, qo'llar bilan tom ushlab tashqariga siqilib chiqing.","source":"11-sinf §27, 75-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":672,"soha":"5. Fuqaro muhofazasi","subtopic":"Transport avariyalari — aviahalokat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Aviahalokat paytida samolyotning qaysi qismi omon qolish ehtimoli boshqa qismlarga nisbatan 40% yuqori?","options":{"A":"Birinchi qatorlar — pilot kabinasiga yaqin joy","B":"O'rtadagi qatorlar — foydalanish oynasiga yaqin joy","C":"Qanotlar yonidagi qatorlar — kuchli konstruktsiya hisobiga","D":"Samolyotning dumi tomonidagi qatorlar"},"answer":"D","explanation":"Halokatga uchragan samolyotning dumi tomonida o'tirish omon qolish ehtimoli bo'yicha birinchi qatorlarga qaraganda 40% yuqori.","source":"11-sinf §27, 77-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":673,"soha":"5. Fuqaro muhofazasi","subtopic":"Transport avariyalari — avtomobilda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Avtomobil avariyasida yolovchi yon o'rindiqda bo'lsa, to'qnashuv muqarrar bo'lganda qanday harakat qilish kerak?","options":{"A":"Eshikni ochib tashqariga sakrash","B":"Rulni ikki qo'l bilan mahkam ushlab, to'g'ri o'tirish","C":"Boshini qo'llari bilan yopib, yon tomonga yotib, o'rindiqqa suyaning","D":"Ko'krak qafasini rul ustiga bosib, boshni himoya qilish"},"answer":"C","explanation":"Old o'rindiqdagi yo'lovchi: boshni qo'llar bilan yopib, yon tomonga yotib, o'rindiqqa suyaning. Orqa o'rindiqdagi yo'lovchi: mashina poliga yiqilishga harakat qiling.","source":"11-sinf §27, 75-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":674,"soha":"5. Fuqaro muhofazasi","subtopic":"Transport avariyalari — xabar berish","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yo'l-transport hodisasi (avtohalokat) sodir bo'lganda qaysi telefon raqamiga xabar berish kerak?","options":{"A":"103 — tez tibbiy yordam","B":"101 — yong'in-qutqaruv","C":"102 — yo'l harakati xavfsizligi xizmati","D":"112 — umumiy favqulodda vaziyat markazi"},"answer":"C","explanation":"Avtohalokat haqida '102' raqamiga qo'ng'iroq qilib xabar berish yoki yaqin atrofdagi yo'l patrul postiga haydovchilar orqali xabar qilish kerak.","source":"11-sinf §27, 75-bet","source_file":"051_fv_tabiiy_ofatlar.json","_unrep":false},{"id":675,"soha":"5. Fuqaro muhofazasi","subtopic":"KTEZM — kimyoviy sharoit turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Kimyoviy xavfli obyektlarda KTEZM fizik-kimyoviy xususiyatiga qarab nechta turdagi kimyoviy sharoit bilan bog'liq favqulodda vaziyatlar yuzaga kelishi mumkin?","options":{"A":"Ikki turdagi","B":"Besh turdagi","C":"To'rt turdagi","D":"Uch turdagi"},"answer":"C","explanation":"KTEZM fizik-kimyoviy xususiyatiga qarab, kimyoviy xavfli obyektlarda to'rtta asosiy turdagi kimyoviy sharoit bilan bog'liq favqulodda vaziyatlar yuzaga kelishi mumkin.","source":"11-sinf §28, 78-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":676,"soha":"5. Fuqaro muhofazasi","subtopic":"KTEZM — birinchi turdagi kimyoviy sharoit","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Birinchi turdagi kimyoviy sharoit bilan bog'liq favqulodda vaziyat qanday holda yuzaga keladi?","options":{"A":"Suyultirilgan zaharli gazlarning halokatli to'kilishi va atmosferaga chiqib ketishi oqibatida","B":"Bosim ostidagi gazsimon KTEZM ni o'z ichiga olgan idishlarning bir zumda bosimsizlanishi oqibatida","C":"Kam uchuvchan KTEZM ning ko'p miqdori halokatli chiqib ketishi oqibatida","D":"Suyultirilgan KTEZM ning katta qismi taglik idishga quyilishi oqibatida"},"answer":"B","explanation":"Birinchi turdagi kimyoviy vaziyat: gazsimon, bosim ostidagi yoki kriogen KTEZMni o'z ichiga olgan idishlarning bir zumda bosimsizlanishi oqibatida yuzaga keladi. Natijada shamol bo'ylab tarqaladigan birlamchi bug'-gaz yoki aerozol bulutlar hosil bo'ladi.","source":"11-sinf §28, 78-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":677,"soha":"5. Fuqaro muhofazasi","subtopic":"KTEZM — misollar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Ikkinchi turdagi kimyoviy sharoit bilan bog'liq vaziyatlarda qaysi moddalar havoga chiqishi misol tariqasida keltiriladi?","options":{"A":"Fenol, dioksin va oltingugurt uglerodi","B":"Nosimmetrik dimetilgidrazin va sinil kislotasi tuzlari","C":"Ammiak, xlor, fosgen, azot oksidi, oltingugurt dioksidi","D":"Neft mahsulotlari va mineral o'g'itlar"},"answer":"C","explanation":"Ikkinchi turdagi kimyoviy vaziyatda: suyultirilgan zaharli gazlar (ammiak, xlor) va uchuvchan zaharli suyuqliklar (fosgen, azot oksidi, oltingugurt dioksidi, sinil kislotasi va b.) halokatli to'kilishi va atmosferaga chiqib ketishi oqibatida yuzaga keladi.","source":"11-sinf §28, 78-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":678,"soha":"5. Fuqaro muhofazasi","subtopic":"KTEZM — kimyoviy xavf signal","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Kimyoviy xavfli obyektda avariya haqida xabar olganda aholi dastlab qanday harakat qilishi kerak?","options":{"A":"Ko'chaga chiqib, ochiq toza havo tomon yugurish","B":"Deraza-eshiklarni berkitib, niqob kiyib, radio orqali ko'rsatmani kutish","C":"Do'xtirga qo'ng'iroq qilib, o'z ahvolini so'rab olish","D":"Ko'chaga chiqib, barcha qo'shnilarni xabardor qilish"},"answer":"B","explanation":"Kimyoviy xavf signali olganda: nafas organlarini himoya qilish vositalari kiyish; uyda ustki kiyimni yechib polietilen xaltaga soling; deraza, eshik va ventilyatsiya tuynuklarini berkiting; radio/televizorni yoqing va ko'rsatmalarni kuting.","source":"11-sinf §28, 79-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":679,"soha":"5. Fuqaro muhofazasi","subtopic":"Radiatsiya — xabar berish usuli","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Radiatsiyaviy xavfli obyektda avariya sodir bo'lganda aholiga xabar berishning asosiy usuli qaysi?","options":{"A":"Harbiy ko'chadagi patrol xodimlari orqali og'zaki xabardor qilish","B":"OAV orqali 'Diqqat, barchaga!' signalini uzatish, elektrosirenalar va sanoat gudoklari","C":"SMS xabar yuborish va ijtimoiy tarmoqlar orqali e'lon qilish","D":"Mahalla qo'mitasi xodimlari uyma-uy yurish orqali ogohlantirish"},"answer":"B","explanation":"Radiatsiyaviy xavfli obyektlarda avariyada aholiga xabar berishning asosiy usuli — OAV orqali 'Diqqat, barchaga!' signalini uzatish. Buning uchun elektrosirenalar, sanoat gudoklari va boshqa signal berish vositalaridan foydalaniladi.","source":"11-sinf §28, 79-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":680,"soha":"5. Fuqaro muhofazasi","subtopic":"Gidrotexnik inshootlar — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Gidrotexnik inshootlarga quyidagilardan qaysi biri KIRMAYDI?","options":{"A":"To'g'onlar va suv tashlash inshootlari","B":"Bosimli va bosimsiz tunnellar, nasos stansiyalari","C":"Suv omborlari qirg'oqlarini muhofaza qilish inshootlari","D":"Ko'chalar va asfalt yo'llar"},"answer":"D","explanation":"Gidrotexnik inshootlarga: to'g'onlar, suv tashlash inshootlari, bosimli va bosimsiz tunnellar, nasos stansiyalari, kanallar, gidroelektrostansiya binolari, suv omborlari qirg'oqlari kiradi. Ko'cha va yo'llar bu turkumga kirmaydi.","source":"11-sinf §29, 81-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":681,"soha":"5. Fuqaro muhofazasi","subtopic":"Gidrotexnik halokatlar — sabablari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Gidrotexnik inshootlar bilan bog'liq favqulodda vaziyatlarning yuzaga kelishida quyidagilardan qaysi biri sabab bo'lishi MUMKIN EMAS?","options":{"A":"Tabiiy ofatlar (zilzila, ko'chki, jala)","B":"Loyihalash va qurilishdagi xatolar","C":"Terroristik harakatlar","D":"Foydalanuvchilarning malakasiz bo'lishi"},"answer":"D","explanation":"Gidrotexnik inshootlar bilan bog'liq favqulodda vaziyatlar sabablari: tabiiy ofatlar, statik va dinamik kuchlar, metall zichlashishi, loyihalash va qurilish xatolari, foydalanish qoidalari buzilishi, terroristik harakatlar. Foydalanuvchi malakasi emas, qoidalar buzilishi sabab bo'ladi.","source":"11-sinf §29, 82-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":682,"soha":"5. Fuqaro muhofazasi","subtopic":"Gidrotexnik halokat — harakat tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Gidrotexnik inshootda avariya xavfi yuzaga kelganda (suv toshqini) aholi dastlab qanday harakat qilishi kerak?","options":{"A":"Uyda qolib, suv sathini doimiy kuzatib turish va xavfsizlik choralarini ko'rish","B":"Mahalliy boshqaruv organlarining rejasi bo'yicha xavfsiz hududga o'tish","C":"Avtomobilga o'tirib, asosiy yo'l bo'ylab tezda qochish va boshqalarni ham olib ketish","D":"Turar joyni tark etmay, darhol yuqori qavatga ko'tarilish va suvdan qochish"},"answer":"B","explanation":"Suv toshqini xavfi haqidagi ogohlantirishdan so'ng mahalliy boshqaruv organlarining avvaldan ishlab chiqqan rejasi bo'yicha xavfsiz hududga harakat qilish kerak.","source":"11-sinf §29, 83-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":683,"soha":"5. Fuqaro muhofazasi","subtopic":"Yong'in — ta'rif va oqibatlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yong'in xavfsizligi bo'yicha quyidagi harakatlardan qaysi biri TO'G'RI?","options":{"A":"Tabiiy va propan gaz ballonidan foydalanishda avval gaz jo'mrag'ini ochish, so'ng gugurt yoqish","B":"Xonani gaz plitasida isitish mumkin","C":"Tabiiy va propan gaz ballonidan foydalanishda avval gugurtni yoqib, so'ng gaz jo'mrag'ini ochish","D":"Elektr jihozlarni avtomatik o'chmaydigan rejimda ishlashiga ruxsat berish"},"answer":"C","explanation":"Tabiiy va propan gaz ballonlaridan foydalanishda avval gugurtni yoqib, so'ng gaz jo'mrag'ini ochish kerak — bu yong'in va portlashning oldini oladi.","source":"11-sinf §30, 85-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":684,"soha":"5. Fuqaro muhofazasi","subtopic":"Yong'in — birlamchi vositalar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yong'inni o'chirishning birlamchi vositalariga quyidagilardan QAYSI BIRI kirmaydi?","options":{"A":"Ko'chma va transportirovka qilinadigan o't o'chirg'ichlar","B":"Yong'inga chidamli matolar (asbest, kigiz, namat)","C":"Qum va suv bilan to'ldirilgan idishlar","D":"Elektr toki bilan isituvchi asboblar"},"answer":"D","explanation":"Yong'inni o'chirishning birlamchi vositalari: o't o'chirg'ichlar, qum/suv idishlari, yong'inga chidamli matolar, bochkalar, ilgak, lom, belkurak, bolta kiradi. Elektr isitish asboblari bu guruhga kirmaydi.","source":"11-sinf §31, 87-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":685,"soha":"5. Fuqaro muhofazasi","subtopic":"Yong'in — harakat tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Maktabda yong'in sodir bo'lganda o'quvchilar dastlab qanday harakat qilishi kerak?","options":{"A":"O't o'chirg'ich bilan o'zi yong'inni o'chirishga harakat qilish","B":"Barcha narsalarni olib, darhol tashqariga chiqish va xavfsizlikni ta'minlash","C":"101 yoki 112 ga xabar berish hamda o'quvchilarni evakuatsiya qilish","D":"O'qituvchi ko'rsatmasini kutmasdan mustaqil qaror qilish"},"answer":"C","explanation":"Yong'in sodir bo'lganda: 101/1050/112 ga tezlik bilan xabar berish va boshqa sinf o'quvchilariga xabar berish, evakuatsiya qilish choralarini ko'rish kerak. Maktab rahbariyati umumiy rahbarlikni amalga oshiradi.","source":"11-sinf §31, 88-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":686,"soha":"5. Fuqaro muhofazasi","subtopic":"Yong'in — evakuatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yong'inni qo'lbola o't o'chirish vositalari bilan o'chirib bo'lmasa qanday harakat qilish kerak?","options":{"A":"Ko'proq suv topib, o'chirishni davom ettirish","B":"Binoni tezlik bilan tark etish","C":"O't o'chirish brigadasi kelguncha kutish","D":"Boshqa xonaga o'tib, yong'in tarqalishini to'xtatish"},"answer":"B","explanation":"Agar olovni qo'lbola o't o'chirish vositalari bilan o'chirish hech qanday natija bermasa, binoni tezlik bilan tark etish lozim.","source":"11-sinf §31, 88-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":687,"soha":"5. Fuqaro muhofazasi","subtopic":"Ekologik FV — tuproq holatiga ta'sir","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Halokatli ko'chkilar sifatida nimalar kiradi?","options":{"A":"Kuchli yomg'ir tufayli daryolar sathining ko'tarilishi","B":"Tog'larda qor massasining tez harakatlanishi","C":"Foydali qazilmalar qazish yoki inson faoliyati natijasida yer sathining o'pirilishi","D":"Gidrotexnik inshootlarning buzilishi natijasida suv toshqini yuzaga kelishi"},"answer":"C","explanation":"Halokatli ko'chkilar — foydali qazilmalar qazish jarayonida yer ostiga ishlov berish va inson faoliyati natijasida yuzaga keladigan yer sathining o'pirilishi yoki siljishi; sanoat faoliyati tufayli tuproqning og'ir metallar va zaharli moddalar bilan ifloslanishi.","source":"11-sinf §32, 89-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":688,"soha":"5. Fuqaro muhofazasi","subtopic":"Ekologik FV — tuproq shorlianishi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Tuproqning ikkilamchi shorlianishining asosiy sababi qaysi?","options":{"A":"Kuchli yomg'ir va suv toshqinlari","B":"Zaharli kimyoviy moddalar tarqalishi","C":"Me'yordan ortiq sug'orilish va drenaj tizimining yo'qligi","D":"Atmosferadagi toksik moddalar tushishi"},"answer":"C","explanation":"Tuproqning ikkilamchi shorlianishining asosiy sabablari: yerning tartibsiz, me'yordan ortiq sug'orilishi, drenaj tizimining yo'qligi, filtratsiya suvlari bilan suv balansining buzilishi.","source":"11-sinf §32, 89-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":689,"soha":"5. Fuqaro muhofazasi","subtopic":"Ekologik FV — atmosfera ifloslanishi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Havo tarkibida ro'y berayotgan o'zgarishlar va uning turli moddalar bilan to'yinishiga qaysilar jiddiy ta'sir ko'rsatadi?","options":{"A":"Uy-joy qurilishi va ko'kalamzorlashtirish ishlari","B":"Transport vositalari va ularning texnik xizmat ko'rsatish jarayoni","C":"Zavodlar, kimyo sanoati, o'rmon yonishi va neft mahsulotlari","D":"Qishloq xo'jaligi ishlari va dehqonchilik faoliyati"},"answer":"C","explanation":"Havo tarkibidagi o'zgarishlarga zavod va fabrikalar, kimyo sanoati korxonalari faoliyati, o'rmonlar yonishi, foydali qazilma konlari va neft mahsulotlaridan tarqalayotgan zaharli moddalar jiddiy ta'sir ko'rsatadi.","source":"11-sinf §32, 90-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":690,"soha":"5. Fuqaro muhofazasi","subtopic":"Ekologik FV — suv ifloslanishi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Markaziy Osiyo hududlarida ekologik muammolar tufayli kelib chiqadigan kasalliklarning qancha qismi ifloslangan suv bilan bog'liq?","options":{"A":"20%","B":"50%","C":"60%","D":"80%"},"answer":"D","explanation":"Ekologik muammolar tufayli kelib chiqadigan kasalliklarning 80% qismi ifloslangan suv bilan bog'liq.","source":"11-sinf §32, 90-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":691,"soha":"5. Fuqaro muhofazasi","subtopic":"Terror — ta'rif va qonun","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"O'zbekiston Respublikasining 'Terrorizmga qarshi kurash to'g'risida'gi qonuni qachon qabul qilingan?","options":{"A":"1997-yil 10-noyabr","B":"2000-yil 15-dekabr","C":"2005-yil 20-mart","D":"2010-yil 1-yanvar"},"answer":"B","explanation":"O'zbekiston Respublikasining 'Terrorizmga qarshi kurash to'g'risida'gi Qonuni 2000-yil 15-dekabrda qabul qilingan.","source":"11-sinf §33, 91-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":692,"soha":"5. Fuqaro muhofazasi","subtopic":"Terror — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Terrorchilar faoliyatining xususiyatiga ko'ra terrorizmning qanday turlari farqlanadi?","options":{"A":"Iqtisodiy, siyosiy va harbiy terrorizmlar","B":"Ichki, transmilliy va xalqaro terrorizmlar","C":"Shaharsozlik, transport va kiberterrorizmlar","D":"Ochiq, yashirin va aralash terrorizmlar"},"answer":"B","explanation":"Terrorizmning turlari faoliyat xususiyatiga ko'ra: 1) Ichki — fuqarolarning o'z hududida o'z davlatiga qarshi harakatlari; 2) Transmilliy — fuqarolarning boshqa davlatdan turib o'z vatandoshlariga qarshi harakatlari; 3) Xalqaro — xalqaro terror guruhlarining boshqa davlatlarga qarshi harakatlari.","source":"11-sinf §33, 91-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":693,"soha":"5. Fuqaro muhofazasi","subtopic":"Terror — garovga olingan shaxs","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Garovda ushlab turilgan shaxs deganda qanday holat tushuniladi?","options":{"A":"Mahkamaga sud tomonidan yuborilib, qamoqqa olingan shaxs","B":"Terrorchilar davlat yoki tashkilotlarni biror harakatga majburlash maqsadida qo'lga olgan shaxs","C":"Falokat joyi yaqinida bo'lganligi uchun vaqtincha ushlab turilgan guvoh","D":"Jinoyatda gumonlanib, tekshiruv davomida ushlab turilgan shaxs"},"answer":"B","explanation":"Garovda ushlab turilgan shaxs — terrorchilar davlat hokimiyati, xalqaro tashkilotlar yoki ayrim shaxslarni biror harakatni amalga oshirishga yoki undan tiyilishga majbur qilish maqsadida qo'lga olgan yoki ushlab turgan jismoniy shaxs.","source":"11-sinf §33, 92-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":694,"soha":"5. Fuqaro muhofazasi","subtopic":"Terror — garovda xulq-atvor","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Garovga olingan shaxs qanday xulq-atvor ko'rsatishi maqsadga muvofiq?","options":{"A":"Terrorchilardan qochishga zudlik bilan harakat qilish","B":"Terrorchilarni qo'rqitish va ularga qarshilik ko'rsatish","C":"Vahimaga berilmaslik; ozod bo'lishga ko'mak beruvchi barcha holatlarni kuzatish","D":"Garovda bo'lganni terrorchilarga hujum uyushtirish"},"answer":"C","explanation":"Garovga olingan shaxs: eng avvalo vahimaga berilmaslik kerak; ozod bo'lishga ko'mak berishi mumkin bo'lgan barcha holatlarni o'rganib borishi, yo'lni eslab qolishi, imkon qadar barcha ma'lumotlarni muzokara olib borayotgan shaxsga yetkazishi zarur.","source":"11-sinf §33, 92-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":695,"soha":"5. Fuqaro muhofazasi","subtopic":"Terror — garovda kuzatuv","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Garovda bo'lgan vaqtida qanday ma'lumotlarni eslab qolish muhim?","options":{"A":"Faqat o'z shaxsiy ma'lumotlarini aytib berish uchun tayyorlanish","B":"Deraza, eshik, zinapoyalar joylashuvi, hidlar, jinoyatchilarning ovozi va tashqi ko'rinishi","C":"Garovga olingan boshqa kishilarning familiyalarini yodlash","D":"Terrorchilarning qurollarini sanab o'rganish va ulardan foydalanishni o'rganish"},"answer":"B","explanation":"Garovda: deraza, eshik, zinapoyalar joylashuvi, devor qog'ozlari rangi, o'ziga xos hidlar, jinoyatchilarning ovozi va tashqi ko'rinishi, xatti-harakatlari va rolli taqsimot — bularning hammasini eslab qolish kerak.","source":"11-sinf §33, 92-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":696,"soha":"5. Fuqaro muhofazasi","subtopic":"Yong'in xavfsizligi — kundalik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yong'in xavfsizligi qoidasiga ko'ra qaysi harakatlar taqiqlanadi?","options":{"A":"Gugurtni bolalar qo'li yetmaydigan joyda saqlash","B":"Tabiiy va propan gaz ballonidan avval gugurtni yoqib foydalanish","C":"Yog'il kiyimlarni gaz plitasi ustida quriting","D":"Xonadan chiqishdan avval elektr va gaz tarmoqlarini o'chirish"},"answer":"C","explanation":"Yong'in xavfsizligi bo'yicha: kiyimlarni gaz plitasi ustida quritmang — bu yong'in xavfini tug'diradi. Qolgan uchta variant to'g'ri va xavfsiz harakatlardir.","source":"11-sinf §30, 85-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":697,"soha":"5. Fuqaro muhofazasi","subtopic":"KTEZM — to'rtinchi turdagi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"To'rtinchi turdagi kimyoviy vaziyat bilan bog'liq favqulodda vaziyatda asosiy xavf nima?","options":{"A":"Birlamchi bug'-gaz bulutlari hosil bo'lib, shamol bo'ylab tarqaladi","B":"Suyultirilgan zaharli gazlarning halokatli to'kilishi va ikkilamchi bulut hosil bo'lishi","C":"Hududning tuproq, o'simliklar va suvda xavfli konsentratsiyada zaharlanishi","D":"Kislorod yetishmovchiligi tufayli nafas yo'llari zararlanishi"},"answer":"C","explanation":"To'rtinchi turdagi kimyoviy vaziyatda kam uchuvchan KTEZM (fenol, oltingugurt uglerodi, dioksin va b.) ko'p miqdori chiqib ketishi oqibatida hudud (tuproq, o'simliklar, suv) xavfli konsentratsiyada zaharlanadi.","source":"11-sinf §28, 78-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":698,"soha":"5. Fuqaro muhofazasi","subtopic":"Gidrotexnik halokat — oqibatlari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Yirik gidrotexnik inshoot (suv ombori to'g'oni) buzilishining oqibatlarini eng to'g'ri tavsiflash qaysi?","options":{"A":"Yaqin atrofdagi qishloq xo'jalik ekinlari nobud bo'ladi","B":"Katta hududlar suv ostida qoladi, inson hayoti, sanoat va qishloq xo'jaligi xavf ostida","C":"Elektr ta'minoti buziladi va aloqa uziladi","D":"Transport yo'llarida vaqtinchalik qiyinchilik yuzaga keladi"},"answer":"B","explanation":"Yirik gidrotexnik inshoot buzilishi: katta hududlar suv ostida qoladi; insonlar o'limi sodir bo'lishi, hayot faoliyatining izdan chiqishi, sanoat va qishloq xo'jaligi obyektlari zararlanishi mumkin.","source":"11-sinf §29, 81-82-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":699,"soha":"5. Fuqaro muhofazasi","subtopic":"Radiatsiyadan himoyalanish tartibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Radiatsiyadan himoyalanish tartibi deganda nima tushuniladi?","options":{"A":"Radiatsiyadan zararlanganlarni shifoxonaga yotqizish tartibi","B":"Odamlar radioaktiv moddalar bilan zararlangan zonalarda harakatlanadi, himoya vositalarini qo'llaydi","C":"Fuqarolar xavfli hududni tark etib, evakuatsiya punktiga ro'yxatdan o'tadi","D":"Radiatsiyaviy xavfli obyektlarda xavfsizlik qoidalarini nazorat qilish tartibi"},"answer":"B","explanation":"Radiatsiyadan himoyalanish tartibi — odamlarning radioaktiv moddalar bilan zararlangan zonalarda o'rnatilgan tartibda harakatlanishi, himoya vositalari va usullarining qo'llanishi.","source":"11-sinf §28, 79-bet","source_file":"052_fv_ktezm_yongin_terror.json","_unrep":false},{"id":700,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — portlash turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy qurol portlashi qanday turlarga bo'linadi?","options":{"A":"Kuchli, o'rta va kuchsiz portlash","B":"Havoda, yer ustida va yer ostida portlash","C":"Nurlanish, zarba va issiqlik portlashi","D":"Taktik, operativ va strategik portlash"},"answer":"B","explanation":"Yadroviy portlash turlari: havoda, yer yuzida (suv yuzida) va yer ostida (suv ostida) portlash. Har bir turning radioaktiv zararlanish darajasi turlicha.","source":"11-sinf §53, 153-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":701,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — havoda portlash","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy qurol havoda portlaganda radioaktiv zararlanish qanday bo'ladi?","options":{"A":"Radioaktiv bulut keng hududlarga tarqalib, juda katta maydon zaharlanadi","B":"Radioaktiv zararlanish xavfi uncha katta bo'lmagan hudud, asosan portlash hududida bo'ladi","C":"Radioaktiv bulut yerga tushib, tuproq juda kuchli zaharlanadi","D":"Havoda radioaktiv zararlanish umuman yuzaga kelmaydi"},"answer":"B","explanation":"Havoda portlash sodir bo'lganda radioaktiv moddalar bilan zararlanish xavfi uncha katta bo'lmagan hudud, asosan portlash sodir bo'lgan hududda yuzaga keladi. Yer usti va yerosti portlashlari esa keng maydonlarni zararlaydi.","source":"11-sinf §53, 153-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":702,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — shikastlovchi omillar soni","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy qurolning nechta asosiy shikastlovchi omili mavjud?","options":{"A":"Uchta","B":"To'rtta","C":"Beshtata","D":"Ikkita"},"answer":"C","explanation":"Yadroviy qurolning beshta shikastlovchi omili: 1) zarba to'lqini, 2) yorug'lik nurlanishi, 3) o'tuvchan radiatsiya, 4) joylarning radioaktiv moddalar bilan zararlanishi, 5) elektromagnit impulsi.","source":"11-sinf §53, 154-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":703,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — zarba to'lqini","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy portlash energiyasining qancha qismi zarba to'lqiniga sarflanadi?","options":{"A":"Taxminan 10%","B":"Taxminan 35%","C":"Taxminan 5%","D":"Taxminan 50%"},"answer":"D","explanation":"Yadroviy portlashda: zarba to'lqiniga ~50%, yorug'lik nurlanishiga ~35%, joylarning radioaktiv zararlanishiga ~10%, o'tuvchan radiatsiyaga ~5% energiya sarflanadi.","source":"11-sinf §53, 154-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":704,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — yorug'lik nurlanishi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy portlashdagi yorug'lik nurlanishi necha soniya davom etadi va energiyaning qancha qismi unga sarflanadi?","options":{"A":"3–5 soniya, ~10% energiya","B":"30–60 soniya, ~50% energiya","C":"8–15 soniya, ~35% energiya","D":"1–2 soniya, ~5% energiya"},"answer":"C","explanation":"Yorug'lik nurlanishi
