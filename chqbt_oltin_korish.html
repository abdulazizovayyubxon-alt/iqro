ligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy portlash zarba to'lqini 2 soniya ichida qancha masofani bosib o'tadi?","options":{"A":"500 metr","B":"1 km","C":"2 km","D":"3 km"},"answer":"B","explanation":"Zarba to'lqinining tezligi: 2 soniya ichida 1 km, 5 soniya ichida 2 km, 8 soniya ichida 3 km masofani bosib o'tadi.","source":"11-sinf §53, 154-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":708,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — elektromagnit impulsi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yadroviy portlashdagi elektromagnit impuls qanday ta'sir ko'rsatadi?","options":{"A":"Insonlarning ko'rish va eshitish organlariga ta'sir etadi","B":"Antennalar, kabellar va elektr tarmoqlarida yuqori kuchlanishli tok hosil bo'ladi","C":"Harakatlanayotgan texnikaning dvigatelini to'xtatadi","D":"Radioaktiv chang zarrachalari keng hududga tarqaladi"},"answer":"B","explanation":"Elektromagnit impulsi yadroviy zaryadlar portlashi natijasida havoningionlashishi oqibatida yuzaga keladi. Chaqmoq singari tarqalib, antennalarda, kabellarda, elektr uzatish tarmoqlarida yuqori kuchlanishga ega tok hosil qiladi.","source":"11-sinf §53, 155-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":709,"soha":"5. Fuqaro muhofazasi","subtopic":"Yadroviy qurol — gamma-nurlar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Gamma-nurlar qanday tezlikda va qaysi yo'nalishda tarqaladi?","options":{"A":"Tovush tezligida, barcha yo'nalishlarda","B":"Yorug'lik tezligida to'g'ri chiziq bo'ylab","C":"O'zgaruvchan tezlikda, magnit maydoni ta'sirida burilib","D":"Sekin va to'lqinsimon harakatda"},"answer":"B","explanation":"Gamma-nurlar nur energiyasining ayrim fotonlari oqimidan iborat bo'lib, to'g'ri chiziq bo'ylab yorug'lik tezligida (300 000 km/soniya) tarqaladi.","source":"11-sinf §53, 155-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":710,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — ta'sir etish yo'li","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Kimyoviy zaharlovchi moddalar inson organizmiga qanday yo'llar bilan kirishi mumkin?","options":{"A":"Nafas olish yo'llari orqali","B":"Teri yuzasi orqali","C":"Havo, teri, kiyim, oziq yoki suv","D":"Oziq-ovqat va suv orqali"},"answer":"C","explanation":"Kimyoviy zaharlovchi moddalar inson organizmiga: zaharlangan havodan nafas olganda, ko'zi, terisi va kiyim-boshiga zaharlovchi modda tushganda, shuningdek, zaharlangan oziq-ovqat yoki suv iste'mol qilganda kirishi mumkin.","source":"11-sinf §54, 156-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":711,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — asab falajlovchi moddalar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Asablarni falajlash ta'siriga ega zaharlovchi moddalarga qaysilar kiradi?","options":{"A":"Iprit, azotli ipritlar, lyuizit","B":"Fosgen, difosgen","C":"Zarin, zoman, V-gazlari","D":"Sianid kislota, xlorsian"},"answer":"C","explanation":"Asablarni falajlash ta'siriga ega zaharlovchi moddalar: zarin, zoman, V-gazlari. Iprit va lyuizit — teridayara hosil qiluvchi; fosgen — bo'g'uvchi; sianid kislota — umumiy zaharlash ta'siriga ega.","source":"11-sinf §54, 156-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":712,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — teridayara moddalar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Teridayara paydo qilish ta'siriga ega zaharlovchi moddalarga qaysilar kiradi?","options":{"A":"Zarin, zoman, V-gazlari","B":"Iprit, azotli ipritlar, lyuizit","C":"Fosgen, difosgen","D":"DLK (lizergin kislotasi), BZ"},"answer":"B","explanation":"Teridayara paydo qilish ta'siriga ega zaharlovchi moddalar: iprit, azotli ipritlar, lyuizit. Ular teriga tushganda yaralar hosil qiladi.","source":"11-sinf §54, 156-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":713,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — bo'g'uvchi moddalar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Bo'g'uvchi ta'sirga ega zaharlovchi moddalarga qaysilar kiradi?","options":{"A":"Sianid kislota, xlorsian","B":"Adamsit, difenilxlorarsin","C":"Fosgen, difosgen","D":"DLK, BZ"},"answer":"C","explanation":"Bo'g'uvchi ta'sirga ega zaharlovchi moddalar: fosgen va difosgen. Sianid kislota va xlorsian — umumiy zaharlash ta'siriga ega; adamsit — ta'sirlash xususiyatiga ega.","source":"11-sinf §54, 156-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":714,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — psixokimyoviy moddalar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Psixokimyoviy ta'sirga ega zaharlovchi moddalar qanday guruhga kiradi va misollari qaysilar?","options":{"A":"O'ldiruvchi guruh: iprit va lyuizit","B":"Vaqtincha safdan chiqaruvchi guruh: DLK va BZ","C":"Bo'g'uvchi guruh: fosgen va difosgen","D":"O'ldiruvchi guruh: sianid kislota va xlorsian"},"answer":"B","explanation":"Psixokimyoviy ta'sirga ega zaharlovchi moddalar (DLK — lizergin kislotasining dietilamidi, BZ — Bi-zet) vaqtincha safdan chiqaruvchi guruhga kiradi. Ular qo'llanilganda harbiy qo'shinlarning ish faoliyati pasayadi.","source":"11-sinf §54, 156-157-bet","source_file":"053_oqq_yadro_kimyo_bio.json","_unrep":false},{"id":715,"soha":"5. Fuqaro muhofazasi","subtopic":"Kimyoviy qurol — natijaga ko'ra guruhlash","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Zaharlovchi moddalar ta'sir qilish natijasiga ko'ra qanday ikki guruhga bo'linadi?","options":{"A":"Kimyoviy va biologik guruhlar","B":"Harbiy va fuqarol res_image":false,"question":"Gripp, COVID-19, sil va qizamiq kasalliklari asosan qanday yo'l bilan yuqadi?","options":{"A":"Qon orqali","B":"Fekal-oral yo'l bilan","C":"Havo-tomchi yo'li bilan","D":"Vektorlar (hasharotlar) orqali"},"answer":"C","explanation":"Gripp, COVID-19, sil va qizamiq havo-tomchi yo'li bilan yuqadi — kasallangan odamning yo'tal, aksa va nafas orqali tarqaladi.","source":"11-sinf §40, 114-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":729,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar — fekal-oral yo'l","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Fekal-oral yo'l (ifloslangan suv va oziq-ovqat) orqali qaysi kasalliklar yuqadi?","options":{"A":"OITS, gepatit B va C","B":"Bezgak (malyariya), leyshmanioz","C":"Gijja kasalliklari, vabo, gepatit A","D":"Gripp, COVID-19, sil"},"answer":"C","explanation":"Fekal-oral yo'l — ifloslangan suv va oziq-ovqat mahsulotlari orqali: gijja kasalliklari, vabo, gepatit A yuqadi. OITS va gepatit B/C qon orqali, bezgak hasharotlar orqali yuqadi.","source":"11-sinf §40, 114-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":730,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar — vektorlar orqali","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Vektorlar (hasharotlar) orqali qaysi kasalliklar yuqadi?","options":{"A":"Gripp, qizamiq va sil","B":"Vabo, gijja va gepatit A","C":"Bezgak, leyshmanioz, borellioz","D":"OITS, gepatit B va C"},"answer":"C","explanation":"Vektorlar (hasharotlar) orqali: bezgak (malyariya), leyshmanioz, borellioz yuqadi. Bularga asosan chivin, so'na va kana kabi hasharotlar sabab bo'ladi.","source":"11-sinf §40, 114-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":731,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar — oldini olish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yuqumli kasalliklarning oldini olishda emlash (vaksinatsiya) qanday ahamiyat kasb etadi?","options":{"A":"Emlash faqat bolalarga tegishli, kattalar vaksinatsiyaga muhtoj emas","B":"Qizamiq, poliomiyelit, gepatit, sil, COVID-19 kabi kasalliklardan himoya qiladi","C":"Emlash faqat bir kasallikdan himoya qiladi, boshqa kasalliklarga ta'siri yo'q","D":"Emlash kasallikdan keyin ham bir xil samara beradi, barcha yoshda bir xil"},"answer":"B","explanation":"Emlash (vaksinatsiya) qizamiq, poliomiyelit, gepatit, sil, COVID-19 kabi kasalliklardan himoyalanishda muhim ahamiyatga ega — bu kasalliklarning oldini olishning asosiy usuli.","source":"11-sinf §40, 115-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":732,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — ta'rifi va xususiyatlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Is gazi qanday kimyoviy modda va u qanday hosil bo'ladi?","options":{"A":"Azot oksidi (NO2), to'liq yonish jarayonida hosil bo'ladi","B":"Uglerod oksidi (CO), chala yonish jarayonida hosil bo'ladi","C":"Oltingugurt dioksidi (SO2), yoqilg'i yonganda hosil bo'ladi","D":"Karbonat angidrid (CO2), nafas olish jarayonida hosil bo'ladi"},"answer":"B","explanation":"Is gazi — uglerod oksidi (CO), rangsiz, hidsiz va ta'msiz bo'lib, chala yonish jarayonida hosil bo'ladi.","source":"11-sinf §41, 116-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":733,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — organizmga ta'siri","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Is gazi organizmga qanday ta'sir ko'rsatadi?","options":{"A":"To'g'ridan-to'g'ri o'pka to'qimalarini yo'q qiladi, nafas olishni to'xtatadi","B":"Gemoglobin bilan bog'lanib, qonning kislorod tashish qobiliyatini kamaytiradi","C":"Jigar hujayralarini falajlaydi va qon ivishini to'xtatadi","D":"Markaziy asab tizimiga to'g'ridan-to'g'ri zahar ta'sir ko'rsatadi"},"answer":"B","explanation":"Is gazi nafas yo'llari orqali organizmga kirib, gemoglobin bilan bog'lanadi — bu qonning kislorod tashish qobiliyatini kamaytiradi va gipoksiya (kislorod yetishmovchiligi)ga olib keladi.","source":"11-sinf §41, 116-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":734,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — zaharlanishda birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Is gazidan zaharlanish sodir bo'lganda birinchi navbatda qanday harakat qilish kerak?","options":{"A":"Zaharlanuvchiga darhol antibiotiklarni ichirish","B":"Eshik va derazalarni yopib, jabrlanuvchini issiq joyda saqlash","C":"Jabrlanuvchini tezda xavfli hududdan toza havoga olib chiqish, gaz manbayini o'chirish","D":"Zaharlanuvchiga ko'p sut ichirish va qo'llarini sovuq suvga solish"},"answer":"C","explanation":"Is gazidan zaharlanishda: 1) Jabrlanuvchini tezda toza havoga olib chiqing; 2) Eshik va derazalarni oching, gaz manbayini (gaz plitasi, pech) o'chiring; 3) Nafas olishini tekshiring.","source":"11-sinf §41, 117-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":735,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — hushsiz holatda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Is gazidan zaharlanib, hushsiz bo'lib nafas olayotgan jabrlanuvchini qanday holatda saqlash kerak?","options":{"A":"Chalqancha yotqizib, oyoqlarini ko'tarib ushlab turish","B":"Yonboshlat","C":"O'tqazib, boshi oldinga egilgan holda saqlash","D":"To'g'ri chalqancha yotqizib, boshini olga surib qo'yish"},"answer":"B","explanation":"Hushsiz bo'lib, nafas olayotgan bo'lsa, jabrlanuvchini yonboshlating — bu nafas yo'llari to'silmasligini ta'minlaydi. Agar nafas olmasa, sun'iy nafas va yurak massajini boshlash kerak.","source":"11-sinf §41, 117-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":736,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — sun'iy nafas nisbati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Nafas olmayotgan jabrlanuvchiga sun'iy nafas berishda yurak massaji va sun'iy nafas nisbati qanday bo'lishi kerak?","options":{"A":"Har 10 massajdan keyin 1 marta sun'iy nafas","B":"Har 15 massajdan keyin 1 marta sun'iy nafas","C":"Har 30 massajdan keyin 2 marta sun'iy nafas","D":"Har 50 massajdan keyin 3 marta sun'iy nafas"},"answer":"C","explanation":"Nafas olmayotgan jabrlanuvchiga: har 30 ta yurak massajidan keyin 2 marta sun'iy nafas beriladi (30:2 nisbati).","source":"11-sinf §41, 117-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":737,"soha":"6. Tibbiy bilim asoslari","subtopic":"Is gazi — oldini olish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Is gazidan zaharlanishning oldini olish uchun qanday choralar ko'rish kerak?","options":{"A":"Ko'cha tartibini tuzatish va harakatni boshqarish","B":"Gaz uskunalarini tekshirish, detektor o'rnatish, ventilyatsiyani ta'minlash","C":"Uyda faqat elektr plita ishlatish va gaz tarmog'ini o'chirish","D":"Kiyim va shaxsiy himoya vositalaridan foydalanish"},"answer":"B","explanation":"Is gazidan zaharlanishning oldini olish: gazli pechlarni nazoratsiz qoldirmaslik; gazni sezuvchi detektor o'rnatish; gaz uskunalarini muntazam tekshirish va tozalash; uyda yaxshi ventilyatsiya tizimini ta'minlash.","source":"11-sinf §41, 117-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":738,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ovqat zaharlanishi — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Ovqatdan zaharlanish belgilari odatda zaharlanishdan necha soat o'tgach paydo bo'ladi?","options":{"A":"5 daqiqadan 1 soat ichida","B":"2–12 soat ichida","C":"24–48 soat o'tgach","D":"3–7 kun o'tgach"},"answer":"B","explanation":"Ovqatdan zaharlanish belgilari zaharlanishdan keyingi 2–12 soat ichida paydo bo'ladi: ko'ngil aynishi, qayt qilish, ich ketishi, qorin og'rig'i, isitma, holsizlik.","source":"11-sinf §41, 118-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":739,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ovqat zaharlanishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ovqatdan zaharlanish sodir bo'lganda qachon darhol shifokor chaqirish kerak?","options":{"A":"Qusish bir soatdan ortiq davom etgan taqdirda","B":"Bolalar yoki keksalarda og'ir simptomlar, isitma >38,5°C, qonli ich ketishi","C":"Ko'ngil aynishi va bosh og'rig'i kuzatilganda","D":"Har qanday holda shifokor chaqirish shart emas, evda davolash mumkin"},"answer":"B","explanation":"Darhol shifokor chaqirish kerak: bolalar yoki keksalarda og'ir simptomlar; isitma 38,5°C dan yuqori; qonli ich ketishi; qusish va ich ketishi 6–8 soatdan ko'p davom etsa; es-hushini yo'qotish yoki suvsizlanish belgilari kuzatilganda.","source":"11-sinf §41, 118-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":740,"soha":"6. Tibbiy bilim asoslari","subtopic":"Texnik suyuqlik zaharlanishi — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Texnik suyuqlik (antifriz, akkumulyator suyuqligi) bilan zaharlanishda birinchi yordam qanday ko'rsatiladi?","options":{"A":"Zaharlanuvchiga ko'p sut yoki suv ichirish va zudlik bilan tibbiy yordam chaqirish","B":"Zaharlanuvchini uxlatib, ertasiga shifokorga olib borish","C":"Oshqozonga tuz suvi ichirish va qayt qilishiga imkon berish","D":"Zaharlanuvchini issiq hovuzga solib isitish"},"answer":"A","explanation":"Texnik suyuqlik zaharlanishida: ko'p miqdorda suv yoki sut ichirish tavsiya etiladi (faqat shifokor tavsiyasi asosida), bu moddaning ta'sirini kamaytirishi mumkin. Darhol tibbiy yordam chaqiriladi.","source":"11-sinf §41, 119-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":741,"soha":"6. Tibbiy bilim asoslari","subtopic":"Zaharlanish — organizmga tushish yo'llari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Organizmga zahar qanday 4 yo'l bilan tushishi mumkin?","options":{"A":"Ko'z, burun, quloq va og'iz orqali","B":"Nafas yo'llari, teri, ichak va parenteral yo'li","C":"Nafas olish yo'llari va teri orqali","D":"Ovqat, ichimlik va suv orqali"},"answer":"B","explanation":"Organizmga zahar 4 usulda tushadi: 1) Nafas yo'llari orqali; 2) Teri orqali; 3) Ichak orqali; 4) Parenteral yo'l bilan (tibbiy muolajalar vaqtida).","source":"11-sinf §41, 116-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":742,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ilon chaqqanda — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Zaharli ilon chaqqanda qanday belgilar kuzatiladi?","options":{"A":"Chaqqan joyda kichik shish va yengil qizarish","B":"Qattiq og'riq, uvishish, zaharlanish tarqaladi, nafas va puls tezlashadi","C":"Bosh og'rig'i va yengil ko'ngil aynishi","D":"Tana harorati keskin pasayishi va mushak tortishishi"},"answer":"B","explanation":"Ilon chaqqanda: qattiq og'riq, uvishish; jarohat joyi qizaradi, kengayadi, so'ng chetlari ko'karadi; nafas olishi 24–27, yurak urishi 92–96 martagacha tezlashadi; qon bosimi tushadi; og'iz quriydi, boshi aylanadi.","source":"11-sinf §42, 120-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":743,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ilon chaqqanda — taqiqlangan harakatlar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Zaharli ilon chaqqanda qanday harakatlar QATTIYAN MAN ETILADI?","options":{"A":"Tez tibbiy yordamni (103) chaqirish","B":"Jabrlanuvchini yotqizib, tinchlantirish","C":"Zaharni so'rib chiqarish va turniket bog'lash","D":"Ko'proq suyuqlik (suv, choy) ichirish"},"answer":"C","explanation":"Ilon chaqqanda TAQIQLANADI: zaharni so'rib chiqarish (og'iz orqali zahar tanaga o'tishi mumkin); turniket bog'lash (to'qimalar nekroziga olib kelishi mumkin); sovuq kompres qo'yish. Faqat yengil bosuvchi bog'lam bilan immobilizatsiya qilish mumkin.","source":"11-sinf §42, 121-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":744,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ilon chaqqanda — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Zaharli ilon chaqqanda birinchi yordam ko'rsatishda qanday harakatlar to'g'ri?","options":{"A":"Jarohatlangan a'zoni turniket bilan qattiq bog'lab, zaharni so'rib chiqarish","B":"Jabrlanuvchini yotqizib, harakatini kamaytirib, 103 chaqirish va suyuqlik ichirish","C":"Jarohatlangan joyga sovuq kompres qo'yib, kasalxonaga olib borish","D":"Ilon zahri tarqalmasligi uchun jarohatlangan joyni kesib qon chiqarish"},"answer":"B","explanation":"Ilon chaqqanda to'g'ri harakatlar: 103 chaqirish; jabrlanuvchini yotqizib, tinchlantirish; harakatini minimal darajaga tushirish (harakat zahar tarqalishini tezlashtiradi); hushida bo'lsa ko'proq suyuqlik ichirish; yengil bosuvchi bog'lam va immobilizatsiya qilish.","source":"11-sinf §42, 121-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":745,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ilon chaqqanda — nima uchun harakat cheklash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Ilon chaqqanida jabrlanuvchining harakati nima uchun minimal darajaga tushirilishi kerak?","options":{"A":"Harakat og'riqni kuchaytiradi va jabrlanuvchiga psixologik zarar yetkazadi","B":"Harakat qon aylanishini tezlashtirib, zahar tarqalishini kuchaytiradi","C":"Harakat yara yopilishini qiyinlashtiradi","D":"Harakat zaharli ilon yana hujum qilishiga sabab bo'lishi mumkin"},"answer":"B","explanation":"Ilon zahri tezda qon orqali tarqaladi. Harakat qon aylanishini tezlashtirib, zaharning tarqalishini kuchaytiradi — shu sababli harakatni minimal darajaga tushirish zarur.","source":"11-sinf §42, 121-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":746,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qoraqurt — belgilari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qoraqurt chaqqandan so'ng necha daqiqadan so'ng og'riq kuchli sezila boshlaydi va qanday xarakter kasb etadi?","options":{"A":"Darhol (1 daqiqa ichida), faqat chaqqan joyda","B":"5–30 daqiqadan so'ng muskullarda kuchli og'riq, belga va qoringa o'tadi","C":"2–3 soat o'tgach, asta-sekin shakllanadigan og'riq","D":"24 soat o'tgach, tana harorati ko'tarilishi bilan birga og'riq"},"answer":"B","explanation":"Qoraqurt chaqqanda: mahalliy belgilar ko'pincha kuchsiz bo'ladi. 5–30 daqiqadan so'ng muskullarda juda kuchli og'riq seziladi, uvishadi; og'riq belga va qoringa o'tadi.","source":"11-sinf §42, 121-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":747,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qoraqurt — birinchi yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qoraqurt chaqqanda birinchi yordam ko'rsatish tartibi qanday?","options":{"A":"Qoraqurt chaqqan joyni issiq suv bilan yuvib, issiq kompres qo'yish","B":"Chaqqan joyni sovuq suv bilan yuvish, sovuq kompres qo'yish, antigistamin dori berish, shifoxonaga murojaat","C":"Zaharlangan joyni keserak qon chiqarish va yarani toza mato bilan bog'lash","D":"Faqat antigistamin dori berib, uyda o'ziga kelishini kutish"},"answer":"B","explanation":"Qoraqurt chaqqanda: 1) Chaqqan joyni sovuq suv/sovunli suvda yuvish; 2) Sovuq kompres qo'yish (10–15 daqiqa, mato ustidan); 3) Antigistamin dori berish; 4) Qurtning qismi qolgan bo'lsa ehtiyotkorlik bilan olib tashlash; 5) Zudlik bilan shifoxonaga murojaat qilish.","source":"11-sinf §42, 122-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":748,"soha":"6. Tibbiy bilim asoslari","subtopic":"Chayon chaqqanda — xavf guruh","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Chayon chaqqanda ayniqsa qaysi toifadagi odamlar uchun eng xavfli?","options":{"A":"Kuchli jismoniy tuzilishli yosh erkaklar","B":"Bolalar, keksalar va allergiyasi bor insonlar","C":"Kasalliklardan so'ng zaiflab qolgan bemorlar","D":"Temir tanqisligi kasalligi bo'lganlar"},"answer":"B","explanation":"Chayon chaqishi bolalar, keksalar va allergiyasi bor insonlar uchun ayniqsa xavfli. Umuman olganda, ko'pchilikda yengil reaksiya keltirib chiqarsa-da, bu guruhlar uchun jiddiy xavf tug'diradi.","source":"11-sinf §42, 122-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":749,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yuqumli kasalliklar — epidemiologik nazorat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Epidemiologik nazorat va profilaktika choralariga quyidagilardan qaysi biri kirmaydi?","options":{"A":"Bemorlarni erta aniqlash va izolyatsiya qilish","B":"Yuqumli kasalliklar bo'yicha muntazam monitoring o'tkazish","C":"Kasallik belgilari bo'lganlarni shifoxonaga olib bormasdan uyda davolash","D":"Dezinfeksiya va sanitariya choralarini kuchaytirish"},"answer":"C","explanation":"Epidemiologik nazorat va profilaktikaga kiradi: bemorlarni erta aniqlash va izolyatsiya qilish; muntazam monitoring; dezinfeksiya va sanitariya choralarini kuchaytirish. Belgilari bo'lgan bemorlarni uyda qoldirib davolash — bu profilaktika chorasi EMAS, aksincha tarqalishga sabab bo'lishi mumkin.","source":"11-sinf §40, 115-bet","source_file":"054_yuqumli_zaharlanish.json","_unrep":false},{"id":750,"subtopic":"O'q uzish ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"\"O'q uzish\" deganda nima tushuniladi?","options":{"A":"Gaz energiyasi bilan o'q stvoldan chiqadi","B":"O'qning qo'lda sindirib tashlanishi","C":"Stvolning tozalanishi","D":"O'qdonning to'ldirilishi"},"answer":"A","explanation":"O'q uzish — porox zaryadining yonishi jarayonida hosil bo'luvchi gazlar energiyasi ta'sirida o'q (granata)ning stvol kanalidan otilib chiqishi.","mnemonic":"O'q uzish = porox gazlari → o'qni otib chiqaradi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":751,"subtopic":"O'q uzish vaqti","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"O'q uzish hodisasi qancha vaqt oralig'ida sodir bo'ladi?","options":{"A":"0,001-0,06 soniya","B":"1-2 soniya","C":"3,2-4,2 soniya","D":"10 soniya"},"answer":"A","explanation":"O'q uzish juda qisqa vaqt — 0,001-0,06 soniya oralig'ida sodir bo'ladi.","mnemonic":"O'q uzish — juda qisqa (0,001-0,06 s).","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":752,"subtopic":"O'q uzish bosqichlari soni","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"O'q uzishda ketma-ket keladigan necha bosqich farqlanadi?","options":{"A":"To'rt bosqich","B":"Ikki bosqich","C":"Besh bosqich","D":"Bir bosqich"},"answer":"A","explanation":"O'q uzishda 4 bosqich: dastlabki, birinchi (asosiy), ikkinchi va uchinchi (gazlar ta'siridan keyingi) bosqich.","mnemonic":"O'q uzish — 4 bosqich.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":753,"subtopic":"Bosqichlar ketma-ketligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"O'q uzish bosqichlarining to'g'ri ketma-ketligi qaysi?","options":{"A":"Dastlabki → birinchi → ikkinchi → uchinchi","B":"Birinchi → dastlabki → uchinchi → ikkinchi","C":"Uchinchi → ikkinchi → birinchi → dastlabki","D":"Ikkinchi → birinchi → dastlabki → uchinchi"},"answer":"A","explanation":"To'g'ri tartib: dastlabki (bosim hosil bo'ladi) → birinchi/asosiy (max bosim) → ikkinchi (o'q chiqadi) → uchinchi (gazlar ta'siridan keyingi, max tezlik).","mnemonic":"Dastlabki → asosiy → ikkinchi → uchinchi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":754,"subtopic":"Dastlabki bosqich","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dastlabki bosqichda asosan nima yuz beradi?","options":{"A":"O'qni siljitish uchun gaz bosimi hosil","B":"O'q stvoldan uchib chiqadi","C":"O'q eng katta tezligiga yetadi","D":"Gazlar butunlay tugaydi"},"answer":"A","explanation":"Dastlabki bosqich porox yonishidan boshlanib, o'q qobig'i kesiklarga to'liq urilgunga qadar davom etadi — bu davrda o'qni siljitish uchun zarur gaz bosimi vujudga keltiriladi.","mnemonic":"Dastlabki bosqich — bosim to'planadi, o'q hali turibdi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":755,"subtopic":"Birinchi (asosiy) bosqich","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qaysi bosqichda stvol kanalida gaz bosimi eng katta (maksimal) miqdorga yetadi?","options":{"A":"Birinchi bosqich","B":"Uchinchi bosqich","C":"Dastlabki bosqich oldin","D":"Hech qachon emas"},"answer":"A","explanation":"Birinchi (asosiy) bosqichda — o'q harakati boshlangach porox tez yonadi, gaz bosimi tez ortib eng katta miqdorga yetadi.","mnemonic":"Max bosim — birinchi (asosiy) bosqichda.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":756,"subtopic":"Ikkinchi bosqich — stvol og'zi bosimi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ikkinchi bosqich oxirida (o'q stvoldan chiqayotganda) stvol og'zi bosimi qancha bo'ladi?","options":{"A":"300-900 kg/cm²","B":"10-20 kg/cm²","C":"5000-9000 kg/cm²","D":"Bosim umuman bo'lmaydi"},"answer":"A","explanation":"Ikkinchi bosqichda (porox to'liq yonib bo'lgach, o'q chiqquniga qadar) stvol og'zi bosimi 300-900 kg/cm² ni tashkil etadi.","mnemonic":"Stvol og'zi bosimi — 300-900 kg/cm².","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":757,"subtopic":"Uchinchi bosqich — max tezlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"O'q o'zining eng katta tezligiga qaysi paytda yetadi?","options":{"A":"Uchinchi bosqichda, stvoldan uzoqda","B":"Stvol ichida, dastlabki bosqich","C":"Nishonga teggan paytda","D":"O'q yerga tushgach"},"answer":"A","explanation":"Uchinchi (gazlar ta'siridan keyingi) bosqichda stvoldan 1200-2000 m/s tezlikda oqib chiqayotgan gazlar o'qqa qo'shimcha tezlik beradi — o'q stvol og'zidan bir necha o'n cm uzoqda eng katta tezligiga yetadi.","mnemonic":"Max tezlik — stvoldan tashqarida, uchinchi bosqichda.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":758,"subtopic":"Boshlang'ich tezlik ta'rifi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"O'qning boshlang'ich tezligi (Vo) qayerda o'lchanadigan tezlik?","options":{"A":"Stvol og'iz yaqinidagi o'q tezligi","B":"O'q nishonga teggan paytdagi tezlik","C":"O'q ichidagi harakat tezligi","D":"O'q yerga tushgandagi tezlik"},"answer":"A","explanation":"Boshlang'ich tezlik (Vo) — stvolning og'iz kesimi yaqinida o'qning harakat tezligi (shartli tezlik). U otish jadvallarida va o'qning jangovar tavsifida ko'rsatiladi.","mnemonic":"Vo — stvol og'zidagi tezlik.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":759,"subtopic":"Boshlang'ich tezlik — stvol uzunligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir xil patron ishlatilsa, stvoli uzunroq qurolda o'qning boshlang'ich tezligi qanday bo'ladi?","options":{"A":"Kattaroq — gazlar o'qqa uzoqroq ta'sir qiladi","B":"Kichikroq — uzun stvol o'qni sekinlashtiradi","C":"O'zgarmaydi","D":"Nolga teng bo'ladi"},"answer":"A","explanation":"Stvol qancha uzun bo'lsa, porox gazlari o'qqa shuncha ko'p vaqt ta'sir ko'rsatadi va o'qning tezligi shuncha katta bo'ladi. (Masalan RPK-74 stvoli AK-74 dan uzun → 960 vs 900 m/s.)","mnemonic":"Uzun stvol → ko'proq gaz ta'siri → tezroq o'q.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":760,"subtopic":"Boshlang'ich tezlik — natija","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"O'qning boshlang'ich tezligi oshsa, quyidagilardan qaysi biri SODIR BO'LADI?","options":{"A":"Uchish uzoqligi, to'g'ri otish uzoqligi va teshuvchi ta'sir ortadi","B":"O'qning uchish uzoqligi sezilarli kamayadi","C":"O'qning teshuvchi va shikast ta'siri kamayadi","D":"O'q umuman uchmay, stvol ichida qoladi"},"answer":"A","explanation":"Boshlang'ich tezlik oshganida o'qning uchish uzoqligi, to'g'ri otish uzoqligi, shikast yetkazuvchi va teshuvchi ta'siri ortadi, havoning o'qqa ta'siri esa kamayadi.","mnemonic":"Yuqori Vo → uzoqroq, kuchliroq, aniqroq otish.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":761,"subtopic":"Boshlang'ich tezlikka ta'sir omillari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri o'qning boshlang'ich tezligiga ta'sir QILMAYDI?","options":{"A":"Otuvchining bo'yi","B":"Stvol uzunligi","C":"Porox zaryadi og'irligi va harorati","D":"O'qning og'irligi"},"answer":"A","explanation":"Boshlang'ich tezlik stvol uzunligi, o'q og'irligi, porox zaryadi og'irligi/harorati/namligi, porox zarralari shakli/o'lchami va o'qlash zichligiga bog'liq. Otuvchining bo'yi ta'sir qilmaydi.","mnemonic":"Vo ga ta'sir: stvol, o'q, porox — otuvchi bo'yi emas.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":762,"subtopic":"Porox harorati ta'siri","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Juda sovuq kunda (porox harorati past) otilganda, o'qning boshlang'ich tezligi issiq kunga nisbatan qanday bo'lishi mumkin?","options":{"A":"Pasayishi mumkin","B":"Albatta oshadi","C":"Harorat umuman ta'sir qilmaydi","D":"O'q muzlab qoladi"},"answer":"A","explanation":"Porox harorati boshlang'ich tezlikka ta'sir qiluvchi omillardan biri. Past haroratda porox sekinroq yonib, gaz bosimi va shu bilan Vo pasayishi mumkin — bu otish aniqligiga ta'sir qiladi.","mnemonic":"Sovuq porox → past bosim → past Vo.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":763,"subtopic":"Trayektoriya ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Trayektoriya nima?","options":{"A":"O'q havoda egri chiziq","B":"Stvol ichidagi chiziq","C":"O'qdon shakli","D":"Nishonning rangi"},"answer":"A","explanation":"Trayektoriya — o'q (granata) havoda uchishi jarayonida uning og'irlik markazi hosil qiladigan egri chiziq.","mnemonic":"Trayektoriya = o'qning havodagi egri yo'li.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":764,"subtopic":"Trayektoriyaga ta'sir kuchlari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"O'q havoda uchganda unga qaysi ikki kuch ta'sir qiladi?","options":{"A":"Og'irlik va havoning kuchi","B":"Magnit va elektr kuchi","C":"Yolg'iz og'irlik kuchi","D":"Yolg'iz porox bosimi"},"answer":"A","explanation":"O'qqa ikkita kuch ta'sir qiladi: og'irlik kuchi (o'qni pasaytiradi) va havoning qarshilik kuchi (harakatni sekinlashtiradi va ag'darishga intiladi). Shu sababli trayektoriya egri chiziq bo'ladi.","mnemonic":"Trayektoriya = og'irlik + havo qarshiligi natijasi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":765,"subtopic":"Og'irlik kuchi roli","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Trayektoriyada og'irlik kuchi o'qqa qanday ta'sir qiladi?","options":{"A":"O'qni pastga pasaytiradi","B":"O'qni yuqoriga ko'taradi","C":"O'q tezligini oshiradi","D":"O'qni orqaga qaytaradi"},"answer":"A","explanation":"Og'irlik kuchi o'qni asta-sekin pasayishga majbur qiladi — shuning uchun trayektoriya pastga egiladi.","mnemonic":"Og'irlik kuchi → o'qni pastga tortadi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":766,"subtopic":"Havo qarshiligi sabablari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Havoning qarshilik kuchi qaysi uch asosiy sababga ko'ra vujudga keladi?","options":{"A":"Havoning ishqalanishi, uyurmalar va ballistik to'lqin hosil bo'lishi","B":"Yomg'ir, qor va kuchli shamolning ta'siri tufayli","C":"Issiqlik, sovuq va havo namligi tufayli","D":"Tovush, yorug'lik va magnit maydoni ta'siri"},"answer":"A","explanation":"Havo qarshiligi uch sababga ko'ra: havoning ishqalanishi, uyurmalar hosil bo'lishi va ballistik to'lqin hosil bo'lishi.","mnemonic":"Havo qarshiligi: ishqalanish + uyurma + ballistik to'lqin.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":767,"subtopic":"Ballistik to'lqin","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Ballistik to'lqin qachon vujudga keladi va u o'qqa qanday ta'sir qiladi?","options":{"A":"O'q baland uchganda hosil bo'ib, tezligini pasaytiradi","B":"O'q sekin uchganda hosil bo'ib, tezlikni oshiradi","C":"Faqat suvda hosil bo'ladi","D":"O'qqa hech qanday ta'sir qilmaydi"},"answer":"A","explanation":"O'q ovoz tezligidan baland uchganda ovoz to'lqinlarining urilishidan qattiq zichlangan havo to'lqini — ballistik to'lqin hosil bo'ladi. O'q energiyasining bir qismini shunga sarflagani uchun tezligi pasayadi.","mnemonic":"Tez o'q → ballistik to'lqin → tezlik pasayadi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":768,"subtopic":"Uyurma","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Trayektoriyada \"uyurma\" nima?","options":{"A":"O'q ortidagi havo zarralari","B":"O'q oldidagi yorug'lik","C":"Stvoldagi tutun","D":"Nishondagi teshik"},"answer":"A","explanation":"Uyurma — o'q ortida vujudga kelgan siyrak (kam bosimli) maydonni to'ldirishga harakat qiluvchi havo zarrasi. U havo qarshiligini keltirib chiqaruvchi omillardan biri.","mnemonic":"Uyurma — o'q ortidagi havo girdobi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":769,"subtopic":"Uchish nuqtasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Trayektoriya elementlarida \"uchish nuqtasi\" qayer?","options":{"A":"Qurol stvoli og'zi markazi","B":"O'q yerga tushgan joy","C":"Nishonning markazi","D":"Otuvchining ko'zi"},"answer":"A","explanation":"Uchish nuqtasi — qurol stvoli og'zi (kesimi) markazi. O'q harakati aynan shu nuqtadan boshlanadi.","mnemonic":"Uchish nuqtasi — stvol og'zi (boshlanish).","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":770,"subtopic":"Tushish nuqtasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Tushish nuqtasi\" nimani bildiradi?","options":{"A":"O'q yerga tushgan nuqtasi","B":"O'q uchib chiqqan nuqta","C":"Trayektoriyaning baland nuqtasi","D":"Stvolning og'zi"},"answer":"A","explanation":"Tushish nuqtasi — trayektoriya qurol ufqi bilan kesishgan, ya'ni o'q yerga tushgan nuqta. Uchish nuqtasi esa o'q chiqqan joy.","mnemonic":"Tushish nuqtasi — o'q yerga tushgan joy.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":771,"subtopic":"Qurol ufqi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Qurol ufqi\" nima?","options":{"A":"Uchish nuqtasidan gorizontal tekislik","B":"Nishonga bo'lgan masofa uzunligi","C":"Stvolning umumiy uzunligi","D":"O'qning maksimal balandlik nuqtasi"},"answer":"A","explanation":"Qurol ufqi — uchish nuqtasi orqali o'tuvchi gorizontal tekislik. Bu trayektoriyani o'lchashda asosiy bazaviy yo'nalish (referensiya chizig'i) bo'lib xizmat qiladi.","mnemonic":"Qurol ufqi — gorizontal asos chizig'i.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":772,"subtopic":"Balandlik burchagi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Balandlik burchagi qaysi ikki chiziq orasidagi burchak?","options":{"A":"Balandlik chizig'i va qurol ufqi orasidagi","B":"Irg'itish chizig'i va nishon orasidagi","C":"Stvol va o'qdon orasidagi","D":"Ko'z va mushka orasidagi"},"answer":"A","explanation":"Balandlik burchagi — balandlik chizig'i (nishonga qaratilgan yo'nalish) bilan qurol ufqi orasidagi burchak.","mnemonic":"Balandlik burchagi: nishon yo'nalishi vs gorizont.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":773,"subtopic":"Irg'itish chizig'i","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Irg'itish chizig'i\" nimani bildiradi?","options":{"A":"Stvoldan uchib chiqqan to'g'ri chiziq","B":"O'q yerga tushgan egri chiziq","C":"Nishonning balandlik darajasi","D":"Havo harorati ko'rsatuvchi chiziq"},"answer":"A","explanation":"Irg'itish chizig'i — o'q stvoldan uchib chiqqanida stvol kanalining davomida chizilgan to'g'ri chiziq. Irg'itish burchagi esa shu chiziq bilan qurol ufqi orasidagi burchak.","mnemonic":"Irg'itish chizig'i — stvol kanali davomidagi to'g'ri chiziq.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":774,"subtopic":"Nega bilish kerak","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega har bir o'qchi otishning ichki va tashqi hodisalarini (ballistikani) bilishi kerak?","options":{"A":"Trayektoriya va tezlikni bilish, aniq otish","B":"Faqat imtihon topshirish uchun","C":"Qurolni tezroq tozalash uchun","D":"Bularni bilish shart emas"},"answer":"A","explanation":"O'qchi o'qning trayektoriyasi, tezligi va ularga ta'sir qiluvchi omillarni bilsa, turli masofa va sharoitda to'g'ri mo'ljal olib aniq o't ocha oladi.","mnemonic":"Ballistikani bilish → aniq mo'ljal → aniq otish.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":775,"subtopic":"Trayektoriya shakli tahlili","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega o'qning trayektoriyasi to'g'ri chiziq emas, balki notekis egri chiziq shaklida bo'ladi?","options":{"A":"Og'irlik o'qni pastga tortadi, havo qarshiligi tezlikni pasaytiradi","B":"O'q uchish davomida o'z o'qi atrofida aylangani uchun","C":"Qurol stvoli ichi egri tayyorlangani uchun","D":"Nishon doimo harakatlanib turgani uchun"},"answer":"A","explanation":"Og'irlik kuchi o'qni doimo pastga tortadi, havo qarshiligi esa tezlikni uzluksiz (notekis) sekinlashtiradi. Ikki kuchning birgalikdagi ta'sirida trayektoriya notekis bukilgan egri chiziq bo'ladi.","mnemonic":"Egri trayektoriya = og'irlik + havo qarshiligi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":776,"subtopic":"Stvol og'zi tezligi vs boshlang'ich","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"O'qning stvol og'zi tezligi boshlang'ich tezlikka nisbatan qanday?","options":{"A":"Stvol og'zining tezligi boshlang'ich tezlikdan past","B":"Stvol og'zining tezligi ancha yuqori","C":"Ular har doim teng bo'ladi","D":"Stvol og'zining tezligi nolga teng"},"answer":"A","explanation":"O'q stvol kanalidan uchib chiqayotgan paytdagi (stvol og'zi) tezligi boshlang'ich tezlikdan birmuncha past. Boshlang'ich tezlik — stvol og'zi tezligidan biroz katta, max tezlikdan kichik shartli tezlik.","mnemonic":"Stvol og'zi tezligi < boshlang'ich (Vo) < max tezlik.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":777,"subtopic":"Uchinchi bosqich gaz tezligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Uchinchi bosqichda stvol kanalidan oqib chiquvchi porox gazlarining tezligi qancha?","options":{"A":"1200-2000 m/s","B":"300-900 m/s","C":"100-200 m/s","D":"50 m/s"},"answer":"A","explanation":"Uchinchi bosqichda stvoldan 1200-2000 m/s tezlikda oqib chiquvchi porox gazlari o'qqa qo'shimcha tezlik beradi.","mnemonic":"Uchinchi bosqich gazlari — 1200-2000 m/s.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":778,"subtopic":"Boshlang'ich tezlik ahamiyati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Boshlang'ich tezlik qurolning qanday xossasi hisoblanadi?","options":{"A":"Eng muhim jangovar xossalaridan biri","B":"Ahamiyatsiz texnik ko'rsatkich","C":"Faqat tashqi ko'rinishga oid","D":"Qurol rangiga bog'liq xossa"},"answer":"A","explanation":"Boshlang'ich tezlik qurolning eng muhim jangovar xossalaridan biri — u uchish uzoqligi, aniqlik va teshuvchi ta'sirni belgilaydi, otish jadvallarida ko'rsatiladi.","mnemonic":"Vo — qurolning eng muhim jangovar xossasi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":779,"subtopic":"Havo muhiti ta'siri","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega o'q havoda uchganda energiyasining bir qismini yo'qotadi?","options":{"A":"Havo zich muhit","B":"Havoda umuman qarshilik yo'q","C":"O'q havoda tezlashadi","D":"Havo o'qni itaradi"},"answer":"A","explanation":"Havo mohiyatiga ko'ra zich muhit. O'q shu muhitda harakatlanishda energiyasining bir qismini sarflaydi va natijada qarshilik (ishqalanish, uyurma, ballistik to'lqin) yuzaga keladi.","mnemonic":"Havo zich → o'q energiya sarflaydi → sekinlaydi.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":780,"subtopic":"Bosqich-hodisa moslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"O'q stvol kanalidan uchib chiqqan paytdan to porox gazlarining ta'siri tugagunga qadar\" — bu qaysi bosqich?","options":{"A":"Uchinchi bosqich","B":"Dastlabki bosqich","C":"Birinchi bosqich","D":"Ikkinchi bosqich"},"answer":"A","explanation":"Uchinchi bosqich o'q stvoldan chiqqan paytdan porox gazlarining o'qqa ta'siri tugaguncha davom etadi — bu davrda o'q max tezligiga yetadi.","mnemonic":"O'q chiqgach, gaz ta'siri davom → uchinchi bosqich.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":781,"subtopic":"Porox zaryadi o'zgarishi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Patrondagi porox zaryadi og'irligi o'zgarsa, bu nimaga olib keladi?","options":{"A":"Gazlar miqdori, bosim va o'q tezligi o'zgaradi","B":"Faqat o'q rangi o'zgaradi, boshqa hech narsa o'zgarmaydi","C":"Hech narsaga ta'sir qilmaydi, tizim o'zgarmas qoladi","D":"Stvol uzunligi o'zgaradi, qurol balansi saqlanadi"},"answer":"A","explanation":"Porox zaryadi og'irligining o'zgarishi porox gazlari miqdorining o'zgarishiga, binobarin stvol kanalidagi max bosim va o'qning boshlang'ich tezligi o'zgarishiga olib keladi.","mnemonic":"Ko'p porox → ko'p gaz → katta bosim → yuqori Vo.","source_file":"11s_43-44_ballistika.json","_unrep":false},{"id":782,"subtopic":"Masofani bilish zarurati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Nega o'qchi nishongacha bo'lgan masofani aniqlashi kerak?","options":{"A":"Birinci o'q bilan nishonga urish, ko'zoynakni sozlash","B":"Faqat vaqtni belgilash uchun, boshqa parametrlar befarq","C":"Qurol og'irligini bilish uchun, ammo boshqa o'zgarish yo'q","D":"Patron sonini sanash uchun, ammo otish natijasiga ta'sir qilmaydi"},"answer":"A","explanation":"Masofani bilish nishonni birinchi o'q bilan urish uchun zarur — shamol, harorat, bosimga tuzatishlarni aniqlash, mo'ljallagichni to'g'ri o'rnatish va mo'ljal nuqtasini tanlashga imkon beradi.","mnemonic":"Masofani bil → birinchi o'q bilan ur.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":783,"subtopic":"Eng sodda usul","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yaqin masofani aniqlashning eng sodda usuli qaysi?","options":{"A":"Ko'z bilan chamalab aniqlash","B":"Lazerli o'lchagich yordamida","C":"Sun'iy yo'ldosh orqali","D":"Telefon yordamida"},"answer":"A","explanation":"Yaqin masofani aniqlashning eng sodda va har qanday jangovar sharoitda qo'llaniladigan usuli — ko'z bilan chamalash. Bu muntazam mashq qilishni talab qiladi.","mnemonic":"Eng sodda → ko'z bilan chamalash.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":784,"subtopic":"Etalon masofalar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'z bilan chamalashni o'rganishda avvalo qaysi qisqa masofalar yodda saqlanadi?","options":{"A":"10 m, 50 m va 100 m","B":"1 km, 2 km, 5 km","C":"500 m, 800 m, 1000 m","D":"1 m, 2 m, 3 m"},"answer":"A","explanation":"Avvalo 10 m, 50 m va 100 m kabi qisqa etalon masofalar tasavvur qilinib, ularni har qanday joyda aniq farqlash o'rganiladi; so'ng 200, 400, 800 m ga o'tiladi.","mnemonic":"Etalon: 10 → 50 → 100 m (keyin uzoqroq).","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":785,"subtopic":"Ko'z bilan chamalash mashqi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'z bilan chamalab aniqlangan masofaning to'g'riligini qanday tekshirish mumkin?","options":{"A":"Qadam bilan o'lchash yoki xarita bilan solishtirish","B":"Faqat ko'zni yumib turish, boshqa usul yo'q","C":"Boshqa odamdan so'rash, lekin natija ishonchsiz","D":"Tekshirib bo'lmaydi, tasdiqlash imkonsiz"},"answer":"A","explanation":"Mashq davomida aniqlangan masofaning to'g'riligini qadam bilan o'lchab ko'rish, xarita bilan taqqoslash yoki boshqa usullar bilan tekshirish muhim — shu orqali ko'nikma mustahkamlanadi.","mnemonic":"Tekshir: qadamlab o'lcha yoki xarita bilan.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":786,"subtopic":"Mingdan bir formulasi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Mingdan bir o'lchovida masofani topish formulasi D = (B / U) × 1000. Bunda B nimani bildiradi?","options":{"A":"Predmetning o'lchami","B":"Otuvchi bo'yi","C":"Shamol tezligi","D":"Patron og'irligi"},"answer":"A","explanation":"Formulada B — nishon/predmetning ma'lum bo'lgan chiziqli o'lchami (balandlik, kenglik yoki uzunlik), U — uning ko'rinib turgan burchagi (mingdan bir o'lchovda), D — masofa.","mnemonic":"D = B/U × 1000: B = predmet o'lchami.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":787,"subtopic":"Mingdan bir — hisoblash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Balandligi 6 m bo'lgan simyog'och 10 mingdan bir burchak ostida ko'rinmoqda. Formula D = (B/U)×1000 bo'yicha masofa qancha?","options":{"A":"600 m","B":"60 m","C":"6000 m","D":"166 m"},"answer":"A","explanation":"D = (6 / 10) × 1000 = 600 m. Demak simyog'ochgacha 600 metr.","mnemonic":"D = 6/10×1000 = 600 m.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":788,"subtopic":"Mingdan bir — hisoblash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Kengligi 4 m bo'lgan mashina 8 mingdan bir burchak ostida ko'rinmoqda. Ungacha masofa qancha?","options":{"A":"500 m","B":"320 m","C":"200 m","D":"2000 m"},"answer":"A","explanation":"D = (B/U)×1000 = (4/8)×1000 = 500 m.","mnemonic":"4/8×1000 = 500 m.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":789,"subtopic":"Burchak o'lchagich bog'liqligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Mingdan bir o'lchovida uzoqlik (masofa) va burchak o'lchagich bo'limi o'rtasidagi bog'liqlik qanday?","options":{"A":"Uzoqlik 1000 marta katta","B":"Ular doimo teng","C":"Uzoqlik 100 marta katta","D":"Bog'liqlik yo'q"},"answer":"A","explanation":"Mingdan bir o'lchovida uzoqlik burchak o'lchagich bo'limidan 1000 marta katta, ya'ni burchak o'lchagich bo'limi uzoqlikdan 1000 marta kichik. Shundan formula D=(B/U)×1000 kelib chiqadi.","mnemonic":"Uzoqlik = bo'lim × 1000.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":790,"subtopic":"Simyog'och etaloni","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Masofani chamalashda simyog'ochlardan qanday foydalaniladi?","options":{"A":"Simyog'ochlar orasidagi masofa o'lchov etaloni sifatida ishlatiladi","B":"Ularning balandligiga chiqib atrofga qaraladi","C":"Ular masofadagi asosiy nishon sifatida ishlatiladi","D":"Ular masofa chamalashda umuman ishlatilmaydi"},"answer":"A","explanation":"Simyog'ochlar orasidagi masofa odatda ma'lum bo'ladi, shuning uchun ulardan masofani o'lchashda etalon (o'lchov birligi) sifatida foydalaniladi.","mnemonic":"Simyog'ochlar orasi — masofa etaloni.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":791,"subtopic":"IJ-38 vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik quroli asosan nima uchun mo'ljallangan?","options":{"A":"Sport va dastlabki otish ko'nikmasini shakllantirish uchun","B":"Jang maydonida dushmanni yo'q qilish uchun","C":"Zirhli texnikaga qarshi kurashish uchun","D":"Uzoq masofadagi nishonni otish uchun"},"answer":"A","explanation":"IJ-38 — sport pnevmatik quroli; 10 m masofadan o't otishda dastlabki o'rganuvchilar uchun va ommaviy o't otish maydonchalarida foydalaniladi.","mnemonic":"IJ-38 — sport, 10 m, o'rganuvchilar uchun.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":792,"subtopic":"IJ-38 kalibri","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik qurolining kalibri qancha?","options":{"A":"4,5 mm","B":"5,45 mm","C":"7,62 mm","D":"9 mm"},"answer":"A","explanation":"IJ-38 pnevmatik qurolining kalibri 4,5 mm — bu jangovar qurollardan (5,45/7,62 mm) kichik, sport quroli.","mnemonic":"IJ-38 → 4,5 mm (sport).","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":793,"subtopic":"IJ-38 o'q tezligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik qurolida o'q tezligi (110-130 m/s) jangovar avtomatlarga (900 m/s) nisbatan qanday?","options":{"A":"Ancha past","B":"Ancha yuqori","C":"Bir xil bo'ladi","D":"Tezligi yo'q"},"answer":"A","explanation":"IJ-38 o'q tezligi 110-130 m/s — AK-74 (900 m/s) dan ancha past, chunki u sport-o'quv quroli bo'lib, 10 m kabi qisqa masofaga mo'ljallangan.","mnemonic":"Pnevmatik o'q sekin (110-130 m/s).","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":794,"subtopic":"IJ-38 og'irligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik qurolining og'irligi qancha?","options":{"A":"2,8 kg","B":"3,6 kg","C":"8,2 kg","D":"0,81 kg"},"answer":"A","explanation":"IJ-38 og'irligi 2,8 kg, umumiy uzunligi 1050 mm, stvol uzunligi 450 mm.","mnemonic":"IJ-38 — 2,8 kg.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":795,"subtopic":"Pnevmatik qism aniqlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"IJ-38 da otishdan oldin barmoq qo'yiladigan, tepkini tasodifan bosishdan himoya qiluvchi qism qaysi?","options":{"A":"Himoya","B":"Sharnir","C":"Qo'ndoq","D":"Stvol o'qi"},"answer":"A","explanation":"Tepki himoya halqasi tepkini o'rab turadi va uni tasodifan bosib yuborishdan himoya qiladi (xavfsizlik elementi).","mnemonic":"Tepki himoya halqasi — tasodifan otilishdan saqlaydi.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":796,"subtopic":"Pnevmatik otish — masofa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Pnevmatik quroldan 1-mashqda otish masofasi qancha (stol qirrasidan nishongacha)?","options":{"A":"5 m","B":"25 m","C":"100 m","D":"300 m"},"answer":"A","explanation":"1-mashqda otish masofasi 5 m (stolning oldingi qirrasidan nishongacha), nishon — qora doirali \"P\" nishoni.","mnemonic":"1-mashq — 5 m masofa.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":797,"subtopic":"Pnevmatik otish — holat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Pnevmatik quroldan 1-mashqni bajarishda otish qaysi holatda amalga oshiriladi?","options":{"A":"Turib, stolga tirsakni tiragan holatda","B":"Yotgan holatda","C":"Yugurib turib","D":"O'tirgan holatda orqaga yaslanib"},"answer":"A","explanation":"1-mashqda otish holati — turib, stolga tirsakni tiragan holatda (bu barqarorlikni ta'minlaydi). Otish vaqti chegaralanmagan.","mnemonic":"1-mashq holati — turib, tirsak stolda.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":798,"subtopic":"Pnevmatik baholash — qo'llash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"O'quvchi pnevmatik miltiqda qora doiraga 3 ta tekkizdi. Uning bahosi qanday va a'loga nechta yetmaydi?","options":{"A":"Yaxshi; a'loga 1 ta yetmaydi","B":"A'lo; hammasi joyida to'liq","C":"Qoniqarli; 2 ta yetmaydi","D":"Qoniqarsiz; yetarli emas"},"answer":"A","explanation":"3 ta tekkizish — \"yaxshi\". A'lo uchun 4 ta tekkizish kerak, demak 1 ta tekkizish yetmaydi.","mnemonic":"3 ta = yaxshi; a'loga 1 ta kam.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":799,"subtopic":"Pnevmatik nishon","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Pnevmatik otish 1-mashqida \"P\" nishonining qora doirasi diametri qancha?","options":{"A":"29 mm","B":"100 mm","C":"5 mm","D":"50 mm"},"answer":"A","explanation":"\"P\" shaklidagi nishonning qora doirasi diametri — 29 mm.","mnemonic":"\"P\" nishon qora doira — 29 mm.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":800,"subtopic":"Pnevmatik o'q turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Pnevmatik quroldan otishda qanday o'qlar ishlatiladi?","options":{"A":"\"Diabolo\", \"DTS\"","B":"5,45 mm jangovar patron","C":"RGD-5 granata","D":"PG-7V"},"answer":"A","explanation":"Pnevmatik quroldan otishda \"Diabolo\" va \"DTS\" turidagi maxsus o'qlar (pulya) ishlatiladi.","mnemonic":"Pnevmatik o'q — Diabolo/DTS.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":801,"subtopic":"Avtomatdan o'quv mashqi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ta'lim muassasasida avtomatdan otish o'quv mashqi qanday tashkil etiladi?","options":{"A":"Rahbar boshchiligida, xavfsizlik","B":"O'quvchilar yolg'iz, nazoratsiz","C":"Jangovar patronlar bilan uyda","D":"Hech qanday qoidalar, xavfsizlik yo'q"},"answer":"A","explanation":"Avtomatdan otish o'quv mashqi mashg'ulot rahbari boshchiligida o'quv avtomatlari bilan bajariladi va poligondagi amaliy otishda talab etilgan xavfsizlik qoidalariga to'liq rioya etiladi.","mnemonic":"O'quv mashqi — rahbar + o'quv avtomati + xavfsizlik.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":802,"subtopic":"Pnevmatik xavfsizlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Pnevmatik qurol jamoat tirlarida ham ishlatiladi. Lekin ta'lim muassasasida undan otish o'rgatilganda nimaga e'tibor beriladi?","options":{"A":"Xavfsizlik va otish","B":"Faqat tezlikka","C":"Qurolni sotishga","D":"Hech narsaga"},"answer":"A","explanation":"Pnevmatik quroldan otish o'rgatilganda xavfsizlik qoidalari va to'g'ri otish ko'nikmasi shakllantiriladi — bu jangovar quroldan otishga tayyorgarlik bosqichi.","mnemonic":"Pnevmatik o'qitish → xavfsizlik + ko'nikma.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":803,"subtopic":"Masofa-tuzatish bog'liqligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega masofani aniq bilish shamol va harorat tuzatishlari bilan birga muhim?","options":{"A":"Masofani mo'ljallash, shamol yo'lni tuzatadi","B":"Ular bir-biriga bog'liq emas","C":"Masofa muhim, tuzatishlar keraksiz","D":"Yolg'iz shamol omili muhim"},"answer":"A","explanation":"Masofa mo'ljallagichni to'g'ri o'rnatishga asos bo'ladi; shamol, harorat va bosim tuzatishlari ham masofaga bog'liq holda kiritilib, o'qning nishonga aniq borishini ta'minlaydi.","mnemonic":"Masofa → mo'ljal + tuzatishlar → aniq otish.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":804,"subtopic":"Bosqichma-bosqich mashq","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'z bilan chamalashni o'rganishda qisqa masofalar (10-100 m) o'zlashtirilgach, keyin nima qilinadi?","options":{"A":"200‑800 m uzoq masofalarga o'tiladi","B":"Mashq to'xtatiladi","C":"Faqat 5 m bilan mashq qilinadi","D":"Masofa umuman o'lchanmaydi"},"answer":"A","explanation":"Qisqa masofalar o'zlashtirilgach, bosqichma-bosqich 200, 400, 800 m kabi uzoq masofalarga o'tiladi; mashqlar o'qotar qurolning ta'sirli masofasigacha davom ettiriladi.","mnemonic":"Avval qisqa (10-100), keyin uzoq (200-800 m).","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":805,"subtopic":"Pnevmatik o'q soni","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Pnevmatik 1-mashqda o'rganish va sinov uchun nechtadan o'q beriladi?","options":{"A":"3 ta o'rganish uchun, 5 ta sinov uchun","B":"10 ta o'rganish, 10 ta sinov","C":"1 ta o'rganish, 1 ta sinov","D":"Cheksiz"},"answer":"A","explanation":"1-mashqda o'rganish (mashq) uchun 3 ta, sinov (baholash) uchun 5 ta o'q beriladi.","mnemonic":"Pnevmatik 1-mashq: 3 mashq + 5 sinov o'q.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":806,"subtopic":"Ko'z bilan chamalash — sharoit","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega ko'z bilan chamalashni yilning barcha fasllarida va kunning turli vaqtlarida mashq qilish tavsiya etiladi?","options":{"A":"Yorug'lik, ob-havo va manzara masofa idrokiga ta'sir qiladi","B":"Faqat yoz faslida masofani aniq chamalash mumkin","C":"Fasllar masofa idrokiga umuman ta'sir qilmaydi","D":"Masofa faqat kechasi to'g'ri chamalanadi"},"answer":"A","explanation":"Yorug'lik darajasi, ob-havo (tuman, yog'in) va manzara masofaning ko'z bilan idrokiga ta'sir qiladi. Turli fasl va vaqtda mashq qilish o'qchini har qanday sharoitda aniq chamalashga o'rgatadi.","mnemonic":"Turli sharoitda mashq → har vaziyatda aniq chamalash.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":807,"subtopic":"Pnevmatik-jangovar bog'liqligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega o'quvchilar avval pnevmatik quroldan (jangovar emas) otishni o'rganadi?","options":{"A":"Pnevmatik qurol xavfsizroq va arzonroq","B":"Pnevmatik qurol jangovardan kuchliroq","C":"Pnevmatik qurol uzoqroqqa otadi","D":"Hech qanday sababi yo'q"},"answer":"A","explanation":"Pnevmatik qurol (past o'q tezligi, kichik kalibr) xavfsizroq va arzonroq. U o'quvchiga nishonga olish, nafasni boshqarish, tepkini bosish kabi asosiy ko'nikmalarni xavfsiz sharoitda beradi, so'ng jangovar otishga o'tiladi.","mnemonic":"Pnevmatik = xavfsiz mashq → keyin jangovar.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":808,"subtopic":"Stvol uzunligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik qurolining stvol uzunligi qancha?","options":{"A":"450 mm","B":"1050 mm","C":"658 mm","D":"100 mm"},"answer":"A","explanation":"IJ-38 stvol uzunligi 450 mm, umumiy uzunligi esa 1050 mm.","mnemonic":"IJ-38 stvol — 450 mm.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":809,"subtopic":"Masofa — birinchi o'q","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Jangda nega aynan \"birinchi o'q bilan urish\" uchun masofani aniq bilish ta'kidlanadi?","options":{"A":"Birinchi aniq o'q dushmanni ogohlantirmay yakson qiladi","B":"Jangda birinchi o'q deyarli har doim xato ketadi","C":"Masofani bilish faqat ikkinchi o'q uchun zarur","D":"Jangda birinchi o'qning hech qanday ahamiyati yo'q"},"answer":"A","explanation":"Jangda birinchi aniq o'q hal qiluvchi — u dushmanni ortiqcha ogohlantirmasdan yo'q qiladi. Masofa noto'g'ri aniqlansa, mo'ljallagich xato o'rnatilib, o'q nishondan baland yoki past o'tib ketadi.","mnemonic":"Aniq masofa → aniq birinchi o'q.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":810,"subtopic":"Pnevmatik umumiy uzunligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"IJ-38 pnevmatik qurolining umumiy uzunligi qancha?","options":{"A":"1050 mm","B":"450 mm","C":"1155 mm","D":"940 mm"},"answer":"A","explanation":"IJ-38 umumiy uzunligi 1050 mm (stvol uzunligi 450 mm).","mnemonic":"IJ-38 umumiy uzunlik — 1050 mm.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":811,"subtopic":"Mingdan bir — teskari hisoblash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Balandligi 3 m bo'lgan nishon 6 mingdan bir burchak ostida ko'rinmoqda. Ungacha masofa qancha?","options":{"A":"500 m","B":"300 m","C":"1800 m","D":"50 m"},"answer":"A","explanation":"D = (B/U)×1000 = (3/6)×1000 = 500 m.","mnemonic":"3/6×1000 = 500 m.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false},{"id":812,"subtopic":"Otish holati barqarorligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega pnevmatik 1-mashqda tirsakni stolga tiragan holatda otiladi?","options":{"A":"Tayanch qurolni barqaror ushlab, qo'l titrashini kamaytiradi","B":"Bu holatda ancha tezroq o't ochish imkonini beradi","C":"Qurol juda og'ir bo'lgani uchun majburiy chora","D":"Faqat tashqi ko'rinish va bezak maqsadida qilinadi"},"answer":"A","explanation":"Tirsakni stolga tirash qurolga qo'shimcha tayanch beradi, qo'l titrashini kamaytiradi va nishonga barqaror mo'ljal olishga — natijada aniqroq otishga imkon yaratadi.","mnemonic":"Tirsak tayanch → barqaror → aniq otish.","source_file":"11s_45-49_masofa_pnevmatik.json","_unrep":false}];
let fmode="hammasi", shown=0; const PAGE=20;
const list=document.getElementById("list");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fdata(){
 if(fmode==="hammasi")return DATA;
 if(fmode==="unrep")return DATA.filter(q=>q._unrep);
 return DATA.filter(q=>(q.difficulty||"")===fmode);
}
function render(reset){ if(reset){list.innerHTML="";shown=0;}
 const d=fdata(); const slice=d.slice(shown,shown+PAGE); shown+=slice.length;
 for(const q of slice){ const c=document.createElement("div"); c.className="card";
  let opts=""; for(const k of ["A","B","C","D"]) opts+='<div class="opt '+(k===q.answer?"ok":"")+'">'+k+") "+esc(q.options[k])+"</div>";
  c.innerHTML='<span class="idtag">id '+q.id+'</span>'
   +'<div class="src">📖 '+esc(q.source_file||"")+(q.subtopic?" · "+esc(q.subtopic):"")+"</div>"
   +'<div><span class="tag">'+esc(q.difficulty||"")+'</span><span class="tag">'+esc(q.cognitive||"")+'</span>'+(q._unrep?'<span class="tag unrep">ta\'mirlanmagan</span>':'')+"</div>"
   +'<div class="q">'+esc(q.question)+"</div>"+opts
   +'<div class="exp">💡 '+esc(q.explanation||"")+"</div>"
   +(q.mnemonic?'<div class="mn">🧠 '+esc(q.mnemonic)+"</div>":"");
  list.appendChild(c);}
 document.getElementById("more").style.display = shown>=d.length?"none":"block";
 const unrep=DATA.filter(q=>q._unrep).length;
 document.getElementById("meta").textContent="Jami: "+DATA.length+" ta | Ta'mirlanmagan (cue-leak): "+unrep+" | Ko'rsatilmoqda: "+shown+" / "+d.length;
}
const modes=[["hammasi","Hammasi"],["Y1","Y1"],["Y2","Y2"],["Y3","Y3"],["unrep","Ta'mirlanmagan"]];
const flt=document.getElementById("flt");
modes.forEach(([m,lbl],i)=>{const b=document.createElement("button");
 const cnt=m==="hammasi"?DATA.length:(m==="unrep"?DATA.filter(q=>q._unrep).length:DATA.filter(q=>(q.difficulty||"")===m).length);
 b.textContent=lbl+" ("+cnt+")";if(i===0)b.className="act";
 b.onclick=()=>{document.querySelectorAll("#flt button").forEach(x=>x.classList.remove("act"));b.classList.add("act");fmode=m;render(true);};flt.appendChild(b);});
document.getElementById("more").onclick=()=>render(false);
render(true);
</script></body></html>
