biy bloklarida faol ishtirok etish","B":"NATO bilan sheriklik munosabatlari o'rnatish","C":"Harbiy-siyosiy bloklarda qatnashmaslik","D":"Yangi mintaqaviy harbiy blok tuzish"},"answer":"C","explanation":"Mudofaa siyosatining asosiy prinsiplaridan biri — 'Harbiy-siyosiy bloklarda qatnashmaslik.' Bu O'zbekistonning neytral-tinchliksevar pozitsiyasidir.","mnemonic":"O'zbekiston = bloklarsiz","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":344,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — QK rahbarlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Harbiy mashqda o'quvchi 'QK tezkor rahbarlikni kim amalga oshiradi?' degan savolga javob berishi kerak. To'g'ri javob qaysi?","options":{"A":"Mudofaa vaziri","B":"QK bosh shtabi boshlig'i","C":"Prezident","D":"Milliy Xavfsizlik Kengashi raisi"},"answer":"B","explanation":"QK oldiga qo'yilgan vazifalarni bajarish yuzasidan tezkor rahbarlikni Qurolli Kuchlar Bosh shtabining boshlig'i amalga oshiradi.","mnemonic":"Tezkor rahbarlik → Bosh shtab boshlig'i","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":345,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — urush davrida vazirlik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Urush davrida O'zbekiston Respublikasi Mudofaa vaziri qo'shimcha ravishda qanday lavozimni egallaydi?","options":{"A":"Qurolli Kuchlar Oliy Bosh Qo'mondoni","B":"Xavfsizlik Kengashi raisi","C":"Kuchlar Oliy Bosh Qo'mondoni o'rinbosari","D":"Bosh shtab boshlig'i"},"answer":"C","explanation":"Urush davrida Mudofaa vaziri bir paytning o'zida QK Oliy Bosh Qo'mondoni o'rinbosari hisoblanadi. Oliy Bosh Qo'mondoni esa Prezident bo'lib qoladi.","mnemonic":"Urush → Mudofaa vaziri = Oliy Bosh Q-ning o'RINBOSARI","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":346,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — QK ta'rifi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"O'quvchiga 'Qurolli Kuchlar nima?' degan savol berildi. To'g'ri ta'rif qaysi?","options":{"A":"Mudofaa vazirligi tarkibidagi qo'shinlar majmuasi","B":"Harbiy birlashma, qo'shilma, qismlar va boshqa tuzilmalar","C":"Politsiya va chegara qo'shinlari majmuasi","D":"Muddatli harbiy xizmatchilar yig'indisi"},"answer":"B","explanation":"QK — urushlarni qaytarish va oldini olish uchun davlat tomonidan tashkil etilgan harbiy birlashma, qo'shilma va qismlar, shuningdek, boshqa harbiy tuzilmalarni o'z ichiga oladi.","mnemonic":"QK = harbiy birlashma + qo'shilma + qism + boshqa harbiy tuzilmalar","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":347,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — QK maqsadi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Qurolli Kuchlar asosan qaysi maqsadlar uchun tashkil etilgan va saqlab turiladi?","options":{"A":"Urushni qaytarish, milliy manfaatlar va hududiy yaxlitlikni himoya qilish uchun","B":"Faqat davlat chegarasini qo'riqlash uchun","C":"Fuqarolarni tabiiy ofatdan himoya qilish uchun","D":"Faqat xalqaro operatsiyalarda ishtirok etish uchun"},"answer":"B","explanation":"QK urushlar va qurolli mojarolarni qaytarish va oldini olish, milliy manfaatlarni, suverenitetni, hududiy yaxlitlikni va aholining tinch hayotini himoya qilish uchun tuzilgan.","mnemonic":"QK maqsadi: QAYTARISH + MILLIY manfaat + SUVERENITET + HUDUDIY yaxlitlik","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":348,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — QK faoliyat prinsiplari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Qurolli Kuchlar o'z faoliyatini qanday asosiy tamoyillar bo'yicha amalga oshiradi? To'liq va to'g'ri javobni toping.","options":{"A":"Demokratiya, oshkoralik, .json","_unrep":false},{"id":425,"soha":"1. Harbiy xizmat asoslari","subtopic":"Mudofaa doktrinasi — hududiy tezkor jihozlash","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Tinchlik davrida harbiy infratuzilma bo'yicha QK ning vazifalari qanday?","options":{"A":"Harbiy infratuzilmani qurmasdan, faqat mavjudini saqlab turish","B":"Mamlakat hududini tezlik bilan jihozlash va infratuzilmani rivojlantirish","C":"Harbiy infratuzilmani xorijiy investitsiyalar bilan rivojlantirish","D":"Faqat urush davri uchun yer osti bunkerlari qurish"},"answer":"B","explanation":"Tinchlik davri: mamlakat hududini tezlik bilan jihozlashga va harbiy infratuzilmani rivojlantirishga doir tadbirlarni o'tkazish.","mnemonic":"Tinchlikda: hududni tezlik bilan JIHOZLASH + infratuzilmani RIVOJLANTIRISH","source":"10-sinf §19, 63-bet","source_file":"042_mudofaa_doktrina.json","_unrep":false},{"id":426,"soha":"1. Harbiy xizmat asoslari","subtopic":"Mudofaa doktrinasi — Mudofaa qonun va doktrina farqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"'Mudofaa to'g'risida'gi Qonun va Mudofaa Doktrinasi orasidagi asosiy farq nima?","options":{"A":"Qonun qadimiyroq hujjat, doktrina esa undan keyin qabul qilingan","B":"Qonun mudofaaning huquqiy asoslarini, Doktrina harbiy xavfsizlik prinsiplarini belgilaydi","C":"Qonun harbiy texnikaga, doktrina esa qo'shinga bag'ishlangan","D":"Farqi yo'q, ikkalasi ham bir xil maqsadda qabul qilingan"},"answer":"B","explanation":"Qonun (2001): mudofaani tashkil etishning va QK boshqarishning HUQUQIY asoslarini belgilaydi. Doktrina (2018): HARBIY SOHADA milliy xavfsizlikni ta'minlashga doir PRINSIPLAR va YONDASHUVLARNI belgilaydi.","mnemonic":"Qonun = HUQUQIY ASOS; Doktrina = PRINSIPLAR va YONDASHUVLAR","source":"10-sinf §16, 53-55-bet","source_file":"042_mudofaa_doktrina.json","_unrep":false},{"id":427,"soha":"1. Harbiy xizmat asoslari","subtopic":"Mudofaa doktrinasi — hududiy mudofaa shayligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Tinchlik davrida hududiy mudofaa va fuqaro muhofazasi tizimlari bo'yicha QK ning vazifasi nima?","options":{"A":"Bu tizimlarni faqat urush davri kelganda faollashtirish","B":"Ularni belgilangan muddatlarda yoyish va vazifalarni bajarishga shay saqlash","C":"Ularni tugatib, butunlay zamonaviy tizimlar bilan almashtirish","D":"Ularni faqat Toshkent shahri hududida tashkil qilish"},"answer":"B","explanation":"Tinchlik davri: 'hududiy mudofaa va fuqaro muhofazasi tizimlarini belgilangan muddatlarda yoyishga hamda tegishli vazifalarni samarali bajarishga shay holda saqlab turish.'","mnemonic":"Hududiy mudofaa + fuqaro muhofazasi: SHAY + SAMARALI holatda","source":"10-sinf §19, 63-bet","source_file":"042_mudofaa_doktrina.json","_unrep":false},{"id":428,"soha":"1. Harbiy xizmat asoslari","subtopic":"Mudofaa doktrinasi — rejalashtirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Tinchlik davrida QK foydalanishni rejalashtirishda qanday omillar hisobga olinadi?","options":{"A":"Faqat harbiy byudjet miqdori, boshqa omillar e'tiborga olinmaydi","B":"Harbiy-siyosiy vaziyat va davlatning iqtisodiy imkoniyatlari","C":"Faqat xalqaro tashkilotlar talablari, ichki omillar ko'zda tutilmaydi","D":"Qo'shni davlatlarning harbiy kuchlari, lekin boshqa omillar e'tiborsiz"},"answer":"B","explanation":"Tinchlik davri: 'yuzaga kelayotgan harbiy-siyosiy vaziyatga va davlatning iqtisodiy imkoniyatlariga muvofiq, QK dan foydalanishni batafsil va holatga monand rejalashtirish.'","mnemonic":"Rejalashtirish: HARBIY-SIYOSIY vaziyat + IQTISODIY imkoniyat","source":"10-sinf §19, 63-bet","source_file":"042_mudofaa_doktrina.json","_unrep":false},{"id":429,"soha":"1. Harbiy xizmat asoslari","subtopic":"Mudofaa doktrinasi — tezkor va jangovar tayyorgarlik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Tinchlik davrida QK boshqaruv organlari va qo'shinlarning tezkor hamda jangovar tayyorgarlik rejalarini nima qiladi?","options":{"A":"Faqat tayyorlaydi, lekin bajarmaydi","B":"Tashkil etadi hamda bajaradi","C":"Oliy Majlisga taqdim etadi","D":"BMT Xavfsizlik Kengashiga yuboradi"},"answer":"B","explanation":"Tinchlik davri: 'boshqaruv organlari va qo'shinlarning tezkor hamda jangovar tayyorgarlik rejalarini tashkil etish hamda bajarish.'","mnemonic":"Tezkor/jangovar reja: TASHKIL ET + BAJAR","source":"10-sinf §19, 63-bet","source_file":"042_mudofaa_doktrina.json","_unrep":false},{"id":430,"soha":"1. Harbiy xizmat asoslari","subtopic":"QK tarkibi — umumiy tarkib","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekiston Respublikasi Qurolli Kuchlari tarkibiga quyidagilardan qaysilari kiradi?","options":{"A":"Mudofaa vazirligi qo'shinlari, boshqa birliklar kirmaydi","B":"Mudofaa vazirligi, IIV, FVV, Milliy gvardiya, DXX, boshqa vazirlik va idoralar","C":"Mudofaa vazirligi va Milliy gvardiyaning o'zi","D":"Mudofaa vazirligi, Sog'liqni saqlash vazirligi va Favqulodda vaziyatlar vazirligi"},"answer":"B","explanation":"QK tarkibiga: Mudofaa, Ichki ishlar, Favqulodda vaziyatlar vazirliklari, Milliy gvardiya, Davlat xavfsizlik xizmati, boshqa vazirlik va idoralarning tegishli boshqaruv organlari, qo'shinlari, harbiy tuzilma va muassasalari kiradi.","mnemonic":"QK tarkib: MUD + IIV + FVV + MILLIY GVARDIYA + DXX + boshqalar","source":"10-sinf §19, 63-bet","source_file":"043_qurolli_kuchlar.json","_unrep":false},{"id":431,"soha":"1. Harbiy xizmat asoslari","subtopic":"QK tarkibi — quruqlikdagi qo'shinlar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zR Qurolli Kuchlarining quruqlikdagi asosiy tarkibiy qismlari qaysilar?","options":{"A":"Quruqlikdagi, harbiy-havo, havo mudofaasi va maxsus qo'shinlar","B":"Faqat motoo'qchi va tank qo'shinlaridan iborat","C":"Quruqlikdagi qo'shinlar va harbiy dengiz flotiliyasi","D":"Mudofaa, chegara va ichki qo'shinlardan tashkil topgan"},"answer":"A","explanation":"O'zR QK quruqlikdagi qo'shinlar, harbiy-havo kuchlari aqo taqiqlanadi","B":"Faqat mudofaa organlarining ruxsati bilan amalga oshiriladi","C":"Yo'l qo'yiladi","D":"Faqat sudning qaroriga ko'ra amalga oshiriladi"},"answer":"C","explanation":"18 yoshga to'lgan va yoshi 18 dan oshgan chaqiriluvchilarning harbiy ro'yxatda turish joyini o'zgartirishiga Prezidenting navbatdagi chaqiruv to'g'risidagi qarori e'lon qilinguniga qadar yo'l qo'yiladi.","mnemonic":"18 yosh → chaqiruv qaroriga qadar ro'yxat joyi O'ZGARTIRISH mumkin","source":"10-sinf §8, 31-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":461,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — qasamyod sadoqat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Vatanga qasamyod matnida harbiy xizmatchi 'Vatanimning mustaqilligini, uning sarhadlarini' himoya qilish bilan birga yana nimani himoya qilishga va'da beradi?","options":{"A":"Davlat mulkini va iqtisodiy manfaatlarni","B":"Ona xalqining tinchligi va milliy manfaatlarini","C":"Xalqaro shartnomalar va BMT qarorlarini","D":"Harbiy texnikani va qurolni"},"answer":"B","explanation":"Qasamyodda: 'Vatanimning mustaqilligini, uning sarhadlarini, ona xalqimning tinchligi va osoyishtaligini, milliy manfaatlarini so'nggi nafasimgacha himoya qilishga.'","mnemonic":"Qasamyod: mustaqillik + SARHADLAR + tinchlik + osoyishtlik + MILLIY MANFAAT so'nggi nafas","source":"10-sinf §4, 22-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":462,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — qasamyod kurash","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Vatanga qasamyodda harbiy xizmatchi nimalarga qarshi 'ayovsiz kurashishga' va'da beradi?","options":{"A":"Harbiy tartibbuzarliklarga qarshi","B":"O'zbekistonga qarshi har qanday tajovuzga","C":"Faqat xorijiy dushmanlarga qarshi","D":"Terrorchilik va giyohvandlikka qarshi"},"answer":"B","explanation":"Qasamyodda: 'O'zbekiston Respublikasiga qarshi qaratilgan har qanday tajovuz va g'arazli harakatlarga qarshi ayovsiz kurashishga.'","mnemonic":"Kurash: har qanday TAJOVUZ + G'ARAZLI HARAKAT'larga qarshi AYOVSIZ","source":"10-sinf §4, 22-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":463,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — qasamyod qonun","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Vatanga qasamyodda harbiy xizmatchi qanday hujjatlarga qat'iy amal qilishga va'da beradi?","options":{"A":"Faqat harbiy nizomlarga","B":"O'zR Konstitutsiyasiga, qonunlari va umumharbiy nizomlarga","C":"Mudofaa vazirligining buyruqlariga va qo'mondon ko'rsatmalariga","D":"BMT Ustaviga va xalqaro huquq normalariga"},"answer":"B","explanation":"Qasamyodda: 'O'zbekiston Respublikasi Konstitutsiyasiga, qonunlari va umumharbiy nizomlarga qat'iy amal qilishga, davlat va harbiy sirlarni saqlashga.'","mnemonic":"Qasamyod qonun: KONSTITUTSIYA + QONUNLAR + NIZOMLAR + SIRLAR saqlash","source":"10-sinf §4, 22-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":464,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — qasamyod matn kim qabul qiladi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Vatanga qasamyod qachon va kim tomonidan qabul qilinadi?","options":{"A":"Harbiy ta'lim muassasasiga o'qishga kirish paytida o'qituvchi oldida","B":"Harbiy xizmatga chaqirilgan fuqarolar davlat bayrog'i oldida","C":"Muddatli harbiy xizmat tugagach, rezervga o'tishda","D":"Kontrakt imzolash vaqtida Mudofaa vazirining oldida"},"answer":"B","explanation":"Harbiy xizmatga birinchi marta chaqirilgan yoki ixtiyoriy ravishda (kontrakt bo'yicha) kirgan fuqarolar O'zR davlat bayrog'i oldida qasamyod qabul qiladilar.","mnemonic":"Qasamyod: BIRINCHI MARTA + DAVLAT BAYROG'I oldida","source":"10-sinf §4, 22-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":465,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — unvon turlari boshlang'ich","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Harbiy unvon qanday ikki turda berilishi mumkin?","options":{"A":"Muvaqqat va doimiy","B":"Boshlang'ich va navbatdagi","C":"Shaxsiy va unvonli","D":"Qo'shin va kema"},"answer":"B","explanation":"Harbiy unvon boshlang'ich yoki navbatdagi bo'lishi mumkin.","mnemonic":"Unvon turi: BOSHLANG'ICH + NAVBATDAGI","source":"10-sinf §6, 27-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":466,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — iste'fodag unvon","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Harbiy xizmatdan iste'foga chiqqan mayor Rustamovga harbiy safardagi hujjatlarda unvon qanday yoziladi?","options":{"A":"Sobiq mayor","B":"Harbiy mayor","C":"Iste'fodagi mayor","D":"Rezervdagi mayor"},"answer":"C","explanation":"Iste'fodagi shaxslarning harbiy unvoniga 'iste'fodagi' so'zi qo'shiladi. Rezervdagi — 'rezervdagi', zaxiradagi — 'zaxiradagi'.","mnemonic":"Iste'fo = 'ISTE'FODAGI' + unvon (rezerv = 'REZERVDAGI')","source":"10-sinf §6, 27-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":467,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — serjant unvoni qo'shin nomi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Serjant tarkibidagi harbiy xizmatchilar unvoniga qo'shin turi yoki xizmat nomi qo'shilganmi?","options":{"A":"Ha, har doim qo'shiladi","B":"Faqat artilleriya va dengiz qo'shinlarida qo'shiladi","C":"Yo'q, qo'shilmaydi","D":"Faqat ofitserlik unvoniga o'tishda qo'shiladi"},"answer":"C","explanation":"Serjant (starshina)larning harbiy unvonlariga qo'shin turi yoki xizmatning nomi qo'shilmaydi. Bu faqat ofitserlar (tibbiy va yuridik) uchun qo'llaniladi.","mnemonic":"Serjant unvoniga = qo'shin nomi QUSHILMAYDI","source":"10-sinf §6, 27-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":468,"soha" ..' qonunining 8-bo'limi nimaga bag'ishlangan?","options":{"A":"Harbiy ro'yxatga olish masalalariga bag'ishlangan","B":"Safarbarlik bo'yicha chaqirilish va harbiy xizmatdan bo'shatish","C":"Yakunlovchi qoidalar va o'tish davriga bag'ishlangan","D":"Muqobil xizmatni o'tash masalalariga bag'ishlangan"},"answer":"B","explanation":"Qonunning 8-bo'limi: 'Safarbarlik bo'yicha chaqirilish to'g'risida va harbiy xizmatdan bo'shatish'.","mnemonic":"8-bo'lim = SAFARBARLIK chaqiruv + BO'SHATISH","source":"10-sinf §4, 21-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":474,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — harbiy ro'yxat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"'Umumharbiy majburiyat...' qonunining 7-bo'limi nimaga bag'ishlangan?","options":{"A":"Muqobil xizmat","B":"Harbiy xizmatni o'tash","C":"Harbiy ro'yxat","D":"Safarbarlik"},"answer":"C","explanation":"Qonunning 7-bo'limi: 'Harbiy ro'yxat'. Harbiy ro'yxatga olish va undan chiqarish masalalarini tartibga soladi.","mnemonic":"7-bo'lim = HARBIY RO'YXAT","source":"10-sinf §4, 21-bet","source_file":"044_harbiy_xizmat_tartibi.json","_unrep":false},{"id":475,"soha":"1. Harbiy xizmat asoslari","subtopic":"Harbiy xizmat tartibi — kontrakt muddati 5 yosh chegarasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Mayor Yusupovning harbiy xizmatda bo'lish yoshining chegarasiga 3 yil qolganda u yangi kontrakt imzolayapti. Kontrakt qancha muddatga tuziladi?","options":{"A":"Majburiy ravishda 5 yilga","B":"5 yildan kamroq, yosh chegarasigacha","C":"Umrbod xizmat asosida","D":"Mudofaa vazirligi o'zi belgilaydi"},"answer":"B","explanation":"Kontrakt bo'yicha harbiy xizmatchilar bilan yangi kontrakt besh yilga tuziladi; agar harbiy xizmatda bo'lish yoshining chegarasiga yetishiga besh yildan kam qolgan bo'lsa, kamroq muddatga tuziladi.","mnemonic":"Yosh chegarasiga 5 yildan KAM qolsa → kontraktni qisqaroq muddatga tuzish mumkin","s ":"5. Fuqaro muhofazasi","subtopic":"FM vazifalari — evakuatsiya","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"FM vazifalari orasida aholini va boyliklarni xavfsiz joyga olib chiqishga oid vazifa qanday?","options":{"A":"Zararlangan hududlarga tibbiy guruhlar va dori-darmon yuborish","B":"Aholini, moddiy va madaniy boyliklarni xavfsiz joylarga evakuatsiya qilish","C":"FV hududlarida jamoat tartibini saqlab turish va provokatsiyalarning oldini olish","D":"Favqulodda vaziyat rayonlariga ixtisoslashtirilgan qutqaruv guruhlarini jo'natish"},"answer":"B","explanation":"FM vazifalari: aholini, moddiy va madaniy boyliklarni xavfsiz joylarga evakuatsiya qilish.","mnemonic":"FM evakuatsiya: AHOLI + moddiy va madaniy BOYLIKLAR -> XAVFSIZ joylar","source":"10-sinf §20, 67-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":501,"soha":"5. Fuqaro muhofazasi","subtopic":"FM vazifalari — radiatsion nazorat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"FM vazifalari ichida radiatsion, kimyoviy va biologik xavflarni kuzatishga oid vazifa qaysi?","options":{"A":"Harbiy texnika va qurollarning texnik holatini muntazam tekshirish va nazorat qilish","B":"Radiatsion, kimyoviy va biologik vaziyat ustidan kuzatish va laboratoriya nazoratini olib borish","C":"Chegara zonalari va harbiy ob'ektlar atrofida maxsus monitoring o'tkazish","D":"Davlat chegaralari yaqinidagi aholini tartibli ravishda ro'yxatdan o'tkazish"},"answer":"B","explanation":"FM vazifalari: radiatsion, kimyoviy va biologik vaziyat ustidan kuzatish va laboratoriya nazoratini olib borish.","mnemonic":"RKB: Radiatsion + Kimyoviy + Biologik -> KUZATISH + LABORATORIYA","source":"10-sinf §20, 67-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":502,"soha":"5. Fuqaro muhofazasi","subtopic":"FM vazifalari — boshqaruv tizimi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"FM vazifalari ichida aloqa va boshqaruvga oid vazifa qanday ifodalangan?","options":{"A":"Qurolli kuchlar shtabi bilan doimiy kriptografik aloqani ta'minlash","B":"Boshqaruv, xabar berish va aloqa tizimlarini tashkil qilish, rivojlantirish va doimiy shay holatda saqlab turish","C":"Fuqaro muhofazasi xodimlari uchun ish haqi va taqdirlash tizimini tartibga solish","D":"Mahalliy hokimlik va vazirliklar o'rtasida hujjat almashinuv tartibini joriy etish"},"answer":"B","explanation":"FM vazifalari: boshqaruv, xabar berish va aloqa tizimlarini tashkil qilish, rivojlantirish va doimiy shay holatda saqlab turish.","mnemonic":"FM aloqa: BOSHQARUV + XABAR BERISH + ALOQA tizimi -> shay holatda","source":"10-sinf §20, 67-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":503,"soha":"5. Fuqaro muhofazasi","subtopic":"FM vazifalari — tartib saqlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"FM vazifalari orasida zararlangan hududlardagi ijtimoiy tartibga oid vazifa qaysi?","options":{"A":"Harbiy qo'shinlarni zarar ko'rgan hududlardan xavfsiz joyga uyushqoqlik bilan ko'chirish","B":"Harbiy harakatlar oqibatida zarar ko'rgan hududlarda jamoat tartibini yo'lga qo'yish va saqlab turish","C":"FV hududlarida kechki soat cheklovlarini belgilash va rioya etilishini nazorat qilish","D":"Ozod qilingan hududlarda harbiy-fuqaro boshqaruvini tiklash va tashkil etish"},"answer":"B","explanation":"FM vazifalari: harbiy harakatlar olib borish vaqtida yoki shu harakatlar oqibatida zarar ko'rgan hududlarda jamoat tartibini yo'lga qo'yish va saqlab turish.","mnemonic":"Zarar ko'rgan hudud -> JAMOAT TARTIB yo'lga qo'yish + saqlash","source":"10-sinf §20, 67-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":504,"soha":"5. Fuqaro muhofazasi","subtopic":"FV turlari — texnogen","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Texnogen xususiyatli favqulodda vaziyatlar nima?","options":{"A":"Zilzila, sel, suv toshqini kabi tabiiy hodisalar sabab bo'lgan vaziyatlar","B":"Insonlarning ishlab chiqarish yoki xo'jalik faoliyati bilan bog'liq halokat","C":"Ekologik ifloslanish natijasida yuzaga kelgan vaziyatlar","D":"Harbiy harakatlar oqibatida kelib chiqqan vaziyatlar"},"answer":"B","explanation":"Texnogen xususiyatli FV - insonlarning ishlab chiqarish yoki xo'jalik faoliyati bilan bog'liq bo'lgan halokat (avariya)lar.","mnemonic":"Texnogen = INSONLAR faoliyati + ISHLAB CHIQARISH + halokat","source":"10-sinf §21, 69-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":505,"soha":"5. Fuqaro muhofazasi","subtopic":"FV turlari — texnogen avariya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sementxona yaqinidagi kimyoviy zavod portladi va zaharli moddalar hududga tarqaldi. Bu qanday turdagi FV?","options":{"A":"Tabiiy xususiyatli","B":"Ekologik xususiyatli","C":"Texnogen xususiyatli","D":"Biologik xususiyatli"},"answer":"C","explanation":"Kimyoviy xavfli obyektlardagi avariyalar texnogen xususiyatli FV turiga kiradi — zaharli moddalarning avariya holatida otilib chiqishi.","mnemonic":"Kimyoviy zavod avariya -> TEXNOGEN (kimyoviy xavfli obyekt)","source":"10-sinf §21, 70-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":506,"soha":"5. Fuqaro muhofazasi","subtopic":"FV turlari — epizootiya","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Viloyatda hayvonlarning ommaviy kasallanishi yoki nobud bo'lishi kuzatildi. Bu qanday hodisa?","options":{"A":"Epidemiya","B":"Epizootiya","C":"Epifitotiya","D":"Pandemiya"},"answer":"B","explanation":"Epizootiya - hayvonlarning ommaviy kasallanishi yoki nobud bo'lishi. Epidemiya - odamlarning, epifitotiya - o'simliklarning ommaviy nobud bo'lishi.","mnemonic":"Epi-ZOO-tiya = HAYVONLAR (zoo); epi-FITO-tiya = O'SIMLIK (phyto); EPIDEMIYA = ODAMLAR","source":"10-sinf §21, 72-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":507,"soha":"5. Fuqaro muhofazasi","subtopic":"FV turlari — epidemiya ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Epidemiya nima va qachon e'lon qilinadi?","options":{"A":"Bir aholi punktida 10 kishi va undan ortiq kasallanishi","B":"Bir aholi punktida 50 kishi va undan ortiq kasallanishi","C":"Butun mamlakat miqyosida keng tarqalgan kasallik","D":"Faqat bolalar orasida kuzatiladigan kasallik"},"answer":"B","explanation":"Epidemiya: alohida xavfli infeksiyalarga tegishli bo'lmagan, yuqish manbai bitta yoki yuqish omili bir xil bo'lgan odamlarning guruh bo'lib yuqumli kasallanishi (bir aholi punktida 50 kishi va undan ortiq).","mnemonic":"Epidemiya = bir punktda 50+ KISHI, bir xil manba/omil","source":"10-sinf §21, 72-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":508,"soha":"5. Fuqaro muhofazasi","subtopic":"FV xabar berish — signal","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Aholiga FV haqida xabar berishda ishlatiladigan asosiy shartli signal qanday nomlanadi?","options":{"A":"Xatar signali","B":"Diqqat hammaga signali","C":"Evakuatsiya signali","D":"Tashqariga chiqma signali"},"answer":"B","explanation":"Aholiga xabar berish shartli 'Diqqat hammaga!' signali (ruporlar, elektrosirenalar, ovoz chiqaruvchi karnay vositalar va boshqa usullar) orqali yetkaziladi.","mnemonic":"Asosiy signal: DIQQAT HAMMAGA!","source":"10-sinf §22, 74-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":509,"soha":"5. Fuqaro muhofazasi","subtopic":"FV xabar berish — vositalar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Diqqat hammaga signali qanday vositalar orqali uzatiladi?","options":{"A":"Radio va televideniye orqali","B":"Ruporlar, elektrosirenalar, karnaylar orqali","C":"Mobil telefonlarga SMS orqali","D":"Internet tarmoqlari orqali"},"answer":"B","explanation":"Diqqat hammaga signali ruporlar, elektrosirenalar, ovoz chiqaruvchi karnay vositalar va boshqa usullardan foydalaniladi.","mnemonic":"Signal vositalari: RUPOR + SIRENA + KARNAY + boshqalar","source":"10-sinf §22, 74-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":510,"soha":"5. Fuqaro muhofazasi","subtopic":"FV xabar berish — harakat tartibi A","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Diqqat hammaga signalini eshitgandan so'ng aholi birinchi navbatda nima qilishi kerak?","options":{"A":"Darhol evakuatsiya punktiga borish","B":"Televideniye, radiokanallar va internetni kuzatish","C":"Gazniqob kiyish, xavfsizlik choralarini ko'rish","D":"Panohgohga yashirinish, xavfsiz joyga o'tish"},"answer":"B","explanation":"Xabar bo'yicha harakat tartibi: ogohlantirish signalidan so'ng televideniye, radiokanallar va internet tarmoqlarni kuzatish.","mnemonic":"Signal -> Avval TV + RADIO + INTERNET kuzatish","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":511,"soha":"5. Fuqaro muhofazasi","subtopic":"FV xabar berish — harakat tartibi B","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"FV paytida mutaxassislar ko'rsatmalariga muvofiq qanday kayfiyatda harakat qilish kerak?","options":{"A":"Tezroq qaror qabul qilish uchun xavotir bilan harakat qilish","B":"Ko'rsatma va tavsiyalariga muvofiq, xavotirga tushmasdan tinch holda","C":"Faqat maxsus ma'lumot kelguncha kutish, boshqa harakat qilmaslik","D":"Mustaqil ravishda barcha qarorlarni qabul qilish"},"answer":"B","explanation":"Harakat tartibi: mutaxassislar tomonidan berilgan ko'rsatma va tavsiyalariga muvofiq xavotirga tushmay, tinchlikni saqlagan holda harakat qilish.","mnemonic":"FV harakat: xavotirSIZ + TINCHlikni saqlash + ko'rsatmalarga MUVOFIQ","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":512,"soha":"5. Fuqaro muhofazasi","subtopic":"FV xabar berish — aholi xabardorlik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Aholiga xabar berish deganda nimani tushunish kerak?","options":{"A":"Harbiy holat e'lon qilinishi munosabati bilan fuqarolarni yig'ilish joyiga chaqirish","B":"Sodir bo'lishi mumkin bo'lgan FV yoki yuz bergan avariyalar to'g'risida ogohlantirish signali orqali xabar berish","C":"Harbiy chaqiruv va safarbarlik tartib-qoidalari haqida fuqarolarni ma'muriy yo'l bilan xabardor qilish","D":"Aholi markazlarida doimiy kuzatuv punktlarini tashkil etib, axborot to'plash"},"answer":"B","explanation":"Aholiga xabar berish - sodir bo'lishi mumkin bo'lgan zilzila, suv bosishi yoki boshqa tabiiy ofatlar, yuz bergan avariya, halokatlar to'g'risida ogohlantirish signali orqali xabar berish.","mnemonic":"Xabar berish = OGOHLANTIRISH signali orqali FV to'g'risida","source":"10-sinf §22, 74-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":513,"soha":"5. Fuqaro muhofazasi","subtopic":"Evakuatsiya — ta'rif","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Aholi evakuatsiyasi nima?","options":{"A":"Aholini maxsus kasb-hunarga o'rgatish, tayyorlash","B":"FV joyidan aholini olib chiqib, xavfsiz hududlarga joylashtirish","C":"Tibbiy yordam ko'rsatish tadbirlari, favqulodda vaziyatda","D":"Aholini harbiy xizmatga tayyorlash, mudofaa tayyorligi"},"answer":"B","explanation":"Aholi evakuatsiyasi - FV yuz bergan joydan aholini olib chiqib ketish va oldindan tayyorlab qo'yilgan hamda hayotiy faoliyat sharoitlari yaratilgan xavfsiz hududlarga ularni joylashtirish bo'yicha o'tkaziladigan tadbirlar majmui.","mnemonic":"Evakuatsiya = FV joydan OLib CHIQ + XAVFSIZ hudud + JOYLASHTIRISH","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":514,"soha":"5. Fuqaro muhofazasi","subtopic":"Evakuatsiya — usullari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Evakuatsiya qanday usullarda o'tkazilishi mumkin?","options":{"A":"Transport vositalarining o'zida","B":"Transportda, piyoda yoki aralash usullarda","C":"Yo'l yurib, piyoda tartibda","D":"Dengiz va daryo transportida"},"answer":"B","explanation":"Evakuatsiya transportda, piyoda yoki aralash usullarda o'tkazilishi mumkin.","mnemonic":"Evakuatsiya usuli: TRANSPORT + PIYODA + ARALASH","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":515,"soha":"5. Fuqaro muhofazasi","subtopic":"Evakuatsiya — turlari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Evakuatsiyaning qaysi turi maqsadga ko'ra to'g'ri ko'rsatilgan?","options":{"A":"Shoshilinch va rejalashtirilgan turlar","B":"Rejalashtirilgan va shoshilinch; umumiy, qisman; lokal","C":"Umumiy va qisman turlar","D":"Avvaldan rejalashtirilgan va umumiy turlar"},"answer":"B","explanation":"Evakuatsiyaning turlari: avvaldan rejalashtirilgan va shoshilinch; umumiy va qisman; lokal, mahalliy va hududiy.","mnemonic":"Evakuatsiya turlari: REJA/SHOSHILINCH + UMUMIY/QISMAN + LOKAL/MAHALLIY/HUDUDIY","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":516,"soha":"5. Fuqaro muhofazasi","subtopic":"Evakuatsiya — tamoyillar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Evakuatsiya qanday tamoyillar asosida amalga oshiriladi?","options":{"A":"Harbiy va fuqarolik tamoyili","B":"Hududiy va ishlab chiqarish tamoyili","C":"Shoshilinch va rejalashtirilgan tamoyil","D":"Individual va guruhiy tamoyil"},"answer":"B","explanation":"Evakuatsiya hududiy, ishlab chiqarish va ishlab chiqarish-hududiy tamoyili asosida amalga oshiriladi.","mnemonic":"Evakuatsiya tamoyili: HUDUDIY + ISHLAB CHIQARISH + ISHLAB CHIQARISH-HUDUDIY","source":"10-sinf §22, 75-bet","source_file":"045_fv_ta'rif_vazifalari.json","_unrep":false},{"id":517,"soha":"5. Fuqaro muhofazasi","subtopic":"Evakuatsiya — hududiy tamoyil","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Qaysi holatda hududiy tamoyil asosida evakuatsiya amalga oshiriladi?","options":{"A":"Tashkilot xodimlari ishlab chiqarish bo'yicha ko'chirilganda","B":"Halokat ekundda","B":"7 sekundda","C":"8 sekundda","D":"10 sekundda"},"answer":"B","explanation":"Gazniqobni kiyish me'yori: a'lo — 7 sekund, yaxshi — 8 sekund, qoniqarli — 10 sekund.","mnemonic":"Gazniqob me'yor: A'LO=7s, YAXSHI=8s, QON=10s (7-8-10)","source":"10-sinf §24, 82-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":541,"soha":"5. Fuqaro muhofazasi","subtopic":"Gazniqob — kiyish me'yori (yaxshi/qon)","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Askar gazniqobni 9 sekundda kiydi. Unga qaysi baho qo'yiladi?","options":{"A":"A'lo","B":"Yaxshi","C":"Qoniqarli","D":"Qoniqarsiz"},"answer":"C","explanation":"Gazniqob kiyish me'yori: a'lo — 7 s, yaxshi — 8 s, qoniqarli — 10 s. 9 sekund 8 s dan ko'p, lekin 10 s dan kam — bu qoniqarli baholanadi (10 s chegarasida).","mnemonic":"9 sekund: 7 (a'lo) < 8 (yaxshi) < 9 < 10 (qon) → QONIQARLI","source":"10-sinf §24, 82-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":542,"soha":"5. Fuqaro muhofazasi","subtopic":"Respirator R-2 — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Respirator gazniqobdan qanday farq qiladi?","options":{"A":"Respirator ko'z va yuz terisini ham himoya qiladi, gazniqob esa faqat nafas yo'llarini","B":"Respirator faqat nafas yo'llarini himoya qiladi, ko'z va yuzni himoya qilmaydi","C":"Respirator barcha zaharli moddalar va portlash to'lqinidan himoya qiladi","D":"Respirator va gazniqob himoya imkoniyati jihatidan bir-biridan farq qilmaydi"},"answer":"B","explanation":"Respirator — faqat nafas organlarini aerozollar (tutun, chang, parazitlar) va ba'zi gazlardan himoyalovchi vosita; ko'z va yuzni himoya qilmaydi (bu gazniqobning vazifasi).","mnemonic":"Respirator: FAQAT NAFAS organlari → aerozol+chang (ko'z YO'Q)","source":"10-sinf §25, 83-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":543,"soha":"5. Fuqaro muhofazasi","subtopic":"Respirator — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Respiratorlar ta'sir yo'nalishiga ko'ra qanday turlarga bo'linadi?","options":{"A":"Kichik, o'rta, katta turlari","B":"Aerozolga, gazga, gaz‑aerozolga qarshi","C":"Harbiy, tibbiy, sanoat turlari","D":"Bir martalik, qayta ishlatiladigan, doimiy"},"answer":"B","explanation":"Respiratorlar uch turga bo'linadi: aerozolga qarshi, gazga qarshi, gaz-aerozolga qarshi.","mnemonic":"Respirator turlari: AEROZOL + GAZ + GAZ-AEROZOL","source":"10-sinf §25, 83-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":544,"soha":"5. Fuqaro muhofazasi","subtopic":"Respirator R-2 — me'yorlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"R-2 respiratorni kiyish me'yori bo'yicha a'lo baho uchun necha sekundda kiyib bo'lish kerak?","options":{"A":"5 sekund","B":"7 sekund","C":"10 sekund","D":"3 sekund"},"answer":"B","explanation":"R-2 respiratorni kiyish me'yori: a'lo — 7 sekund, yaxshi — 8 sekund, qoniqarli — 10 sekund.","mnemonic":"Respirator me'yor = gazniqob bilan bir xil: A'LO=7s, YAXSHI=8s, QON=10s","source":"10-sinf §25, 84-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":545,"soha":"5. Fuqaro muhofazasi","subtopic":"Respirator — vaziyatda tanlash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Radioaktiv chang tarqaldi. Qo'lda faqat R-2 respirator va doka-paxta niqob bor. Qaysi vositani tanlash maqsadga muvofiq?","options":{"A":"Doka-paxta niqob, chunki u qulay va tez kiyiladi","B":"R-2 respirator, chunki aerozolga qarshi radioaktiv changni filtrlaydi","C":"Ikkalasini birga — avval doka-paxta, ustidan respirator","D":"Oddiy paxta niqob radioaktiv changdan to'liq himoya qiladi"},"answer":"B","explanation":"R-2 respirator aerozolga qarshi vosita bo'lib radioaktiv changni filtrlaydi. Doka-paxta niqobi kamroq himoya beradi. Respirator to'g'ri tanlov, lekin ideal holda gazniqob (GP-5/GP-7) ishlatilishi maqsadga muvofiq.","mnemonic":"Radioaktiv chang → R-2 respirator (aerozolga qarshi) > doka-paxta niqob","source":"10-sinf §25, 83-84-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":546,"soha":"5. Fuqaro muhofazasi","subtopic":"Qo'lbola himoya vositalari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Gazniqob yoki respirator bo'lmaganda aholining nafas yo'llarini himoya qilish uchun qanday qo'lbola vositadan foydalanish mumkin?","options":{"A":"Oddiy ko'zoynaklar","B":"Namlangan doka‑paxta","C":"Plastik paket","D":"Ip bilan bog'lash"},"answer":"B","explanation":"Zarur sharoitda nafas yo'llarini himoya qilish uchun suv bilan namlangan doka-paxta niqobdan foydalanish mumkin — u changdan va ba'zi aerozollardan qisman himoya qiladi.","mnemonic":"Qo'lbola niqob: SUV+DOKA-PAXTA (gazniqob yo'q bo'lsa)","source":"10-sinf §25, 84-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":547,"soha":"5. Fuqaro muhofazasi","subtopic":"Panohgoh — yashirinish tartibi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"FV e'lon qilindi, 'Diqqat hammaga!' signali eshitildi. Qanday to'g'ri tartibda ish tutish kerak?","options":{"A":"Hamma narsani qoldirib, darhol ko'chaga chiqish va yordam chaqirish","B":"Radio/TVni kuzatish, ko'rsatmalarga amal, gazniqob olib, panohgohga","C":"Darhol evakuatsiya punktiga borish va xavfsizlikni tekshirish","D":"Telefondan do'stlarga xabar berish, so'ng kutish va vaziyatni kuzatish"},"answer":"B","explanation":"Tartib: 1) Radio/TV/Internet kuzatish; 2) Ma'lumot olish va ko'rsatmalarga amal qilish; 3) Gazniqob va 2 sutkalik oziq-ovqat olib; 4) Xavotirga tushmay panohgoh yoki ko'rsatilgan joyga borish.","mnemonic":"Signal → RADIO/TV → MA'LUMOT → GAZNIQOB+OZIQ → PANOHGOH","source":"10-sinf §22-23, 75-78-bet","source_file":"046_panohgoh_gazniqob.json","_unrep":false},{"id":548,"soha":"5. Fuqaro muhofazasi","subtopic":"Panohgoh — kirishga taqiqlar vaziyatda","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Panohgohga kirishda o'quvchi ish oylarida ishlatiladi.","mnemonic":"Qish = 2 barmoqli qo'lqop → UHT qishki","source":"10-sinf §26, 87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":555,"soha":"5. Fuqaro muhofazasi","subtopic":"L-1 kostyumi — ta'rif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"L-1 kostyumi qaysi material va maqsad uchun ishlatiladi?","options":{"A":"Paxta matosidan, yong'in va yuqori haroratga qarshi himoya uchun","B":"Rezina matosidan, zaharli moddalar, radioaktiv va biologik zararlashdan tanani himoya qilish uchun","C":"Naylon matosidan, sovuq ob-havo sharoitida isitish uchun","D":"Metallik qatlami bor matosidan, portlash to'lqini va shikastalash elementlaridan himoya uchun"},"answer":"B","explanation":"L-1 kostyumi rezina matosidan tikilgan bo'lib, zaharli moddalar, radioaktiv va biologik zararlashdan tanani himoya qilish uchun mo'ljallangan.","mnemonic":"L-1 = REZINA MATO → ZMO + RADIOAKTIV + BIOLOGIK himoya","source":"10-sinf §26, 87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":556,"soha":"5. Fuqaro muhofazasi","subtopic":"L-1 kostyumi — tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"L-1 kostyumi qanday qismlardan iborat?","options":{"A":"Ko'ylak, shim, etik va gazniqob","B":"Kamzul, shim, shlemost va qo'lqop","C":"Kombinezon, qo'lqop va nafas niqobi","D":"Plash, paypoq, qo'lqop va shlem"},"answer":"B","explanation":"L-1 kostyumi quyidagi qismlardan iborat: qalpoqli kamzul, paypoqli shim, shlemosti va ikki barmoqli qo'lqop.","mnemonic":"L-1: QALPOQLI KAMZUL + PAYPOQLI SHIM + SHLEMOSTI + 2 BARMOQLI QO'LQOP","source":"10-sinf §26, 87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":557,"soha":"5. Fuqaro muhofazasi","subtopic":"L-1 — kiyish me'yori (a'lo)","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"L-1 kostyumini kiyish me'yori bo'yicha a'lo baho uchun qancha vaqtda kiyib bo'lish kerak?","options":{"A":"2 daqiqa 30 sekund","B":"3 daqiqa 00 sekund","C":"4 daqiqa 35 sekund","D":"5 daqiqa 00 sekund"},"answer":"B","explanation":"L-1 kostyumini kiyish me'yori: a'lo — 3 daqiqa 00 sekund, UHT plashidan tezroq kiyiladi.","mnemonic":"L-1 a'lo me'yori: 3:00 (uch daqiqa) — plashdan tez (4:35)","source":"10-sinf §27, 90-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":558,"soha":"5. Fuqaro muhofazasi","subtopic":"L-1 vs UHT — taqqoslash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Kimyoviy razvedka o'tkazish uchun qaysi himoya kostyumi mos keladi?","options":{"A":"UHT plash, chunki u engil va harakatlanishga qulay","B":"L-1 kostyumi, to'liq yopiq tizim, kimyoviy zararlashga mo'ljallangan","C":"Faqat gazniqob va respirator kiysak kifoya qiladi","D":"Oddiy harbiy forma, chunki u harakatlanishni cheklamaydi"},"answer":"B","explanation":"L-1 kostyumi kimyoviy razvedka va kimyoviy ifloslanish sharoitida ishlash uchun mo'ljallangan yopiq tizim (kamzul+shim+shlemosti+qo'lqop). UHT plash esa umumiy himoya, kamroq himoyalanish beradi.","mnemonic":"Kimyoviy razvedka → L-1 (to'liq yopiq tizim)","source":"10-sinf §26, 87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":559,"soha":"5. Fuqaro muhofazasi","subtopic":"UHT — himoya vositasi tanlash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Radioaktiv chang xavfida to'liq himoya uchun qanday vositalar birgalikda ishlatiladi?","options":{"A":"GP-5 gazniqobning o'zi yetarli","B":"GP-5 gazniqob va UHT to'plami birga ishlatiladi","C":"L-1 himoya kostyumining o'zi yetarli","D":"R-2 respirator va oddiy ish kiyimi"},"answer":"B","explanation":"To'liq himoya: nafas organlari + ko'z + yuz → gazniqob GP-5; teri → UHT (plash+paypoq+qo'lqop). Ikkalasini birgalikda ishlatish to'liq himoya beradi.","mnemonic":"Radioaktiv: GP-5 (nafas+yuz) + UHT (teri) = TO'LIQ HIMOYA","source":"10-sinf §24-26, 80-87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":560,"soha":"5. Fuqaro muhofazasi","subtopic":"UHT — kiyish tartibi (to'g'ri ketma-ketlik)","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"UHT kiyish buyrug'i berildi. Qaysi ketma-ketlik to'g'ri?","options":{"A":"Gazniqob → plash → paypoq → qo'lqop","B":"Paypoq → plash → gazniqob → qo'lqop","C":"Plash → paypoq → gazniqob → qo'lqop","D":"Gazniqob → qo'lqop → paypoq → plash"},"answer":"B","explanation":"UHT kiyish tartibi: avval paypoq va plash (quyi qismdan boshlab), so'ng gazniqob (nafas organlari himoyasi zarur deb belgilanganda), nihoyat qo'lqop.","mnemonic":"UHT tartib: PAYPOQ → PLASH → GAZNIQOB → QO'LQOP (quyi → yuqori)","source":"10-sinf §27, 88-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":561,"soha":"5. Fuqaro muhofazasi","subtopic":"Individual himoya vositalari — umumiy","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Individual himoya vositalari qanday ikki asosiy guruhga bo'linadi?","options":{"A":"Harbiy va fuqarolik himoya vositalari","B":"Nafas organlarini himoyalash vositalari va teri himoyasi vositalari","C":"Kimyoviy va radiatsion xavflardan himoyalash vositalari","D":"Individual va guruhiy foydalanish uchun mo'ljallangan vositalar"},"answer":"B","explanation":"Individual himoya vositalari ikki asosiy guruhga bo'linadi: nafas organlarini himoyalash vositalari (gazniqob, respirator) va teri himoyasi vositalari (UHT, L-1 kostyumi).","mnemonic":"IHV = NAFAS vositasi (gazniqob/respirator) + TERI vositasi (UHT/L-1)","source":"10-sinf §24-26, 80-87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":562,"soha":"5. Fuqaro muhofazasi","subtopic":"GP-5 vs GP-7 — farqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"GP-7 gazniqobi GP-5 dan qanday afzalliklarga ega?","options":{"A":"GP-7 og'irroq va kattaroq bo'lib, kuchli kimyoviy moddalardan himoya qiladi","B":"GP-7 yengilroq va o'ng-chap filtroboksli bo'lib, ko'rish maydonini yaxshilaydi","C":"GP-7 faqat harbiy xizmatchilar uchun mo'ljallangan, GP-5 fuqarolar uchun","D":"GP-5 va GP-7 o'rtasida amaliy farq yo'q, faqat tashqi ko'rinishi farq qiladi"},"answer":"B","explanation":"GP-7: og'irligi 0,9 kg, 6 qismdan iborat, o'ng va chap filtrobokslar bilan jihozlangan — ko'rish maydonini yaxshilaydi va nafas olishni osonlashtiradi. GP-5 dan yanada rivojlangan model.","mnemonic":"GP-7: 0,9 kg, 6 qism, O'NG+CHAP filtroboks → GP-5 dan yaxshiroq","source":"10-sinf §24, 82-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":563,"soha":"5. Fuqaro muhofazasi","subtopic":"Gazniqob — saqlash tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Gazniqob qanday holatda saqlanishi kerak?","options":{"A":"Shkafdagi qutida, foydalanish uchun kerak bo'lganda chiqariladigan holatda","B":"O'z sumkachasida, to'g'ri o'ralgan holda, doimo yonida","C":"Sovuq va quruq joyda, har 6 oyda bir marta tekshirilib turiladi","D":"Avariya kabineti shkafida, mas'ul shaxs kalitida"},"answer":"B","explanation":"Gazniqob o'z sumkachasida, to'g'ri bog'langan bandaj bilan, tayyor holatda (doimiy yonida) saqlanadi.","mnemonic":"Gazniqob saqlash: SUMKADA + BAND + YONIDA (har doim)","source":"10-sinf §24, 82-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":564,"soha":"5. Fuqaro muhofazasi","subtopic":"UHT — plash uchburchak usulda kiyish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"UHT plashini kiyishda qanday holatlarda u uchburchak (kapyushon) shaklida kiyiladi?","options":{"A":"Doim uchburchak shaklida kiyiladi","B":"Yomg'ir yoki kimyoviy xavfda kapyushon","C":"Sovuq va shamolli ob-havoda","D":"Oddiy ish vaqtida"},"answer":"B","explanation":"UHT plashi kapyushon (uchburchak) usulida kiyilganda bosh va bo'yin ham himoyalanadi — ayniqsa yomg'ir yoki kimyoviy zararlash sharoitida.","mnemonic":"Plash kapyushon: YOMG'IR + KIMYO → bosh+bo'yin himoyasi","source":"10-sinf §26, 86-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":565,"soha":"5. Fuqaro muhofazasi","subtopic":"L-1 va UHT — o'lcham solishtirish","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Bo'yi 167 sm bo'lgan xizmatchi L-1 va UHT plash olmoqchi. Qaysi o'lchamlarni olishi kerak?","options":{"A":"L-1: 1-o'lcham, Plash: 1-o'lcham","B":"L-1: 2-o'lcham, Plash: 2-o'lcham","C":"L-1: 2-o'lcham, Plash: 1-o'lcham","D":"L-1: 1-o'lcham, Plash: 2-o'lcham"},"answer":"B","explanation":"L-1: 2-o'lcham (165–172 sm); Plash: 2-o'lcham (166–172 sm). 167 sm ikkalasida ham 2-o'lchamga kiradi.","mnemonic":"167 sm: L-1 (165-172=2) + Plash (166-172=2) → Ikkalasi 2-o'lcham","source":"10-sinf §26, 85-87-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":566,"soha":"5. Fuqaro muhofazasi","subtopic":"FM IHV — kompleks vaziyat","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Kimyoviy avariya e'lon qilindi, havo zaharli modda bilan ifloslandi. O'quv muassasasidagi o'quvchilarga qanday ko'rsatma berish to'g'ri?","options":{"A":"Ko'chaga chiqib toza havoga nafas olish","B":"Derazalarni yopib, gazniqob yoki doka-paxta niqob kiying va ko'rsatmani kuting","C":"Darhol uyga qaytib, oila a'zolari bilan evakuatsiya qilish","D":"Gazniqobsiz, faqat L-1 kostyumda ko'chaga chiqib evakuatsiya punktiga borish"},"answer":"B","explanation":"Kimyoviy avariyada: binoda qoling (derazalarni yoping, changitish bo'shlig'ini berkiting), gazniqob yoki doka-paxta niqob kiyib, radio/TV orqali ko'rsatmani kuting. Ko'chaga chiqish — zaharlanish xavfi kattaroq.","mnemonic":"Kimyo avariya: BINODA QOL + DARZ YOP + GAZNIQOB KIY + KO'RSATMA KUT","source":"10-sinf §22-24, 74-82-bet","source_file":"047_teri_himoya.json","_unrep":false},{"id":567,"soha":"6. Tibbiy bilim asoslari","subtopic":"Taktik-tibbiy tayyorgarlik maqsadi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Taktik-tibbiy tayyorgarlikning asosiy maqsadi nima?","options":{"A":"Harbiy xizmatchilarni jangovar texnikani boshqarishga o'rgatish","B":"Harbiy xizmatchilarni turli sharoitlarda birinchi tibbiy yordam ko'rsatish amallarini o'rgatish","C":"Harbiy xizmatchilarni qo'mondonlik va boshqaruv tizimiga tayyorlash","D":"Harbiy xizmatchilarni dushman razvedkasiga qarshi harakat qilishga o'rgatish"},"answer":"B","explanation":"Taktik-tibbiy tayyorgarlik qo'shinlar jangovar tayyorgarligining tarkibiy qismi bo'lib, uning asosiy maqsadi harbiy xizmatchilarni turli sharoitlarda birinchi tibbiy yordam ko'rsatish amallarini o'rgatishdan iborat.","mnemonic":"TTT maqsadi: harbiy xizmatchilarni BIRINCHI TIBBIY YORDAM ko'rsatishga o'rgatish","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":568,"soha":"6. Tibbiy bilim asoslari","subtopic":"Taktik-tibbiy hududlar — turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Taktik tibbiyotda jangovar harakatlar intensivligiga qarab nechta taktik-tibbiy hudud farqlanadi?","options":{"A":"2 ta","B":"3 ta","C":"4 ta","D":"5 ta"},"answer":"B","explanation":"Taktik tibbiyotda jangovar harakatlar intensivligi va tibbiy yordam ko'rsatish imkoniyatlariga qarab shartli ravishda 3 xil hudud farqlanadi: 'qizil', 'sariq' va 'yashil'.","mnemonic":"Taktik-tibbiy hududlar: QIZIL + SARIQ + YASHIL (3 ta)","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":569,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qizil hudud — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"'Qizil hudud' nima?","options":{"A":"Nisbatan xavfsiz pana joy, shaxsiy tarkib jarohatlanish xavfi o'rtacha","B":"Dushman bilan bevosita olovli to'qnashuvda bo'lgan, yaralanish ehtimoli yuqori hudud","C":"Shartli xavfsiz, shaxsiy tarkib jarohatlanish xavfi nisbatan past hudud","D":"Tibbiy yordam ko'rsatish va yaralanganlarni parvarish qilish uchun ajratilgan xavfsiz zona"},"answer":"B","explanation":"'Qizil hudud' deganda dushman bilan bevosita olovli to'qnashuvda bo'lgan va yaralanish ehtimoli yuqori hudud tushuniladi. Ushbu hududda jangovar vaziyat keskin, tibbiy yordam ko'rsatish imkoniyatlari esa cheklangan.","mnemonic":"QIZIL = BEVOSITA OLOV TO'QNASHUV = Yaralanish xavfi YUQORI","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":570,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sariq hudud — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"'Sariq hudud' qanday hudud?","options":{"A":"Dushman bilan bevosita to'qnashuv joyi, yaralanish xavfi eng yuqori","B":"Nisbatan xavfsiz, vaqtincha pana joy: okop, transheya yoki bino ortida","C":"Shartli xavfsiz hudud, tibbiy yordam to'liq hajmda ko'rsatiladigan joy","D":"Evakuatsiya va qayta tashkil etish uchun ajratilgan orqa zona"},"answer":"B","explanation":"'Sariq hudud' — nisbatan xavfsiz, vaqtincha pana joy (jangovar texnikalarning orti, okop, transheya, bino va hokazo). Bu yerda shaxsiy tarkibning jarohatlanish xavfi saqlanib qoladi.","mnemonic":"SARIQ = NISBATAN XAVFSIZ pana joy (okop, transheya, bino)","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":571,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yashil hudud — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"'Yashil hudud' qanday hudud?","options":{"A":"Dushman bilan bevosita olovli to'qnashuv joyi, xavf eng yuqori","B":"Nisbatan xavfsiz, dushman o'ti ostida qoladigan pana joy","C":"Shartli xavfsiz hudud, shaxsiy tarkib jarohatlanish xavfi nisbatan past","D":"Harbiy sanitariya bo'limi joylashgan, to'liq xavfsiz tibbiy zona"},"answer":"C","explanation":"'Yashil hudud' — shartli xavfsiz hudud. Bu yerda shaxsiy tarkibning jarohatlanish xavfi nisbatan past.","mnemonic":"YASHIL = SHARTLI XAVFSIZ = jarohat xavfi PAST","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":572,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Askarning individual tibbiy jamlanmasi nechta qismdan iborat?","options":{"A":"3 ta","B":"5 ta","C":"7 ta","D":"10 ta"},"answer":"C","explanation":"Individual tibbiy jamlanma 7 qismdan iborat: shaxsiy bog'lov paketi, siqib turuvchi elastik bog'lov (bandaj), turniket tipidagi jgut, Promedol 2% li shpris-tyubik, nazofarengial havo nayi, tibbiy plastir (5cm x 5m), tibbiy sumka-jamlanma tashqi g'ilofi.","mnemonic":"ITJ = 7 qism: BOG'LOV+BANDAJ+JGUT+PROMEDOL+NAYNA+PLASTIR+G'ILOF","source":"10-sinf §45, 145-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":573,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — bog'lov paketi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Jang maydonida askarning ko'krak qafasiga jarohat tushdi. Individual tibbiy jamlanmadan qaysi vosita germetik bog'lam qo'yish uchun ishlatiladi?","options":{"A":"Turniket jgut","B":"Nazofarengial havo nayi","C":"Shaxsiy bog'lov paketi","D":"Tibbiy plastir"},"answer":"C","explanation":"Shaxsiy bog'lov paketi (dokali paxta) — ko'krak qafasi jarohatida germetik bog'lam qo'yish, tashqi qon ketishida steril bog'lam qo'yish, kuyish maydonini yopishda ishlatiladi.","mnemonic":"Ko'krak germetik bog'lam -> SHAXSIY BOG'LOV PAKETI","source":"10-sinf §45, 145-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":574,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — jgut","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Qo'l-oyoqdan qon ketishini vaqtincha to'xtatish uchun ITJdan qaysi vosita ishlatiladi?","options":{"A":"Nazofarengial havo nayi","B":"Turniket tipidagi qon to'xtatuvchi jgut","C":"Siqib turuvchi elastik bog'lov (bandaj)","D":"Tibbiy plastir"},"answer":"B","explanation":"Turniket tipidagi qon to'xtatuvchi jgut — oyoq-qo'llardan tashqi qon ketishini vaqtincha to'xtatish maqsadida bir qo'l bilan bajariladi.","mnemonic":"Oyoq-qo'l qon ketishi -> TURNIKET JGUT (bir qo'l bilan ham)","source":"10-sinf §45, 145-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":575,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — Promedol","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"ITJdagi Promedol nima maqsadda va qanday beriladi?","options":{"A":"Infeksiyani oldini olish uchun og'iz orqali ichiladi","B":"Kuchli og'riq qoldirish uchun mushak to'qimalariga inyeksiya qilinadi","C":"Qon ketishini to'xtatish uchun yarana bevosita suriladi","D":"Nafas olishni tiklash uchun burun orqali beriladi"},"answer":"B","explanation":"Promedol (Trimeperidin 2% li) — giyohvand vositalar guruhiga kiruvchi og'riqsizlantiruvchi. Har qanday qattiq og'riq bilan kechadigan jarohatlarda, kuyish va lat yeyishlarda mushak to'qimalari (yelkaning deltoid muskuli yoki sonning yuqori yuzasi)ga inyeksiya qilinadi.","mnemonic":"Promedol = OG'RIQ QOLDIRUVCHI (giyohvand) -> mushaklarga INYEKSIYA","source":"10-sinf §45, 146-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":576,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — nazofarengial nayi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yarador nafas olish funksiyasi buzilgan (asfiksiya holati). ITJdan qaysi vositadan foydalanish kerak?","options":{"A":"Turniket jgut","B":"Tibbiy plastir","C":"Nazofarengial havo nayi","D":"Shaxsiy bog'lov paketi"},"answer":"C","explanation":"Nazofarengial havo nayi — jarohatlar tufayli yaradorda asfiksiya (nafas olish funksiyasi buzilgan, to'xtab qolgan, nafas yo'liga yot jism yoki qon tiqilib qolgan) holatlarda burun bo'shlig'i orqali traxeyaga kiritiladi.","mnemonic":"Asfiksiya (nafas to'xtash) -> NAZOFARENGIAL HAVO NAYI -> burun orqali","source":"10-sinf §45, 146-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":577,"soha":"6. Tibbiy bilim asoslari","subtopic":"Individual tibbiy jamlanma — tibbiy plastir","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"ITJdagi tibbiy plastir qanday o'lchamda bo'ladi?","options":{"A":"2 sm x 2 m","B":"5 sm x 5 m","C":"10 sm x 10 m","D":"1 sm x 1 m"},"answer":"B","explanation":"Tibbiy plastir: 5 sm x 5 m hajmdagi rezina matoli yopishqoq tasma. Jarohat yuzasini yopish, bint/salfetka mahkamlash, tilingan jarohatlar va tashqi qon ketishda ishlatiladi.","mnemonic":"Tibbiy plastir: 5cm x 5m -> YOPISH + MAHKAMLASH + QON","source":"10-sinf §45, 146-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":578,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qizil hudud — birinchi harakatlar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Qizil hududda yarador topildi. Birinchi navbatda nima qilish kerak?","options":{"A":"Darhol yarorni ko'tarib pana joyga olib chiqish","B":"Javoban o't ochib, pana joyga yashiring, olovni ochishda ustunlik","C":"Yaradorga darhol tibbiy yordam ko'rsatish","D":"Tibbiyot xodimini chaqirish"},"answer":"B","explanation":"'Qizil hudud'da bajariladigan tadbirlar: javoban o't ochib, pana joyga yashirish va o't ochishda ustunlikka erishishni ta'minlash. Faqat shundan so'ng yarorga yordam ko'rsatiladi.","mnemonic":"Qizil hudud 1-harakat: JAVOBAN O'T OCHISH + PANA JOYGA (avval xavfsizlik!)","source":"10-sinf §46, 147-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":579,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qizil hudud — turniket qo'yish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Qizil hududda (bevosita jang) yaradorning oyog'idan qon ketmoqda. Turniket qanday qo'yiladi?","options":{"A":"Turniket yaralangan joyga qo'yiladi","B":"Turniketni ustidan, qon ketish joyidan yuqoriroqqa qo'yish","C":"Turniket qon ketish joyidan pastga qo'yiladi","D":"Avval kiyim yechiladi, so'ng turniket qo'yiladi"},"answer":"B","explanation":"Turniketni oyoq-qo'llarga KIYIM USTIDAN, qon ketish joyidan ILOJI BORICHA TEPAROQQA qattiq qilib qo'yish kerak. Agar qon ketish joyini aniqlashning iloji bo'lmasa, turniketni MAKSIMAL TEPAGA qo'yiladi.","mnemonic":"Turniket: KIYIM USTIDA + QONDAN TEPAROQQA (aniqlash imkonsiz = MAKSIMAL TEPAGA)","source":"10-sinf §46-48, 147-155-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":580,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sariq hudud — tibbiy yordam tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sariq hududda birinchi navbatda nima amalga oshiriladi?","options":{"A":"Darhol barcha yaradorlarga tibbiy yordam ko'rsatiladi","B":"Atrof-muhit xavfsizligi ta'minlanadi va yaradorlar saralanadi","C":"Hamma yaradorlar zudlik bilan evakuatsiya qilinadi","D":"Avval tibbiyot xodimi va shifokor chaqiriladi"},"answer":"B","explanation":"'Sariq hudud'da: avval atrof-muhitning xavfsizligini ta'minlash, so'ng yaradorlarni yordam zarur bo'lishiga qarab saralash (triaj). Keyin hushni, puls va nafasni tekshirish.","mnemonic":"Sariq hudud: XAVFSIZLIK -> SARALASH (triaj) -> BAHOLASH","source":"10-sinf §46, 149-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":581,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sariq hudud — qizil hudud turniketini tekshirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Sariq hududda qizil hududdan keltirilgan yaradorning turniketi bosh tortilganini sezdingiz. Nima qilish kerak?","options":{"A":"Turniketni yechib, keyin qayta qo'yish","B":"Turniketni burash; qon to'xtamasa, yuqoriga qo'yish","C":"Turniketni olib tashlab, bog'lam qo'yish","D":"Hech narsa qilmay, shifokor chaqirish"},"answer":"B","explanation":"Sariq hududda: qizil hududda qo'yilgan barcha turniketlarning samaradorligini tekshirish. Agar bo'sh tortilgan bo'lsa — qattiqroq burash. Qon oqishi to'xtamasa — undan yuqoriroqqa IKKINCHI TURNIKET qo'yish.","mnemonic":"Turniket bo'sh: QATTIQROQ BUR; to'xtamasa: IKKINCHI TURNIKET yuqoriroqqa","source":"10-sinf §46, 149-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":582,"soha":"6. Tibbiy bilim asoslari","subtopic":"Yaradorni olib chiqish — ryukzak usuli","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"'Ryukzak' usulida yaradorni olib chiqish qachon qo'llaniladi?","options":{"A":"Yarador hushsiz bo'lganda, 10-50 m masofada","B":"Yarador hushida bo'lganda, 50-300 m oraliq masofada","C":"Yarador og'ir jarohatlangan bo'lganda, 300 m dan ortiq masofada","D":"Faqat qo'lida jarohat bo'lganda"},"answer":"B","explanation":"'Ryukzak' usuli: faqat yarador hushida bo'lganda qo'llaniladi. Yaradorlarga o'rta masofalar (50-300 m)da shu usulda yordam ko'rsatiladi. Yaradorning og'irligi qutqaruvchining orqa qismiga tushadi.","mnemonic":"Ryukzak = HUSHIDA + 50-300 m masofa + orqada ko'tariladi","source":"10-sinf §47, 150-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":583,"soha":"6. Tibbiy bilim asoslari","subtopic":"Me'yor — ko'krakka bog'lam","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Ko'krakka sakkizsimon bog'lam qo'yish me'yorida a'lo baho qancha vaqtda beriladi?","options":{"A":"1 daqiqa 30 sekund","B":"2 daqiqa 10 sekund","C":"2 daqiqa 50 sekund","D":"3 daqiqa"},"answer":"B","explanation":"Ko'krakka sakkizsimon bog'lam me'yori: a'lo — 2 daqiqa 10 sekund, yaxshi — 2 daqiqa 20 sekund, qoniqarli — 2 daqiqa 50 sekund.","mnemonic":"Ko'krak bog'lam me'yor: A'LO 2:10, YAXSHI 2:20, QON 2:50","source":"10-sinf §48, 154-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":584,"soha":"6. Tibbiy bilim asoslari","subtopic":"Me'yor — jgut qo'yish","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Yelka (son)ga rezinali jgut qo'yish me'yorida a'lo baho uchun qancha vaqt belgilangan?","options":{"A":"10 sekund","B":"18 sekund","C":"25 sekund","D":"30 sekund"},"answer":"B","explanation":"Yelka (son)ga rezinali jgut qo'yish me'yori: a'lo — 18 sekund, yaxshi — 20 sekund, qoniqarli — 25 sekund.","mnemonic":"Jgut me'yor: A'LO 18s, YAXSHI 20s, QON 25s","source":"10-sinf §48, 155-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":585,"soha":"6. Tibbiy bilim asoslari","subtopic":"Me'yor — yarorni sudrab olib chiqish","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Yaradorni jang maydonidan sudrab olib chiqish me'yorida a'lo baho uchun qancha vaqt belgilangan (masofa 15 metr)?","options":{"A":"45 sekund","B":"1 daqiqa 20 sekund","C":"1 daqiqa 45 sekund","D":"2 daqiqa"},"answer":"B","explanation":"Yaradorni jang maydonidan sudrab olib chiqish (15 metr): a'lo — 1 daqiqa 20 sekund, yaxshi — 1 daqiqa 30 sekund, qoniqarli — 1 daqiqa 45 sekund.","mnemonic":"Sudrab olib chiqish 15m: A'LO 1:20, YAXSHI 1:30, QON 1:45","source":"10-sinf §48, 156-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":586,"soha":"6. Tibbiy bilim asoslari","subtopic":"Jgut qo'yish — vaqtni qayd etish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Jgut qo'yilgandan so'ng nima qilish zarur?","options":{"A":"Jgutni kiyim ostiga berkintirib qo'yish","B":"Jgut qo'yilgan vaqtni qog'ozga yozib, o'ramga qo'shish","C":"Yaradorga jgut qo'yilganini og'zaki aytish","D":"Jgutni qizil rangli mato bilan belgilash"},"answer":"B","explanation":"Jgut qo'yilgandan so'ng tayyor qog'oz parchasiga jgut qo'yilgan VAQT yoziladi va u jgut o'ramiga qistiriladi. Bu tibbiyot xodimlariga zarur ma'lumot beradi.","mnemonic":"Jgut qo'ygandan so'ng: VAQTNI YOZIB -> jgut o'ramiga QISTIRISH","source":"10-sinf §48, 155-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":587,"soha":"6. Tibbiy bilim asoslari","subtopic":"Ko'krakka bog'lam — maqsadi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Ko'krakka sakkizsimon bog'lam qo'yishning asosiy maqsadi nima?","options":{"A":"Qon ketishini tezda to'xtatish","B":"Nafas yetishmovchiligi asoratlarini oldini olish","C":"Yaraning infeksiyalanishini oldini olish","D":"Yaraga og'riq qoldiruvchi vosita berish"},"answer":"B","explanation":"Ko'krakka sakkizsimon bog'lam ko'krak qafasidan yaralanganda individual tibbiy jamlanmadagi bog'lov paketidan foydalanib qo'yiladi va yaradorda o'lim holatiga olib keladigan nafas yetishmovchiligi kabi asoratlar yuzaga kelishining oldini oladi.","mnemonic":"Ko'krak bog'lam maqsadi: NAFAS YETISHMOVCHILIK asoratidan HIMOYA","source":"10-sinf §48, 153-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":588,"soha":"6. Tibbiy bilim asoslari","subtopic":"Jgut qo'yish — tartib","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Rezinali jgut qayerga qo'yiladi?","options":{"A":"Jarohat joyining pastiga","B":"Yelkaning yuqori 1/3 qismiga","C":"Bevosita yaraning ustiga","D":"Bo'g'im hududiga"},"answer":"B","explanation":"Rezinali jgut taranglashtirilgan holatda yelka (son)ning yuqori 1/3 qismiga qo'yiladi va yelka (son) atrofida uzun uchi to'liq bir marta aylantiriladi.","mnemonic":"Jgut o'rni: YELKA/SON yuqori 1/3 qism + TARANGLASHTIRILGAN","source":"10-sinf §48, 155-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":589,"soha":"6. Tibbiy bilim asoslari","subtopic":"ITJ — bandaj maqsadi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Siqib turuvchi elastik bog'lovning (bandajning) asosiy afzalligi nima?","options":{"A":"Nafas yo'llarini tozalash va kislorod etkazishda ishlatiladi","B":"Bir qo'l bilan qo'yish mumkin, qo'shimcha mahkamlash talab etmaydi","C":"Og'riq qoldiruvchi xususiyatga ega, og'ir jarohatlarda ishlatiladi","D":"Faqat kuyish maydonini yopish va sovuq qo'yish uchun mo'ljallangan"},"answer":"B","explanation":"Siqib turuvchi elastik bog'lov (bandaj): tashqi qon ketishida bog'lam qo'yish, jarohatlangan qo'l-oyoqlarni mahkamlash. Asosiy afzallik — bir qo'l bilan qo'yish mumkin va qo'shimcha mahkamlash talab etmaydi.","mnemonic":"Bandaj afzalligi: BIR QO'L bilan + MAHKAMLAMASDAN qo'yish mumkin","source":"10-sinf §45, 145-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":590,"soha":"6. Tibbiy bilim asoslari","subtopic":"Taktik tibbiy — birinchi yordam tezligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","question":"Nima uchun jang maydonida yarorlarga tibbiy yordam imkon qadar tez ko'rsatilishi shart?","options":{"A":"Harbiy nizom ko'rsatgan muddatlarda bajarilmagan harakat intizom jazosiga tortiladi","B":"Tibbiy yordam tezligi yaralanganlar hayotini saqlab qolishda hal qiluvchi ahamiyatga ega","C":"Tibbiy jihozlar va dorilar cheklangan miqdorda bo'lgani uchun ularni tejash kerak","D":"Yaradorlar saralash (triaj) tizimida yuqori imtiyozga ega bo'lishi uchun"},"answer":"B","explanation":"Birinchi tibbiy yordam ko'rsatish tezligi yaralanganlar hayotini saqlab qolishda muhim ahamiyatga ega. Yaralangan askarga qancha qisqa muddat ichida yordam ko'rsatilsa, natija shuncha samarali bo'ladi.","mnemonic":"Tibbiy yordam tezligi = hayot SAQLASH kaliti (qisqa muddat = samarali natija)","source":"10-sinf §45, 144-bet","source_file":"048_taktik_tibbiy_asoslar.json","_unrep":false},{"id":591,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Shikastlanish nima?","options":{"A":"Tana ichki a'zolarida kasallik oqibatida yuzaga keladigan patologik jarayon","B":"Organizm to'qimalarining tashqi omillar ta'sirida butunligini yo'qotishi bilan bog'liq patologik holat","C":"Organizmning kimyoviy reaksiyalar natijasida ichki jihatdan o'zgarish holati","D":"Suyaklar va bo'g'imlardagi yallig'lanish jarayoni"},"answer":"B","explanation":"Shikastlanish — organizm to'qimalarining tashqi omillar ta'sirida butunligini yo'qotishi yoki shikastlanishi bilan bog'liq patologik holat. Mexanik, termik, kimyoviy va biologik omillar natijasida yuzaga kelishi mumkin.","mnemonic":"Shikastlanish = TASHQI OMILLAR -> to'qima BUTUNLIGI buzilishi","source":"10-sinf §49, 157-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":592,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish turlari — mexanik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"To'qimalarning siqilishi yoki urilishi oqibatida, teri butunligi buzilmay paydo bo'lgan shikastlanish qanday nomlanadi?","options":{"A":"Jarohat","B":"Sinish","C":"Lat yeyish","D":"Chiqish"},"answer":"C","explanation":"Lat yeyish — to'qimalarning siqilishi yoki urilishi oqibatida paydo bo'ladi, teri butunligi buzilmaydi.","mnemonic":"LAT YEYISH = siqish/urish + teri BUZILMAYDI","source":"10-sinf §49, 158-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":593,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish turlari — jarohat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Teri yoki shilliq qavatning butunligi buzilishi bilan kechadigan shikastlanish qanday nomlanadi?","options":{"A":"Lat yeyish","B":"Jarohat","C":"Sinish","D":"Sovuq urishi"},"answer":"B","explanation":"Jarohat — teri yoki shilliq qavatning butunligi buzilishi bilan kechadigan shikastlanish. Ochiq va yopiq bo'lishi mumkin.","mnemonic":"JAROHAT = TERI BUTUNLIGI BUZILADI (ochiq va yopiq)","source":"10-sinf §49, 158-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":594,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish turlari — termik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Oshpaz qo'li qaynoq suv bilan kuydi. Bu qanday turdagi shikastlanish?","options":{"A":"Mexanik shikastlanish","B":"Biologik shikastlanish","C":"Termik shikastlanish","D":"Kimyoviy shikastlanish"},"answer":"C","explanation":"Kuyish — olov, issiq suyuqliklar, bug', qizigan buyumlar yoki quyosh ta'sirida terining shikastlanishi — termik shikastlanish turiga kiradi.","mnemonic":"ISSIQ suyuqlik/olov/bug' -> TERMIK kuyish","source":"10-sinf §49, 158-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":595,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish — kimyoviy","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Kislota qo'lga tushdi va teri shikastlandi. Birinchi tibbiy yordam qanday ko'rsatiladi?","options":{"A":"Kuygan joyni tuz suv bilan yuvish","B":"Moddani suv bilan yuvib, shifokorga murojaat qilish","C":"Bikarbonat bilan neytrallashtirish","D":"Sovuq muz qo'yish"},"answer":"B","explanation":"Kimyoviy kuyishda: ta'sir qilgan modda suv bilan yuvib tashlanadi va shifokorga murojaat qilinadi.","mnemonic":"Kimyoviy kuyish = SUV BILAN YUV + SHIFOKORGA","source":"10-sinf §49, 159-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":596,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shikastlanish — kuyishda yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yonish jarohatida (olov kuyishi) birinchi tibbiy yordam qanday ko'rsatiladi?","options":{"A":"Kuygan joyga moy surtish","B":"Kuygan joyni sovuq suv bilan yuvish","C":"Kuygan joyni tuz bilan ishlash","D":"Pufakchalari teshib chiqarish"},"answer":"B","explanation":"Yonishlarda (termik kuyish): kuygan joy sovuq suv bilan yuvilib, steril bog'lam qo'yiladi.","mnemonic":"Kuyish = SOVUQ SUV YUVI + STERIL BOG'LAM (moy yoki tuz EMAS!)","source":"10-sinf §49, 159-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":597,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shok — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Shok qanday holat va qanday omillar uni keltirib chiqaradi?","options":{"A":"Faqat qon ketish natijasida yuzaga keladigan o'tkinchi holat","B":"Og'ir jarohatlar, qon yo'qotish, infeksiya yoki kuchli ruhiy zarbalar tufayli yuzaga keladigan jiddiy holat","C":"Suyak sinishi va bo'g'im chiqishlarida kuzatiladigan vaqtinchalik holat","D":"Elektr toki yoki kimyoviy modda urishi natijasida yuzaga keladigan teri zararlanishi"},"answer":"B","explanation":"Shok — og'ir jarohatlar, qon yo'qotish, infeksiya yoki kuchli ruhiy zarbalar natijasida yuzaga keladigan jiddiy patologik holat. U organizmning muhim tizimlarida qon aylanishining buzilishi va kislorod yetishmovchiligi bilan kechadi.","mnemonic":"SHOK = JAROHAT/QON/INFEKSIYA/RUHIY zarba -> QON AYLANISH buzilishi + KISLOROD yetishmovchiligi","source":"10-sinf §49, 160-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":598,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shok turlari — gipovolemik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Kuchli qon ketishi yoki suyuqlik yo'qotish oqibatida yuzaga keladigan shok turi?","options":{"A":"Anafilaktik shok","B":"Gipovolemik shok","C":"Kardiogen shok","D":"Septik shok"},"answer":"B","explanation":"Gipovolemik shok — organizmdagi suyuqlik yoki qon yo'qotish oqibatida yuzaga keladi.","mnemonic":"GIPO-VOLEMIK = kam hajm (qon/suyuqlik yo'qotish) -> shok","source":"10-sinf §49, 160-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":599,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shok turlari — anafilaktik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"O'quvchiga asalari chaqdi va u birdan hushsiz bo'lib qoldi. Bu qanday turdagi shok?","options":{"A":"Travmatik shok","B":"Gipovolemik shok","C":"Anafilaktik shok","D":"Septik shok"},"answer":"C","explanation":"Anafilaktik shok — allergik reaksiya tufayli rivojlanadi. Masalan, asalari chaqishi yoki dorilarga nisbatan allergiya natijasida.","mnemonic":"ANAFILAKTIK shok = ALLERGIYA (asalari/dori) natijasida","source":"10-sinf §49, 160-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":600,"soha":"6. Tibbiy bilim asoslari","subtopic":"Shok turlari — travmatik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Og'ir jarohatlar, suyak sinishlari, kuyish yoki jarrohlik operatsiyalaridan keyin paydo bo'ladigan shok qanday nomlanadi?","options":{"A":"Gipovolemik shok","B":"Anafilaktik shok","C":"Kardiogen shok","D":"Travmatik shok"},"answer":"D","explanation":"Travmatik shok — og'ir jarohatlar, suyak sinishlari, kuyish yoki jarrohlik operatsiyalaridan keyin paydo bo'ladi.","mnemonic":"TRAVMATIK shok = JAROHAT/SINISH/KUYISH/OPERATSIYA dan keyin","source":"10-sinf §49, 160-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":601,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qon ketishi — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Qon ketishi nima?","options":{"A":"Qon tomirlari devorining kuchsizlanishi oqibatida arterial bosimning pasayishi","B":"Jarohatlangan tomirlardan qon oqib chiqishi bilan kechadigan patologik holat","C":"Organizmga donor qoni yuborilishi bilan bog'liq tibbiy amaliyot","D":"Qon plazmasining to'qimalarga o'tib, shish hosil qilishi holati"},"answer":"B","explanation":"Qon ketishi — jarohatlangan tomirlardan qon oqib chiqishi bilan kechadigan patologik holat.","mnemonic":"Qon ketishi = JAROHATLANGAN TOMIR -> qon OQISHI","source":"10-sinf §50, 162-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":602,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qon ketishi — arterial belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yaradorda qon och qizil rangda, otilib chiqmoqda. Bu qanday qon ketishi?","options":{"A":"Venoz qon ketishi","B":"Kapillyar qon ketishi","C":"Arterial qon ketishi","D":"Ichki qon ketishi"},"answer":"C","explanation":"Arterial qon ketishi — arteriya tomirlaridan OCH QIZIL rangdagi qon OTILIB chiqadi. Venoz qon ketishida esa toq qizil rang va pulsatsiya kuzatilmaydi.","mnemonic":"ARTERIAL = OCH QIZIL + OTILIB CHIQADI; VENOZ = TO'Q QIZIL + SEKIN OQADI","source":"10-sinf §50, 162-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":603,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qon ketishi — venoz belgilari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Yaradorda qon to'q qizil rangda, sekinlik bilan oqmoqda, pulsatsiya yo'q. Bu qanday qon ketishi?","options":{"A":"Arterial qon ketishi","B":"Venoz qon ketishi","C":"Kapillyar qon ketishi","D":"Parenximatoz qon ketishi"},"answer":"B","explanation":"Venoz qon ketish — sekinlik bilan to'q qizil rangli qon oqishi, pulsatsiya kuzatilmaydi.","mnemonic":"VENOZ = TO'Q QIZIL + SEKINlik + pulsatsiya YO'Q","source":"10-sinf §50, 163-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":604,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qon ketishi — kapillyar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Yuzaki shikastlanishlarda uchraydigan nisbatan xavfsiz qon ketishi turi?","options":{"A":"Arterial","B":"Venoz","C":"Kapillyar","D":"Parenximatoz"},"answer":"C","explanation":"Kapillyar qon ketish — yuzaki shikastlanishlarda uchraydigan, nisbatan xavfsiz qon ketish turi.","mnemonic":"KAPILLYAR = YUZAKI shikastlanish = NISBATAN XAVFSIZ","source":"10-sinf §50, 163-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":605,"soha":"6. Tibbiy bilim asoslari","subtopic":"Qon ketishi — tasnifi klinikasiga ko'ra","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Qon ketishi klinikasiga ko'ra qanday turlarga bo'linadi?","options":{"A":"Arterial, venoz, kapillyar, parenximatoz","B":"Tashqi, ichki, yashirin","C":"Birlamchi, erta ikkilamchi, kechki ikkilamchi","D":"Mexanik, neyrotrofik"},"answer":"B","explanation":"Qon ketish tasnifi klinikasiga ko'ra: tashqi, ichki, yashirin. (Anatomiyasiga ko'ra: arterial, venoz, kapillyar, parenximatoz. Aniqlanish vaqtiga ko'ra: birlamchi, erta ikkilamchi, kechki ikkilamchi.)","mnemonic":"Klinikaga ko'ra: TASHQI + ICHKI + YASHIRIN","source":"10-sinf §50, 162-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":606,"soha":"6. Tibbiy bilim asoslari","subtopic":"Nafas yetishmovchiligi — YUO'R","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Yurak-o'pka reanimatsiyasi (YUO'R) tartibi qanday?","options":{"A":"15 marta bosim, 1 marta nafas","B":"30 marta ko'krak bosish, 2 marta sun'iy nafas","C":"20 marta bosim, 3 marta nafas","D":"10 marta bosim, 2 marta nafas"},"answer":"B","explanation":"YUO'R tartibi: 30 marta qo'l bilan ko'krak qafasini bosish, 2 marta sun'iy nafas berish.","mnemonic":"YUO'R = 30 BOSIM + 2 NAFAS (30:2)","source":"10-sinf §50, 166-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":607,"soha":"6. Tibbiy bilim asoslari","subtopic":"Sun'iy nafas — og'izdan og'izga","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"'Og'izdan og'izga' sun'iy nafas berishda boshni qanday holga keltirish kerak?","options":{"A":"Boshni oldinga egib, iyakni pastga tushirish","B":"Boshni orqaga egib, iyakni yuqoriga","C":"Bosh harakatsiz holatda qolishi","D":"Boshni yon tomonga burish"},"answer":"B","explanation":"Sun'iy nafas berishda reanimator bemorning boshini ORQAGA ENGASHTIRADI va iyagini MAKSIMAL KO'TARIB, og'zini ochadi — nafas yo'li to'liq ochilishi uchun.","mnemonic":"Sun'iy nafas: BOSH ORQAGA + IYAK YUQORIGA","source":"10-sinf §50, 167-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{"id":608,"soha":"6. Tibbiy bilim asoslari","subtopic":"Suyak sinishi — ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"Suyak sinishi nima?","options":{"A":"Suyak yuzasida paydo bo'ladigan tashqi yara","B":"Suyaklar butunligining qisman yoki to'liq buzilishi bilan yuzaga keladigan shikastlanish","C":"Suyaklar orasidagi bo'g'imning noto'g'ri holatga kelishi","D":"Suyak atrofidagi mushaklarning yallig'lanishi bilan kechadigan kasallik"},"answer":"B","explanation":"Suyak sinishi — suyaklar butunligining qisman yoki to'liq buzilishi oqibatida yuz beradigan shikastlanish. Suyak singanda suyakka yaqin turgan yumshoq to'qimalar, paylar, asab tolalari, qon tomirlari ham shikastlanadi.","mnemonic":"Suyak sinishi = butunlik QISMAN yoki TO'LIQ buzilishi","source":"10-sinf §51, 168-bet","source_file":"049_birinchi_yordam.json","_unrep":false},{
