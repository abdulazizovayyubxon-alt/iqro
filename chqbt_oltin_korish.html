ovar harakatlar va hujum operatsiyalari uchun","C":"Davlat chegarasini qo'riqlash va mudofaa qilish uchun","D":"Maxsus kuchlarning jangovar topshiriqlari uchun"},"answer":"A","explanation":"Fuqarolik quroli fuqarolar tomonidan o'zini-o'zi va mulkini himoya qilish, sport bilan shug'ullanish hamda ovchilik maqsadlarida ishlatiladi. Avtomatik o't ochish imkoniyatiga ega bo'lmaydi.","mnemonic":"Fuqarolik 3 maqsad: Himoya – Sport – Ovchilik.","source":"\"Qurol to'g'risida\"gi Qonun, fuqarolik quroli","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":121,"subtopic":"Fuqarolik quroli — o'zini himoya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro o'zini himoya qilish maqsadida quyidagilardan qaysi birini qonuniy ravishda olishi mumkin?","options":{"A":"Gaz quroli (ruxsatnoma asosida)","B":"Avtomatik o't ochuvchi harbiy avtomat","C":"Granatomyot","D":"Snayper miltig'i (jangovar)"},"answer":"A","explanation":"O'zini himoya qilish quroli (gaz quroli, ovoz/yorug'lik signali beruvchi vositalar va h.k.) fuqarolik quroliga kiradi va belgilangan tartibda ruxsatnoma asosida olinadi. Avtomatik jangovar qurollar fuqarolarga taqiqlangan.","mnemonic":"Fuqaroga avtomatik jangovar qurol — YO'Q; himoya quroli — ruxsat bilan HA.","source":"\"Qurol to'g'risida\"gi Qonun, fuqarolik quroli","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":122,"subtopic":"Xizmat quroli","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Xizmat quroli kimga beriladi?","options":{"A":"Qo'riqlash vazifasi yuklatilgan tashkilot xodimlariga beriladi","B":"Voyaga yetgan har qanday fuqaroga erkin beriladi","C":"Sport bilan shug'ullanuvchi sportchilarga beriladi","D":"Harbiy bilim yurti o'quvchilariga beriladi"},"answer":"A","explanation":"Xizmat quroli qonun bilan qo'riqlash, muhofaza qilish vazifasi yuklangan yuridik shaxslar (qo'riqlash xizmatlari va h.k.) xodimlariga, xizmat majburiyatlarini bajarish uchun beriladi.","mnemonic":"Xizmat quroli = xizmat majburiyati uchun (qo'riqlash xodimlari).","source":"\"Qurol to'g'risida\"gi Qonun, xizmat quroli","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":123,"subtopic":"Harbiy qurol","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy (jangovar) qurol qaysi tuzilmalar uchun mo'ljallangan?","options":{"A":"Qurolli Kuchlar va harbiy tuzilmalar","B":"Ovchilar va ov xo'jaliklari uchun","C":"Sport klublari va to'garaklar uchun","D":"Maktab o'quvchilari uchun"},"answer":"A","explanation":"Harbiy qurol Qurolli Kuchlar, boshqa qo'shin va harbiy tuzilmalarning jangovar va operativ-xizmat vazifalarini bajarishi uchun mo'ljallangan (AK-74, PKM, SVD va boshqalar).","mnemonic":"Harbiy qurol = jangovar vazifa, Qurolli Kuchlar.","source":"\"Qurol to'g'risida\"gi Qonun, harbiy qurol","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":124,"subtopic":"Yosh chegarasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro, qoidaga ko'ra, necha yoshdan o'q-otar fuqarolik quroliga ega bo'lish huquqiga ega?","options":{"A":"18 yoshdan","B":"14 yoshdan","C":"16 yoshdan","D":"25 yoshdan"},"answer":"A","explanation":"Voyaga yetgan — 18 yoshga to'lgan fuqarolar belgilangan tartibda ruxsatnoma olib fuqarolik o'q-otar quroliga ega bo'lishi mumkin.","mnemonic":"Voyaga yetish = 18 yosh → qurol olish huquqi.","source":"\"Qurol to'g'risida\"gi Qonun, fuqarolarning huquqi","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":125,"subtopic":"Ruxsatnoma beruvchi organ","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro o'q-otar qurol sotib olish uchun ruxsatnomani qaysi organdan oladi?","options":{"A":"Ichki ishlar organlaridan","B":"Mahalla qo'mitasidan","C":"Soliq inspeksiyasidan","D":"Bojxona xizmatidan"},"answer":"A","explanation":"Qurol muomalasi ustidan davlat nazoratini ichki ishlar organlari amalga oshiradi; qurol sotib olish, saqlash va olib yurish uchun ruxsatnoma (litsenziya) ham shu organlar tomonidan beriladi.","mnemonic":"Qurol ruxsati = IIO (ichki ishlar organlari).","source":"\"Qurol to'g'risida\"gi Qonun, davlat nazorati","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":126,"subtopic":"Ro'yxatga olish muddati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro qurol sotib olgandan so'ng odatda qanday majburiyatni bajarishi shart?","options":{"A":"Belgilangan muddatda ichki organida ro'yxatga olish","B":"Hech qanday majburiyat yo'q","C":"Qurolni faqat ommaviy joyda namoyish qilishi","D":"Qurolni qo'shnisiga topshirishi"},"answer":"A","explanation":"Qurol sotib olgan fuqaro uni belgilangan muddat ichida ichki ishlar organlarida ro'yxatdan o'tkazishi shart. Ro'yxatdan o'tmagan qurol noqonuniy hisoblanadi.","mnemonic":"Sotib oldingmi → muddatida ro'yxatga oldir.","source":"\"Qurol to'g'risida\"gi Qonun, ro'yxatga olish","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":127,"subtopic":"Saqlash talablari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro o'ziga tegishli o'q-otar qurolni uyda qanday saqlashi lozim?","options":{"A":"Qulflanadigan maxsus joyda","B":"Stol ustida ochiq holda","C":"Bolalar xonasida","D":"Ko'cha eshigi yonida"},"answer":"A","explanation":"Qurol va o'q-dori boshqa shaxslar, ayniqsa voyaga yetmaganlar yeta olmaydigan tarzda, qulflanadigan maxsus joyda (seyf, temir shkaf) saqlanishi shart. Bu baxtsiz hodisa va o'g'irlikning oldini oladi.","mnemonic":"Qurol → qulfli seyf, bolalardan uzoq.","source":"\"Qurol to'g'risida\"gi Qonun, saqlash shartlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":128,"subtopic":"Olib yurish qoidalari","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun qurolni ommaviy yig'ilishlar, mitinglar va bayram tadbirlarida olib yurish taqiqlanadi?","options":{"A":"Ko'p odam to'plangan joyda quroldan foydalanish xavfli","B":"Qurol og'ir bo'lgani uchun olib yurish qiyin","C":"Qurol ifloslanishi mumkinligi sababli","D":"Bayramga bezak bo'lmagani uchun"},"answer":"A","explanation":"Ommaviy tadbirlarda ko'p odam to'planadi; bunday joyda qurolning beixtiyor yoki qasddan ishlatilishi ommaviy xavf va og'ir oqibatlar (ko'plab jabrlanuvchilar) keltirib chiqaradi. Shu sabab qonun bunday joylarda qurol olib yurishni taqiqlaydi.","mnemonic":"Ko'p odam = katta xavf → qurol taqiq.","source":"\"Qurol to'g'risida\"gi Qonun, olib yurish cheklovlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":129,"subtopic":"Spirtli ichimlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi holatlardan qaysi biri qurol olib yurish va undan foydalanishda qat'iy taqiqlanadi?","options":{"A":"Spirtli ichimlik yoki giyohvand modda ta'siri ostida bo'lganda","B":"Kunduz kuni ko'chada qurol bilan yurganda","C":"Ruxsatnoma hujjati yonida bo'lgan holatda","D":"Ov mavsumida ovchilikda foydalanganda"},"answer":"A","explanation":"Spirtli ichimlik yoki giyohvand modda ta'siridagi shaxsda nazorat va idrok susayadi; bunday holatda qurol olib yurish va undan foydalanish qat'iy taqiqlanadi.","mnemonic":"Mast holatda qurol — qat'iy YO'Q.","source":"\"Qurol to'g'risida\"gi Qonun, foydalanish cheklovlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":130,"subtopic":"Taqiqlangan qurol (fuqaro)","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri fuqarolik quroli sifatida muomalada bo'lishi TAQIQLANADI?","options":{"A":"Avtomatik tarzda uzluksiz o't ochadigan o'q-otar qurol","B":"Bir o'qli ovchilik miltig'i va karabin","C":"Sport uchun pnevmatik miltiq va to'pponcha","D":"O'zini himoya qilish uchun gaz quroli"},"answer":"A","explanation":"Avtomatik (seriyali, uzluksiz) o't ochadigan o'q-otar qurollar fuqarolik quroli sifatida muomalada bo'lishi taqiqlanadi — ular faqat harbiy/maxsus tuzilmalarga tegishli. Ovchilik, sport va gaz qurollari ruxsat etilgan turlardir.","mnemonic":"Avtomatik o't ochish = faqat harbiy, fuqaroga taqiq.","source":"\"Qurol to'g'risida\"gi Qonun, taqiqlar","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":131,"subtopic":"Taqiqlangan harakatlar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri qonunga ko'ra taqiqlangan harakat hisoblanadi?","options":{"A":"Qurolni kustar yo'l bilan tayyorlash","B":"Qurolni davlat ro'yxatidan o'tkazish","C":"Qurolni belgilangan tirda otish","D":"Qurolni seyfda saqlash"},"answer":"A","explanation":"Qurol va o'q-dorini o'zboshimchalik bilan (kustar usulda) tayyorlash, qayta jihozlash hamda noqonuniy muomalada bo'lishi taqiqlanadi va javobgarlikka sabab bo'ladi.","mnemonic":"Uyda qurol yasash = noqonuniy → taqiq.","source":"\"Qurol to'g'risida\"gi Qonun, taqiqlar","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":132,"subtopic":"Qurolni qo'llash sharti","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Fuqaro o'zini himoya qurolidan foydalanishda qanday qoidaga amal qilishi lozim?","options":{"A":"Zarur mudofaa holatida, hayot tahdidida","B":"Istalgan vaqtda, hech qanday sababsiz","C":"Janjal paytida birinchi bo'lib","D":"Faqat ko'ngil ochish uchun"},"answer":"A","explanation":"Qurol faqat zarur mudofaa (o'zini yoki o'zgalarni real tahdiddan himoya qilish) holatida, imkoniyat bo'lsa oldindan ogohlantirib qo'llaniladi. Asossiz qo'llash javobgarlikka sabab bo'ladi.","mnemonic":"Qurol = oxirgi chora, faqat real tahdidga qarshi.","source":"\"Qurol to'g'risida\"gi Qonun, qo'llash tartibi","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":133,"subtopic":"Sog'liq talabi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaro o'q-otar qurol olish uchun ruxsatnoma olishda odatda qaysi hujjatni taqdim etishi shart?","options":{"A":"Tibbiy ma'lumotnoma: ruhiy holat qurolga mos","B":"Sport razryadi haqidagi guvohnoma","C":"Chet tilini bilish sertifikati","D":"Haydovchilik guvohnomasi"},"answer":"A","explanation":"Ruxsatnoma olish uchun fuqaroning sog'lig'i, jumladan ruhiy holati quroldan foydalanishga to'sqinlik qilmasligini tasdiqlovchi tibbiy xulosa talab etiladi.","mnemonic":"Qurolga ruxsat → tibbiy (ruhiy) tekshiruv shart.","source":"\"Qurol to'g'risida\"gi Qonun, ruxsatnoma shartlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":134,"subtopic":"Ruxsatnoma rad etilishi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega o'tmishda og'ir jinoyat sodir etgan yoki ruhiy kasalligi bor shaxsga qurol ruxsatnomasi berilmaydi?","options":{"A":"Shaxs qo'li qurol atrofdagilarga jiddiy xavf tug'diradi","B":"Bunday shaxs qurolni tozalashni bilmaydi","C":"Bunday shaxs soliq to'lamaydi","D":"Bunday shaxs sport bilan shug'ullanmaydi"},"answer":"A","explanation":"Qonun ruxsatnoma berishda jamoat xavfsizligini birinchi o'ringa qo'yadi: sudlanganlik, ruhiy kasallik kabi holatlar shaxsning qurolni xavfsiz va qonuniy ishlatishiga ishonchni yo'qotadi, shuning uchun ruxsat berilmaydi.","mnemonic":"Xavf belgisi bor odam → qurolga ruxsat YO'Q (jamoat xavfsizligi ustun).","source":"\"Qurol to'g'risida\"gi Qonun, ruxsatnoma cheklovlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":135,"subtopic":"Davlat nazorati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qurol muomalasi ustidan davlat nazoratidan asosiy maqsad nima?","options":{"A":"Fuqarolar xavfsizligini ta'minlash, qurolning noqonuniy aylanishini oldini olish","B":"Davlat byudjetini to'ldirish maqsadida, soliq yig'ish va moliyaviy resurslarni oshirish","C":"Qurol narxini oshirish orqali, sanoat daromadlarini ko'paytirish va eksportni rivojlantirish","D":"Sport natijalarini yaxshilash, jamoaviy ruhni oshirish va yirik musobaqalarni qo'llab-quvvatlash"},"answer":"A","explanation":"Davlat nazorati fuqarolar va jamiyat xavfsizligini ta'minlash, qurolning noqonuniy muomalasi (qochqin, jinoyatda ishlatilishi)ning oldini olish maqsadida amalga oshiriladi.","mnemonic":"Nazorat maqsadi = xavfsizlik + noqonuniylikka chek.","source":"\"Qurol to'g'risida\"gi Qonun, davlat nazorati","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":136,"subtopic":"Yo'qolgan qurol","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Fuqaroning ro'yxatga olingan quroli o'g'irlangan yoki yo'qolgan bo'lsa, u nima qilishi shart?","options":{"A":"Ichki ishlar organlariga darhol xabar","B":"Hech kimga aytmasdan kutib turishi","C":"Yangi qurolni o'zi yasab olish","D":"Qo'shnidan qurol so'rab turishi"},"answer":"A","explanation":"Qurol o'g'irlangan yoki yo'qolgan taqdirda egasi zudlik bilan ichki ishlar organlariga xabar berishi shart — bu qurolning jinoiy maqsadda ishlatilishining oldini oladi.","mnemonic":"Qurol yo'qoldi → zudlik bilan IIO ga xabar.","source":"\"Qurol to'g'risida\"gi Qonun, egasining majburiyatlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":137,"subtopic":"Javobgarlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qurolni noqonuniy saqlash, olib yurish yoki tayyorlash qanday oqibatga olib keladi?","options":{"A":"Qonun bo'yicha javobgarlik","B":"Faqat og'zaki ogohlantirishga","C":"Hech qanday oqibatga","D":"Mukofot berishga"},"answer":"A","explanation":"Qurol to'g'risidagi qonun hujjatlarini buzish — noqonuniy saqlash, olib yurish, tayyorlash yoki sotish — qonunda belgilangan tartibda ma'muriy yoki jinoiy javobgarlikka sabab bo'ladi.","mnemonic":"Noqonuniy qurol = ma'muriy/jinoiy javobgarlik.","source":"\"Qurol to'g'risida\"gi Qonun, javobgarlik","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":138,"subtopic":"Nizom maqsadi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Ichki xizmat Nizomi nimani belgilaydi?","options":{"A":"Qurolli Kuchlarda ichki tartib va intizom","B":"Otish mashqlari va o'q uzish me'yorlarini","C":"Harbiy texnikani ta'mirlash tartibini","D":"Harbiy kiyim va farq belgilari shaklini"},"answer":"A","explanation":"Ichki xizmat Nizomi Qurolli Kuchlarda ichki tartibni ta'minlash va bo'linmalarda harbiy intizomni saqlashga qaratilgan ichki xizmatni tashkil etish tartibini belgilaydi.","mnemonic":"Ichki xizmat = ichki tartib + intizom.","source":"11-sinf §16, 43-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":139,"subtopic":"Qo'llanilish doirasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ichki xizmat Nizomi quyidagilardan qaysi biriga ham tatbiq etiladi?","options":{"A":"Harbiy yig'inlarni o'tash davridagi fuqarolarga","B":"Yuqori lavozimli generallarga","C":"Harbiy xizmatga aloqasi yo'q oddiy fuqarolarga","D":"Mamlakatdagi chet el fuqarolariga"},"answer":"A","explanation":"Nizom oddiy askar, serjant, ofitser tarkibiga, harbiy ta'lim kursantlariga, shuningdek harbiy yig'inlarni o'tash davridagi va harbiy kiyim kiyish huquqi bilan zaxiradagi fuqarolarga ham tatbiq etiladi.","mnemonic":"Yig'inga chaqirilgan fuqaro ham — Nizom doirasida.","source":"11-sinf §16, 43-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":140,"subtopic":"Qasamyodga qadar cheklov","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Vatanga qasamyod qabul qilmagan harbiy xizmatchiga nisbatan quyidagilardan qaysi biriga YO'L QO'YILMAYDI?","options":{"A":"Unga qurol-yarog' biriktirish","B":"Unga harbiy kiyim berish","C":"Uni o'quv mashg'ulotlariga olib borish","D":"Uni ovqatlantirish"},"answer":"A","explanation":"Qasamyodga qadar harbiy xizmatchi harbiy lavozimga tayinlanmaydi, jangovar vazifa va qorovullik xizmatiga jalb etilmaydi, unga qurol biriktirilmaydi va intizomiy ta'zir qo'llanmaydi.","mnemonic":"Qasamyodsiz — qurol va qorovullik YO'Q.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":141,"subtopic":"Harbiy xizmatchining huquqi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy xizmatchi xizmat majburiyatlarini bajarish mobaynida quyidagilardan qaysi huquqqa ega?","options":{"A":"Jangovar qurolni saqlash, olib yurish, ishlatish va qo'llash","B":"Buyruqlarni o'z xohishiga ko'ra bajarmaslik","C":"Garnizonni o'zboshimchalik bilan tark etish","D":"Davlat sirini oshkor qilish"},"answer":"A","explanation":"Harbiy xizmatchilar harbiy xizmat majburiyatlarini bajarish mobaynida jangovar qurolni saqlash, olib yurish, ishlatish va qo'llash huquqiga ega.","mnemonic":"Xizmatdagi huquq = qurolni saqlash/qo'llash.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":142,"subtopic":"Umumiy majburiyatlar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy xizmatchining umumiy majburiyatlaridan biri quyidagilardan qaysi?","options":{"A":"Qasamyodga sodiq bo'lish, davlat suvereniteti va hududiy yaxlitligini himoya qilish","B":"Faqat o'z manfaatini o'ylash, shaxsiy foyda uchun harakat qilish va boshqalarni e'tiborsiz qoldirish","C":"Buyruqlarni muhokama qilib turish, har doim maslahatlashish va qarorlarni kechiktirish","D":"Harbiy sirni do'stlariga aytib turish, ma'lumotlarni tarqatish va xavfsizlikni buzish"},"answer":"A","explanation":"Umumiy majburiyatlarga qasamyodga sodiqlik, xalqqa fidokorona xizmat, davlat suvereniteti va hududiy yaxlitlikni mardlarcha himoya qilish kiradi.","mnemonic":"Birinchi majburiyat — qasamyodga sodiqlik.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":143,"subtopic":"Umumiy majburiyatlar — sir","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy xizmatchi davlat, harbiy va xizmat sirlariga nisbatan qanday majburiyatga ega?","options":{"A":"Ularni sir saqlash","B":"Ularni do'stlariga aytish","C":"Ularni ijtimoiy tarmoqqa joylash","D":"Ularni e'lon qilib turish"},"answer":"A","explanation":"Umumiy majburiyatlardan biri — davlat, harbiy va xizmat sirlarini sir saqlash. Sirni oshkor qilish jiddiy javobgarlikka sabab bo'ladi.","mnemonic":"Sir — sir saqlanadi.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":144,"subtopic":"Umumiy majburiyatlar — o'rtoqlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy o'rtoqlik majburiyatiga ko'ra harbiy xizmatchi qiyin vaziyatda o'rtog'iga nisbatan nima qilishi lozim?","options":{"A":"Hayotini xavfga qo'yib, o'rtog'ini qutqarishi","B":"O'rtog'ini xavf ichida tashlab ketishi","C":"Faqat o'zini qutqarishi","D":"Komandiri kutib turishi"},"answer":"A","explanation":"Harbiy o'rtoqlikni qadrlash — kerak bo'lsa o'z hayotini ayamay o'rtog'ini xavfdan qutqarish, so'zi va ishi bilan yordamga kelish, har birining sha'ni va qadr-qimmatini hurmat qilishni anglatadi.","mnemonic":"O'rtoqlik = o'rtoqni xavfda tashlamaslik.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":145,"subtopic":"Javobgarlik turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy xizmatchilar javobgarlikning quyidagi turlaridan qaysi biriga tortilmaydi?","options":{"A":"Bunday istisno yo'q","B":"Intizomiy javobgarlik","C":"Moddiy javobgarlik","D":"Jinoiy javobgarlik"},"answer":"A","explanation":"Harbiy xizmatchilar huquqbuzarlik turiga qarab intizomiy, ma'muriy, moddiy va jinoiy javobgarlikka tortilishi mumkin (jinoyat uchun — Jinoyat kodeksiga muvofiq).","mnemonic":"4 javobgarlik: Intizomiy – Ma'muriy – Moddiy – Jinoiy.","source":"11-sinf §16, 45-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":146,"subtopic":"Javobgarlik — bitta tur","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Qoidaga ko'ra, harbiy xizmatchi bitta huquqbuzarligi uchun javobgarlikning nechta turiga tortiladi?","options":{"A":"Bitta turiga","B":"Hammasiga bir vaqtda","C":"Kamida ikkitasiga","D":"Aybga qarab cheksiz"},"answer":"A","explanation":"Adolat tamoyiliga ko'ra, harbiy xizmatchi sodir etgan bitta huquqbuzarligi uchun, qoidaga ko'ra, javobgarlikning faqat bitta turiga tortiladi.","mnemonic":"Bir ayb — bir javobgarlik.","source":"11-sinf §16, 45-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":147,"subtopic":"Ma'muriy javobgarlik cheklovi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ma'muriy huquqbuzarlik uchun muddatli harbiy xizmatchiga nisbatan quyidagilardan qaysi biri qo'llanishi MUMKIN EMAS?","options":{"A":"Jarima solish","B":"Intizomiy chora ko'rish","C":"Hayfsan e'lon qilish","D":"Ogohlantirish"},"answer":"A","explanation":"Harbiy xizmatchilarga nisbatan ma'muriy qamoq qo'llanishi mumkin emas, muddatli harbiy xizmatchilarga esa jarima solinishi ham mumkin emas — ular intizom Nizomida belgilangan tartibda javobgarlikka tortiladi.","mnemonic":"Muddatli askarga — jarima YO'Q, ma'muriy qamoq YO'Q.","source":"11-sinf §16, 45-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":148,"subtopic":"Yakkaboshchilik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Yakkaboshchilik nimani anglatadi?","options":{"A":"Komandirga bo'ysunuvchilarni idora etish huquqi va shaxsiy javobgarlik","B":"Har bir askarning mustaqil qaror qabul qilishi","C":"Komandirsiz harakat qilish","D":"Bir nechta komandir bir vaqtda buyruq berishi"},"answer":"A","explanation":"Yakkaboshchilik — harbiy boshqaruvning asosiy tamoyili; komandirga bo'ysunuvchilarni idora etish huquqi beriladi va bo'linma hamda har bir xizmatchi faoliyati uchun davlat oldida shaxsan javob berish mas'uliyati yuklanadi.","mnemonic":"Yakkaboshchilik = bitta komandir, bitta mas'uliyat.","source":"11-sinf §17, 46-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":149,"subtopic":"Komandir va bo'ysunuvchi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bo'ysunuvchi o'ziga nisbatan noto'g'ri munosabat ko'rsatilgan deb hisoblasa, qachon shikoyat qilishga haqli?","options":{"A":"Olingan buyruqni bajarib bo'lgach","B":"Buyruqni bajarmasdan turib","C":"Hech qachon","D":"Faqat boshqa qism komandiriga"},"answer":"A","explanation":"Bo'ysunuvchi komandirning buyrug'ini so'zsiz bajarishga majbur; o'ziga noto'g'ri munosabat ko'rsatilgan deb bilsa, buyruqni bajarib bo'lgach shikoyat qilishga haqli.","mnemonic":"Avval bajar — keyin shikoyat.","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":150,"subtopic":"Kattalar va kichiklar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Bir-biriga bo'ysunmaydigan harbiy xizmatchilar o'rtasida katta-kichiklik nima bilan belgilanadi?","options":{"A":"Harbiy unvonlari bilan","B":"Yoshi bilan","C":"Bo'yi bilan","D":"Xizmat staji bilan"},"answer":"A","explanation":"Bir-biriga bo'ysunmaydigan xizmatchilar o'rtasida katta-kichiklik harbiy unvonlar bilan belgilanadi; unvoni kichik xizmatchilar kattalarning qoidaviy talablarini so'zsiz bajaradi.","mnemonic":"Katta-kichik = harbiy unvon bo'yicha.","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":151,"subtopic":"Lavozim teng bo'lganda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir-biriga bo'ysunmaydigan ikki xizmatchi vazifani birga bajarmoqda, lavozimlari teng. Komandir munosabatni belgilamagan. Kim boshliq sanaladi?","options":{"A":"Harbiy unvon katta","B":"Yoshi katta xiz","C":"Bo'yi balandi x","D":"Hech kim yo'q"},"answer":"A","explanation":"Lavozimga ko'ra kattasi boshliq sanaladi; lavozimlar teng bo'lsa harbiy unvoni bo'yicha katta xizmatchi boshliq hisoblanadi (komandir boshqacha belgilamagan bo'lsa).","mnemonic":"Lavozim teng → unvon hal qiladi.","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":152,"subtopic":"Buyruq berish tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Buyruq olgan harbiy xizmatchi qanday javob berib ijroga kirishadi?","options":{"A":"\"Xo'p bo'ladi\"","B":"\"Ko'rib chiqaman\"","C":"\"Imkonim bo'lsa\"","D":"\"Keyinroq\""},"answer":"A","explanation":"Komandirning buyrug'i so'zsiz, aniq va o'z vaqtida bajarilishi shart; buyruq olgan xizmatchi \"Xo'p bo'ladi\" deb javob berib, darhol ijroga kirishadi.","mnemonic":"Buyruq → \"Xo'p bo'ladi\" → ijro.","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":153,"subtopic":"Buyruq sifatlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Komandirning buyrug'i qanday bajarilishi shart?","options":{"A":"Aniq va o'z vaqtida","B":"Imkon bo'lsa, bajarilsin","C":"Muhokamadan keyin","D":"Faqat yozma bo'lsa"},"answer":"A","explanation":"Buyruq so'zsiz, aniq va o'z vaqtida bajarilishi shart. Bu harbiy intizom va jangovar shaylikning asosidir.","mnemonic":"Buyruq 3 talab: so'zsiz – aniq – o'z vaqtida.","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":154,"subtopic":"Qonunbuzar buyruq","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun harbiy xizmatchiga qonunni buzishga yo'naltirilgan buyruq berilishi mumkin emas?","options":{"A":"Buyruq qonunchilik hujjatlari va harbiy nizomlarga muvofiq bo'lishi shart; qonunbuzar buyruq Nizomga zid","B":"Buyruqni eslab qolish qiyin bo'lgani uchun, harbiy xodimlar xotira muammolari bilan duch keladi","C":"Buyruq uzoq vaqt olgani uchun, operativlik pasayadi va vazifalar kechikadi","D":"Bo'ysunuvchi charchagani uchun, jismoniy va ruhiy kuch yetishmasligi yuzaga keladi"},"answer":"A","explanation":"Buyruq qonunchilik hujjatlari va harbiy nizomlarga muvofiq bo'lishi shart. Shu sababli harbiy xizmatga aloqasi bo'lmagan yoki qonunni buzishga yo'naltirilgan buyruq berilishi mumkin emas.","mnemonic":"Buyruq qonun doirasida bo'ladi.","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":155,"subtopic":"Buyruq — chetlab o'tish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Katta komandir vaziyat taqozosiga ko'ra bo'ysunuvchining bevosita komandirini chetlab o'tib buyruq bersa, keyin nima qiladi?","options":{"A":"Boshlig'iga xabar beradi","B":"Hech kimga xabar bermaydi","C":"Buyruqni bekor qiladi","D":"Bo'ysunuvchini jazolaydi"},"answer":"A","explanation":"Vaziyat taqozo etganda katta komandir bevosita komandirni chetlab o'tib buyruq berishi mumkin, ammo keyin bevosita boshliqqa xabar beradi yoki bo'ysunuvchining o'zi bildiruv berishini buyuradi.","mnemonic":"Chetlab o'tding → bevosita boshliqqa xabar.","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":156,"subtopic":"Harbiycha salom — kim birinchi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ikki harbiy xizmatchi uchrashganda kim birinchi bo'lib harbiycha salom beradi?","options":{"A":"Bo'ysunuvchi, kichik","B":"Yoshi kattasi","C":"Unvoni kattasi","D":"Bo'yi balandi"},"answer":"A","explanation":"Bo'ysunuvchi yoki harbiy unvoni kichik xizmatchi birinchi bo'lib salom beradi; lavozim va unvon teng bo'lsa, o'zini ko'proq tarbiyali deb biladigan xizmatchi birinchi salom beradi.","mnemonic":"Kichik (bo'ysunuvchi) — birinchi salom.","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":157,"subtopic":"Harbiycha salom — teng holat","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Lavozim va unvon teng bo'lgan ikki xizmatchidan qaysi biri birinchi salom berishi kutiladi?","options":{"A":"Tarbiyali xizmatchi","B":"Salom berish shart emas","C":"Faqat navbatchi","D":"Hech qaysi biri"},"answer":"A","explanation":"Lavozim va unvon teng bo'lganda, o'zini ko'proq tarbiya ko'rgan va xushmuomala deb biladigan xizmatchi birinchi bo'lib salom beradi — bu o'zaro hurmat va madaniyat belgisi.","mnemonic":"Teng bo'lsa — tarbiyalisi birinchi.","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":158,"subtopic":"Madhiya vaqtida xulq","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Davlat madhiyasi ijro etilganda safda turgan harbiy xizmatchilar nima qiladilar?","options":{"A":"Qadlarini rost tutadi","B":"O'tirib qoladilar","C":"Suhbatlashaveradilar","D":"Tarqalib ketadilar"},"answer":"A","explanation":"Davlat madhiyasi ijro etilganda safdagi xizmatchilar komandasiz qadlarini rost tutadilar; safdan tashqaridagi bosh kiyimlilar o'ng qo'lini bosh kiyimiga keltiradi.","mnemonic":"Madhiya → qad rost (komandasiz).","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":159,"subtopic":"Madhiya — bosh kiyimsiz","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safdan tashqarida, bosh kiyimsiz turgan xizmatchi Davlat madhiyasi ijrosida nima qiladi?","options":{"A":"Qo'l barmoqlarini ko'krakga qo'yadi","B":"O'ng qo'lini peshonasiga keltiradi","C":"Ikkala qo'lini ko'taradi","D":"Hech narsa qilmaydi"},"answer":"A","explanation":"Safdan tashqarida bosh kiyimsiz xizmatchi madhiya ijrosida qadini rost tutadi va o'ng qo'l barmoqlarini birlashtirgan holda ko'krakning chap tomoniga qo'yadi.","mnemonic":"Bosh kiyimsiz → qo'l ko'krakka (chap tomon).","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":160,"subtopic":"Vaqt taqsimoti maqsadi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy qismda vaqtning taqsimlanishi nimani ta'minlashi kerak?","options":{"A":"Jangovar shaylik, uyushgan tayyorgarlik, intizom, dam va ovqatlanish","B":"Ko'proq mashg'ulot o'tkazish, dam olishga e'tibor bermaslik","C":"Asosiy e'tibor dam olishga, boshqa vazifalar ikkinchi o'rinda","D":"Asosiy e'tibor sportga, qolgan vazifalardan voz kechiladi"},"answer":"A","explanation":"Vaqt taqsimoti qismning doimiy jangovar shayligi, jangovar tayyorgarlikning uyushgan o'tishi, intizom va tarbiya saqlanishi, o'z vaqtida dam olish va ovqatlanish uchun shart-sharoit yaratishi kerak.","mnemonic":"Vaqt taqsimoti = shaylik + tayyorgarlik + dam.","source":"11-sinf §19, 51-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":161,"subtopic":"Kun tartibi — uyqu","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Kun tartibida harbiy xizmatchi uchun necha soat uyqu ko'zda tutiladi?","options":{"A":"8 soat","B":"5 soat","C":"6 soat","D":"10 soat"},"answer":"A","explanation":"Kun tartibida 8 soat uyqu vaqti ko'zda tutilishi lozim — bu xizmatchining jangovar shayligi va sog'lig'i uchun zarur.","mnemonic":"Uyqu = 8 soat.","source":"11-sinf §19, 53-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":162,"subtopic":"Kun tartibi — ovqat oralig'i","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ovqatlanish vaqtlari orasidagi tanaffus necha soatdan oshmasligi kerak?","options":{"A":"7 soatdan","B":"12 soatdan","C":"3 soatdan","D":"10 soatdan"},"answer":"A","explanation":"Ovqatlanish vaqtlari orasidagi oraliq 7 soatdan oshmasligi kerak — bu xizmatchilarning to'g'ri ovqatlanishi va sog'lig'ini ta'minlaydi.","mnemonic":"Ovqat orasi ≤ 7 soat.","source":"11-sinf §19, 53-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":163,"subtopic":"Kun tartibi — tushlikdan keyin","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tushlikdan so'ng necha daqiqa mobaynida amaliy mashg'ulot yoki xo'jalik ishi o'tkazilmasligi lozim?","options":{"A":"30 daqiqa","B":"5 daqiqa","C":"60 daqiqa","D":"10 daqiqa"},"answer":"A","explanation":"Tushlikdan so'ng 30 daqiqa davomida amaliy mashg'ulotlar va xo'jalik ishlari o'tkazilmasligi lozim — ovqat hazm bo'lishi va qisqa dam uchun.","mnemonic":"Tushlikdan keyin 30 daqiqa — ish yo'q.","source":"11-sinf §19, 53-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":164,"subtopic":"Kun tartibi elementlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri kun tartibining tarkibiy qismidir?","options":{"A":"Badantarbiya, ko'rik, ovqatlanish, mashg'ulot, yo'qlama va uyqu","B":"Asosan kechki uyqu va tungi dam olish vaqti","C":"Kunlik uch mahal ovqatlanish tartibi","D":"Sport va jismoniy tayyorgarlik mashqlari"},"answer":"A","explanation":"Kun tartibiga ertalabki badantarbiya, ko'rik, o'quv mashg'ulotlari, ovqatlanish, qurol va texnikaga xizmat, tarbiyaviy va sport ishlari, kechki sayr, yo'qlama va 8 soat uyqu kiradi.","mnemonic":"Kun tartibi = ertadan kechgacha barcha tadbir.","source":"11-sinf §19, 53-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":165,"subtopic":"Dam olish kunlari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dam olish va bayram kunlarida quyidagilardan qaysi biri o'tkazilmaydi?","options":{"A":"Ertalabki badantarbiya","B":"Ovqatlanish","C":"Kechki yo'qlama","D":"Uyqu"},"answer":"A","explanation":"Dam olish kunlarida askarlar odatdagidan kech uyg'otilishi mumkin va bu kunlari ertalabki badantarbiya o'tkazilmaydi.","mnemonic":"Dam olish kuni → badantarbiya yo'q.","source":"11-sinf §19, 51-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":166,"subtopic":"Sutkalik naryad","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Sutkalik naryad nima maqsadda tayinlanadi?","options":{"A":"Ichki tartibni saqlash, shaxsiy tarkib va mol-mulkni qo'riqlash uchun","B":"Ovqat tarqatish va oshxona ishlarini boshqarish uchun","C":"Sport va madaniy tadbirlarni tashkil etish uchun","D":"Kelgan mehmonlar va delegatsiyalarni kutib olish uchun"},"answer":"A","explanation":"Sutkalik naryad ichki tartibni saqlash, shaxsiy tarkib, qurol-yarog', o'q-dori va mol-mulkning butligini qo'riqlash hamda xizmatning to'g'ri o'tishini ta'minlash uchun tayinlanadi.","mnemonic":"Naryad = qo'riqlash + tartib.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":167,"subtopic":"Bo'linma navbatchisi — qurol kaliti","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bo'linma bo'yicha navbatchi qurol saqlash xonasining kalitini qanday saqlaydi?","options":{"A":"Doimo o'z yonida olib yuradi va hech kimga bermaydi","B":"Bo'linma ofisidagi stol tortmasida qoldiradi","C":"Navbatdagi istalgan askarga topshirib turadi","D":"Qurol xonasi eshigi tagiga yashirib qo'yadi"},"answer":"A","explanation":"Bo'linma navbatchisi qurol saqlash xonasining kalitini doimo o'z yonida olib yuradi va hech kimga bermaydi; qurolni faqat komandir buyrug'i bilan, daftarga qayd kiritib beradi.","mnemonic":"Qurol xonasi kaliti — faqat navbatchida.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":168,"subtopic":"Bo'linma navbatchisi — qurol berish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bo'linma navbatchisi qurol va o'q-dorini qanday hollarda beradi?","options":{"A":"Faqat bo'linma komandiri buyrug'i bilan, daftarga qayd qilib","B":"Istalgan vaqtda, hujjatsiz va qaydsiz beradi","C":"Faqat tungi soatlarda, og'zaki so'rovga ko'ra","D":"O'z xohishi va shaxsiy qaroriga ko'ra beradi"},"answer":"A","explanation":"Qurol va o'q-dori faqat bo'linma komandiri (boshlig'i)ning buyrug'iga ko'ra, daftarga tegishli qaydlar kiritilgan holda beriladi. Qabul qilishda qurollar donalab, raqami bo'yicha tekshiriladi.","mnemonic":"Qurol berish = komandir buyrug'i + daftar.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":169,"subtopic":"Bo'linma navbatchisi — trevoga","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Trevoga!\" yoki \"Yig'in!\" signali e'lon qilinganda bo'linma navbatchisi avvalo nima qiladi?","options":{"A":"Tarkibni uyg'otadi, xabar beradi","B":"Uxlashda davom etadi","C":"Eshikni ochiq qoldiradi","D":"Qurolni hammaga tarqatadi"},"answer":"A","explanation":"\"Trevoga!\"/\"Yig'in!\" e'lon qilinganda navbatchi shaxsiy tarkibni uyg'otadi, kontrakt bo'yicha xizmatchilarga xabar beradi va ular yetib kelguniga qadar tezkor navbatchi ko'rsatmalarini bajaradi.","mnemonic":"Trevoga → uyg'otish + xabar berish.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":170,"subtopic":"Bo'linma navbatchisi — yong'in","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bo'linmada yong'in sodir bo'lganda navbatchining harakatlari qaysi tartibda bo'lishi to'g'ri?","options":{"A":"O'chirish komandasini chaqirtirish, choralar ko'rish, komandirga xabar berish","B":"Hech narsa qilmasdan chetda jim kuzatib turishni davom ettirish","C":"Avval o'zi dam olib, keyin xabar berishni boshlash","D":"Hech kimga aytmasdan yolg'iz o'zi o'chirishga urinish"},"answer":"A","explanation":"Yong'inda navbatchi yong'in o'chirish komandasini chaqirtiradi, o'chirish choralarini ko'radi, zudlik bilan tezkor navbatchi va komandirga bildiruv beradi hamda xavf ostidagi xonalardan shaxsiy tarkib, qurol va mol-mulkni olib chiqish choralarini ko'radi.","mnemonic":"Yong'in: chaqir → o'chir → xabar → olib chiq.","source":"11-sinf §20, 56-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":171,"subtopic":"Bo'linma navbatchisi — bo'ysunish","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Bo'linma bo'yicha navbatchi ichki xizmat masalalarida kimga bo'ysunadi?","options":{"A":"Komandiri va ta'minot o'rinbosariga","B":"Boshqa bo'linma askarlariga","C":"Hech kimga","D":"Oshxona va omborxona xodimlariga"},"answer":"A","explanation":"Bo'linma navbatchisi harbiy qism bo'yicha tezkor navbatchi va yordamchisiga, bo'linmadagi ichki xizmat bo'yicha esa bo'linma komandiri va uning ta'minot bo'yicha o'rinbosariga bo'ysunadi.","mnemonic":"Navbatchi → tezkor navbatchi + bo'linma komandiri.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":172,"subtopic":"Komandir mas'uliyati","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Komandir bo'ysunuvchining insoniy qadr-qimmatini kamsituvchi xatti-harakat sodir etsa, qanday oqibat bo'ladi?","options":{"A":"Komandir javobgarlikka tortiladi","B":"Hech qanday oqibat bo'lmaydi","C":"Bo'ysunuvchi jazolanadi","D":"Komandir mukofotlanadi"},"answer":"A","explanation":"Komandir bo'ysunuvchi uchun xushmuomalalik va o'zini idora etishda ibrat bo'lishi lozim; bo'ysunuvchining qadr-qimmatini kamsituvchi xatti-harakat sodir etgan komandir javobgarlikka tortiladi.","mnemonic":"Qadr-qimmatni kamsitish = komandir uchun javobgarlik.","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":173,"subtopic":"Xizmat murojaati tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy xizmatchi xizmatga oid masala bo'yicha avvalo kimga murojaat qiladi?","options":{"A":"O'zining bevosita komandiriga","B":"To'g'ridan-to'g'ri eng katta boshliqqa","C":"Boshqa qism komandiriga","D":"Fuqarolik tashkilotiga"},"answer":"A","explanation":"Xizmatga oid masalalar bo'yicha xizmatchi avvalo o'zining bevosita komandiriga murojaat qiladi va uning ruxsati bilan qo'mondonlik pog'onasi bo'yicha navbatdagi komandirga murojaat qilishi mumkin.","mnemonic":"Murojaat — avval bevosita komandirga.","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":174,"subtopic":"Buyruq yetkazish usullari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Buyruq (buyruqnoma) qanday usullarda yetkazilishi mumkin?","options":{"A":"Og'zaki, yozma, texnik","B":"Yozma shaklda, imzo bilan","C":"Og'zaki, og'izdan-og'izga","D":"Imo-ishora va belgilar orqali"},"answer":"A","explanation":"Buyruq harbiy xizmatchiga yoki bo'linmaga og'zaki va yozma tarzda, texnik aloqa vositalari yordamida yoki oldindan belgilangan signallar orqali yetkazilishi mumkin.","mnemonic":"Buyruq: og'zaki / yozma / aloqa / signal.","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":175,"subtopic":"Buyruq bajarilgach","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Buyruqni bajarib bo'lgan xizmatchi nima qilishi shart?","options":{"A":"Buyruq bergan va o'zining bevosita komandiriga bildiruv berishi","B":"Hech kimga hech narsa bildirmasdan jim turishi","C":"Faqat yaqin o'rtog'iga aytib qo'yishi kifoya","D":"Indamay yangi buyruqni kutib turishi kerak"},"answer":"A","explanation":"Olingan buyruq bajarilgani bo'yicha xizmatchi buyruq bergan komandirga va o'zining bevosita komandiriga bildiruv berishga majbur.","mnemonic":"Bajardingmi → bildiruv ber (ikkalasiga).","source":"11-sinf §18, 48-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":176,"subtopic":"Harbiycha salom ahamiyati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiycha salom berish nimaning ifodasi sanaladi?","options":{"A":"Harbiy hurmat va madaniyat","B":"Faqat rasmiyatchilik","C":"Charchoqni ko'rsatish","D":"Buyruq berish usuli"},"answer":"A","explanation":"Harbiycha salom — xizmatchilarning birodarlarcha jipsligining ifodasi, o'zaro hurmat va mushtarak madaniyat namoyon bo'lishining belgisi. Barcha xizmatchilar uchrashganda salom berishga majbur.","mnemonic":"Salom = hurmat + jipslik belgisi.","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":177,"subtopic":"Safda komanda bo'yicha salom","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yurib ketayotgan safda harbiycha salom berish uchun komandani kim beradi?","options":{"A":"Faqat boshliq komandir","B":"Har bir askar o'zi","C":"Eng kichik unvonli","D":"Navbatchi"},"answer":"A","explanation":"Yurib ketayotgan safda salom berish uchun komandani faqat boshliq beradi; shu komandaga ko'ra butun saf birdek salom bajaradi.","mnemonic":"Yurar safda salom komandasi — faqat boshliqdan.","source":"11-sinf §18, 49-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":178,"subtopic":"Sutkalik naryad — javobgarlik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bo'linma navbatchisi qurollarni qabul qilib olayotganda ularni qanday tekshiradi?","options":{"A":"Donalab, raqamiga ko'ra va butligicha","B":"Umumiy sonini sanab","C":"Tekshirmasdan qabul qiladi","D":"Tashqi ko'rinishiga qarab"},"answer":"A","explanation":"Navbatchi qurollarni qabul qilib olayotganda donalab, raqami bo'yicha va butligicha tekshirib oladi — bu qurol yo'qolishi yoki almashtirilishining oldini oladi.","mnemonic":"Qurol qabul: donalab + raqam + butlik.","source":"11-sinf §20, 55-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":179,"subtopic":"Ommaviy tadbirlar vaqti","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Majlis, kinofilm namoyishi kabi ommaviy tadbirlar qachongacha yakunlanishi lozim?","options":{"A":"Kechki sayrga qadar","B":"Yarim tungacha","C":"Uyqudan keyin","D":"Cheklov yo'q"},"answer":"A","explanation":"Majlislar, yig'ilishlar, spektakl va kinofilmlar namoyishi hamda boshqa ommaviy tadbirlar kechki sayrga qadar yakunlanishi lozim (dam olish arafasida 1 soat kechiktirishga ruxsat beriladi).","mnemonic":"Ommaviy tadbir — kechki sayrgacha tugaydi.","source":"11-sinf §19, 53-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":180,"subtopic":"Konstitutsiyaga rioya","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy xizmatchining umumiy majburiyatlaridan biri qaysi hujjatga qat'iy rioya qilishni talab etadi?","options":{"A":"Konstitutsiya va qonunlar hamda harbiy nizomlarga rioya qilishni","B":"O'z bo'linmasining ichki tartib-qoidalariga rioya qilishni","C":"Chet el davlatlarining harbiy qonun-qoidalariga rioya qilishni","D":"Og'zaki an'ana va mahalliy urf-odatlarga rioya qilishni"},"answer":"A","explanation":"Umumiy majburiyatlardan biri — O'zbekiston Respublikasi Konstitutsiyasi va qonunlariga qat'iy rioya qilish, harbiy nizomlar talablarini bajarish.","mnemonic":"Majburiyat = Konstitutsiya + qonun + nizomga rioya.","source":"11-sinf §16, 44-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":181,"subtopic":"Komandirning idora huquqi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Komandir bo'ysunuvchiga nisbatan qanday huquqqa ega?","options":{"A":"Buyruq berish va uning ijrosini talab qilish","B":"Uni qonunsiz jazolash","C":"Uning qadr-qimmatini kamsitish","D":"Unga shaxsiy ishlarini bajartirish"},"answer":"A","explanation":"Komandir bo'ysunuvchiga buyruq berish va uning ijrosini talab qilishga haqli, lekin xushmuomala bo'lishi, noxolis munosabat va qadr-qimmatni kamsitishga yo'l qo'ymasligi lozim.","mnemonic":"Komandir huquqi = buyruq + ijro talabi (hurmat bilan).","source":"11-sinf §17, 47-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":182,"subtopic":"Jinoyat uchun javobgarlik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy xizmatchi sodir etgan jinoyat uchun qaysi hujjatga muvofiq javobgarlikka tortiladi?","options":{"A":"O'zbekiston Jinoyat kodeksiga","B":"Ichki xizmat Nizomiga","C":"Bevosita komandir qaroriga","D":"Mehnat kodeksiga"},"answer":"A","explanation":"Harbiy xizmatchilar sodir etgan jinoyatlari uchun O'zbekiston Respublikasi Jinoyat kodeksiga muvofiq jinoiy javobgarlikka tortiladilar.","mnemonic":"Jinoyat → Jinoyat kodeksi.","source":"11-sinf §16, 45-bet","source_file":"035_ichki_xizmat_nizomi.json","_unrep":false},{"id":183,"subtopic":"Garnizon xizmati ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Garnizon xizmati nima?","options":{"A":"Garnizonda intizom saqlash, naryad xizmati va tadbirlarni tashkil etish","B":"Qurol-yarog'ni tozalash va ta'mirlash jarayoni","C":"Otish mashqlari va o'q uzishni o'tkazish tartibi","D":"Harbiy parad va tantanali marosim o'tkazish"},"answer":"A","explanation":"Garnizon xizmati — garnizon shaxsiy tarkibi orasida yuksak harbiy intizomni saqlash, garnizon naryad xizmatini tashkil etish va qo'shinlar ishtirokidagi tadbirlarni sifatli o'tkazish maqsadida tashkillashtiriladigan tadbirlar kompleksidir.","mnemonic":"Garnizon xizmati = intizom + naryad + tadbirlar.","source":"11-sinf §21, 57-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":184,"subtopic":"Qorovullik xizmati ta'rifi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qorovullik xizmati asosan nimaga mo'ljallangan?","options":{"A":"Qurol, texnika va vositalar omborlari hamda harbiy obyektlarni qo'riqlash","B":"Harbiy oshxonada ovqat tayyorlash va tarqatish","C":"Harbiy kiyim-kechak tikish va ta'mirlash","D":"Mashg'ulotlar jadvalini tuzish va nazorat qilish"},"answer":"A","explanation":"Qorovullik xizmati qurol-yarog', harbiy va maxsus texnika hamda moddiy vositalar saqlanadigan omborlarni, boshqa harbiy va davlat obyektlarini ishonchli qo'riqlash va mudofaa qilish, gauptvaxta yoki intizomiy qismdagi xizmatchilarni qo'riqlash uchun mo'ljallangan.","mnemonic":"Qorovullik = obyektlarni qo'riqlash + mudofaa.","source":"11-sinf §21, 58-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":185,"subtopic":"Qorovullik — jangovar vazifa","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun qorovullik xizmatini o'tash jangovar vazifani bajarish hisoblanadi?","options":{"A":"Obyektlarni qurol bilan himoya qilish","B":"U faqat kunduzi o'taladi, kechasi yo'q","C":"U faqat hujjat to'ldirishdan iborat","D":"U jismoniy mashq hisoblanadi"},"answer":"A","explanation":"Qorovullik xizmati muhim obyektlarni qurolli himoya qilishni o'z ichiga oladi va shaxsiy tarkibdan Nizom qoidalariga to'la amal qilish, hushyorlik, qat'iylik va tashabbuskorlikni talab etadi — shuning uchun u jangovar vazifa sanaladi.","mnemonic":"Qorovullik = jangovar vazifa (hushyorlik + qat'iylik).","source":"11-sinf §21, 58-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":186,"subtopic":"Qorovul ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qorovul deb nimaga aytiladi?","options":{"A":"Qurollangan bo'linma","B":"Bitta soqchiga, boshqa yo'q","C":"Oshxona xodimlariga","D":"Harbiy orkestrga, ham"},"answer":"A","explanation":"Qorovul — harbiy va davlat obyektlarini qo'riqlash va mudofaa qilish jangovar vazifasini bajarish uchun mo'ljallangan, shuningdek gauptvaxta va intizomiy qismdagi xizmatchilarni qo'riqlovchi qurollangan bo'linmadir.","mnemonic":"Qorovul = qurollangan BO'LINMA (jamoa).","source":"11-sinf §21, 58-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":187,"subtopic":"Ichki qorovul","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ichki qorovul nima maqsadda tayinlanadi?","options":{"A":"Harbiy qismning obyektlarini qo'riqlash va mudofaa","B":"Butun davlat chegarasini qo'riqlash uchun, hamma vaqt","C":"Faqat shahar ko'chalarini qo'riqlash uchun doim","D":"Xalqaro obyektlarni qo'riqlash uchun, doimiy"},"answer":"A","explanation":"Ichki qorovul bir harbiy qism (muassasa)ning obyektlarini qo'riqlash va mudofaa qilish uchun tayinlanadi.","mnemonic":"Ichki qorovul = bitta qism obyektlari.","source":"11-sinf §21, 58-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":188,"subtopic":"Qorovul tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri qorovul tarkibiga kiradi?","options":{"A":"Boshliq, soqchilar","B":"Oshpaz va oshxona xodimlari","C":"Avtomashina haydovchilari","D":"Tibbiyot xodimi va shifokor"},"answer":"A","explanation":"Qorovul tarkibiga qorovul boshlig'i, post va almashuvlar soni bo'yicha qorovullar (soqchilar), tarqatuvchi, qorovul boshlig'ining yordamchilari, operatorlar, it xizmati yordamchisi va haydovchilar kiradi.","mnemonic":"Qorovul yadrosi = boshliq + soqchilar + tarqatuvchi.","source":"11-sinf §21, 58-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":189,"subtopic":"Soqchi ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Soqchi deb kimga aytiladi?","options":{"A":"Taqsimlangan postni himoya qiluvchi qurolli qorovul","B":"Oshxonada xizmat qiluvchi oddiy askarga","C":"Mashg'ulot o'tkazuvchi o'qituvchiga","D":"Qurol tozalovchi maxsus xodimga"},"answer":"A","explanation":"Soqchi — o'ziga topshirilgan postni qo'riqlash va mudofaa qilish bo'yicha jangovar vazifani bajaruvchi qurollangan qorovuldir. Soqchilar obyektlarni bevosita qo'riqlash uchun qo'yiladi.","mnemonic":"Soqchi = postni qo'riqlovchi qurollangan qorovul.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":190,"subtopic":"Soqchi — qurolni bermaslik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi o'z qurolini kimlarga berishi mumkin?","options":{"A":"Hech kimga, hatto o'zi bo'ysunadigan shaxslarga ham bermaydi","B":"Faqat qorovul boshlig'ining shaxsan o'ziga beradi","C":"Almashuvga kelgan istalgan askarga beradi","D":"Ovqat tarqatuvchiga vaqtincha berib turadi"},"answer":"A","explanation":"Soqchi sergak xizmat qiladi, qurolini qo'lidan qo'ymaydi va hech kimga, hatto o'zi bo'ysunadigan shaxslarga ham bermaydi.","mnemonic":"Soqchi qurolini HECH KIMGA bermaydi.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":191,"subtopic":"Postni tashlab ketmaslik","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Soqchi hayoti xavf ostida qolsa, postni tashlab ketishi mumkinmi?","options":{"A":"Yo'q, navbat almashmasa, xavfda ham","B":"Ha, xavf bo'lsa darhol ketadi","C":"Ha, agar charchasa","D":"Ha, ovqatlanish uchun"},"answer":"A","explanation":"Soqchi navbat almashmaguncha yoki postdan olinmaguncha, hayoti xavf ostida qolsa ham postni tashlab ketmaydi. Postni o'zboshimchalik bilan tashlab ketish harbiy jinoyat hisoblanadi.","mnemonic":"Postni tashlash = harbiy jinoyat.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":192,"subtopic":"Soqchi bo'ysunishi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi postda turganida faqat kimlarga bo'ysunadi?","options":{"A":"Qorovul boshlig'i, uning yordamchisi va o'z tarqatuvchisiga","B":"Garnizonda turgan har qanday ofitser-zobitga","C":"Faqat o'zining harbiy qism komandiriga","D":"Atrofdagi barcha harbiy xizmatchilarga"},"answer":"A","explanation":"Soqchining daxlsizligiga ko'ra, u faqat qorovul boshlig'iga, uning yordamchisiga va o'zining tarqatuvchisigagina bo'ysunadi.","mnemonic":"Soqchi 3 kishiga bo'ysunadi: boshliq – yordamchi – tarqatuvchi.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":193,"subtopic":"Soqchi daxlsizligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Soqchining daxlsizligi nimalarda ko'rinadi?","options":{"A":"Qonun bilan himoyalanib, faqat belgilangan shaxslarga bo'ysunishida","B":"Undan ovqat va suv yordami so'ralmasligida","C":"Unga navbat bilan qisqa dam berib turilishida","D":"U bilan erkin suhbat va muloqot qurilishida"},"answer":"A","explanation":"Soqchi daxlsizligi: huquqlari va qadr-qimmati qonun bilan himoyalanadi; barcha shaxslar uning xizmat talablarini so'zsiz bajaradi; u faqat belgilangan shaxslarga bo'ysunadi; Nizomda ko'rsatilgan hollarda qurol qo'llash huquqiga ega.","mnemonic":"Daxlsizlik = qonun himoyasi + talablar bajariladi + qurol huquqi.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":194,"subtopic":"Soqchiga taqiqlar","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Postda turgan soqchiga quyidagilardan qaysi biri TAQIQLANADI?","options":{"A":"Uxlash, o'tirish, suyanish, ovqat","B":"Postni doimiy kuzatish va nazorat qilish","C":"Qurolni qo'lda ushlab turish va xavfsiz saqlash","D":"Qorovul boshlig'iga xabar berish"},"answer":"A","explanation":"Soqchiga uxlash, o'tirish, biror narsaga suyanish, yozish, o'qish, kuylash, gaplashish, ovqatlanish, chekish, tabiiy ehtiyojga borish hamda keraksiz paytda o'qdonga patron joylash taqiqlanadi.","mnemonic":"Postda YO'Q: uxlash, o'tirish, ovqat, chekish, suhbat.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":195,"subtopic":"Soqchi savol javobi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi kimlarning savollariga javob berishi kerak?","options":{"A":"Faqat boshliq, yordamchisi, tarqatuvchisi, tekshirish","B":"Har qanday o'tkinchining savollariga javob berish","C":"Hech kimning savollariga javob berish","D":"Faqat jurnalistlarning savollariga javob berish"},"answer":"A","explanation":"Soqchi faqat qorovul boshlig'i, uning yordamchisi, o'z tarqatuvchisi va tekshirish uchun kelgan shaxsning savollariga javob beradi — boshqalar bilan suhbatlashish taqiqlanadi.","mnemonic":"Soqchi javob beradi — faqat 4 shaxsga.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":196,"subtopic":"Ogohlantirishsiz qurol","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi qaysi holatda ogohlantirishsiz qurol qo'llashga majbur?","options":{"A":"O'ziga yoki obyektiga aniq hujum bo'lganda","B":"Har qanday odam yaqinlashganda","C":"Kechasi kimdir o'tib ketganda","D":"Tarqatuvchi kelganda"},"answer":"A","explanation":"Soqchi o'ziga yoki qo'riqlanayotgan obyektiga aniq hujum bo'lgan hollarda ogohlantirishsiz qurol qo'llashga majbur.","mnemonic":"Aniq hujum → ogohlantirishsiz qurol.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":197,"subtopic":"To'xtatish komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi postga yaqinlashgan begona shaxsni qaysi komanda bilan to'xtatadi?","options":{"A":"To'xta, orqaga!","B":"Tinch tur!","C":"Qadam tashla!","D":"Saf tort!"},"answer":"A","explanation":"Soqchi postga yoki taqiqlangan chegaraga yaqinlashgan begona shaxsni \"To'xta, orqaga!\" yoki \"To'xta, o'ngdan (chapdan) aylanib o't!\" deb to'xtatishga haqli.","mnemonic":"Birinchi komanda: \"To'xta, orqaga!\"","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":198,"subtopic":"Qurol qo'llash ketma-ketligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Tartibbuzar \"To'xta, orqaga!\" talabini bajarmay davom etsa, soqchining keyingi to'g'ri harakati qaysi?","options":{"A":"To'xta, otaman! deb chaqiradi","B":"Darhol odamni mo'ljallab otadi","C":"Postni tashlab qochadi","D":"Hech narsa qilmaydi"},"answer":"A","explanation":"Talab bajarilmasa soqchi \"To'xta, otaman!\" deb ogohlantiradi va qorovul boshlig'i/tarqatuvchini chaqiradi. Tartibbuzar davom etsa, o'qdonga patron yuborib, osmonga ogohlantiruvchi o'q uzadi. Shunda ham talab bajarilmasa va kirish/qochishga urinsa — qurol ishlatadi.","mnemonic":"Ketma-ketlik: \"To'xta otaman!\" → chaqir → osmonga o'q → so'ng qurol.","source":"11-sinf §22, 60-61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":199,"subtopic":"Ko'rish yomon sharoit","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ko'rinish yomon bo'lgan sharoitda postga noma'lum shaxs yaqinlashsa, soqchi qaysi komandani beradi?","options":{"A":"\"To'xta, kim kelyapti?\"","B":"\"To'xta, orqaga!\"","C":"\"Qolganlar joyida qolsin!\"","D":"\"Saf tort!\""},"answer":"A","explanation":"Ko'rinish yomon bo'lganda, post tabelida ko'rsatilgan masofadan yaqinlashganlar ko'rinmay qolganda soqchi \"To'xta, kim kelyapti?\" deb baqirib to'xtatadi; javob bo'lmasa \"To'xta, otaman!\" deb ogohlantiradi.","mnemonic":"Qorong'ida: \"To'xta, kim kelyapti?\"","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":200,"subtopic":"Boshliq kelganda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Qorovul boshlig'i kelyapti\" javobini eshitgan soqchi qanday buyruq beradi?","options":{"A":"Qorovul boshlig'i oldimda!","B":"Hamma yaqinlashsin!","C":"To'xta, orqaga!","D":"Tinch tur!"},"answer":"A","explanation":"Soqchi \"Qorovul boshlig'i (yordamchi/tarqatuvchi) mening oldimga, qolganlar joyida qolsin!\" deb buyradi. Ishonch hosil qilgach (zarurat bo'lsa yuzini yoritishni talab qilib), qolganlarni ham yaqin qo'yadi.","mnemonic":"Boshliq oldimga — qolganlar joyida!","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":201,"subtopic":"Soxta boshliq","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"O'zini qorovul boshlig'i deb tanishtirgan shaxs aslida boshqa kishi bo'lib chiqsa va birga kelganlar \"joyida qolsin\" talabini bajarmasa, soqchi nima qiladi?","options":{"A":"To'xta, otaman! deb, qurol qo'llaydi","B":"Hammasini yaqin qo'yadi","C":"Postni tark etadi","D":"Ularga qo'shilib ketadi"},"answer":"A","explanation":"O'zini boshliq deb tanishtirgan shaxs soxta bo'lsa va hamrohlari \"Qolganlar joyida qolsin!\" talabini bajarmasa, soqchi \"To'xta, otaman!\" deb ogohlantiradi; bajarmasalar ularga nisbatan qurol qo'llaydi.","mnemonic":"Soxta boshliq + itoatsizlik → ogohlantirib qurol.","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":202,"subtopic":"Qo'l jangi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Obyektni va o'zini himoya qilish uchun qo'l jangiga kirishga to'g'ri kelsa, soqchi nima bilan harakat qiladi?","options":{"A":"Nayza-pichoq bilan","B":"Faqat qichqiradi","C":"Qochib ketadi","D":"Hech narsa qilmaydi"},"answer":"A","explanation":"Qo'riqlanayotgan obyektni va o'zini himoya qilish uchun qo'l jangiga kirishga zarurat tug'ilsa, soqchi nayza-pichoq (nayza) va qo'ndoq bilan qo'rqmasdan dadil harakat qilishi kerak.","mnemonic":"Qo'l jangida — nayza-pichoq + qo'ndoq.","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":203,"subtopic":"Post ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Post nima?","options":{"A":"Soqchiga topshirilgan narsa va majburiyat","B":"Qorovulxona binosining o'zi","C":"Oshxona va ovqatlanish maydoni","D":"Mashg'ulot va sport maydoni"},"answer":"A","explanation":"Post — qo'riqlash va mudofaa qilish uchun soqchiga topshirilgan barcha narsa, u o'z majburiyatini bajarayotgan joy yoki yer uchastkasidir. Texnik vositalar bilan qo'riqlanadigan obyektlar ham postga kiradi.","mnemonic":"Post = soqchiga topshirilgan joy + qo'riqlanadigan narsa.","source":"11-sinf §22, 62-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":204,"subtopic":"Postni qo'riqlash usuli","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi obyektni qanday usullarda qo'riqlaydi?","options":{"A":"Patrullik qiladi","B":"Bir joyda o'tirgan holda","C":"Vaqti-vaqti bilan uxlab","D":"Uzoqlashib turadi"},"answer":"A","explanation":"Soqchi obyektni ichki va tashqi devor oralig'ida (yoki bitta devor bo'lsa, devorning ichki tomoni bo'ylab) patrullik qilib, shuningdek kuzatuv (pozitsiyaviy) minoralaridan turib kuzatish orqali qo'riqlaydi. Ayrim postlarni joyida turib qo'riqlash mumkin.","mnemonic":"Qo'riqlash = patrul + minoradan kuzatuv.","source":"11-sinf §22, 62-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":205,"subtopic":"Soqchi — qurol holati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi postda qurolni qanday holatda saqlaydi?","options":{"A":"Qurol o'qlangan, tayyor","B":"O'qsiz qurol bilan doimo","C":"Qurolni yerga qo'yib","D":"Qurolni qorovulxonada"},"answer":"A","explanation":"Soqchi postda o'qlangan qurol bilan doimo harakatga (otishga) tayyor turadi, lekin keraksiz paytda o'qdonga patron joylash taqiqlanadi.","mnemonic":"Postda — o'qlangan qurol, doimo tayyor.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":206,"subtopic":"Begona shaxsni kiritmaslik","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi taqiqlangan chegaradan ichkariga kimlarni kiritishi mumkin?","options":{"A":"Qorovul boshlig'i, yordamchisi, tarqatuvchisi va ular kuzatuvidagilarni","B":"Garnizondagi har qanday harbiy xizmatchi va askarni","C":"Atrofda istiqomat qiluvchi mahalliy aholi vakillarini","D":"Hech kimni, hatto o'z qism boshlig'ini ham kiritmaydi"},"answer":"A","explanation":"Soqchi post tabelida ko'rsatilgan taqiqlangan, chegara ko'rsatkichlari bilan ajratilgan joydan ichkariga faqat qorovul boshlig'i, uning yordamchisi, o'z tarqatuvchisi va ular kuzatuvida kelgan shaxslarni kiritadi.","mnemonic":"Ichkariga — faqat boshliq, yordamchi, tarqatuvchi (+ kuzatuvdagilar).","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":207,"subtopic":"Soqchi — kuzatuv","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi xizmat davomida nimani diqqat bilan kuzatadi?","options":{"A":"Postga keladigan yo'llar","B":"Faqat osmonni kuzatadi","C":"Faqat o'z qurolini tekshiradi","D":"Boshqa postdagi soqchini"},"answer":"A","explanation":"Soqchi ko'rsatilgan yo'nalish bo'yicha harakatlanib yoki minorada turib, postga keladigan yo'llarni va to'siqlarni diqqat bilan kuzatadi va belgilangan vaqtlarda xizmat borishi haqida aloqa orqali bildiruv beradi.","mnemonic":"Kuzat: yo'llar + to'siqlar.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":208,"subtopic":"Soqchi — buzilish aniqlasa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi obyekt to'sig'ida buzilgan joy yoki qo'shni postda tartib buzilganini aniqlasa, nima qiladi?","options":{"A":"Qorovul boshlig'ini chaqiradi","B":"O'zi borib tuzatadi","C":"E'tibor bermaydi","D":"Postni tashlab boradi"},"answer":"A","explanation":"Obyekt to'siqlarida buzilish, o'z posti yaqinida yoki qo'shni postda tartibbuzarlik aniqlanganda soqchi qorovul boshlig'ini chaqiradi (postni tashlab ketmaydi).","mnemonic":"Buzilish ko'rding → boshliqni chaqir (postda qol).","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":209,"subtopic":"It hurganda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi qorovul itining hurganini eshitsa, nima qiladi?","options":{"A":"Qorovulxonaga xabar beradi","B":"E'tibor bermaydi","C":"Itni jim qildiradi","D":"Postni tark etib boradi"},"answer":"A","explanation":"Soqchi itning hurganini eshitgan zahoti bu haqda qorovulxonaga xabar beradi — bu yaqin atrofdagi xavf yoki tartibbuzarlik belgisi bo'lishi mumkin.","mnemonic":"It hurdi → qorovulxonaga xabar.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":210,"subtopic":"Garnizon rahbarligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Garnizon hududida qorovullik xizmatiga kim rahbarlik qiladi?","options":{"A":"Garnizon boshlig'i","B":"Mudofaa vaziri shaxsan","C":"Mahalla raisi","D":"Qism oshpazi"},"answer":"A","explanation":"Qorovullik xizmatiga: O'zbekiston hududida — Mudofaa vaziri, harbiy okrug hududida — okrug qo'shinlari qo'mondoni, garnizon hududida esa garnizon boshlig'i rahbarlik qiladi.","mnemonic":"Garnizon hududi → garnizon boshlig'i.","source":"11-sinf §21, 57-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":211,"subtopic":"Mamlakat bo'yicha rahbarlik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"O'zbekiston Respublikasi hududida qorovullik xizmatiga kim rahbarlik qiladi?","options":{"A":"O'zbekiston Mudofaa vaziri","B":"Garnizon boshlig'i","C":"Qorovul boshlig'i","D":"Tarqatuvchi"},"answer":"A","explanation":"O'zbekiston Respublikasi hududida qorovullik xizmatiga O'zbekiston Respublikasi Mudofaa vaziri rahbarlik qiladi.","mnemonic":"Butun mamlakat → Mudofaa vaziri.","source":"11-sinf §21, 57-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":212,"subtopic":"Garnizon tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Garnizon nimani o'z ichiga oladi?","options":{"A":"Harbiy qismlar, tuzilmalar","B":"Bitta kazarma binosini","C":"Oshxona va omborxonani","D":"Yagona qorovulxonani"},"answer":"A","explanation":"Garnizon — belgilangan chegaralarda, ma'lum aholi punktida yoki hududda doimiy yoki vaqtincha joylashgan harbiy qismlar, qo'shin tuzilmalari, oliy harbiy ta'lim va vazirlik muassasalarini o'z ichiga oladi.","mnemonic":"Garnizon = bir hududdagi barcha harbiy qismlar.","source":"11-sinf §21, 57-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":213,"subtopic":"Soqchi sergaklik","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Soqchining asosiy majburiyati nima?","options":{"A":"Postni sergaklik bilan himoya","B":"Qorovulxonani tozalash","C":"Ovqat tarqatish","D":"Hujjat to'ldirish"},"answer":"A","explanation":"Soqchining asosiy majburiyati — o'z postini sergaklik bilan qo'riqlash va qat'iyat bilan mudofaa qilish, hech narsaga chalg'imasdan sergak xizmat qilishdir.","mnemonic":"Soqchi = sergaklik + qat'iyat.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":214,"subtopic":"Yong'in vositalari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi postda yong'in chiqsa, nimadan foydalana bilishi kerak?","options":{"A":"Postdagi yong'inni o'chirishning birlamchi vositalaridan","B":"Yaqin atrofdagi suv manbai va chelakdan","C":"O'zining xizmat quroli va o'q-dorisidan","D":"Hech qanday vositadan foydalana olmaydi"},"answer":"A","explanation":"Soqchi postdagi yong'inni o'chirishning birlamchi vositalarini (o't o'chirgich va h.k.) ishlata bilishi kerak — bu uning majburiyatlaridan biri.","mnemonic":"Soqchi → yong'in o'chirish vositasini bilishi shart.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":215,"subtopic":"Transport signallari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Soqchi transport vositalariga oid nimalarni bilishi kerak?","options":{"A":"Ularning harakat yo'nalishi, jadvali, taniqli belgilari va signallarini","B":"Ularning bozordagi narxi va umumiy moliyaviy qiymatini","C":"Ularning rangi va tashqi ko'rinish belgilarini farqlashni","D":"Ular haqida umuman hech qanday ma'lumotni bilmaydi"},"answer":"A","explanation":"Soqchi transport vositalarining harakat yo'nalishi va jadvalini, taniqli belgilari va signallarini bilishi kerak — bu o'z va begona transportni ajratishga yordam beradi.","mnemonic":"Soqchi transport: yo'nalish + jadval + belgi + signal.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":216,"subtopic":"Soqchi qurol qo'llash huquqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun soqchiga ayrim hollarda qurol qo'llash huquqi beriladi?","options":{"A":"Chunki u muhim obyektni himoya qiladi","B":"Chunki u vaqt o'tkazish uchun zerikadi","C":"Chunki qurol og'irlik qiladi","D":"Chunki bu majburiy mashq"},"answer":"A","explanation":"Soqchi muhim obyektni qo'riqlash jangovar vazifasini bajaradi; uning daxlsizligi Nizomda ko'rsatilgan hollarda qurol qo'llash huquqini ham o'z ichiga oladi — aks holda obyekt himoyasiz qolardi.","mnemonic":"Qurol huquqi = soqchi daxlsizligining bir qismi.","source":"11-sinf §22, 60-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":217,"subtopic":"Nizom tasdig'i","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Garnizon va qorovullik xizmatlari Nizomi nima belgilab beradi?","options":{"A":"Xizmatlar tashkili, o'tash tartibi va xizmatchilar majburiyatlarini","B":"Harbiy kiyim shakli va farq belgilarini tasniflaydi","C":"Kunlik ovqatlanish va dam olish tartibini belgilaydi","D":"Otish va jismoniy tayyorgarlik me'yorlarini belgilaydi"},"answer":"A","explanation":"Garnizon va qorovullik xizmatlari Nizomi bu xizmatlarning tashkil etilishi va o'tash tartibini, garnizon mansabdor shaxslari hamda xizmatni o'tayotgan harbiy xizmatchilarning huquq va majburiyatlarini belgilab beradi.","mnemonic":"Nizom = tashkil + tartib + huquq-majburiyat.","source":"11-sinf §21, 57-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":218,"subtopic":"Tartibbuzarni ushlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi tartibbuzarni ushlagach, postni qo'riqlashda davom etadimi?","options":{"A":"Ha, xabar beradi, kuzatadi, postni himoya qiladi","B":"Yo'q, ushlanganni qorovulxonaga olib boradi","C":"Yo'q, postni tark etadi","D":"Ha, lekin postni butunlay unutadi"},"answer":"A","explanation":"Ushlangan tartibbuzar haqida soqchi qorovulxonaga xabar beradi, uning o'zini tutishini kuzatadi, ammo diqqatini bo'lmay o'ziga topshirilgan postni qo'riqlashda davom etadi.","mnemonic":"Ushlading → xabar ber, lekin postni qo'riqlashda davom et.","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":219,"subtopic":"Yuzini yoritishni talab","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi yaqinlashayotgan shaxs haqiqatan qorovul boshlig'i ekaniga ishonch hosil qilish uchun zarurat bo'lsa nima qiladi?","options":{"A":"Undan yuzini yoritishni talab qiladi","B":"Darhol qurol qo'llaydi","C":"Yaqin kelishiga ruxsat beradi","D":"Postni tashlab tekshiradi"},"answer":"A","explanation":"Soqchi, zarurat bo'lsa, o'ziga yaqinlashayotgan shaxsdan yuzini yoritishni talab qiladi va u haqiqatan ham qorovul boshlig'i (yordamchi/tarqatuvchi) ekaniga ishonch hosil qilgachgina qolganlarni yaqin qo'yadi.","mnemonic":"Shubha bo'lsa — yuzni yorit.","source":"11-sinf §22, 61-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":220,"subtopic":"O'ta muhim obyekt","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"O'ta muhim davlat va harbiy obyektni qo'riqlayotgan soqchi qanday qo'riqlashi kerak?","options":{"A":"Kuzatuv minorasidan, diqqat bilan","B":"O'tirgan holda","C":"Vaqti-vaqti bilan","D":"Boshqalarga ishonib qo'yib"},"answer":"A","explanation":"O'ta muhim davlat va harbiy obyektni qo'riqlayotgan askar post (pozitsiyaviy) kuzatuv minorasidan turib, sinchkovlik va diqqat bilan soqchilik qiladi.","mnemonic":"Muhim obyekt → minoradan, sinchkov kuzatuv.","source":"11-sinf §22, 62-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":221,"subtopic":"Xizmat haqida bildiruv","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Soqchi xizmatning borishi haqida qachon bildiruv beradi?","options":{"A":"Post jadvalidagi vaqtlarda","B":"Xizmat tugaganidan so'ng","C":"Hech qachon","D":"Boshliq so'ragan paytda"},"answer":"A","explanation":"Soqchi post tabelida ko'rsatilgan vaqtlarda xizmatning borishi haqida aloqa vositalari orqali bildiruv berib turadi — bu uning hushyor va sog'-salomat ekanini tasdiqlaydi.","mnemonic":"Tabeldagi vaqtda → aloqa orqali bildiruv.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":222,"subtopic":"Qo'shni post tartibsizligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun soqchi qo'shni postdagi tartibbuzarlikni ko'rsa ham, o'z postini tark etmasligi kerak?","options":{"A":"Postni tashlash jinoyat; u boshliqni chaqirib postini qo'riqlaydi","B":"Chunki qo'shni postning unga umuman aloqasi yo'q","C":"Chunki bunday tartibbuzarlik ahamiyatga ega emas","D":"Chunki u charchagan va dam olishi zarur bo'ladi"},"answer":"A","explanation":"Soqchi qo'shni postda tartibbuzarlik aniqlasa qorovul boshlig'ini chaqiradi, lekin o'z postini tark etmaydi — postni o'zboshimchalik bilan tashlash harbiy jinoyat bo'lib, o'z obyektini himoyasiz qoldiradi.","mnemonic":"Qo'shni postda muammo → chaqir, lekin o'z postni qoldirma.","source":"11-sinf §22, 59-bet","source_file":"036_garnizon_qorovullik.json","_unrep":false},{"id":223,"subtopic":"Intizom Nizomi vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Intizom Nizomi nimani belgilaydi?","options":{"A":"Harbiy intizom, rioya majburiyati","B":"Otish normalari va me'yorlarini","C":"Harbiy kiyim shakli va belgilarini","D":"Kunlik ovqatlanish tartibini"},"answer":"A","explanation":"Intizom Nizomi harbiy intizomning mohiyati, unga rioya majburiyatlari, rag'batlantirish va intizomiy ta'zir turlari, mansabdor shaxslarning ularni qo'llash huquqlari hamda shikoyat va murojaatlarni ko'rib chiqish tartibini belgilaydi.","mnemonic":"Intizom Nizomi = intizom + rag'bat + ta'zir tartibi.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":224,"subtopic":"Harbiy intizom ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy intizom nima?","options":{"A":"Xodimlar buyruqlarga rioya","B":"Ertalabki badantarbiya bajarish","C":"Qurolni tozalash va saqlash","D":"Saf yurishini o'rganish"},"answer":"A","explanation":"Harbiy intizom — barcha harbiy xizmatchilarning qonunchilik hujjatlari, harbiy nizomlar va komandirlar (boshliqlar)ning buyruqlari bilan belgilangan tartib va qoidalarga qat'iy rioya etishidir.","mnemonic":"Intizom = qonun + nizom + buyruqqa qat'iy rioya.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":225,"subtopic":"Intizom asosi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Harbiy intizom nimaga asoslanadi?","options":{"A":"Davlat himoyasiga shaxsiy javobgarlik, sadoqat va burch tuyg'usiga","B":"Jazo va intizomiy ta'zirdan qo'rqish hissiga","C":"Mukofot va rag'bat olish istagiga asoslanadi","D":"Tashqi majburlov va qattiq nazoratga asoslanadi"},"answer":"A","explanation":"Harbiy intizom har bir xizmatchining davlat suvereniteti va hududiy yaxlitligini himoya qilishga shaxsan javobgarligini, xalqiga cheksiz sadoqatini, harbiy va fuqarolik burchini his qilishiga asoslanadi — ya'ni ichki ongli majburiyatga, faqat qo'rquvga emas.","mnemonic":"Intizom asosi = javobgarlik + sadoqat + burch (ong).","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":226,"subtopic":"Intizom talablari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy intizom xizmatchidan quyidagilardan qaysi birini talab etadi?","options":{"A":"Konstitutsiya va qonunlarga rioya, qasamyod","B":"Buyruqlarni muhokama qilishni","C":"Faqat o'z manfaatini ko'zlashni","D":"Sirlarni oshkor qilishni"},"answer":"A","explanation":"Harbiy intizom Konstitutsiya va qonunlarga qat'iy rioya, qasamyodga sodiqlik, burchni mohirlik bilan bajarish, sergaklik va sir saqlash, o'zaro hurmat va xushmuomalalikni talab etadi.","mnemonic":"Intizom talabi = rioya + sodiqlik + sir saqlash + hurmat.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":227,"subtopic":"Intizom talabi — jamoat joyi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy intizom jamoat joylarida xizmatchidan nimani talab etadi?","options":{"A":"O'zini munosib tutish, nomunosib xatti-harakatlardan tiyilish","B":"Erkin va xohlagancha xulq-atvor namoyon etish","C":"Atrofdagi boshqa kishilarga umuman e'tibor bermaslik","D":"Buyruqsiz va o'z bilganicha mustaqil harakat qilish"},"answer":"A","explanation":"Harbiy intizom jamoat joylarida o'zini munosib tutish, nomunosib xatt
