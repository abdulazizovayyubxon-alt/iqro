i-harakatlardan o'zini va boshqalarni tiyishni talab etadi — harbiy xizmatchi armiya obro'sining timsoli.","mnemonic":"Jamoat joyida — munosib xulq.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":228,"subtopic":"Rag'batlantirish maqsadi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Rag'batlantirish nima maqsadda qo'llaniladi?","options":{"A":"Xizmat va burchni a'lo bajarish","B":"Xizmatchini jazolash maqsadida","C":"Xizmatchini chetlashtirish uchun","D":"Faqat hujjat to'ldirish maqsadida"},"answer":"A","explanation":"Rag'batlantirish xizmatchini namunali xizmat va harbiy burchni a'lo bajargani uchun taqdirlash, uni va boshqalarni yanada yaxshi xizmatga undash maqsadida qo'llaniladi.","mnemonic":"Rag'bat = namunali xizmat uchun taqdir.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":229,"subtopic":"Rag'batlantirish — bir marta","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bitta namunali ish uchun xizmatchi necha marta rag'batlantirilishi mumkin?","options":{"A":"Faqat bir marta","B":"Cheksiz marta","C":"Kamida ikki marta","D":"Komandir xohlagancha"},"answer":"A","explanation":"Har bir komandir bitta namunali ish uchun xizmatchi yoki bo'linmani faqat bir marotaba rag'batlantirishga haqli — adolat va xolislik tamoyiliga ko'ra.","mnemonic":"Bir ish — bir rag'bat.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":230,"subtopic":"Rag'batlantirish turi tanlash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Rag'batlantirish turini tanlashda nima inobatga olinadi?","options":{"A":"Xizmat tavsifi va hissasi","B":"Xizmatchining yoshi","C":"Xizmatchining bo'yi","D":"Komandirning kayfiyati"},"answer":"A","explanation":"Rag'batlantirish turi tanlanganda xizmatchi (bo'linma) ko'rsatgan xizmatning tavsifi yoki ularning xizmatga qo'shgan shaxsiy hissasi inobatga olinadi — hissa qancha katta bo'lsa, rag'bat shuncha yuqori.","mnemonic":"Rag'bat turi = xizmat hissasiga mos.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":231,"subtopic":"Rag'batlantirish turi — ta'til","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Muddatli xizmatchiga rag'bat sifatida necha sutkagacha qisqa muddatli ta'til berilishi mumkin?","options":{"A":"10 sutkagacha","B":"30 sutkagacha","C":"3 sutkagacha","D":"60 sutkagacha"},"answer":"A","explanation":"Muddatli xizmatchiga rag'bat sifatida ta'tilni o'tkazish joyiga borib-kelish vaqtini hisobga olmagan holda 10 sutkagacha qisqa muddatli ta'til berilishi mumkin.","mnemonic":"Rag'bat ta'tili = 10 sutkagacha.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":232,"subtopic":"Rag'batlantirish turi — minnatdorchilik xati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri muddatli xizmatchiga qo'llaniladigan rag'batlantirish turi?","options":{"A":"Ota-onasiga minnatdorchilik xati","B":"Hayfsan e'lon qilish","C":"Navbatdagi javobdan mahrum qilish","D":"O'qishdan chetlashtirish"},"answer":"A","explanation":"Rag'batlantirish turlaridan biri — ota-onasi, yashash joyi yoki xizmatgacha bo'lgan ish (o'qish) joyiga harbiy burchini namunali bajarayotgani to'g'risida minnatdorchilik xati yuborish.","mnemonic":"Rag'bat = uyga/maktabga minnatdorchilik xati.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":233,"subtopic":"Rag'batlantirish turi — Hurmat kitobi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Namunali xizmatchining familiyasi qaysi hujjatga kiritilishi rag'batlantirish hisoblanadi?","options":{"A":"Harbiy Hurmat kitobiga","B":"Intizomiy daftarga","C":"Jarima ro'yxatiga","D":"Naryad jadvaliga"},"answer":"A","explanation":"Rag'batlantirish turlaridan biri — namunali xizmatchining familiyasini harbiy qism (muassasa)ning \"Hurmat kitobi\"ga kiritishdir.","mnemonic":"Namuna → \"Hurmat kitobi\".","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":234,"subtopic":"Rag'batlantirish turi — bayroq yonida surat","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri rag'batlantirish turidir?","options":{"A":"Bayrog'i yonida taqdirlash","B":"Hayfsan berish (mukofot)","C":"Ruxsatdan mahrum qilish","D":"Lavozimdan tushirish"},"answer":"A","explanation":"Rag'batlantirish turlaridan biri — O'zbekiston Davlat bayrog'i, Amir Temur jangovar bayrog'i yoki vazirlik bayroqlari yonida olingan fotosurat bilan taqdirlashdir.","mnemonic":"Rag'bat = bayroq yonida fotosurat.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":235,"subtopic":"Intizomiy ta'zir ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Intizomiy ta'zir qanday qo'llaniladi?","options":{"A":"Komandir qaroriga asosan yozma","B":"Sud qaroriga ko'ra rasmiy","C":"Umumiy ovoz berish orqali","D":"Xodimning o'z xohishi bilan"},"answer":"A","explanation":"Intizomiy ta'zir harbiy xizmatchiga nisbatan komandir (boshliq)ning qaroriga asosan yozma yoki og'zaki ravishda qo'llaniladi.","mnemonic":"Ta'zir = komandir qarori (yozma/og'zaki).","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":236,"subtopic":"Bitta ayb — bitta ta'zir","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bitta nojo'ya xatti-harakat uchun xizmatchiga nechta intizomiy ta'zir qo'llaniladi?","options":{"A":"Faqat bitta","B":"Kamida ikkita","C":"Aybga qarab cheksiz","D":"Uchta"},"answer":"A","explanation":"Adolat tamoyiliga ko'ra, harbiy xizmatchiga bitta nojo'ya xatti-harakati uchun faqat bitta intizomiy ta'zir qo'llaniladi.","mnemonic":"Bir nojo'ya ish — bir ta'zir.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":237,"subtopic":"Ta'zir turi — hayfsan","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri muddatli xizmatchiga qo'llaniladigan intizomiy ta'zir turi?","options":{"A":"Hayfsan","B":"Minnatdorchilik e'lon qilish","C":"Qimmatbaho sovg'a berish","D":"Qisqa muddatli ta'til berish"},"answer":"A","explanation":"Muddatli xizmatchiga qo'llaniladigan intizomiy ta'zir turlaridan biri — hayfsan (qolganlari: navbatdagi javobdan mahrum qilish, kursantni o'qishdan chetlashtirish).","mnemonic":"Ta'zir = hayfsan; rag'bat = minnatdorchilik.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":238,"subtopic":"Ta'zir turi — javobdan mahrum","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri intizomiy ta'zir turidir?","options":{"A":"Ruxsat berishdan mahrum","B":"Faxriy yorliq berish mukofoti","C":"10 sutkalik ta'til berish","D":"Pul mukofoti berish (mukofot)"},"answer":"A","explanation":"Intizomiy ta'zir turlaridan biri — harbiy qism (muassasa) hududidan navbatdagi javob (ruxsat) berishdan mahrum qilish.","mnemonic":"Ta'zir = navbatdagi ruxsatdan mahrum.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":239,"subtopic":"Ta'zir turi — kursant chetlashtirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Oliy harbiy ta'lim muassasasi kursantiga qo'llaniladigan eng og'ir intizomiy ta'zir qaysi?","options":{"A":"Intizomsizligi uchun chetlashtirish","B":"Hayfsan","C":"Minnatdorchilik","D":"Pul mukofotidan mahrum qilish"},"answer":"A","explanation":"Kursantga nisbatan intizomsizligi sababli oliy harbiy ta'lim muassasasidan o'qishdan chetlashtirish — eng jiddiy intizomiy ta'zir choralaridan biridir.","mnemonic":"Kursant intizomsizligi → o'qishdan chetlashtirish.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":240,"subtopic":"Ta'zir taqiqi — aybsiz shaxs","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun nojo'ya xatti-harakatda aybdor bo'lmagan shaxsga intizomiy ta'zir qo'llanmaydi?","options":{"A":"Ta'zir faqat aybdorga adolatli; aybsizni jazolash qonunga zid","B":"Chunki bunday ta'zirning hech qanday foydasi yo'q","C":"Chunki komandirning bunga ajratadigan vaqti yetmaydi","D":"Chunki ta'zir choralari unchalik og'ir emas"},"answer":"A","explanation":"Intizomiy ta'zir choralarini nojo'ya xatti-harakat yoki huquqbuzarlikda aybdor bo'lmagan shaxsga qo'llash taqiqlanadi — jazo faqat haqiqiy aybdorga nisbatan adolatli bo'ladi.","mnemonic":"Aybsizga ta'zir YO'Q.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":241,"subtopic":"Ta'zir taqiqi — butun tarkib","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bitta askar ayb qilsa, komandir butun bo'linmaga intizomiy ta'zir qo'llashi mumkinmi?","options":{"A":"Yo'q","B":"Ha, hammaga qo'llash mumkin","C":"Ha, agar komandir xohlasa","D":"Ha, faqat kechqurun"},"answer":"A","explanation":"Bevosita aybdor shaxslar o'rniga bo'linmaning barcha shaxsiy tarkibiga intizomiy ta'zir qo'llash taqiqlanadi — faqat haqiqiy aybdor javob beradi.","mnemonic":"Bir aybdor uchun butun tarkibga ta'zir — YO'Q.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":242,"subtopic":"Ta'zir taqiqi — xizmat davomida","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi qaysi xizmatni o'tash davomida intizomiy ta'zir qo'llash taqiqlanadi?","options":{"A":"Jangovar navbatchilik, garnizon, qorovul va ichki xizmat davomida","B":"Kunlik ovqatlanish va choy ichish vaqtida","C":"Jismoniy tayyorgarlik va sport mashg'uloti vaqtida","D":"Dam olish kuni va shaxsiy bo'sh vaqt davomida"},"answer":"A","explanation":"Jangovar navbatchilik, garnizon, qorovul va ichki xizmatni o'tash davomida intizomiy ta'zir qo'llash taqiqlanadi — bu xizmatlar diqqat va shaylikni talab qiladi.","mnemonic":"Navbatchilik/qorovul vaqtida — ta'zir YO'Q.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":243,"subtopic":"Ta'zir taqiqi — ma'muriy chora keyin","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Xizmatchiga ma'muriy javobgarlik chorasi qo'llanilgan bo'lsa, aynan shu huquqbuzarlik uchun intizomiy ta'zir qo'llanadimi?","options":{"A":"Yo'q","B":"Ha, qo'shimcha ta'zir beriladi","C":"Ha, har doim","D":"Ha, faqat og'ir bo'lsa"},"answer":"A","explanation":"Xizmatchiga ma'muriy javobgarlik chorasi qo'llanilgandan so'ng aynan shu ma'muriy huquqbuzarlik uchun intizomiy ta'zir qo'llash taqiqlanadi — bir ayb uchun ikki marta jazo yo'q.","mnemonic":"Ma'muriy jazo bo'ldi → shu ayb uchun ta'zir YO'Q.","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":244,"subtopic":"Ta'zir taqiqi — lavozimga kirishish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yangi lavozimga tayinlangan xizmatchiga necha oy davomida (kamchilik uchun) intizomiy ta'zir qo'llanmaydi?","options":{"A":"3 oy kirish davri","B":"1 yil davomida","C":"6 oy davomida","D":"1 oy davomida"},"answer":"A","explanation":"Lavozimga tayinlangan kundan boshlab 3 oy davomidagi lavozimga kirishish davrida majburiyatlarni bajarishda kamchilik qo'ygan xizmatchiga intizomiy ta'zir qo'llash taqiqlanadi.","mnemonic":"Lavozimga kirishish = 3 oy (ta'zir yo'q).","source":"10-sinf §17, 58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":245,"subtopic":"Rag'bat — kimga qo'llaniladi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Komandir rag'batlantirishni kimga nisbatan qo'llashi mumkin?","options":{"A":"Alohida xizmatchiga ham, butun bo'linma tarkibiga ham","B":"Ofitser va serjantlar tarkibiga nisbatangina","C":"Eng faol bitta askarga nisbatangina","D":"O'ziga va o'z yaqinlariga nisbatangina"},"answer":"A","explanation":"Komandirlar rag'batlantirishni alohida xizmatchiga nisbatan ham, butun bo'linma (harbiy qism, muassasa) shaxsiy tarkibiga nisbatan ham qo'llashlari mumkin.","mnemonic":"Rag'bat — yakka ham, jamoa ham.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":246,"subtopic":"Rag'bat turi — pul/sovg'a","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri moddiy taqdirlash shaklidagi rag'batlantirish turidir?","options":{"A":"Yorliq, sovg'a yoki pul mukofoti","B":"Hayfsan e'lon qilish","C":"Ruxsatdan mahrum qilish","D":"O'qishdan chetlashtirish"},"answer":"A","explanation":"Rag'batlantirish turlaridan biri — faxriy yorliq, qimmatbaho sovg'alar yoki pul mukofoti bilan taqdirlashdir.","mnemonic":"Rag'bat = yorliq / sovg'a / pul.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":247,"subtopic":"Intizom talabi — burch va jon","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Harbiy intizom xizmatchidan harbiy burchni bajarishda nimani talab etadi?","options":{"A":"Mardonavor yengish, jonini ayamas","B":"Faqat oson vazifalarni bajarish","C":"Qiyinchilikdan qochish","D":"Buyruqni rad etish"},"answer":"A","explanation":"Harbiy intizom xizmat qiyinchiliklarini mardonavor yengish, harbiy burchni bajarish uchun o'z jonini ham ayamaslikni talab etadi.","mnemonic":"Burch uchun — qiyinchilikni yeng, jonni ayama.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":248,"subtopic":"Intizom talabi — o'zaro yordam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy intizom xizmatchilar o'rtasidagi munosabatlarda nimani talab etadi?","options":{"A":"Harbiy birodarlikni","B":"Bir-biriga befarq bo'lish","C":"Raqobatlashish va aloqasizlik","D":"Bir-birini ayblash va tanqid qilish"},"answer":"A","explanation":"Harbiy intizom nizomlarda belgilangan o'zaro munosabatlarni qo'llab-quvvatlash, harbiy birodarlikni mustahkamlash hamda o'zaro yordam ko'rsatishni talab etadi.","mnemonic":"Intizom = birodarlik + o'zaro yordam.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":249,"subtopic":"Rag'bat — idoraviy mukofot","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri rag'batlantirish turlaridan biridir?","options":{"A":"Mukofotlar bilan taqdirlash","B":"Javobdan mahrum qilish","C":"Hayfsan va qiziqish","D":"Lavozimni pasaytirish"},"answer":"A","explanation":"Rag'batlantirish turlaridan biri — idoraviy mukofotlar yoki esdalik nishonlari bilan taqdirlashdir.","mnemonic":"Rag'bat = idoraviy mukofot / nishon.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":250,"subtopic":"Intizom talabi — minnatdorchilik e'lon","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Eng oddiy va keng tarqalgan rag'batlantirish turi qaysi?","options":{"A":"Minnatdorchilik e'lon qilish","B":"10 sutkalik ta'til","C":"Pul mukofoti","D":"Davlat bayrog'i yonida fotosurat"},"answer":"A","explanation":"Minnatdorchilik e'lon qilish — eng oddiy va eng ko'p qo'llaniladigan rag'batlantirish turidir.","mnemonic":"Eng oddiy rag'bat = minnatdorchilik.","source":"10-sinf §17, 57-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":251,"subtopic":"Intizom — komandirga hurmat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy intizom komandir va o'rtoqlarga nisbatan nimani talab etadi?","options":{"A":"Hurmat va salomlashish","B":"Befarqlik va beparvo","C":"Buyruqni rad etish","D":"Salom bermaslik"},"answer":"A","explanation":"Harbiy intizom komandir (boshliq)ga va bir-biriga nisbatan o'zaro hurmat ko'rsatish, harbiycha salomlashish va xushmuomalalik qoidalariga rioya qilishni talab etadi.","mnemonic":"Intizom = hurmat + salom + xushmuomalalik.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":252,"subtopic":"Rag'bat va ta'zir farqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Rag'batlantirish va intizomiy ta'zirning umumiy maqsadi nima?","options":{"A":"Intizomni mustahkamlash va undash","B":"Xizmatchini jazolash va qo'rqitish","C":"Rasmiy hujjatlarni to'ldirish","D":"Komandir obro'sini oshirish"},"answer":"A","explanation":"Rag'batlantirish (yaxshi xizmatni qo'llab-quvvatlash) ham, intizomiy ta'zir (kamchilikni tuzatish) ham yagona maqsadga — harbiy intizomni mustahkamlash va xizmatchilarni namunali xizmatga undashga xizmat qiladi.","mnemonic":"Rag'bat + ta'zir = intizomni mustahkamlash.","source":"10-sinf §17, 56-58-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":253,"subtopic":"Intizom talabi — harbiy ishni o'rganish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiy intizom xizmatchidan kasbiy jihatdan nimani talab etadi?","options":{"A":"Harbiy ishni vijdonan o'rganish, mahoratini oshirish va mol-mulkni asrash","B":"Imkon qadar ko'proq dam olish va hordiq chiqarish","C":"Mashg'ulot va mashqlardan iloji boricha qochish","D":"Harbiy va davlat mol-mulkiga beparvo munosabatda bo'lish"},"answer":"A","explanation":"Harbiy intizom o'z harbiy burchini mohirlik bilan bajarish, harbiy ishni vijdonan o'rganish, kasbiy mahoratini oshirish hamda harbiy va davlat mol-mulkini asrashni talab etadi.","mnemonic":"Intizom = o'rgan + mahorat + mol-mulk asra.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":254,"subtopic":"Intizom Nizomi — shikoyat tartibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Intizom Nizomi rag'batlantirish va ta'zirlardan tashqari yana nimani belgilaydi?","options":{"A":"Ular bo'yicha shikoyat qilish va murojaatlarni ko'rib chiqish tartibini","B":"Otish va jangovar tayyorgarlik me'yorlarini belgilaydi","C":"Kun tartibi va xizmat jadvalini belgilab beradi","D":"Harbiy unvon va lavozimlar ro'yxatini tasdiqlaydi"},"answer":"A","explanation":"Intizom Nizomi rag'batlantirish va intizomiy ta'zirlarni qo'llash, ular bo'yicha shikoyat qilish hamda harbiy xizmatchilarning murojaatlarini ko'rib chiqish tartibini ham belgilaydi.","mnemonic":"Nizom = qo'llash + shikoyat + murojaat tartibi.","source":"10-sinf §17, 56-bet","source_file":"037_intizom_nizomi.json","_unrep":false},{"id":255,"subtopic":"Saf Nizomi tarkibi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Saf Nizomi necha bo'lim va necha moddadan iborat?","options":{"A":"7 bo'lim, 194 modda","B":"5 bo'lim, 100 modda","C":"10 bo'lim, 250 modda","D":"3 bo'lim, 50 modda"},"answer":"A","explanation":"O'zbekiston Respublikasi Qurolli Kuchlarining Saf Nizomi 7 bo'lim va 194 moddadan iborat (2025-yil 20-mayda tasdiqlangan).","mnemonic":"Saf Nizomi: 7 bo'lim, 194 modda.","source":"10-sinf §9, 34-35-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":256,"subtopic":"Saf ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Saf nima?","options":{"A":"Bo'linmalarning Nizomda belgilangan tartibda birgalikda joylashuvi","B":"Faqat bitta askarning yakka holda turish holati","C":"Qurolni tozalash va saqlashning maxsus usuli","D":"Kunlik ovqatlanish va dam olishni tashkil etish"},"answer":"A","explanation":"Saf — harbiy xizmatchilar, bo'linma va harbiy qismlarning piyoda hamda mashinalarda birgalikda yurish uchun Nizomda belgilangan tartibda joylashuvidir.","mnemonic":"Saf = Nizom tartibida birga joylashuv.","source":"10-sinf §9, 35-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":257,"subtopic":"Sherenga ta'rifi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Sherenga deb qanday safga aytiladi?","options":{"A":"Xizmatchilar bir chiziqda, intervalni saqlab yonma-yon turgan saf","B":"Askarlar bir-birining ortidan ketma-ket turgan saf","C":"Xizmatchilar doira shaklida tizilib turgan saf","D":"Mashinalarda o'tirgan holda tuzilgan saf turi"},"answer":"A","explanation":"Sherenga — harbiy xizmatchilar bir chiziqda, belgilangan intervalni saqlagan holda yonma-yon turgan safdir.","mnemonic":"Sherenga = yonma-yon (bir chiziq).","source":"10-sinf §9, 35-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":258,"subtopic":"Komanda turlari","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Komandalar qanday turlarga bo'linadi?","options":{"A":"Dastlabki va ijro komandalariga","B":"Yozma va og'zaki komandalarga","C":"Tez va sekin komandalarga","D":"Ovozli va imo-ishorali komandalarga"},"answer":"A","explanation":"Komandalar dastlabki va ijro komandalariga bo'linadi. Ayrim hollarda faqat ijro komandasi ham bo'lishi mumkin.","mnemonic":"Komanda = dastlabki + ijro.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":259,"subtopic":"Dastlabki komanda","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dastlabki komanda qanday beriladi?","options":{"A":"Aniq, baland va cho'ziq tarzda","B":"Sekin va past ovozda","C":"Juda qisqa va keskin","D":"Pichirlab, yumshoq ovozda"},"answer":"A","explanation":"Dastlabki komanda aniq, baland va cho'ziq tarzda beriladi — toki safdagilar komandir qanday harakat talab qilayotganini anglab yetsin.","mnemonic":"Dastlabki = cho'ziq (anglash uchun).","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":260,"subtopic":"Ijro komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ijro komandasi qanday beriladi va bajariladi?","options":{"A":"Baland, qisqa, aniq beriladi","B":"Cho'ziq va sekin beriladi","C":"Bir necha marta takrorlanadi","D":"Faqat yozma tarzda beriladi"},"answer":"A","explanation":"Ijro komandasi dastlabki komandadan keyingi tanaffusdan so'ng baland, qisqa va aniq beriladi; u zudlik bilan aniq bajariladi.","mnemonic":"Ijro = qisqa + zudlik bilan bajariladi.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":261,"subtopic":"E'tiborni jalb qilish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Oddiy askar To'rayev, ort-GA!\" komandasida familiya nima uchun aytiladi?","options":{"A":"E'tiborini jalb qilish uchun","B":"Uni jazolash maqsadida","C":"Uni rag'batlantirish uchun","D":"Uni safdan chiqarish uchun"},"answer":"A","explanation":"Bo'linma yoki alohida xizmatchining e'tiborini jalb etish uchun dastlabki komandada bo'linma nomi yoki xizmatchining unvoni va familiyasi aytib chaqiriladi (masalan \"Guruh, TO'XTA!\", \"Oddiy askar To'rayev, ort-GA!\").","mnemonic":"Familiya/nom = e'tiborni jalb (dastlabki qism).","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":262,"subtopic":"QOLDIRILSIN komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"QOLDIRILSIN!\" komandasi nima uchun beriladi?","options":{"A":"Saf amalini bekor qilish uchun","B":"Yurishni tezlatish uchun","C":"Salom berish maqsadida","D":"Safdan chiqish uchun"},"answer":"A","explanation":"Saf amalini bekor qilish yoki ijrosini to'xtatish uchun \"QOLDIRILSIN!\" komandasi beriladi; bunga binoan amal ijrosiga qadar bo'lgan holat qabul qilinadi.","mnemonic":"QOLDIRILSIN = oldingi holatga qaytish.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":263,"subtopic":"Qad rostlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safdagi xizmatchilar har qanday dastlabki komandaga binoan avvalo nima qiladilar?","options":{"A":"Qad rostlaydilar","B":"O'tirib oladilar","C":"Tarqaladilar","D":"Qurolni qo'yadilar"},"answer":"A","explanation":"Safda turgan xizmatchilar har qanday dastlabki komandaga binoan qad rostlaydilar, yurish davomida esa shaxdam qadam tashlay boshlaydilar; safdan tashqarida bo'lsalar boshliq tomon o'girilib qad rostlaydilar.","mnemonic":"Dastlabki komanda → qad rostlash.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":264,"subtopic":"O'ngga burilish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Joyida \"O'ng-GA!\" burilish amali qaysi oyoq holatida bajariladi?","options":{"A":"O'ng poshna, chap oyoq uchida","B":"Chap poshna, o'ng oyoq uchida","C":"Ikki poshnada","D":"Ikki oyoq uchida"},"answer":"A","explanation":"O'ngga burilish amali o'ng poshna va chap oyoq uchida turgan holda, o'ng qo'l tomonga burilib bajariladi (ikkita amaldan iborat).","mnemonic":"O'ngga → o'ng poshna + chap oyoq uchi.","source":"10-sinf §11, 41-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":265,"subtopic":"Chapga/ortga burilish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Joyida \"Chap-GA!\" va \"Ort-GA!\" burilishlar qaysi oyoq holatida bajariladi?","options":{"A":"Chap poshna, o'ng oyoq uchida","B":"O'ng poshna, chap oyoq uchida","C":"Ikki poshnada","D":"O'ng tizzani bukib"},"answer":"A","explanation":"Ortga va chapga burilish amallari chap poshna va o'ng oyoq uchida turgan holda, chap qo'l tomonga burilib bajariladi.","mnemonic":"Chap/Ort → chap poshna + o'ng oyoq uchi.","source":"10-sinf §11, 41-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":266,"subtopic":"Burilish — ikki amal","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Joyida burilish necha amaldan iborat?","options":{"A":"Ikkita","B":"Bitta","C":"Uchta","D":"To'rtta"},"answer":"A","explanation":"Burilish ikkita amaldan iborat: 1-amal — tana tik holda, tizzani bukmay burilish, vazn oldingi oyoqqa o'tkaziladi; 2-amal — ortda qolgan oyoq to'g'ri tortilib oldingi oyoqqa taqaladi.","mnemonic":"Burilish = 2 amal (buril → tagla).","source":"10-sinf §11, 41-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":267,"subtopic":"Qadam tezligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qadamlab yurish harakati daqiqada necha qadam tezlikda bajariladi?","options":{"A":"110–120 qadam","B":"60–70 qadam","C":"165–180 qadam","D":"200–220 qadam"},"answer":"A","explanation":"Qadamlab yurish harakati daqiqada 110–120 qadam tezlikda bajariladi; har bir qadam uzunligi 70–80 sm bo'lishi lozim.","mnemonic":"Yurish = 110–120 qadam/daqiqa.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":268,"subtopic":"Qadam uzunligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qadamlab yurishda har bir qadam uzunligi qancha bo'lishi lozim?","options":{"A":"70–80 sm","B":"30–40 sm","C":"85–90 sm","D":"100–110 sm"},"answer":"A","explanation":"Qadamlab yurishda har bir qadam uzunligi 70–80 sm bo'lishi lozim (yugurishda esa 85–90 sm).","mnemonic":"Yurish qadami = 70–80 sm.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":269,"subtopic":"Yugurish tezligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yugurish harakati daqiqada necha qadam tezlikda va qanday qadam uzunligida bajariladi?","options":{"A":"165–180 qadam, har biri 85–90 sm","B":"110–120 qadam, har biri 70–80 sm","C":"200 qadam, har biri 100 sm","D":"90 qadam, har biri 60 sm"},"answer":"A","explanation":"Yugurish harakati daqiqada 165–180 qadam tezlikda bajariladi, har bir qadam uzunligi 85–90 sm bo'ladi.","mnemonic":"Yugurish = 165–180 qadam, 85–90 sm.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":270,"subtopic":"Shaxdam qadam komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Oddiy qadamdan shaxdam qadamga o'tish uchun qaysi komanda beriladi?","options":{"A":"\"Shaxdam – BOS!\"","B":"\"Qadam – BOS!\"","C":"\"To'xta!\"","D":"\"Erkin!\""},"answer":"A","explanation":"Oddiy qadam tashlab yurilayotganda \"Shaxdam – BOS!\" komandasi bilan shaxdam qadamga o'tiladi; oddiy qadamga esa \"Qadam – BOS!\" komandasi bilan qaytiladi.","mnemonic":"\"Shaxdam-BOS!\" → shaxdam qadam.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":271,"subtopic":"Harakat boshlanishi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ijro komandasi berilganda harakat qaysi oyoqdan boshlanadi?","options":{"A":"Chap oyoqda qadam","B":"O'ng oyoqda qadam","C":"Ikkala oyoqda birda","D":"Istalgan oyoqda"},"answer":"A","explanation":"Dastlabki komandada tana biroz oldinga og'dirilib vazn o'ng oyoqqa o'tkaziladi; ijro komandasi berilganda harakat chap oyoqda to'liq qadam tashlash bilan boshlanadi.","mnemonic":"Harakat doim CHAP oyoqdan boshlanadi.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":272,"subtopic":"Shaxdam qadam qachon","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Shaxdam qadam quyidagi qaysi holatda bajariladi?","options":{"A":"Tantanali yurish, harbiy salom","B":"Dam olish va hordiq chiqarishda","C":"Ovqatga saf bo'lib borishda","D":"Uyquga yotish oldidan"},"answer":"A","explanation":"Shaxdam qadam tantanali yurish davomida, salom berilayotganda, boshliq oldiga yaqinlashish/ketishda, safdan chiqish yoki safga qaytishda bajariladi.","mnemonic":"Shaxdam = tantana + salom + boshliq + saf.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":273,"subtopic":"Oddiy qadam qachon","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Poligon, mashina parki va bino ichida boshliq oldiga borishda qaysi qadam ishlatiladi?","options":{"A":"Oddiy qadam","B":"Shaxdam qadam","C":"Yugurish","D":"Sakrash"},"answer":"A","explanation":"Poligon, jangovar mashinalar parki va bino ichida boshliq oldiga yaqinlashish/ketish, safdan chiqish/qaytish amallari oddiy qadam tashlab bajariladi (bunday joylar shaxdam qadamga noqulay).","mnemonic":"Bino/park/poligon → oddiy qadam.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":274,"subtopic":"Yurishda burilish — komanda payti","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yurish davomida \"O'ng-GA!\" burilishida ijro komandasi qachon beriladi?","options":{"A":"O'ng oyoq bosilganda","B":"Chap oyoq bosilganda","C":"Ikki oyoq yerda bo'lganda","D":"To'xtagandan keyin"},"answer":"A","explanation":"Yurishda o'ngga burilish uchun ijro komandasi o'ng oyoq yerga bosilishi bilan bir vaqtda (\"Bir\" sanog'i) beriladi; so'ng chap oyoq bilan yana qadam (\"Ikki\"), oyoq uchida buriladi va harakat yangi yo'nalishda davom etadi (\"Uch\").","mnemonic":"O'ngga burilish → o'ng oyoq bosilganda komanda.","source":"10-sinf §13, 46-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":275,"subtopic":"Harbiycha salom — masofa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safdan tashqarida joyda turib salom berishda boshliqqa necha qadam qolganda yuzlanib qad rostlanadi?","options":{"A":"3–4 qadam","B":"10–15 qadam","C":"1 qadam","D":"20 qadam"},"answer":"A","explanation":"Safdan tashqarida joyda turib salom berish uchun 3–4 qadamga yaqin kelgan boshliq tomon yuzlanib, qad rostlanadi va o'ng qo'l bosh kiyimga keltiriladi.","mnemonic":"Yakka salom → 3–4 qadam qolganda.","source":"10-sinf §14, 48-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":276,"subtopic":"Harbiycha salom — qo'l holati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Harbiycha salomda o'ng qo'l qanday holatda bo'ladi?","options":{"A":"Kafti yoyilgan, barmoqlari jipslashgan","B":"Musht qilingan holda peshonaga","C":"Yumshoq holda ko'krakka","D":"Pastga tushirilgan holda"},"answer":"A","explanation":"Salomda o'ng qo'l kafti yoyilgan va barmoqlari jipslashgan holda bosh kiyim (chakka)ga tekkiziladi va yelka chizig'i balandligida ko'tariladi; boshni boshliq tomon burganda qo'l holati o'zgarmaydi.","mnemonic":"Salom qo'li = kaft yoyiq, barmoq jips, chakka.","source":"10-sinf §14, 48-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":277,"subtopic":"Harbiycha salom — qo'l tushirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Salom berilgach o'ng qo'l qachon tushiriladi?","options":{"A":"Boshliq yonidan o'tib, to'g'riga qarab","B":"Darhol, boshliq yaqinlashganda","C":"Boshliqqa salom bermay turib","D":"Boshliq to'xtaganda"},"answer":"A","explanation":"Boshliq salom berayotgan xizmatchining yonidan o'tib ketgach, xizmatchi to'g'riga qarab o'ng qo'lini tushiradi.","mnemonic":"Boshliq o'tdi → qo'lni tushir.","source":"10-sinf §14, 48-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":278,"subtopic":"Safdan chiqish — javob","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Xizmatchi o'z familiyasini eshitgach va safdan chiqish komandasini olgach qanday javob beradi?","options":{"A":"Avval \"Men\", keyin \"Xo'p\"","B":"Faqat \"Bo'ldi\"","C":"Hech narsa demaydi","D":"\"Rad etaman\""},"answer":"A","explanation":"O'z familiyasini eshitgan xizmatchi \"Men\" deydi, safdan chiqish komandasini eshitgach esa \"Xo'p bo'ladi\" deb javob beradi va amalni bajaradi.","mnemonic":"Familiya → \"Men\"; komanda → \"Xo'p bo'ladi\".","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":279,"subtopic":"Safdan chiqish komandasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Quyidagilardan qaysi biri safdan chiqish komandasidir?","options":{"A":"\"CHIQING!\"","B":"\"Guruh, TEKISLAN!\"","C":"\"Shaxdam – BOS!\"","D":"\"QOLDIRILSIN!\""},"answer":"A","explanation":"Safdan chiqish uchun, masalan, \"Oddiy askar To'rayev, safdan ikki qadam oldinga CHIQING!\" yoki \"Oddiy askar To'rayev, OLDIMGA!\" komandasi beriladi.","mnemonic":"Safdan chiqish = \"...safdan... qadam CHIQING!\"","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":280,"subtopic":"Boshliq oldiga kelish — to'xtash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Boshliq oldiga kelayotgan xizmatchi necha qadam qolganda to'xtab bildiruv beradi?","options":{"A":"Ikki-uch qadam qolganda","B":"O'n qadam qolganda","C":"Bevosita yoniga kelib","D":"Besh qadam qolganda"},"answer":"A","explanation":"Boshliq oldiga yetishga ikki-uch qadam qolganda xizmatchi to'xtab, oyoqlarini taqab, o'ng qo'lni bosh kiyimga keltirgan holda yetib kelgani haqida bildiruv beradi.","mnemonic":"Boshliqqa 2–3 qadam qolganda to'xta + bildiruv.","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":281,"subtopic":"Ikkinchi sherengadan chiqish","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Ikkinchi sherengadagi xizmatchi safdan chiqishdan oldin nima qiladi?","options":{"A":"Chap qo'lini yelkaga qo'yadi","B":"O'ng qo'lini ko'taradi","C":"Baqiradi baland","D":"Orqaga buriladi"},"answer":"A","explanation":"Ikkinchi sherengadagi xizmatchi safdan chiqishdan oldin chap qo'lini oldindagi xizmatchi yelkasiga qo'yadi (ogohlantiradi); oldindagi xizmatchi bir qadam oldinga va o'ngga o'tib, uni oldinga o'tkazib yuboradi.","mnemonic":"2-sherengadan chiqish → oldindagiga signal (yelka).","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":282,"subtopic":"Nizom qo'llanilishi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Saf Nizomi talablari kimlarga tatbiq etiladi?","options":{"A":"Qurolli Kuchlar xizmatchilariga","B":"Davlatdagi barcha oddiy fuqarolarga","C":"Professional sportchilarga","D":"Chet el armiyasi askarlariga"},"answer":"A","explanation":"Saf Nizomi talablari O'zbekiston Qurolli Kuchlari xizmatchilariga, shuningdek harbiy xizmatni o'tash nazarda tutilgan boshqa vazirlik va idoralarga tatbiq etiladi.","mnemonic":"Nizom = QK + harbiylashtirilgan idoralar.","source":"10-sinf §9, 35-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":283,"subtopic":"Komanda ovozi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Komanda berayotgan komandirning ovozi qanday bo'lishi kerak?","options":{"A":"Saf eni va uzunligiga mutanosib","B":"Imkon qadar past","C":"Pichirlash darajasida","D":"Faqat birinchi qatorga yetadigan"},"answer":"A","explanation":"Komandirning ovozi saf eni va uzunligiga mutanosib bo'lishi kerak — toki butun saf eshitsin; komandani bajaruvchi esa ovozni keskin ko'tarmay, aniq bildiruv beradi.","mnemonic":"Ovoz = safga mutanosib (hamma eshitsin).","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":284,"subtopic":"Sanoq bilan o'rgatish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Saf usullari va harakatlari dastlab qanday o'rgatiladi?","options":{"A":"Qismlarga bo'linib, sanoq bilan","B":"Bir martada to'liq holda","C":"Darslikdan mustaqil o'qib","D":"Og'zaki tushuntirish orqali"},"answer":"A","explanation":"Saf usullari va harakatlari qismlarga bo'linib, sanoq bilan (masalan \"O'ng-GA!\" sanog'i ostida: bajar – BIR, bajar – IKKI), shuningdek tayyorlov mashqlari yordamida o'rgatiladi.","mnemonic":"O'rgatish = qismlarga bo'lib, sanoq bilan.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":285,"subtopic":"Faqat ijro komandasi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Komanda haqida quyidagi qaysi fikr to'g'ri?","options":{"A":"Ayrim hollarda faqat ijro komandasi ham bo'lishi mumkin","B":"Komanda doimo faqat dastlabki qismdan iborat","C":"Ijro komandasi hech qachon yolg'iz bo'lmaydi","D":"Dastlabki komanda har doim ikki marta beriladi"},"answer":"A","explanation":"Komandalar dastlabki va ijro komandalariga bo'linadi, ammo ayrim hollarda faqat ijro komandasi ham bo'lishi mumkin (masalan oddiy, qisqa amallar uchun).","mnemonic":"Ba'zan — faqat ijro komandasi.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":286,"subtopic":"Yurishda ortga burilish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yurish davomida burilishlar qaysi komandalarga binoan bajariladi?","options":{"A":"\"O'ng-GA!\", \"Chap-GA!\", \"Ort-GA!\"","B":"\"Tinch tur!\", \"Erkin!\"","C":"\"Saflan!\", \"Tekislan!\"","D":"\"To'xta!\", \"Qoldirilsin!\""},"answer":"A","explanation":"Yurish davomidagi burilish amallari \"O'ng-GA!\", \"Chap-GA!\", \"Ort-GA!\" komandalariga binoan bajariladi; burilishda qo'l va qadam harakatlari bir maromda bo'ladi.","mnemonic":"Yurishda burilish = O'ng/Chap/Ort-GA.","source":"10-sinf §13, 46-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":287,"subtopic":"Birinchi sherengadan chiqish","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Birinchi sherengadagi xizmatchi safdan chiqsa, uning bo'shagan o'rnini kim egallaydi?","options":{"A":"Ikkinchi sherengadagi xizmatchi","B":"Hech kim, o'rin bo'sh qoladi","C":"Komandir","D":"Eng chetdagi xizmatchi"},"answer":"A","explanation":"Birinchi sherengadagi xizmatchi safdan chiqsa, uning bo'shagan o'rnini ikkinchi sherengada turgan xizmatchi egallaydi — saf yaxlitligi saqlanadi.","mnemonic":"1-sherenga bo'shasa → 2-sherenga to'ldiradi.","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":288,"subtopic":"OLDIMGA komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"...OLDIMGA!\" komandasi bo'yicha xizmatchi qanday harakat qiladi?","options":{"A":"Qisqa yo'lda oldiga","B":"Joyida qoladi","C":"Orqaga yuradi","D":"Sekin yuradi"},"answer":"A","explanation":"\"OLDIMGA!\" komandasi bo'yicha xizmatchi to'g'riga bir-ikki qadam tashlagach, boshliq tomon burilib, uning oldiga qisqa yo'l bilan shaxdam qadam tashlab yoki yugurib boradi.","mnemonic":"\"OLDIMGA!\" → boshliqqa qisqa yo'l, shaxdam/yugurib.","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":289,"subtopic":"Bildiruv namunasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Boshliq oldiga kelgan xizmatchi qanday bildiruv beradi?","options":{"A":"Serjant, keladi","B":"Men keldim","C":"Men tayyorman","D":"Hech narsa aytadi"},"answer":"A","explanation":"Boshliq oldiga 2–3 qadam qolganda to'xtab, qo'lni bosh kiyimga keltirgan holda, masalan, \"Hurmatli serjant (serjantim), oddiy askar To'rayev buyrug'ingizga binoan keldi\" deb bildiruv beradi.","mnemonic":"Bildiruv = unvon + familiya + \"buyrug'ingizga binoan keldi\".","source":"10-sinf §15, 50-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":290,"subtopic":"Saf Nizomi tasdig'i","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Saf Nizomi kim tomonidan tasdiqlangan?","options":{"A":"Mudofaa vazirligi tasdiqladi","B":"Mahalla qo'mitasi tasdiqladi","C":"Bosh shtab boshlig'i tasdiqladi","D":"Sog'liqni saqlash vazirligi tasdiqladi"},"answer":"A","explanation":"O'zbekiston Respublikasi Qurolli Kuchlarining Saf Nizomi Mudofaa vazirligi tomonidan 2025-yil 20-mayda tasdiqlangan.","mnemonic":"Saf Nizomi → Mudofaa vazirligi.","source":"10-sinf §9, 34-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":291,"subtopic":"Komandani bajarish aniqligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Komandani bajarayotgan xizmatchi bildiruv berishda nima qiladi?","options":{"A":"Ovozni ko'tarmasdan","B":"Baland baqiradi","C":"Pichirlaydi","D":"Javob bermaydi"},"answer":"A","explanation":"Komandani bajarayotgan xizmatchi ovozni keskin ko'tarmay, aniq bildiruv berishi lozim.","mnemonic":"Bildiruv = aniq, ovozni ko'tarmay.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":292,"subtopic":"Shaxdam vs oddiy qadam","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qadamlab yurish harakati nima bilan farqlanadi?","options":{"A":"Shaxdam qadam va oddiy qadam","B":"Tez va sekin yugurish bilan","C":"O'ng va chap qadam bilan","D":"Katta va kichik qadam bilan"},"answer":"A","explanation":"Qadamlab yurish harakati shaxdam qadam (tantanali, rasmiy holatlarda) va oddiy qadam tashlab yurish bilan farqlanadi.","mnemonic":"Yurish = shaxdam yoki oddiy qadam.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":293,"subtopic":"Tana holati harakat boshida","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Shaxdam qadam dastlabki komandasida tana va vazn qanday holatga keltiriladi?","options":{"A":"Tana oldinga egiladi, vazn muvozanat saqlanib o'ng oyoqqa o'tadi","B":"Tana orqaga tashlanadi, vazn chap oyoqqa o'tadi","C":"Tana to'g'ri qoladi, vazn ikki oyoqqa teng","D":"Tizza bukiladi"},"answer":"A","explanation":"Dastlabki komanda berilganda tana biroz oldinga og'dirilib, asosiy vazni muvozanat saqlangan holda o'ng oyoqqa olib o'tiladi; ijro komandasida harakat chap oyoqdan boshlanadi.","mnemonic":"Dastlabki: tana oldinga, vazn o'ng oyoqqa.","source":"10-sinf §12, 43-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":294,"subtopic":"Burilishda qo'l-qadam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yurishdagi burilish amallari davomida qo'l va qadam harakatlari qanday bajariladi?","options":{"A":"Bir maromda uyg'un birlashtirilgan","B":"Qo'l harakatsiz qoladi","C":"Qadam to'xtaydi","D":"Qo'l va qadam alohida-alohida"},"answer":"A","explanation":"Yurish davomidagi burilish amallarida qo'l va qadam harakatlari bir maromda (uyg'un) bajariladi — bu harakatning chiroyli va tartibli bo'lishini ta'minlaydi.","mnemonic":"Burilishda qo'l + qadam — bir maromda.","source":"10-sinf §13, 46-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":295,"subtopic":"Safdan tashqarida komandaga javob","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safdan tashqaridagi xizmatchi dastlabki komandani eshitsa nima qiladi?","options":{"A":"Boshliq tomon o'girilib","B":"Joyida o'tiraveradi","C":"Komandaga e'tibor bermaydi","D":"Boshliqdan uzoqlashadi"},"answer":"A","explanation":"Safdan tashqarida turgan xizmatchi dastlabki komandani eshitsa, boshliq tomon o'girilib qad rostlab turadi.","mnemonic":"Safdan tashqari + komanda → boshliqqa o'girilib qad rost.","source":"10-sinf §10, 38-bet","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":296,"subtopic":"Saf amalini bir xil bajarish","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun safda barcha xizmatchilar saf amallarini bir xil va aniq bajarishi muhim?","options":{"A":"Saf yaxlitligi va intizomni ta'minlaydi","B":"Chiroyli tashqi ko'rinish uchun","C":"Vaqtni o'tkazish maqsadida","D":"Hech qanday ahamiyati yo'q"},"answer":"A","explanation":"Saf amallarini bir xil va aniq bajarish saf yaxlitligi, harbiy intizom va boshqaruv aniqligini ta'minlaydi; bitta xizmatchining xatosi butun safning ko'rinishi va tartibini buzadi.","mnemonic":"Bir xillik = yaxlitlik + intizom (bitta xato hammaga ta'sir).","source":"10-sinf §9-15","source_file":"038_saf_nizomi_asoslar.json","_unrep":false},{"id":297,"subtopic":"Yonma-yon saflanish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruh yonma-yon (bir sherengaga) saf tortishi uchun qaysi komanda beriladi?","options":{"A":"\"Guruh, bir sherengaga SAFLAN!\"","B":"\"Guruh, uch kolonnaga SAFLAN!\"","C":"\"Guruh, TEKISLAN!\"","D":"\"Guruh, ERKIN!\""},"answer":"A","explanation":"Guruh yonma-yon tizilib saf tortishi uchun \"Guruh, bir sherengaga SAFLAN!\" komandasi beriladi. Komandir qad rostlab, saf fronti tomon yuzlanib turadi.","mnemonic":"Yonma-yon = \"bir sherengaga SAFLAN!\"","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":298,"subtopic":"Saflanish o'rni","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"SAFLAN!\" komandasida guruh shaxsiy tarkibi komandirning qaysi tomonida saflanadi?","options":{"A":"Chap tomonida","B":"O'ng tomonida","C":"Orqasida","D":"Oldida"},"answer":"A","explanation":"Guruh shaxsiy tarkibi o'z komandirining chap tomonida saflanadi; ikki sherengali safning oxirgi qatori to'liq bo'lishi lozim.","mnemonic":"Saflanish = komandirning CHAP tomoni.","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":299,"subtopic":"Komandir kuzatuvi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Shaxsiy tarkib saflana boshlagach, guruh komandiri nima qiladi?","options":{"A":"Safdan chiqib, kuzatadi","B":"Safda turaveradi","C":"Mashg'ulotni tark etadi","D":"O'tirib oladi"},"answer":"A","explanation":"Shaxsiy tarkib saflana boshlagach, guruh komandiri safdan chiqib, o'z bo'ysunuvchilarining xatti-harakatlarini kuzatib turadi.","mnemonic":"Saflanish boshlandi → komandir chetga chiqib kuzatadi.","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":300,"subtopic":"Tekislanish — bosh holati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Chapga TEKISLAN!\" komandasida har bir xizmatchi o'zini 1-chi sanab nechanchi kishining ko'kragini ko'rishi lozim?","options":{"A":"To'rtinchi kishining","B":"Ikkinchi kishining","C":"Oltinchi kishining","D":"Birinchi kishining"},"answer":"A","explanation":"\"Chapga TEKISLAN!\" komandasiga binoan chap qanotdagidan tashqari hamma boshini chapga buradi va har bir xizmatchi o'zini birinchi sanab, to'rtinchi kishining ko'kragini ko'rishi lozim.","mnemonic":"Tekislanish = 4-kishi ko'kragini ko'r.","source":"11-sinf §1, 8-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":301,"subtopic":"ROSTLAN komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tekislanib bo'lgach beriladigan \"ROSTLAN!\" komandasiga binoan xizmatchilar nima qiladi?","options":{"A":"Barchasi qaraydi","B":"Boshini chapga buradi","C":"O'tirib oladi","D":"Tarqaladi"},"answer":"A","explanation":"Tekislanib bo'lgach \"ROSTLAN!\" komandasi beriladi; bunga binoan barcha xizmatchilar boshini to'g'riga qaratadi.","mnemonic":"ROSTLAN → to'g'riga qara.","source":"11-sinf §1, 8-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":302,"subtopic":"Tekislanish — chap qanot","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"\"Chapga TEKISLAN!\" da nima uchun chap qanotdagi xizmatchi boshini burmaydi?","options":{"A":"U tekislanish uchun tayanch nuqtadir","B":"U eng baland bo'lgani uchun","C":"U komandir bo'lgani uchun","D":"U charchagani uchun"},"answer":"A","explanation":"Chapga tekislanishda chap qanotdagi xizmatchi tayanch nuqta bo'lib qoladi — qolganlar unga qarab tekislanadi, shuning uchun u boshini burmaydi.","mnemonic":"Chap qanot = tayanch (boshini burmaydi).","source":"11-sinf §1, 8-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":303,"subtopic":"Masofa kengaytirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhda xizmatchilar orasidagi masofani kengaytirish uchun qaysi komanda beriladi?","options":{"A":"Guruh,... qadamga YOYIL!","B":"Guruh,... qadamga JIPSLAN!","C":"Guruh, TEKISLAN!","D":"Guruh, SAFLAN!"},"answer":"A","explanation":"Masofani kengaytirish uchun \"Guruh, o'ngga (chapga, o'rtadan)... qadamga YOYIL (yugurib YOYIL)!\" komandasi beriladi.","mnemonic":"Kengaytirish = YOYIL.","source":"11-sinf §2, 10-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":304,"subtopic":"Masofa qisqartirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhda xizmatchilar orasidagi masofani qisqartirish uchun qaysi komanda beriladi?","options":{"A":"Guruh, o'ngga JIPSLAN!","B":"Guruh, qadamga YOYIL!","C":"Guruh, hozir ROSTLAN!","D":"Guruh, hozir ERKIN!"},"answer":"A","explanation":"Masofani qisqartirish uchun \"Guruh, o'ngga (chapga, o'rtaga)... qadamga JIPSLAN (yugurib JIPSLAN)!\" komandasi beriladi.","mnemonic":"Qisqartirish = JIPSLAN.","source":"11-sinf §2, 10-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":305,"subtopic":"Saf o'rtasidagi tayinlangan","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Masofa saf o'rtasidan kengaytirilganda tayinlangan xizmatchi familiyasini eshitib qanday javob beradi?","options":{"A":"MEN, qo'lini uzatadi","B":"Xo'p bo'ladi, yuguradi","C":"Hech narsa demaydi","D":"Safdan chiqadi hozir"},"answer":"A","explanation":"Saf o'rtasidan kengaytirishda o'rtadagi xizmatchi tayinlanadi; u o'z familiyasini eshitib \"MEN\" deya javob beradi va o'ng qo'lini oldinga uzatib tushiradi (mo'ljal nuqtasi bo'lib qoladi).","mnemonic":"Tayinlangan o'rtadagi → \"MEN\" + qo'l signal.","source":"11-sinf §2, 10-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":306,"subtopic":"Interval saqlanishi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Masofa kengaytirilganda guruh safi tekislanar ekan, nima saqlanadi?","options":{"A":"Tayinlangan interval","B":"Avvalgi tor masofa","C":"Komandir o'rni hozir","D":"Yurish tezligi hozir"},"answer":"A","explanation":"Guruh safi tekislanar ekan, oraliq masofa kengaytirilganda tayinlangan interval saqlanadi — bu safning bir tekis va tartibli bo'lishini ta'minlaydi.","mnemonic":"Kengaytirishda — interval saqlanadi.","source":"11-sinf §2, 10-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":307,"subtopic":"Harakat yo'nalishini o'zgartirish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Yurish davomida guruh harakat yo'nalishini o'zgartirish uchun qaysi komanda beriladi?","options":{"A":"Guruh, yelka OLDINGA!","B":"Guruh, hozir TO'XTA!","C":"Guruh, hozir JIPSLAN!","D":"Guruh, hozir ERKIN!"},"answer":"A","explanation":"Harakat yo'nalishini o'zgartirish uchun joyida \"Guruh, o'ng (chap) yelka oldinga, qadam BOS!\", yurish davomida esa \"Guruh, o'ng (chap) yelka OLDINGA!\" komandasi beriladi.","mnemonic":"Yo'nalish o'zgarishi = \"... yelka OLDINGA!\"","source":"11-sinf §3, 12-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":308,"subtopic":"Burilayotgan qanot","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"\"Yelka oldinga\" burilishida harakatsiz qanotdagi xizmatchi nima qiladi?","options":{"A":"Turgan joyida qadam tashlab, buriladi","B":"To'liq qadam bilan oldinga yuguradi","C":"Joyida qotib qoladi","D":"Orqaga yuradi"},"answer":"A","explanation":"Yelka oldinga burilishida burilayotgan qanotdagi to'liq qadam tashlaydi, harakatsiz qanotdagi esa turgan joyida qadam tashlab, burilayotgan qanot harakatiga mos ravishda asta buriladi (eshik kabi).","mnemonic":"Harakatsiz qanot = joyida qadam (markaz), burilayotgani — to'liq qadam.","source":"11-sinf §3, 12-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":309,"subtopic":"Yurish safi kolonna","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Guruhning yurish safi necha kolonnagacha bo'lishi mumkin?","options":{"A":"To'rt kolonnagacha","B":"Ikki kolonnagacha","C":"Olti kolonnagacha","D":"Bir kolonna"},"answer":"A","explanation":"Guruhning yurish safi guruh tarkibidan kelib chiqqan holda to'rt kolonnagacha bo'lishi mumkin.","mnemonic":"Yurish safi = 4 kolonnagacha.","source":"11-sinf §4, 14-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":310,"subtopic":"Kolonnaga saflanish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhni joyida uch kolonnaga saflash uchun qaysi komanda beriladi?","options":{"A":"\"Guruh, uch kolonnaga SAFLAN!\"","B":"\"Guruh, bir sherengaga SAFLAN!\"","C":"\"Guruh, TEKISLAN!\"","D":"\"Guruh, YOYIL!\""},"answer":"A","explanation":"\"Guruh, uch kolonnaga SAFLAN!\" komandasi bo'yicha guruh joyida uch kolonnaga saflanadi.","mnemonic":"Kolonna soni + \"kolonnaga SAFLAN!\"","source":"11-sinf §4, 14-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":311,"subtopic":"Kolonnadan sherengaga","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhning kolonnali safdan yonma-yon (sherengali) safga qayta saflanishi qaysi burilish bilan bajariladi?","options":{"A":"Chapga burilish bilan","B":"O'ngga burilish bilan","C":"Ortga burilish bilan","D":"To'xtash bilan"},"answer":"A","explanation":"Guruhning bir (ikki) kolonnali safdan yonma-yon tizilgan sherengali safga qayta saflanishi ushbu guruhning chapga burilishi bilan bajariladi.","mnemonic":"Kolonna → sherenga: CHAPGA buril.","source":"11-sinf §4, 14-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":312,"subtopic":"Sherengadan kolonnaga","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhning yonma-yon (sherengali) safdan kolonnali safga qayta saflanishi qaysi komanda/burilish bilan bajariladi?","options":{"A":"\"Guruh, o'ng-GA!\" — o'ngga burilish bilan","B":"\"Guruh, chap-GA!\" — chapga burilish bilan","C":"\"Guruh, ort-GA!\"","D":"\"Guruh, TO'XTA!\""},"answer":"A","explanation":"Guruhning yonma-yon sherengali safdan kolonnali safga qayta saflanishi \"Guruh, o'ng-GA!\" komandasi bo'yicha o'ngga burilishi bilan bajariladi.","mnemonic":"Sherenga → kolonna: O'NGGA buril.","source":"11-sinf §4, 14-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":313,"subtopic":"Safda salom — masofa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safdagi guruh joyda turib salom berishi uchun boshliqqa necha qadam qolganda komandir komanda beradi?","options":{"A":"10–15 qadam","B":"3–4 qadam","C":"1 qadam","D":"30 qadam"},"answer":"A","explanation":"Safdagi guruh joyda turib salom berishi uchun boshliq safga kelishiga 10–15 qadam qolganda komandir \"Guruh, ROSTLAN, tekislanish O'ng-GA!\" komandasini beradi.","mnemonic":"Guruh salomi → boshliqqa 10–15 qadam qolganda.","source":"11-sinf §5, 17-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":314,"subtopic":"Kichik komandirlar qo'li","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Safda o'z joyida turgan komandir o'rinbosari va kichik komandirlar salomda nima qiladi?","options":{"A":"Qo'lni bosh kiyimga keltirmaydi","B":"Qo'lni bosh kiyimga keltiradi","C":"Safdan chiqadi","D":"Baqiradi"},"answer":"A","explanation":"Safda o'z joyida turgan guruh komandirining o'rinbosari va boshqa kichik komandirlar harbiycha salomda qo'lni bosh kiyimga keltirmaydi (faqat qad rostlab turadi).","mnemonic":"Safdagi kichik komandir → qo'l bosh kiyimga kelmaydi.","source":"11-sinf §5, 17-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":315,"subtopic":"Salom — boshini burish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Guruh, ROSTLAN, tekislanish O'ng-GA!\" komandasida shaxsiy tarkib nima qiladi?","options":{"A":"Qad rostlab, boshini o'ngga burgancha nigohi bilan boshliqni kuzatadi","B":"Joyiga o'tirib olib, dam olish holatini egallaydi","C":"Safdan chiqib, har tomonga erkin tarqalib ketadi","D":"Orqaga qarab buriladi va teskari tomonga yuzlanadi"},"answer":"A","explanation":"Bu komanda bo'yicha guruh shaxsiy tarkibi qad rostlab, boshini o'ngga (yoki belgilangan tomonga) burgancha, nigohi bilan boshliqni kuzatib turadi.","mnemonic":"Salom komandasi → qad rost + bosh boshliqqa.","source":"11-sinf §5, 17-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":316,"subtopic":"Tantanali yurish komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruh tantanali yurishni boshlash uchun komandir qaysi komandani beradi?","options":{"A":"Guruh, ROSTLAN! Tantanali yurishga, tekislanish o'ngga, qadam BOS!","B":"Guruh, ERKIN holatga o'tib, joyda biroz dam OL!","C":"Guruh, joyingda TO'XTA va harakatsiz qotib tur!","D":"Guruh, intervalga JIPSLAN va o'ngga qarab tekislan!"},"answer":"A","explanation":"Guruh komandiri ikki qadam oldinga chiqib, safga yuzlanib \"Guruh, ROSTLAN! Tantanali yurishga, tekislanish o'ngga, qadam BOS!\" komandasini beradi, so'ng harakatni guruh bilan chap oyoqdan boshlaydi.","mnemonic":"Tantanali = \"...Tantanali yurishga... qadam BOS!\"","source":"11-sinf §6, 19-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":317,"subtopic":"Tantanali yurish — qadam turi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tantanali yurishda guruh qanday qadam tashlab yuradi?","options":{"A":"Shaxdam qadam","B":"Oddiy qadam","C":"Yugurib","D":"Sakrab"},"answer":"A","explanation":"Tantanali yurishda butun guruh bir vaqtda harakat boshlaydi va shaxdam qadam tashlab to'g'riga yuradi.","mnemonic":"Tantanali yurish = shaxdam qadam.","source":"11-sinf §6, 19-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":318,"subtopic":"Tantanali yurish — rahbar oldida","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tantanali yurishda mashg'ulot rahbariga 10–15 qadam qolganda komandir qaysi komandani beradi?","options":{"A":"Guruh, ROSTLAN, O'ng‑GA!","B":"Guruh, TO'XTA, to'xtash!","C":"Guruh, JIPSLAN, yurish!","D":"Guruh, YOYIL, pastga!"},"answer":"A","explanation":"Rahbarga 10–15 qadam qolganda komandir \"Guruh, ROSTLAN, tekislanish O'ng-GA!\" komandasini beradi; shaxsiy tarkib shaxdam qadam tashlab boshini o'ngga buradi, komandir esa qo'lini bosh kiyimiga keltiradi.","mnemonic":"Rahbarga 10–15 qadam → ROSTLAN + tekislanish.","source":"11-sinf §6, 19-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":319,"subtopic":"Tantanali yurish — ERKIN","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruh mashg'ulot rahbari oldidan o'tib ketgach komandir nima qiladi?","options":{"A":"ERKIN! komandasini berib, qo'lini bosh kiyimidan tushiradi","B":"Yana bir bor qo'lini ko'tarib harbiycha salom beradi","C":"Guruhni darhol to'xtatib, qaytadan jipslashtiradi","D":"Guruhni orqaga burib, teskari tomonga yo'naltiradi"},"answer":"A","explanation":"Guruh rahbar oldidan o'tib ketgach, komandir \"ERKIN!\" komandasini berib (takrorlab), qo'lini bosh kiyimidan (chakkadan) tushiradi.","mnemonic":"Rahbardan o'tdi → \"ERKIN!\" + qo'l tushadi.","source":"11-sinf §6, 19-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":320,"subtopic":"Qurol bilan qad rostlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Qurol bilan qad rostlangan holatda avtomat qanday tutiladi?","options":{"A":"Stvoli yuqoriga, 'tasmaga' holatida, o'ng qo'l bel kamariga tegib turadi","B":"Stvoli pastga qaratilib, ikki qo'lda ushlanadi","C":"Yelkaga osilgan holatda erkin tashlab qo'yiladi","D":"Ko'krakka bosib, ikki qo'l bilan mahkam tutiladi"},"answer":"A","explanation":"Qurol bilan qad rostlash holati qurolsiz qad rostlash kabidir: stvoli yuqoriga qaratilgan qurol bel kamarining yuqori qirrasiga tegib turadigan o'ng qo'l panjasi bilan \"tasmaga\" holatida tutiladi.","mnemonic":"Qurol bilan qad rost = \"tasmaga\", stvol yuqoriga.","source":"11-sinf §7, 21-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":321,"subtopic":"Avtomat ko'krakka komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Avtomatni \"tasmaga\" holatidan \"ko'krakka\" holatiga o'tkazish uchun qaysi komanda beriladi?","options":{"A":"\"Avtomat ko'krak-KA!\"","B":"\"Avtomat tasma-GA!\"","C":"\"Avtomat yelka-GA!\"","D":"\"Avtomat oyoq-GA!\""},"answer":"A","explanation":"\"Tasmaga\" holatidagi avtomat \"Avtomat ko'krak-KA!\" komandasiga binoan uchta usul bajarilib \"ko'krakka\" holatiga o'tkaziladi.","mnemonic":"\"Avtomat ko'krak-KA!\" → 3 usul.","source":"11-sinf §8, 23-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":322,"subtopic":"Ko'krakka — necha usul","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Avtomatni \"tasmaga\"dan \"ko'krakka\" holatiga o'tkazish necha usulda bajariladi?","options":{"A":"Uchta usulda","B":"Bitta usulda","C":"Ikkita usulda","D":"To'rtta usulda"},"answer":"A","explanation":"Avtomatni \"tasmaga\" holatidan \"ko'krakka\" holatiga o'tkazish uchta ketma-ket usul (harakat) bajarib amalga oshiriladi.","mnemonic":"Tasmadan ko'krakka = 3 usul.","source":"11-sinf §8, 23-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":323,"subtopic":"Ko'krakka — birinchi usul","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"Avtomat ko'krak-KA!\" ning birinchi usulida qurol qanday holatga keltiriladi?","options":{"A":"Chap qo'lda, stvol vertikal","B":"Yelkaga osiladi, qo'l bo'sh","C":"Yerga qo'yiladi, qo'l bo'sh","D":"Orqaga tashlanadi, qo'l bo'sh"},"answer":"A","explanation":"Birinchi usulda qurol o'ng qo'l bilan tasmasi bo'ylab biroz ko'tarilib tushirilgach, chap qo'l bilan stvol osti va usti qoplamalaridan tutib olinadi; o'qdoni chapga qaragan qurol vertikal holatda, stvol og'zi iyak balandligida tutiladi.","mnemonic":"1-usul: chap qo'l qoplamada, stvol iyak balandligida.","source":"11-sinf §8, 23-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":324,"subtopic":"Yonma-yon saf — necha sherenga","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Guruhning yonma-yon tizilgan safi necha sherengali bo'lishi mumkin?","options":{"A":"Bir yoki ikki sherengali","B":"Faqat bir sherengali","C":"Uch sherengali","D":"To'rt sherengali"},"answer":"A","explanation":"Guruhning yonma-yon tizilgan safi bir yoki ikki sherengali bo'lishi mumkin; ikki sherengali safning oxirgi qatori to'liq bo'lishi lozim.","mnemonic":"Yonma-yon saf = 1 yoki 2 sherenga.","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":325,"subtopic":"Tekislanish — biroz harakat","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Tekislanish davomida xizmatchilar safni tekislash uchun nima qilishlari mumkin?","options":{"A":"Oldinga chiqishi, ortga suradi","B":"Faqat o'tirishi, harakat yo'q","C":"Safdan chiqib ketishi","D":"Qotib turishi, harakat yo'q"},"answer":"A","explanation":"Tekislanayotgan xizmatchilar safni to'g'rilash uchun biroz oldinga chiqishi, ortga yoki yon tomonga surilishi mumkin; tekislanib bo'lgach \"ROSTLAN!\" bilan to'g'riga qaraydilar.","mnemonic":"Tekislanishda — biroz suriladi (oldinga/ortga/yonga).","source":"11-sinf §1, 8-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":326,"subtopic":"Ortga burilib tekislanish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruh ortga burilib tekislanayotganida komandir nima qilishi lozim?","options":{"A":"Ko'rsatib, \"O'ngga TEKISLAN!\"","B":"Hech narsa demasligi","C":"Safdan chiqib ketishi","D":"Yurishni boshlashi"},"answer":"A","explanation":"Guruh ortga burilib tekislanayotganida komanda beruvchi komandir tekislanish tomonini ko'rsatib o'tishi lozim: \"O'ngga (chapga) TEKISLAN!\".","mnemonic":"Ortga burilib tekislanish → tomonni aniq ko'rsat.","source":"11-sinf §1, 8-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":327,"subtopic":"Front tekisligini saqlash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"\"Yelka oldinga\" burilishida o'rtadagi (qolgan) xizmatchilar front tekisligini qanday saqlaydi?","options":{"A":"Tirsagini qo'shnisiga tekkizib, qadam","B":"Bir-biridan uzoqlashib","C":"To'liq qadam tashlab oldinga","D":"To'xtab, harakatni to'xtatadi"},"answer":"A","explanation":"Burilishda qolgan xizmatchilar burilayotgan qanot tomon boshni burmay qarab, harakatsiz qanot tomondagi tirsagini qo'shnisining tirsagiga tekkizgancha front tekisligini saqlab, harakatsiz qanotga qancha masofa qolgan bo'lsa, shunga mos qisqa qadam tashlab boradi.","mnemonic":"Front tekisligi = tirsak qo'shniga tegib, qisqa qadam.","source":"11-sinf §3, 12-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":328,"subtopic":"Komandir tantanali yurish boshi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tantanali yurish komandasidan so'ng guruh komandiri qanday harakat boshlaydi?","options":{"A":"O'ng oyoqdan chap qo'lga","B":"Joyida qoladi","C":"O'ng oyoqdan boshlaydi","D":"Orqaga yuradi"},"answer":"A","explanation":"Komandir komanda bergach o'ng oyog'ining uchida chap qo'l tomon tez ortga burilib, harakatni guruh bilan bir vaqtda chap oyoq bilan boshlaydi.","mnemonic":"Komandir buriladi → guruh bilan chap oyoqdan.","source":"11-sinf §6, 19-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":329,"subtopic":"Ko'krakka — uchinchi usul","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Avtomatni \"ko'krakka\" o'tkazishning uchinchi usulida tasma qayerga tashlanadi?","options":{"A":"Bosh orqali chap yelkaga tashlanadi, o'ng qo'l qo'ndoqdan ushlaydi","B":"O'ng yelkaga oddiy tarzda osib qo'yib boriladi","C":"Bel kamariga mahkam o'rab bog'lab olinadi","D":"Yerga, askarning o'ng oyog'i yoniga tushiriladi"},"answer":"A","explanation":"Uchinchi usulda avtomat tasmasi bosh orqali o'tkazilib chap yelkaga tashlanadi; o'ng qo'l bilan qurol qo'ndog'ining bo'ynidan ushlab olinadi, chap qo'l tez pastga tushiriladi.","mnemonic":"3-usul: tasma bosh orqali chap yelkaga.","source":"11-sinf §8, 23-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":330,"subtopic":"Guruh tarkibida bir xil harakat","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Guruh tarkibida bitta ishtirokchi saf amalini noto'g'ri bajarsa, bu nimaga ta'sir qiladi?","options":{"A":"Safning yaxlitligi va ko'rinishini buzadi","B":"Hech narsaga hech qanday ta'sir qilmaydi","C":"Faqat o'sha askarga ta'sir qiladi","D":"Yurish tezligini oshiradi"},"answer":"A","explanation":"Guruh tarkibida har bir a'zoning harakati bir xil bo'lishi muhim; bitta ishtirokchi saf amalini noto'g'ri bajarsa, butun safning yaxlitligi va tartibli ko'rinishi buziladi.","mnemonic":"Bir xato → butun saf buziladi.","source":"11-sinf §3, 12-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":331,"subtopic":"Jipslashish harakati","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"\"JIPSLAN!\" komandasiga binoan xizmatchilar qanday harakatlanadi?","options":{"A":"Jipslashish tomon burilib, yarim qadamda yaqinlashib buriladi","B":"Bir-biridan teng oraliqda uzoqlashib ketadi","C":"O'z joyida qimirlamay harakatsiz qotib turadi","D":"Orqa tomonga qarab tez yugurib ketadi"},"answer":"A","explanation":"\"JIPSLAN!\" da tayinlangan o'rtadagi xizmatchidan tashqari hamma jipslashish tomon burilib, tezlashgan yarim qadam (yugurib) bosgancha belgilangan intervalga yaqinlashadi; intervalga yetgach mustaqil to'xtab, o'ngga (chapga) buriladi.","mnemonic":"JIPSLAN = yarim qadam bilan yaqinlashish.","source":"11-sinf §2, 10-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":332,"subtopic":"Salom — boshliq orqasidan","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Boshliq saf ortidan kelganida komandir nima qiladi?","options":{"A":"Shaxsiy tarkibni ortga burib, harbiycha salomlashish komandasini beradi","B":"Hech qanday harakat qilmasdan jim turadi","C":"Guruhni darhol tarqatib yuboradi va bo'shatadi","D":"O'zi safga kirib, askarlar qatoriga qo'shiladi"},"answer":"A","explanation":"Boshliq saf ortidan kelganida guruh komandiri shaxsiy tarkibni ortga burib, harbiycha salomlashish komandasini beradi — toki saf boshliqqa yuzlanib salom bersin.","mnemonic":"Boshliq orqadan → safni ortga burib salom.","source":"11-sinf §5, 17-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":333,"subtopic":"Saf tortish ahamiyati","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Guruh bilan safda turish va buyruqlarni aniq bajarish nima uchun muhim?","options":{"A":"U intizom, uyushqoqlik va jamoaviy boshqaruvni shakllantiradi","B":"Bo'sh vaqtni mazmunli o'tkazish maqsadini bajaradi","C":"Asosan askarlarni ortiqcha charchatish uchun kerak","D":"Bunday tartibning hech qanday amaliy ahamiyati yo'q"},"answer":"A","explanation":"Guruh bilan safda turish va buyruqlarni aniq bajarish harbiy intizom, uyushqoqlik, o'zaro muvofiqlik va jamoaviy boshqaruv ko'nikmalarini shakllantiradi.","mnemonic":"Saf = intizom + uyushqoqlik.","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":334,"subtopic":"Ikki sherenga oxirgi qator","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nima uchun ikki sherengali safning oxirgi qatori to'liq bo'lishi talab qilinadi?","options":{"A":"Saf yaxlit ko'rinishi, boshqaruv va hisob aniqligini ta'minlash uchun","B":"Safning tashqi chiroyli ko'rinishini ta'minlash uchun","C":"Askarlarni ko'proq charchatib chiniqtirish maqsadida","D":"Aniq bir sabab bo'lmasa-da, an'anaga ko'ra"},"answer":"A","explanation":"Ikki sherengali safning oxirgi (orqa) qatori to'liq bo'lishi talab qilinadi — bu safning tartibli va yaxlit ko'rinishini, boshqaruv va shaxsiy tarkib hisobining aniqligini ta'minlaydi.","mnemonic":"Oxirgi qator to'liq = saf yaxlit + hisob aniq.","source":"11-sinf §1, 7-bet","source_file":"039_saf_guruh.json","_unrep":false},{"id":335,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — Vatan himoyasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekiston Respublikasi Konstitutsiyasiga ko'ra Vatan himoyasi fuqarolar uchun nima hisoblanadi?","options":{"A":"Ixtiyoriy yordamchi vazifa","B":"Muqaddas burchi va majburiyati","C":"Faqat erkak fuqarolarning huquqi","D":"Davlat xodimlarining maxsus burchi"},"answer":"B","explanation":"Konstitutsiyaning 52-moddasi: 'O'zbekiston Respublikasini himoya qilish har bir fuqaroning muqaddas burchi va majburiyatidir.'","mnemonic":"Muqaddas BURCHI va MAJBURIYATI — ikki so'z birgalikda","source":"O'zR Konstitutsiyasi, 52-modda","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":336,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — harbiy xizmat tartibi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"O'quvchi harbiy xizmatni o'tash tartibi qaysi hujjat bilan belgilanishini bilmoqchi. Konstitutsiyaga ko'ra bu tartibni kim (qaysi hujjat) belgilaydi?","options":{"A":"Prezident farmoni","B":"Mudofaa vazirligi buyrug'i","C":"Qonun","D":"Vazirlar Mahkamasi qarori"},"answer":"C","explanation":"Konstitutsiya 52-modda: 'Harbiy xizmatni o'tash tartibi qonun bilan belgilanadi.' Bu 'Umumiy harbiy majburiyat...' qonunini anglatadi.","mnemonic":"Tartib → QONUN belgilaydi (farmoni yoki buyrug'i emas)","source":"O'zR Konstitutsiyasi, 52-modda","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":337,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — muqobil xizmat","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"Harbiy xizmatga e'tiqodiga ko'ra rozi bo'lmagan fuqaro konstitutsiyaviy jihatdan qanday huquqqa ega?","options":{"A":"Harbiy xizmatdan to'liq ozod etilish huquqi","B":"Muqobil xizmatni o'tash huquqi","C":"Xorijga ketish huquqi","D":"Pul badalini to'lash huquqi"},"answer":"B","explanation":"Konstitutsiya 53-modda: fuqaro qonunda belgilangan tartibda muqobil xizmatni o'tashi mumkin. Bu diniy yoki e'tiqodiy asosda berilgan huquq.","mnemonic":"E'tiqod → Muqobil xizmat (52 harbiy → 53 muqobil)","source":"O'zR Konstitutsiyasi, 53-modda; 10-sinf §4","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":338,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — Prezident vakolati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekiston Respublikasi Konstitutsiyasiga muvofiq O'zbekiston Respublikasi Qurolli Kuchlari Oliy Bosh Qo'mondoni kim?","options":{"A":"Mudofaa vaziri","B":"Bosh shtab boshlig'i","C":"Prezident","D":"Oliy Majlis raisi"},"answer":"C","explanation":"Prezident O'zR Qurolli Kuchlarining Oliy Bosh Qo'mondoni hisoblanadi — bu konstitutsiyaviy vakolat.","mnemonic":"Prezident = Oliy Bosh Qo'mondoni","source":"O'zR Konstitutsiyasi; 10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":339,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — Oliy Majlis vakolati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekiston Respublikasida urush e'lon qilish va tinchlik o'rnatish vakolati kimga tegishli?","options":{"A":"Prezidentga","B":"Xavfsizlik Kengashiga","C":"Oliy Majlisga","D":"Mudofaa vaziriga"},"answer":"C","explanation":"Urush e'lon qilish va tinchlik o'rnatish O'zR Oliy Majlisining mutaxassislashgan vakolatidir — qonun chiqaruvchi organ sifatida.","mnemonic":"Urush-tinchlik → Oliy Majlis (qonun chiqaruvchi)","source":"O'zR Konstitutsiyasi; 10-sinf §16","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":340,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — mudofaa ta'rifi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"O'qituvchi 'Mudofaa' tushunchasini tushuntiryapti. 'Mudofaa to'g'risida'gi Qonunga ko'ra quyidagilardan qaysi biri mudofaani to'g'ri ta'riflaydi?","options":{"A":"Faqat harbiy kuchlar yordamida chegara himoyasi amalga oshiriladi","B":"Siyosiy, iqtisodiy, harbiy, ijtimoiy‑huquqiy, axborot va tashkiliy tadbirlar","C":"Qurolli kuchlarning jangovar tayyorgarligi rejasi","D":"Tinch davrda harbiy mashqlar o'tkazish tizimi"},"answer":"B","explanation":"Mudofaa = suvereniteti, hududiy yaxlitligi va xavfsizligini himoya qilishning siyosiy, iqtisodiy, harbiy, ijtimoiy-huquqiy, axborot va tashkiliy tadbirlar majmuyi.","mnemonic":"SEHI-ATO: Siyosiy, Iqtisodiy, Harbiy, Ijtimoiy-huquqiy, Axborot, Tashkiliy","source":"10-sinf §16, 54-bet; 'Mudofaa to'g'risida'gi Qonun","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":341,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — mudofaa prinsiplari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","question":"O'zbekiston mudofaa sohasidagi davlat siyosatining asosiy prinsiplaridan biri sifatida quyidagilardan qaysi biri to'g'ri keladi?","options":{"A":"Harbiy-siyosiy bloklarda faol ishtirok etish","B":"Harbiy kuch ishlatmaslik va tajovuzni oldini olish","C":"Yadroviy qurol zaxiralarini saqlab turish","D":"Faqat O'zbekiston hududi doirasida xavfsizlikni ta'minlash"},"answer":"B","explanation":"Asosiy prinsiplardan biri: 'Boshqa davlatga qarshi harbiy kuch ishlatmaslik, tajovuzning oldini olish va uni daf etish.' Bu tinchliksevarlik prinsipini ifodalaydi.","mnemonic":"Kuch ISHLATmaslik → tajovuzni OLDINI OLISH","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":342,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — yadroviy qurol","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekistonning mudofaa siyosatida yadroviy va boshqa ommaviy qirg'in qurollariga nisbatan qanday prinsip qabul qilingan?","options":{"A":"Faqat tinchlik davrida bunday qurollardan foydalanmaslik","B":"Ularni ishlab chiqarish, olish, saqlash, tarqatish va joylashtirishni rad etish","C":"Boshqa davlatlar bilan birgalikda saqlash","D":"Ularni zaxira sifatida saqlab, urush davrida qo'llash"},"answer":"B","explanation":"Prinsip: 'Yadroviy va boshqa turdagi yalpi qirg'in qurollarini ishlab chiqarish, qayta ishlash, olish, saqlash, tarqatish va joylashtirishni rad etish.' To'liq rad etish.","mnemonic":"IQOST rad: Ishlab chiqarish, Qayta ishlash, Olish, Saqlash, Tarqatish","source":"10-sinf §16, 54-bet","source_file":"040_konstitutsiya_harbiy.json","_unrep":false},{"id":343,"soha":"1. Harbiy xizmat asoslari","subtopic":"Konstitutsiya — harbiy bloklar","difficulty":"Y1","cognitive":"Bilish","qtype":"single","question":"O'zbekistonning mudofaa siyosatidagi harbiy-siyosiy bloklarga nisbatan pozitsiyasi qanday?","options":{"A":"MDH har
