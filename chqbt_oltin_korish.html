<script>
const DATA=[{"id":1,"subtopic":"Avtomatning vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Kalashnikov avtomati qanday qurol turiga kiradi?","options":{"A":"Individual qurol","B":"Jamoaviy (artilleriya) quroli","C":"Reaktiv qurol","D":"Muhandislik vositasi"},"answer":"A","explanation":"Kalashnikov avtomati individual qurol bo'lib, dushmanning jonli kuchi va o't ochish vositalarini yakson qilishga mo'ljallangan.","mnemonic":"Avtomat — bitta jangchining individual quroli.","source_file":"028_kalashnikov.json","_unrep":false},{"id":2,"subtopic":"AK-74 kalibri","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"AK-74 avtomatining kalibri qancha?","options":{"A":"5,45 mm","B":"7,62 mm","C":"9 mm","D":"12,7 mm"},"answer":"A","explanation":"AK-74 ning kalibri 5,45 mm. AK-47 esa 7,62 mm.","mnemonic":"AK-74 → 5,45 mm.","source_file":"028_kalashnikov.json","_unrep":false},{"id":3,"subtopic":"O'qdon sig'imi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"AK-74 avtomatining o'qdoni necha dona patronga mo'ljallangan?","options":{"A":"20 dona","B":"30 dona","C":"45 dona","D":"60 dona"},"answer":"B","explanation":"AK-74 va AK-47 o'qdon sig'imi 30 dona, RPK-74 niki 45 dona.","mnemonic":"Avtomat — 30 patron.","source_file":"028_kalashnikov.json","_unrep":false},{"id":4,"subtopic":"Otish sur'ati","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"AK-74 ning otish sur'ati bir daqiqada necha o'qni tashkil etadi?","options":{"A":"300 dona","B":"600 dona","C":"900 dona","D":"1200 dona"},"answer":"B","explanation":"AK-74 otish sur'ati 600 o'q/daqiqa.","mnemonic":"Otish sur'ati — 600/daqiqa.","source_file":"028_kalashnikov.json","_unrep":false},{"id":5,"subtopic":"Nayza-pichoq","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Avtomatga nayza-pichoq qaysi maqsadda biriktiriladi?","options":{"A":"Qo'l jangida dushmanni yakson qilish","B":"Otish masofasini oshirish uchun","C":"Qurol og'irligini kamaytirish uchun","D":"O'q tezligini oshirish uchun"},"answer":"A","explanation":"Nayza-pichoq qo'l jangi mobaynida dushmanni yakson qilish uchun biriktiriladi.","mnemonic":"Yaqin jang → nayza-pichoq.","source_file":"028_kalashnikov.json","_unrep":false},{"id":6,"subtopic":"TTX qo'llash — nishon masofasi tanlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi dushmanning 950 metr masofadagi nishoniga AK-74 dan aniq o't ochmoqchi. AK-74 ning mo'ljalga olib otish masofasi 1000 m ekanini hisobga olsak, bu otish mumkinmi?","options":{"A":"Mumkin — nishon 1000 m ichida, otish mumkin","B":"Mumkin emas — masofa juda yaqin","C":"Mumkin emas — 1000 m dan tashqarida","D":"Faqat nayza bilan mumkin"},"answer":"A","explanation":"AK-74 ning mo'ljalga olib otish masofasi 1000 m. 950 m bu masofa ichida bo'lgani uchun aniq o't ochish mumkin.","mnemonic":"Aniq otish chegarasi — 1000 m; undan beri — mumkin.","source_file":"028_kalashnikov.json","_unrep":false},{"id":7,"subtopic":"TTX qo'llash — qurol tanlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Komandir 900 metr masofadagi nishonga aniq o't ochishni rejalashtirmoqda. Quyidagi qurollardan qaysi biri bu vazifani BAJARA OLMAYDI?","options":{"A":"AK-47 (800 m masofa)","B":"AK-74 (1000 m)","C":"RPK-74 (1000 m)","D":"Hammasi bajaradi"},"answer":"A","explanation":"AK-47 ning mo'ljalga olib otish masofasi atigi 800 m, shuning uchun 900 m dagi nishonga aniq o't ocha olmaydi. AK-74 va RPK-74 (1000 m) esa bajaradi.","mnemonic":"900 m nishon → AK-47 (800 m) yetmaydi.","source_file":"028_kalashnikov.json","_unrep":false},{"id":8,"subtopic":"TTX qo'llash — to'g'ridan-to'g'ri otish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 dan to'g'ridan-to'g'ri yo'nalishda ko'krak qiyofali nishonga otish masofasi 440 m. Nishon 400 metrda turibdi. Jangchi nima qiladi?","options":{"A":"To'g'ridan-to'g'ri o't ochishi mumkin, nishon 440 m","B":"Otishni umuman to'xtatishi kerak","C":"Faqat nayza bilan hujum qiladi","D":"Pritselni o'zgartirmasdan otib bo'lmaydi"},"answer":"A","explanation":"Ko'krak nishoni uchun to'g'ridan-to'g'ri otish masofasi 440 m. Nishon 400 m da bo'lgani uchun jangchi to'g'ridan-to'g'ri (pritselni murakkab sozlamasdan) o't ochishi mumkin.","mnemonic":"Ko'krak nishoni — 440 m gacha to'g'ridan-to'g'ri.","source_file":"028_kalashnikov.json","_unrep":false},{"id":9,"subtopic":"TTX qo'llash — og'irlik tanlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Uzoq masofaga piyoda yurish rejalashtirilgan, jangchiga eng yengil qurol kerak. Quyidagilardan qaysi birini tanlaydi?","options":{"A":"AK-74 (3,6 kg)","B":"AK-47 (4,3 kg)","C":"RPK-74 (5,46 kg)","D":"Og'irligi ahamiyatsiz"},"answer":"A","explanation":"AK-74 to'ldirilgan holatda 3,6 kg — eng yengili. AK-47 — 4,3 kg, RPK-74 — 5,46 kg. Uzoq yurishda yengillik muhim.","mnemonic":"Eng yengil — AK-74 (3,6 kg).","source_file":"028_kalashnikov.json","_unrep":false},{"id":10,"subtopic":"TTX qo'llash — patron mosligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Omborda faqat 5,45 mm patronlar bor. Quyidagi qurollardan qaysi biri bu patron bilan ishlay OLMAYDI?","options":{"A":"AK-47 (7,62 mm)","B":"AK-74 (5,45 mm)","C":"RPK-74 (5,45 mm)","D":"Hammasi ishlaydi"},"answer":"A","explanation":"AK-47 ning kalibri 7,62 mm, shuning uchun 5,45 mm patron unga to'g'ri kelmaydi. AK-74 va RPK-74 (5,45 mm) esa bu patron bilan ishlaydi.","mnemonic":"5,45 mm patron → AK-74/RPK-74, AK-47 ga emas.","source_file":"028_kalashnikov.json","_unrep":false},{"id":11,"subtopic":"Xavfsizlik qo'llash — qurol yo'nalishi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Mashg'ulot vaqtida jangchi qurolini tozalab bo'lib, uni stol ustiga qo'ymoqchi. Qurol o'qlanmagan. U nima qilishi SHART?","options":{"A":"Qurolni baribir odamlarga, yonga yoki orqaga qaratmasligi shart","B":"O'qlanmagani uchun istalgan tomonga qaratsa bo'ladi","C":"Qurolni faqat o'ng tomonga qaratishi kerak","D":"Qurolni boshqa jangchiga uzatib qo'yishi kerak"},"answer":"A","explanation":"Xavfsizlik qoidasiga ko'ra, qurol o'qlangan-o'qlanmaganidan qat'i nazar odamlarga, yonga yoki orqaga qaratish taqiqlanadi. Bu — asosiy qoida.","mnemonic":"Qurolni hech qachon odamga qaratma — o'qsiz bo'lsa ham.","source_file":"028_kalashnikov.json","_unrep":false},{"id":12,"subtopic":"Xavfsizlik qo'llash — o'qlash vaqti","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi otish marrasiga chiqdi, lekin komandir hali \"O'qlash\" komandasini bermadi. U avtomatni o'qlasa bo'ladimi?","options":{"A":"Yo'q — komandir komandasigacha o'qlash taqiqlanadi","B":"Ha — marraga chiqqach o'zi o'qlay oladi","C":"Ha, lekin faqat bitta patron bilan","D":"Ha, agar shoshilinch bo'lsa"},"answer":"A","explanation":"Boshliq (komandir) komandasigacha qurolni o'qlash qat'iyan taqiqlanadi. Faqat komanda berilgandan keyin o'qlanadi.","mnemonic":"O'qlash — faqat komandadan keyin.","source_file":"028_kalashnikov.json","_unrep":false},{"id":13,"subtopic":"Xavfsizlik qo'llash — paxtavon patron","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Mashg'ulotda jangchi paxtavon (bo'sh) patron bilan o't ochmoqchi. Yaqin atrofda, 60 metr narida boshqa jangchilar turibdi. U o't ocha oladimi?","options":{"A":"Yo'q — 100 m dan yaqin masofada otish man etiladi","B":"Ha — paxtavon patron umuman xavfsiz","C":"Ha, 50 m dan uzoq bo'lsa bo'ladi","D":"Ha, agar ular orqada tursa, xavfsiz"},"answer":"A","explanation":"Shaxsiy tarkibga 100 metrdan yaqin masofadan paxtavon patron bilan o'q uzish taqiqlanadi. 60 m — bu chegaradan yaqin, shuning uchun otib bo'lmaydi.","mnemonic":"Paxtavon patron — odamga 100 m dan yaqin otma.","source_file":"028_kalashnikov.json","_unrep":false},{"id":14,"subtopic":"Xavfsizlik qo'llash — qizil bayroq","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish maydonida bir yo'nalishda qizil bayroq ko'tarilgan. Jangchi o'sha yo'nalishda nishonni ko'rdi. Nima qiladi?","options":{"A":"Yo'q — qizil bayroq otishni taqiqlaydi","B":"Tez o't ochadi, chunki nishon ko'rindi","C":"Faqat bitta o'q uzadi","D":"Bayroqni e'tiborsiz qoldiradi"},"answer":"A","explanation":"Qizil bayroq ko'tarilgan joylar, xavfli yo'nalishlar yoki pana tomonga o'q uzish taqiqlanadi. Jangchi o'sha yo'nalishga otmasligi shart.","mnemonic":"Qizil bayroq — o'q uzma.","source_file":"028_kalashnikov.json","_unrep":false},{"id":15,"subtopic":"Xavfsizlik qo'llash — otishni to'xtatish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish davom etayotganda nishonlar maydoniga to'satdan it kirib qoldi. Jangchi nima qilishi kerak?","options":{"A":"Otishni zudlik bilan to'xtatadi","B":"Otishni davom ettiradi, it o'zi chiqib ketadi","C":"Itga qarata otadi","D":"Tezroq o'qdonni bo'shatadi"},"answer":"A","explanation":"Nishonlar maydonida insonlar, transport yoki hayvonlar paydo bo'lganda otishni zudlik bilan to'xtatish zarur.","mnemonic":"Maydonda jonzot ko'rinsa — DARHOL to'xtat.","source_file":"028_kalashnikov.json","_unrep":false},{"id":16,"subtopic":"Xavfsizlik qo'llash — o'q-dorilarni saqlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi qolgan patronlarini mashg'ulotdan keyin shimi cho'ntagiga solib qo'ymoqchi. Bu to'g'rimi?","options":{"A":"Yo'q — o'q-dorilarni cho'ntakda qoldirish taqiqlanadi","B":"Ha — o'z patroni, xohlagan joyda saqlasa bo'ladi","C":"Ha, agar kam bo'lsa","D":"Ha, ertaga qaytarib beradi"},"answer":"A","explanation":"O'q-dorilarni belgilanmagan joyda saqlash, cho'ntak yoki sumkada qoldirish taqiqlanadi. Ular belgilangan joyga topshirilishi kerak.","mnemonic":"Patron — cho'ntakda emas, belgilangan joyda.","source_file":"028_kalashnikov.json","_unrep":false},{"id":17,"subtopic":"Xavfsizlik qo'llash — nosoz qurol","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi otishdan oldin avtomatda nosozlik borligini sezdi. U nima qilishi kerak?","options":{"A":"Nosoz quroldan otmaydi, komandirga xabar beradi","B":"Ehtiyot bo'lib, baribir otadi va davom etadi","C":"Faqat bitta o'q sinab ko'radi, keyin qaror qiladi","D":"Patronni almashtirib otaveradi, keyin davom etadi"},"answer":"A","explanation":"Nosoz quroldan o't uzish qat'iyan taqiqlanadi, chunki bu baxtsiz hodisaga olib keladi. Nosozlik komandirga xabar qilinadi.","mnemonic":"Nosoz qurol — otish mumkin emas.","source_file":"028_kalashnikov.json","_unrep":false},{"id":18,"subtopic":"Xavfsizlik qo'llash — o'q-dorilarga ta'sir","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi patronlarni qumloq yerga tashlab qo'ydi va ular qumga belandi. Bu patronlarni ishlatsa bo'ladimi?","options":{"A":"Yo'q — qum o'q-dorilarga tegsa nosozlik qiladi","B":"Ha — qum hech narsaga ta'sir qilmaydi, foydalanish mumkin","C":"Ha, faqat artib tashlasa bo'ladi, ammo tavsiya etilmaydi","D":"Ha, agar quruq qum bo'lsa, xavfsiz foydalanish mumkin"},"answer":"A","explanation":"O'q-dorilarga qum, yog' yoki olov tegishi qat'iyan taqiqlanadi. Qum tekkan patron qurolda tutilish (nosozlik) keltirib chiqarishi mumkin.","mnemonic":"Patronga qum/yog'/olov — yo'q!","source_file":"028_kalashnikov.json","_unrep":false},{"id":19,"subtopic":"TTX qo'llash — tunda otish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Tungi otish vaqtida jangchi mo'ljalni (nishonni) yo'qotib qo'ydi. To'g'ri harakat qaysi?","options":{"A":"Otishni zudlik bilan to'xtatadi","B":"Taxminan otishni davom ettiradi","C":"O'qdonni to'liq bo'shatadi","D":"Yorug'lik yoqib, otadi"},"answer":"A","explanation":"Tundagi otish vaqtida mo'ljal yo'qolganda otishni zudlik bilan to'xtatish zarur — bu xavfsizlik qoidasi.","mnemonic":"Mo'ljal yo'qolsa — to'xtat.","source_file":"028_kalashnikov.json","_unrep":false},{"id":20,"subtopic":"AK-74 qism va mexanizmlari (rasm)","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/ak74_parts_darslik.png","question":"Jangchi avtomatga patron joylash uchun rasmda ko'rsatilgan qaysi qismni olishi kerak?","options":{"A":"1-qism (stvol)","B":"9-qism (o'qdon)","C":"12-qism (shompol)","D":"10-qism (nayza-pichoq)"},"answer":"B","explanation":"Patronlar o'qdonga (magazinga, 9-qism) joylanadi. 1 — stvol, 12 — shompol (tozalash uchun), 10 — nayza-pichoq.","mnemonic":"Patron → o'qdon (9-qism).","source_file":"028_kalashnikov.json","_unrep":false},{"id":21,"subtopic":"AK-74 qism va mexanizmlari (rasm)","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/ak74_parts_darslik.png","question":"Jangchi quroldan keyin tozalamoqchi va shompol (tozalash tayoqchasi) kerak bo'ldi. Rasmda u qaysi raqamda?","options":{"A":"12-raqam","B":"9-raqam","C":"4-raqam","D":"1-raqam"},"answer":"A","explanation":"Shompol — 12-raqam (tozalash tayoqchasi). 9 — o'qdon, 4 — zatvor, 1 — stvol.","mnemonic":"Tozalash → shompol (12-raqam).","source_file":"028_kalashnikov.json","_unrep":false},{"id":22,"subtopic":"TTX qo'llash — RPK ajratish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Guruhga uzluksizroq o't ochib, ko'proq patron sig'adigan qurol kerak bo'ldi. Qaysi birini tanlaydi?","options":{"A":"RPK-74 (o'qdon 45 dona)","B":"AK-74 (o'qdon 30 dona)","C":"AK-47 (o'qdon 30 dona)","D":"Farqi yo'q"},"answer":"A","explanation":"RPK-74 — qo'l pulemyoti, o'qdon sig'imi 45 dona (avtomatlarda 30). Uzluksiz o't ochish uchun mos.","mnemonic":"Uzluksiz o't → RPK-74 (45 patron).","source_file":"028_kalashnikov.json","_unrep":false},{"id":23,"subtopic":"Xavfsizlik qo'llash — past uchayotgan samolyot","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish davomida otish uchastkasi tepasidan pastlab samolyot uchib o'tdi. To'g'ri harakat qaysi?","options":{"A":"Otishni zudlik bilan to'xtatadi","B":"Samolyotga qarata otadi","C":"Otishni davom ettiradi","D":"Yashirinadi va otaveradi"},"answer":"A","explanation":"Otish uchastkasida pastlab uchayotgan samolyot yoki vertolyot paydo bo'lganda otishni zudlik bilan to'xtatish zarur.","mnemonic":"Past samolyot → otishni to'xtat.","source_file":"028_kalashnikov.json","_unrep":false},{"id":24,"subtopic":"Avtomatning ishonchliligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Chang va loyli sharoitda ishlash kerak. Nega Kalashnikov avtomati bu sharoitda afzal?","options":{"A":"Soddaligi va ishonchliligi tufayli ishlaydi","B":"Faqat juda qimmat bo'lgani uchun","C":"Otish masofasi cheksiz bo'lgani uchun","D":"Og'irligi katta bo'lgani uchun"},"answer":"A","explanation":"Kalashnikov avtomati soddaligi va yuqori ishonchliligi bilan chang, loy, sovuq kabi og'ir sharoitlarda ham nosozliksiz ishlaydi — shuning uchun dunyoda eng keng tarqalgan.","mnemonic":"Sodda + ishonchli → har sharoitda ishlaydi.","source_file":"028_kalashnikov.json","_unrep":false},{"id":25,"subtopic":"TTX qo'llash — xavfsizlik masofasi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ning aniq otish masofasi 1000 m, lekin o'q uchish uzoqligi 3150 m. Otish maydonini tashkil etishda nega aynan 3150 m hisobga olinadi?","options":{"A":"Chunki o'q 3150 m gacha uchadi, xavf tug'diradi","B":"Chunki nishon 3150 m masofada joylashgan","C":"Chunki qurol 3150 m masofada sinadi","D":"Chunki 3150 m eng aniq otish masofasi"},"answer":"A","explanation":"Uchish uzoqligi (3150 m) — o'q havoda eng uzoq qancha uchishini bildiradi. Aniq tegmagan o'q ham shu masofagacha xavfli, shuning uchun otish maydoni xavfsizligida aynan shu masofa hisobga olinadi.","mnemonic":"Xavf chegarasi = o'q uchish uzoqligi (3150 m), aniq otish emas.","source_file":"028_kalashnikov.json","_unrep":false},{"id":26,"subtopic":"TTX tahlil — o'q tezligi sababi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"RPK-74 o'qining boshlang'ich tezligi (960 m/s) AK-74 (900 m/s) dan yuqori, garchi ikkalasi ham 5,45 mm patron ishlatsa. Buning asosiy sababi nima?","options":{"A":"RPK-74 uzun stvoli gazlarni tezlashtiradi","B":"RPK-74da og'ir patron ishlatiladi","C":"RPK-74 ning kalibri kattaroq","D":"RPK-74 yengilroq qurol hisoblanadi"},"answer":"A","explanation":"Ikkala qurol ham 5,45 mm patron ishlatadi, lekin RPK-74 ning stvoli uzunroq. Uzun stvolda porox gazlari o'qqa uzoqroq ta'sir qilib, uni ko'proq tezlashtiradi — natijada 960 m/s.","mnemonic":"Uzun stvol → tezroq o'q (RPK 960 m/s).","source_file":"028_kalashnikov.json","_unrep":false},{"id":27,"subtopic":"TTX tahlil — umumiy va farqli","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74, AK-47 va RPK-74 ko'rsatkichlari taqqoslanganda qaysi xulosa to'g'ri?","options":{"A":"Otish sur'ati ~600, kalibr va og'irlik farq","B":"Hamma ko'rsatkichlari bir xil","C":"Uchchasida kalibr bir xil, og'irligida farq bor","D":"Otish sur'ati har xil, kalibr va og'irlik teng"},"answer":"A","explanation":"Otish sur'ati uchalasida ~600 o'q/daqiqa (bir xilga yaqin), ammo kalibr (5,45/7,62), og'irlik (3,6/4,3/5,46 kg) va o'qdon (30/30/45) farqlanadi.","mnemonic":"Otish sur'ati ~ bir xil; kalibr/og'irlik/o'qdon — farqli.","source_file":"028_kalashnikov.json","_unrep":false},{"id":28,"subtopic":"Tahlil — qurol-vazifa mosligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega RPK-74 avtomat emas, balki qo'l pulemyoti deb tasniflanadi?","options":{"A":"Kattaroq o'qdon, uzun stvol, tezlik","B":"U faqat to'pponcha patroni ishlatadi","C":"U yagona o'q bilan otadi","D":"U umuman ot ocha olmaydi"},"answer":"A","explanation":"RPK-74 ning kattaroq o'qdoni (45), uzunroq stvoli, yuqori o'q tezligi (960 m/s) va kattaroq og'irligi (5,46 kg) uni uzoqroq va uzluksizroq o't ochuvchi qo'l pulemyoti sifatida belgilaydi.","mnemonic":"RPK-74 = pulemyot: 45 patron, uzun stvol, uzluksiz o't.","source_file":"028_kalashnikov.json","_unrep":false},{"id":29,"subtopic":"AK-47 vs AK-74 patron","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"AK-47 patroni og'irligi qancha?","options":{"A":"10,2 g","B":"16,2 g","C":"5,45 g","D":"30 g"},"answer":"B","explanation":"AK-47 (7,62 mm) patroni 16,2 g. AK-74 va RPK-74 (5,45 mm) patroni esa 10,2 g.","mnemonic":"Yirik kalibr → og'ir patron: AK-47 = 16,2 g.","source_file":"028_kalashnikov.json","_unrep":false},{"id":30,"subtopic":"Xavfsizlik qo'llash — \"To'xtatilsin\" komandasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish vaqtida \"O't ochish to'xtatilsin!\" komandasi yangradi. Jangchi nima qiladi?","options":{"A":"Darhol otishni to'xtatadi","B":"O'qdondagi patronlarni otib tugatadi","C":"Yana bir necha o'q uzadi","D":"Komandani e'tiborsiz qoldiradi"},"answer":"A","explanation":"\"To'xtatilsin!\" (\"O't ochish to'xtatilsin!\") komandasidan keyin o'q uzish taqiqlanadi — jangchi darhol otishni to'xtatadi.","mnemonic":"\"To'xtatilsin\" → darhol to'xta.","source_file":"028_kalashnikov.json","_unrep":false},{"id":31,"subtopic":"SVD vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Dragunov merganlik miltig'i (SVD) qanday qurol hisoblanadi?","options":{"A":"Mergan quroli, yakka nishon","B":"Tankka qarshi qurol","C":"Shaxsiy to'pponcha","D":"Avtomatik pulemyot"},"answer":"A","explanation":"SVD — mergan (snayper) quroli bo'lib, birdan paydo bo'luvchi, harakatlanuvchi, ochiq va yashiringan yakka nishonlarni yo'q qilishga mo'ljallangan.","mnemonic":"SVD = mergan miltig'i, yakka nishon.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":32,"subtopic":"RPG-7 vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"RPG-7 qo'l granatomyoti asosan nimaga qarshi kurashishga mo'ljallangan?","options":{"A":"Tanklar va bronevositalarga","B":"Past uchuvchi samolyotlarga qarshi","C":"Yakka piyoda nishonlarni otishga","D":"Suvdagi kemalarni cho'ktirishga"},"answer":"A","explanation":"RPG-7 tanklar, o'ziyurar artilleriya qurilmalari va boshqa bronevositalarga qarshi mo'ljallangan. Shuningdek dushmanning yengil panalari va inshootlari ortidagi piyodaga qarshi ham ishlatiladi.","mnemonic":"RPG-7 → tankka qarshi granatomyot.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":33,"subtopic":"PM kalibri va o'qdoni","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Makarov to'pponchasi (PM)ning kalibri qancha va o'qdoni necha patronga mo'ljallangan?","options":{"A":"9 mm, 8 dona patron","B":"7,62 mm, 30 dona patron","C":"5,45 mm, 10 dona patron","D":"9 mm, 15 dona patron"},"answer":"A","explanation":"PM — 9 mm kalibrli shaxsiy qurol, o'qdoni 8 dona patronga mo'ljallangan.","mnemonic":"PM → 9 mm, 8 patron.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":34,"subtopic":"PKM nishonga olib otish masofasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"PKM pulemyotining nishonga olib otish masofasi qancha?","options":{"A":"800 m","B":"1000 m","C":"1500 m","D":"3800 m"},"answer":"C","explanation":"PKM ning nishonga olib otish masofasi 1500 m. 3800 m — o'qning maksimal uchish masofasi.","mnemonic":"PKM aniq otish — 1500 m.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":35,"subtopic":"Qurol tanlash — tank","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jang maydoniga dushman tanki yaqinlashmoqda. Uni zararlash uchun qaysi qurol eng mos?","options":{"A":"RPG-7 granatomyoti","B":"PM to'pponchasi","C":"SVD miltig'i","D":"PKM pulemyoti"},"answer":"A","explanation":"RPG-7 — aynan tanklar va bronevositalarga qarshi mo'ljallangan granatomyot. Boshqa qurollar (to'pponcha, miltiq, pulemyot) tank zirhini tesha olmaydi.","mnemonic":"Tank → RPG-7.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":36,"subtopic":"Qurol tanlash — yakka uzoq nishon","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"1200 metr masofadagi yashiringan yakka dushmanni aniq yo'q qilish kerak. Qaysi qurol tanlanadi?","options":{"A":"SVD merganlik miltig'i","B":"PM to'pponchasi","C":"RPG-7 granatomyoti","D":"AK-74 avtomati"},"answer":"A","explanation":"SVD — aynan yakka, yashiringan nishonlarni aniq yo'q qilish uchun mo'ljallangan mergan quroli (optik mo'ljal bilan 1300 m gacha). 1200 m uning imkoniyati ichida.","mnemonic":"Uzoq yakka nishon → SVD.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":37,"subtopic":"Qurol tanlash — qisqa masofa shaxsiy","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ofitserga yaqin masofada (30 m gacha) o'zini himoya qilish uchun yengil shaxsiy qurol kerak. Qaysi biri mos?","options":{"A":"PM to'pponchasi (810 g)","B":"PKM pulemyoti (8,2 kg)","C":"RPG-7 (6,3 kg)","D":"SVD (4,3 kg)"},"answer":"A","explanation":"PM — shaxsiy qurol, qisqa masofalarda (50 m gacha samarali) himoya uchun mo'ljallangan, atigi 810 g. Qolganlari og'ir va boshqa vazifaga mo'ljallangan.","mnemonic":"Yaqin masofa, shaxsiy → PM.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":38,"subtopic":"PKM TTX qo'llash — masofa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Nishon 1400 metrda. Quyidagilardan qaysi biri nishonga aniq o't ocha oladi?","options":{"A":"PKM pulemyoti","B":"PM to'pponchasi","C":"AK-74 avtomati","D":"RPK-74 qo'l pulemyoti"},"answer":"A","explanation":"PKM ning nishonga olib otish masofasi 1500 m — 1400 m uning ichida. AK-74 (1000 m) va PM (50 m) bu masofaga yetmaydi.","mnemonic":"1400 m nishon → PKM (1500 m) yetadi.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":39,"subtopic":"PM TTX qo'llash — samarali masofa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi PM to'pponchasidan 120 metr masofadagi nishonga aniq o't ochmoqchi. Bu samaralimi?","options":{"A":"Yo'q — PM samarali 50 m, 120 m uzoq","B":"Ha — PM 120 m da juda aniq","C":"Ha — PM masofasi cheksiz","D":"Faqat optik mo'ljal bilan"},"answer":"A","explanation":"PM to'pponchasidan samarali o't ochish 50 metrgacha hisoblanadi. 120 m da otish samarasiz (o'qning zarar kuchi 350 m gacha saqlansa ham, aniqlik yo'qoladi). Qisqa masofa quroli.","mnemonic":"PM samarali — atigi 50 m.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":40,"subtopic":"SVD mo'ljal turi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"SVD ning optik mo'ljal bilan otish masofasi 1300 m, ochiq mo'ljal bilan 1200 m. Mergan 1250 m nishonga otmoqchi. Qaysi mo'ljaldan foydalanishi shart?","options":{"A":"Optik mo'ljal","B":"Ochiq mo'ljal yetarli","C":"Mo'ljalsiz otsa bo'ladi","D":"Ikkalasi ham 1250 m ga yetmaydi"},"answer":"A","explanation":"Ochiq mo'ljal bilan faqat 1200 m gacha otiladi. 1250 m nishon esa optik mo'ljal (1300 m) imkoniyatida, shuning uchun mergan optik mo'ljaldan foydalanishi shart.","mnemonic":"1250 m > 1200 m → faqat optik mo'ljal.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":41,"subtopic":"RPG granata tanlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RPG-7 da PG-7V granatasi 330 m, PG-7VM granatasi 310 m ta'sirli masofaga ega. Nishon 325 metrda. Qaysi granata bilan urish mumkin?","options":{"A":"PG-7V (330 m) — 325 m uning ichida","B":"PG-7VM (310 m)","C":"Ikkalasi ham yetmaydi","D":"Ikkalasi ham bir xil yetadi"},"answer":"A","explanation":"PG-7V ning eng ta'sirli masofasi 330 m — 325 m uning ichida. PG-7VM esa atigi 310 m, demak 325 m ga yetmaydi.","mnemonic":"325 m nishon → PG-7V (330 m), VM emas.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":42,"subtopic":"Og'irlik qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi qurollardan eng og'iri qaysi (uni ko'tarib yurish eng og'ir)?","options":{"A":"PKM — 8,2 kg","B":"RPG‑7 — 6,3 kg","C":"SVD — 4,3 kg","D":"PM — 0,81 kg"},"answer":"A","explanation":"PKM — 8,2 kg, eng og'iri. RPG-7 — 6,3 kg, SVD — 4,3 kg, PM — atigi 810 g (0,81 kg).","mnemonic":"Eng og'ir — PKM (8,2 kg).","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":43,"subtopic":"RPG-7 qo'shimcha vazifa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dushman piyodasi shahar inshooti ortiga yashiringan. Tank yo'q. RPG-7 ni ishlatsa bo'ladimi?","options":{"A":"Ha — RPG‑7 yengil panalar va piyodaga","B":"Yo'q — RPG‑7 faqat tankga","C":"Yo'q — RPG‑7 piyodaga ta'sir qilmaydi","D":"Faqat ochiq maydonda"},"answer":"A","explanation":"RPG-7 asosan tankka qarshi bo'lsa-da, dushmanning yengil panalari va shahar inshootlari ortida joylashgan piyoda qo'shinini yo'q qilishda ham foydalaniladi.","mnemonic":"RPG-7 — tank + pana ortidagi piyoda.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":44,"subtopic":"PKM otish sur'ati qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"PKM va PM otish sur'ati taqqoslanganda (PKM 650-800, PM 30 o'q/daqiqa), bir daqiqada zichroq o't ochadigan qurol qaysi?","options":{"A":"PKM – daqiqada 650‑800 o'q","B":"PM — daqiqada ko'proq otadi","C":"Ikkalasi bir xil otadi","D":"PM otish sur'ati yuqori"},"answer":"A","explanation":"PKM daqiqada 650-800 o'q otadi, PM esa atigi 30. PKM ancha zichroq o't ochadi — chunki u pulemyot, PM esa to'pponcha.","mnemonic":"PKM 650-800 vs PM 30 — pulemyot zichroq.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":45,"subtopic":"SVD og'irlik/o'qdon qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Mergan SVD bilan kuzatuv olib bormoqda. SVD o'qdoni necha patron — ya'ni qayta o'qlamasdan necha marta ota oladi?","options":{"A":"8","B":"10","C":"30","D":"100"},"answer":"B","explanation":"SVD o'qdon sig'imi 10 dona. Mergan aniqlikka tayanadi, shuning uchun katta o'qdon shart emas.","mnemonic":"SVD o'qdon — 10 patron.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":46,"subtopic":"PM o'q tezligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Makarov to'pponchasi (PM) o'qining dastlabki (boshlang'ich) uchish tezligi qancha?","options":{"A":"315 m/s","B":"825 m/s","C":"900 m/s","D":"500 m/s"},"answer":"A","explanation":"PM o'qining boshlang'ich tezligi 315 m/s — bu avtomat/pulemyotlardan ancha past, chunki to'pponcha qisqa masofa quroli.","mnemonic":"PM o'q tezligi — 315 m/s (past).","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":47,"subtopic":"PKM uchish masofasi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"PKM o'qi maksimal 3800 m uchadi, aniq otish esa 1500 m. Otish maydoni xavfsizligida qaysi masofa hisobga olinadi?","options":{"A":"3800 m — o'q shu masofagacha uchadi","B":"1500 m — o'q keyin yo'qoladi","C":"658 m — stvol uzunligi","D":"100 m — xavfsiz zona"},"answer":"A","explanation":"Aniq otish 1500 m bo'lsa ham, o'q maksimal 3800 m uchadi va shu masofagacha xavfli. Otish maydoni xavfsizligida maksimal uchish masofasi hisobga olinadi.","mnemonic":"Xavf chegarasi = maksimal uchish (3800 m).","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":48,"subtopic":"Qurol-vazifa moslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi vazifa-qurol juftliklaridan qaysi biri NOTO'G'RI?","options":{"A":"Tankni yo'q qilish — PM to'pponchasi","B":"Uzoq yakka nishon — SVD","C":"Zich uzluksiz o't — PKM","D":"Yaqin shaxsiy himoya — PM"},"answer":"A","explanation":"Tankni PM to'pponchasi bilan yo'q qilib bo'lmaydi — buning uchun RPG-7 kerak. Qolgan juftliklar to'g'ri.","mnemonic":"Tank → RPG-7, PM emas.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":49,"subtopic":"SVD to'g'ridan-to'g'ri otish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"SVD dan ko'krak qiyofali nishonga to'g'ridan-to'g'ri otish masofasi 430 m. Nishon 600 m da yuguruvchi holatda. Mergan qaysi ko'rsatkichga tayanadi?","options":{"A":"640 m — yuguruvchi nishon 600 m ichida","B":"430 m — ko'krak nishoni otib bo'lmaydi","C":"Umuman otib bo'lmaydi","D":"1300 m — faqat shu masofada otadi"},"answer":"A","explanation":"Yuguruvchi nishon uchun to'g'ridan-to'g'ri otish masofasi 640 m. 600 m da yuguruvchi nishon bu imkoniyat ichida, shuning uchun mergan o't ocha oladi.","mnemonic":"Yuguruvchi nishon — 640 m gacha to'g'ridan-to'g'ri.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":50,"subtopic":"RPG-7 otish tezligi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RPG-7 ning jangovar otish tezligi bir daqiqada 4-6 granata. Bu nimani anglatadi?","options":{"A":"4‑6 marta granata bir daqiqada","B":"Bir granata 4‑6 daqiqa uchadi","C":"Granata 4‑6 km uchadi","D":"600 o'q bir daqiqada"},"answer":"A","explanation":"Jangovar otish tezligi 4-6 granata/daqiqa — bu RPG-7 dan bir daqiqada amaliy ravishda necha marta o't ochish mumkinligini bildiradi (qayta o'qlash vaqtini hisobga olgan holda).","mnemonic":"RPG-7 — 4-6 granata/daqiqa.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":51,"subtopic":"PM zarar kuchi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"PM dan samarali otish 50 m, lekin o'qning zarar yetkazish kuchi 350 m gacha saqlanadi. Bu farq nimani ko'rsatadi?","options":{"A":"50 m da aniq, 350 m da tasodifiy zarar","B":"350 m da eng aniq otadi, ammo uzoq","C":"50 m dan keyin o'q to'xtaydi, harakat yo'q","D":"Ikkalasi bir xil, farq yo'q, hammasi bir"},"answer":"A","explanation":"Samarali masofa (50 m) — aniq tegadigan masofa. Zarar yetkazish kuchi (350 m) — o'q hali ham shikast yetkaza oladigan, lekin aniqlik past bo'lgan masofa. Ikkisi har xil tushuncha.","mnemonic":"Samarali (50 m) ≠ zarar kuchi (350 m).","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":52,"subtopic":"Qurol identifikatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir qurol: 7,62 mm, og'irligi 8,2 kg, tasmali qutida 100/200 patron, otish sur'ati 650-800. Bu qaysi qurol?","options":{"A":"PKM pulemyoti","B":"SVD miltig'i","C":"PM to'pponchasi","D":"RPG-7"},"answer":"A","explanation":"Tasmali qutida 100/200 patron, 8,2 kg, yuqori otish sur'ati — bu PKM pulemyotining belgilari.","mnemonic":"Tasma 100/200 + 8,2 kg → PKM.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":53,"subtopic":"Qurol identifikatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir qurol: 9 mm, og'irligi 810 g, o'qdon 8 patron, samarali masofa 50 m. Bu qaysi qurol?","options":{"A":"PM","B":"PKM","C":"SVD","D":"AK‑74"},"answer":"A","explanation":"9 mm, 810 g, 8 patronli o'qdon, 50 m samarali masofa — bu Makarov to'pponchasi (PM).","mnemonic":"9 mm + 810 g + 8 patron → PM.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":54,"subtopic":"Tahlil — SVD vs PKM o'qdon farqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega SVD o'qdoni atigi 10 patron, PKM esa tasmada 100-200 patron sig'adi? Bu farqning sababi nima?","options":{"A":"SVD aniq, PKM tez, vazifalar farq","B":"SVD eskiroq, ammo zamonaviy","C":"SVD kichik kalibr, ammo kuchli","D":"PKM aniqroq, ammo sekin"},"answer":"A","explanation":"SVD — mergan quroli, har o'qni aniq nishonga yo'naltiradi, shuning uchun ko'p patron shart emas (10). PKM — pulemyot, dushmanni zich uzluksiz o't bilan bostiradi, shuning uchun 100-200 patron kerak. Vazifa o'qdon hajmini belgilaydi.","mnemonic":"Mergan = aniqlik (10), pulemyot = zichlik (100/200).","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":55,"subtopic":"Tahlil — RPG-7 noyobligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega RPG-7 boshqa o'qotar qurollardan (PKM, SVD, PM) tubdan farq qiladi?","options":{"A":"U granata otadi, tankni teshadi","B":"U eng yengil qurol, ammo kam kuchli","C":"U ko'p o'q otadi, ammo qisqa masofa","D":"U faqat yaqin masofada ishlaydi, cheklangan"},"answer":"A","explanation":"PKM, SVD, PM oddiy o'q otadi va tank zirhini tesha olmaydi. RPG-7 esa granata (reaktiv kumulyativ zaryad) otadi — aynan shu uni tank va bronevositalarga qarshi samarali qiladi.","mnemonic":"RPG-7 = granata otadi (o'q emas) → zirhni teshadi.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":56,"subtopic":"Tahlil — PM masofasi sababi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega PM to'pponchasining samarali otish masofasi (50 m) boshqa qurollardan ancha kichik?","options":{"A":"Shaxsiy qurol, 315 m/s, qisqa","B":"U eng zamonaviy qurol bo'lgani uchun","C":"U eng katta kalibrli","D":"U faqat mashqlar uchun"},"answer":"A","explanation":"PM — shaxsiy, yaqin masofa quroli. Qisqa stvoli va past o'q tezligi (315 m/s) tufayli samarali masofasi 50 m. U uzoq otish uchun emas, balki yaqin himoya uchun mo'ljallangan.","mnemonic":"PM = shaxsiy, yaqin (50 m), past tezlik.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":57,"subtopic":"Tahlil — qurol tanlash mantiqi","difficulty":"Y2","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dushmanning tanki bo'linma joylashgan mavqega yaqinlashmoqda. Komandir uni zararsizlantirish uchun qaysi qurolni qo'llashi to'g'ri bo'ladi?","options":{"A":"RPG-7 qo'l granatomyoti","B":"PM to'pponchasi","C":"SVD snayperlik miltig'i","D":"RPK qo'l pulemyoti"},"answer":"A","explanation":"Zirhli nishonlarga — tank, BTR, BMP — qarshi RPG-7 qo'l granatomyoti mo'ljallangan. To'pponcha, snayper miltig'i va pulemyot jonli kuchga qarshi samarali, biroq tank zirhini tesholmaydi.","mnemonic":"Tank kelsa — RPG-7.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":58,"subtopic":"PKM o'q tezligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"PKM pulemyoti o'qining boshlang'ich tezligi qancha?","options":{"A":"315 m/s","B":"825 m/s","C":"1500 m/s","D":"3800 m/s"},"answer":"B","explanation":"PKM o'qining boshlang'ich tezligi 825 m/s. 3800 m — maksimal uchish masofasi, 1500 m — nishonga olish masofasi.","mnemonic":"PKM o'q tezligi — 825 m/s.","source_file":"029_oqotar_qurollar.json","_unrep":false},{"id":59,"subtopic":"Stvol vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"AK-74 da stvol (quvur) qanday vazifani bajaradi?","options":{"A":"O'q uchishini yo'naltiradi","B":"Patronlarni saqlaydi","C":"Qurolni ifloslanishdan asraydi","D":"Yelkaga tirkaladi"},"answer":"A","explanation":"Stvol o'qning uchishini yo'naltirishga xizmat qiladi — o'q stvol kanali bo'ylab yo'naladi.","mnemonic":"Stvol — o'q yo'nalishini beradi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":60,"subtopic":"Stvol qutisi vazifasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 da stvol qutisi qanday vazifalarni bajaradi?","options":{"A":"Qism-mexanizmlarni biriktiradi, zatvor ramasi harakatini yo'naltiradi","B":"O'q-dorini magazinda saqlab, patronlarni stvolga navbat bilan uzatadi","C":"Otish vaqtida tepki kuchini yumshatib, qurolni barqaror ushlab turadi","D":"Nishonga to'g'rilash va mo'ljalga olish moslamalarini o'zida birlashtiradi"},"answer":"A","explanation":"Stvol qutisi avtomatning qism va mexanizmlarini biriktirib, zatvor ramasi harakatini yo'naltiradi va stvol kanalini zatvor bilan yopadi.","mnemonic":"Stvol qutisi — markaz: hammasini biriktiradi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":61,"subtopic":"Stvol qutisi qopqog'i","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Stvol qutisining qopqog'i nima vazifasini bajaradi?","options":{"A":"Ifloslanishdan himoya qiladi","B":"O'q tezligini oshiradi","C":"Nishonga to'g'irlaydi","D":"Patronni otadi"},"answer":"A","explanation":"Stvol qutisining qopqog'i unga joylashtirilgan qism va mexanizmlarni ifloslanishdan (chang, loy) asraydi.","mnemonic":"Qopqoq — ichini changdan saqlaydi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":62,"subtopic":"Mo'ljalga olish moslamasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi turli masofadagi nishonlarga to'g'ri otish uchun AK-74 ning qaysi qismidan foydalanadi?","options":{"A":"Mo'jlal","B":"O'qdon","C":"Qo'ndoq","D":"Gaz porsheni"},"answer":"A","explanation":"Mo'ljalga olish moslamasi avtomatni o't ochish mobaynida turli masofalardagi nishonlarga to'g'rilashga xizmat qiladi (sektor, xomut bilan masofa sozlanadi).","mnemonic":"Turli masofa → mo'ljalga olish moslamasi (pritsel).","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":63,"subtopic":"Zatvor vazifasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 da zatvor qaysi vazifalarni bajaradi?","options":{"A":"Patronni yuboradi, stvolni yopadi","B":"O'q uchish yo'nalishini belgilaydi","C":"Nishonga to'g'rilashni ta'minlaydi","D":"Qurolni ifloslanishdan saqlaydi"},"answer":"A","explanation":"Zatvor patronni patrondonga yuborish, stvol kanalini yopish, kapsulni ezish (otish) va patrondan gilzani sug'urib olish uchun xizmat qiladi.","mnemonic":"Zatvor — patron yuboradi, otadi, gilza chiqaradi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":64,"subtopic":"Zatvor ramasi gaz porsheni bilan","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Zatvor ramasi gaz porsheni bilan birgalikda nima uchun xizmat qiladi?","options":{"A":"Zatvor va zarbdor-tepki mexanizmini ishga","B":"Faqat patron saqlash uchun","C":"Nishonga to'g'rilash uchun","D":"Qo'lda ushlash uchun"},"answer":"A","explanation":"Zatvor ramasi gaz porsheni bilan birgalikda zatvor va zarbdor-tepki mexanizmini harakatga keltirish uchun xizmat qiladi (porox gazlari porshenni itaradi).","mnemonic":"Zatvor ramasi+porshen → mexanizmni harakatga keltiradi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":65,"subtopic":"Qism-vazifa moslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi qism-vazifa juftliklaridan qaysi biri NOTO'G'RI?","options":{"A":"Qo'ndoq — o'q uchishini yo'naltiradi","B":"Stvol — o'q uchishini yo'naltiradi","C":"Zatvor — gilzani sug'urib oladi","D":"Qopqoq — mexanizmlarni changdan asraydi"},"answer":"A","explanation":"Qo'ndoq o'q uchishini yo'naltirmaydi — u o't ochish mobaynida avtomatni qulay ushlashga (yelkaga tirkash) xizmat qiladi. O'q uchishini stvol yo'naltiradi.","mnemonic":"Qo'ndoq — qulay ushlash, stvol — o'q yo'naltirish.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":66,"subtopic":"Tutilish sabablari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish vaqtida avtomatda tutilish (o't ochilmaslik) ro'y berishining asosiy sabablaridan biri qaysi?","options":{"A":"Iflo, yemirilish yoki nosozlik","B":"Qurolni tez-tez tozalash","C":"Yangı o'qdon ishlatish","D":"Qurolni to'g'ri ushlash"},"answer":"A","explanation":"Tutilishlar mexanizmlarning ifloslanishi, qismlarning yemirilishi, avtomatga beparvolik va patronlarning nosozligi tufayli ro'y beradi.","mnemonic":"Tutilish: iflos + yemirilish + nosoz patron.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":67,"subtopic":"Tutilishni bartaraf etish","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Otish davomida tutilish ro'y bersa, jangchi birinchi navbatda nima qiladi?","options":{"A":"Zatvorni tortib, o'qlaydi","B":"Qurolni darhol tashlab yuboradi","C":"Stvolni suvga soladi","D":"O'qdonni olovga tutadi"},"answer":"A","explanation":"Tutilish ro'y bersa, avval qayta o'qlash bilan bartaraf etishga urinib ko'riladi — zatvor ramasi dastasidan tutib ortga oxirigacha tortiladi va otish davom ettiriladi.","mnemonic":"Tutilish → zatvor ramasini ortga tort → qayta o'qla.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":68,"subtopic":"Patron uzatilmadi — bartaraf","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"\"Patron uzatilmadi\" tutilishi qayta o'qlashdan keyin ham takrorlandi. Endi nima qilinadi?","options":{"A":"O'qdon almashtiriladi","B":"Stvol almashtiriladi","C":"Otish to'xtatib, uyga ketish","D":"Qopqoq ochiladi tezda"},"answer":"A","explanation":"\"Patron uzatilmadi\" tutilishi takrorlansa, o'qdon almashtiriladi (sabab ko'pincha o'qdonning ifloslanishi yoki nosozligi). Agar stvol qutisidagi tortqi nosoz bo'lsa, qurol ta'mirlash ustaxonasiga yuboriladi.","mnemonic":"Patron uzatilmasa, takrorlansa → o'qdon almashtir.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":69,"subtopic":"Patron tiqildi — bartaraf","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Patron stvol kesmasida tiqilib qoldi va harakatchan qismlar to'xtadi. To'g'ri harakat qaysi?","options":{"A":"Zatvor ramasi tutib, patronni chiqarish","B":"Qurolni qattiq silkitish tez","C":"Yana o'q uzishga urinish davomida","D":"Patronni bolg'a bilan urish"},"answer":"A","explanation":"Patron tiqilsa, zatvor ramasi dastasidan tutib turgan holda tiqilib qolgan patron chiqarib olinadi va otish davom ettiriladi. Takrorlansa o'qdon almashtiriladi.","mnemonic":"Patron tiqildi → ramani ushlab, patronni chiqar.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":70,"subtopic":"Ajratish tartibi — birinchi qadam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 ni noto'liq qismlarga ajratishda eng birinchi qaysi qism ajratiladi?","options":{"A":"O'qdon","B":"Stvol qutisi qopqog'i","C":"Zatvor","D":"Gaz quvuri"},"answer":"A","explanation":"Ajratish tartibida eng avval o'qdon ajratiladi (xavfsizlik uchun — patron bormi tekshiriladi), so'ng penal, shompol, qopqoq va h.k.","mnemonic":"Ajratish boshi — avval O'QDON.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":71,"subtopic":"Ajratish tartibi — ketma-ketlik","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ni ajratishda o'qdon olindi. Keyingi to'g'ri qadamlar tartibi qaysi?","options":{"A":"Anjomlar penali, shompol, stvol qutisi","B":"Stvol qutisi, shompol, penal","C":"Zatvor, gaz quvuri, shompol","D":"Gaz quvuri, penal, zatvor"},"answer":"A","explanation":"Tartib: 1) o'qdon, 2) anjomlar penali (qo'ndoq uyasidan), 3) shompol, 4) stvol qutisi qopqog'i, 5) qaytarish mexanizmi, 6) zatvor ramasi, 7) zatvor, 8) gaz quvuri.","mnemonic":"O'qdon → penal → shompol → qopqoq →...","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":72,"subtopic":"Ajratish tartibi — oxirgi qadam","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 ni noto'liq ajratishda eng oxirida qaysi qism ajratiladi?","options":{"A":"Gaz quvuri","B":"O'qdon","C":"Shompol","D":"Penal"},"answer":"A","explanation":"Noto'liq ajratishning oxirgi (8-) qadami — gaz quvuri stvol qoplamasi bilan ajratiladi.","mnemonic":"Ajratish oxiri — gaz quvuri.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":73,"subtopic":"Yig'ish — teskari tartib","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ni qayta yig'ishda birinchi qaysi qism biriktiriladi?","options":{"A":"Gaz quvuri","B":"O'qdon","C":"Stvol qutisi","D":"Shompol"},"answer":"A","explanation":"Yig'ish ajratishga teskari tartibda boshlanadi: 1) gaz quvuri stvol qoplamasi bilan,... oxirida 9) o'qdon biriktiriladi.","mnemonic":"Yig'ish boshi — gaz quvuri (teskari tartib).","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":74,"subtopic":"Yig'ishda raqamlar mosligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ni yig'ishda qismlardagi raqamlarga nega e'tibor beriladi?","options":{"A":"Raqamlar stvol qutisidagi raqamga mos","B":"Raqamlar faqat bezak maqsadida","C":"Raqam og'irlikni ko'rsatadi","D":"Raqamga e'tibor berish shart emas"},"answer":"A","explanation":"Yig'ish mobaynida qismlardagi raqamlar taqqoslab ko'riladi — gaz quvuri, zatvor ramasi, zatvor, qopqoq va boshqa qismlardagi raqam stvol qutisidagi raqamga mos kelishi kerak (ya'ni hammasi bitta avtomatniki).","mnemonic":"Qism raqami = stvol qutisi raqami (bitta avtomatniki).","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":75,"subtopic":"Ketma-ketlik ahamiyati","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ni ajratish va yig'ishda belgilangan ketma-ketlikka amal qilish nega muhim?","options":{"A":"Tartib buzilsa, qismlar nosoz","B":"Tartibning ahamiyati yo'q","C":"Asosan ish tezligini oshirish uchun","D":"Ko'proq tashqi ko'rkamlik uchun"},"answer":"A","explanation":"Ajratish-yig'ishda ketma-ketlik muhim — har qadam keyingisini imkon qiladi. Tartib buzilsa qismlar to'g'ri joylashmaydi, shikastlanishi yoki qurol nosoz bo'lishi mumkin.","mnemonic":"Tartib buzilsa → qurol nosoz.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":76,"subtopic":"Qism aniqlash (rasm)","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/ak74_parts_darslik.png","question":"Rasmda AK-74 qismlarga ajratilgan. Patronni patrondonga yuboradigan, gilzani sug'urib oluvchi qism (zatvor) qaysi raqam?","options":{"A":"4-raqam","B":"9-raqam","C":"12-raqam","D":"1-raqam"},"answer":"A","explanation":"Darslik tasnifida 4 — zatvor (patronni yuboradi, gilzani chiqaradi). 9 — o'qdon, 12 — shompol, 1 — stvol va stvol qutisi.","mnemonic":"Zatvor — 4-raqam.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":77,"subtopic":"Qism aniqlash (rasm)","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":true,"image":"/images/ak74_parts_darslik.png","question":"Rasmda qaytarish mexanizmi qaysi raqam bilan belgilangan?","options":{"A":"5-raqam","B":"9-raqam","C":"10-raqam","D":"2-raqam"},"answer":"A","explanation":"Darslik tasnifida 5 — qaytarish mexanizmi (zatvor ramasini oldinga qaytaradi). 9 — o'qdon, 10 — nayza-pichoq, 2 — stvol qutisi qopqog'i.","mnemonic":"Qaytarish mexanizmi — 5-raqam.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":78,"subtopic":"Qurol parvarishi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Avtomat uzoq vaqt ishonchli va inkorsiz xizmat qilishi uchun nima qilish kerak?","options":{"A":"Qism va mexanizmlarga xizmat","B":"Hech qachon tozalamaslik","C":"Faqat suvda saqlash","D":"Qumli joyda qoldirish"},"answer":"A","explanation":"Avtomat qism va mexanizmlarga o'z vaqtida kerakli xizmat ko'rsatilsa (tozalash, moylash), uzoq vaqt ishonchli va inkorsiz xizmat qiladi.","mnemonic":"O'z vaqtida xizmat → ishonchli qurol.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":79,"subtopic":"Tutilish-otish bog'liqligi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Patronning nosozligi otishga qanday ta'sir qiladi?","options":{"A":"Tutilishga sabab bo'lib, o't ochilmasligi yoki to'xtab qolishiga olib keladi","B":"O'q uchish tezligi va masofasini sezilarli oshiradi","C":"Otish tezligini oshirib, qurol resursini tejaydi","D":"Otishga umuman ta'sir qilmaydi, e'tiborsiz qoldiriladi"},"answer":"A","explanation":"Nosoz (buzilgan) patron tutilishlarga sabab bo'ladi — o't ochilmaydi yoki harakatchan qismlar to'xtab qoladi. Shuning uchun nosoz o'q-dorilarni ishlatish taqiqlanadi.","mnemonic":"Nosoz patron → tutilish.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":80,"subtopic":"Stvol qutisi-zatvor bog'liqligi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega stvol qutisi va zatvor birgalikda ishlashi muhim?","options":{"A":"Stvol qutisi zatvor ramasi harakatini yo'naltiradi, zatvor stvol kanalini yopadi","B":"Ular bir-biriga bog'liq bo'lmagan alohida qismlar hisoblanadi","C":"Asosan qurolning tashqi ko'rinishi va bezagi uchun muhim","D":"Asosan avtomat og'irligini oshirish vazifasini bajaradi"},"answer":"A","explanation":"Stvol qutisi zatvor ramasi (zatvor bilan) harakatini yo'naltiradi, zatvor esa patronni yuborib, stvol kanalini yopadi va otadi. Ularning birgalikdagi ishlashi otish jarayonini ta'minlaydi.","mnemonic":"Stvol qutisi yo'naltiradi, zatvor yopib-otadi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":81,"subtopic":"Penal vazifasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"AK-74 qo'ndog'idagi uyada saqlanadigan \"penal\" nima uchun ishlatiladi?","options":{"A":"Tozalash anjomlarini solib saqlash uchun","B":"Zaxira patronlarni solib saqlash uchun","C":"Qurolni moylaydigan moyni quyish uchun","D":"Nishonni to'g'rilash moslamasi sifatida"},"answer":"A","explanation":"Penal — qo'ndoq uyasidagi g'ilof bo'lib, qurolni tozalash anjomlarini solib saqlash uchun ishlatiladi. Ajratishda u qo'ndoq uyasidan chiqariladi.","mnemonic":"Penal — tozalash anjomlari uchun g'ilof.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":82,"subtopic":"Tutilish turini aniqlash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Zatvor oldingi holatda, o't ochilmadi, o'qdonda patron yo'q. Bu qaysi tutilish?","options":{"A":"Patron uzatilmadi","B":"Patron tiqildi","C":"Gilza chiqmadi","D":"Stvol yorildi"},"answer":"A","explanation":"Zatvor oldinda, o't ochilmagan, o'qdonda patron yo'q — bu \"patron uzatilmadi\" tutilishi (o'qdon ifloslangan/nosoz yoki tortqi nosoz).","mnemonic":"Patron uzatilmadi = zatvor oldinda, patron yo'q.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":83,"subtopic":"Tepki va saqlagich (yig'ishda)","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"AK-74 ni yig'ib bo'lgach, qopqoq biriktirilgandan keyin tepki bilan nima qilinadi?","options":{"A":"Tepki jangovar vzvoddan tushiriladi","B":"Tepki ortga tortilib qoldiriladi va keyin saqlanadi","C":"Tepki olib tashlanadi va keyin qutilib ketadi","D":"Hech narsa qilinmaydi va holat saqlanadi"},"answer":"A","explanation":"Yig'ishda qopqoq biriktirilgach, tepki jangovar vzvoddan tushiriladi va saqlagichga qo'yiladi (xavfsizlik uchun), so'ng shompol, penal va o'qdon biriktiriladi.","mnemonic":"Yig'ishda: tepkini tushir → saqlagichga qo'y.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":84,"subtopic":"Stvol qoplamasi-gaz quvuri","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Ajratishda \"gaz quvuri stvol qoplamasi bilan\" qadami ajratishning qaysi o'rnida turadi?","options":{"A":"Eng oxirida (8-qadam)","B":"Eng boshida (1-qadam)","C":"O'qdondan keyin darhol","D":"Shompoldan oldin"},"answer":"A","explanation":"Gaz quvuri stvol qoplamasi bilan ajratish — noto'liq ajratishning eng oxirgi (8-) qadami; yig'ishda esa u birinchi biriktiriladi.","mnemonic":"Gaz quvuri — ajratishda oxiri, yig'ishda boshi.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":85,"subtopic":"Mo'ljalga olish moslamasi qismlari","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Nishon masofasiga qarab mo'ljalni sozlash uchun mo'ljalga olish moslamasidagi qaysi qism harakatlantiriladi?","options":{"A":"Xomut","B":"O'qdon","C":"Gaz porsheni","D":"Shompol"},"answer":"A","explanation":"Mo'ljalga olish moslamasida xomut sektor (planka) bo'ylab suriladi va shu orqali masofa (mo'ljal) sozlanadi.","mnemonic":"Masofa sozlash → xomutni sektor bo'ylab sur.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":86,"subtopic":"Zatvor ramasidan zatvor","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Noto'liq ajratishda zatvor ramasi ajratilgandan keyin keyingi qadam nima?","options":{"A":"Ramasidan zatvor ajratiladi","B":"O'qdon qismini ajratiladi","C":"Shompol qismini ajratiladi","D":"Qurol qismini yig'iladi"},"answer":"A","explanation":"Tartib: 6) zatvor ramasi (zatvor bilan) ajratiladi, 7) zatvor ramasidan zatvor ajratiladi, 8) gaz quvuri ajratiladi.","mnemonic":"Zatvor ramasi → undan zatvorni ajrat.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":87,"subtopic":"Tozalash zarurati tahlili","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega avtomat aynan noto'liq qismlarga ajratiladi (to'liq emas)?","options":{"A":"Kundalik tozalash, moylash va ko'zdan kechirish uchun yetarli bo'lgani uchun","B":"Avtomatni texnik jihatdan to'liq ajratib bo'lmaydigani uchun","C":"To'liq ajratilganda mayda qismlar yo'qolib qolgani uchun","D":"Bunday tartibning aniq bir texnik sababi bo'lmagani uchun"},"answer":"A","explanation":"Noto'liq ajratish kundalik tozalash, moylash va qurolni ko'zdan kechirish uchun yetarli. To'liq ajratish esa faqat kuchli ifloslanish, ta'mirlash kabi maxsus hollarda va malakali mutaxassis tomonidan bajariladi.","mnemonic":"Noto'liq ajratish — kundalik tozalash uchun yetarli.","source_file":"030-32_ak74_qism_tutilish.json","_unrep":false},{"id":88,"subtopic":"RGD-5 vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"RGD-5 qo'l granatasi qaysi maqsadda ishlatiladi?","options":{"A":"Dushman jonli kuchini yakson","B":"Dushman tanklarini yo'q qilish","C":"Jangda signal berish","D":"Inshootlarni yoritish"},"answer":"A","explanation":"RGD-5 — parchalanuvchi qo'l granatasi, dushmanning jonli kuchini hujum va mudofaa mobaynida yakson qilish uchun mo'ljallangan.","mnemonic":"RGD-5 — hujum + mudofaa, jonli kuchga qarshi.","source_file":"033_granatalar.json","_unrep":false},{"id":89,"subtopic":"F-1 vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"F-1 qo'l granatasi asosan qaysi jang turida ishlatiladi?","options":{"A":"Asosan mudofaa mobaynida","B":"Asosan hujumda ochiq maydonda","C":"Suv ostida jang qilinganda","D":"Havodan desant tashlanganda"},"answer":"A","explanation":"F-1 — asosan mudofaa mobaynida dushmanning jonli kuchini yakson qilish uchun mo'ljallangan (parchalari uzoq uchgani uchun panadan tashlanadi).","mnemonic":"F-1 — asosan mudofaa quroli.","source_file":"033_granatalar.json","_unrep":false},{"id":90,"subtopic":"RGD-5 parcha radiusi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"RGD-5 granatasining o'ldiruvchi parchalari uchish radiusi qancha?","options":{"A":"25 m","B":"100 m","C":"200 m","D":"5 m"},"answer":"A","explanation":"RGD-5 o'ldiruvchi parchalarining uchish radiusi 25 m. F-1 niki esa 200 m.","mnemonic":"RGD-5 parcha radiusi — 25 m.","source_file":"033_granatalar.json","_unrep":false},{"id":91,"subtopic":"F-1 parcha radiusi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"F-1 granatasining o'ldiruvchi parchalari uchish radiusi qancha?","options":{"A":"25 m","B":"50 m","C":"200 m","D":"350 m"},"answer":"C","explanation":"F-1 o'ldiruvchi parchalarining uchish radiusi 200 m — RGD-5 (25 m) dan ancha katta.","mnemonic":"F-1 parcha radiusi — 200 m (katta!).","source_file":"033_granatalar.json","_unrep":false},{"id":92,"subtopic":"Zapal yonish vaqti","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"RGD-5 va F-1 granatalarining zapal sekinlatkichi necha soniyada portlaydi?","options":{"A":"1-2 soniya","B":"3,2-4,2 soniya","C":"10-12 soniya","D":"Darhol"},"answer":"B","explanation":"Ikkala granata zapali ham 3,2-4,2 soniyada portlaydi — cheka tortilgandan keyin shu vaqt o'tib portlaydi.","mnemonic":"Zapal yonishi — 3,2-4,2 soniya (ikkalasi ham).","source_file":"033_granatalar.json","_unrep":false},{"id":93,"subtopic":"F-1 xavfsizlik qo'llash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"F-1 parchalari 200 m uchadi, lekin uni o'rtacha 35-45 m ga uloqtirib bo'ladi. Bu nimani anglatadi va jangchi qanday ehtiyot chorasini ko'rishi shart?","options":{"A":"Parchalar tashlovchigacha yetib boradi","B":"Hech qanday xavf yo'q, ochiq maydondan tashlayveradi","C":"Granata umuman portlamaydi","D":"Parchalar faqat oldinga uchadi"},"answer":"A","explanation":"F-1 parchalari (200 m) tashlangan masofadan (35-45 m) ancha uzoq uchadi, ya'ni tashlovchining o'zigacha yetib boradi. Shuning uchun F-1 faqat ishonchli pana (xandaq, devor) ortidan tashlanadi — bu uning mudofaa quroli ekanligining sababi.","mnemonic":"F-1: parcha (200 m) > tashlash (45 m) → faqat panadan!","source_file":"033_granatalar.json","_unrep":false},{"id":94,"subtopic":"Granata tanlash — hujum","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi ochiq maydonda oldinga yurib (hujumda) granata tashlamoqchi. Parcha radiusi kichik bo'lgan qaysi granata xavfsizroq?","options":{"A":"RGD-5 (parcha radiusi 25 m)","B":"F-1 (parcha radiusi 200 m)","C":"Farqi yo'q","D":"Ikkalasi ham hujumda taqiqlangan"},"answer":"A","explanation":"Hujumda ochiq harakatlanganda RGD-5 mos — parcha radiusi atigi 25 m, tashlash masofasi (40-50 m) dan kichik, shuning uchun tashlovchiga xavf kam. F-1 (200 m) ochiq hujumda xavfli.","mnemonic":"Hujum ochiqda → RGD-5 (kichik radius).","source_file":"033_granatalar.json","_unrep":false},{"id":95,"subtopic":"Granata tanlash — mudofaa","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Jangchi xandaq (pana) ichida turib, keng maydonda yaqinlashayotgan ko'p dushmanni eng katta zarar bilan to'xtatmoqchi. Qaysi granata mos?","options":{"A":"F-1 granatasi","B":"RGD-5 granatasi","C":"RGN granatasi","D":"RGO granatasi"},"answer":"A","explanation":"Xandaqda pana bo'lganda F-1 mos — keng parcha radiusi (200 m) ko'p dushmanga zarar yetkazadi, jangchi esa pana ortida himoyalangan. Bu — mudofaa holati.","mnemonic":"Panada mudofaa → F-1 (keng radius).","source_file":"033_granatalar.json","_unrep":false},{"id":96,"subtopic":"Og'irlik taqqoslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RGD-5 (310 g) va F-1 (600 g) dan qaysi biri yengilroq va shuning uchun uzoqroqqa tashlanishi mumkin?","options":{"A":"RGD-5 — yengilroq (310 g), 40‑50 m","B":"F-1 — og'irroq (600 g), 30‑40 m","C":"Ikkalasi bir xil og'irlikda (310 g/600 g)","D":"Og'irlik masofaga ta'sir qilmaydi"},"answer":"A","explanation":"RGD-5 (310 g) F-1 (600 g) dan yengilroq, shuning uchun uzoqroqqa — o'rtacha 40-50 m ga tashlanadi (F-1: 35-45 m).","mnemonic":"RGD-5 yengil (310 g) → uzoqroq tashlanadi.","source_file":"033_granatalar.json","_unrep":false},{"id":97,"subtopic":"Granata identifikatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir granata: parcha radiusi 200 m, og'irligi 600 g, korpus cho'yandan quyilgan, ariqchali. Bu qaysi granata?","options":{"A":"F-1","B":"RGD-5","C":"RPG-7","D":"UZRGM"},"answer":"A","explanation":"200 m parcha radiusi, 600 g, cho'yan korpus va ariqcha (rebra) — bu F-1 granatasining belgilari.","mnemonic":"200 m + 600 g + cho'yan → F-1.","source_file":"033_granatalar.json","_unrep":false},{"id":98,"subtopic":"Granata identifikatsiya","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Bir granata: parcha radiusi 25 m, og'irligi 310 g, hujum va mudofaada ishlatiladi. Bu qaysi granata?","options":{"A":"RGD-5","B":"F-1","C":"PM","D":"RPG-7"},"answer":"A","explanation":"25 m parcha radiusi, 310 g, hujum+mudofaa — bu RGD-5 granatasi.","mnemonic":"25 m + 310 g + hujum → RGD-5.","source_file":"033_granatalar.json","_unrep":false},{"id":99,"subtopic":"UZRGM zapal vazifasi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Granataning UZRGM zapali qanday vazifani bajaradi?","options":{"A":"Granataning portlovchi zaryadini portlatadi","B":"Granatani uzoqqa uchiradi","C":"Granata rangini o'zgartiradi","D":"Granata og'irligini kamaytiradi"},"answer":"A","explanation":"UZRGM (unifikatsiyalangan modernizatsiyalashtirilgan) zapal granataning portlovchi zaryadini portlatish uchun xizmat qiladi.","mnemonic":"Zapal → portlovchi zaryadni portlatadi.","source_file":"033_granatalar.json","_unrep":false},{"id":100,"subtopic":"Trubka tiqin qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RGD-5 granatasini uloqtirishga tayyorlamoqchi. Trubkadagi plastmassa tiqin o'rniga nima qilinadi?","options":{"A":"Tiqin o'rniga zapal burib o'rnatish","B":"Tiqin joyida qoldiriladi","C":"Tiqin ustiga yana bir tiqin qo'yish","D":"Korpusni ochib, tiqinni olib tashlash"},"answer":"A","explanation":"Saqlash vaqtida trubkani ifloslanishdan asrash uchun plastmassa tiqin buraladi. Uloqtirishga tayyorlanganda tiqin o'rniga trubkaga zapal burab o'rnatiladi.","mnemonic":"Tayyorlash: tiqin chiqar → zapal o'rnat.","source_file":"033_granatalar.json","_unrep":false},{"id":101,"subtopic":"Tashlash masofasi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Dushman 30 metr narida ochiq joyda. Jangchi RGD-5 (parcha radiusi 25 m) ni o'rtacha 40-50 m ga tashlay oladi. Bu xavfsizmi?","options":{"A":"Ha — 30 m ichida, 25 m radiusdan tashqarida himoya","B":"Yo'q — granata umuman yetmaydi","C":"Yo'q — RGD-5 faqat 5 m ga uchadi","D":"Faqat F-1 bilan amalga oshiriladi"},"answer":"A","explanation":"RGD-5 ni 40-50 m ga tashlash mumkin, demak 30 m dagi nishonga yetadi. Parcha radiusi 25 m bo'lgani uchun 30 m da turgan jangchiga zarar yetmaydi — xavfsiz.","mnemonic":"30 m nishon, 25 m radius → RGD-5 xavfsiz.","source_file":"033_granatalar.json","_unrep":false},{"id":102,"subtopic":"Tarkib — RGD-5","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RGD-5 granatasining asosiy qismlari qaysilar?","options":{"A":"Korpus, zapal trubi, zaryad, zapal","B":"Faqat korpus va o'q","C":"Stvol, zatvor va o'qdon","D":"Optik mo'ljal va prujina"},"answer":"A","explanation":"RGD-5 korpus, zapal uchun trubka, portlovchi zaryad va zapaldan tashkil topgan. Korpus quyi (tub) va yuqori (qalpoq) qismlardan iborat.","mnemonic":"RGD-5 = korpus + trubka + zaryad + zapal.","source_file":"033_granatalar.json","_unrep":false},{"id":103,"subtopic":"Korpus vazifasi qo'llash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Granata portlaganda parchalar hosil qilishda qaysi qism asosiy rol o'ynaydi?","options":{"A":"Korpus — parchalanadi","B":"Zapal — parchalarni uchiradi","C":"Plastmassa tiqin","D":"Manjet"},"answer":"A","explanation":"Granata korpusi portlovchi zaryadni o'z ichiga oladi va portlash mobaynida parchalanib, dushmanga zarar yetkazadigan parchalar hosil qiladi.","mnemonic":"Parchalar — korpusdan.","source_file":"033_granatalar.json","_unrep":false},{"id":104,"subtopic":"F-1 korpus materiali","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"F-1 granatasining korpusi nimadan quyilgan va u qanday tuzilishga ega?","options":{"A":"Cho'yandan, uzunasiga","B":"Plastmassadan, silliq","C":"Qog'ozdan","D":"Yog'ochdan"},"answer":"A","explanation":"F-1 korpusi cho'yandan quyilgan bo'lib, uzunasiga va ko'ndalang ketgan ariqchalardan iborat — bu parchalanishni yaxshilaydi.","mnemonic":"F-1 korpus — cho'yan + ariqcha (rebra).","source_file":"033_granatalar.json","_unrep":false},{"id":105,"subtopic":"Tashlash uzoqligi taqqoslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RGD-5 (40-50 m) va F-1 (35-45 m) dan qaysi biri o'rtacha uzoqroqqa tashlanadi va nega?","options":{"A":"RGD-5 — yengilroq (310 g) bo'lgani uchun uzoqroqqa (40-50 m)","B":"F-1 — og'irroq bo'lgani uchun uzoqroqqa","C":"Ikkalasi ham 100 m ga tashlanadi","D":"Tashlash uzoqligi og'irlikga bog'liq emas"},"answer":"A","explanation":"RGD-5 (310 g) F-1 (600 g) dan yengil bo'lgani uchun o'rtacha uzoqroqqa — 40-50 m ga tashlanadi (F-1: 35-45 m).","mnemonic":"Yengil RGD-5 → uzoqroq tashlanadi.","source_file":"033_granatalar.json","_unrep":false},{"id":106,"subtopic":"Zapal trubka vazifasi","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"RGD-5 dagi \"zapal uchun trubka\" qanday vazifani bajaradi?","options":{"A":"Zapalni granataga biriktiradi va portlovchi zaryadni mahkam yopadi","B":"Granatani ma'lum bir masofaga uchirib yuboradi","C":"Portlashda hosil bo'ladigan parchalar sonini oshiradi","D":"Granata korpusining rangi va belgisini ko'rsatadi"},"answer":"A","explanation":"Trubka zapalni granataga biriktirish va korpus ichidagi portlovchi zaryadni germetizatsiyalash (mahkam yopish, namlikdan himoya) uchun xizmat qiladi.","mnemonic":"Trubka — zapalni ulaydi + zaryadni yopadi.","source_file":"033_granatalar.json","_unrep":false},{"id":107,"subtopic":"Vazifa-granata moslash","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Quyidagi granata-vazifa juftliklaridan qaysi biri NOTO'G'RI?","options":{"A":"F-1 — ochiq maydonda yugurib hujumga ideal","B":"RGD-5 — hujum va mudofada ishlatiladi","C":"F-1 — asosan mudofaa quroli","D":"RGD-5 — parcha radiusi 25 m"},"answer":"A","explanation":"F-1 ochiq hujumda ideal EMAS — uning parchalari 200 m uchadi, tashlash esa 35-45 m, shuning uchun ochiqda tashlovchining o'zi zararlanadi. F-1 — mudofaa (pana) quroli.","mnemonic":"F-1 ochiq hujumga mos emas — pana kerak.","source_file":"033_granatalar.json","_unrep":false},{"id":108,"subtopic":"Reaksiya vaqti qo'llash","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Granata chekasi tortilgach 3,2-4,2 soniyada portlaydi. Nega bu \"sekinlatkich\" (sekinlashtiruvchi) vaqt zarur?","options":{"A":"Granata nishonga yetib, optimal vaqtda portlash uchun","B":"Granata og'irroq bo'lishi uchun","C":"Tashlovchini charchatish maqsadida","D":"Granata rangini o'zgartirish uchun"},"answer":"A","explanation":"3,2-4,2 soniyalik sekinlatkich granata tashlangach nishonga yetib borishiga imkon beradi — agar darhol portlasa, tashlovchining o'ziga zarar yetar, juda kech portlasa dushman uloqtirib yuborar edi.","mnemonic":"Sekinlatkich (3,2-4,2 s) — nishonga yetishi uchun.","source_file":"033_granatalar.json","_unrep":false},{"id":109,"subtopic":"Parcha radiusi tahlil","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Nega F-1 (200 m radius) hujum quroli emas, balki mudofaa quroli deb tasniflanadi?","options":{"A":"Parcha radiusi tashlash masofasidan katta bo'lib, faqat panadan tashlanadi","B":"Korpusi juda yengil bo'lgani sababli uzoqqa ucha olmaydi","C":"Parchalari juda kam bo'lib, faqat oldinga tomon tarqaladi","D":"Faqat yopiq xona ichida qo'llashga mo'ljallangani uchun"},"answer":"A","explanation":"F-1 parchalari 200 m uchadi, lekin uni faqat 35-45 m ga tashlash mumkin. Demak parchalar tashlovchigacha qaytib yetadi — shuning uchun u faqat ishonchli pana (mudofaa) ortidan ishlatiladi.","mnemonic":"Parcha > tashlash → mudofaa quroli (F-1).","source_file":"033_granatalar.json","_unrep":false},{"id":110,"subtopic":"Granata-portlovchi farqi","difficulty":"Y1","cognitive":"Mulohaza","qtype":"single","requires_image":false,"question":"Granata oddiy portlovchi moddadan nimasi bilan farq qiladi?","options":{"A":"Granata maxsus korpus, zapal va sekinlatkichga ega, vaqtni boshqaradi","B":"Granata umuman portlamaydi va zarar yetkazmaydi","C":"Granata faqat tutun chiqaradi, signal beradi","D":"Hech qanday farqi yo'q, oddiy portlovchi"},"answer":"A","explanation":"Granata oddiy portlovchidan farqli ravishda tugallangan jangovar vosita: korpusi parcha hosil qiladi, zapali sekinlatkich bilan boshqariladigan vaqtda portlatadi — ya'ni nazorat ostidagi, samarali qurol.","mnemonic":"Granata = korpus + zapal + sekinlatkich (nazoratli portlash).","source_file":"033_granatalar.json","_unrep":false},{"id":111,"subtopic":"Granata tanlash kompleks","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Vzvod ochiq dalada hujumga o'tmoqda. Komandir qaysi granatani tavsiya qiladi va nega?","options":{"A":"Radiusi 25 m, ochiq hujumda xavf kam","B":"F‑1 — keng radius hujumda foydali","C":"Hech qanday granata","D":"Ikkalasini birga"},"answer":"A","explanation":"Ochiq hujumda RGD-5 mos — parcha radiusi (25 m) tashlash masofasi (40-50 m) dan kichik, shuning uchun oldinga yurayotgan jangchiga xavf kam. F-1 (200 m) ochiqda xavfli bo'lar edi.","mnemonic":"Ochiq hujum → RGD-5.","source_file":"033_granatalar.json","_unrep":false},{"id":112,"subtopic":"F-1 og'irligi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"F-1 qo'l granatasining to'liq og'irligi qancha?","options":{"A":"310 g","B":"600 g","C":"810 g","D":"1000 g"},"answer":"B","explanation":"F-1 to'liq og'irligi 600 g. RGD-5 niki esa 310 g.","mnemonic":"F-1 — 600 g (og'irroq).","source_file":"033_granatalar.json","_unrep":false},{"id":113,"subtopic":"Qonun maqsadi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"\"Qurol to'g'risida\"gi Qonun nimani tartibga soladi?","options":{"A":"Qurol muomalasi: ishlab chiqarish, sotish, egasi, saqlash","B":"Harbiy texnikani ishlab chiqarish va sinovdan o'tkazishni","C":"Sport musobaqalari qoidalari va tartibini belgilaydi","D":"Davlat chegarasi va bojxona nazoratini tartibga soladi"},"answer":"A","explanation":"Qonun qurol muomalasi sohasidagi munosabatlarni — qurolni ishlab chiqarish, sotib olish, sotish, ega bo'lish, saqlash, olib yurish va undan foydalanishni tartibga soladi.","mnemonic":"Qonun = qurol \"muomalasi\" (aylanishi)ning barcha bosqichlari.","source":"\"Qurol to'g'risida\"gi Qonun, 1-modda","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":114,"subtopic":"Qurol ta'rifi","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qonunga ko'ra \"qurol\" tushunchasi qanday qurilma yoki buyumni bildiradi?","options":{"A":"Tirik yoki boshqa nishonni shikastlash uchun","B":"Har qanday metalldan yasalgan, har maqsadda ishlatiladi","C":"Faqat poroh yordamida, faqat bir maqsad uchun ishlaydigan qurilma","D":"Faqat armiyada ishlatiladigan texnika"},"answer":"A","explanation":"Qurol — tirik yoki boshqa nishonni shikastlash, shuningdek signal berish uchun konstruktiv jihatdan mo'ljallangan qurilma va buyumlardir. Asosiy mezon — konstruktiv mo'ljal.","mnemonic":"Mezon = \"konstruktiv mo'ljal\" (nishonni shikastlash uchun ataylab yasalgan).","source":"\"Qurol to'g'risida\"gi Qonun, asosiy tushunchalar","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":115,"subtopic":"Maqsadi bo'yicha tasnif","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Qurol qo'llanish maqsadiga ko'ra qanday uch turga bo'linadi?","options":{"A":"Fuqarolik, xizmat va harbiy qurol","B":"Yengil, o'rta va og'ir qurol","C":"Eski, yangi va eksperimental qurol","D":"Ichki, tashqi va aralash qurol"},"answer":"A","explanation":"Maqsadiga ko'ra qurol uch turga bo'linadi: fuqarolik, xizmat va harbiy (jangovar) qurol.","mnemonic":"F-X-H: Fuqarolik – Xizmat – Harbiy.","source":"\"Qurol to'g'risida\"gi Qonun, qurol turlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":116,"subtopic":"Harakat tamoyili bo'yicha tasnif","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Snaryadni poroh yoki boshqa zaryad energiyasi hisobiga yo'naltirilgan harakatga keltiradigan qurol qaysi turga kiradi?","options":{"A":"O'q-otar qurol","B":"Sovuq qurol","C":"Pnevmatik qurol","D":"Gaz quroli"},"answer":"A","explanation":"O'q-otar qurolda snaryad (o'q) poroh yoki boshqa zaryad gazlari energiyasi hisobiga harakatga keltiriladi. Bu uni pnevmatik (siqilgan gaz) va sovuq (muskul kuchi) quroldan ajratib turadi.","mnemonic":"O'q-otar = poroh energiyasi; pnevmatik = siqilgan gaz; sovuq = muskul kuchi.","source":"\"Qurol to'g'risida\"gi Qonun, qurol turlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":117,"subtopic":"Sovuq qurol","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Nishonga inson muskul kuchi yordamida bevosita ta'sir etadigan qurol qaysi turga kiradi?","options":{"A":"Sovuq qurol","B":"O'q-otar qurol","C":"Gaz quroli","D":"Signal quroli"},"answer":"A","explanation":"Sovuq qurol nishonga inson muskul kuchi yordamida bevosita yaqindan ta'sir etish uchun mo'ljallangan (masalan, pichoq, nayza). Otiladigan snaryad yo'q.","mnemonic":"Sovuq = \"qo'l kuchi\", bevosita, yaqindan.","source":"\"Qurol to'g'risida\"gi Qonun, qurol turlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":118,"subtopic":"Pnevmatik qurol","difficulty":"Y1","cognitive":"Qo'llash","qtype":"single","requires_image":false,"question":"Mashg'ulotda o'quvchi siqilgan gaz (havo) energiyasi bilan o'q otadigan quroldan foydalandi. Bu qaysi turdagi qurol?","options":{"A":"Pnevmatik qurol","B":"O'q-otar qurol","C":"Sovuq qurol","D":"Harbiy qurol"},"answer":"A","explanation":"Pnevmatik qurolda snaryad siqilgan, suyultirilgan yoki suyuq gaz energiyasi hisobiga harakatga keltiriladi. IJ-38 kabi mashq qurollari shu turga kiradi.","mnemonic":"Pnevma = havo/gaz → pnevmatik qurol.","source":"\"Qurol to'g'risida\"gi Qonun, qurol turlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":119,"subtopic":"Gaz quroli","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Gaz quroli nima vazifasini bajaradi?","options":{"A":"Ko'z yoshi yoki ta'sir etuvchi modda bilan nishonni vaqtincha zararsizlantiradi","B":"Snaryadni poroh kuchi yordamida uzoq masofaga uchirib otadi","C":"Faqat ovozli signal va ogohlantirish berish uchun ishlatiladi","D":"O'q-dori va patronlarni saqlab turish uchun xizmat qiladi"},"answer":"A","explanation":"Gaz quroli ko'z yoshi chiqaruvchi yoki organizmga ta'sir etuvchi (asab-falaj qiluvchi) moddalar yordamida nishonni (odamni) vaqtincha zararsizlantirish uchun mo'ljallangan.","mnemonic":"Gaz quroli = vaqtincha zararsizlantirish (o'ldirmaydi).","source":"\"Qurol to'g'risida\"gi Qonun, qurol turlari","source_file":"034_qurol_qonuni.json","_unrep":false},{"id":120,"subtopic":"Fuqarolik quroli","difficulty":"Y1","cognitive":"Bilish","qtype":"single","requires_image":false,"question":"Fuqarolik quroli asosan qanday maqsadlar uchun mo'ljallangan?","options":{"A":"O'zini va mulkini himoya qilish, sport va ovchilik uchun","B":"Jang
