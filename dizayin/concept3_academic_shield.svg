<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Academic Midnight Blue -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19" />
      <stop offset="100%" stop-color="#14213D" />
    </linearGradient>

    <!-- Shield Border Gold Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Drop Shadow for Book -->
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad3)" />

  <!-- Elegant Shield/Crest Frame -->
  <path d="M 256,110 L 370,150 V 270 C 370,340 256,395 256,395 C 256,395 142,340 142,270 V 150 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Open Book inside the Shield -->
  <g filter="url(#shadow3)">
    <!-- Left Page of Book -->
    <path d="M 256,310 C 220,285 185,285 155,295 V 205 C 185,195 220,195 256,220 Z" fill="url(#pageGrad)" />
    
    <!-- Right Page of Book -->
    <path d="M 256,310 C 292,285 327,285 357,295 V 205 C 327,195 292,195 256,220 Z" fill="url(#pageGrad)" />
    
    <!-- Book Spine Divider -->
    <line x1="256" y1="220" x2="256" y2="310" stroke="#070D19" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Azure Sparkle Star above the Book -->
  <g transform="translate(256, 172)">
    <circle cx="0" cy="0" r="16" fill="#38BDF8" opacity="0.3" filter="blur(3px)" />
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#38BDF8" />
  </g>
</svg>
