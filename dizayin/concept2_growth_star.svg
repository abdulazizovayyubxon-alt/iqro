<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Dynamic Azure to Deep Ocean -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Bar Gradient: Glowing Soft White to Blue/Silver -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)" />

  <!-- Abstract Growth Dynamic Wave (Background Element) -->
  <path d="M 100,420 C 200,420 220,280 400,240" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.15" />

  <!-- 3 Dimensional-Looking Qualification Pillars with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Column 1 (2-Toifa): X=160, width=48, height=100 -->
    <rect x="160" y="280" width="48" height="110" rx="24" fill="url(#barGrad)" />
    
    <!-- Column 2 (1-Toifa): X=232, width=48, height=170 -->
    <rect x="232" y="210" width="48" height="180" rx="24" fill="url(#barGrad)" />
    
    <!-- Column 3 (Oliy Toifa): X=304, width=48, height=240 -->
    <rect x="304" y="140" width="48" height="250" rx="24" fill="url(#barGrad)" />
  </g>

  <!-- Glow effect under the Gold Star -->
  <circle cx="328" cy="80" r="30" fill="#FFE082" opacity="0.3" filter="blur(4px)" />

  <!-- Premium Golden Star on the Peak -->
  <g transform="translate(328, 80)">
    <polygon points="0,-22 6,-6 22,-6 10,5 14,21 0,12 -14,21 -10,5 -22,-6 -6,-6" fill="url(#starGrad)" />
  </g>
</svg>
