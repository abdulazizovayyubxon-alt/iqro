<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Premium Midnight Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#101F42" />
    </linearGradient>

    <!-- Azure Glow Gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Thin Elegant Outer Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.25" />

  <!-- Stylized T Wing/Crest Design -->
  <g transform="translate(10, 10)">
    <!-- Left wing of the T (White/Silver) -->
    <path d="M 170,180 C 210,180 236,200 236,236 V 360 C 236,370 228,378 218,378 C 208,378 200,370 200,360 V 236 C 200,216 190,210 170,210 H 140 C 130,210 122,202 122,192 C 122,182 130,180 140,180 Z" fill="#F8FAFC" />
    
    <!-- Right wing of the T (Azure Gradient) -->
    <path d="M 322,180 C 282,180 256,200 256,236 V 360 C 256,370 264,378 274,378 C 284,378 292,370 292,360 V 236 C 292,216 302,210 322,210 H 352 C 362,210 370,202 370,192 C 370,182 362,180 352,180 Z" fill="url(#azureGrad)" />
  </g>

  <!-- Premium Sparkling Gold Star (Top Right) -->
  <g transform="translate(365, 125)">
    <!-- Star glow -->
    <circle cx="0" cy="0" r="24" fill="#FDE047" opacity="0.15" filter="blur(2px)" />
    <!-- Sharp Star -->
    <polygon points="0,-18 5,-5 18,-4 8,5 11,18 0,11 -11,18 -8,5 -18,-4 -5,-5" fill="url(#goldGrad)" />
  </g>
</svg>
