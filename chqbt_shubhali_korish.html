izmatni o'tash","options":{"A":"2, 1, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"1, 2, 3, 4"},"answer":"C","explanation":"Avval fuqarolar chaqiruv uchastkalarida qayd etiladi (1), keyin ularni harbiy xizmatga tayyorlash (3), so'ng ro'yxatga kirish (2), va oxirida xizmatni o'tash (4).","mnemonic":"Qayd → Tayyor → Ro'yxat → O'tash","id":60,"_sabab":"Incorrect sequence; correct order is 1,2,3,4","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat","subtopic":"Qasamyod majburiyatlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Qasamyodda \"O'zbekiston Respublikasiga, xalqimga va Prezidentimga bir umr sodiq bo'lishga\" bandi keltirilgan.","requires_image":false,"question":"Qasamyod bo'yicha harbiy xizmatchi qanday muddatda sodiqlikni ta'minlaydi?","options":{"A":"Bir umr davomida","B":"Xizmat muddati davomida","C":"Kurs oxirida","D":"Yiliga bir marta"},"answer":"A","explanation":"'bir umr sodiq' iborasi mavjud, bu doimiy majburiyatni anglatadi.","mnemonic":"Umr – abadiy.","id":66,"_sabab":"A javob noto'g'ri, to'g'ri javob Xizmat muddati davomida (B)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat shartlari","subtopic":"Kontrakt muddati","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Kontrakt bo'yicha harbiy xizmatchilar bilan yangi kontrakt besh yilga tuziladi","requires_image":false,"question":"Agar shaxs 5 yildan kam qolgan bo'lsa, yangi kontrakt muddati qanday belgilanadi?","options":{"A":"Muddatsiz","B":"Kamroq muddatga","C":"Besh yilga","D":"O'n yilga"},"answer":"B","explanation":"Kontrakt muddatini qisqartirish holati aniq ko'rsatilgan: xizmatda qolishi 5 yildan kam bo'lsa, muddat qisqaroq bo'ladi.","mnemonic":"Qolgan vaqt kam – kontrakt ham kam","id":77,"_sabab":"Javob aniq emas, kontrakt muddatini qisqartirish bo'yicha boshqa variantlar ham mumkin","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy xizmat turlari","subtopic":"Safarbarlik chaqiruvi r → ko'rsatish.","id":185,"_sabab":"Berilgan javob D (1,3,2,4) noto'g'ri; to'g'ri ketma-ketlik 1,2,3,4 bo'lib, variant B","_manual":false},{"subject":"Harbiy ta'lim","topic":"Saf turlari","subtopic":"Saf turi misollari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Ikki sherengali saf ortga burilganda, to'liq bo'lmagan qatordagi harbiy xizmatchi oldingi sherengaga o'tadi.","requires_image":false,"question":"Ikki sherengali safda, to'liq bo'lmagan qator holatida xodimlarning harakati qanday bo'ladi?\n1. Saf ortga buriladi.\n2. Qator to'liq bo'ladi.\n3. Oldingi sherengaga xodim o'tadi.\n4. Yangi qator tashkil etiladi.","options":{"A":"1, 3, 2, 4","B":"1, 3, 4, 2","C":"2, 1, 3, 4","D":"1, 2, 3, 4"},"answer":"D","explanation":"Aytilgandek, saf ortga buriladi, qator to'liq bo'ladi, keyin xodim oldingi sherengaga o'tadi, oxirida yangi qator paydo bo'ladi.","mnemonic":"Burilish → to'liq → o'tish → yangi.","id":186,"_sabab":"Incorrect answer; correct option is A","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Komanda bosqichlari","difficulty":"Y2","bloom_level":"Qo‘llash","qtype":"matching","source_construct":"Komandalar berilish tartibi: ERKIN! → TUR! → DIQQAT!.","requires_image":false,"question":"Komandalar ketma‑ketligini moslashtiring:\n1. ERKIN!\n2. TUR!\n3. DIQQAT!\nA. 1‑2‑3\nB. 2‑1‑3\nC. 3‑2‑1\nD. 2‑3‑1","options":{"A":"2‑1‑3","B":"1‑2‑3","C":"2‑3‑1","D":"3‑2‑1"},"answer":"B","explanation":"Ketma‑ketlik ERKIN! → TUR! → DIQQAT! deb berilgan, shuning uchun 1‑2‑3 to‘g‘ri.","mnemonic":"Erkin, Tur, Diqqat – tartib.","id":201,"_sabab":"Berilgan javob B (2‑1‑3) noto‘g‘ri, to‘g‘ri variant 1‑2‑3 (A) bo‘lishi kerak.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy komandalar","subtopic":"Burilish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"Chap-GA!\" va \"O'ng-GA!\" komandalarining bajarilishi tavsifi berilgan.","requires_image":false,"ques ","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Intizom Nizomi talablari: (1) Qonunlarga rioya, (2) Vatan qasamyodiga sodiqlik, (3) Harbiy burchni bajarish, (4) Sirlarni saqlash","requires_image":false,"question":"Intizom Nizomi bo'yicha harbiy xodimdan talab qilinadigan asosiy bosqichlarni to'g'ri tartibda joylashtiring:\n1. Harbiy burchni mohirlik bilan bajarish\n2. Vatan qasamyodiga sodiqlik\n3. Qonunlarga qat'iy rioya qilish\n4. Harbiy sirlarni qat'iy saqlash","options":{"A":"3, 1, 2, 4","B":"3, 2, 1, 4","C":"2, 3, 1, 4","D":"2, 4, 3, 1"},"answer":"B","explanation":"Birinchi navbatda qonunlarga rioya qilish (3), keyin qasamyodga sodiqlik (2), undan so'ng burchni bajarish (1), oxirida sirlarni saqlash (4). Shu tartib A variantida ko'rsatilgan.","mnemonic":"Qonun‑qasam‑burch‑sir – to'g'ri yo'l","id":300,"_sabab":"Belgilangan javob NOTO'G'RI","_manual":false},{"subject":"Harbiy ta'lim","topic":"Intizomiy ta'zir","subtopic":"Ta'zir qo‘llash muddatlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"10 sutkagacha bo‘lgan qisqa muddatli ta'lim berish","requires_image":false,"question":"Qisqa muddatli ta'lim berish muddatining maksimal uzunligi nechaga teng?","options":{"A":"15 kun","B":"10 kun","C":"30 kun","D":"5 kun"},"answer":"B","explanation":"10 sutkagacha bo‘lgan qisqa muddatli ta'lim berish ko‘rsatilgan; shu sabab 10 kun maksimal muddat.","mnemonic":"Qisqa ta'lim – 10 kun.","id":305,"_sabab":"Maksimal muddat 30 kun, javob C bo‘lishi kerak","_manual":false},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Tarixi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"1864-yil 22-avgustdagi Jeneva konvensiyasi","requires_image":false,"question":"Jeneva konvensiyasini tasdiqlashga qaysi yilda taklifnoma yuborilgan?","options":{"A":"1885","B":"1864","C":"1863","D":"1870"},"answer":"B","explanation":"1864-yilda Shveysariya Federal kengashi taklifnoma jo'natgan; bu yil konvensiya imzolangan.","mnemonic":"Yiliga 64, konvensiya 64.","id":311,"_sabab":"Javob noto'g'ri, to'g'ri variant 1863 (C)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Xalqaro insonparvarlik huquqi","subtopic":"Protokollar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"1‑to‘g‘risidagi protokol – Urush qurbonlarini himoya qilish","requires_image":false,"question":"1‑raqamli protokol nima haqida?","options":{"A":"Urush qurbonlarini himoya qilish","B":"Inshootlarni himoya qilish","C":"Qurollarni cheklash","D":"Harbiy jinoyatlar uchun sud"},"answer":"A","explanation":"1‑raqamli protokol urush qurbonlarini himoya qilishga bag‘ishlangan deb belgilangan.","mnemonic":"1 – qurbon himoyasi","id":331,"_sabab":"Belgilangan javob NOTO'G'RI, 1‑raqamli protokol haqida noto‘g‘ri ma'lumot","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurolli Kuchlar vazifalari","subtopic":"Tinçlik davri","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Tinçlik davrida: harbiy‑siyosiy vaziyatga va davlatning iqtisodiy imkoniyatlariga muvofiq, Qurolli Kuchlardan foydalanishni batafsil va holatga monand rejalashtirish.","requires_image":false,"question":"Qurolli Kuchlar qanday holatga muvofiq foydalanishni rejalashtiradi?","options":{"A":"Xodimlarning ixtiyori bilan","B":"Xalqaro bosimga","C":"Davlatning iqtisodiy imkoniyatlariga","D":"Yangi texnologiyalariga"},"answer":"C","explanation":"Rejalashtirish davlatning iqtisodiy imkoniyatlariga muvofiq amalga oshiriladi.","mnemonic":"Iqtisodiy – reja.","id":340,"_sabab":"Javob iqtisodiy imkoniyatlarga asoslanadi, lekin Qurolli Kuchlar foydalanishni rejalashtirish asosan xavfsizlik va mudofaa ehtiyojlariga bog'liq","_manual":false},{"subject":"Harbiy ta'lim","topic":"Transport avariyalari","subtopic":"Aviahalokatlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Aviahalokatlar: qattiq shikastlanish, qidiruv ishlari","requires_image":false,"question":"Aviahalokatdan keyin avariy-qidiruv jarayonining to'g'ri bosqichlarini ketma-ket joylashtiring:\n1. Qidiruv guruhini tashkil etish\n2. Qattiq shikastlanishlarni aniqlash\n3. Qidiruv uskunalarini joylashtirish\n4. Qidiruv natijalarini hujjatlashtirish","options":{"A":"2, 1, 3, 4","B":"1, 3, 2, 4","C":"3, 1, 2, 4","D":"1, 2, 3, 4"},"answer":"C","explanation":"Aviarhalokatdan keyin avariy-qidiruv ishlarini boshlashda avval uskunalar joylashtiriladi, so'ng guruh tashkil etiladi, keyin qattiq shikastlanish aniqlanadi, oxirida natijalar hujjatga kiritiladi. Shunday qilib 3‑1‑2‑4 to'g'ri.","mnemonic":"Uskuna → Guruh → Shikast → Hujjat","id":367,"_sabab":"To'g'ri ketma-ketlik 1-3-2-4 (variant B), berilgan javob C noto'g'ri","_manual":false},{"subject":"Harbiy ta'lim","topic":"Gazniqoblar","subtopic":"Niqobning qo'shimcha elementlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"GP-7 niqobidagi so'zlashish moslamasi","requires_image":false,"question":"GP-7 niqobida so'zlashish moslamasi qaysi raqam bilan belgilanadi?","options":{"A":"5‑raqamli","B":"1‑raqamli","C":"3‑raqamli","D":"7‑raqamli"},"answer":"A","explanation":"Rasmda 5‑raqamli element so'zlashish moslamasini ifodalaydi.","mnemonic":"5 – so'zlashish","id":442,"_sabab":"Incorrect designation of communication device number","_manual":false},{"subject":"Harbiy ta'lim","topic":"Gazniqoblar","subtopic":"Gazniqobdan chiqish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gazniqobni yechish uchun o'ng qo'l bilan bosh kiyim yechib, chap qo'lda gazniqobning yuz qismida joylashtirilgan klapanli quti ushlanadi...","requires_image":false,"question":"Gazniqobni yechish jarayonida qaysi qo'l bosh kiyimni yechadi?","options":{"A":"Qo'l ishlatilmaydi","B":"O'ng qo'l","C":"Ikkala qo'l bir vaqtida","D":"Chap qo'l"},"answer":"B","explanation":"O'ng qo'l bosh kiyimni yechish, chap qo'l esa quti ushlash vazifasini bajaradi, shuning uchun to'g'ri javob o'ng qo'l.","mnemonic":"O'ng – kiyim, Chap – quti.","id":445,"_sabab":"Both hands are used to remove headgear","_manual":false},{"subject":"Harbiy ta'lim","topic":"Gazniqoblar","subtopic":"Kiyishda xatoliklarni bartaraf etish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gazniqobni kiyib bo'lingach, keskin va chuqur nafas chiqariladi, ko'z ochiladi, nafas olish tiklanadi, bosh kiyim kiyiladi, xaltaning qopqog'i yopiladi.","requires_image":false,"question":"Maska kiyilgandan so'ng qaysi bosqich nafas olishni tiklaydi?","options":{"A":"Ko'zlarni yummash","B":"Keskin va chuqur nafas chiqarish","C":"Bosh kiyimni qayta kiyish","D":"Xaltaning qopqog'ini yopish"},"answer":"B","explanation":"Maska kiyilgandan keyin nafas olishni tiklash uchun keskin chuqur nafas chiqarish zaruriyati ko'rsatilgan.","mnemonic":"Nafas chiqqan – tiklandi.","id":451,"_sabab":"Javob noto'g'ri","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qo'lbola himoya vositalari","subtopic":"Niqarbni tekshirish tartibi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Gazniqob va respirator me'yorlari – bosqichlar","requires_image":false,"question":"Gazniqobni kiyish jarayonini to'g'ri ketma-ketlikda joylashtiring:\n1. Gazniqobni boshga qo'yish\n2. Bosh kiyimni (po'lat shlemlarni) kiyish\n3. Gazniqobni tekshirish\n4. Vaqtni o'lchash","options":{"A":"1, 3, 2, 4","B":"1, 2, 3, 4","C":"2, 1, 3, 4","D":"3, 1, 2, 4"},"answer":"A","explanation":"Dastlab gazniqob boshga qo'yiladi (1), keyin uni tekshirish (3), keyin bosh kiyim kiyiladi (2), oxirida vaqt o'lchanadi (4). Shuning uchun 1,3,2,4 tartibi to'g'ri.","mnemonic":"Boshga qo'y, tekshirish, kiyish, vaqt","id":464,"_sabab":"Berilgan ketma-ketlik (1,3,2,4) amaliyotga mos kelmaydi; to'g'ri tartib odatda bosh kiyim (2), gazniqobni boshga qo'yish (1), tekshirish (3), vaqtni o'lchash (4) bo'ladi.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Otish tayyorligi","subtopic":"Umumqo‘shin himoya to‘plami (UHT)","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Umumqo‘shin himoya to‘plami (UHT)ni kiyish tartibini aytib bering.","requires_image":false,"question":"UHT ni kiyish bosqichi qaysi tartibda bajariladi?","options":{"A":"Qo‘llarni himoya → Boshni himoya → Bosh kiyim","B":"Bosh kiyim → Boshni himoya → Qo‘llarni himoya","C":"Bosh kiyim → Qo‘llarni himoya → Boshni himoya","D":"Boshni himoya → Bosh kiyim → Qo‘llarni himoya"},"answer":"C","explanation":"UHT ni kiyish birinchi bosqichda bosh kiyim, keyin qo‘llar, oxirida boshni himoya qilish tavsiya qilinadi.","mnemonic":"Bosh kiyim, qo‘llar, bosh – A tartib.","id":495,"_sabab":"UHT ni kiyish tartibi noto‘g‘ri ko‘rsatilgan","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurollar","subtopic":"RPG-7 granatomyoti","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"PG-7V granatasi bilan – 330 m; PG-7VM granatasi bilan – 310 m","requires_image":false,"question":"PG-7V granatasining maksimal ochish masofasi qancha?","options":{"A":"310 metr","B":"400 metr","C":"330 metr","D":"500 metr"},"answer":"C","explanation":"PG-7V granatasining ochish masofasi 330 m deb berilgan.","mnemonic":"V‑330, VM‑310","id":519,"_sabab":"PG-7V granatasining maksimal ochish masofasi 330 m emas, odatda 400 m atrofida ko'rsatiladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurollar","subtopic":"RPG-7 granatomyoti","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"RPG-7 ning umumiy vazni – 6.3 kg","requires_image":false,"question":"RPG-7 granatomyoti vazni qancha?","options":{"A":"4.8 kilogram","B":"7.0 kilogram","C":"6.3 kilogram","D":"5.5 kilogram"},"answer":"C","explanation":"RPG‑7 ning umumiy vazni 6.3 kg deb ko‘rsatilgan.","mnemonic":"RPG‑7 – 6.3 kg","id":523,"_sabab":"Faktik xato: RPG‑7 umumiy vazni 6.3 kg emas, odatda 5‑7 kg oralig'ida, aniq ma'lumotga mos kelmaydi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurollar","subtopic":"RPG-7 granatomyoti","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Granatalarning umumiy vazni (porox zaryadi bilan): PG-7V – 2.2 kg; PG-7VM – 2.0 kg","requires_image":false,"question":"PG-7VM granatasining vazni qancha?","options":{"A":"2.0 kilogram","B":"1.8 kilogram","C":"2.5 kilogram","D":"2.2 kilogram"},"answer":"A","explanation":"PG‑7VM granatasining umumiy vazni 2.0 kg deb berilgan.","mnemonic":"VM‑2.0 kg","id":529,"_sabab":"PG‑7VM granatasining vazni 2.0 kg emas, taxminan 1.7‑2.2 kg oraligʻida, aniq ma'lumotga mos kelmaydi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Stvol qutisining tarkibi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Stvol qutisida 9-chi element – tepki halqasi","requires_image":false,"question":"Stvol qutisining 9-chi qismi qanday nomlanadi?","options":{"A":"Kesmalar","B":"Qo'ndoq","C":"Biriktirgich","D":"Tepki halqasi"},"answer":"D","explanation":"9-chi element tepki halqasi sifatida ko'rsatilgan. Qolgan variantlar boshqa elementlarga tegishli.","mnemonic":"To'qqizinchi – tepki.","id":532,"_sabab":"9‑chi element odatda \"Tepki halqasi\" emas, boshqa nomga ega","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Zatvor va patron tutilishi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Zatvor oldingi holatda, patron tiqildi","requires_image":false,"question":"Zatvor oldingi holatda patron tiqilganida, birinchi tavsiya qilingan harakat nima?","options":{"A":"Zatvor ramasining dastasini tutib patronni chiqarish","B":"Patronni o'zdoshga bosib qurolni bo'shatish","C":"Qurolni butunlay bo'shatib, qayta yig'ish","D":"Zatvorni tortish va otishni to'xtatish"},"answer":"A","explanation":"Patron tiqilib qolgan holatda zatvor ramasining dastasidan tutib, patronni chiqarib otish davom ettirilishi tavsiya qilingan.","mnemonic":"Dastasini tut, patronni chiqar.","id":541,"_sabab":"A javob noto'g'ri, tavsiya qilinadigan harakat zatvorni tortish va otishni to'xtatishdir","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"O'qdon nosozligi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Patron tiqildi. Patron o'qdon bilan stvol kesmasida tiqilib","requires_image":false,"question":"Patron tiqilganda, qaysi mexanizm asosan harakatini to'xtatadi?","options":{"A":"Zatvor","B":"O'qdon","C":"Tortqi","D":"Gildiya"},"answer":"B","explanation":"Patron o'qdon bilan stvol kesmasida tiqilib, harakatchan qism va mexanizmlar deyarli to'xtaydi – o'qdon asosiy sabab.","mnemonic":"Patron tiqilib, o'qdon to'xtar.","id":542,"_sabab":"B javob noto'g'ri, patron tiqilganda harakatni asosan zatvor (bolt) to'xtatadi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurol texnikasi","subtopic":"Zatvor qaytarilmasligi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Zatvor ramasining oldingi holatga qaytmasligi","requires_image":false,"question":"Zatvorning qaysi holati avvalgi holatga qaytarilmasligi ko'rsatilgan?","options":{"A":"Zatvor ochilgan holat","B":"Zatvor yarmida bo'lganda","C":"Zatvor normal holatda","D":"Patron tiqilgan holat"},"answer":"D","explanation":"Zatvor tiqilgan patron holatiga qaytmasligi aytilgan.","mnemonic":"Tiqlangan zatvor – avvalgi holatga qaytmas.","id":547,"_sabab":"Javob D noto'g'ri; zatvor tiqilgan holatiga qaytmasligi emas, boshqa holat (masalan, zatvor yarmida) ko'rsatiladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Patron joylash","subtopic":"Oboyma yordamida","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Oboyma yordamida patronlar o‘qdon ichiga cho‘ktiriladi; patronlarning o‘qlari yuqoriga yo‘naltirilgan bo‘lishi lozim.","requires_image":false,"question":"Oboyma yordamida patronlarni o‘qdon ichiga joylashtirganda patron o‘qlari qayerga yo‘naltiriladi?","options":{"A":"Chapga","B":"O‘ngga","C":"Yuqoriga","D":"Pastga"},"answer":"C","explanation":"\"patronlarning o‘qlari yuqoriga yo‘naltirilgan\" deb ko‘rsatilgan.","mnemonic":"O‘q yuqoriga, oboyma ichiga.","id":556,"_sabab":"Incorrect direction; bullets are directed downwards, not up","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurolni yig‘ish","subtopic":"Oboyma o‘rnatish tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O‘qdonni chap qo‘lda tutib, o‘ng qo‘lda o'tkazgich patronlar joylashtirilgan oboyma o‘rnatiladi.","requires_image":false,"question":"Oboyma o‘rnatishda qaysi qo‘lga eʼtibor beriladi?","options":{"A":"Ikkala qo‘l ham bir vaqtning o‘zida","B":"Chap qo‘l","C":"Hech qaysi qo‘l","D":"O‘ng qo‘l"},"answer":"D","explanation":"O‘ng qo‘lda o'tkazgich va oboyma o‘rnatilishi ko‘rsatilgan.","mnemonic":"O‘ng qo‘lda oboyma.","id":558,"_sabab":"Wrong hand; installation is done with the left hand, not the right","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurolni parchalash","subtopic":"AK-74 qismlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Anjomlar penali qo‘ndoq uyasidan chiqarib olinadi","requires_image":false,"question":"Qurolning qaysi qismi penali qo‘ndoq uyasidan ajratiladi?","options":{"A":"Anjomlar penali","B":"Gaz quvuri","C":"Zatvor","D":"Stvol qoplamasi"},"answer":"A","explanation":"Anjomlar penali qo‘ndoq uyasidan chiqarib olinishi keltirilgan.","mnemonic":"Penalni ajrat, qurolni tozal","id":563,"_sabab":"To'g'ri javob Zatvor (C) bo'lishi kerak","_manual":false},{"subject":"Harbiy ta'ilm","topic":"Qurolni parchalash","subtopic":"Qadamlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Shompol ajratiladi","requires_image":false,"question":"AK-74 avtomatidagi shompol qachon ajratiladi?","options":{"A":"Birinchi qadamda","B":"To‘rtinchi qadamda","C":"Ikkinchi qadamda","D":"Uchinchi qadamda"},"answer":"D","explanation":"Shompol uchinchi qadamda ajratilishi ko‘rsatilgan.","mnemonic":"Uchinchi shompol, keyin qolgan","id":565,"_sabab":"Shompol ikkinchi qadamda ajratiladi (C)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurolni birlashtirish","subtopic":"Tugash bosqichi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O‘qdon avtomatga biriktiriladi","requires_image":false,"question":"Yig‘ish jarayonining oxirgi bosqichi nima?","options":{"A":"O‘qdon avtomatga biriktiriladi","B":"Shompol biriktiriladi","C":"Gaz quvuri biriktiriladi","D":"Zatvor biriktiriladi"},"answer":"A","explanation":"Oxirgi qadam o‘qdonni avtomatga biriktirish deb berilgan.","mnemonic":"Oxirgi o‘qdon, hamma yopildi","id":567,"_sabab":"Berilgan javob oxirgi bosqichga mos kelmaydi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurolni parchalash","subtopic":"Stvol qutisi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Stvol qutisining qopqog‘i ajratiladi","requires_image":false,"question":"AK-74 da stvol qutisi qopqog‘i qachon ajratiladi?","options":{"A":"Uchinchi qadamda","B":"Birinchi qadamda","C":"Ikkinchi qadamda","D":"To‘rtinchi qadamda"},"answer":"D","explanation":"Stvol qutisining qopqog‘i beshinchi element sifatida ko‘rsatilgan, lekin ajratish ketma‑keti 4‑chi bosqichda keladi.","mnemonic":"Stvolning qopqogi 4‑chi, keyin davom etadi","id":568,"_sabab":"Javob va izoh o'rtasida nomuvofiqlik mavjud","_manual":false},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Amir Temur 7 ta qo'l","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Amir Temur 1391-yilda jangda qo'shinini an'anaviy markaz, chap va o'ng qanotdan voz kechib, 7 ta qo'lga taqsimladi.","requires_image":false,"question":"Temurning 1391-yilgi jangida qo'shinni necha ta qo'lda tuzgan?","options":{"A":"Olti ta","B":"Yetti ta","C":"To'qqiz ta","D":"Sakkiz ta"},"answer":"B","explanation":"Temur qo'shinini an'anaviy struktura o'rniga 7 ta qo'lga bo'lib joylashtirgan.","mnemonic":"Temur – 7 qo'l, an'anaviy emas.","id":585,"_sabab":"Berilgan javob 7 ta (B) noto'g'ri; tarixiy manbalarga ko'ra Temurning 1391-yilgi jangida qo'shin 8 ta qo'lda bo'lgan","_manual":false},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy strategiyasi","subtopic":"Taktik qurilmalar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Muhoraba hududida xandaqlar qazilib, to‘siqlar barpo etilgan","requires_image":false,"question":"Muhoraba hududida Amir Temur qanday mudofaa inshootlarini yaratgan?","options":{"A":"Havo maydonlari","B":"Xandaqlar va to‘siqlar","C":"Qal’a va minoralar","D":"Suv omborlari"},"answer":"B","explanation":"Muhoraba hududida xandaqlar qazilib, to‘siqlar barpo etilgani ko'rsatilgan.","mnemonic":"Xandaq + to‘siq = mudofaa","id":602,"_sabab":"B javob noto'g'ri, tarixiy manbalarda mudofaa inshootlari asosan qal'a va minoralar bo'lgan","_manual":false},{"subject":"Harbiy ta'lim","topic":"II Jahon urushi","subtopic":"Medallar va ordenlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"214 ming askar va ofitserlar... 301 nafari Sovet Ittifoqi Qahramoni, 70 nafari uchala darajadagi 'Slava' ordeniga sazovor bo'lgan.","requires_image":false,"question":"Medallar va unvonlarni ularning soni bilan moslashtiring:\n1. Sovet Ittifoqi Qahramoni\n2. 'Slava' ordeni\n3. Jangovar orden","options":{"A":"1-70, 2-301, 3-214","B":"1-301, 2-214, 3-70","C":"1-214, 2-70, 3-301","D":"1-301, 2-70, 3-214"},"answer":"D","explanation":"301 kishi Sovet Ittifoqi Qahramoni, 70 nafari 'Slava' ordeni, jami 214 000 askar va ofitser medallar olgan. Shuning uchun 1-301, 2-70, 3-214 mosligi to'g'ri.","mnemonic":"Qahramon uch yuz bir, Slava yetmish, umumiy ikki yuz o'n to'rt","id":607,"_sabab":"Faktik ma'lumotlarda xato: 'Sovet Ittifoqi Qahramoni' 301, 'Slava' ordeni 70 va 'Jangovar orden' 214 raqamlari noto'g'ri.","_manual":false},{"subject":"Harbiy ta'lim","topic":"II Jahon urushi","subtopic":"Jangovar bosqichlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Urushning birinchi oylaridayoq O'zbekistonda 14 diviziya, 12 brigada tashkil etilib, frontga jo'natildi","requires_image":false,"question":"O'zbekistonlik harbiy birlamchi bosqichlarni to'g'ri tartibda joylashtiring:\n1. Diviziya tashkil etish\n2. Brigada tashkil etish\n3. Frontga jo'natish","options":{"A":"3, 1, 2","B":"2, 1, 3","C":"1, 3, 2","D":"1, 2, 3"},"answer":"D","explanation":"Avval diviziya (14) tuzilgan, keyin brigada (12) tashkil etilgan, oxirida barcha birliklar frontga jo'natilgan. Shuning uchun 1‑2‑3 tartibi to'g'ri.","mnemonic":"Diviziya, brigada, front","id":608,"_sabab":"Savolda harbiy birlamchi bosqichlarning tartibi noto'g'ri ko'rsatilgan; odatda brigada tashkil etish avval, keyin diviziya, so'ng frontga jo'natish bo'ladi.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"Komanda ta'rifi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"\"Ort-GA!\", \"Chap-GA!\", \"O‘ng-GA!\" burilish amallari jadvalda ko‘rsatilgan","requires_image":false,"question":"\"Ort-GA!\" komandasi harbiy xizmatchiga qanday harakatni bajarishni buyuradi?","options":{"A":"Orqaga 180° to‘liq burilish","B":"Chap tomonga 90° burilish","C":"Oldinga harakatlanish","D":"O‘ng tomonga 90° burilish"},"answer":"A","explanation":"\"Ort-GA!\" komandasi 180° to‘liq burilishni ifodalaydi. B boshqa tomonga burilish, C o‘ngga, D harakat emas.","mnemonic":"Ort = Orqaga, to‘liq burilish.","id":619,"_sabab":"\"Ort-GA!\" komandasi harakatni (orqaga yurishni) bildiradi, 180° burilish emas","_manual":false},{"subject":"Harbiy ta'lim","topic":"Komanda va harakat","subtopic":"Safga qaytish jarayoni","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Safga qaytish komandasi jarayonidagi bosqichlar","requires_image":false,"question":"Safga qaytish komandasi bajarilganda amalga oshiriladigan harakatlarni moslashtiring:\n1. Birinchi qadamni tashlash\n2. Oyoqlarni yonma‑yon taqash\n3. Qo'lini bosh kiyimidan tushiradi\n4. Safga turing! komandasiga javob bermaydi","options":{"A":"1-D, 2-C, 3-B, 4-A","B":"1-B, 2-A, 3-C, 4-D","C":"1-A, 2-B, 3-D, 4-C","D":"1-C, 2-D, 3-A, 4-B"},"answer":"B","explanation":"Matnda: birinchi qadam (1) tashlanadi, oyoqlarni yonma‑yon taqash (2) bilan qo'l bosh kiyimiga ko'tariladi, birinchi qadamni tashlash barobarida qo'l bosh kiyimidan tushiriladi (3), va safga turing! komandasiga javob bermaydi (4). To'g'ri moslik 1‑B, 2‑A, 3‑C, 4‑D.","mnemonic":"Qadam, taqash, tushir, javob yo'q.","id":627,"_sabab":"Berilgan javob matn tavsifi bilan mos kelmaydi, ehtimol boshqa variant to'g'ri","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy saf turlari","subtopic":"Saf turlarini tavsifi bilan moslashtirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"Saf turlarini ularning tavsifi bilan moslashtiring","requires_image":false,"question":"Saf turlarini ularning tavsifi bilan moslashtiring:\n1. Birinchi sherengali saf\n2. Ikki sherengali saf\n3. Mashinalar safi\nA. Har bir safda bir dona harbiy texnika\nB. Har bir safda bir dona sherengali birlik\nC. Har bir safda ikki sherengali birlik\nD. Har bir safda bir sherengali birlik","options":{"A":"1-D, 2-B, 3-C","B":"1-B, 2-D, 3-C","C":"1-B, 2-C, 3-A","D":"1-D, 2-C, 3-A"},"answer":"C","explanation":"Birinchi sherengali safda bitta sherengali birlik (B), ikkinchi sherengali safda ikki sherengali birlik (C), mashinalar safida bir texnika (A).","mnemonic":"Bir‑ikki‑Mashina: B‑C‑A.","id":638,"_sabab":"Berilgan javob C noto'g'ri; to'g'ri javob D (1-D, 2-C, 3-A)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy san'at tarixi","subtopic":"Buyuk sarkardalar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi, Amir Temur, Zahiriddin Muhammad Boburning harbiy yurishlari","requires_image":false,"question":"Jaloliddin Manguberdi qanday yo nsiplari","requires_image":false,"question":"Amir Temur vasiyatida davlatni idora etishda kimlarga tayanish tavsiya etilgan?","options":{"A":"Mahalliy qishloq boshlariga","B":"Toj-u taxt egalariga","C":"Tashqi ittifoqchilarga","D":"Xalq yig'inlariga"},"answer":"B","explanation":"Vasiyatda davlatni boshqarishda toj-u taxt egalariga tayanish kerakligi aytilgan. Boshqa variantlar matnda keltirilmagan.","mnemonic":"Toj – boshqaruv kaliti","id":663,"_sabab":"Vasiyatda \"toj-u taxt egalariga\" tayanish tavsiya qilinmaydi, bu noto'g'ri variant","_manual":false},{"subject":"Harbiy ta'lim","topic":"Amir Temur harbiy san'ati","subtopic":"Hududiy boshqaruv","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Amir Temur o‘z davrida mamlakatni harbiy hududlarga bo‘lg‘an holda idora etgan. Poytaxti Samarqand bo‘lgan markaziy qism, ya’ni Movarounnahr va Xorazmni Amir Temur o‘zi boshqargan","requires_image":false,"question":"Amir Temur davrida qaysi hududlar markaziy harbiy boshqaruvga kirgan?","options":{"A":"Buxoro va Farg‘ona","B":"Movarounnahr va Xorazm","C":"Andijon va Namangan","D":"Qashqadaryo va Surxondaryo"},"answer":"B","explanation":"Markaziy qism Movarounnahr va Xorazm bo‘lgani ko‘rsatilgan.","mnemonic":"Markaz — Movarounnahr, Xorazm","id":672,"_sabab":"Berilgan javob tarixiy faktga mos kelmaydi; amir Temur davrida markaziy harbiy boshqaruvga Buxoro va Farg‘ona kirgan","_manual":false},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Jang maydoni tanlovi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda \"jang maydoni suvga yaqin yoki uzoqligi\" o'rganilishi kerakligi aytilgan.","requires_image":false,"question":"Darsda jang maydonini tanlashda qaysi omilni tekshirish zarur?","options":{"A":"Suvga yaqinligi","B":"O'rmon zichligi","C":"Quyosh nuri","D":"Tog' balandligi"},"answer":"A","explanation":"Suvga yaqinlik yoki uzoqlikni o'rganish talabi ko'rsatilgan.","mnemonic":"Suvga qarash – birinchi qaror.","id":711,"_sabab":"Jang maydonini tanlashda asosiy omil odatda yerning tog' balandligi yoki o'rmon zichligi bo'ladi, suvga yaqinlik birinchi darajali omil emas","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Burilish amallari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Ort-GA!, Chap-GA! va O‘ng-GA! burilish amallarining tavsifi","requires_image":false,"question":"Ort‑GA! amali bajarilganda har qanday harakatda qaysi tana qismi harakatlanadi?","options":{"A":"Tana o‘rtasidagi soniya","B":"Tana o‘ng oyog‘i","C":"Boshning yuqori qismi","D":"Tana chap oyog‘i"},"answer":"B","explanation":"Ort‑GA! amali o‘ng oyoq bilan bajariladi, shu sababdan harakat o‘ng oyoqda namoyon bo‘ladi. Boshqa variantlar amaldagi maxsus harakatni tasvirlamaydi.","mnemonic":"Ort‑GA! = O‘ngga","id":716,"_sabab":"Berilgan javob (o‘ng oyog‘i) amalda noto‘g‘ri; ort‑GA! amali odatda tananing boshqa qismi (masalan, tananing o‘rtasi) harakatlanadi.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy harakatlar","subtopic":"Burilish amallari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"O‘ng‑GA! amali tavsifi","requires_image":false,"question":"O‘ng‑GA! amali bajarilganda qaysi harakat cheklanishi kerak?","options":{"A":"90° burilish","B":"Hech qanday cheklov yo‘q","C":"45° burilish","D":"180° to‘liq burilish"},"answer":"D","explanation":"O‘ng‑GA! amali 180° to‘liq burilish qilmaslikka eʼtibor qaratilgan; shu cheklov amalda talab qilinadi. Boshqa variantlar noto‘g‘ri.","mnemonic":"O‘ng‑GA! 180°ga yo‘q","id":719,"_sabab":"O‘ng‑GA! amali 180° burilishni taqiqlamaydi; odatda 90° yoki 45° cheklov qo‘llanadi.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Umumqoshin himoya to'plami (UHT)","subtopic":"UHT kiyish jarayoni","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Gazniqob kiyilganda ko'zlar ochiladi, nafas tiklanadi, bosh kiyimi tezlik bilan yechiladi","requires_image":false,"question":"Gazniqob kiyilganda nafas tiklanishi uchun qaysi amallar bajarilishi kerak?","options":{"A":"Bosh kiyimi qattiq ushlab turiladi","B":"Plashni hamma vaqt yopiq holda saqlash","C":"Ko'zlar ochiladi va chuqur nafas chiqariladi","D":"Tasma qisqa bo‘lib turadi"},"answer":"C","explanation":"Gazniqob kiyilganda ko‘zlar ochiladi, chuqur nafas chiqariladi va nafas tiklanadi degan bayon mavjud. Boshqa variantlar jarayonni buzadi.","mnemonic":"Ko'z och, nafas chuqur, gazniqob tayyor.","id":729,"_sabab":"Javob gaz maskasi nafas olish jarayoniga mos kelmaydi, ko'zlarni ochish nafas tiklanishiga ta'sir qilmaydi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Navigatsiya vositalari","subtopic":"Kosmik segment","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Kosmik segmentda yo'ldoshlar orbitasi yer yuzidan 20‑200 km balandlikda","requires_image":false,"question":"Kosmik segmentdagi yo'ldoshlar orbitasi yer yuzidan qanchalik balandlikda joylashgan?","options":{"A":"5‑50 km","B":"1000‑2000 km","C":"200‑400 km","D":"20‑200 km"},"answer":"D","explanation":"Yo'ldoshlar orbitasining yer yuzidan o'rtacha uzoqligi 20‑200 km ekanligi aniq berilgan.","mnemonic":"Yigirma‑ikki yuz – orbitaning balandligi","id":736,"_sabab":"Berilgan javob D (20‑200 km) noto‘g‘ri, to‘g‘ri variant C (200‑400 km)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Jang taktikasi","subtopic":"Manguberdi tamoyillari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Jaloliddin Manguberdi tamoyillari: urushning birinchi tamoyili – g'alabaga erishish uchun hamma kuchlarni shiddat bilan harakatlantirish.","requires_image":false,"question":"Manguberdi tamoyillaridan qaysi biri \"g'alaba uchun hamma kuchlarni shiddat bilan harakatlantirish\"ni bildiradi?","options":{"A":"Muvaffaqiyatdan unumli foydalanish","B":"To'xtatsiz zarba berish","C":"Birlamchi kuchlarni maksimal darajada qo'llash","D":"Ikkinchi darajali hududlarni zaiflashtirish"},"answer":"C","explanation":"Birlamchi tamoyil g'alabaga erishish uchun barcha kuchlarni shiddat bilan harakatlantirishni talab qiladi. Ikkinchi darajali hududlarni zaiflashtirish boshqa tamoyilga tegishli. To'xtatsiz zarba berish va muvaffaqiyatdan unumli foydalanish ham boshqa tamoyillar.","mnemonic":"Birlamchi – Barcha, Birlamchi.","id":742,"_sabab":"Javob variantlari orasida 'g'alaba uchun hamma kuchlarni shiddat bilan harakatlantirish' tamoyiliga eng yaqin variant B (To'xtatsiz zarba berish) bo'lishi mumkin, shuning uchun tanlangan C variant noaniq","_manual":false},{"subject":"Harbiy ta'lim","topic":"Bobur jang taktikasi","subtopic":"Qurilma turlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Bobur jangida to‘fang, arava, fillar, piyodalar qo‘shinlari ishtirok etgan","requires_image":false,"question":"Bobur jangida qaysi birlik harbiy texnika bilan eng ko'p bog‘liq edi?","options":{"A":"To‘fang","B":"Fillar","C":"Piyodalar","D":"Arava"},"answer":"B","explanation":"Fillar jangovar bo‘lib, katta massali harbiy texnika sifatida ta’riflangan. Piyodalar yengil, to‘fang tez harakat, arava transport vazifasini bajaradi.","mnemonic":"Fillar – katta texnika","id":751,"_sabab":"Berilgan javob (B) ehtimol noto‘g‘ri; Bobur jangida harbiy texnika bilan eng ko‘p bog‘liq bo‘lgan birlik arava yoki boshqa texnikaviy birlik bo‘lishi mumkin","_manual":false},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Jangovar shartlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda dushman lashkari 12 ming otliqdan kam bo'lsa, Amir boshqaradi","requires_image":false,"question":"Agar dushman lashkari 10 000 otliqdan iborat bo'lsa, jangda kim amirlik qiladi?","options":{"A":"Vazir","B":"Jang bo'yicha kapitani","C":"Sohibqiron","D":"Amir Temur"},"answer":"D","explanation":"Dushman 12 ming otliqdan kam bo'lsa, Amir Temur ul-umaro sardorlik qilishi belgilangan.","mnemonic":"Kam otliqda Amir boshqaradi","id":753,"_sabab":"Berilgan javob (D) aniq asoslanmagan; dushman 10 000 otliq bo‘lsa kim amirlik qilishi haqida aniq ma'lumot yo‘q","_manual":false},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Jang maydoni shartlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda jang maydonining suvga yaqinligi talab qilinadi","requires_image":false,"question":"Jang maydonini tanlashda birinchi tekshirilishi kerak bo'lgan omil nima?","options":{"A":"Suvga yaqinligi","B":"Qorong'i o'rmon","C":"Yuqori tog'li hudud","D":"Ochiq dalalar"},"answer":"A","explanation":"Birinchi shart sifatida jang maydonining suv bilan ta'minlanish shartlari o'rganilishi ko'rsatilgan.","mnemonic":"Suv birinchi","id":754,"_sabab":"Jang maydonini tanlashda birinchi tekshirilishi kerak bo‘lgan omil odatda yerning taktikaviy jihatlari (yassi yoki ochiq) bo‘lib, suvga yaqinlik birinchi darajali emas","_manual":false},{"subject":"Harbiy ta'lim","topic":"Temur tuzuklari","subtopic":"Harbiy tasnif","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Matnda Eron, Afg'oniston, Ozarbayjon, Gruziya, Hindiston kiradi","requires_image":false,"question":"Quyidagi davlatlardan qaysi biri Temur tuzuklarida sanalgan?","options":{"A":"Marokash","B":"Qozog'iston","C":"Yaponiya","D":"Gruziya"},"answer":"D","explanation":"Gruziya Temur tuzuklari ichiga kirgan mamlakatlar ro'yxatida keltirilgan.","mnemonic":"Gruziya temurda","id":756,"_sabab":"Gruziya Temur tuzuklarida ro'yxatga kiritilmagan, boshqa variant to'g'riroq","_manual":false},{"subject":"Harbiy ta'lim","topic":"Bo'lim 9","subtopic":"Mudofaa fondi va xalq o'z hissasi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"1941–1943-yillarda mudofaa fondiga 475 million rubldan ortiq mablag' topshirilgan","requires_image":false,"question":"1941‑1943 yillarda O'zbekiston aholisining mudofaa fondiga umumiy qancha rubldan ortiq mabla alliy hokimiyat","C":"Mudofaa vazirligi","D":"Xavfsizlik xizmati"},"answer":"C","explanation":"Yozilganidek, Mudofaa vazirligi har yili belgilangan muddatlarda ro'yxatga olishni amalga oshiradi. Boshqa organlar bu vazifani bajarmaydi.","mnemonic":"Mudofaa belgilaydi, har yili","id":796,"_sabab":"Muddatni belgilash odatda mahalliy hokimiyat tomonidan amalga oshiriladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Chaqiruv uchastkalari","subtopic":"Raqamli ma'lumot","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"30 tayyorgarlik ishlari chaqiriluvchilarni vatanparvarlik ruhida tarbiyalash","requires_image":false,"question":"Matnda qancha tayyorgarlik ishlari sanalgan?","options":{"A":"30","B":"20","C":"8","D":"15"},"answer":"A","explanation":"Aniq \"30 tayyorgarlik ishlari\" degan ibora mavjud. Boshqa sonlar matnda yo'q.","mnemonic":"Uch o'n – 30 tayyorgarlik","id":799,"_sabab":"Matnda sanalgan tayyorgarlik soni 20 yoki boshqa qiymat bo'lishi mumkin","_manual":false},{"subject":"Harbiy ta'lim","topic":"Muddatli harbiy xizmat","subtopic":"Chaqirilish muddatini kechiktirish sabablari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Chaqirilish muddatini kechiktirish sabablari ro'yxati","requires_image":false,"question":"Oila a'zosi harbiy xizmatda halok bo'lganda, chaqiriluvchiga qanday huquq beriladi?","options":{"A":"Chaqirilish muddatini kechiktirish","B":"Majburiy xizmatga qo'yish","C":"Xizmatdan butunlay ozod qilish","D":"Yalgnash xizmatiga yuborish"},"answer":"A","explanation":"Yaqin qarindoshi harbiy xizmatda halok bo'lgan chaqiriluvchilar muddatni kechiktirishga haqlidir.","mnemonic":"Yaqin vafot – muddat kechikadi","id":805,"_sabab":"Oila a'zosi harbiy xizmatda halok bo'lganda chaqiriluvchi xizmatdan butunlay ozod qilinadi, deferment emas","_manual":false},{"subject":"Harbiy ta'lim","topic":"Burilish amallari","subtopic":"O'ngga burilish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"«O'ng-GA!» komandasi o'ngga burilish amallarini bajaradi","requires_image":false,"question":"«O'ng-GA!» komandasi bajarilganda tananing ikkinchi harakati nima?","options":{"A":"Orta oyoq to'g'ri tortilib, old oyoqqa taqaladi","B":"Bosh kiyimni erkin qo'yish","C":"Tana vazni o'ng oyoqqa ko'tariladi, tizza bukilmaydi","D":"Chap qo'l o'ng tomonga buriladi, tanaga bosim qo'yiladi"},"answer":"A","explanation":"O'ngga burilishda ikkinchi bosqich – ortda qolgan oyoq to'g'ri tortilib, old oyoqqa taqaladi. Birinchi bosqich vaznni o'ng oyoqqa ko'taradi.","mnemonic":"O'ngga ikkinchi – oyoq taqadi.","id":830,"_sabab":"Berilgan javob A tavsifi O'ng-GA! komandasi ikkinchi harakati bilan mos kelmasligi mumkin","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harakat turlari","subtopic":"Shaxdam qadam","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"«Shaxdam qadam tashlab yurganda uchi 15–20 cm ga ko‘tarilib, yerga butun kafti bilan bosiladi»","requires_image":false,"question":"Shaxdam qadamda oyoqning uchi qayerga ko‘tariladi?","options":{"A":"15–20 sm ga","B":"5–10 sm ga","C":"30–35 sm ga","D":"Hech qayerga ko‘tarilmaydi"},"answer":"A","explanation":"Shaxdam qadamda oyoq uchi 15–20 sm ga ko‘tarilib, to‘liq kafti bilan yerga bosiladi, degan bayon mavjud.","mnemonic":"Shaxdamda 15‑20 sm ko‘tarish","id":837,"_sabab":"Javobda ko'rsatilgan balandlik 15–20 sm ga noto'g'ri, odatda shaxdam qadamda oyoq uchi 5–10 sm ga ko'tariladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Yurish amallari","subtopic":"Ortga burilish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Matnda ortga burilish amali tavsifi","requires_image":false,"question":"Ortga burilish komandasi bajarilganda qaysi oyoq birinchi bosiladi?","options":{"A":"o'ng oyoq orqaga bosilishi bilan","B":"ikkala oyoq bir vaqtga","C":"chap oyoq yerga bosilishi bilan","D":"o'ng oyoq yerga bosilishi bilan"},"answer":"D","explanation":"Ortga burilishda ijro komandasi o'ng oyoq yerga bosilishi bilan beriladi, keyin chap oyoq bilan harakat davom etadi.","mnemonic":"Ortga bos, o'ng bos","id":844,"_sabab":"Ortga burilishda birinchi bosiladigan oyoq odatda chap oyoq bo'ladi, berilgan javob noto'g'ri","_manual":false},{"subject":"Harbiy ta'lim","topic":"Yurish amallari","subtopic":"Burilish usullari","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"single","source_construct":"Matnda burilish amallarida qo'l harakati tavsifi","requires_image":false,"question":"Burilish paytida qo'l harakati qanday vazifani bajaradi?","options":{"A":"yurish tezligini oshiradi","B":"qadam vaznida bajariladi","C":"o'tkir harakatni bloklaydi","D":"faqat uyquda qo'llaniladi"},"answer":"B","explanation":"Aytilganidek, burilish amallarida qo'l harakati qadam vaznida bajariladi, bu harakatni muvozanatlaydi.","mnemonic":"Qo'l bilan qadam, muvozanat","id":846,"_sabab":"javob noto'g'ri, boshqa variant to'g'riroq","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy salom","subtopic":"Boshliqga qarab qo'l tushirish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Boshliq yonidan o'tishda qo'l tushirish qoidalari","requires_image":false,"question":"Boshliq (katta) yonidan o'tayotganda qo'lni qachon tushirish kerak?","options":{"A":"Har bir qadamdan keyin darhol","B":"Faqat to'xtashda","C":"Chap oyoq bilan qadam bosish barobarida","D":"Yurish davomida hech qachon"},"answer":"C","explanation":"Chap oyoq bilan qadam bosish barobarida qo'l tushiriladi.","mnemonic":"Qadam bos, qo'l tush","id":856,"_sabab":"Berilgan javob C noto‘g‘ri, to‘g‘ri javob A (har bir qadamdan keyin darhol)","_manual":false},{"subject":"Harbiy ta'lim","topic":"Harbiy salom","subtopic":"Safga qaytish komandasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safga qaytish komandasi matni","requires_image":false,"question":"‘Oddiy askar To‘rayev, OLDIMGA (Oldimga YUGURING)!’ komandasi safga qaytishga qanday ta'sir qiladi?","options":{"A":"Safdan chiqishni bekor qiladi","B":"Boshliqga salom berishni buyuradi","C":"Qadamni orqaga olishni ta'minlaydi","D":"Safga qaytish uchun yugurishni buyuradi"},"answer":"D","explanation":"Komanda safga qaytish, ya'ni oldinga yugurish talabi bilan bog'liq.","mnemonic":"OLDIMGA – safga yugur","id":859,"_sabab":"Berilgan javob D noto‘g‘ri, komandasi safga qaytishni buyuradi, to‘g‘ri javob A","_manual":false},{"subject":"Harbiy ta'lim","topic":"Saf amallari","subtopic":"Safdan chiqish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safdan chiqish va safga qaytish amallarini bajarish tartibi","requires_image":false,"question":"Askar safdan chiqqanda birinchi qadamda nima qiladi?","options":{"A":"O'ng qo'lini pastga tushiradi","B":"Chap qo'lini pastga tushiradi","C":"Chap qo'lini bosh kiyimga (chakkaga) keltiradi","D":"O'ng qo'lini bosh kiyimga (chakkaga) keltiradi"},"answer":"C","explanation":"Safdan chiqqanda harbiy xizmatchi avval chap qo'lini bosh kiyimga (chakkaga) keltiradi, bu rasmiy chiqish harakati hisoblanadi.","mnemonic":"Chiqqanida chapga chakka","id":866,"_sabab":"Javob aniq emas, harbiy amaliyotda birinchi harakat odatda o'ng qo'lini bosh kiyimga keltirish bo'ladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Saf amallari","subtopic":"Safga qaytish","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Safdan chiqish va safga qaytish amallarini bajarish tartibi","requires_image":false,"question":"Safga qaytish paytida askar qanday harakat qiladi?","options":{"A":"O'ng qo'lini bosh kiyimga (chakkaga) keltiradi","B":"Ikki qo'lini ham bosh kiyimga keltiradi","C":"Qo'lini har qanday holatda qoldiradi","D":"Chap qo'lini bosh kiyimga (chakkaga) keltiradi"},"answer":"A","explanation":"Safga qaytish paytida rasmiy tarzda o'ng qo'lini bosh kiyimga (chakkaga) ko'tarish talab qilinadi.","mnemonic":"Qaytishda o'ngga chakka","id":867,"_sabab":"Safga qayti false},{"subject":"Harbiy ta'lim","topic":"Gazniqoblar","subtopic":"Kiyish tartibi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gazniqobni to'g'ri kiyish tartibi – ... gazniqobning pastki qismi iyakka qo'yilib, qo'l tepaga va orqaga siltab tortiladi hamda gazniqob buklanib qolmaydigan qilib boshga kiyiladi","requires_image":false,"question":"Gazniqobni kiygandan keyin quyidagilardan qaysi biri birinchi bajarilishi kerak?","options":{"A":"Bosh kiyimini qayta tiklash","B":"Kichik nafas chiqarish va ko'z ochish","C":"Yuz qismini tasmalarga ushlash","D":"Pastki qismini iyakka qo'yish"},"answer":"B","explanation":"Kiyish jarayonida oxirgi bosqichdan oldin, gazniqob kiyilgandan so'ng, keskin va chuqur nafas chiqarib, ko'z ochiladi – bu havodagi zaharli moddalarni chiqarish uchun zarur. B va C bosqichlari kiyishning oldingi qismida amalga oshiriladi, D kiyishdan keyin bajariladi.","mnemonic":"Kiygandan keyin nafas, ko'z, gaz chiqadi.","id":938,"_sabab":"B javob gaz niqob kiyilgandan keyin birinchi bajariladigan amallar ro‘yxatiga mos kelmaydi; odatda birinchi bosqich maskaning o‘rnatilishini tekshirish bo‘ladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Gazniqoblar","subtopic":"Materiallar","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"iqobning tuzilishi: 3) matoli gilof; 13) matoli gilof","requires_image":false,"question":"Gazniqob tuzilishida qaysi element ikki marta takrorlangan?","options":{"A":"Nafas olish klapani uzeli","B":"Matoli gilof","C":"Filtr quti","D":"So'zlashish moslamasi"},"answer":"B","explanation":"3‑va 13‑elementlar sifatida matoli gilof qayta keltirilgan, boshqa elementlar bitta marta ko'rsatilgan.","mnemonic":"Gilof ikki marta – matoli gilof.","id":939,"_sabab":"Matoli gilof ikki marta takrorlanadi degan da'vo aniq emas, boshqa elementlar (masalan, filtr) takrorlanishi mumkin","_manual":false},{"subject":"Harbiy ta'lim","topic":"Himoya vositalari","subtopic":"Himoya paypoqla al birinchi o'lcham emas","_manual":false},{"subject":"Harbiy ta'lim","topic":"Himoya vositalari","subtopic":"Gazniqob","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Gazniqob \"jangovar\" holatga keltiriladi, avval qo'lqoplar, so'ng plash kiyiladi","requires_image":false,"question":"Gazniqob \"jangovar\" holatga keltirilganda birinchi nima kiyiladi?","options":{"A":"Qo'lqop","B":"Kombinezon","C":"Mikrofon","D":"Plash"},"answer":"A","explanation":"Gazniqob jangovar holatiga avval qo'lqoplar kiyiladi, keyin plash va boshga plash qalpog'i kiyiladi deb aytiladi.","mnemonic":"Jangovar – qo'lqop birinchi.","id":955,"_sabab":"Gazniqob jangovar holatida avval maska, keyin qo'lqop kiyiladi","_manual":false},{"subject":"Harbiy ta'lim","topic":"Himoya vositalari","subtopic":"Himoya to'plami ko'rinishlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Himoya to'plamidan plash yoki kombinezon ko'rinishida foydalanish mumkinligi","requires_image":false,"question":"Himoya to'plami qanday ikki asosiy ko'rinishda bo'lishi mumkin?","options":{"A":"Shapka va qo'lqop","B":"Yassi va yumaloq","C":"Plash va kombinezon","D":"Qattiq va yumshoq"},"answer":"C","explanation":"Himoya to'plami plash yoki kombinezon ko'rinishida bo'lishi mumkinligi aniq aytilgan.","mnemonic":"Plash yoki kombinezon – ikki yo'l.","id":956,"_sabab":"To'g'ri javob 'D' (qattiq va yumshoq) bo'lishi kerak, berilgan javob noto'g'ri","_manual":false},{"subject":"Harbiy ta'lim","topic":"Qurol qismlari","subtopic":"Qurolning uchi","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"Qurolning uchi (tormoz‑kompensator) tasviri: 1) uchki qismi; 2) tuynuklari; 3) yorma; 4) so‘ndiruvchi tirqishlar; 5) biriktirgich uchun kesma; 6) aylanasiga bukilgan qismi; 7) ichki rezba.","requires_image":false,"question":"Qurolning uchki qismi qaysi raqamda tasvirlangan?","options":{"A":"5","B":"7","C":"1","D":"3"},"answer":"C","explanation":"Rasmdagi t _image":false,"question":"Qaytarish mexanizmini ajratishdan keyin qaysi detal ajratiladi?","options":{"A":"Zatvorni zatvor ramasidan ajratish","B":"Penal sug‘urib olish","C":"Stvol qutisining qopqog‘ini ajratish","D":"Gaz trubkasini ajratish"},"answer":"A","explanation":"Qaytarish mexanizmi ajratilgandan so‘ng zatvorni zatvor ramasidan ajratish keltirilgan. B‑stvol qopqog‘i avvalgi bosqich, C‑gaz trubkasi keyingi, D‑penal birinchi.","mnemonic":"Qaytarishdan zatvor, keyin qopqoq","id":986,"_sabab":"Javob noto‘g‘ri; qaytarish mexanizmi ajratilgandan keyin odatda gaz trubkasi ajratiladi, zatvorni zatvor ramasidan ajratish keyingi bosqichda bo‘ladi.","_manual":false},{"subject":"Harbiy ta'lim","topic":"AK-74 avtomati","subtopic":"Disassembly bosqichlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"AK-74 avtomatini noto‘liq qismlarga ajratish ketma‑ketligi","requires_image":false,"question":"Stvolning uchki tormoz (kompensator) ajratilishi qaysi bosqichga tegishli?","options":{"A":"Penal sug‘urib olishdan keyin","B":"Gaz trubkasini ajratishdan oldin","C":"Zatvor ramasi ajratilgandan keyin","D":"Shompol ajratilgandan keyin"},"answer":"A","explanation":"Stvolning uchki tormoz ajratilishi penal sug‘urib olishdan keyin tasvirlangan. B‑gaz trubkasi keyingi bosqich, C‑zatvor ramasi avvalgi, D‑shompol avvalroq.","mnemonic":"Penaldan keyin kompensator","id":987,"_sabab":"Javob noto‘g‘ri; stvolning uchki tormoz (kompensator) odatda gaz trubkasini ajratishdan oldin ajratiladi, penal sug‘urib olishdan keyin emas.","_manual":false},{"subject":"Harbiy ta'lim","topic":"Granata turlari","subtopic":"RGD‑5 granata komponentlari","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"RGD‑5 qo'l granatasining tuzilishi va vazifasi","requires_image":false,"question":"RGD‑5 granatasining zarbdor mexanizmi qaysi raqamga mos keladi?","options":{"A":"7","B":"1","C":"4","D":"10"},"answer":"B","explanation":"1‑zarbdor mexanizmning trubkas  markaz, o'ng va chap qanotdan voz kechib, qo‘shini 7 ta qo‘lga taqsimlaganligi ko‘rsatilgan. Boshqa variantlar tasvirlanmagan.","mnemonic":"Temur – 7 qo‘l.","id":1025,"_sabab":"Javobda faktik xato: Amir Temurning 1391‑yildagi jangida qo‘shini 7 ta qo‘lga bo‘lishi tarixiy manbalarda tasdiqlanmagan","_manual":false},{"subject":"Harbiy ta'lim","topic":"Amir Temur","subtopic":"Jang taktikasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"single","source_construct":"Temur jangida o‘qdan tushib, kamondan o‘q uzish usulini qo‘llagan","requires_image":false,"question":"Terek daryosi jangida Amir Temur qo‘shini qanday yangi usul bilan harakatga qo‘shgan?","options":{"A":"Suv osti yurishini qo‘llash","B":"Kengaytirilgan topga otish","C":"O‘qdan tushish va kamondan o‘q uzish","D":"Artileriya qoplamasini oshirish"},"answer":"C","explanation":"Amir Temur o‘qdan tushib, kamondan o‘q uzish usulini birinchi marta qo‘llaganligi qayd etilgan. Boshqa usullar matnda yo‘q.","mnemonic":"O‘q‑kamon – yangi harakat.","id":1026,"_sabab":"Tarixiy manbalarda Amir Temur tomonidan Terek daryosi jangida keltirilgan usul tasdiqlanmagan","_manual":false},{"subject":"Harbiy ta'lim","topic":"Jaloliddin Manguberdi","subtopic":"Jang taktikasi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"Manguberdi taktikalarida: 1) shiddat bilan harakat, 2) yirik kuchlarni jamlash, 3) to'satdan zarba, 4) tez natija olish","requires_image":false,"question":"Jaloliddin Manguberdi taktikalarini to‘g‘ri ketma‑ketlikda joylang:\n1. Shiddat bilan harakat\n2. Yirik kuchlarni jamlash\n3. To'satdan zarba berish\n4. Tez natija olish","options":{"A":"1, 2, 3, 4","B":"3, 1, 2, 4","C":"1, 3, 2, 4","D":"2, 1, 3, 4"},"answer":"A","explanation":"Manguberdi tamoyillari birinchi bosqichda shiddat bilan harakat, keyin yirik kuchlarni jamlash, to'satdan zarba, oxirida tez natija olishni belgilaydi. Shuning uchun 1‑2‑3‑4 to‘g‘ri.","mnemonic":"Shiddat → Yirik → To'satdan → Tez.","id":1027,"_sabab oom_level":"Qo'llash","qtype":"single","source_construct":"Manguberdi har qanday harakatda to'xtalmas natijaga erishish kerakligini ta'kidlaydi","requires_image":false,"question":"Manguberdi g'alabaga erishish uchun har qanday harakatda qanday natijaga erishish kerak?","options":{"A":"To'xtalmas natija","B":"Uzoq muddatli qayta qurish","C":"Keng tarqatilgan himoya","D":"Yuqori darajadagi qayta aloqa"},"answer":"A","explanation":"To'xtalmas natijaga erishish tamoyili qat'iy ta'kidlangan.","mnemonic":"To'xtalmas – g'alaba","id":1044,"_sabab":"Javobning to'g'riligi aniq emas, faktik ma'lumot yo'q","_manual":false},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Huquqiy asoslar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 20-21-§: FM qonuni 2000-yil 26-may; VM 369-son qarori 2017-yil 9-iyun; FV qonuni 2022-yil 17-avgust","requires_image":false,"question":"Fuqaro muhofazasi sohasidagi hujjatlarni qabul qilingan sanasi bilan moslashtiring:\n1. \"Fuqaro muhofazasi to'g'risida\"gi Qonun\n2. Fuqaro muhofazasi tuzilmalari to'g'risidagi 369-son hukumat qarori\n3. \"Aholini va hududlarni tabiiy hamda texnogen xususiyatli favqulodda vaziyatlardan muhofaza qilish to'g'risida\"gi Qonun\nA. 2017-yil 9-iyun\nB. 2000-yil 26-may\nC. 2022-yil 17-avgust","options":{"A":"1-B, 2-A, 3-C","B":"1-A, 2-B, 3-C","C":"1-C, 2-A, 3-B","D":"1-B, 2-C, 3-A"},"answer":"A","explanation":"\"Fuqaro muhofazasi to'g'risida\"gi Qonun 2000-yil 26-mayda qabul qilingan. Tuzilmalarni belgilash va tabellashtirish tartibi to'g'risidagi 369-son qaror Vazirlar Mahkamasi tomonidan 2017-yil 9-iyunda chiqarilgan. Aholini va hududlarni favqulodda vaziyatlardan muhofaza qilish to'g'risidagi qonun esa 2022-yil 17-avgustda tasdiqlangan.","mnemonic":"FM 2000-da tug'ildi, tuzilma 2017-da, FV qonuni 2022-da.","id":1045,"_sabab":"Moslashtirish juftliklari noto'g'ri, faktik sanalar mos kelmaydi","_manual":true},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: sherenga, kolonna, qator, front tushunchalari","requires_image":false,"question":"Saf tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Sherenga\n2. Kolonna\n3. Qator\n4. Front\nA. Harbiy xizmatchilarning belgilangan distansiyada bir-birining ortida joylashuvi\nB. Safning harbiy xizmatchilar yuzlanib turgan tomoni\nC. Harbiy xizmatchilarning bir chiziqda, intervalni saqlab yonma-yon turgan safi\nD. Ikki nafar harbiy xizmatchining ikki sherengali safda ketma-ket turgan holati","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-B, 2-A, 3-C, 4-D","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"Sherenga — bir chiziqda yonma-yon turgan saf, kolonna esa bir-birining ortida joylashuv. Qator deb ikki sherengali safda ketma-ket turgan ikki harbiy xizmatchiga aytiladi. Front — safning harbiy xizmatchilar yuzlanib turgan tomoni, unga qarama-qarshi tomon saf orti deyiladi.","mnemonic":"Sherenga — yonma-yon, kolonna — ketma-ket, qator — juftlik, front — yuz.","id":1102,"_sabab":"Berilgan javob mos kelmaydi, to'g'ri juftlik variantlar orasida yo'q","_manual":true},{"subject":"CHQBT","topic":"Saf tayyorgarligi","subtopic":"Saf elementlari","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 9-§: interval, distansiya, saf eni, saf uzunligi ta'riflari","requires_image":false,"question":"Safdagi masofa tushunchalarini ularning ta'rifi bilan moslashtiring:\n1. Interval\n2. Distansiya\n3. Saf eni\n4. Saf uzunligi\nA. Saf uzunligi bo'ylab harbiy xizmatchilar o'rtasidagi masofa\nB. Birinchi sherenga bilan oxirgi sherenga o'rtasidagi masofa\nC. Front bo'ylab harbiy xizmatchilar o'rtasidagi masofa\nD. Qanotlar o'rtasidagi masofa","options":{"A":"1-C, 2-D, 3-A, 4-B","B":"1-A, 2-C, 3-D, 4-B","C":"1-D, 2-B, 3-C, 4-A","D":"1-C, 2-A, 3-D, 4-B"},"answer":"D","explanation":"Interval front bo'ylab, distansiya esa saf uzunligi bo'ylab o'lchanadigan masofa. Saf eni qanotlar o'rtasidagi, saf uzunligi esa birinchi sherenga bilan oxirgi sherenga (oldinda va ortda turgan harbiy xizmatchilar) o'rtasidagi masofani bildiradi.","mnemonic":"Interval — eniga, distansiya — bo'yiga.","id":1103,"_sabab":"Berilgan javob mos kelmaydi, to'g'ri juftlik variantlar orasida yo'q","_manual":true},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Jangovar texnika","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"10-sinf, 36-§: BTR-80 desant 8, BMP-2 desant 7, T-72 og'irligi 44000 kg","requires_image":false,"question":"Jangovar texnikalarning ko'rsatkichlarini qiymatlari bilan moslashtiring:\n1. BTR-80 desanti\n2. BMP-2 desanti\n3. T-72 tankining og'irligi\nA. 7 kishi\nB. 44000 kg\nC. 8 kishi","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"BTR-80 ekipaji 3 kishidan iborat bo'lib, 8 kishilik desantni tashiydi. BMP-2 da ham ekipaj 3 kishi (komandir, operator, mexanik-haydovchi), desanti esa 7 kishi. T-72 tankining og'irligi 44000 kg, ekipaji 3 kishidan iborat va desant tashimaydi.","mnemonic":"BTR — 8, BMP — 7, tank — desantsiz 44 tonna.","id":1130,"_sabab":"Berilgan javob desant sonlarini noto'g'ri moslashtirgan (BTR‑80 desanti 7 kishi, BMP‑2 desanti 7 kishi, 8 kishi degan variant noto'g'ri)","_manual":true},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mo'ljal olish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"10-sinf, 40-§: Qutb yulduzi yordamida shimolni topish tartibi","requires_image":false,"question":"Qutb yulduzi yordamida shimolni topish harakatlarini to'g'ri tartiblang:\n1. Ikki yulduz orasidagi masofaning besh barobarida Qutb yulduzini topish\n2. Katta Ayiq turkumi \"cho'mich\"i chekkasidagi ikki yulduzni topish\n3. Yuzlangan tomon shimol ekanini belgilab, qolgan tomonlarni aniqlash\n4. Shu ikki yulduzdan tepaga qarata to'g'ri chiziq o'tkazish","options":{"A":"2, 4, 3, 1","B":"2, 1, 4, 3","C":"4, 2, 1, 3","D":"2, 4, 1, 3"},"answer":"D","explanation":"Avval Katta Ayiq turkumidagi \"cho'mich\" chekkasida joylashgan ikki yulduz topiladi. Ulardan tepaga qarata to'g'ri chiziq o'tkaziladi — chiziq ikki yulduz orasidagi masofaning taxminan besh barobariga yetganda Qutb yulduzi ko'rinadi. Qutb yulduzi hamisha shimolda joylashgani uchun kuzatuv tomoni shimol, chap tomon g'arb, o'ng tomon sharq bo'ladi.","mnemonic":"Cho'mich — chiziq — besh barobar — shimol.","id":1142,"_sabab":"Berilgan tartib mantiqiy izohga mos kelmaydi","_manual":true},{"subject":"CHQBT","topic":"Otish tayyorgarligi","subtopic":"Otish hodisasi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 43-§: o'q uzishning to'rt bosqichi ta'riflari","requires_image":false,"question":"O'q uzish bosqichlarini ularning mazmuni bilan moslashtiring:\n1. Dastlabki bosqich\n2. Birinchi (asosiy) bosqich\n3. Ikkinchi bosqich\n4. Uchinchi bosqich\nA. O'q harakati boshlanganidan porox zaryadi to'liq yonib bitgunga qadar\nB. O'q stvoldan uchib chiqqanidan porox gazlari ta'siri tugagunga qadar\nC. Porox yonishi boshlanganidan o'q qobig'i stvol kesiklariga to'liq urilgunga qadar\nD. Porox to'liq yonib bo'lganidan o'q stvol kanalidan uchib chiqquniga qadar","options":{"A":"1-B, 2-A, 3-D, 4-C","B":"1-C, 2-D, 3-A, 4-B","C":"1-C, 2-A, 3-D, 4-B","D":"1-A, 2-C, 3-D, 4-B"},"answer":"C","explanation":"Dastlabki bosqich porox yonishidan o'q qobig'i kesiklarga to'liq urilguncha davom etadi. Birinchi (asosiy) bosqichda o'q harakatlanib, porox to'liq yonib bitadi va bosim maksimal qiymatga yetadi. Ikkinchi bosqich porox yonib bo'lganidan o'q stvoldan chiqquncha, uchinchi bosqich esa o'q chiqqanidan gazlar ta'siri havo qarshiligi bilan tenglashguncha davom etadi.","mnemonic":"Siljish — yonish — chiqish — gaz quvishi.","id":1143,"_sabab":"Javob variantlari tavsifga mos kelmaydi","_manual":true},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Mudofaadagi harakatlar","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 50-§: dushman o't ochib turganda bir kishilik okop qazish bosqichlari","requires_image":false,"question":"Dushman o't ochib turganda bir kishilik okop qazish bosqichlarini to'g'ri tartiblang:\n1. Yonboshlab kurakni g'ilofdan chiqarib, chim yoki yerning ustki qismini o'yish\n2. Yotib olgan holda avtomatni o'ng tomonga, stvolini dushman tomonga qaratib qo'yish\n3. Chim va tuproqni ko'chirib oldinga qo'yib, chuqurni kavlash","options":{"A":"2, 3, 1","B":"2, 1, 3","C":"3, 1, 2","D":"1, 2, 3"},"answer":"B","explanation":"Askar avval tanlangan joyga yotib, avtomatini qo'l uzatsa yetadigan masofada o'ng tomonga, stvolini dushman tomonga qaratib qo'yadi. So'ng chap tomonga yonboshlab kurakni g'ilofdan chiqaradi va chim yoki yerning ustki qismini o'yib, chuqur chegaralarini belgilaydi. Shundan keyin chim-tuproqni ko'chirib oldinga qo'yadi va chuqurni kavlashga tushadi — oldindagi tuproq brustver vazifasini bajaradi.","mnemonic":"Qurol yoningda — kurak qo'lingda — tuproq oldinda.","id":1157,"_sabab":"incorrect sequence; correct answer is D","_manual":true},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Hujumdagi harakatlar","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 51-§: emaklash, yerga yopishib emaklash va yonboshlab emaklash qo'llanadigan holatlar","requires_image":false,"question":"Emaklash usullarini ular qo'llanadigan vaziyat bilan moslashtiring:\n1. Tizza va tirsaklarda emaklash\n2. Yerga yopishib emaklash\n3. Yonboshlab emaklash\nA. Panaliklari yo'q uchastkalarda, bosh yuqoriga ko'tarilmaydi\nB. Qorda, qumli joylarda, pulemyot sudrashda va yaradorlarni olib chiqishda\nC. Pana joyi oz uchastkalarda, sayoz ariqlar va chuqur bo'lmagan daralarda","options":{"A":"1-A, 2-C, 3-B","B":"1-C, 2-B, 3-A","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Oddiy emaklash (tizza va tirsaklarda) pana joyi oz, kam niqoblangan uchastkalar, sayoz ariqlar va daralarda qo'llanadi. Yerga yopishib emaklash panaliklari yo'q ochiq joylarda ishlatiladi — bunda to'liq yotib olinadi va bosh yuqoriga ko'tarilmaydi. Yonboshlab emaklash esa qorda, qumli joylarda, pulemyotni sudrab ketishda, o'q-dori va yaradorlarni olib chiqishda qo'l keladi.","mnemonic":"Tizzada — pana ozda, yopishib — ochiqda, yonboshlab — yuk bilan.","id":1158,"_sabab":"incorrect matching; correct answer is A","_manual":true},{"subject":"CHQBT","topic":"Taktik tayyorgarlik","subtopic":"Yadroviy qurol","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 53-§: portlash turlari — havoda, yerusti/yerosti, suv usti/osti oqibatlari","requires_image":false,"question":"Yadro portlash turlarini ularning zararlash xususiyati bilan moslashtiring:\n1. Havoda portlash\n2. Yerusti va yerosti portlashlari\n3. Suv yuzasi va suv ostida portlash\nA. Radioaktiv bulut yo'nalishi bo'ylab keng maydonlarning zararlanishi\nB. Yaqin atrofdagi kemalar, portlar va qirg'oq qurilmalarining kuchli zararlanishi\nC. Asosan portlash sodir bo'lgan hududning o'zida uncha katta bo'lmagan zararlanish","options":{"A":"1-C, 2-B, 3-A","B":"1-A, 2-C, 3-B","C":"1-B, 2-A, 3-C","D":"1-C, 2-A, 3-B"},"answer":"D","explanation":"Havoda portlashda radioaktiv zararlanish xavfi asosan portlash hududining o'zida bo'lib, markazga yaqinlashgan sari ortadi. Yerusti va yerosti portlashlari radioaktiv bulut yo'nalishi bo'ylab keng maydonlarni zararlaydi. Suv yuzasi va suv ostidagi portlash esa yaqin kemalar, portlar, harbiy dengiz bazalari va qirg'oq qurilmalarini kuchli zararlaydi.","mnemonic":"Havoda — tor, yerda — keng, suvda — qirg'oqqa zarba.","id":1166,"_sabab":"Berilgan javob D yadro portlash turlarini noto'g'ri moslashtiradi; havoda portlash keng radioaktiv bulutga, yerosti portlash keng maydonlarga, suvda portlash esa yaqin kemalarga zarar beradi.","_manual":true},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Tayanch-harakat apparati shikastlanishi","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 36-§: tayanch-harakat apparati shikastida birinchi yordam qoidalari va man etilgan harakatlar","requires_image":false,"question":"Tayanch-harakat apparati shikastlanganda qilinadigan va man etilgan harakatlarni moslashtiring:\n1. Harakatsizlantirish\n2. Sovuq narsa qo'yish\n3. Chiqib turgan suyakni joyiga solish\n4. Qiyshiq a'zoni to'g'rilash\nA. Man etiladi, asoratga olib keladi\nB. To'g'ri yordam, shish va og'riqni kamaytiradi\nC. Man etiladi, qo'shimcha shikast yetkazadi\nD. To'g'ri yordam, jarohatning yuqori va pastidagi bo'g'inni qotirish","options":{"A":"1-A, 2-B, 3-C, 4-D","B":"1-C, 2-D, 3-A, 4-B","C":"1-D, 2-B, 3-C, 4-A","D":"1-B, 2-A, 3-D, 4-C"},"answer":"C","explanation":"To'g'ri yordam — shikastlangan joyni harakatsizlantirish va jarohatning ikki tomonidagi bo'g'inni qotirish hamda sovuq narsa qo'yib shishni kamaytirish. Chiqib turgan suyakni joyiga solishga yoki qiyshiq a'zoni to'g'rilashga urinish man etiladi, chunki bu qo'shimcha shikast va asoratga olib keladi.","mnemonic":"Harakatsizlantir va sovit — solma, to'g'rilama.","id":1172,"_sabab":"Berilgan javob variantlari savoldagi to'g'ri moslikni ta'minlamaydi","_manual":true},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Qo'l-oyoqqa bog'lam qo'yish","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 37-§: qo'lqopsimon bog'lamda chap va o'ng qo'lni qaysi barmoqdan boshlash","requires_image":false,"question":"Qo'lqopsimon bog'lamda chap qo'lni bintlash qaysi barmoqdan boshlanadi?","options":{"A":"Jimjiloqdan","B":"Bosh barmoqdan","C":"Ko'rsatkich barmoqdan","D":"O'rta barmoqdan"},"answer":"A","explanation":"Qo'lqopsimon bog'lamda bintlashni qulaylashtirish maqsadida chap qo'lni jimjiloqdan, o'ng qo'lni esa bosh barmoqdan boshlash kerak. Har bir barmoq alohida bintlanib, qo'lqop shaklida butun panja o'raladi.","mnemonic":"Chap — jimjiloqdan, o'ng — bosh barmoqdan.","id":1176,"_sabab":"Berilgan javob (A) jimjiloqdan boshlash aniq emas; odatda qo'lqopni bosh barmoqdan boshlash tavsiya etiladi.","_manual":true},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Umurtqa shikastlanishi","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 38-§: bo'yin umurtqasi shikastlanishida birinchi yordam tartibi","requires_image":false,"question":"Bo'yin umurtqasi shikastlanishida birinchi yordam bosqichlarini to'g'ri tartibda joylashtiring:\n1. Bemorni tekis va qattiq yuzaga yotqizish\n2. Bo'yinga ortopedik shina yoki yostiq qo'yib harakatni cheklash\n3. Tez tibbiy yordamni chaqirib shifoxonaga yetkazish","options":{"A":"1, 2, 3","B":"3, 2, 1","C":"2, 3, 1","D":"2, 1, 3"},"answer":"D","explanation":"Avval bo'yinni harakatsizlantirish uchun ortopedik shina yoki yostiq qo'yiladi. So'ng bemor tekis va qattiq yuzaga yotqiziladi, bo'yinni ko'tarish yoki egishdan saqlaniladi. Keyin Tez tibbiy yordam chaqirilib bemor shifoxonaga yetkaziladi.","mnemonic":"Avval qot, keyin yotqiz, oxirida chaqir.","id":1177,"_sabab":"To'g'ri tartib 1-2-3 (A), berilgan javob D noto'g'ri.","_manual":true},{"subject":"CHQBT","topic":"Tibbiy bilim asoslari","subtopic":"Zaharlanish","difficulty":"Y3","bloom_level":"Mulohaza","qtype":"sequence","source_construct":"11-sinf, 41-§: is gazidan zaharlanishda birinchi yordam tartibi","requires_image":false,"question":"Is gazidan zaharlanishda birinchi yordam bosqichlarini to'g'ri tartibda joylashtiring:\n1. Nafas olishini tekshirib, nafas olayotgan bo'lsa qulay yotqizish\n2. Jabrlanuvchini xavfli hududdan toza havoga olib chiqish\n3. Tez tibbiy yordamni chaqirish\n4. Nafas olmasa, sun'iy nafas va yurak massajini boshlash","options":{"A":"2, 4, 1, 3","B":"2, 1, 4, 3","C":"1, 2, 4, 3","D":"3, 2, 1, 4"},"answer":"B","explanation":"Avval jabrlanuvchini xavfli hududdan toza havoga olib chiqib, gaz manbayini o'chirish kerak. So'ng nafas olishi tekshiriladi va nafas olayotgan bo'lsa qulay yotqiziladi. Nafas olmasa darhol sun'iy nafas va yurak massaji boshlanadi. Bemor o'zini yaxshi his qilsa ham Tez tibbiy yordam chaqiriladi, chunki ta'sir kechikishi mumkin.","mnemonic":"Chiqar, tekshir, jonlantir, chaqir.","id":1183,"_sabab":"Javobda chaqiriq (3) bosqichi noto'g'ri joylashgan; tibbiy yordamni chaqirish birinchi bosqich bo'lishi kerak.","_manual":true},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal sovuq","difficulty":"Y2","bloom_level":"Qo'llash","qtype":"matching","source_construct":"11-sinf, 26-§: muzlashda tana harorati bilan bog'liq xavfli chegaralar 32°C va 27°C","requires_image":false,"question":"Muzlashda tana harorati chegaralarini ularning oqibati bilan moslashtiring:\n1. 32°C dan past\n2. 27°C\nA. Koma holatiga olib kelishi mumkin\nB. Yurak va nafas tizimlari faoliyati buziladi","options":{"A":"1-A, 2-A","B":"1-B, 2-A","C":"1-B, 2-B","D":"1-A, 2-B"},"answer":"B","explanation":"Tana harorati 32°C dan past darajada yurak va nafas tizimlari faoliyati buziladi. Harorat 27°C darajaga tushganda esa koma holatiga olib kelishi mumkin. Muzlash holatida inson har doim o'z ahvolini to'g'ri baholay olmaydi.","mnemonic":"32 — yurak buziladi, 27 — koma.","id":1193,"_sabab":"Javob variantlari teskari; 32 °C dan past harorat cardio‑nafas tizimiga, 27 °C da koma holati keltiradi","_manual":true},{"subject":"CHQBT","topic":"Fuqaro muhofazasi","subtopic":"Anomal issiq","difficulty":"Y1","bloom_level":"Bilish","qtype":"single","source_construct":"11-sinf, 26-§: inson tanasi tarkibidagi suyuqlik ulushi va qontomir normal harorati","requires_image":false,"question":"Inson tanasining necha foizdan ko'p qismi suyuqlikdan iborat?","options":{"A":"50% dan ko'prog'i","B":"70% dan ko'prog'i","C":"90% dan ko'prog'i","D":"30% dan ko'prog'i"},"answer":"B","explanation":"Inson tanasining 70 foizdan ko'proq qismi suyuqlikdan iborat. Qontomir tizimi 36,6°C haroratda normal ishlab, hujayralarni oziqlantiradi va kislorod bilan ta'minlaydi. Shu sababli anomal issiqda ko'p suyuqlik ichish muhim.","mnemonic":"Tananing yetmish foizi — suyuqlik.","id":1196,"_sabab":"Belgilangan javob noto'g'ri; inson tanasining suyuqlik tarkibi taxminan 60% ga yaqin, 70% emas","_manual":true}];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const del=new Set();
let filt="all";
const list=document.getElementById("list");
function visible(){return DATA.filter(q=>filt==="all"||(filt==="manual"&&q._manual)||(filt==="machine"&&!q._manual)||(filt==="del"&&del.has(q.id)));}
function render(){
 list.innerHTML="";
 for(const q of visible()){
  const c=document.createElement("div");
  c.className="card"+(q._manual?" manual":"")+(del.has(q.id)?" del":"");
  let opts=""; for(const k of ["A","B","C","D"]) opts+='<div class="opt '+(k===q.answer?"ok":"")+'">'+k+") "+esc(q.options[k])+"</div>";
  c.innerHTML='<span class="idtag">id '+q.id+(q._manual?' · qo\'lda':' · LLM')+'</span>'
   +'<div><span class="tag '+(["matching","sequence"].includes(q.qtype)?"m":"")+'">'+esc(q.qtype)+'</span><span class="tag">'+esc(q.difficulty||"")+'</span><span class="tag">'+esc((q.topic||"").slice(0,40))+"</span></div>"
   +'<div class="q">'+esc(q.question)+"</div>"+opts
   +'<div class="exp">💡 '+esc(q.explanation||"")+"</div>"
   +'<div class="hakam">⚖️ Hakam: '+esc(q._sabab)+"</div>"
   +'<label class="del-lbl"><input type="checkbox" '+(del.has(q.id)?"checked":"")+' data-id="'+q.id+'"> Bu savolni o\'chirish</label>';
  c.querySelector("input").addEventListener("change",e=>{
    const id=+e.target.dataset.id;
    if(e.target.checked)del.add(id);else del.delete(id);
    c.classList.toggle("del",e.target.checked);
    updMeta();
  });
  list.appendChild(c);
 }
}
function updMeta(){document.getElementById("meta").textContent="Jami SHUBHALI: "+DATA.length+" | Qo'lda yozilgan: "+DATA.filter(q=>q._manual).length+" | O'chirishga belgilangan: "+del.size;}
document.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("act"));
  b.classList.add("act");filt=b.dataset.f;render();
}));
document.getElementById("genBtn").addEventListener("click",()=>{
  const out=document.getElementById("out");
  out.style.display="block";
  out.value=[...del].sort((a,b)=>a-b).join(",");
  out.select();
});
document.getElementById("allDel").addEventListener("click",()=>{
  for(const q of visible())del.add(q.id);render();updMeta();
});
updMeta();render();
</script></body></html>
